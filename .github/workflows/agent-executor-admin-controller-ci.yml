name: Agent Executor Admin Controller CI/CD

on:
  push:
    branches: [main]
    paths:
      - scripts/agent-executor-admin-controller.mjs
      - scripts/test-agent-executor-admin-controller.mjs
      - deploy/agent-executor-admin-controller/**
  workflow_dispatch:

concurrency:
  group: agent-executor-admin-controller-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate restricted controller contract
        run: node scripts/test-agent-executor-admin-controller.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Add agent VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
      - name: Trust agent VPS
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H 163.245.202.80 >> ~/.ssh/known_hosts
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh root@163.245.202.80 'bash -s' < scripts/ensure-agent-vps-disk-space.sh
      - name: Install and validate controller
        run: |
          set -euo pipefail
          ssh root@163.245.202.80 'install -d /opt/marketing-hub/repo/deploy/agent-executor-admin-controller /opt/marketing-hub/repo/scripts'
          rsync -az --delete deploy/agent-executor-admin-controller/ root@163.245.202.80:/opt/marketing-hub/repo/deploy/agent-executor-admin-controller/
          scp scripts/agent-executor-admin-controller.mjs root@163.245.202.80:/opt/marketing-hub/repo/scripts/agent-executor-admin-controller.mjs
          ssh root@163.245.202.80 '
            set -euo pipefail
            systemctl disable --now marketinghub-agent-executor-admin.service 2>/dev/null || true
            cd /opt/marketing-hub/repo/deploy/agent-executor-admin-controller
            docker compose up -d --build --remove-orphans
            for attempt in $(seq 1 12); do
              status=$(docker inspect --format "{{.State.Status}}" agent-executor-admin-controller-agent-executor-admin-controller-1 2>/dev/null || true)
              [ "$status" = running ] && exit 0
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=150 agent-executor-admin-controller
            exit 1'
