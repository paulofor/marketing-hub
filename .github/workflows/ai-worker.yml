name: AI Worker CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'ai-worker/**'
      - '.github/workflows/ai-worker.yml'
  pull_request:
    paths:
      - 'ai-worker/**'
      - '.github/workflows/ai-worker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marketinghub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      TEST_DB_URL: jdbc:mysql://localhost:3306/marketinghub
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run architecture tests
        run: mvn -B -s settings.xml -Dtest='*ArchitectureTest,*ArquiteturaTest' test
      - name: Run tests
        run: mvn -B -s settings.xml test
      - name: Build
        run: mvn -B -s settings.xml package -DskipTests

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: latest
      IMAGE_SHA_TAG: ${{ github.sha }}
    outputs:
      image-tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/ai-worker
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_SHA_TAG }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ai-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/ai-worker:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/ai-worker:buildcache,mode=max
      - name: Expose image tag
        id: image_tag
        run: echo "value=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs:
      - test
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 191.252.120.96
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.AI_WORKER_REMOTE_PATH || '/root/ai-worker' }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ needs.docker.outputs['image-tag'] }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Prepare remote directory
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
      - name: Sync AI Worker stack to VPS
        run: |
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --exclude '.git/' \
            --exclude 'target/' \
            ai-worker/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Publish service
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && if [ -n '${GHCR_TOKEN}' ]; then echo '${GHCR_TOKEN}' | docker login ${IMAGE_REGISTRY} -u '${GHCR_USERNAME}' --password-stdin; fi \
            && export AI_WORKER_IMAGE='${IMAGE_NAMESPACE}/ai-worker:${IMAGE_TAG}' \
            && docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull \
            && docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --remove-orphans \
            && docker image prune -af"
      - name: Clean build artifacts from repository
        if: always()
        run: |
          git clean -ffdx -- ai-worker/target
