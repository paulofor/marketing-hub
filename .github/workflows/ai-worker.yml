name: AI Worker CI

on:
  push:
    paths:
      - 'ai-worker/**'
  pull_request:
    paths:
      - 'ai-worker/**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marketinghub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      TEST_DB_URL: jdbc:mysql://localhost:3306/marketinghub
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn -B -s settings.xml test
      - name: Build
        run: mvn -B -s settings.xml package
