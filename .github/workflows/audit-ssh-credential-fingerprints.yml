name: Audit deployment SSH public fingerprints
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/audit-ssh-credential-fingerprints.yml'
      - 'scripts/*ssh-credential-fingerprints.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ssh-credential-fingerprints.yml'
      - 'scripts/*ssh-credential-fingerprints.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B scripts/test-ssh-credential-fingerprints.py
  audit:
    needs: validate
    if: >-
      github.repository == 'paulofor/marketing-hub' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report public fingerprints
        env:
          AUDIT_VPS_SSH_CHAVE: ${{ secrets.VPS_SSH_CHAVE }}
          AUDIT_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          AUDIT_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          AUDIT_GROWTH_OPERATOR_VPS_SSH_KEY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          AUDIT_PDE_PLATFORM_VPS_SSH_KEY: ${{ secrets.PDE_PLATFORM_VPS_SSH_KEY }}
          AUDIT_LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY: ${{ secrets.LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY }}
        run: python3 -B scripts/audit-ssh-credential-fingerprints.py
