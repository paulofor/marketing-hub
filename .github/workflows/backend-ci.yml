name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "config/agents/codex-agent-health-compliance.json"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/deploy-containers.yml"
      - "scripts/download-approved-pr-artifact.sh"
      - "scripts/test-backend-ci-workflow.py"
      - "scripts/test-backend-packaged-resources.py"
      - "scripts/verify-backend-packaged-resources.py"
      - "scripts/BackendResearchPackageSmoke.java"
      - "infra/testing/vega-integrity-cycle/run-round.sh"
      - "infra/testing/runway-clip-plan/run-round.sh"
      - "infra/testing/runway-gen45/run-round.sh"
      - "infra/testing/pde-version-contract/**"
      - "**/src/main/resources/prompts/**"
      - "experiment-strategist-worker/src/main/resources/behavioral-science/**"
      - "product-discovery-worker/prompts/**"
      - "pesquisas/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend completo e arquitetura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ads
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/ads-service/pom.xml
      - name: Validar contrato do CI
        run: python3 scripts/test-backend-ci-workflow.py
      - name: Executar todos os testes do backend
        working-directory: backend/ads-service
        run: mvn -B test
      - name: Validar Liquibase contra MySQL 5.7
        working-directory: backend/ads-service
        run: |
          mvn -B \
            org.liquibase:liquibase-maven-plugin:4.26.0:validate \
            -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml \
            -Dliquibase.url=jdbc:mysql://localhost:3306/ads \
            -Dliquibase.username=root \
            -Dliquibase.password=root
      - name: Empacotar o backend aprovado
        working-directory: backend/ads-service
        run: mvn -B package -DskipTests
      - name: Conferir recursos e inicialização do catálogo empacotado
        run: |
          python3 scripts/test-backend-packaged-resources.py
          python3 scripts/verify-backend-packaged-resources.py
      - name: Registrar árvore Git aprovada
        run: git rev-parse 'HEAD^{tree}' > backend/ads-service/target/approved-tree.sha
      - name: Preservar pacote aprovado para o deploy
        uses: actions/upload-artifact@v4
        with:
          name: backend-approved-package
          path: |
            backend/ads-service/target/app.jar
            backend/ads-service/target/app-exec.jar
            backend/ads-service/target/classes/
            backend/ads-service/target/approved-tree.sha
          if-no-files-found: error
          retention-days: 1
      - name: Preservar relatórios inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/ads-service/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
