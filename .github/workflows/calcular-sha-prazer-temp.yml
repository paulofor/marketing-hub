name: Calcular SHA prazer audiovisual temporario

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calcular-sha-prazer-temp.yml'
      - 'pesquisas/prazer-audio-visual/cards/fontes/2026-09-08-*.md'

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Calcular SHA-256
        run: |
          sha256sum pesquisas/prazer-audio-visual/cards/fontes/2026-09-08-sinais-intencao-comunicativa-arousal-avatar.md
          sha256sum pesquisas/prazer-audio-visual/cards/fontes/2026-09-08-separacao-auditiva-estrutura-cena.md
          sha256sum pesquisas/prazer-audio-visual/cards/fontes/2026-09-08-repeticao-audio-familiarizacao-compreensao.md
