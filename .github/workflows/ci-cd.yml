# .github/workflows/ci-cd.yml
name: CI + CD – marketinghub backend

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write


jobs:
# ─────────────────────────────────────────
# 1) BUILD – compila, testa e empacota
# ─────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ads
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    defaults:                     # 👉 força todos os steps a rodarem em backend/ads-service
      run:
        working-directory: backend/ads-service

    steps:
      - uses: actions/checkout@v4           # clona o repositório

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache repositório Maven manual (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: "Rodar testes (ArquiteturaTest: somente erros)"
        run: |
          set -o pipefail
          mvn -B -q test | tee /tmp/maven-test.log

          if grep -q "ArquiteturaTest" /tmp/maven-test.log; then
            echo "Resumo de erros do ArquiteturaTest:"
            awk '/ArquiteturaTest/,/^$/' /tmp/maven-test.log | grep -E "^\[ERROR\]" || true
          fi

      - name: Validar changelogs Liquibase
        run: |
          mvn -B \
            org.liquibase:liquibase-maven-plugin:4.26.0:validate \
            -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml \
            -Dliquibase.url=jdbc:mysql://localhost:3306/ads \
            -Dliquibase.username=root \
            -Dliquibase.password=root

      - name: Build backend
        run: mvn -B -s ../settings.xml package -DskipTests

      - name: Ajustar nomes dos JARs
        run: |
          mv target/app.jar target/app-lib.jar
          mv target/app-exec.jar target/app.jar

      - name: Enviar lib ao GitHub Packages com Maven Deploy Plugin
        run: |
          mvn -B -s ../settings.xml \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.1:deploy-file \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/paulofor/marketing-hub \
            -Dfile=target/app-lib.jar \
            -DgroupId=com.marketinghub \
            -DartifactId=ads-service \
            -Dversion=0.0.1-SNAPSHOT \
            -Dpackaging=jar

      - name: Remover versões antigas do pacote ads-service
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PACKAGE_PATH="/users/paulofor/packages/maven/ads-service/versions"
          echo "Buscando o ID da versão mais recente..."
          latest_version_id="$(gh api "${PACKAGE_PATH}" --paginate --jq '.[0].id' | head -n 1 || true)"

          if [[ -z "${latest_version_id}" ]]; then
            echo "Não foi possível identificar a versão mais recente. Nenhuma limpeza será feita." >&2
            exit 0
          fi

          echo "Mantendo a versão mais recente com ID ${latest_version_id} e removendo as demais..."
          old_versions="$(gh api "${PACKAGE_PATH}" --paginate --jq '.[].id' | grep -v "^${latest_version_id}$" || true)"

          if [[ -z "${old_versions}" ]]; then
            echo "Nenhuma versão antiga encontrada."
            exit 0
          fi

          while IFS= read -r version_id; do
            [[ -z "${version_id}" ]] && continue
            gh api --method DELETE "${PACKAGE_PATH}/${version_id}"
            echo "Removida a versão ${version_id}."
          done <<< "${old_versions}"

          echo "Limpeza concluída."

      - name: Verificar biblioteca publicada
        run: |
          mvn -U -B -s ../settings.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=com.marketinghub:ads-service:0.0.1-SNAPSHOT \
            -Dtransitive=false \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/paulofor/marketing-hub
          ls -la ~/.m2/repository/com/marketinghub/ads-service/0.0.1-SNAPSHOT || true

      - name: Build AI Worker
        run: cd ../../ai-worker && mvn -s settings.xml package

