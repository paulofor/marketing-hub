name: Customer Agent Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - customer-agent-worker/**
      - .github/workflows/customer-agent-worker-ci.yml
  workflow_dispatch:

concurrency:
  group: customer-agent-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test and build worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: customer-agent-worker/pom.xml
      - name: Run unit tests
        working-directory: customer-agent-worker
        run: mvn -B test
      - name: Validate container user contract
        run: bash customer-agent-worker/test-dockerfile-contract.sh
      - name: Validate container build
        run: docker build -t marketing-hub/customer-agent-worker:${{ github.sha }} customer-agent-worker
      - name: Validate bundled Chromium as runtime user
        run: |
          docker run --rm --entrypoint node marketing-hub/customer-agent-worker:${{ github.sha }} \
            --input-type=module -e \
            'import { chromium } from "playwright-core"; const browser = await chromium.launch({headless: true, args: ["--no-sandbox"]}); console.log(await browser.version()); await browser.close();'

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Add agent VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
      - name: Trust agent VPS
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${VPS_IP}" >> ~/.ssh/known_hosts
      - name: Synchronize versioned worker
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/customer-agent-worker'"
          rsync -az --delete customer-agent-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/customer-agent-worker/"
      - name: Rebuild, restart and validate worker
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "\
            cd '${REPOSITORY_DIR}/customer-agent-worker' \
            && BACKEND_URL=http://191.252.181.168 \
               CODEX_HOME_PATH=/opt/growth-operator/codex-home \
               MARKETING_HUB_REPOSITORY='${REPOSITORY_DIR}' \
               CUSTOMER_AGENT_MODEL=gpt-5.6-sol \
               docker compose up -d --build --remove-orphans \
            && for attempt in \$(seq 1 12); do \
                 status=\$(docker inspect --format '{{.State.Status}}' customer-agent-worker-customer-agent-worker-1 2>/dev/null || true); \
                 [ \"\${status}\" = running ] \
                   && docker exec customer-agent-worker-customer-agent-worker-1 \
                        sh -lc 'test -w /home/operator/.codex && codex login status' \
                   && exit 0; \
                 sleep 5; \
               done; \
            docker compose logs --tail=150 customer-agent-worker; exit 1"
