name: Customer Agent Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - customer-agent-worker/**
      - meta-ad-approver-worker/src/**
      - pde-platform/**
      - backend/ads-service/src/main/resources/db/changelog/**
      - backend/ads-service/src/test/java/com/marketinghub/pde/**
      - docs/homologacao/**
      - docs/registros/**
      - scripts/build-commercial-review-evidence.mjs
      - scripts/generate-musa-v7-canonical-contract-changelog.mjs
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
      - scripts/coordinate-agent-deployment.mjs
      - scripts/coordinate-agent-deployment.test.mjs
  pull_request:
    paths:
      - customer-agent-worker/**
      - meta-ad-approver-worker/src/**
      - pde-platform/**
      - backend/ads-service/src/main/resources/db/changelog/**
      - backend/ads-service/src/test/java/com/marketinghub/pde/**
      - docs/homologacao/**
      - docs/registros/**
      - .github/workflows/customer-agent-worker-ci.yml
      - scripts/build-commercial-review-evidence.mjs
      - scripts/generate-musa-v7-canonical-contract-changelog.mjs
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
      - scripts/coordinate-agent-deployment.mjs
      - scripts/coordinate-agent-deployment.test.mjs
  workflow_run:
    workflows: ["Build & Deploy containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test and build worker
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build immutable commercial evidence
        run: node scripts/build-commercial-review-evidence.mjs . customer-agent-worker/review-evidence
      - name: Validate application deploy coordination
        run: node --test scripts/coordinate-agent-deployment.test.mjs
      - name: Confirm matching application deployment was enqueued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_REGISTRATION_TIMEOUT_SECONDS: 120
        run: node scripts/coordinate-agent-deployment.mjs assert-application-run deploy-containers.yml
      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: customer-agent-worker/pom.xml
      - name: Run unit tests
        working-directory: customer-agent-worker
        run: mvn -B test
      - name: Install browser client dependencies
        working-directory: customer-agent-worker
        run: npm ci
      - name: Validate real mobile visual capture
        working-directory: customer-agent-worker
        run: |
          docker run --rm --init --network none \
            --user "$(id -u):$(id -g)" --env npm_config_cache=/tmp/npm-cache \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}/customer-agent-worker" \
            mcr.microsoft.com/playwright:v1.54.2-noble@sha256:18b4bcff4f8ba0ac8c44b09f09def6a4f6cb8579e5f26381c21f38b50935d5d8 \
            npm test
      - name: Validate container user contract
        run: bash customer-agent-worker/test-dockerfile-contract.sh
      - name: Validate container build
        run: docker build --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -t marketing-hub/customer-agent-worker:${{ github.sha }} customer-agent-worker
      - name: Validate bundled Chromium as runtime user
        run: |
          docker run --rm --entrypoint node marketing-hub/customer-agent-worker:${{ github.sha }} \
            --input-type=module -e \
            'import { chromium } from "playwright-core"; const browser = await chromium.launch({headless: true, args: ["--no-sandbox"]}); console.log(await browser.version()); await browser.close();'
      - name: Validate full capture with bundled Chromium
        run: |
          docker run --rm --init --read-only --interactive \
            --tmpfs /tmp:size=256m,noexec,nosuid \
            --security-opt no-new-privileges:true \
            --env CUSTOMER_AGENT_BPM_VISUAL_SCRIPT=/app/browser/bpm-visual-evidence.mjs \
            --entrypoint node \
            marketing-hub/customer-agent-worker:${{ github.sha }} \
            --input-type=module \
            < customer-agent-worker/src/test/js/bpm-visual-evidence.test.mjs

      - name: Package tested images
        if: github.event_name != 'pull_request'
        run: node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images" marketing-hub/customer-agent-worker:${{ github.sha }}
      - name: Store tested images for this run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  source-run:
    name: Resolve tested worker revision
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.resolve.outputs.required }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        name: Resolve exact tested source run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          APP_DEPLOY_EVENT: ${{ github.event.workflow_run.event }}
          APP_DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AGENT_SOURCE_WAIT_TIMEOUT_SECONDS: 6900
        run: node scripts/coordinate-agent-deployment.mjs resolve-source-run customer-agent-worker-ci.yml

  deploy:
    name: Deploy worker
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.test.result == 'success') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.source-run.result == 'success' &&
        needs.source-run.outputs.required == 'true'))
    runs-on: ubuntu-latest
    needs:
      - test
      - source-run
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    env:
      DEPLOY_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_sha || github.sha }}
      PDE_INTERNAL_API_TOKEN: ${{ secrets.PDE_INTERNAL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: agent-images-${{ env.DEPLOY_SOURCE_SHA }}
          path: ${{ runner.temp }}/agent-images/
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_run_id || github.run_id }}
      - name: Verify tested images
        run: node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images" "marketing-hub/customer-agent-worker:${DEPLOY_SOURCE_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build immutable commercial evidence
        run: node scripts/build-commercial-review-evidence.mjs . customer-agent-worker/review-evidence
      - name: Configure authenticated agent VPS SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$VPS_IP" "$VPS_USER" "$GITHUB_ENV"
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
      - name: Load tested images without rebuilding
        timeout-minutes: 20
        run: node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images" "${VPS_USER}@${VPS_IP}" "marketing-hub/customer-agent-worker:${DEPLOY_SOURCE_SHA}"
      - name: Synchronize versioned worker
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/customer-agent-worker' '${REPOSITORY_DIR}/scripts'"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete customer-agent-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/customer-agent-worker/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-app-server-device-login.mjs "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"
      - name: Start and validate tested worker
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "\
            install -d -o 10001 -g 10001 /opt/growth-operator/agents/customer-agent/codex-home \
            && \
            export BACKEND_URL=http://191.252.181.168 \
                   CUSTOMER_AGENT_CODEX_HOME=/opt/growth-operator/agents/customer-agent/codex-home \
                   MARKETING_HUB_REPOSITORY='${REPOSITORY_DIR}' \
                   CUSTOMER_AGENT_MODEL=gpt-5.6-sol \
                   CUSTOMER_AGENT_REASONING_EFFORT=max \
                   CUSTOMER_AGENT_IMAGE=marketing-hub/customer-agent-worker:${DEPLOY_SOURCE_SHA} \
                   PDE_INTERNAL_API_TOKEN='${PDE_INTERNAL_API_TOKEN}' \
                   AGENT_BUILD_REFERENCE='${DEPLOY_SOURCE_SHA}' \
            && cd '${REPOSITORY_DIR}/customer-agent-worker' \
            && docker compose up -d --no-build --pull never --remove-orphans \
            && for attempt in \$(seq 1 12); do \
                 status=\$(docker inspect --format '{{.State.Status}}' customer-agent-worker-customer-agent-worker-1 2>/dev/null || true); \
                 codex_ready=false; \
                 health_body=; \
                 if [ \"\${status}\" = running ] \
                   && docker exec customer-agent-worker-customer-agent-worker-1 \
                        sh -lc 'test -w /home/operator/.codex && codex login status' >/dev/null 2>&1; then \
                   codex_ready=true; \
                 fi; \
                 health_body=\$(curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 10 http://127.0.0.1:8099/ops-customer-agent-observability-v1/health 2>/dev/null || true); \
                 printf 'readiness attempt=%s container=%s codex=%s health=%s\\n' \
                   \"\${attempt}\" \"\${status:-missing}\" \"\${codex_ready}\" \"\${health_body:-unavailable}\"; \
                 if [ \"\${status}\" = running ] \
                   && docker exec customer-agent-worker-customer-agent-worker-1 sh -lc 'test -s /app/commercial-evidence/commercial-review-bundle-index-v1.json' \
                   && docker exec customer-agent-worker-customer-agent-worker-1 node /app/agent-health-report.mjs \
                   && printf '%s' \"\${health_body}\" | grep -Eq 'status.*UP'; then exit 0; fi; \
                 sleep 5; \
               done; \
            printf '%s\n' 'Falha: Agente Cliente não confirmou versão implantada e acesso ao backend.'; \
            docker compose logs --tail=150 customer-agent-worker; exit 1"
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
