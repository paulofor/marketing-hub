name: Build & Deploy containers

on:
  push:
    branches: [main]

concurrency:
  group: deploy-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VPS_IP: 191.252.181.168
  VIDEO_VPS_IP: 177.153.62.107
  VPS_USER: root
  DEPLOY_DIR: /opt/marketinghub/containers
  BACKEND_IMAGE: marketinghub-backend
  FRONTEND_IMAGE: marketinghub-frontend
  VIDEO_IMAGE: marketinghub-video-management

permissions:
  contents: read
  packages: read

jobs:
  detect-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      video: ${{ steps.filter.outputs.video }}
      app_deploy: ${{ steps.filter.outputs.app_deploy }}
      app_deploy_sync: ${{ steps.filter.outputs.app_deploy_sync }}
      video_deploy: ${{ steps.filter.outputs.video_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect affected deployment targets
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          else
            base="${before}"
          fi

          changed_files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          printf 'Changed files:\n%s\n' "${changed_files}"

          backend=false
          frontend=false
          video=false
          app_deploy_descriptor=false
          app_deploy_sync=false
          video_deploy_descriptor=false

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              .dockerignore) backend=true; frontend=true; video=true ;;
              backend/settings.xml) backend=true ;;
              backend/ads-service/*) backend=true ;;
              frontend/*) frontend=true ;;
              video-management-service/*) video=true ;;
              deploy/bin/*) app_deploy_sync=true ;;
              deploy/docker-compose.yml) app_deploy_descriptor=true; video_deploy_descriptor=true ;;
              deploy/nginx/*) app_deploy_descriptor=true; video_deploy_descriptor=true ;;
            esac
          done <<< "${changed_files}"

          app_deploy=false
          video_deploy=false

          if [[ "${backend}" == "true" || "${frontend}" == "true" || "${app_deploy_descriptor}" == "true" ]]; then
            app_deploy=true
          fi

          if [[ "${video}" == "true" || "${video_deploy_descriptor}" == "true" ]]; then
            video_deploy=true
          fi

          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "video=${video}"
            echo "app_deploy=${app_deploy}"
            echo "app_deploy_sync=${app_deploy_sync}"
            echo "video_deploy=${video_deploy}"
          } >> "${GITHUB_OUTPUT}"

  sync-app-deploy-descriptors:
    name: Sync app deployment descriptors
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.app_deploy == 'false' && needs.detect-changes.outputs.app_deploy_sync == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add APP VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${APP_VPS_IP}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Nao foi possivel coletar a chave SSH da APP VPS ${APP_VPS_IP}:22 apos novas tentativas."
          exit 1

      - name: Copy deployment descriptors without restarting stack
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          retry rsync -az --delete --exclude '.env' --exclude 'volumes/' --filter='P .env' --filter='P volumes/' -e "ssh ${SSH_OPTS}" deploy/ ${VPS_USER}@${APP_VPS_IP}:${DEPLOY_DIR}/

  backend-image:
    name: Backend – build image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ads
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven repository (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run unit tests
        working-directory: backend/ads-service
        run: mvn -B test

      - name: Validate Liquibase changelog
        working-directory: backend/ads-service
        run: |
          mvn -B \
            org.liquibase:liquibase-maven-plugin:4.26.0:validate \
            -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml \
            -Dliquibase.url=jdbc:mysql://localhost:3306/ads \
            -Dliquibase.username=root \
            -Dliquibase.password=root

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/ads-service/Dockerfile
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Save image as artifact
        run: docker save ${BACKEND_IMAGE}:${{ github.sha }} -o backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  frontend-image:
    name: Frontend – build image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      - name: Type-check
        run: cd frontend && npm run typecheck

      - name: Production build
        run: cd frontend && npm run build

      - name: Build Docker image
        run: docker build -f frontend/Dockerfile -t ${FRONTEND_IMAGE}:${{ github.sha }} .

      - name: Save image as artifact
        run: docker save ${FRONTEND_IMAGE}:${{ github.sha }} -o frontend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

  video-management-image:
    name: Video management – build image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.video == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        working-directory: video-management-service
        run: mvn -B test

      - name: Build Docker image
        run: docker build -f video-management-service/Dockerfile -t ${VIDEO_IMAGE}:${{ github.sha }} .

      - name: Save image as artifact
        run: docker save ${VIDEO_IMAGE}:${{ github.sha }} -o video-management-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: video-management-image
          path: video-management-image.tar
          retention-days: 1

  deploy-app:
    name: Deploy backend + frontend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [detect-changes, backend-image, frontend-image]
    if: always() && needs.detect-changes.outputs.app_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download backend image artifact
        if: needs.detect-changes.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: artifacts

      - name: Download frontend image artifact
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: artifacts

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add APP VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${APP_VPS_IP}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Nao foi possivel coletar a chave SSH da APP VPS ${APP_VPS_IP}:22 apos novas tentativas."
          exit 1

      - name: Copy deployment descriptors
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          retry rsync -az --delete --exclude '.env' --exclude 'volumes/' --filter='P .env' --filter='P volumes/' -e "ssh ${SSH_OPTS}" deploy/ ${VPS_USER}@${APP_VPS_IP}:${DEPLOY_DIR}/

      - name: Upload images to APP VPS
        if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          if [[ -f artifacts/backend-image.tar ]]; then
            retry rsync -az --partial --append-verify -e "ssh ${SSH_OPTS}" artifacts/backend-image.tar ${VPS_USER}@${APP_VPS_IP}:/tmp/backend-image.tar
          fi

          if [[ -f artifacts/frontend-image.tar ]]; then
            retry rsync -az --partial --append-verify -e "ssh ${SSH_OPTS}" artifacts/frontend-image.tar ${VPS_USER}@${APP_VPS_IP}:/tmp/frontend-image.tar
          fi

      - name: Remove unchanged APP image artifacts
        env:
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          files_to_remove=()

          if [[ "${BACKEND_CHANGED}" != "true" ]]; then
            files_to_remove+=(/tmp/backend-image.tar)
          fi

          if [[ "${FRONTEND_CHANGED}" != "true" ]]; then
            files_to_remove+=(/tmp/frontend-image.tar)
          fi

          if [[ "${#files_to_remove[@]}" -gt 0 ]]; then
            ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "rm -f ${files_to_remove[*]}"
          fi

      - name: Apply backend/frontend stack
        env:
          GIT_SHA: ${{ github.sha }}
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "chmod +x ${DEPLOY_DIR}/bin/apply.sh"
          timeout -k 30s 18m ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} \
            "IMAGE_TAG=${GIT_SHA} BACKEND_TAR=/tmp/backend-image.tar FRONTEND_TAR=/tmp/frontend-image.tar BACKEND_IMAGE=${BACKEND_IMAGE} FRONTEND_IMAGE=${FRONTEND_IMAGE} DEPLOY_DIR=${DEPLOY_DIR} /bin/bash ${DEPLOY_DIR}/bin/apply.sh"

  deploy-video-management:
    name: Deploy video management
    runs-on: ubuntu-latest
    needs: [detect-changes, video-management-image]
    if: always() && needs.detect-changes.outputs.video_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download video-management image artifact
        if: needs.detect-changes.outputs.video == 'true'
        uses: actions/download-artifact@v4
        with:
          name: video-management-image
          path: artifacts

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add VIDEO VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${VIDEO_VPS_IP}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Nao foi possivel coletar a chave SSH da VIDEO VPS ${VIDEO_VPS_IP}:22 apos novas tentativas."
          exit 1

      - name: Copy deployment descriptors
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          retry rsync -az --delete --exclude '.env' --exclude 'volumes/' --filter='P .env' --filter='P volumes/' -e "ssh ${SSH_OPTS}" deploy/ ${VPS_USER}@${VIDEO_VPS_IP}:${DEPLOY_DIR}/

      - name: Upload image to VIDEO VPS
        if: needs.detect-changes.outputs.video == 'true'
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry scp ${SSH_OPTS} artifacts/video-management-image.tar ${VPS_USER}@${VIDEO_VPS_IP}:/tmp/video-management-image.tar

      - name: Remove unchanged VIDEO image artifact
        if: needs.detect-changes.outputs.video != 'true'
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} "rm -f /tmp/video-management-image.tar"

      - name: Apply video-management stack
        env:
          GIT_SHA: ${{ github.sha }}
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} "chmod +x ${DEPLOY_DIR}/bin/apply-video-only.sh"
          retry timeout 30m ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} \
            "IMAGE_TAG=${GIT_SHA} VIDEO_TAR=/tmp/video-management-image.tar VIDEO_IMAGE=${VIDEO_IMAGE} VIDEO_BACKEND_BASE_URL=http://${APP_VPS_IP}:8000 DEPLOY_DIR=${DEPLOY_DIR} /bin/bash ${DEPLOY_DIR}/bin/apply-video-only.sh"
