name: Build & Deploy containers

on:
  push:
    branches: [main]

concurrency:
  group: deploy-containers-${{ github.ref }}
  # Um push posterior pode conter somente documentação. Ele não pode cancelar
  # uma publicação válida antes de a detecção de módulos ser executada.
  cancel-in-progress: false

env:
  APP_VPS_IP: 191.252.181.168
  VIDEO_VPS_IP: 177.153.62.107
  VPS_USER: root
  DEPLOY_DIR: /opt/marketinghub/containers
  BACKEND_IMAGE: marketinghub-backend
  FRONTEND_IMAGE: marketinghub-frontend
  VIDEO_IMAGE: ghcr.io/${{ github.repository_owner }}/marketinghub-video-management

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      video: ${{ steps.filter.outputs.video }}
      app_image: ${{ steps.filter.outputs.app_image }}
      app_deploy: ${{ steps.filter.outputs.app_deploy }}
      app_deploy_sync: ${{ steps.filter.outputs.app_deploy_sync }}
      video_deploy: ${{ steps.filter.outputs.video_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect affected deployment targets
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          else
            base="${before}"
          fi

          changed_files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          printf 'Changed files:\n%s\n' "${changed_files}"

          backend=false
          frontend=false
          video=false
          app_deploy_descriptor=false
          app_deploy_sync=false
          video_deploy_descriptor=false

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              .github/workflows/deploy-containers.yml) backend=true; frontend=true; video=true; app_deploy_descriptor=true; video_deploy_descriptor=true ;;
              .dockerignore) backend=true; frontend=true; video=true ;;
              backend/settings.xml) backend=true ;;
              backend/ads-service/*) backend=true ;;
              frontend/*) frontend=true ;;
              video-management-service/*) video=true ;;
              deploy/bin/apply-video-only.sh) video=true; video_deploy_descriptor=true ;;
              deploy/bin/*) app_deploy_sync=true ;;
              deploy/docker-compose.yml) app_deploy_descriptor=true ;;
              deploy/nginx/*) app_deploy_descriptor=true ;;
            esac
          done <<< "${changed_files}"

          app_deploy=false
          app_image=false
          video_deploy=false

          if [[ "${backend}" == "true" || "${frontend}" == "true" ]]; then
            app_image=true
          fi

          if [[ "${backend}" == "true" || "${frontend}" == "true" || "${app_deploy_descriptor}" == "true" ]]; then
            app_deploy=true
          fi

          if [[ "${video}" == "true" || "${video_deploy_descriptor}" == "true" ]]; then
            video_deploy=true
          fi

          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "video=${video}"
            echo "app_image=${app_image}"
            echo "app_deploy=${app_deploy}"
            echo "app_deploy_sync=${app_deploy_sync}"
            echo "video_deploy=${video_deploy}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate transactional app deploy contract
        run: bash scripts/test-deploy-transactional-contract.sh

  sync-app-deploy-descriptors:
    name: Sync app deployment descriptors
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.app_deploy == 'false' && needs.detect-changes.outputs.app_deploy_sync == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add APP VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${APP_VPS_IP}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Nao foi possivel coletar a chave SSH da APP VPS ${APP_VPS_IP}:22 apos novas tentativas."
          exit 1

      - name: Copy deployment descriptors without restarting stack
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          retry rsync -az --delete --exclude '.env' --exclude 'volumes/' --filter='P .env' --filter='P volumes/' -e "ssh ${SSH_OPTS}" deploy/ ${VPS_USER}@${APP_VPS_IP}:${DEPLOY_DIR}/

  backend-image:
    name: Backend – build image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ads
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven repository (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run unit tests
        working-directory: backend/ads-service
        run: |
          set -o pipefail
          mvn -B -q test | tee /tmp/maven-test.log

          if grep -q "ArquiteturaTest" /tmp/maven-test.log; then
            echo "Resumo de erros do ArquiteturaTest:"
            awk '/ArquiteturaTest/,/^$/' /tmp/maven-test.log | grep -E "^\[ERROR\]" || true
          fi

      - name: Validate Liquibase changelog
        working-directory: backend/ads-service
        run: |
          mvn -B \
            org.liquibase:liquibase-maven-plugin:4.26.0:validate \
            -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml \
            -Dliquibase.url=jdbc:mysql://localhost:3306/ads \
            -Dliquibase.username=root \
            -Dliquibase.password=root

      - name: Package backend once
        working-directory: backend/ads-service
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: mvn -B -s ../settings.xml package -DskipTests

      - name: Publish backend library for dependent workers
        working-directory: backend/ads-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            deploy_log="$(mktemp)"

            if mvn -B -s ../settings.xml \
              org.apache.maven.plugins:maven-deploy-plugin:3.1.1:deploy-file \
              -DrepositoryId=github \
              -Durl=https://maven.pkg.github.com/paulofor/marketing-hub \
              -Dfile=target/app.jar \
              -DgroupId=com.marketinghub \
              -DartifactId=ads-service \
              -Dversion=0.0.1-SNAPSHOT \
              -Dpackaging=jar 2>&1 | tee "${deploy_log}"; then
              rm -f "${deploy_log}"
              break
            fi

            if ! grep -Eq 'status code: 5[0-9]{2}|timed out|Connection reset|Connection refused' "${deploy_log}"; then
              echo "Falha permanente ao publicar o pacote; não será feita nova tentativa." >&2
              rm -f "${deploy_log}"
              exit 1
            fi

            rm -f "${deploy_log}"
            if [[ "${attempt}" -eq 3 ]]; then
              echo "GitHub Packages permaneceu indisponível após 3 tentativas." >&2
              exit 1
            fi

            wait_seconds=$((attempt * 20))
            echo "Falha transitória do GitHub Packages. Nova tentativa em ${wait_seconds}s."
            sleep "${wait_seconds}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/ads-service/Dockerfile
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            BACKEND_BUILD_COMMIT=${{ github.sha }}
            BACKEND_BUILD_BRANCH=${{ github.ref_name }}
          load: true
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Save image as artifact
        run: docker save ${BACKEND_IMAGE}:${{ github.sha }} -o backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  frontend-image:
    name: Frontend – build image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      - name: Type-check
        run: cd frontend && npm run typecheck

      - name: Production build
        env:
          FRONTEND_BUILD_COMMIT: ${{ github.sha }}
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
        run: cd frontend && npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg FRONTEND_BUILD_COMMIT=${{ github.sha }} \
            --build-arg FRONTEND_IMAGE_TAG=${{ github.sha }} \
            -f frontend/Dockerfile \
            -t ${FRONTEND_IMAGE}:${{ github.sha }} \
            .

      - name: Save image as artifact
        run: docker save ${FRONTEND_IMAGE}:${{ github.sha }} -o frontend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

  video-management-image:
    name: Video management – build image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.video == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated video deployment contract
        run: deploy/bin/test-isolated-compose-contract.sh

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        working-directory: video-management-service
        run: mvn -B test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: video-management-service/Dockerfile
          push: true
          tags: |
            ${{ env.VIDEO_IMAGE }}:${{ github.sha }}
            ${{ env.VIDEO_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.VIDEO_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.VIDEO_IMAGE }}:buildcache,mode=max

  deploy-app:
    name: Deploy backend + frontend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    needs: [detect-changes, backend-image, frontend-image]
    if: always() && needs.detect-changes.outputs.app_deploy == 'true' && needs.backend-image.result != 'failure' && needs.backend-image.result != 'cancelled' && needs.frontend-image.result != 'failure' && needs.frontend-image.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Download backend image artifact
        if: needs.detect-changes.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: artifacts

      - name: Download frontend image artifact
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: artifacts

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add APP VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${APP_VPS_IP}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Nao foi possivel coletar a chave SSH da APP VPS ${APP_VPS_IP}:22 apos novas tentativas."
          exit 1

      - name: Copy deployment descriptors
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          retry rsync -az --delete --exclude '.env' --exclude 'volumes/' --filter='P .env' --filter='P volumes/' -e "ssh ${SSH_OPTS}" deploy/ ${VPS_USER}@${APP_VPS_IP}:${DEPLOY_DIR}/

      - name: Upload images to APP VPS
        if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          if [[ -f artifacts/backend-image.tar ]]; then
            retry rsync -az --partial -e "ssh ${SSH_OPTS}" artifacts/backend-image.tar ${VPS_USER}@${APP_VPS_IP}:/tmp/backend-image-${{ github.sha }}.tar
          fi

          if [[ -f artifacts/frontend-image.tar ]]; then
            retry rsync -az --partial -e "ssh ${SSH_OPTS}" artifacts/frontend-image.tar ${VPS_USER}@${APP_VPS_IP}:/tmp/frontend-image-${{ github.sha }}.tar
          fi

      - name: Remove unchanged APP image artifacts
        if: needs.detect-changes.outputs.backend != 'true' || needs.detect-changes.outputs.frontend != 'true'
        env:
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          files_to_remove=()

          if [[ "${BACKEND_CHANGED}" != "true" ]]; then
            files_to_remove+=(/tmp/backend-image.tar)
          fi

          if [[ "${FRONTEND_CHANGED}" != "true" ]]; then
            files_to_remove+=(/tmp/frontend-image.tar)
          fi

          if [[ "${#files_to_remove[@]}" -gt 0 ]]; then
            ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "rm -f ${files_to_remove[*]}"
          fi

      - name: Load images and apply backend/frontend stack
        env:
          GIT_SHA: ${{ github.sha }}
          LEAD_PORTAL_PAYMENTS_AUTH_TOKEN: ${{ secrets.LEAD_PORTAL_PAYMENTS_AUTH_TOKEN }}
          CUSTOMER_AGENT_MEMORY_AWS_ACCESS_KEY_ID: ${{ secrets.CUSTOMER_AGENT_MEMORY_AWS_ACCESS_KEY_ID }}
          CUSTOMER_AGENT_MEMORY_AWS_SECRET_ACCESS_KEY: ${{ secrets.CUSTOMER_AGENT_MEMORY_AWS_SECRET_ACCESS_KEY }}
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          if [ "${#LEAD_PORTAL_PAYMENTS_AUTH_TOKEN}" -lt 32 ]; then
            echo "Erro: LEAD_PORTAL_PAYMENTS_AUTH_TOKEN ausente ou menor que 32 caracteres no ambiente production." >&2
            exit 1
          fi
          if [ -z "${CUSTOMER_AGENT_MEMORY_AWS_ACCESS_KEY_ID}" ] || [ -z "${CUSTOMER_AGENT_MEMORY_AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Erro: credencial AWS da memória do Agente Cliente ausente no ambiente production." >&2
            exit 1
          fi
          ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "chmod +x ${DEPLOY_DIR}/bin/apply.sh"
          timeout -k 30s 40m ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} \
            "IMAGE_LOAD_TIMEOUT=15m COMPOSE_RECREATE_TIMEOUT=10m IMAGE_TAG=${GIT_SHA} BACKEND_TAR=/tmp/backend-image-${GIT_SHA}.tar FRONTEND_TAR=/tmp/frontend-image-${GIT_SHA}.tar VIDEO_TAR=/tmp/video-management-image-${GIT_SHA}.tar BACKEND_IMAGE=${BACKEND_IMAGE} FRONTEND_IMAGE=${FRONTEND_IMAGE} LEAD_PORTAL_PAYMENTS_AUTH_TOKEN='${LEAD_PORTAL_PAYMENTS_AUTH_TOKEN}' CUSTOMER_AGENT_MEMORY_BUCKET=marketing-hub-customer-agent-memory-948388760606 CUSTOMER_AGENT_MEMORY_REGION=us-east-1 EXPERIMENT_STRATEGIST_MEMORY_BUCKET=marketing-hub-experiment-strategist-memory-948388760606 EXPERIMENT_STRATEGIST_MEMORY_REGION=us-east-1 AWS_ACCESS_KEY_ID='${CUSTOMER_AGENT_MEMORY_AWS_ACCESS_KEY_ID}' AWS_SECRET_ACCESS_KEY='${CUSTOMER_AGENT_MEMORY_AWS_SECRET_ACCESS_KEY}' DEPLOY_DIR=${DEPLOY_DIR} /bin/bash ${DEPLOY_DIR}/bin/apply.sh"

      - name: Require healthy backend after deployment
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          ssh ${SSH_OPTS} ${VPS_USER}@${APP_VPS_IP} "DEPLOY_DIR=${DEPLOY_DIR} /bin/bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          for attempt in $(seq 1 36); do
            container_status="$(docker inspect marketinghub-backend --format '{{.State.Status}}' 2>/dev/null || true)"
            restart_count="$(docker inspect marketinghub-backend --format '{{.RestartCount}}' 2>/dev/null || echo 0)"

            if [[ "${container_status}" == "running" ]] \
              && curl -fsS --max-time 5 http://localhost:8000/ops-mh-observability-v2/health >/dev/null; then
              echo "Backend saudável após o deploy (reinícios=${restart_count})."
              exit 0
            fi

            echo "Aguardando backend saudável (${attempt}/36, status=${container_status:-ausente}, reinícios=${restart_count})."
            sleep 10
          done

          docker compose ps backend frontend >&2 || true
          docker inspect marketinghub-backend \
            --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} reinicios={{.RestartCount}}' >&2 || true
          docker logs --tail 200 marketinghub-backend >&2 || true
          exit 1
          REMOTE

  deploy-video-management:
    name: Deploy video management
    runs-on: ubuntu-latest
    needs: [detect-changes, video-management-image]
    if: always() && needs.detect-changes.outputs.video_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add VIDEO VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${VIDEO_VPS_IP}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Nao foi possivel coletar a chave SSH da VIDEO VPS ${VIDEO_VPS_IP}:22 apos novas tentativas."
          exit 1

      - name: Copy deployment descriptors
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          retry rsync -az --delete --exclude '.env' --exclude 'volumes/' --filter='P .env' --filter='P volumes/' -e "ssh ${SSH_OPTS}" deploy/ ${VPS_USER}@${VIDEO_VPS_IP}:${DEPLOY_DIR}/

      - name: Log VIDEO VPS in to GitHub Container Registry
        if: needs.detect-changes.outputs.video == 'true'
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Apply video-management stack
        env:
          GIT_SHA: ${{ github.sha }}
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          retry ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} "chmod +x ${DEPLOY_DIR}/bin/apply-video-only.sh"
          retry timeout 30m ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} \
            "IMAGE_TAG=${GIT_SHA} VIDEO_PULL=${{ needs.detect-changes.outputs.video }} VIDEO_IMAGE=${VIDEO_IMAGE} VIDEO_BACKEND_BASE_URL=http://${APP_VPS_IP} DEPLOY_DIR=${DEPLOY_DIR} /bin/bash ${DEPLOY_DIR}/bin/apply-video-only.sh"

      - name: Remove temporary GitHub Container Registry credentials
        if: always() && needs.detect-changes.outputs.video == 'true'
        env:
          SSH_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o TCPKeepAlive=yes
        run: ssh ${SSH_OPTS} ${VPS_USER}@${VIDEO_VPS_IP} "docker logout ghcr.io >/dev/null 2>&1 || true"
