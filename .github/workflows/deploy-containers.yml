name: Build & Deploy containers

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  VPS_IP: 191.252.92.222
  VPS_USER: marketinghub
  DEPLOY_DIR: /opt/marketinghub/containers
  BACKEND_IMAGE: marketinghub-backend
  FRONTEND_IMAGE: marketinghub-frontend

permissions:
  contents: read
  packages: read

jobs:
  backend-image:
    name: Backend – build image
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ads
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven repository (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run unit tests
        working-directory: backend/ads-service
        run: mvn -B test

      - name: Validate Liquibase changelog
        working-directory: backend/ads-service
        run: |
          mvn -B \
            org.liquibase:liquibase-maven-plugin:4.26.0:validate \
            -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml \
            -Dliquibase.url=jdbc:mysql://localhost:3306/ads \
            -Dliquibase.username=root \
            -Dliquibase.password=root

      - name: Build Docker image
        run: docker build -f backend/ads-service/Dockerfile -t ${BACKEND_IMAGE}:${{ github.sha }} .

      - name: Save image as artifact
        run: docker save ${BACKEND_IMAGE}:${{ github.sha }} -o backend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  frontend-image:
    name: Frontend – build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      - name: Type-check
        run: cd frontend && npm run typecheck

      - name: Production build
        run: cd frontend && npm run build

      - name: Build Docker image
        run: docker build -f frontend/Dockerfile -t ${FRONTEND_IMAGE}:${{ github.sha }} .

      - name: Save image as artifact
        run: docker save ${FRONTEND_IMAGE}:${{ github.sha }} -o frontend-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend-image, frontend-image]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: artifacts

      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: artifacts

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_CHAVE }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -4 -p 22 -t rsa,ecdsa,ed25519 -H ${VPS_IP} >> ~/.ssh/known_hosts

      - name: Copy deployment descriptors
        run: |
          ssh ${VPS_USER}@${VPS_IP} "mkdir -p ${DEPLOY_DIR}"
          rsync -az --delete deploy/ ${VPS_USER}@${VPS_IP}:${DEPLOY_DIR}/

      - name: Upload images to VPS
        run: |
          scp artifacts/backend-image.tar ${VPS_USER}@${VPS_IP}:/tmp/backend-image.tar
          scp artifacts/frontend-image.tar ${VPS_USER}@${VPS_IP}:/tmp/frontend-image.tar

      - name: Apply docker-compose stack
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh ${VPS_USER}@${VPS_IP} "chmod +x ${DEPLOY_DIR}/bin/apply.sh"
          ssh ${VPS_USER}@${VPS_IP} \
            "IMAGE_TAG=${GIT_SHA} BACKEND_TAR=/tmp/backend-image.tar FRONTEND_TAR=/tmp/frontend-image.tar BACKEND_IMAGE=${BACKEND_IMAGE} FRONTEND_IMAGE=${FRONTEND_IMAGE} DEPLOY_DIR=${DEPLOY_DIR} /bin/bash ${DEPLOY_DIR}/bin/apply.sh"
