name: Experiment Strategist Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - experiment-strategist-worker/**
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
  workflow_dispatch:

concurrency:
  group: experiment-strategist-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: experiment-strategist-worker/pom.xml

      - name: Run unit tests
        working-directory: experiment-strategist-worker
        run: mvn -B test

      - name: Run Clarity MCP adapter tests
        run: |
          npm ci --prefix experiment-strategist-worker
          docker run --rm --init --network none \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "/workspace/experiment-strategist-worker" \
            mcr.microsoft.com/playwright:v1.54.2-noble@sha256:18b4bcff4f8ba0ac8c44b09f09def6a4f6cb8579e5f26381c21f38b50935d5d8 npm test

      - name: Validate container build
        run: docker build --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -t marketing-hub/experiment-strategist-worker:${{ github.sha }} experiment-strategist-worker

      - name: Package tested images
        if: github.event_name != 'pull_request'
        run: node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images" marketing-hub/experiment-strategist-worker:${{ github.sha }}
      - name: Store tested images for this run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
      - name: Verify tested images
        run: node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images" marketing-hub/experiment-strategist-worker:${{ github.sha }}

      - name: Configure authenticated agent VPS SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$VPS_IP" "$VPS_USER" "$GITHUB_ENV"
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
      - name: Load tested images without rebuilding
        timeout-minutes: 20
        run: node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images" "${VPS_USER}@${VPS_IP}" marketing-hub/experiment-strategist-worker:${{ github.sha }}
      - name: Synchronize versioned repository
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/experiment-strategist-worker' '${REPOSITORY_DIR}/scripts'"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete experiment-strategist-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/experiment-strategist-worker/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-app-server-device-login.mjs "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"

      - name: Start validated worker
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "install -d -o 10001 -g 10001 -m 700 /opt/growth-operator/agents/experiment-strategist/secrets && if [ ! -f /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token ]; then install -o 10001 -g 10001 -m 600 /dev/null /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token; fi && chown 10001:10001 /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token && chmod 600 /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token"
          printf '%s' "${CLARITY_API_TOKEN}" | ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "umask 077; tee /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token >/dev/null; chown 10001:10001 /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token; chmod 600 /opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token"
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "\
            install -d -o 10001 -g 10001 /opt/growth-operator/agents/experiment-strategist/codex-home \
            && export EXPERIMENT_STRATEGIST_CODEX_HOME=/opt/growth-operator/agents/experiment-strategist/codex-home \
            && cd '${REPOSITORY_DIR}/experiment-strategist-worker' \
            && BACKEND_URL=http://191.252.181.168 \
               MARKETING_HUB_REPOSITORY_HOST='${REPOSITORY_DIR}' \
               CODEX_MODEL=gpt-5.6-sol \
               EXPERIMENT_STRATEGIST_IMAGE=marketing-hub/experiment-strategist-worker:${GITHUB_SHA} \
               docker compose up -d --no-build --pull never --remove-orphans \
            && for attempt in \$(seq 1 24); do \
                 status=\$(docker inspect --format '{{.State.Status}}' experiment-strategist-worker-experiment-strategist-worker-1 2>/dev/null || true); \
                 codex_ready=false; \
                 if [ \"\${status}\" = running ] \
                   && docker exec experiment-strategist-worker-experiment-strategist-worker-1 \
                        sh -lc 'test -w /home/strategist/.codex && codex login status' >/dev/null 2>&1; then \
                   codex_ready=true; \
                 fi; \
                 health_body=\$(curl -fsS http://127.0.0.1:8096/ops-experiment-strategist-observability-v1/health 2>/dev/null || true); \
                 logfile_status=\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8096/ops-experiment-strategist-observability-v1/logfile 2>/dev/null || true); \
                 printf 'readiness attempt=%s container=%s codex=%s health=%s logfile=%s\\n' \
                   \"\${attempt}\" \"\${status:-missing}\" \"\${codex_ready}\" \"\${health_body:-unavailable}\" \"\${logfile_status:-unavailable}\"; \
                 if [ \"\${status}\" = running ] \
                   && [ \"\${logfile_status}\" = 200 ] \
                   && docker exec experiment-strategist-worker-experiment-strategist-worker-1 node /app/agent-health-report.mjs \
                   && printf '%s' \"\${health_body}\" | grep -Eq 'status.*UP'; then \
                   exit 0; \
                 fi; \
                 sleep 5; \
               done; \
            printf '%s\n' 'Falha: container nao confirmou versao implantada, backend e health operacional.'; \
            docker compose logs --tail=150 experiment-strategist-worker; \
            exit 1"

      - name: Report deployed revision
        run: |
          deployed_image="$(ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" \
            "docker inspect experiment-strategist-worker-experiment-strategist-worker-1 --format '{{.Config.Image}}'")"
          test "${deployed_image}" = "marketing-hub/experiment-strategist-worker:${GITHUB_SHA}"
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" \
            "docker inspect experiment-strategist-worker-experiment-strategist-worker-1 \
              --format 'image={{.Config.Image}} started={{.State.StartedAt}} status={{.State.Status}}'"
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
