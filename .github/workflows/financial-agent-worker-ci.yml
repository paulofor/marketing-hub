name: Financial Agent Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - financial-agent-worker/**
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
  workflow_dispatch:

concurrency:
  group: financial-agent-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test and build worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: financial-agent-worker/pom.xml
      - name: Run unit tests
        working-directory: financial-agent-worker
        run: mvn -B test
      - name: Validate container build
        run: docker build -t marketing-hub/financial-agent-worker:${{ github.sha }} financial-agent-worker

      - name: Package tested images
        if: github.event_name != 'pull_request'
        run: node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images" marketing-hub/financial-agent-worker:${{ github.sha }}
      - name: Store tested images for this run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
      - name: Verify tested images
        run: node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images" marketing-hub/financial-agent-worker:${{ github.sha }}
      - name: Configure authenticated agent VPS SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$VPS_IP" "$VPS_USER" "$GITHUB_ENV"
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s' < scripts/ensure-agent-vps-disk-space.sh
      - name: Load tested images without rebuilding
        timeout-minutes: 20
        run: node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images" "${VPS_USER}@${VPS_IP}" marketing-hub/financial-agent-worker:${{ github.sha }}
      - name: Synchronize versioned worker
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/financial-agent-worker' '${REPOSITORY_DIR}/scripts'"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete financial-agent-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/financial-agent-worker/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-app-server-device-login.mjs "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"
      - name: Start and validate tested worker
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "\
            install -d -o 10001 -g 10001 /opt/growth-operator/agents/financial-agent/codex-home \
            && \
            export FINANCIAL_AGENT_IMAGE=marketing-hub/financial-agent-worker:${GITHUB_SHA} \
                   BACKEND_URL=http://191.252.181.168 \
                   FINANCIAL_AGENT_CODEX_HOME=/opt/growth-operator/agents/financial-agent/codex-home \
                   MARKETING_HUB_REPOSITORY_PATH='${REPOSITORY_DIR}' \
                   COMMERCIAL_PLAN_ID=2 \
                   CODEX_MODEL=gpt-5.6-sol \
                   CODEX_REASONING_EFFORT=high \
                   CODEX_SERVICE_TIER=default \
                   AGENT_BUILD_REFERENCE='${GITHUB_SHA}' \
            && cd '${REPOSITORY_DIR}/financial-agent-worker' \
            && docker compose up -d --no-build --pull never --remove-orphans \
            && for attempt in \$(seq 1 12); do \
                 status=\$(docker inspect --format '{{.State.Status}}' financial-agent-worker-financial-agent-worker-1 2>/dev/null || true); \
                 codex_ready=false; \
                 health_body=; \
                 if [ \"\${status}\" = running ] \
                   && docker exec financial-agent-worker-financial-agent-worker-1 \
                        sh -lc 'test -w /home/financial-agent/.codex && codex login status' >/dev/null 2>&1; then \
                   codex_ready=true; \
                 fi; \
                 health_body=\$(curl -fsS http://127.0.0.1:8095/ops-financial-agent-observability-v1/health 2>/dev/null || true); \
                 printf 'readiness attempt=%s container=%s codex=%s health=%s\\n' \
                   \"\${attempt}\" \"\${status:-missing}\" \"\${codex_ready}\" \"\${health_body:-unavailable}\"; \
                 if [ \"\${status}\" = running ] \
                   && docker exec financial-agent-worker-financial-agent-worker-1 node /app/agent-health-report.mjs \
                   && printf '%s' \"\${health_body}\" | grep -Eq 'status.*UP'; then exit 0; fi; \
                 sleep 5; \
               done; \
            printf '%s\n' 'Falha: Agente Financeiro não confirmou versão implantada e acesso ao backend.'; \
            docker compose logs --tail=150 financial-agent-worker; exit 1"
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s' < scripts/ensure-agent-vps-disk-space.sh
