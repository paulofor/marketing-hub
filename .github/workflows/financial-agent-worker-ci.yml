name: Financial Agent Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - financial-agent-worker/**
      - .github/workflows/financial-agent-worker-ci.yml
  workflow_dispatch:

concurrency:
  group: financial-agent-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test and build worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: financial-agent-worker/pom.xml
      - name: Run unit tests
        working-directory: financial-agent-worker
        run: mvn -B test
      - name: Validate container build
        run: docker build -t marketing-hub/financial-agent-worker:${{ github.sha }} financial-agent-worker

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Add operator VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
      - name: Trust operator VPS
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${VPS_IP}" >> ~/.ssh/known_hosts
      - name: Synchronize versioned worker
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/financial-agent-worker'"
          rsync -az --delete financial-agent-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/financial-agent-worker/"
      - name: Rebuild, restart and validate worker
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "\
            install -d -m 700 -o 10001 -g 10001 /opt/marketing-hub/agents/financial/codex-home \
            && if [ ! -s /opt/marketing-hub/agents/financial/codex-home/auth.json ]; then \
                 test -s /opt/growth-operator/codex-home/auth.json \
                 && install -m 600 -o 10001 -g 10001 /opt/growth-operator/codex-home/auth.json /opt/marketing-hub/agents/financial/codex-home/auth.json; \
                 if [ -s /opt/growth-operator/codex-home/config.toml ]; then \
                   install -m 600 -o 10001 -g 10001 /opt/growth-operator/codex-home/config.toml /opt/marketing-hub/agents/financial/codex-home/config.toml; \
                 fi; \
               fi \
            && test -s /opt/marketing-hub/agents/financial/codex-home/auth.json \
            || { printf '%s\n' 'Falha: autenticação Codex exclusiva do Agente Financeiro não foi provisionada.'; exit 1; }; \
            export BACKEND_URL=http://191.252.181.168 \
                   FINANCIAL_AGENT_CODEX_HOME=/opt/marketing-hub/agents/financial/codex-home \
                   MARKETING_HUB_REPOSITORY_PATH='${REPOSITORY_DIR}' \
                   COMMERCIAL_PLAN_ID=2 \
                   CODEX_MODEL=gpt-5.6-sol \
            && cd '${REPOSITORY_DIR}/financial-agent-worker' \
            && docker compose up -d --build --remove-orphans \
            && for attempt in \$(seq 1 12); do \
                 status=\$(docker inspect --format '{{.State.Status}}' financial-agent-worker-financial-agent-worker-1 2>/dev/null || true); \
                 codex_ready=false; \
                 health_body=; \
                 if [ \"\${status}\" = running ] \
                   && docker exec financial-agent-worker-financial-agent-worker-1 \
                        sh -lc 'test -w /home/financial-agent/.codex && codex login status' >/dev/null 2>&1; then \
                   codex_ready=true; \
                 fi; \
                 health_body=\$(curl -fsS http://127.0.0.1:8095/ops-financial-agent-observability-v1/health 2>/dev/null || true); \
                 printf 'readiness attempt=%s container=%s codex=%s health=%s\\n' \
                   \"\${attempt}\" \"\${status:-missing}\" \"\${codex_ready}\" \"\${health_body:-unavailable}\"; \
                 if [ \"\${status}\" = running ] && [ \"\${codex_ready}\" = true ] \
                   && printf '%s' \"\${health_body}\" | grep -Eq 'status.*UP'; then exit 0; fi; \
                 sleep 5; \
               done; \
            printf '%s\n' 'Falha: Agente Financeiro não ficou pronto com identidade Codex e health próprios.'; \
            docker compose logs --tail=150 financial-agent-worker; exit 1"
