name: Fix Opala harness catalog once

on:
  push:
    branches:
      - fix/opala-harness-catalog-20260915

permissions:
  contents: write

jobs:
  patch-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inserir contratos Opala no catálogo do harness
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/ads-service/src/main/resources/agent-harness/agent-harness-v2.json")
          text = path.read_text(encoding="utf-8")

          expected_paths = [
              "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/entry.md",
              "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/targeting.md",
              "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/creative.md",
              "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/checkout.md",
              "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/preparation-schema.json",
          ]

          if all(value in text for value in expected_paths):
              print("Catálogo já contém todos os contratos Opala.")
          else:
              anchor = '        { "artifactType": "OUTPUT_SCHEMA", "name": "Schema da correção funcional do protótipo privado PDE", "version": "v3", "path": "landing-generator-agent-worker/src/main/resources/prompts/pde-construction/v3/prototype-correction-schema.json", "description": "Contrato estruturado de diagnóstico, alternativas, evidências, nova versão e próxima etapa permitida." },'
              if anchor not in text:
                  raise SystemExit("Âncora do catálogo de Dédalo não encontrada; nenhuma alteração aplicada.")

              insertion = "\n".join([
                  '        { "artifactType": "PROMPT", "name": "Entrada da preparação comercial Opala", "version": "v1", "path": "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/entry.md", "description": "Contrato de entrada de Dédalo na preparação comercial específica do produto Opala." },',
                  '        { "artifactType": "PROMPT", "name": "Segmentação da preparação comercial Opala", "version": "v1", "path": "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/targeting.md", "description": "Materializa a segmentação comercial aprovada para a preparação do produto Opala." },',
                  '        { "artifactType": "PROMPT", "name": "Criativo da preparação comercial Opala", "version": "v1", "path": "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/creative.md", "description": "Materializa o criativo comercial do produto Opala sem redefinir a estratégia aprovada." },',
                  '        { "artifactType": "PROMPT", "name": "Checkout da preparação comercial Opala", "version": "v1", "path": "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/checkout.md", "description": "Materializa a superfície de checkout da preparação comercial do produto Opala." },',
                  '        { "artifactType": "OUTPUT_SCHEMA", "name": "Schema da preparação comercial Opala", "version": "v1", "path": "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/preparation-schema.json", "description": "Contrato estruturado da saída da preparação comercial Opala." },',
              ])
              text = text.replace(anchor, anchor + "\n" + insertion, 1)
              path.write_text(text, encoding="utf-8")

      - name: Validar JSON e presença dos cinco artefatos
        shell: bash
        run: |
          python -m json.tool backend/ads-service/src/main/resources/agent-harness/agent-harness-v2.json >/dev/null
          for f in entry.md targeting.md creative.md checkout.md preparation-schema.json; do
            grep -Fq "landing-generator-agent-worker/src/main/resources/prompts/opala-commercial/v1/$f" backend/ads-service/src/main/resources/agent-harness/agent-harness-v2.json
          done

      - name: Commitar somente a correção final
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-opala-harness-once.yml
          git rm -f .github/opala-harness-trigger.txt 2>/dev/null || true
          git add backend/ads-service/src/main/resources/agent-harness/agent-harness-v2.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "fix: catalogar contratos Opala no agent harness"
          git push origin HEAD:${GITHUB_REF_NAME}
