name: Frontend CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/deploy-containers.yml'
      - 'scripts/download-approved-pr-artifact.sh'
      - 'scripts/test-frontend-workflow-efficiency.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm ci
      - name: Type-check
        run: cd frontend && npm run typecheck
      - name: Build
        env:
          FRONTEND_BUILD_COMMIT: ${{ github.sha }}
          FRONTEND_IMAGE_TAG: ${{ github.sha }}
        run: cd frontend && npm run build
      - name: Registrar árvore Git aprovada
        run: git rev-parse 'HEAD^{tree}' > frontend/dist/approved-tree.sha
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1
