name: Frontend CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths: ['frontend/**']
  pull_request:
    paths: ['frontend/**']

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm ci
      - name: Type-check
        run: cd frontend && npm run typecheck
      - name: Build
        run: cd frontend && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7
      - name: Cleanup old frontend artifacts
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactName = 'frontend-build';
            const maxArtifactsToKeep = 3;
            const pageSize = 100;

            const activeArtifacts = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                per_page: pageSize,
                page,
              });

              if (!data.artifacts.length) {
                break;
              }

              for (const artifact of data.artifacts) {
                if (artifact.expired) {
                  continue;
                }

                if (artifact.name === artifactName) {
                  activeArtifacts.push(artifact);
                }
              }
            }

            if (activeArtifacts.length <= maxArtifactsToKeep) {
              core.info(`Found ${activeArtifacts.length} active artifacts. Nothing to delete.`);
              return;
            }

            activeArtifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const artifactsToDelete = activeArtifacts.slice(maxArtifactsToKeep);

            for (const artifact of artifactsToDelete) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted artifact ${artifact.name} (${artifact.id}) created at ${artifact.created_at}.`);
            }

            core.info(`Kept the ${maxArtifactsToKeep} most recent artifacts.`);


  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build debug and preview
        run: |
          cd frontend
          npm ci
          npm run build:debug
          npx vite preview --port 5000 --host & sleep 5
