      - "scripts/fixtures/agent-vps-disk/**"
      - "scripts/test-agent-vps-disk-workflows.mjs"
      - "scripts/ssh-keyscan-with-retry.sh"
      - "scripts/configure-vps-ssh-fallback.sh"
      - "scripts/install-actionlint.sh"
      - "scripts/run-actionlint.sh"
      - "scripts/actionlint-shellcheck.sh"
      - "scripts/test-actionlint-queue-support.sh"
      - "scripts/test-actionlint-shellcheck-policy.sh"
      - "scripts/publish-harness-cards.sh"
      - "scripts/test-publish-harness-cards.sh"
      - "scripts/test-docker-pull-with-transient-retry.sh"
      - "scripts/test-docker-compose-pull-with-transient-retry.sh"
      - "scripts/test-docker-compose-up-with-transient-retry.sh"
      - "scripts/test-docker-login-with-transient-retry.sh"
      - "scripts/test-wait-for-shared-vps-docker-capacity.sh"
      - "scripts/test-shared-vps-deploy-queue.sh"
      - "scripts/test-shared-vps-deploy-resilience.sh"
      - "scripts/test-ssh-keyscan-with-retry.sh"
      - "scripts/test-configure-vps-ssh-fallback.sh"
      - "scripts/test-configure-vps-ssh-fallback-e2e.sh"
      - "scripts/test-agent-vps-ssh-workflows.mjs"
      - "scripts/fixtures/vps-ssh/**"
      - "scripts/validate-premium-agents.sh"
      - "scripts/test-isolated-agent-codex-auth.sh"
      - "lead-portal/scripts/recreate-app-services.sh"
      - "lead-portal/scripts/test-recreate-app-services.sh"
      - "lead-portal/scripts/wait-for-app-services-health.sh"
      - "lead-portal/scripts/test-wait-for-app-services-health.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-actions-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar contratos dos workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Go para o Actionlint
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.1"
          cache: false

      - name: Validar suíte completa do backend antes do merge
        run: python3 scripts/test-backend-ci-workflow.py

      - name: Validar sintaxe dos contratos shell
        run: |
          bash -n scripts/docker-compose-pull-with-transient-retry.sh
          bash -n scripts/docker-compose-up-with-transient-retry.sh
          bash -n scripts/docker-login-with-transient-retry.sh
          bash -n scripts/docker-pull-with-transient-retry.sh
          bash -n scripts/docker-build-temporary-image.sh
          bash -n scripts/cleanup-temporary-docker-images.sh
          bash -n scripts/run-docker-homologation.sh
          bash -n scripts/test-docker-temporary-image-cleanup.sh
          bash -n scripts/test-docker-temporary-image-cleanup-e2e.sh
          bash -n scripts/wait-for-shared-vps-docker-capacity.sh
          bash -n scripts/ensure-agent-vps-disk-space.sh
          bash -n scripts/test-agent-image-bundle-e2e.sh
          node --check scripts/agent-image-bundle.mjs
          node --check scripts/test-agent-image-bundle.mjs
          node --check scripts/test-agent-image-workflows.mjs
          node --check scripts/coordinate-agent-deployment.mjs
          node --check scripts/coordinate-agent-deployment.test.mjs
          bash -n scripts/test-agent-vps-disk-space.sh
          bash -n scripts/test-agent-vps-disk-space-e2e.sh
          bash -n scripts/install-actionlint.sh
          bash -n scripts/run-actionlint.sh
          bash -n scripts/actionlint-shellcheck.sh
          bash -n scripts/test-actionlint-queue-support.sh
          bash -n scripts/test-actionlint-shellcheck-policy.sh
          bash -n scripts/publish-harness-cards.sh
          bash -n scripts/test-publish-harness-cards.sh
          bash -n scripts/test-docker-pull-with-transient-retry.sh
          bash -n scripts/test-docker-compose-pull-with-transient-retry.sh
          bash -n scripts/test-docker-compose-up-with-transient-retry.sh
          bash -n scripts/test-docker-login-with-transient-retry.sh
          bash -n scripts/test-wait-for-shared-vps-docker-capacity.sh
          bash -n scripts/detect-deployment-changes.sh
          bash -n scripts/test-deploy-transactional-contract.sh
          bash -n scripts/test-deployment-change-resume.sh
          bash -n scripts/read-frontend-build-revision.sh
          bash -n scripts/test-read-frontend-build-revision.sh
          bash -n scripts/test-backend-health-wait.sh
          bash -n scripts/ssh-keyscan-with-retry.sh
          bash -n scripts/configure-vps-ssh-fallback.sh
          bash -n scripts/test-shared-vps-deploy-queue.sh
          bash -n scripts/test-shared-vps-deploy-resilience.sh
          bash -n scripts/test-ssh-keyscan-with-retry.sh
          bash -n scripts/test-configure-vps-ssh-fallback.sh
          bash -n scripts/test-configure-vps-ssh-fallback-e2e.sh
          bash -n scripts/fixtures/vps-ssh/test.sh
          bash -n scripts/validate-premium-agents.sh
          bash -n scripts/test-isolated-agent-codex-auth.sh
          bash -n lead-portal/scripts/recreate-app-services.sh
          bash -n lead-portal/scripts/test-recreate-app-services.sh
          bash -n lead-portal/scripts/wait-for-app-services-health.sh
          bash -n lead-portal/scripts/test-wait-for-app-services-health.sh

      - name: Validar sintaxe dos workflows
        run: bash scripts/run-actionlint.sh

      - name: Validar consistência pública PDE com HTTP local
        run: python3 scripts/test-musa-pde-public-consistency.py

      - name: Validar raciocínio máximo de Dédalo e Apolo
        run: node --test scripts/test-agent-max-reasoning.mjs

      - name: Validar suporte do Actionlint à fila ampliada
        run: bash scripts/test-actionlint-queue-support.sh

      - name: Validar política ShellCheck do Actionlint
        run: bash scripts/test-actionlint-shellcheck-policy.sh

      - name: Validar publicação automática dos cards do Harness
        run: bash scripts/test-publish-harness-cards.sh

      - name: Validar retry transitório do Docker
        run: bash scripts/test-docker-pull-with-transient-retry.sh

      - name: Validar contrato da limpeza Docker temporária
        run: bash scripts/test-docker-temporary-image-cleanup.sh

      - name: Validar limpeza Docker temporária na engine real
        run: bash scripts/test-docker-temporary-image-cleanup-e2e.sh

      - name: Validar retry transitório do Docker Compose
        run: bash scripts/test-docker-compose-pull-with-transient-retry.sh

      - name: Validar login transitório do registry
        run: bash scripts/test-docker-login-with-transient-retry.sh

      - name: Validar reconciliação transitória do Docker Compose
        run: bash scripts/test-docker-compose-up-with-transient-retry.sh

      - name: Validar capacidade do VPS compartilhado
        run: bash scripts/test-wait-for-shared-vps-docker-capacity.sh

      - name: Validar fila do host compartilhado
        run: bash scripts/test-shared-vps-deploy-queue.sh

      - name: Validar coordenação com o deploy da aplicação
        run: node --test scripts/coordinate-agent-deployment.test.mjs

      - name: Validar deploy transacional da aplicação
        run: |
          bash scripts/test-deploy-transactional-contract.sh
          bash scripts/test-deployment-change-resume.sh

      - name: Validar resiliência do host compartilhado
        run: bash scripts/test-shared-vps-deploy-resilience.sh

      - name: Validar fallback seguro das credenciais SSH
        run: bash scripts/test-configure-vps-ssh-fallback.sh

      - name: Validar autenticação em todos os publicadores dos agentes
        run: |
          node scripts/test-agent-vps-ssh-workflows.mjs
          bash scripts/validate-premium-agents.sh

      - name: Validar SSH, SCP e rsync com servidor local isolado
        run: bash scripts/test-configure-vps-ssh-fallback-e2e.sh

      - name: Validar recuperação limitada de disco dos agentes
        run: |
          bash scripts/test-agent-vps-disk-space.sh
          node scripts/test-agent-vps-disk-workflows.mjs

      - name: Validar preservação de imagens e containers na engine real
        run: bash scripts/test-agent-vps-disk-space-e2e.sh

      - name: Validar navegador versionado de Argos e Psique
        run: node --test scripts/test-agent-browser-version-contract.mjs

      - name: Validar transporte da imagem aprovada
        run: |
          node --test scripts/test-agent-image-bundle.mjs scripts/test-agent-image-workflows.mjs
          node scripts/test-agent-executor-admin-controller.mjs

      - name: Validar carga Docker e Compose sem rebuild
        run: bash scripts/test-agent-image-bundle-e2e.sh
