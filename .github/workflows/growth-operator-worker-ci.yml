name: Growth Operator Worker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: growth-operator-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: growth-operator-worker/pom.xml

      - name: Run unit tests
        working-directory: growth-operator-worker
        run: mvn -B test

      - name: Validate container build
        run: docker build -t marketing-hub/growth-operator-worker:${{ github.sha }} growth-operator-worker

  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Add Growth Operator VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}

      - name: Trust Growth Operator VPS
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${VPS_IP}" >> ~/.ssh/known_hosts

      - name: Synchronize versioned repository
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude 'node_modules/' \
            ./ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/"
          ssh "${VPS_USER}@${VPS_IP}" "printf '%s\n' '${GITHUB_SHA}' > '${REPOSITORY_DIR}/.deployed-revision'"

      - name: Rebuild and restart worker
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "\
            cd '${REPOSITORY_DIR}/growth-operator-worker' \
            && CODEX_HOME=/root/.codex \
               BACKEND_URL=http://191.252.181.168 \
               MARKETING_HUB_URL=http://191.252.181.168 \
               MARKETING_HUB_REPOSITORY_HOST='${REPOSITORY_DIR}' \
               COMMERCIAL_PLAN_ID=2 \
               CODEX_MODEL=gpt-5.6-sol \
               GROWTH_OPERATOR_IMAGE=marketing-hub/growth-operator-worker:${GITHUB_SHA} \
               docker compose up -d --build --remove-orphans \
            && for attempt in \$(seq 1 12); do \
                 status=\$(docker inspect --format '{{.State.Status}}' growth-operator-worker-growth-operator-worker-1 2>/dev/null || true); \
                 [ \"\${status}\" = running ] && exit 0; \
                 sleep 5; \
               done; \
            docker compose logs --tail=150 growth-operator-worker; \
            exit 1"

      - name: Report deployed revision
        run: |
          ssh "${VPS_USER}@${VPS_IP}" "\
            printf 'revision=' && cat '${REPOSITORY_DIR}/.deployed-revision' \
            && printf 'container=' \
            && docker inspect growth-operator-worker-growth-operator-worker-1 \
              --format 'image={{.Config.Image}} started={{.State.StartedAt}} status={{.State.Status}}'"
