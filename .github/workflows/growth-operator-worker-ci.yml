name: Growth Operator Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - growth-operator-worker/**
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
  pull_request:
    paths:
      - growth-operator-worker/**
      - .github/workflows/growth-operator-worker-ci.yml
      - config/agents/codex-agent-health-compliance.json
      - scripts/test-codex-agent-health-standard.mjs
  workflow_run:
    workflows: ["Build & Deploy containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_sha:
        description: "Revisão esperada pelo reconciliador automático; vazio preserva a execução normal"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    if: github.event_name != 'workflow_run'
    name: Test worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm matching application deployment was enqueued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_REGISTRATION_TIMEOUT_SECONDS: 120
        run: node scripts/coordinate-agent-deployment.mjs assert-application-run deploy-containers.yml
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: growth-operator-worker/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        working-directory: growth-operator-worker
        run: mvn -B test

      - name: Validate entity-grounded MCP memory
        working-directory: growth-operator-worker
        run: node --test src/test/mcp/*.test.mjs

      - name: Validate container build
        run: docker build --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -t marketing-hub/growth-operator-worker:${{ github.sha }} growth-operator-worker

      - name: Package tested images
        if: github.event_name != 'pull_request'
        run: node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images" marketing-hub/growth-operator-worker:${{ github.sha }}
      - name: Store tested images for this run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  source-run:
    name: Resolve tested worker revision
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.resolve.outputs.required }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        name: Resolve exact tested source run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          APP_DEPLOY_EVENT: ${{ github.event.workflow_run.event }}
          APP_DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AGENT_SOURCE_WAIT_TIMEOUT_SECONDS: 6900
        run: node scripts/coordinate-agent-deployment.mjs resolve-source-run growth-operator-worker-ci.yml

  deploy:
    name: Deploy worker
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.test.result == 'success') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.source-run.result == 'success' &&
        needs.source-run.outputs.required == 'true'))
    runs-on: ubuntu-latest
    needs:
      - test
      - source-run
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    env:
      DEPLOY_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SOURCE_SHA }}
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - uses: actions/download-artifact@v4
        with:
          name: agent-images-${{ env.DEPLOY_SOURCE_SHA }}
          path: ${{ runner.temp }}/agent-images/
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_run_id || github.run_id }}
      - name: Verify tested images
        run: node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images" marketing-hub/growth-operator-worker:${DEPLOY_SOURCE_SHA}

      - name: Configure authenticated agent VPS SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$VPS_IP" "$VPS_USER" "$GITHUB_ENV"
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
      - name: Load tested images without rebuilding
        timeout-minutes: 20
        run: node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images" "${VPS_USER}@${VPS_IP}" marketing-hub/growth-operator-worker:${DEPLOY_SOURCE_SHA}
      - name: Synchronize versioned repository
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/growth-operator-worker' '${REPOSITORY_DIR}/scripts'"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete growth-operator-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/growth-operator-worker/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-app-server-device-login.mjs "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"

      - name: Start validated worker
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "\
            install -d -o 10001 -g 10001 /opt/growth-operator/agents/growth-operator/codex-home \
            && export GROWTH_OPERATOR_CODEX_HOME=/opt/growth-operator/agents/growth-operator/codex-home \
                   BACKEND_URL=http://191.252.181.168 \
                   MARKETING_HUB_URL=http://191.252.181.168 \
                   MARKETING_HUB_REPOSITORY_HOST='${REPOSITORY_DIR}' \
                   COMMERCIAL_PLAN_ID=2 \
                   CODEX_MODEL=gpt-6.1-sol \
                   AGENT_BUILD_REFERENCE='${DEPLOY_SOURCE_SHA}' \
                   GROWTH_OPERATOR_IMAGE=marketing-hub/growth-operator-worker:${DEPLOY_SOURCE_SHA} \
            && cd '${REPOSITORY_DIR}/growth-operator-worker' \
            && docker compose up -d --no-build --pull never --remove-orphans \
            && for attempt in \$(seq 1 12); do \
                 status=\$(docker inspect --format '{{.State.Status}}' growth-operator-worker-growth-operator-worker-1 2>/dev/null || true); \
                 [ \"\${status}\" = running ] \
                   && curl -fsS http://127.0.0.1:8094/ops-growth-operator-observability-v1/health \
                        | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' \
                   && curl -fsS http://127.0.0.1:8094/ops-growth-operator-observability-v1/logfile >/dev/null \
                   && docker exec growth-operator-worker-growth-operator-worker-1 node /app/agent-health-report.mjs \
                   && exit 0; \
                 sleep 5; \
               done; \
            docker compose logs --tail=150 growth-operator-worker; \
            exit 1"

      - name: Report deployed revision
        run: |
          deployed_image="$(ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" \
            "docker inspect growth-operator-worker-growth-operator-worker-1 --format '{{.Config.Image}}'")"
          test "${deployed_image}" = "marketing-hub/growth-operator-worker:${DEPLOY_SOURCE_SHA}"
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" \
            "docker inspect growth-operator-worker-growth-operator-worker-1 \
              --format 'image={{.Config.Image}} started={{.State.StartedAt}} status={{.State.Status}}'"
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
