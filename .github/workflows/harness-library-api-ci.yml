name: CI - Harness Library API

on:
  pull_request:
    branches: [main]
    paths:
      - "harness-library-api/**"
      - "backend/ads-service/src/main/java/com/marketinghub/researchintelligence/**"
      - "backend/ads-service/src/main/java/com/marketinghub/repository/jpa/researchintelligence/**"
      - "backend/ads-service/src/test/java/com/marketinghub/researchintelligence/**"
      - "backend/ads-service/src/main/resources/db/changelog/**"
      - "docs/canonical/audio-video-studio-canon.v1.md"
      - "docs/homologacao/harness-library-api-v1.md"
      - "docs/swagger/harness-library-api-swagger.yaml"
      - ".github/workflows/harness-library-api-ci.yml"
  push:
    branches: [main]
    paths:
      - "harness-library-api/**"
      - "backend/ads-service/src/main/java/com/marketinghub/researchintelligence/**"
      - "backend/ads-service/src/main/java/com/marketinghub/repository/jpa/researchintelligence/**"
      - "backend/ads-service/src/test/java/com/marketinghub/researchintelligence/**"
      - "backend/ads-service/src/main/resources/db/changelog/**"
      - ".github/workflows/harness-library-api-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar o container somente em loopback no host escolhido"
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/harness-library-api

jobs:
  test-gateway:
    name: Test gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run gateway tests and package
        working-directory: harness-library-api
        run: mvn -B verify
      - name: Validate image and deployment contract
        run: bash harness-library-api/scripts/validate-delivery-contract.sh

  test-backend-contract:
    name: Test backend contract on MySQL 5.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run research intelligence tests
        working-directory: backend/ads-service
        run: >-
          mvn -B test
          -Dtest=ResearchIntelligenceServiceTest,ResearchIntelligenceControllerTest,ResearchIntelligenceCardManagementControllerTest,ResearchIntelligenceInternalRequestVerifierTest,ResearchIntelligenceCardManagementServiceTest
      - name: Validate dedicated Liquibase migration on MySQL 5.7
        env:
          HARNESS_LIBRARY_MYSQL57_PROJECT: harness-library-ci-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-harness-library-api-mysql57.sh

  docker-build:
    name: Build immutable container
    runs-on: ubuntu-latest
    needs: test-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: >-
          docker build
          --build-arg BUILD_REVISION=${GITHUB_SHA}
          --tag harness-library-api:test
          harness-library-api
      - name: Validate non-root runtime contract
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect harness-library-api:test --format '{{.Config.User}}')"
          if [ "${configured_user}" != "10001:10001" ]; then
            echo "A imagem deve executar com a identidade fixa 10001:10001." >&2
            exit 1
          fi
          bash harness-library-api/scripts/validate-secret-file-runtime.sh harness-library-api:test

  test-e2e:
    name: Test complete JSON lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run isolated backend and gateway lifecycle
        env:
          HARNESS_LIBRARY_E2E_PROJECT: harness-library-e2e-${{ github.run_id }}
        run: bash harness-library-api/scripts/homologate-local.sh

  publish-image:
    name: Publish immutable image
    runs-on: ubuntu-latest
    needs: [test-gateway, test-backend-contract, docker-build, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: harness-library-api
          file: harness-library-api/Dockerfile
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-loopback:
    name: Deploy loopback origin on selected host
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-harness-library-api-163-245-200-7
      queue: max
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 163.245.200.7
      DEPLOY_USER: root
      REMOTE_PATH: /root/harness-library-api
      IMAGE: ghcr.io/${{ github.repository }}/harness-library-api:sha-${{ github.sha }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      HARNESS_LIBRARY_API_KEY: ${{ secrets.HARNESS_LIBRARY_API_KEY }}
      HARNESS_LIBRARY_INTERNAL_SIGNING_KEY: ${{ secrets.HARNESS_LIBRARY_INTERNAL_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test "${#HARNESS_LIBRARY_API_KEY}" -ge 32 || { echo "HARNESS_LIBRARY_API_KEY ausente ou curta." >&2; exit 1; }
          test "${#HARNESS_LIBRARY_INTERNAL_SIGNING_KEY}" -ge 32 || { echo "HARNESS_LIBRARY_INTERNAL_SIGNING_KEY ausente ou curta." >&2; exit 1; }
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.PDE_PLATFORM_VPS_SSH_KEY != '' && secrets.PDE_PLATFORM_VPS_SSH_KEY || secrets.GROWTH_OPERATOR_VPS_SSH_KEY != '' && secrets.GROWTH_OPERATOR_VPS_SSH_KEY || secrets.VPS_SSH_CHAVE }}
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_KEY}" || { echo "Chave SSH do host selecionado ausente." >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 30 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          echo "SSH_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -o ConnectTimeout=30" >> "${GITHUB_ENV}"
      - name: Sync deployment descriptor
        run: |
          set -euo pipefail
          ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "install -m 700 -d '${REMOTE_PATH}'"
          rsync -az -e "ssh ${SSH_ARGS}" \
            harness-library-api/docker-compose.deploy.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}/docker-compose.deploy.yml"
      - name: Provision protected secrets
        run: |
          set -euo pipefail
          ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'install -m 700 -d /root/infra/harness-library/secrets'
          printf '%s' "${HARNESS_LIBRARY_API_KEY}" \
            | ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
                'umask 077; dd of=/root/infra/harness-library/secrets/api_key.tmp status=none; test "$(wc -c < /root/infra/harness-library/secrets/api_key.tmp)" -ge 32; mv /root/infra/harness-library/secrets/api_key.tmp /root/infra/harness-library/secrets/api_key; chown 10001:10001 /root/infra/harness-library/secrets/api_key; chmod 0400 /root/infra/harness-library/secrets/api_key'
          printf '%s' "${HARNESS_LIBRARY_INTERNAL_SIGNING_KEY}" \
            | ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
                'umask 077; dd of=/root/infra/harness-library/secrets/internal_signing_key.tmp status=none; test "$(wc -c < /root/infra/harness-library/secrets/internal_signing_key.tmp)" -ge 32; mv /root/infra/harness-library/secrets/internal_signing_key.tmp /root/infra/harness-library/secrets/internal_signing_key; chown 10001:10001 /root/infra/harness-library/secrets/internal_signing_key; chmod 0400 /root/infra/harness-library/secrets/internal_signing_key'
      - name: Deploy immutable image in loopback
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" \
            | ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "set -euo pipefail; registry_auth_dir=\$(mktemp -d /tmp/harness-library-ghcr.XXXXXX); trap 'rm -rf -- \"\${registry_auth_dir}\"' EXIT; export DOCKER_CONFIG=\"\${registry_auth_dir}\"; docker login '${REGISTRY}' -u '${GHCR_USERNAME}' --password-stdin; cd '${REMOTE_PATH}'; export HARNESS_LIBRARY_API_IMAGE='${IMAGE}'; export COMPOSE_PROJECT_NAME=marketinghub-harness-library-api; docker compose -f docker-compose.deploy.yml pull; docker compose -f docker-compose.deploy.yml up -d --remove-orphans --wait --wait-timeout 120"
      - name: Validate health and signed backend handshake
        run: |
          set -euo pipefail
          ssh ${SSH_ARGS} -N -L 18103:127.0.0.1:8103 "${DEPLOY_USER}@${DEPLOY_HOST}" &
          tunnel_pid=$!
          trap 'kill ${tunnel_pid} >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'docker exec harness-library-api curl -fsS --max-time 5 http://127.0.0.1:9103/actuator/health/liveness' \
              >/dev/null; then
              break
            fi
            test "${attempt}" -lt 20 || { echo "Health do gateway não respondeu." >&2; exit 1; }
            sleep 3
          done
          curl -fsS --max-time 20 \
            -H "X-API-Key: ${HARNESS_LIBRARY_API_KEY}" \
            -H "X-Actor: github-actions" \
            'http://127.0.0.1:18103/v1/cards?limit=1' >/dev/null
          published_binding="$(ssh ${SSH_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "docker port harness-library-api 8103/tcp")"
          case "${published_binding}" in
            127.0.0.1:8103) ;;
            *) echo "Porta publicada fora do loopback: ${published_binding}" >&2; exit 1 ;;
          esac
