name: Canonical Image Model Contract

on:
  push:
    branches: [main]
    paths:
      - ".env.example"
      - ".github/workflows/image-model-contract.yml"
      - ".github/workflows/meta-ad-approver-worker-ci.yml"
      - "scripts/validate-canonical-image-model.sh"
      - "scripts/test-canonical-image-model.py"
      - "ai-worker/**"
      - "backend/ads-service/src/main/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "feo/**"
      - "frontend/src/**"
      - "landing-generator-agent-worker/src/main/resources/prompts/**"
      - "lead-portal/backend/src/main/**"
      - "lead-portal-payments-service/**"
      - "meta-ad-approver-worker/**"
      - "video-management-service/**"
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/image-model-contract.yml"
      - ".github/workflows/meta-ad-approver-worker-ci.yml"
      - "scripts/validate-canonical-image-model.sh"
      - "scripts/test-canonical-image-model.py"
      - "ai-worker/**"
      - "backend/ads-service/src/main/**"
      - "deploy/**"
      - "docker-compose.yml"
      - "feo/**"
      - "frontend/src/**"
      - "landing-generator-agent-worker/src/main/resources/prompts/**"
      - "lead-portal/backend/src/main/**"
      - "lead-portal-payments-service/**"
      - "meta-ad-approver-worker/**"
      - "video-management-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-model-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar modelo visual canônico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
      - name: Instalar dependências do verificador e dos testes
        run: |
          if ! command -v rg >/dev/null || ! command -v python3 >/dev/null; then
            apt_network=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            if ! timeout --kill-after=5s 60s sudo apt-get "${apt_network[@]}" install --yes --no-install-recommends ripgrep python3; then
              timeout --kill-after=5s 60s sudo apt-get "${apt_network[@]}" update
              timeout --kill-after=5s 60s sudo apt-get "${apt_network[@]}" install --yes --no-install-recommends ripgrep python3
            fi
          fi
          command -v rg
          command -v python3
      - name: Testar proteção e diagnóstico do contrato de imagens
        run: python3 scripts/test-canonical-image-model.py -v
      - name: Impedir regressão para modelos visuais aposentados
        run: bash scripts/validate-canonical-image-model.sh
