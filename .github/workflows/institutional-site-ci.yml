name: CI – Institutional Site

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'institutional-site/**'
      - '.github/workflows/institutional-site-ci.yml'
  pull_request:
    paths:
      - 'institutional-site/**'
      - '.github/workflows/institutional-site-ci.yml'

permissions:
  contents: read

env:
  DEPLOY_HOST: 191.252.102.54
  DEPLOY_USER: ${{ secrets.INSTITUTIONAL_SITE_DEPLOY_USER != '' && secrets.INSTITUTIONAL_SITE_DEPLOY_USER || 'root' }}
  APP_DIR: ${{ secrets.INSTITUTIONAL_SITE_APP_DIR != '' && secrets.INSTITUTIONAL_SITE_APP_DIR || '/root/institucional-site' }}
  SITE_URL: https://vitrineproduto.online
  SITE_HEALTH_URL: https://vitrineproduto.online/healthz
  SITE_HTTP_URL: http://vitrineproduto.online
  INSTITUTIONAL_SITE_NETWORK: ${{ secrets.INSTITUTIONAL_SITE_NETWORK != '' && secrets.INSTITUTIONAL_SITE_NETWORK || 'public-net' }}
  INSTITUTIONAL_SITE_NETWORK_EXTERNAL: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build institutional-site image
        run: docker build -t marketinghub/institutional-site:ci institutional-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts
      - name: Sync institutional-site files
        run: |
          rsync -avz --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            institutional-site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${APP_DIR}/"
      - name: Ensure shared Docker network exists
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker network inspect ${INSTITUTIONAL_SITE_NETWORK} >/dev/null 2>&1 || docker network create ${INSTITUTIONAL_SITE_NETWORK}"
      - name: Deploy institutional-site
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${APP_DIR} \
            && export INSTITUTIONAL_SITE_NETWORK='${INSTITUTIONAL_SITE_NETWORK}' \
            && export INSTITUTIONAL_SITE_NETWORK_EXTERNAL='${INSTITUTIONAL_SITE_NETWORK_EXTERNAL}' \
            && docker compose build institutional-site \
            && docker compose up -d institutional-site"
      - name: Validate public URL
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused ${SITE_URL}/ > /dev/null
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused ${SITE_HEALTH_URL}
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused --head --location ${SITE_HTTP_URL}/
