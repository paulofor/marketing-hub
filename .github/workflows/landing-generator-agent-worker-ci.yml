name: Landing Generator Agent Worker CI

on:
  workflow_dispatch:
  push:
    paths:
      - "landing-generator-agent-worker/**"
      - "backend/ads-service/src/main/java/com/marketinghub/geralanding/agent/**"
      - ".github/workflows/landing-generator-agent-worker-ci.yml"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testar worker
        working-directory: landing-generator-agent-worker
        run: mvn -B verify
      - name: Validar arquitetura premium
        run: bash scripts/validate-premium-agents.sh
      - name: Construir imagem versionada
        working-directory: landing-generator-agent-worker
        run: docker build -t marketing-hub/landing-generator-agent-worker:${{ github.sha }} .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Preparar identidade e subir no mesmo host
        shell: bash
        run: |
          export LANDING_GENERATOR_CODEX_HOME=/opt/marketing-hub/agents/landing-generator/codex-home \
                 MARKETING_HUB_REPOSITORY_HOST="${GITHUB_WORKSPACE}" \
                 CODEX_MODEL=gpt-5.6-sol \
          && sudo install -d -m 700 -o 10001 -g 10001 "${LANDING_GENERATOR_CODEX_HOME}" \
          && if [ ! -s "${LANDING_GENERATOR_CODEX_HOME}/auth.json" ]; then sudo install -m 600 -o 10001 -g 10001 /opt/growth-operator/codex-home/auth.json "${LANDING_GENERATOR_CODEX_HOME}/auth.json"; fi \
          && if [ ! -s "${LANDING_GENERATOR_CODEX_HOME}/config.toml" ]; then sudo install -m 600 -o 10001 -g 10001 /opt/growth-operator/codex-home/config.toml "${LANDING_GENERATOR_CODEX_HOME}/config.toml"; fi \
          && docker compose -f landing-generator-agent-worker/docker-compose.yml build \
          && docker compose -f landing-generator-agent-worker/docker-compose.yml up -d \
          && docker compose -f landing-generator-agent-worker/docker-compose.yml exec -T landing-generator-agent-worker codex login status \
          && curl --fail --retry 24 --retry-delay 5 http://127.0.0.1:8100/ops-landing-generator-observability-v1/health
