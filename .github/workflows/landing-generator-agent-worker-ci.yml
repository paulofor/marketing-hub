name: Landing Generator Agent Worker CI

on:
  workflow_dispatch:
    inputs:
      recovery_sha:
        description: "Revisão esperada pelo reconciliador automático; vazio preserva a execução normal"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "landing-generator-agent-worker/**"
      - "backend/ads-service/src/main/java/com/marketinghub/geralanding/agent/**"
      - "scripts/test-isolated-agent-codex-auth.sh"
      - "scripts/codex-app-server-device-login.mjs"

concurrency:
  group: landing-generator-agent-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testar worker
        working-directory: landing-generator-agent-worker
        run: bash ../scripts/maven-verify-with-transient-retry.sh
      - name: Validar retry transitório do Maven
        run: bash scripts/test-maven-verify-with-transient-retry.sh
      - name: Validar arquitetura premium
        run: bash scripts/validate-premium-agents.sh
      - name: Construir imagem versionada
        working-directory: landing-generator-agent-worker
        run: docker build --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -t marketing-hub/landing-generator-agent-worker:${{ github.sha }} .

      - name: Package tested images
        if: github.event_name != 'pull_request'
        run: node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images" marketing-hub/landing-generator-agent-worker:${{ github.sha }}
      - name: Store tested images for this run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - uses: actions/download-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
      - name: Verify tested images
        run: node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images" marketing-hub/landing-generator-agent-worker:${{ github.sha }}
      - name: Configure authenticated agent VPS SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$VPS_IP" "$VPS_USER" "$GITHUB_ENV"
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
      - name: Load tested images without rebuilding
        timeout-minutes: 20
        run: node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images" "${VPS_USER}@${VPS_IP}" marketing-hub/landing-generator-agent-worker:${{ github.sha }}
      - name: Sincronizar repositório versionado
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}/landing-generator-agent-worker' '${REPOSITORY_DIR}/scripts'"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete landing-generator-agent-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/landing-generator-agent-worker/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-app-server-device-login.mjs "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"
      - name: Subir executor com sessão individual
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${VPS_USER}@${VPS_IP}" "
            install -d -o 10001 -g 10001 /opt/growth-operator/agents/landing-generator/codex-home \
            && export LANDING_GENERATOR_CODEX_HOME=/opt/growth-operator/agents/landing-generator/codex-home \
                      BACKEND_URL=http://191.252.181.168 \
                      MARKETING_HUB_URL=http://191.252.181.168 \
                      MARKETING_HUB_REPOSITORY_HOST='${REPOSITORY_DIR}' \
                      CODEX_MODEL=gpt-5.6-sol \
                      CODEX_REASONING_EFFORT=max \
                      AGENT_BUILD_REFERENCE='${GITHUB_SHA}' \
                      LANDING_GENERATOR_AGENT_IMAGE=marketing-hub/landing-generator-agent-worker:${GITHUB_SHA} \
            && cd '${REPOSITORY_DIR}/landing-generator-agent-worker' \
            && docker compose up -d --no-build --pull never --remove-orphans \
            && for attempt in \$(seq 1 24); do \
                 echo \"Aguardando saúde do executor (tentativa \${attempt}/24)\"; \
                 curl -fsS http://127.0.0.1:8100/ops-landing-generator-observability-v1/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' \
                   && docker compose exec -T landing-generator-agent-worker node /app/agent-health-report.mjs \
                   && exit 0; \
                 sleep 5; \
               done; \
            docker compose logs --tail=150 landing-generator-agent-worker; exit 1"
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
