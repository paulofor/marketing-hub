name: CI – Lead Portal

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'lead-portal/**'
      - '.github/workflows/lead-portal-ci.yml'
  pull_request:
    paths:
      - 'lead-portal/**'
      - '.github/workflows/lead-portal-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-portal/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-portal/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lead-portal/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Validate frontend cache and MIME contract
        working-directory: .
        run: lead-portal/scripts/test-frontend-cache-contract.sh

  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: latest
      IMAGE_SHA_TAG: ${{ github.sha }}
    outputs:
      image-tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image pipeline production contract
        run: |
          docker compose \
            -f lead-portal/docker-compose.yml \
            -f lead-portal/docker-compose.deploy.yml \
            config | grep -F 'LEAD_PORTAL_IMAGE_PIPELINE_ENABLED: "true"' >/dev/null
      - name: Validate runtime healthcheck contract
        run: lead-portal/scripts/test-runtime-health-contract.sh
      - name: Validate production deploy trigger contract
        run: lead-portal/scripts/test-deploy-trigger-contract.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/lead-portal-backend
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_SHA_TAG }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: lead-portal/backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/lead-portal-backend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/lead-portal-backend:buildcache,mode=max
      - name: Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/lead-portal-frontend
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_SHA_TAG }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: lead-portal/frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/lead-portal-frontend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/lead-portal-frontend:buildcache,mode=max
      - name: Expose image tag
        id: image_tag
        run: echo "value=${IMAGE_SHA_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - backend
      - frontend
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps-191-252-120-96
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 191.252.120.96
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.LEAD_PORTAL_REMOTE_PATH || '/root/lead-portal' }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ needs.docker.outputs['image-tag'] }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Ensure Docker runtime on VPS
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE_DOCKER_BOOTSTRAP'
          set -euo pipefail
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            systemctl enable --now docker >/dev/null 2>&1 || true
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release
          install -m 0755 -d /etc/apt/keyrings
          if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          fi
          chmod a+r /etc/apt/keyrings/docker.gpg
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker
          docker version
          docker compose version
          REMOTE_DOCKER_BOOTSTRAP
      - name: Prepare remote directory
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
      - name: Sync Lead Portal to VPS
        run: |
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --exclude '.git/' \
            --exclude 'backend/target/' \
            --exclude 'frontend/node_modules/' \
            lead-portal/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Publish stack
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "${REMOTE_PATH}" \
            "${GHCR_TOKEN}" \
            "${IMAGE_REGISTRY}" \
            "${GHCR_USERNAME}" \
            "${IMAGE_NAMESPACE}" \
            "${IMAGE_TAG}" \
            "${GITHUB_SHA}" \
            "${CLARITY_PROJECT_ID}" <<'REMOTE_PUBLISH'
          set -euo pipefail

          remote_path="$1"
          ghcr_token="$2"
          image_registry="$3"
          ghcr_username="$4"
          image_namespace="$5"
          image_tag="$6"
          github_sha="$7"
          clarity_project_id="${8:-}"

          cd "$remote_path"
          publish_diagnostics() {
            exit_code="$?"
            if [ "$exit_code" -ne 0 ]; then
              docker compose -f docker-compose.yml -f docker-compose.deploy.yml ps || true
              docker logs --tail 200 lead-portal-backend || true
              docker logs --tail 100 lead-portal-frontend || true
              docker logs --tail 100 lead-portal-proxy || true
            fi
            exit "$exit_code"
          }
          trap publish_diagnostics EXIT
          if [ -n "$ghcr_token" ]; then
            printf '%s' "$ghcr_token" | docker login "$image_registry" -u "$ghcr_username" --password-stdin
          fi
          export LEAD_PORTAL_BACKEND_IMAGE="${image_namespace}/lead-portal-backend:${image_tag}"
          export LEAD_PORTAL_FRONTEND_IMAGE="${image_namespace}/lead-portal-frontend:${image_tag}"
          export CLARITY_PROJECT_ID="${clarity_project_id}"
          docker network inspect public-net >/dev/null 2>&1 || docker network create public-net
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull
          port_owner_ids="$({
            docker ps --filter publish=80 -q
            docker ps --filter publish=443 -q
          } | sort -u)"
          for container_id in $port_owner_ids; do
            container_name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##')"
            compose_service="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container_id")"
            compose_workdir="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container_id")"
            case "$container_name:$compose_service:$compose_workdir" in
              lead-portal*:proxy:*|*:proxy:"$remote_path")
                docker rm -f "$container_id"
                ;;
              *)
                echo "A porta pública está ocupada por container fora do escopo do Lead Portal: $container_name" >&2
                exit 1
                ;;
            esac
          done
          docker rm -f lead-portal-proxy lead-portal-proxy-1 lead-portal_proxy_1 >/dev/null 2>&1 || true
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d

          index_html="$(docker exec lead-portal-frontend cat /usr/share/nginx/html/index.html)"
          asset_path="$(printf '%s' "$index_html" | sed -n 's/.*src="\([^\"]*\.js\)".*/\1/p' | head -n 1)"
          test -n "$asset_path"
          docker exec lead-portal-frontend test -f "/usr/share/nginx/html${asset_path}"
          test "$(curl -fsS -o /dev/null -w '%{http_code}:%{content_type}' "https://oportunidadebrasil.shop${asset_path}")" = '200:application/javascript'
          for probe in 1 2 3 4 5; do
            curl -fsS "https://oportunidadebrasil.shop/flows/exp-81-gerasalespage-v1?mh_test=1&deploy-probe=${github_sha}-${probe}" | grep -F 'data-mh-landing-analytics' >/dev/null
          done
          if [ -n "${clarity_project_id}" ]; then
            curl -fsS "https://oportunidadebrasil.shop/flows/exp-81-gerasalespage-v1?deploy-clarity=${github_sha}" | grep -F 'data-mh-clarity-analytics="aggregate-v1"' >/dev/null
          fi
          test "$(curl -fsS -o /dev/null -w '%{http_code}' 'https://oportunidadebrasil.shop/flows/exp-81-gerasalespage-v1?mh_test=1&deploy-health=1')" = '200'
          docker image prune -af
          trap - EXIT
          REMOTE_PUBLISH
      - name: Clean build artifacts from repository
        if: always()
        run: |
          git clean -ffdx -- \
            lead-portal/backend/target \
            lead-portal/frontend/dist \
            lead-portal/frontend/node_modules \
            lead-portal/frontend/.vite \
            lead-portal/frontend/.turbo \
            lead-portal/frontend/.parcel-cache \
            lead-portal/frontend/tsconfig.node.tsbuildinfo
