name: CI – Lead Portal Payments Service

on:
  push:
    branches: ["main", "master"]
    paths:
      - "lead-portal-payments-service/**"
      - ".github/workflows/lead-portal-payments-ci.yml"
  pull_request:
    paths:
      - "lead-portal-payments-service/**"
      - ".github/workflows/lead-portal-payments-ci.yml"
  workflow_dispatch:
    inputs:
      issue_clubemusa_certificate:
        description: "Emitir/renovar certificado do Clube MUSA depois que o DNS apontar para este VPS"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      issue_digicomdigital_certificate:
        description: "Emitir/renovar certificado do site institucional Digicom Digital"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-portal-payments-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: latest
      IMAGE_SHA_TAG: ${{ github.sha }}
    outputs:
      image-tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/lead-portal-payments-service
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_SHA_TAG }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: lead-portal-payments-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/lead-portal-payments-service:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/lead-portal-payments-service:buildcache,mode=max
      - name: Expose image tag
        id: image_tag
        run: echo "value=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs:
      - test
      - docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      # O institucional permanece no host legado que recebe o DNS de
      # digicomdigital.com.br. Os PDEs do Clube MUSA continuam no host canônico.
      DEPLOY_HOST: ${{ inputs.issue_digicomdigital_certificate == 'true' && '191.252.102.54' || '163.245.200.7' }}
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.LEAD_PORTAL_PAYMENTS_REMOTE_PATH || '/root/lead-portal-payments-service' }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ needs.docker.outputs['image-tag'] }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      LEAD_PORTAL_PAYMENTS_NETWORK: ${{ secrets.LEAD_PORTAL_PAYMENTS_NETWORK != '' && secrets.LEAD_PORTAL_PAYMENTS_NETWORK || 'public-net' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate certificate target
        if: inputs.issue_clubemusa_certificate == 'true' && inputs.issue_digicomdigital_certificate == 'true'
        run: |
          echo "Selecione apenas um domínio por execução para impedir emissão no host incorreto." >&2
          exit 1
      - name: Validate payments authentication secret
        env:
          PAYMENTS_AUTH_TOKEN: ${{ secrets.LEAD_PORTAL_PAYMENTS_AUTH_TOKEN }}
        run: |
          if [ "${#PAYMENTS_AUTH_TOKEN}" -lt 32 ]; then
            echo "Erro: LEAD_PORTAL_PAYMENTS_AUTH_TOKEN ausente ou menor que 32 caracteres no ambiente production." >&2
            exit 1
          fi
          echo "Segredo administrativo disponível para o deploy (conteúdo protegido)."
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ inputs.issue_digicomdigital_certificate == 'true' && secrets.VPS_SSH_KEY || secrets.LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY != '' && secrets.LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY || secrets.PDE_PLATFORM_VPS_SSH_KEY != '' && secrets.PDE_PLATFORM_VPS_SSH_KEY || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Erro: nenhuma chave SSH foi encontrada. Configure LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY para o host ${DEPLOY_HOST} ou mantenha um fallback compatível." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Ensure Docker runtime on VPS
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE_DOCKER_BOOTSTRAP'
          set -euo pipefail
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            systemctl enable --now docker >/dev/null 2>&1 || true
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release
          install -m 0755 -d /etc/apt/keyrings
          if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          fi
          chmod a+r /etc/apt/keyrings/docker.gpg
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker
          docker version
          docker compose version
          REMOTE_DOCKER_BOOTSTRAP
      - name: Prepare remote directory
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
      - name: Backup remote public assets
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && if [ -d docker/proxy/html ]; then \
              mkdir -p .deploy-backups/public-assets \
              && backup_dir=.deploy-backups/public-assets/$(date -u +%Y%m%dT%H%M%SZ) \
              && mkdir -p \${backup_dir} \
              && cp -a docker/proxy/html/. \${backup_dir}/; \
            fi"
      - name: Sync service to VPS
        run: |
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --filter 'P docker/proxy/html/downloads/***' \
            --filter 'P docker/proxy/html/sales-page-exp*.html' \
            --filter 'P docker/proxy/html/obrigado-exp*.html' \
            --exclude '.git/' \
            --exclude 'target/' \
            lead-portal-payments-service/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Publish service
        env:
          PAYMENTS_AUTH_TOKEN: ${{ secrets.LEAD_PORTAL_PAYMENTS_AUTH_TOKEN }}
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && if [ -n '${GHCR_TOKEN}' ]; then echo '${GHCR_TOKEN}' | docker login ${IMAGE_REGISTRY} -u '${GHCR_USERNAME}' --password-stdin; fi \
            && (docker network inspect ${LEAD_PORTAL_PAYMENTS_NETWORK} >/dev/null 2>&1 || docker network create ${LEAD_PORTAL_PAYMENTS_NETWORK}) \
            && export LEAD_PORTAL_PAYMENTS_IMAGE='${IMAGE_NAMESPACE}/lead-portal-payments-service:${IMAGE_TAG}' \
            && export LEAD_PORTAL_PAYMENTS_NETWORK='${LEAD_PORTAL_PAYMENTS_NETWORK}' \
            && export LEAD_PORTAL_PAYMENTS_AUTH_TOKEN='${PAYMENTS_AUTH_TOKEN}' \
            && docker compose -f docker-compose.deploy.yml pull \
            && (docker rm -f lead-portal-payments-service-proxy-1 lead-portal-payments-service_proxy_1 >/dev/null 2>&1 || true) \
            && docker compose -f docker-compose.deploy.yml up -d --remove-orphans \
            && test \"\$(docker inspect lead-portal-payments-service --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^LEAD_PORTAL_PAYMENTS_AUTH_TOKEN=//p' | awk '{ print length }')\" -ge 32 \
            && docker image prune -af"
      - name: Issue Clube MUSA certificate
        if: github.event_name == 'workflow_dispatch' && inputs.issue_clubemusa_certificate == 'true'
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && export LEAD_PORTAL_PAYMENTS_IMAGE='${IMAGE_NAMESPACE}/lead-portal-payments-service:${IMAGE_TAG}' \
            && export LEAD_PORTAL_PAYMENTS_NETWORK='${LEAD_PORTAL_PAYMENTS_NETWORK}' \
            && export CERTBOT_PRIMARY_DOMAIN=clubemusa.com.br \
            && export CERTBOT_EXTRA_DOMAINS='v1.clubemusa.com.br v2.clubemusa.com.br v5.clubemusa.com.br v6.clubemusa.com.br v7.clubemusa.com.br v8.clubemusa.com.br v9.clubemusa.com.br v10.clubemusa.com.br' \
            && docker compose -f docker-compose.deploy.yml --profile certbot run --rm certbot-pagamentos \
            && docker compose -f docker-compose.deploy.yml up -d --force-recreate proxy"
      - name: Issue Digicom Digital certificate
        if: github.event_name == 'workflow_dispatch' && inputs.issue_digicomdigital_certificate == 'true'
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && export LEAD_PORTAL_PAYMENTS_IMAGE='${IMAGE_NAMESPACE}/lead-portal-payments-service:${IMAGE_TAG}' \
            && export LEAD_PORTAL_PAYMENTS_NETWORK='${LEAD_PORTAL_PAYMENTS_NETWORK}' \
            && export CERTBOT_PRIMARY_DOMAIN=digicomdigital.com.br \
            && docker compose -f docker-compose.deploy.yml --profile certbot run --rm certbot-pagamentos \
            && docker compose -f docker-compose.deploy.yml up -d --force-recreate proxy"
      - name: Clean build artifacts from repository
        if: always()
        run: |
          git clean -ffdx -- lead-portal-payments-service/target
