name: Validação Liquibase MySQL 5.7

on:
  pull_request:
    paths:
      - "backend/ads-service/src/main/resources/db/changelog/**"
      - "backend/ads-service/src/test/resources/liquibase-mysql57/**"
      - "backend/ads-service/Dockerfile.liquibase-mysql57"
      - "backend/ads-service/Dockerfile.mysql57-product-process"
      - "backend/ads-service/Dockerfile.mysql57-activity-instances"
      - "backend/ads-service/Dockerfile.mysql57-product-discovery-bpm-audit"
      - "backend/ads-service/Dockerfile.mysql57-financial-agent-task-audit"
      - "backend/ads-service/Dockerfile.mysql57-agent-task-actionable-audit-v2"
      - "backend/ads-service/Dockerfile.mysql57-agent-responsibility-boundaries"
      - "backend/ads-service/Dockerfile.mysql57-product-type-consultants-v1"
      - "backend/ads-service/Dockerfile.mysql57-rigel-commercial-slot"
      - "backend/ads-service/Dockerfile.mysql57-experiment-direct-contact-sample"
      - "backend/ads-service/Dockerfile.mysql57-experiment-direct-recruitment"
      - "backend/ads-service/.dockerignore"
      - "backend/ads-service/docker-compose.product-process-mysql57.yml"
      - "backend/ads-service/docker-compose.activity-instances-mysql57.yml"
      - "backend/ads-service/docker-compose.product-discovery-bpm-audit-mysql57.yml"
      - "backend/ads-service/docker-compose.financial-agent-task-audit-mysql57.yml"
      - "backend/ads-service/docker-compose.agent-task-actionable-audit-v2-mysql57.yml"
      - "backend/ads-service/docker-compose.agent-responsibility-boundaries-mysql57.yml"
      - "backend/ads-service/docker-compose.product-type-consultants-v1-mysql57.yml"
      - "backend/ads-service/docker-compose.rigel-commercial-slot-mysql57.yml"
      - "backend/ads-service/docker-compose.experiment-direct-contact-sample-mysql57.yml"
      - "backend/ads-service/docker-compose.experiment-direct-recruitment-mysql57.yml"
      - "backend/ads-service/scripts/validate-business-process-activity-instances-mysql57.sh"
      - "backend/ads-service/scripts/validate-product-discovery-bpm-audit-mysql57.sh"
      - "backend/ads-service/scripts/validate-financial-agent-task-audit-mysql57.sh"
      - "backend/ads-service/scripts/validate-agent-task-actionable-audit-v2-mysql57.sh"
      - "backend/ads-service/scripts/validate-agent-responsibility-boundaries-mysql57.sh"
      - "backend/ads-service/scripts/validate-product-type-consultants-v1-mysql57.sh"
      - "backend/ads-service/scripts/validate-experiment-direct-contact-sample-mysql57.sh"
      - "backend/ads-service/scripts/validate-experiment-direct-recruitment-mysql57.sh"
      - "backend/ads-service/src/test/java/com/marketinghub/businessprocess/IrisCommunicationAgentChangelogTest.java"
      - "config/agents/codex-agent-health-compliance.json"
      - "scripts/test-codex-agent-health-standard.mjs"
      - "scripts/validate-liquibase-mysql57.sh"
      - "scripts/validate-product-process-recovery-mysql57.sh"
      - "scripts/validate-rigel-commercial-slot-mysql57.sh"
      - "scripts/docker-pull-with-transient-retry.sh"
      - "scripts/test-docker-pull-with-transient-retry.sh"
      - ".github/workflows/liquibase-mysql57.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquibase-mysql57-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar contratos dos changelogs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar regras estáticas do MySQL 5.7
        env:
          LIQUIBASE_VALIDATE_SCOPE: changed
        run: bash scripts/validate-liquibase-mysql57.sh

      - name: Validar retry transitório do Docker
        run: bash scripts/test-docker-pull-with-transient-retry.sh

  validate-product-process-recovery:
    name: Validar retomada da migração de períodos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          PRODUCT_PROCESS_COMPOSE_PROJECT: liquibase-product-process-${{ github.run_id }}
        run: bash scripts/validate-product-process-recovery-mysql57.sh

  validate-business-process-activity-instances:
    name: Validar atividades, instâncias e tentativas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        run: bash backend/ads-service/scripts/validate-business-process-activity-instances-mysql57.sh

  validate-product-discovery-bpm-audit:
    name: Validar auditoria BPM da descoberta PDE
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          PRODUCT_DISCOVERY_BPM_COMPOSE_PROJECT: liquibase-product-discovery-bpm-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-product-discovery-bpm-audit-mysql57.sh

  validate-financial-agent-task-audit:
    name: Validar auditoria da tarefa financeira
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          FINANCIAL_AGENT_TASK_AUDIT_COMPOSE_PROJECT: liquibase-financial-agent-task-audit-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-financial-agent-task-audit-mysql57.sh

  validate-agent-task-actionable-audit-v2:
    name: Validar auditoria acionável e visual
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          AGENT_TASK_ACTIONABLE_AUDIT_COMPOSE_PROJECT: liquibase-agent-task-audit-v2-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-agent-task-actionable-audit-v2-mysql57.sh

  validate-agent-responsibility-boundaries:
    name: Validar fronteiras de responsabilidade dos agentes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validar contrato Java da fronteira de agentes
        working-directory: backend/ads-service
        run: mvn -B -q -Dtest=IrisCommunicationAgentChangelogTest test

      - name: Validar migração física no MySQL 5.7
        run: bash backend/ads-service/scripts/validate-agent-responsibility-boundaries-mysql57.sh

  validate-rigel-commercial-slot:
    name: Validar retomada do slot comercial da Rigel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        run: bash scripts/validate-rigel-commercial-slot-mysql57.sh

  validate-product-type-consultants-v1:
    name: Validar tipos Consultor PWA e WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          PRODUCT_TYPE_CONSULTANTS_COMPOSE_PROJECT: liquibase-product-type-consultants-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-product-type-consultants-v1-mysql57.sh

  validate-experiment-direct-contact-sample:
    name: Validar amostra direta consentida
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          DIRECT_CONTACT_SAMPLE_COMPOSE_PROJECT: liquibase-direct-contact-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-experiment-direct-contact-sample-mysql57.sh

  validate-experiment-direct-recruitment:
    name: Validar recrutamento direto consentido
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar imagem MySQL 5.7
        run: bash scripts/docker-pull-with-transient-retry.sh mysql:5.7

      - name: Validar migração física no MySQL 5.7
        env:
          DIRECT_RECRUITMENT_COMPOSE_PROJECT: liquibase-direct-recruitment-${{ github.run_id }}
        run: bash backend/ads-service/scripts/validate-experiment-direct-recruitment-mysql57.sh
