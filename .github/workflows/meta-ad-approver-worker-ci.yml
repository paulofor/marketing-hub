name: Meta Ad Approver Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - meta-ad-approver-worker/**
      - customer-agent-worker/src/**
      - pde-platform/**
      - backend/ads-service/src/main/resources/db/changelog/**
      - backend/ads-service/src/test/java/com/marketinghub/pde/**
      - docs/homologacao/**
      - docs/registros/**
      - scripts/build-commercial-review-evidence.mjs
      - scripts/build-commercial-review-evidence.test.mjs
      - scripts/generate-musa-v7-canonical-contract-changelog.mjs
      - scripts/validate-premium-agents.sh
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
      - scripts/codex-oauth-session-safe.sh
      - scripts/coordinate-agent-deployment.mjs
      - scripts/coordinate-agent-deployment.test.mjs
  pull_request:
    paths:
      - meta-ad-approver-worker/**
      - ai-worker/src/main/java/com/marketinghub/worker/creativereview/**
      - ai-worker/src/test/java/com/marketinghub/worker/architecture/MetaAdApproverIsolationTest.java
      - docs/canonical/**
      - customer-agent-worker/src/**
      - pde-platform/**
      - backend/ads-service/src/main/resources/db/changelog/**
      - backend/ads-service/src/test/java/com/marketinghub/pde/**
      - docs/homologacao/**
      - docs/registros/**
      - .github/workflows/meta-ad-approver-worker-ci.yml
      - scripts/build-commercial-review-evidence.mjs
      - scripts/build-commercial-review-evidence.test.mjs
      - scripts/generate-musa-v7-canonical-contract-changelog.mjs
      - scripts/validate-premium-agents.sh
      - scripts/test-isolated-agent-codex-auth.sh
      - scripts/codex-app-server-device-login.mjs
      - scripts/codex-oauth-session-safe.sh
      - scripts/coordinate-agent-deployment.mjs
      - scripts/coordinate-agent-deployment.test.mjs
  workflow_run:
    workflows: ["Build & Deploy containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test independent agent
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: meta-ad-approver-worker/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meta-ad-approver-worker/package-lock.json
      - name: Build immutable commercial evidence
        run: |
          node --test scripts/build-commercial-review-evidence.test.mjs
          node scripts/build-commercial-review-evidence.mjs . meta-ad-approver-worker/review-evidence
      - name: Validate application deploy coordination
        run: node --test scripts/coordinate-agent-deployment.test.mjs
      - name: Confirm matching application deployment was enqueued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_REGISTRATION_TIMEOUT_SECONDS: 120
        run: node scripts/coordinate-agent-deployment.mjs assert-application-run deploy-containers.yml
      - name: Validate Java and architecture
        working-directory: meta-ad-approver-worker
        run: mvn -B verify
      - name: Validate MCP handshake
        working-directory: meta-ad-approver-worker
        run: |
          npm ci --omit=dev
          node --check src/main/resources/mcp/meta-ad-approver.mjs
          node --check src/main/resources/mcp/landing-evidence.mjs
          node --check src/main/resources/mcp/video-frame-extractor.mjs
          node --check src/main/resources/mcp/temis-library-review.mjs
          docker run --rm --init --network none \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w "/workspace/meta-ad-approver-worker" \
            mcr.microsoft.com/playwright:v1.54.2-noble@sha256:18b4bcff4f8ba0ac8c44b09f09def6a4f6cb8579e5f26381c21f38b50935d5d8 npm test
      - name: Validate container build
        run: |
          image_created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build --label "org.opencontainers.image.created=${image_created_at}" -t marketing-hub/meta-ad-approver-worker:${{ github.sha }} meta-ad-approver-worker
          docker build --label "org.opencontainers.image.created=${image_created_at}" -f meta-ad-approver-worker/Dockerfile.image-studio -t marketing-hub/iris-image-studio:${{ github.sha }} meta-ad-approver-worker
          touch /tmp/openai_api_key
          mkdir -p /tmp/codex-home
          META_AD_APPROVER_CODEX_HOME=/tmp/codex-home OPENAI_API_KEY_HOST_FILE=/tmp/openai_api_key docker compose -f meta-ad-approver-worker/docker-compose.yml config --quiet
      - name: Validate reviewer visual runtime in confinement
        run: |
          docker run --rm --init --read-only \
            --tmpfs /tmp:size=256m,noexec,nosuid \
            --security-opt no-new-privileges:true \
            --entrypoint node \
            marketing-hub/meta-ad-approver-worker:${{ github.sha }} \
            /app/browser-runtime-check.mjs

      - name: Package tested images
        if: github.event_name != 'pull_request'
        run: |
          node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images/reviewer" marketing-hub/meta-ad-approver-worker:${{ github.sha }}
          node scripts/agent-image-bundle.mjs pack "${{ runner.temp }}/agent-images/studio" marketing-hub/iris-image-studio:${{ github.sha }}
      - name: Store tested images for this run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-${{ github.sha }}
          path: ${{ runner.temp }}/agent-images/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  source-run:
    name: Resolve tested worker revision
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.resolve.outputs.required }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        name: Resolve exact tested source run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          APP_DEPLOY_EVENT: ${{ github.event.workflow_run.event }}
          APP_DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AGENT_SOURCE_WAIT_TIMEOUT_SECONDS: 6900
        run: node scripts/coordinate-agent-deployment.mjs resolve-source-run meta-ad-approver-worker-ci.yml

  deploy:
    name: Deploy independent agent
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.test.result == 'success') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.source-run.result == 'success' &&
        needs.source-run.outputs.required == 'true'))
    runs-on: ubuntu-latest
    needs:
      - test
      - source-run
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    env:
      DEPLOY_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_sha || github.sha }}
      OPENAI_API_KEY: ${{ secrets.PDE_OPENAI_API_KEY != '' && secrets.PDE_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: agent-images-${{ env.DEPLOY_SOURCE_SHA }}
          path: ${{ runner.temp }}/agent-images/
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_run_id || github.run_id }}
      - name: Verify tested images
        run: |
          if [ -f "${{ runner.temp }}/agent-images/manifest.json" ]; then
            node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images" "marketing-hub/meta-ad-approver-worker:${DEPLOY_SOURCE_SHA}" "marketing-hub/iris-image-studio:${DEPLOY_SOURCE_SHA}"
          else
            node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images/reviewer" "marketing-hub/meta-ad-approver-worker:${DEPLOY_SOURCE_SHA}"
            node scripts/agent-image-bundle.mjs verify "${{ runner.temp }}/agent-images/studio" "marketing-hub/iris-image-studio:${DEPLOY_SOURCE_SHA}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build immutable commercial evidence
        run: |
          node --test scripts/build-commercial-review-evidence.test.mjs
          node scripts/build-commercial-review-evidence.mjs . meta-ad-approver-worker/review-evidence
      - name: Configure authenticated agent VPS SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$VPS_IP" "$VPS_USER" "$GITHUB_ENV"
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
      - name: Load tested images without rebuilding
        timeout-minutes: 20
        run: |
          if [ -f "${{ runner.temp }}/agent-images/manifest.json" ]; then
            node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images" "${VPS_USER}@${VPS_IP}" "marketing-hub/meta-ad-approver-worker:${DEPLOY_SOURCE_SHA}" "marketing-hub/iris-image-studio:${DEPLOY_SOURCE_SHA}"
          else
            node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images/reviewer" "${VPS_USER}@${VPS_IP}" "marketing-hub/meta-ad-approver-worker:${DEPLOY_SOURCE_SHA}"
            node scripts/agent-image-bundle.mjs send "${{ runner.temp }}/agent-images/studio" "${VPS_USER}@${VPS_IP}" "marketing-hub/iris-image-studio:${DEPLOY_SOURCE_SHA}"
          fi
      - name: Provision OpenAI credential for Íris
        run: |
          set -euo pipefail
          test "${#OPENAI_API_KEY}" -ge 20
          printf '%s' "${OPENAI_API_KEY}" | ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" '
            set -euo pipefail
            secret_dir=/root/infra/openai-token
            secret_file="${secret_dir}/openai_api_key"
            install -m 700 -d "${secret_dir}"
            if [ -d "${secret_file}" ]; then
              rmdir "${secret_file}"
            fi
            temporary_file="${secret_dir}/.openai_api_key.tmp"
            umask 077
            cat > "${temporary_file}"
            test -s "${temporary_file}"
            chown 10001:10001 "${temporary_file}"
            chmod 600 "${temporary_file}"
            mv "${temporary_file}" "${secret_file}"
          '
      - name: Synchronize versioned repository
        run: |
          set -euo pipefail
          # Caminhos devem ser resolvidos pelo runner antes do SSH.
          # shellcheck disable=SC2029
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "mkdir -p \
            '${REPOSITORY_DIR}/meta-ad-approver-worker' \
            '${REPOSITORY_DIR}/pde-platform/contracts' \
            '${REPOSITORY_DIR}/pde-platform/frontend/public/materials' \
            '${REPOSITORY_DIR}/scripts'"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete meta-ad-approver-worker/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/meta-ad-approver-worker/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete pde-platform/contracts/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/pde-platform/contracts/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" --delete pde-platform/frontend/public/materials/ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/pde-platform/frontend/public/materials/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-app-server-device-login.mjs "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"
          rsync -az -e "ssh ${SSH_COMMON_ARGS}" scripts/codex-oauth-session-safe.sh "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/scripts/"
      - name: Start validated agent
        run: |
          set -euo pipefail
          # Versões e caminhos devem ser injetados pelo runner no comando remoto.
          # shellcheck disable=SC2029
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" "
            install -d -o 10001 -g 10001 /opt/growth-operator/agents/meta-ad-approver/codex-home \
            && test -f /root/infra/openai-token/openai_api_key \
            && test -s /root/infra/openai-token/openai_api_key \
            && export META_AD_APPROVER_CODEX_HOME=/opt/growth-operator/agents/meta-ad-approver/codex-home \
                   BACKEND_URL=http://191.252.181.168 \
                   MARKETING_HUB_URL=http://191.252.181.168 \
                   MARKETING_HUB_REPOSITORY_HOST='${REPOSITORY_DIR}' \
                   CODEX_MODEL=gpt-5.6-sol \
                   OPENAI_API_KEY_FILE=/run/secrets/openai_api_key \
                   OPENAI_API_KEY_HOST_FILE=/root/infra/openai-token/openai_api_key \
                   OPENAI_IMAGE_MODEL=gpt-image-2 \
                   META_AD_APPROVER_IMAGE=marketing-hub/meta-ad-approver-worker:${DEPLOY_SOURCE_SHA} \
                   IRIS_IMAGE_STUDIO_IMAGE=marketing-hub/iris-image-studio:${DEPLOY_SOURCE_SHA} \
            && cd '${REPOSITORY_DIR}/meta-ad-approver-worker' \
            && docker compose up -d --no-build --pull never --remove-orphans \
            && for attempt in \$(seq 1 24); do \
                 running=\$(docker compose ps --status running --services); \
                 printf '%s\n' \"\${running}\" | grep -Fxq meta-ad-approver-worker \
                   && printf '%s\n' \"\${running}\" | grep -Fxq iris-image-studio \
                   && curl -fsS http://127.0.0.1:8097/ops-meta-ad-approver-observability-v1/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' \
                   && curl -fsS http://127.0.0.1:8098/ops-meta-ad-approver-observability-v1/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' \
                   && docker compose exec -T iris-image-studio sh -c 'test -f /run/secrets/openai_api_key && test -r /run/secrets/openai_api_key && test -s /run/secrets/openai_api_key' \
                   && docker compose exec -T meta-ad-approver-worker sh -c 'test ! -e /run/secrets/openai_api_key' \
                   && docker compose exec -T meta-ad-approver-worker sh -c 'test -s /app/commercial-evidence/commercial-review-bundle-index-v1.json' \
                   && docker compose exec -T meta-ad-approver-worker sh -c 'test -x /workspace/marketing-hub/scripts/codex-oauth-session-safe.sh' \
                   && docker compose exec -T meta-ad-approver-worker sh -c 'test -s /workspace/marketing-hub/pde-platform/contracts/kit-whatsapp-pronto-v1.json && test -s /workspace/marketing-hub/pde-platform/contracts/commercial-journey-event-contract-v1.json && test -s /workspace/marketing-hub/pde-platform/frontend/public/materials/kit-whatsapp-v1/01-comece-aqui.md' \
                   && docker compose exec -T meta-ad-approver-worker node /app/browser-runtime-check.mjs \
                   && docker compose exec -T meta-ad-approver-worker node /app/agent-health-report.mjs \
                   && exit 0; \
                 sleep 5; \
               done; \
            docker compose logs --tail=150 meta-ad-approver-worker iris-image-studio; exit 1"
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${VPS_USER}@${VPS_IP}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
