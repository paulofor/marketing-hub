name: Meta Ad Approver Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - meta-ad-approver-worker/**
      - .github/workflows/meta-ad-approver-worker-ci.yml
  pull_request:
    paths:
      - meta-ad-approver-worker/**
      - ai-worker/src/main/java/com/marketinghub/worker/creativereview/**
      - ai-worker/src/test/java/com/marketinghub/worker/architecture/MetaAdApproverIsolationTest.java
      - docs/canonical/**
      - .github/workflows/meta-ad-approver-worker-ci.yml
  workflow_dispatch:

concurrency:
  group: meta-ad-approver-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VPS_IP: 163.245.202.80
  VPS_USER: root
  REPOSITORY_DIR: /opt/marketing-hub/repo

jobs:
  test:
    name: Test independent agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium agent architecture
        run: bash scripts/validate-premium-agents.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: meta-ad-approver-worker/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meta-ad-approver-worker/package-lock.json
      - name: Validate Java and architecture
        working-directory: meta-ad-approver-worker
        run: mvn -B verify
      - name: Validate MCP handshake
        working-directory: meta-ad-approver-worker
        run: |
          npm ci --omit=dev
          node --check src/main/resources/mcp/meta-ad-approver.mjs
          npm run test:mcp-handshake
      - name: Validate container build
        run: docker build -t marketing-hub/meta-ad-approver-worker:${{ github.sha }} meta-ad-approver-worker

  deploy:
    name: Deploy independent agent
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: shared-growth-agents-repository-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Add agent VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
      - name: Trust agent VPS
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -4 -p 22 -t rsa,ecdsa,ed25519 -H "${VPS_IP}" >> ~/.ssh/known_hosts
      - name: Synchronize versioned repository
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "mkdir -p '${REPOSITORY_DIR}'"
          rsync -az --delete --exclude '.git/' --exclude 'target/' --exclude 'node_modules/' ./ "${VPS_USER}@${VPS_IP}:${REPOSITORY_DIR}/"
      - name: Rebuild and restart agent
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_IP}" "
            install -d -m 700 -o 10001 -g 10001 /opt/marketing-hub/agents/meta-ad-approver/codex-home \
            && if [ ! -s /opt/marketing-hub/agents/meta-ad-approver/codex-home/auth.json ]; then \
                 test -s /opt/growth-operator/codex-home/auth.json \
                 && install -m 600 -o 10001 -g 10001 /opt/growth-operator/codex-home/auth.json /opt/marketing-hub/agents/meta-ad-approver/codex-home/auth.json; \
                 if [ -s /opt/growth-operator/codex-home/config.toml ]; then \
                   install -m 600 -o 10001 -g 10001 /opt/growth-operator/codex-home/config.toml /opt/marketing-hub/agents/meta-ad-approver/codex-home/config.toml; \
                 fi; \
               fi \
            && test -s /opt/marketing-hub/agents/meta-ad-approver/codex-home/auth.json \
            || { printf '%s\\n' 'Falha: sessão Codex operacional não está disponível para migrar o Aprovador Meta.'; exit 1; }; \
            export META_AD_APPROVER_CODEX_HOME=/opt/marketing-hub/agents/meta-ad-approver/codex-home \
                   BACKEND_URL=http://191.252.181.168 \
                   MARKETING_HUB_URL=http://191.252.181.168 \
                   MARKETING_HUB_REPOSITORY_HOST='${REPOSITORY_DIR}' \
                   CODEX_MODEL=gpt-5.6-sol \
                   META_AD_APPROVER_IMAGE=marketing-hub/meta-ad-approver-worker:${GITHUB_SHA} \
            && cd '${REPOSITORY_DIR}/meta-ad-approver-worker' \
            && docker compose up -d --build --remove-orphans \
            && for attempt in \$(seq 1 24); do \
                 status=\$(docker inspect --format '{{.State.Status}}' meta-ad-approver-worker-meta-ad-approver-worker-1 2>/dev/null || true); \
                 [ \"\${status}\" = running ] \
                   && docker exec meta-ad-approver-worker-meta-ad-approver-worker-1 sh -lc 'test -w /home/approver/.codex && codex login status' \
                   && curl -fsS http://127.0.0.1:8097/ops-meta-ad-approver-observability-v1/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' \
                   && exit 0; \
                 sleep 5; \
               done; \
            docker compose logs --tail=150 meta-ad-approver-worker; exit 1"
