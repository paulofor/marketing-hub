name: CI - MOIS Clickbank Collector

on:
  push:
    branches: ["main"]
    paths:
      - "mois-clickbank-collector/**"
      - ".github/workflows/mois-clickbank-collector-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mois-clickbank-collector/**"
      - ".github/workflows/mois-clickbank-collector-ci.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Retira o runtime ocioso ou o reativa após validação do consumidor"
        required: true
        default: retire
        type: choice
        options:
          - retire
          - activate
      recovery_sha:
        description: "Revisão esperada pelo reconciliador automático; vazio preserva a execução normal"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mois-clickbank-collector

jobs:
  test:
    name: Test (MOIS Clickbank Collector)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven test
        working-directory: mois-clickbank-collector
        run: mvn -B test

  build-and-push:
    name: Build and Push Image (MOIS Clickbank Collector)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'activate'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mois-clickbank-collector
          file: ./mois-clickbank-collector/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Activate (MOIS Clickbank Collector)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'activate' && github.ref == 'refs/heads/main'
    environment: production
    env:
      DEPLOY_HOST: 177.153.62.107
      DEPLOY_USER: root
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Erro: nenhuma chave SSH foi encontrada nos secrets esperados." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project files
        run: |
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=60
            -o ServerAliveCountMax=10
            -o TCPKeepAlive=yes
            -o ConnectTimeout=60
          )
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/marketinghub/mois-clickbank-collector"
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" \
            --exclude '.git' --exclude 'target' --exclude '.idea' --exclude '.vscode' --exclude '.DS_Store' \
            mois-clickbank-collector/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/marketinghub/mois-clickbank-collector"

      - name: Deploy with Docker Compose
        run: |
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=60
            -o ServerAliveCountMax=10
            -o TCPKeepAlive=yes
            -o ConnectTimeout=60
          )
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail
          cd /opt/marketinghub/mois-clickbank-collector
          export MOIS_CLICKBANK_COLLECTOR_IMAGE=ghcr.io/${{ github.repository }}/mois-clickbank-collector:sha-${{ github.sha }}
          export COMPOSE_PROJECT_NAME=marketinghub-mois-clickbank-collector
          docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          pull_image() {
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull
          }
          pull_image || { sleep 10; pull_image; } || { sleep 20; pull_image; }
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --remove-orphans
          docker image prune -af"

  retire:
    name: Retire idle runtime (MOIS Clickbank Collector)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'retire')
    environment: production
    env:
      DEPLOY_HOST: 177.153.62.107
      DEPLOY_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Erro: nenhuma chave SSH foi encontrada nos secrets esperados." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Remove runtime ClickBank
        run: |
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=60
            -o ServerAliveCountMax=10
            -o TCPKeepAlive=yes
            -o ConnectTimeout=60
          )
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'set -euo pipefail
          cd /opt/marketinghub/mois-clickbank-collector
          export MOIS_CLICKBANK_COLLECTOR_IMAGE=retired
          docker compose --project-name marketinghub-mois-clickbank-collector -f docker-compose.yml -f docker-compose.deploy.yml down --remove-orphans
          if docker ps --format "{{.Names}}" | grep -Fx "mois-clickbank-collector" >/dev/null; then
            echo "O container mois-clickbank-collector permaneceu ativo." >&2
            exit 1
          fi'
