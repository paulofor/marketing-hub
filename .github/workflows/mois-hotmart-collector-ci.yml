name: CI - MOIS Hotmart Collector

on:
  push:
    branches: ["main"]
    paths:
      - "mois-hotmart-collector/**"
      - ".github/workflows/mois-hotmart-collector-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mois-hotmart-collector/**"
      - ".github/workflows/mois-hotmart-collector-ci.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Preparar parado ou ativar após conferir necessidade, fila e credenciais"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - activate
      recovery_sha:
        description: "Revisão esperada pelo reconciliador"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mois-hotmart-collector

jobs:
  test:
    name: Test (MOIS Hotmart Collector)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven test
        working-directory: mois-hotmart-collector
        run: mvn -B test

  build-and-push:
    name: Build and Push Image (MOIS Hotmart Collector)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mois-hotmart-collector
          file: ./mois-hotmart-collector/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    concurrency:
      group: deploy-vps-163-245-200-7
      queue: max
      cancel-in-progress: false
    name: Deploy (MOIS Hotmart Collector)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    env:
      DEPLOY_HOST: 163.245.200.7
      DEPLOY_USER: root
      REMOTE_PATH: /opt/marketinghub/mois-hotmart-collector

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "${VPS_SSH_KEY}" || { echo "Chave SSH de deploy ausente." >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"

      - name: Sync project files
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
          rsync -az --delete -e "ssh ${SSH_COMMON_ARGS}" --exclude '.git' --exclude 'target' --exclude '.idea' --exclude '.vscode' --exclude '.DS_Store' --exclude 'logs/' --exclude '.env' \
            mois-hotmart-collector/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"

      - name: Copy lifecycle command
        run: scp ${SSH_COMMON_ARGS} scripts/apply-on-demand-collector.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}/apply-on-demand-collector.sh"

      - name: Login to registry without exposing credential
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Prepare or explicitly activate collector
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${REMOTE_PATH}' && export MOIS_HOTMART_COLLECTOR_IMAGE='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}' && export COMPOSE_PROJECT_NAME='marketinghub-mois-hotmart-collector' && docker compose -f docker-compose.deploy.yml pull && bash ./apply-on-demand-collector.sh '${OPERATION}' mois-hotmart-collector"

      - name: Remove registry credential
        if: always()
        run: ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'docker logout ghcr.io >/dev/null 2>&1 || true'
