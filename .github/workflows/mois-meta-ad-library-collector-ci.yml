name: CI - MOIS Meta Ad Library Collector

on:
  push:
    branches: ["main"]
    paths:
      - "mois-meta-ad-library-collector/**"
      - ".github/workflows/mois-meta-ad-library-collector-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mois-meta-ad-library-collector/**"
      - ".github/workflows/mois-meta-ad-library-collector-ci.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mois-meta-ad-library-collector

jobs:
  test:
    name: Test (MOIS Meta Ad Library Collector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven test
        working-directory: mois-meta-ad-library-collector
        run: mvn -B test

  build-and-push:
    name: Build and Push Image (MOIS Meta Ad Library Collector)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./mois-meta-ad-library-collector
          file: ./mois-meta-ad-library-collector/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy (MOIS Meta Ad Library Collector)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      DEPLOY_HOST: 177.153.62.107
      DEPLOY_USER: root
      REMOTE_PATH: /opt/marketinghub/mois-meta-ad-library-collector
    steps:
      - uses: actions/checkout@v4
      - name: Validate production credential
        env:
          META_AD_LIBRARY_ACCESS_TOKEN: ${{ secrets.META_AD_LIBRARY_ACCESS_TOKEN }}
        run: test -n "$META_AD_LIBRARY_ACCESS_TOKEN"
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Sync project files
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
          rsync -az --delete -e "ssh ${SSH_COMMON_ARGS}" --exclude target mois-meta-ad-library-collector/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Install protected runtime configuration
        env:
          META_AD_LIBRARY_ACCESS_TOKEN: ${{ secrets.META_AD_LIBRARY_ACCESS_TOKEN }}
        run: |
          TOKEN_BASE64="$(printf '%s' "$META_AD_LIBRARY_ACCESS_TOKEN" | base64 -w 0)"
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "umask 077; printf '%s' '${TOKEN_BASE64}' | base64 -d > '${REMOTE_PATH}/.meta-token'; printf 'BACKEND_URL=http://191.252.181.168\nMETA_AD_LIBRARY_ACCESS_TOKEN=' > '${REMOTE_PATH}/.env'; cat '${REMOTE_PATH}/.meta-token' >> '${REMOTE_PATH}/.env'; rm -f '${REMOTE_PATH}/.meta-token'"
      - name: Deploy with Docker Compose
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail && cd ${REMOTE_PATH} && export MOIS_META_AD_LIBRARY_COLLECTOR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA} && export COMPOSE_PROJECT_NAME=marketinghub-mois-meta-ad-library-collector && docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull && docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --remove-orphans && docker compose -f docker-compose.yml -f docker-compose.deploy.yml ps"
