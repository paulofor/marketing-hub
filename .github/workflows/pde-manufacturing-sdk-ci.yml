name: PDE Manufacturing SDK
on:
  pull_request:
    paths:
      - 'pde-platform/pde-harness-sdk/**'
      - 'config/product-types/ai-designed-manufactured-product-v1.json'
      - 'docs/pesquisas/ia-concepcao-fabricacao-2026-11-21.md'
      - 'scripts/test-manufactured-product-type.cjs'
      - '.github/workflows/pde-manufacturing-sdk-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pde-platform/pde-harness-sdk/**'
      - 'config/product-types/ai-designed-manufactured-product-v1.json'
      - 'docs/pesquisas/ia-concepcao-fabricacao-2026-11-21.md'
      - 'scripts/test-manufactured-product-type.cjs'
      - '.github/workflows/pde-manufacturing-sdk-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pde-platform/pde-harness-sdk/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalog contract
        run: node --test scripts/test-manufactured-product-type.cjs
      - name: Validate new profile and existing harness
        run: mvn --batch-mode -f pde-platform/pde-harness-sdk/pom.xml spotless:check test
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pde-manufacturing-sdk-tests
          path: pde-platform/pde-harness-sdk/target/surefire-reports
          if-no-files-found: error
