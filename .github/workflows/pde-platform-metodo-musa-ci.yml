name: CI - PDE Platform Metodo MUSA

on:
  push:
    branches: ["main", "master"]
    paths:
      - "pde-platform/**"
      - ".github/workflows/pde-platform-metodo-musa-ci.yml"
  pull_request:
    paths:
      - "pde-platform/**"
      - ".github/workflows/pde-platform-metodo-musa-ci.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Ambiente a publicar"
        required: true
        default: "homolog"
        type: choice
        options:
          - homolog
          - production

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  BACKEND_IMAGE_NAME: pde-platform-backend
  FRONTEND_IMAGE_NAME: pde-platform-frontend
  AI_WORKER_IMAGE_NAME: pde-ai-worker

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-platform/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pde-platform/frontend/package-lock.json
      - name: Install deps
        run: npm ci --include=dev
      - name: Validate PDE API boundary
        run: npm run check:api-boundary
      - name: Build
        run: npm run build

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define Docker image metadata
        id: image_metadata
        run: |
          {
            echo "backend_tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:latest"
            echo "${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
            echo "frontend_tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:latest"
            echo "${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
            echo "ai_worker_tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:latest"
            echo "${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: pde-platform/backend
          file: pde-platform/backend/Dockerfile
          push: true
          tags: ${{ steps.image_metadata.outputs.backend_tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: pde-platform/frontend
          file: pde-platform/frontend/Dockerfile
          push: true
          tags: ${{ steps.image_metadata.outputs.frontend_tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max
      - name: Build and push PDE AI worker image
        uses: docker/build-push-action@v6
        with:
          context: pde-platform/pde-ai-worker
          file: pde-platform/pde-ai-worker/Dockerfile
          push: true
          tags: ${{ steps.image_metadata.outputs.ai_worker_tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.AI_WORKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.AI_WORKER_IMAGE_NAME }}:buildcache,mode=max
      - name: Expose image tag
        id: image_tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy_homolog:
    name: Deploy homolog to Metodo MUSA host
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.target_environment == 'homolog')
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 191.252.102.54
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.PDE_PLATFORM_REMOTE_PATH != '' && secrets.PDE_PLATFORM_REMOTE_PATH || '/root/pde-platform' }}
      IMAGE_TAG: ${{ needs.docker.outputs['image-tag'] }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      PDE_PLATFORM_NETWORK: ${{ secrets.PDE_PLATFORM_NETWORK != '' && secrets.PDE_PLATFORM_NETWORK || 'public-net' }}
      PDE_PLATFORM_HOMOLOG_FRONTEND_PORT: ${{ secrets.PDE_PLATFORM_HOMOLOG_FRONTEND_PORT != '' && secrets.PDE_PLATFORM_HOMOLOG_FRONTEND_PORT || '5177' }}
      PDE_PLATFORM_HOMOLOG_BACKEND_PORT: ${{ secrets.PDE_PLATFORM_HOMOLOG_BACKEND_PORT != '' && secrets.PDE_PLATFORM_HOMOLOG_BACKEND_PORT || '8097' }}
      PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION: ${{ secrets.PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION != '' && secrets.PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION || 'musa-pde-entry-v4-video-hero' }}
      PDE_PLATFORM_HOMOLOG_HERO_VIDEO_URL: ${{ secrets.PDE_PLATFORM_HOMOLOG_HERO_VIDEO_URL }}
      AWS_REGION: ${{ secrets.PDE_MAIL_AWS_REGION != '' && secrets.PDE_MAIL_AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PDE_MAIL_AWS_ACCESS_KEY_ID != '' && secrets.PDE_MAIL_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY != '' && secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PDE_MAIL_AWS_SESSION_TOKEN != '' && secrets.PDE_MAIL_AWS_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.PDE_OPENAI_API_KEY != '' && secrets.PDE_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_FILE: ${{ secrets.PDE_OPENAI_API_KEY_FILE != '' && secrets.PDE_OPENAI_API_KEY_FILE || secrets.OPENAI_API_KEY_FILE != '' && secrets.OPENAI_API_KEY_FILE || '/run/secrets/openai_api_key' }}
      OPENAI_API_KEY_HOST_FILE: ${{ secrets.PDE_OPENAI_API_KEY_HOST_FILE != '' && secrets.PDE_OPENAI_API_KEY_HOST_FILE || secrets.OPENAI_API_KEY_HOST_FILE != '' && secrets.OPENAI_API_KEY_HOST_FILE || '/root/infra/openai-token/openai_api_key' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Erro: nenhuma chave SSH foi encontrada nos secrets esperados." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Sync compose file
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --include 'docker-compose.homolog.yml' \
            --exclude '*' \
            pde-platform/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Publish PDE Platform homolog
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && if [ -n '${GHCR_TOKEN}' ]; then echo '${GHCR_TOKEN}' | docker login ${IMAGE_REGISTRY} -u '${GHCR_USERNAME}' --password-stdin; fi \
            && (docker network inspect ${PDE_PLATFORM_NETWORK} >/dev/null 2>&1 || docker network create ${PDE_PLATFORM_NETWORK}) \
            && export PDE_PLATFORM_BACKEND_IMAGE='${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_FRONTEND_IMAGE='${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_AI_WORKER_IMAGE='${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_HOMOLOG_NETWORK='${PDE_PLATFORM_NETWORK}' \
            && export PDE_PLATFORM_HOMOLOG_FRONTEND_PORT='${PDE_PLATFORM_HOMOLOG_FRONTEND_PORT}' \
            && export PDE_PLATFORM_HOMOLOG_BACKEND_PORT='${PDE_PLATFORM_HOMOLOG_BACKEND_PORT}' \
            && export PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION='${PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION}' \
            && export PDE_PLATFORM_HOMOLOG_HERO_VIDEO_URL='${PDE_PLATFORM_HOMOLOG_HERO_VIDEO_URL}' \
            && export PDE_DEPLOY_ENVIRONMENT=homolog \
            && export PDE_DEPLOY_COMPOSE_FILE=docker-compose.homolog.yml \
            && export PDE_DEPLOY_COMMIT_SHA='${GITHUB_SHA}' \
            && export PDE_DEPLOY_IMAGE_TAG='${IMAGE_TAG}' \
            && export PDE_DEPLOY_FRONTEND_URL=\"http://${DEPLOY_HOST}:${PDE_PLATFORM_HOMOLOG_FRONTEND_PORT}\" \
            && export PDE_DEPLOY_BACKEND_URL=\"http://${DEPLOY_HOST}:${PDE_PLATFORM_HOMOLOG_BACKEND_PORT}\" \
            && export PDE_DEPLOY_DEPLOYED_AT='${DEPLOYED_AT}' \
            && export AWS_REGION='${AWS_REGION}' \
            && export AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}' \
            && export AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}' \
            && export AWS_SESSION_TOKEN='${AWS_SESSION_TOKEN}' \
            && export OPENAI_API_KEY='${OPENAI_API_KEY}' \
            && export OPENAI_API_KEY_FILE='${OPENAI_API_KEY_FILE}' \
            && export OPENAI_API_KEY_HOST_FILE='${OPENAI_API_KEY_HOST_FILE}' \
            && test -s \"${OPENAI_API_KEY_HOST_FILE}\" \
            && export COMPOSE_PROJECT_NAME=metodo-musa-pde-platform-homolog \
            && docker compose -f docker-compose.homolog.yml pull \
            && (docker rm -f pde-platform-backend-homolog pde-platform-frontend-homolog pde-ai-worker-homolog >/dev/null 2>&1 || true) \
            && docker compose -f docker-compose.homolog.yml up -d --remove-orphans \
            && docker image prune -af"
      - name: Validate homolog public container ports
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_HOMOLOG_FRONTEND_PORT}/" > /dev/null
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_HOMOLOG_FRONTEND_PORT}/healthz"
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_HOMOLOG_BACKEND_PORT}/actuator/health"
      - name: Set up Node for homolog rendering smoke
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pde-platform/frontend/package-lock.json
      - name: Validate homolog public rendering
        working-directory: pde-platform/frontend
        env:
          PDE_PUBLIC_HEALTH_URL: http://${{ env.DEPLOY_HOST }}:${{ env.PDE_PLATFORM_HOMOLOG_FRONTEND_PORT }}
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
          npm run test:public-health

  deploy_production:
    name: Deploy production to Metodo MUSA host
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production'
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 191.252.102.54
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.PDE_PLATFORM_REMOTE_PATH != '' && secrets.PDE_PLATFORM_REMOTE_PATH || '/root/pde-platform' }}
      IMAGE_TAG: ${{ needs.docker.outputs['image-tag'] }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      PDE_PLATFORM_NETWORK: ${{ secrets.PDE_PLATFORM_NETWORK != '' && secrets.PDE_PLATFORM_NETWORK || 'public-net' }}
      PDE_PLATFORM_FRONTEND_PORT: ${{ secrets.PDE_PLATFORM_FRONTEND_PORT != '' && secrets.PDE_PLATFORM_FRONTEND_PORT || '5176' }}
      PDE_PLATFORM_BACKEND_PORT: ${{ secrets.PDE_PLATFORM_BACKEND_PORT != '' && secrets.PDE_PLATFORM_BACKEND_PORT || '8096' }}
      AWS_REGION: ${{ secrets.PDE_MAIL_AWS_REGION != '' && secrets.PDE_MAIL_AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PDE_MAIL_AWS_ACCESS_KEY_ID != '' && secrets.PDE_MAIL_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY != '' && secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PDE_MAIL_AWS_SESSION_TOKEN != '' && secrets.PDE_MAIL_AWS_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.PDE_OPENAI_API_KEY != '' && secrets.PDE_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_FILE: ${{ secrets.PDE_OPENAI_API_KEY_FILE != '' && secrets.PDE_OPENAI_API_KEY_FILE || secrets.OPENAI_API_KEY_FILE != '' && secrets.OPENAI_API_KEY_FILE || '/run/secrets/openai_api_key' }}
      OPENAI_API_KEY_HOST_FILE: ${{ secrets.PDE_OPENAI_API_KEY_HOST_FILE != '' && secrets.PDE_OPENAI_API_KEY_HOST_FILE || secrets.OPENAI_API_KEY_HOST_FILE != '' && secrets.OPENAI_API_KEY_HOST_FILE || '/root/infra/openai-token/openai_api_key' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Erro: nenhuma chave SSH foi encontrada nos secrets esperados." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Sync compose file
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --include 'docker-compose.deploy.yml' \
            --exclude '*' \
            pde-platform/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Publish PDE Platform production
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && if [ -n '${GHCR_TOKEN}' ]; then echo '${GHCR_TOKEN}' | docker login ${IMAGE_REGISTRY} -u '${GHCR_USERNAME}' --password-stdin; fi \
            && (docker network inspect ${PDE_PLATFORM_NETWORK} >/dev/null 2>&1 || docker network create ${PDE_PLATFORM_NETWORK}) \
            && export PDE_PLATFORM_BACKEND_IMAGE='${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_FRONTEND_IMAGE='${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_AI_WORKER_IMAGE='${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_NETWORK='${PDE_PLATFORM_NETWORK}' \
            && export PDE_PLATFORM_FRONTEND_PORT='${PDE_PLATFORM_FRONTEND_PORT}' \
            && export PDE_PLATFORM_BACKEND_PORT='${PDE_PLATFORM_BACKEND_PORT}' \
            && export PDE_DEPLOY_ENVIRONMENT=production \
            && export PDE_DEPLOY_COMPOSE_FILE=docker-compose.deploy.yml \
            && export PDE_DEPLOY_COMMIT_SHA='${GITHUB_SHA}' \
            && export PDE_DEPLOY_IMAGE_TAG='${IMAGE_TAG}' \
            && export PDE_DEPLOY_FRONTEND_URL=https://clubemusa.com.br \
            && export PDE_DEPLOY_BACKEND_URL=\"http://${DEPLOY_HOST}:${PDE_PLATFORM_BACKEND_PORT}\" \
            && export PDE_DEPLOY_DEPLOYED_AT='${DEPLOYED_AT}' \
            && export AWS_REGION='${AWS_REGION}' \
            && export AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}' \
            && export AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}' \
            && export AWS_SESSION_TOKEN='${AWS_SESSION_TOKEN}' \
            && export OPENAI_API_KEY='${OPENAI_API_KEY}' \
            && export OPENAI_API_KEY_FILE='${OPENAI_API_KEY_FILE}' \
            && export OPENAI_API_KEY_HOST_FILE='${OPENAI_API_KEY_HOST_FILE}' \
            && test -s \"${OPENAI_API_KEY_HOST_FILE}\" \
            && export COMPOSE_PROJECT_NAME=metodo-musa-pde-platform \
            && docker compose -f docker-compose.deploy.yml pull \
            && (docker rm -f pde-platform-backend pde-platform-frontend pde-ai-worker >/dev/null 2>&1 || true) \
            && docker compose -f docker-compose.deploy.yml up -d --remove-orphans \
            && docker image prune -af"
      - name: Validate production public container ports
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_PORT}/" > /dev/null
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_PORT}/healthz"
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_BACKEND_PORT}/actuator/health"
      - name: Set up Node for production rendering smoke
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pde-platform/frontend/package-lock.json
      - name: Validate production public rendering
        working-directory: pde-platform/frontend
        env:
          PDE_PUBLIC_HEALTH_URL: https://clubemusa.com.br
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
          npm run test:public-health
