name: CI - PDE Platform Metodo MUSA

on:
  push:
    branches: ["main", "master"]
    paths:
      - "pde-platform/**"
      - ".github/workflows/pde-platform-metodo-musa-ci.yml"
  pull_request:
    paths:
      - "pde-platform/**"
      - ".github/workflows/pde-platform-metodo-musa-ci.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Ambiente a publicar"
        required: true
        default: "production"
        type: choice
        options:
          - production
      frontend_slot:
        description: "Slot frontend PDE MUSA a publicar"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - v5
          - v6
          - v7
          - all

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  BACKEND_IMAGE_NAME: pde-platform-backend
  FRONTEND_IMAGE_NAME: pde-platform-frontend
  AI_WORKER_IMAGE_NAME: pde-ai-worker

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-platform/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pde-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pde-platform/frontend/package-lock.json
      - name: Install deps
        run: npm ci --include=dev
      - name: Install video tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Validate PDE API boundary
        run: npm run check:api-boundary
      - name: Build
        run: npm run build

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define Docker image metadata
        id: image_metadata
        run: |
          {
            echo "backend_tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:latest"
            echo "${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
            echo "frontend_tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:latest"
            echo "${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
            echo "ai_worker_tags<<EOF"
            echo "${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:latest"
            echo "${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: pde-platform/backend
          file: pde-platform/backend/Dockerfile
          push: true
          tags: ${{ steps.image_metadata.outputs.backend_tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: pde-platform/frontend
          file: pde-platform/frontend/Dockerfile
          push: true
          tags: ${{ steps.image_metadata.outputs.frontend_tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max
      - name: Build and push PDE AI worker image
        uses: docker/build-push-action@v6
        with:
          context: pde-platform/pde-ai-worker
          file: pde-platform/pde-ai-worker/Dockerfile
          push: true
          tags: ${{ steps.image_metadata.outputs.ai_worker_tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.AI_WORKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ env.AI_WORKER_IMAGE_NAME }}:buildcache,mode=max
      - name: Expose image tag
        id: image_tag
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy_production:
    name: Deploy production to Metodo MUSA host
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production'
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: 163.245.200.7
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.PDE_PLATFORM_REMOTE_PATH != '' && secrets.PDE_PLATFORM_REMOTE_PATH || '/root/pde-platform' }}
      IMAGE_TAG: ${{ needs.docker.outputs['image-tag'] }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      PDE_PLATFORM_NETWORK: ${{ secrets.PDE_PLATFORM_NETWORK != '' && secrets.PDE_PLATFORM_NETWORK || 'public-net' }}
      PDE_DEPLOY_FRONTEND_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_slot || 'none' }}
      PDE_PLATFORM_FRONTEND_V5_PORT: ${{ secrets.PDE_PLATFORM_FRONTEND_V5_PORT != '' && secrets.PDE_PLATFORM_FRONTEND_V5_PORT || secrets.PDE_PLATFORM_FRONTEND_PORT != '' && secrets.PDE_PLATFORM_FRONTEND_PORT || '5176' }}
      PDE_PLATFORM_FRONTEND_V6_PORT: ${{ secrets.PDE_PLATFORM_FRONTEND_V6_PORT != '' && secrets.PDE_PLATFORM_FRONTEND_V6_PORT || '5177' }}
      PDE_PLATFORM_FRONTEND_V7_PORT: ${{ secrets.PDE_PLATFORM_FRONTEND_V7_PORT != '' && secrets.PDE_PLATFORM_FRONTEND_V7_PORT || '5178' }}
      PDE_PLATFORM_BACKEND_PORT: ${{ secrets.PDE_PLATFORM_BACKEND_PORT != '' && secrets.PDE_PLATFORM_BACKEND_PORT || '8096' }}
      LEAD_PORTAL_PAYMENTS_REMOTE_PATH: ${{ secrets.LEAD_PORTAL_PAYMENTS_REMOTE_PATH != '' && secrets.LEAD_PORTAL_PAYMENTS_REMOTE_PATH || '/root/lead-portal-payments-service' }}
      AWS_REGION: ${{ secrets.PDE_MAIL_AWS_REGION != '' && secrets.PDE_MAIL_AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PDE_MAIL_AWS_ACCESS_KEY_ID != '' && secrets.PDE_MAIL_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY != '' && secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.PDE_MAIL_AWS_SESSION_TOKEN != '' && secrets.PDE_MAIL_AWS_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.PDE_OPENAI_API_KEY != '' && secrets.PDE_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_FILE: ${{ secrets.PDE_OPENAI_API_KEY_FILE != '' && secrets.PDE_OPENAI_API_KEY_FILE || secrets.OPENAI_API_KEY_FILE != '' && secrets.OPENAI_API_KEY_FILE || '/run/secrets/openai_api_key' }}
      OPENAI_API_KEY_HOST_FILE: ${{ secrets.PDE_OPENAI_API_KEY_HOST_FILE != '' && secrets.PDE_OPENAI_API_KEY_HOST_FILE || secrets.OPENAI_API_KEY_HOST_FILE != '' && secrets.OPENAI_API_KEY_HOST_FILE || '/root/infra/openai-token/openai_api_key' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.PDE_PLATFORM_VPS_SSH_KEY != '' && secrets.PDE_PLATFORM_VPS_SSH_KEY || secrets.VPS_SSH_KEY != '' && secrets.VPS_SSH_KEY || secrets.VPS_SSH_CHAVE != '' && secrets.VPS_SSH_CHAVE || secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Erro: nenhuma chave SSH foi encontrada. Configure PDE_PLATFORM_VPS_SSH_KEY para o host ${DEPLOY_HOST} ou mantenha um fallback compatível." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          printf '%s\n' "SSH_COMMON_ARGS=-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes -o ConnectTimeout=60" >> "$GITHUB_ENV"
      - name: Ensure Docker runtime on VPS
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE_DOCKER_BOOTSTRAP'
          set -euo pipefail
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            systemctl enable --now docker >/dev/null 2>&1 || true
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release
          install -m 0755 -d /etc/apt/keyrings
          if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          fi
          chmod a+r /etc/apt/keyrings/docker.gpg
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker
          docker version
          docker compose version
          REMOTE_DOCKER_BOOTSTRAP
      - name: Sync compose file
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --include 'docker-compose.deploy.yml' \
            --exclude '*' \
            pde-platform/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
      - name: Publish PDE Platform production
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && if [ -n '${GHCR_TOKEN}' ]; then echo '${GHCR_TOKEN}' | docker login ${IMAGE_REGISTRY} -u '${GHCR_USERNAME}' --password-stdin; fi \
            && (docker network inspect ${PDE_PLATFORM_NETWORK} >/dev/null 2>&1 || docker network create ${PDE_PLATFORM_NETWORK}) \
            && export PDE_PLATFORM_BACKEND_IMAGE='${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_FRONTEND_IMAGE='${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_FRONTEND_V5_IMAGE='${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_FRONTEND_V6_IMAGE='${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_FRONTEND_V7_IMAGE='${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_AI_WORKER_IMAGE='${IMAGE_NAMESPACE}/${AI_WORKER_IMAGE_NAME}:${IMAGE_TAG}' \
            && export PDE_PLATFORM_NETWORK='${PDE_PLATFORM_NETWORK}' \
            && export PDE_PLATFORM_FRONTEND_V5_PORT='${PDE_PLATFORM_FRONTEND_V5_PORT}' \
            && export PDE_PLATFORM_FRONTEND_V6_PORT='${PDE_PLATFORM_FRONTEND_V6_PORT}' \
            && export PDE_PLATFORM_FRONTEND_V7_PORT='${PDE_PLATFORM_FRONTEND_V7_PORT}' \
            && export PDE_PLATFORM_BACKEND_PORT='${PDE_PLATFORM_BACKEND_PORT}' \
            && export PDE_DEPLOY_ENVIRONMENT=production \
            && export PDE_DEPLOY_COMPOSE_FILE=docker-compose.deploy.yml \
            && export PDE_DEPLOY_COMMIT_SHA='${GITHUB_SHA}' \
            && export PDE_DEPLOY_IMAGE_TAG='${IMAGE_TAG}' \
            && export PDE_DEPLOY_FRONTEND_URL=https://v5.clubemusa.com.br \
            && export PDE_DEPLOY_BACKEND_URL=\"http://${DEPLOY_HOST}:${PDE_PLATFORM_BACKEND_PORT}\" \
            && export PDE_DEPLOY_DEPLOYED_AT='${DEPLOYED_AT}' \
            && export AWS_REGION='${AWS_REGION}' \
            && export AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}' \
            && export AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}' \
            && export AWS_SESSION_TOKEN='${AWS_SESSION_TOKEN}' \
            && export OPENAI_API_KEY='${OPENAI_API_KEY}' \
            && export OPENAI_API_KEY_FILE='${OPENAI_API_KEY_FILE}' \
            && export OPENAI_API_KEY_HOST_FILE='${OPENAI_API_KEY_HOST_FILE}' \
            && if [ ! -s \"${OPENAI_API_KEY_HOST_FILE}\" ] && [ -n \"${OPENAI_API_KEY}\" ]; then install -m 700 -d \"\$(dirname \"${OPENAI_API_KEY_HOST_FILE}\")\" && printf '%s' \"${OPENAI_API_KEY}\" > \"${OPENAI_API_KEY_HOST_FILE}\" && chmod 600 \"${OPENAI_API_KEY_HOST_FILE}\"; fi \
            && test -s \"${OPENAI_API_KEY_HOST_FILE}\" \
            && export COMPOSE_PROJECT_NAME=metodo-musa-pde-platform \
            && FRONTEND_SERVICES='' \
            && case '${PDE_DEPLOY_FRONTEND_SLOT}' in \
              v5) FRONTEND_SERVICES='pde-platform-frontend-v5' ;; \
              v6) FRONTEND_SERVICES='pde-platform-frontend-v6' ;; \
              v7) FRONTEND_SERVICES='pde-platform-frontend-v7' ;; \
              all) FRONTEND_SERVICES='pde-platform-frontend-v5 pde-platform-frontend-v6 pde-platform-frontend-v7' ;; \
              none) FRONTEND_SERVICES='' ;; \
              *) echo 'Slot frontend PDE invalido: ${PDE_DEPLOY_FRONTEND_SLOT}' >&2; exit 1 ;; \
            esac \
            && docker compose -f docker-compose.deploy.yml pull pde-platform-backend pde-ai-worker \${FRONTEND_SERVICES} \
            && if [ '${PDE_DEPLOY_FRONTEND_SLOT}' = 'v5' ] || [ '${PDE_DEPLOY_FRONTEND_SLOT}' = 'all' ]; then docker rm -f pde-platform-frontend >/dev/null 2>&1 || true; fi \
            && (docker rm -f pde-platform-backend pde-ai-worker >/dev/null 2>&1 || true) \
            && (docker compose -f docker-compose.deploy.yml up -d pde-platform-backend pde-ai-worker \${FRONTEND_SERVICES} || ( \
              echo 'Falha ao publicar PDE Platform. Coletando diagnostico dos containers.' >&2; \
              docker compose -f docker-compose.deploy.yml ps >&2 || true; \
              docker compose -f docker-compose.deploy.yml logs --tail=200 pde-platform-backend >&2 || true; \
              docker inspect pde-platform-backend --format '{{json .State}}' >&2 || true; \
              exit 1 \
            )) \
            && PROXY_CONTAINERS=\"lead-portal-payments-service-proxy-1 lead-portal-payments-service_proxy_1 lead-portal-payments-proxy-1 lead-portal-payments_proxy_1 proxy \$(docker ps --filter publish=443 --format '{{.Names}}' || true)\" \
            && for proxy_container in \${PROXY_CONTAINERS}; do \
              if docker inspect \"\${proxy_container}\" >/dev/null 2>&1; then \
                docker network connect ${PDE_PLATFORM_NETWORK} \"\${proxy_container}\" >/dev/null 2>&1 || true; \
                docker kill -s HUP \"\${proxy_container}\" >/dev/null 2>&1 || true; \
              fi; \
            done \
            && docker image prune -af"
      - name: Ensure Clube MUSA public proxy
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && (docker network inspect ${PDE_PLATFORM_NETWORK} >/dev/null 2>&1 || docker network create ${PDE_PLATFORM_NETWORK}) \
            && if [ -f '${LEAD_PORTAL_PAYMENTS_REMOTE_PATH}/docker-compose.deploy.yml' ]; then \
              cd '${LEAD_PORTAL_PAYMENTS_REMOTE_PATH}' \
              && export LEAD_PORTAL_PAYMENTS_NETWORK='${PDE_PLATFORM_NETWORK}' \
              && export LEAD_PORTAL_PAYMENTS_IMAGE='${IMAGE_NAMESPACE}/lead-portal-payments-service:latest' \
              && docker compose -f docker-compose.deploy.yml up -d --no-deps proxy; \
            fi \
            && PROXY_CONTAINERS=\"lead-portal-payments-service-proxy-1 lead-portal-payments-service_proxy_1 lead-portal-payments-proxy-1 lead-portal-payments_proxy_1 proxy \$(docker ps --filter publish=443 --format '{{.Names}}' || true)\" \
            && PROXY_FOUND=false \
            && for proxy_container in \${PROXY_CONTAINERS}; do \
              if docker inspect \"\${proxy_container}\" >/dev/null 2>&1; then \
                PROXY_FOUND=true; \
                docker network connect ${PDE_PLATFORM_NETWORK} \"\${proxy_container}\" >/dev/null 2>&1 || true; \
                docker kill -s HUP \"\${proxy_container}\" >/dev/null 2>&1 || true; \
              fi; \
            done \
            && if [ \"\${PROXY_FOUND}\" != 'true' ]; then \
              echo 'Nenhum container de proxy HTTPS do Clube MUSA encontrado. Publique lead-portal-payments-service com o proxy antes de liberar PDE.' >&2; \
              docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}' >&2 || true; \
              exit 1; \
            fi \
            && if ! docker ps --filter publish=443 --format '{{.Names}}' | grep -q .; then \
              echo 'Nenhum container ativo publica a porta 443 no host do Clube MUSA.' >&2; \
              docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}' >&2 || true; \
              exit 1; \
            fi"
      - name: Validate production public container ports
        run: |
          if [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "v5" ] || [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "all" ]; then
            curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_V5_PORT}/" > /dev/null
            curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_V5_PORT}/healthz"
          fi
          if [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "v6" ] || [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "all" ]; then
            curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_V6_PORT}/" > /dev/null
            curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_V6_PORT}/healthz"
          fi
          if [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "v7" ] || [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "all" ]; then
            curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_V7_PORT}/" > /dev/null
            curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_FRONTEND_V7_PORT}/healthz"
          fi
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "set -euo pipefail \
            && cd ${REMOTE_PATH} \
            && export COMPOSE_PROJECT_NAME=metodo-musa-pde-platform \
            && for attempt in \$(seq 1 30); do \
              if docker compose -f docker-compose.deploy.yml exec -T pde-platform-backend curl --fail --silent http://127.0.0.1:8096/actuator/health >/dev/null 2>&1; then exit 0; fi; \
              sleep 10; \
            done; \
            echo 'Backend PDE nao ficou saudavel no container apos 300s.' >&2; \
            docker compose -f docker-compose.deploy.yml ps pde-platform-backend >&2 || true; \
            docker compose -f docker-compose.deploy.yml logs --tail=200 pde-platform-backend >&2 || true; \
            exit 1"
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-connrefused "http://${DEPLOY_HOST}:${PDE_PLATFORM_BACKEND_PORT}/actuator/health"
      - name: Validate production public HTTPS routes
        run: |
          validate_public_slot() {
            local slot="$1"
            local url="https://${slot}.clubemusa.com.br"
            curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-connrefused "${url}/healthz" | tee "/tmp/pde-${slot}-healthz.json"
            grep -q '"status":"UP"' "/tmp/pde-${slot}-healthz.json"
            curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-connrefused --output /dev/null "${url}/"
          }
          validate_public_slot v5
          validate_public_slot v6
          if [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "v7" ] || [ "${PDE_DEPLOY_FRONTEND_SLOT}" = "all" ]; then
            validate_public_slot v7
          fi
      - name: Set up Node for production rendering smoke
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pde-platform/frontend/package-lock.json
      - name: Validate production public rendering
        working-directory: pde-platform/frontend
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
          PDE_PUBLIC_HEALTH_URL=https://v5.clubemusa.com.br npm run test:public-health
          PDE_PUBLIC_HEALTH_URL=https://v6.clubemusa.com.br npm run test:public-health
      - name: Validate production public diagnostic smoke
        working-directory: pde-platform/frontend
        run: |
          PDE_PUBLIC_HEALTH_URL=https://v5.clubemusa.com.br npm run test:public-diagnostic-smoke
          PDE_PUBLIC_HEALTH_URL=https://v6.clubemusa.com.br npm run test:public-diagnostic-smoke
      - name: Validate production versioned PDE contracts
        run: |
          PRODUCT_SLUG=metodo-musa-7-dias \
          PDE_PUBLIC_BASE_URL=https://v5.clubemusa.com.br \
          EXPECTED_EXPERIENCE_VERSION=musa-pde-entry-v5-video-explicativo \
          bash scripts/check-musa-pde-public-consistency.sh

          PRODUCT_SLUG=metodo-musa-7-dias \
          PDE_PUBLIC_BASE_URL=https://v6.clubemusa.com.br \
          EXPECTED_EXPERIENCE_VERSION=musa-pde-entry-v6-video-motivacional \
          bash scripts/check-musa-pde-public-consistency.sh
