name: Atualizar hashes das fontes de cards

on:
  push:
    branches:
      - main
    paths:
      - 'pesquisas/prazer-audio-visual/cards/fontes/*.md'

permissions:
  contents: write

jobs:
  hash-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular SHA-256 das fontes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in pesquisas/prazer-audio-visual/cards/fontes/*.md; do
            sha256sum "$source" | awk '{print $1}' > "${source%.md}.sha256"
          done

      - name: Persistir hashes atualizados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisas/prazer-audio-visual/cards/fontes/*.sha256
          if git diff --cached --quiet; then
            echo "Nenhum hash alterado."
            exit 0
          fi
          git commit -m "Atualiza SHA-256 das fontes de cards"
          git push
