name: Product Discovery Worker CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "product-discovery-worker/**"
      - "pesquisas/**"
      - "backend/ads-service/src/main/resources/agent-harness/agent-harness-v2.json"
      - "scripts/test-isolated-agent-codex-auth.sh"
      - "scripts/docker-compose-pull-with-transient-retry.sh"
      - "scripts/docker-compose-up-with-transient-retry.sh"
      - "scripts/docker-login-with-transient-retry.sh"
      - "scripts/configure-vps-ssh-fallback.sh"
      - "scripts/ssh-keyscan-with-retry.sh"
      - "scripts/test-configure-vps-ssh-fallback.sh"
      - "scripts/wait-for-shared-vps-docker-capacity.sh"
      - "scripts/coordinate-agent-deployment.mjs"
      - "scripts/coordinate-agent-deployment.test.mjs"
  pull_request:
    paths:
      - "product-discovery-worker/**"
      - "pesquisas/**"
      - "backend/ads-service/src/main/resources/agent-harness/agent-harness-v2.json"
      - "scripts/test-isolated-agent-codex-auth.sh"
      - "scripts/docker-compose-pull-with-transient-retry.sh"
      - "scripts/docker-compose-up-with-transient-retry.sh"
      - "scripts/docker-login-with-transient-retry.sh"
      - "scripts/configure-vps-ssh-fallback.sh"
      - "scripts/ssh-keyscan-with-retry.sh"
      - "scripts/test-configure-vps-ssh-fallback.sh"
      - "scripts/wait-for-shared-vps-docker-capacity.sh"
      - "scripts/coordinate-agent-deployment.mjs"
      - "scripts/coordinate-agent-deployment.test.mjs"
      - ".github/workflows/product-discovery-worker-ci.yml"
  workflow_run:
    workflows: ["Build & Deploy containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_sha:
        description: "Revisão esperada pelo reconciliador automático; vazio preserva a execução normal"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: product-discovery-worker
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node.js dependencies
        run: npm ci
      - name: Materialize current research library
        run: npm run build:research-library
      - name: Run tests
        run: |
          docker run --rm --init --network none \
            --user "$(id -u):$(id -g)" --env npm_config_cache=/tmp/npm-cache \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}/product-discovery-worker" \
            mcr.microsoft.com/playwright:v1.54.2-noble@sha256:18b4bcff4f8ba0ac8c44b09f09def6a4f6cb8579e5f26381c21f38b50935d5d8 \
            npm test
      - name: Validate application deploy coordination
        working-directory: ${{ github.workspace }}
        run: node --test scripts/coordinate-agent-deployment.test.mjs
      - name: Confirm matching application deployment was enqueued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_REGISTRATION_TIMEOUT_SECONDS: 120
        run: node scripts/coordinate-agent-deployment.mjs assert-application-run deploy-containers.yml
      - name: Validate SSH credential fallback
        working-directory: ${{ github.workspace }}
        run: bash scripts/test-configure-vps-ssh-fallback.sh
      - name: Validate container build
        working-directory: ${{ github.workspace }}
        run: docker build --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" -t marketing-hub/product-discovery-worker:${{ github.sha }} product-discovery-worker
      - name: Validate bundled Chromium as runtime user
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm --init --read-only --tmpfs /tmp:size=256m,noexec,nosuid \
            --security-opt no-new-privileges:true \
            --entrypoint node marketing-hub/product-discovery-worker:${{ github.sha }} \
            --input-type=module -e \
            'import { chromium } from "playwright-core"; const browser = await chromium.launch({headless: true}); console.log(await browser.version()); await browser.close();'

  source-run:
    name: Resolve tested worker revision
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.resolve.outputs.required }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        name: Resolve exact tested source run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_DEPLOY_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          APP_DEPLOY_EVENT: ${{ github.event.workflow_run.event }}
          APP_DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          AGENT_SOURCE_WAIT_TIMEOUT_SECONDS: 6900
        run: node scripts/coordinate-agent-deployment.mjs resolve-source-run product-discovery-worker-ci.yml

  docker:
    runs-on: ubuntu-latest
    needs:
      - test
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_run'
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: latest
      IMAGE_SHA_TAG: ${{ github.sha }}
    outputs:
      image-tag: ${{ steps.image_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize current research library
        working-directory: product-discovery-worker
        run: npm run build:research-library
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/product-discovery-worker
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_SHA_TAG }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: product-discovery-worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/product-discovery-worker:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/product-discovery-worker:buildcache,mode=max
      - name: Expose image tag
        id: image_tag
        run: echo "value=${IMAGE_SHA_TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        needs.test.result == 'success' &&
        needs.docker.result == 'success') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.source-run.result == 'success' &&
        needs.source-run.outputs.required == 'true'))
    needs:
      - test
      - docker
      - source-run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: deploy-vps-163-245-202-80
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      DEPLOY_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_sha || github.sha }}
      DEPLOY_HOST: 163.245.202.80
      DEPLOY_USER: root
      REMOTE_PATH: ${{ secrets.PRODUCT_DISCOVERY_WORKER_REMOTE_PATH || '/root/product-discovery-worker' }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && needs.source-run.outputs.source_sha || github.sha }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SOURCE_SHA }}
      - name: Validate automatic publisher recovery
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_sha != ''
        working-directory: ${{ github.workspace }}
        env:
          RECOVERY_SHA: ${{ inputs.recovery_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-publisher-recovery.py

      - name: Configure SSH
        env:
          VPS_SSH_KEY_PRIMARY: ${{ secrets.GROWTH_OPERATOR_VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_1: ${{ secrets.VPS_SSH_CHAVE }}
          VPS_SSH_KEY_FALLBACK_2: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_FALLBACK_3: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bash scripts/configure-vps-ssh-fallback.sh \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$GITHUB_ENV"
      - name: Ensure Docker runtime on VPS
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE_DOCKER_BOOTSTRAP'
          set -euo pipefail
          compose_plugin_installed=false
          for compose_plugin in \
            /usr/libexec/docker/cli-plugins/docker-compose \
            /usr/lib/docker/cli-plugins/docker-compose \
            /usr/local/libexec/docker/cli-plugins/docker-compose \
            /usr/local/lib/docker/cli-plugins/docker-compose; do
            if [ -x "$compose_plugin" ]; then
              compose_plugin_installed=true
              break
            fi
          done
          if command -v docker >/dev/null 2>&1 && [ "$compose_plugin_installed" = "true" ]; then
            if ! systemctl is-active --quiet docker; then
              timeout --foreground --kill-after=10s 60s systemctl enable --now docker
            fi
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release
          install -m 0755 -d /etc/apt/keyrings
          if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          fi
          chmod a+r /etc/apt/keyrings/docker.gpg
          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker
          docker version
          docker compose version
          REMOTE_DOCKER_BOOTSTRAP
      - name: Ensure free disk space on agent VPS
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
      - name: Prepare remote directory
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${REMOTE_PATH}"
      - name: Sync Product Discovery Worker stack to VPS
        run: |
          rsync -az --delete \
            -e "ssh ${SSH_COMMON_ARGS}" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            product-discovery-worker/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}"
          scp ${SSH_COMMON_ARGS} \
            scripts/docker-login-with-transient-retry.sh \
            scripts/docker-compose-pull-with-transient-retry.sh \
            scripts/docker-compose-up-with-transient-retry.sh \
            scripts/wait-for-shared-vps-docker-capacity.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_PATH}/"
      - name: Wait for safe Docker capacity on VPS
        run: |
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${REMOTE_PATH}' && bash ./wait-for-shared-vps-docker-capacity.sh"
      - name: Publish service
        run: |
          if [ -n "${GHCR_TOKEN}" ]; then
            printf '%s' "${GHCR_TOKEN}" | ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${REMOTE_PATH}' && bash ./docker-login-with-transient-retry.sh '${IMAGE_REGISTRY}' '${GHCR_USERNAME}'"
          fi
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- \
            "${REMOTE_PATH}" \
            "${IMAGE_NAMESPACE}/product-discovery-worker:${IMAGE_TAG}" <<'REMOTE_PUBLISH'
          set -euo pipefail

          remote_path="$1"
          product_discovery_worker_image="$2"
          source_secret="/root/infra/brave-token/brave_api_key"
          runtime_secret="/root/infra/argos/secrets/brave_search_api_key"
          compose_files=(-f docker-compose.yml -f docker-compose.deploy.yml)

          install -m 700 -d /root/infra/brave-token
          if [ ! -s "$source_secret" ]; then
            echo "Erro: informe a chave Brave no arquivo operacional antes de publicar o Product Discovery Worker." >&2
            exit 1
          fi

          cd "$remote_path"
          export PRODUCT_DISCOVERY_WORKER_IMAGE="$product_discovery_worker_image"
          export PRODUCT_DISCOVERY_SEARCH_PROVIDER="brave"
          export PRODUCT_DISCOVERY_SEARCH_COUNTRY="br"
          export PRODUCT_DISCOVERY_SEARCH_LANGUAGE="pt-br"
          export BRAVE_SEARCH_API_KEY_HOST_FILE="$runtime_secret"
          export ARGOS_CODEX_HOME="/root/infra/argos/codex-home"
          export ARGOS_CODEX_ENABLED="true"

          bash ./docker-compose-pull-with-transient-retry.sh "${compose_files[@]}"
          runtime_uid=1000
          runtime_gid=1000
          bash scripts/prepare-codex-runtime-home.sh \
            "$ARGOS_CODEX_HOME" "$runtime_uid" "$runtime_gid"
          bash scripts/prepare-brave-runtime-secret.sh \
            "$source_secret" "$runtime_secret" "$runtime_uid" "$runtime_gid"
          timeout --foreground --kill-after=30s 240s \
            docker compose "${compose_files[@]}" run -T --rm --no-deps --entrypoint node \
            product-discovery-worker scripts/validate-runtime-search-config.mjs \
            </dev/null
          timeout --foreground --kill-after=30s 240s \
            docker compose "${compose_files[@]}" run -T --rm --no-deps --entrypoint sh \
            product-discovery-worker -c \
            'test -d "$CODEX_HOME" && test -w "$CODEX_HOME" && codex login status >/dev/null' \
            </dev/null
          DOCKER_COMPOSE_UP_FORCE_RECREATE=true \
            bash ./docker-compose-up-with-transient-retry.sh "${compose_files[@]}"

          healthy=false
          health_payload=""
          for ((attempt = 1; attempt <= 24; attempt++)); do
            health_payload="$(curl --show-error --silent --connect-timeout 5 --max-time 10 \
              http://127.0.0.1:18081/healthz || true)"
            if printf '%s' "$health_payload" | grep -Fq '"status":"UP"' \
              && printf '%s' "$health_payload" | grep -Fq '"keyStatus":"CONFIGURED"' \
              && curl --fail --show-error --silent --connect-timeout 5 --max-time 10 \
                http://127.0.0.1:18081/ops-product-discovery-observability-v1/logfile \
                | grep -Fq '[product-discovery-worker]'; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            echo "Health final do Product Discovery Worker: $health_payload" >&2
            docker compose "${compose_files[@]}" ps
            docker compose "${compose_files[@]}" logs --tail=80 product-discovery-worker
            exit 1
          fi
          REMOTE_PUBLISH
      - name: Restore free disk space on agent VPS
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ "${SSH_DEPLOY_READY:-false}" != "true" ]; then
            echo "Restauração remota ignorada: o preflight SSH não autenticou."
            exit 0
          fi
          ssh ${SSH_COMMON_ARGS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s -- retention' < scripts/ensure-agent-vps-disk-space.sh
