name: Publicar cards no Harness Library

concurrency:
  group: harness-library-cards-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'pesquisas/prazer-audio-visual/cards/*.json'

  workflow_dispatch:
    inputs:
      card_path:
        description: Caminho do JSON do card
        required: true
        default: pesquisas/prazer-audio-visual/cards/2026-09-06-loudness-fronteiras-frase.json
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HARNESS_LIBRARY_URL: https://mkthub.api.br
      HARNESS_LIBRARY_API_KEY: ${{ secrets.HARNESS_LIBRARY_API_KEY }}
      HARNESS_LIBRARY_ACTOR: github-actions@marketing-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar configuração
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HARNESS_LIBRARY_API_KEY:-}" ]]; then
            echo "::error::HARNESS_LIBRARY_API_KEY não configurado"
            exit 1
          fi

      - name: Selecionar cards
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_CARD: ${{ inputs.card_path }}
        run: |
          set -euo pipefail

          : > /tmp/cards.txt

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "${MANUAL_CARD}" > /tmp/cards.txt
          else
            git diff \
              --diff-filter=AM \
              --name-only \
              "${BEFORE_SHA}" \
              "${AFTER_SHA}" \
              -- 'pesquisas/prazer-audio-visual/cards/*.json' \
              > /tmp/cards.txt
          fi

          echo "Cards:"
          cat /tmp/cards.txt

      - name: Validar e publicar
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r card; do

            [[ -n "${card}" ]] || continue

            echo "Validando ${card}"

            jq -e '
              (.cardKey | type == "string") and
              (.collection == "prazer-audio-visual") and
              (.sourceKind == "MARKDOWN") and
              (.sourceUri | startswith("repo:")) and
              (.sourceSha256 | test("^[0-9a-f]{64}$"))
            ' "${card}" > /dev/null

            SOURCE_URI="$(jq -r '.sourceUri' "${card}")"
            SOURCE_PATH="${SOURCE_URI#repo:}"
            EXPECTED_SHA="$(jq -r '.sourceSha256' "${card}")"

            if [[ ! -f "${SOURCE_PATH}" ]]; then
              echo "::error::Fonte não encontrada: ${SOURCE_PATH}"
              exit 1
            fi

            ACTUAL_SHA="$(sha256sum "${SOURCE_PATH}" | awk '{print $1}')"

            if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
              echo "::error::SHA-256 da fonte não corresponde ao card"
              exit 1
            fi

            CARD_SHA="$(sha256sum "${card}" | awk '{print $1}')"

            # Mesma versão do JSON => mesma chave.
            # Reexecuções não criam versões acidentalmente.
            IDEMPOTENCY_KEY="gha-${CARD_SHA:0:32}"

            RESPONSE="$(mktemp)"

            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 15 \
                --max-time 60 \
                --output "${RESPONSE}" \
                --write-out '%{http_code}' \
                -X POST "${HARNESS_LIBRARY_URL}/v1/cards" \
                -H "Content-Type: application/json" \
                -H "X-API-Key: ${HARNESS_LIBRARY_API_KEY}" \
                -H "X-Actor: ${HARNESS_LIBRARY_ACTOR}" \
                -H "Idempotency-Key: ${IDEMPOTENCY_KEY}" \
                --data-binary "@${card}"
            )"

            if [[ "${HTTP_CODE}" != "201" ]]; then
              echo "::error::Mkt Hub respondeu HTTP ${HTTP_CODE}"
              jq . "${RESPONSE}" 2>/dev/null || cat "${RESPONSE}"
              exit 1
            fi

            jq -e '
              (.status == "DRAFT") and
              (.cardId | startswith("RI1-"))
            ' "${RESPONSE}" > /dev/null

            echo "Card publicado:"
            jq '{
              cardId,
              cardKey,
              version,
              status,
              effectiveStatus,
              routableAgents
            }' "${RESPONSE}"

          done < /tmp/cards.txt
