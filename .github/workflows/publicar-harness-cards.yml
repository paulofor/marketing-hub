name: Publicar cards no Harness Library

concurrency:
  group: harness-library-cards-main
  queue: max
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "pesquisas/*/cards/*.json"

  repository_dispatch:
    types:
      - harness-library-card-created

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:
    inputs:
      card_path:
        description: Caminho de um JSON; vazio reconcilia todos os cards
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HARNESS_LIBRARY_URL: https://mkthub.api.br
      HARNESS_LIBRARY_API_KEY: ${{ secrets.HARNESS_LIBRARY_API_KEY }}
      HARNESS_LIBRARY_ACTOR: github-actions@marketing-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Selecionar, validar e publicar cards
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_CARD: ${{ inputs.card_path }}
          EXTERNAL_CARD: ${{ github.event.client_payload.card_path }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            push)
              bash scripts/publish-harness-cards.sh \
                --changed "${BEFORE_SHA}" "${AFTER_SHA}"
              ;;
            workflow_dispatch)
              if [[ -n "${MANUAL_CARD}" ]]; then
                bash scripts/publish-harness-cards.sh --card "${MANUAL_CARD}"
              else
                bash scripts/publish-harness-cards.sh --all
              fi
              ;;
            repository_dispatch)
              if [[ -n "${EXTERNAL_CARD}" ]]; then
                bash scripts/publish-harness-cards.sh --card "${EXTERNAL_CARD}"
              else
                bash scripts/publish-harness-cards.sh --all
              fi
              ;;
            schedule)
              bash scripts/publish-harness-cards.sh --all
              ;;
            *)
              echo "::error::Evento não suportado: ${EVENT_NAME}"
              exit 1
              ;;
          esac
