name: Temporary SHA256 prazer audiovisual

on:
  push:
    branches:
      - main
    paths:
      - 'pesquisas/prazer-audio-visual/cards/fontes/2026-09-10-*.md'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular SHA-256 das fontes da rodada
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pesquisas/prazer-audio-visual/cards/fontes/2026-09-10-*.md
