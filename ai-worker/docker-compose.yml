version: '3.9'
services:
  ai-worker:
    container_name: ai-worker
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinghub/ai-worker:latest
    restart: unless-stopped
    environment:
      OPENAI_TEXT_TRANSPORT: ${OPENAI_TEXT_TRANSPORT:-codex-app-server}
      CODEX_HOME: /var/lib/ai-worker/codex-home
      AI_WORKER_CODEX_RECEIPTS: /var/lib/ai-worker/codex-receipts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      OPENAI_RESPONSES_MODEL: ${OPENAI_RESPONSES_MODEL:-gpt-5.5}
      OPENAI_TARGETING_REQUEST_MODEL: ${OPENAI_TARGETING_REQUEST_MODEL:-gpt-5.2}
      OPENAI_IMAGE_SERVICE_TIER: ${OPENAI_IMAGE_SERVICE_TIER:-flex}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-900}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_SEARCH_ID: ${GOOGLE_SEARCH_ID:-}
      LOGGING_FILE_NAME: ${AI_WORKER_LOG_FILE:-/var/log/ai-worker/application.log}
    ports:
      - "4567:4567"
    volumes:
      - ${AI_WORKER_CODEX_HOME:-/opt/marketinghub/ai-worker/codex-home}:/var/lib/ai-worker/codex-home
      - ${AI_WORKER_CODEX_RECEIPTS_DIR:-/opt/marketinghub/ai-worker/codex-receipts}:/var/lib/ai-worker/codex-receipts
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
      - ${AI_WORKER_LOG_DIR:-./logs}:/var/log/ai-worker
