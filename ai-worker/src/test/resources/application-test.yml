spring:
  main:
    allow-bean-definition-overriding: true
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:aiworker;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: false
  liquibase:
    enabled: false

openai:
  model: o3-mini

lead-portal:
  storage:
    bucket: test-bucket
    endpoint: http://localhost:9000
    public-base-url: http://localhost:9000/test-bucket
    access-key-id: test-access-key
    secret-access-key: test-secret-key
    region: us-east-1

worker:
  scheduling:
    enabled: false
