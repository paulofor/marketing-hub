services:
  learning-cycles-mysql:
    image: mysql:5.7
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=64M --innodb-log-file-size=8M
    environment:
      MYSQL_DATABASE: learning_cycles_local
      MYSQL_USER: cycles_local
      MYSQL_PASSWORD: cycles-local-only
      MYSQL_ROOT_PASSWORD: cycles-root-local-only
    ports:
      - "18307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucycles_local", "-pcycles-local-only"]
      interval: 2s
      timeout: 2s
      retries: 50
    mem_limit: 384m
