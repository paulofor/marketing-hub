databaseChangeLog:
  - changeSet:
      id: 2034-02-10-targeting-seed-flow
      author: repo
      preConditions:
        onFail: MARK_RAN
        and:
          - dbms:
              type: mysql
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE targeting_option
                  ADD COLUMN final_score DECIMAL(5,4) AFTER match_score,
                  ADD COLUMN source VARCHAR(24) AFTER search_term,
                  ADD COLUMN seed_variant VARCHAR(255) AFTER source;

              CREATE TABLE targeting_candidate_seed_variant (
                  candidate_id BIGINT NOT NULL,
                  variant_order INT NOT NULL,
                  variant_value VARCHAR(255) NOT NULL,
                  PRIMARY KEY (candidate_id, variant_order),
                  CONSTRAINT fk_candidate_seed_variant FOREIGN KEY (candidate_id) REFERENCES targeting_candidate(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE INDEX idx_tcsv_candidate ON targeting_candidate_seed_variant(candidate_id);
