databaseChangeLog:
  - changeSet:
      id: 2034-04-20-experiment-adset-job-logs
      author: repo
      preConditions:
        onFail: MARK_RAN
        and:
          - dbms:
              type: mysql
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE experiment_adset_job_api_log (
                  id BIGINT AUTO_INCREMENT PRIMARY KEY,
                  job_id BIGINT NOT NULL,
                  provider VARCHAR(32) NOT NULL,
                  endpoint VARCHAR(255),
                  http_method VARCHAR(16),
                  status_code INT,
                  requested_at DATETIME(6),
                  responded_at DATETIME(6),
                  request_payload LONGTEXT,
                  response_payload LONGTEXT,
                  error_message LONGTEXT,
                  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  updated_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                  CONSTRAINT fk_experiment_adset_job_api_log_job FOREIGN KEY (job_id) REFERENCES experiment_adset_job(id) ON DELETE CASCADE
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE INDEX idx_experiment_adset_job_api_log_job ON experiment_adset_job_api_log (job_id);
