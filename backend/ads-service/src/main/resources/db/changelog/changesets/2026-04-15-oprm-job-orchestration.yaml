databaseChangeLog:
  - changeSet:
      id: 2026-04-15-01-oprm-job-orchestration
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: oprm_job
      changes:
        - createTable:
            tableName: oprm_job
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: job_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: occupation_seed_ref
                  type: VARCHAR(191)
                  constraints:
                    nullable: false
              - column:
                  name: correlation_id
                  type: VARCHAR(191)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: claimed_by
                  type: VARCHAR(191)
              - column:
                  name: claimed_at
                  type: DATETIME
              - column:
                  name: lease_expires_at
                  type: DATETIME
              - column:
                  name: started_at
                  type: DATETIME
              - column:
                  name: finished_at
                  type: DATETIME
              - column:
                  name: error_code
                  type: VARCHAR(64)
              - column:
                  name: error_message
                  type: LONGTEXT
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: oprm_job
            indexName: idx_oprm_job_status_created
            columns:
              - column:
                  name: job_status
              - column:
                  name: created_at

  - changeSet:
      id: 2026-04-15-02-oprm-job-input
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: oprm_job_input
      changes:
        - createTable:
            tableName: oprm_job_input
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: input_ref
                  type: VARCHAR(191)
                  constraints:
                    nullable: false
              - column:
                  name: input_value
                  type: LONGTEXT
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: oprm_job_input
            baseColumnNames: job_id
            referencedTableName: oprm_job
            referencedColumnNames: id
            constraintName: fk_oprm_job_input_job
            onDelete: CASCADE
        - createIndex:
            tableName: oprm_job_input
            indexName: idx_oprm_job_input_job_id
            columns:
              - column:
                  name: job_id

  - changeSet:
      id: 2026-04-15-03-oprm-job-event
      author: codex
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: oprm_job_event
      changes:
        - createTable:
            tableName: oprm_job_event
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: event_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: phase
                  type: VARCHAR(128)
              - column:
                  name: message
                  type: LONGTEXT
              - column:
                  name: worker_id
                  type: VARCHAR(191)
              - column:
                  name: occurred_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: oprm_job_event
            baseColumnNames: job_id
            referencedTableName: oprm_job
            referencedColumnNames: id
            constraintName: fk_oprm_job_event_job
            onDelete: CASCADE
        - createIndex:
            tableName: oprm_job_event
            indexName: idx_oprm_job_event_job_id
            columns:
              - column:
                  name: job_id
        - createIndex:
            tableName: oprm_job_event
            indexName: idx_oprm_job_event_occurred
            columns:
              - column:
                  name: occurred_at
