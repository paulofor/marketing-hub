databaseChangeLog:
  - changeSet:
      id: 2026-05-04-add-prompt-column-gera-landing-stage-execution
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            - columnExists:
                tableName: gera_landing_stage_execution
                columnName: prompt
      changes:
        - addColumn:
            tableName: gera_landing_stage_execution
            columns:
              - column:
                  name: prompt
                  type: LONGTEXT
                  remarks: Prompt final montado pelo worker para execução da etapa.
