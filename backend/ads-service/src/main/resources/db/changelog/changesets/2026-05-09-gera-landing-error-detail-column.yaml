databaseChangeLog:
  - changeSet:
      id: 2026-05-09-add-gera-landing-error-detail
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            - columnExists:
                tableName: gera_landing_stage_execution
                columnName: error_detail
      changes:
        - addColumn:
            tableName: gera_landing_stage_execution
            columns:
              - column:
                  name: error_detail
                  type: LONGTEXT
