databaseChangeLog:
  - changeSet:
      id: 2026-05-20-openai-model-catalog-v1
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: openai_model_catalog_v1
      changes:
        - createTable:
            tableName: openai_model_catalog_v1
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: last_seen_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: openai_model_catalog_v1
            columnNames: code
            constraintName: uq_openai_model_catalog_v1_code
