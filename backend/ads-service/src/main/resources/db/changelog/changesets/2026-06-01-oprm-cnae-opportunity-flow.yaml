                    nullable: false
              - column:
                  name: score_cycle_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: enrichment_cycle_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
