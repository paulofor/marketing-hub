databaseChangeLog:
  - changeSet:
      id: 2026-06-04-03-oprm-niche-routine-card
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: oprm_niche_routine_card
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE oprm_niche_routine_card (
                id BIGINT NOT NULL AUTO_INCREMENT,
                research_cycle_id BIGINT NOT NULL,
                niche_name VARCHAR(255) NOT NULL,
                routine_summary LONGTEXT NOT NULL,
                pains_summary LONGTEXT NOT NULL,
                results_summary LONGTEXT NOT NULL,
                mechanism_opportunities_summary LONGTEXT NOT NULL,
                evidence_summary LONGTEXT NOT NULL,
                source_domains VARCHAR(1000) NOT NULL,
                confidence_score INT NOT NULL,
                synthesized_by VARCHAR(64) NOT NULL,
                created_at DATETIME NOT NULL,
                CONSTRAINT pk_oprm_niche_routine_card PRIMARY KEY (id)
              );
              CREATE UNIQUE INDEX uk_oprm_niche_routine_card_cycle ON oprm_niche_routine_card (research_cycle_id);
              CREATE INDEX idx_oprm_niche_routine_card_confidence ON oprm_niche_routine_card (confidence_score, created_at);
