databaseChangeLog:
  - changeSet:
      id: 2026-06-04-quality-review-audit
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            columnExists:
              tableName: gera_landing_stage_execution
              columnName: quality_review_audit
      changes:
        - addColumn:
            tableName: gera_landing_stage_execution
            columns:
              - column:
                  name: quality_review_audit
                  type: LONGTEXT
                  remarks: Auditoria interna da evidência visual do Quality Review, incluindo hashes de HTML, screenshots, prompt, request e alertas de reuso/contradição.
