databaseChangeLog:
  - changeSet:
      id: 2026-06-11-01-oprm-niche-research-seed-longtext-contract
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: oprm_niche_research_seed
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE oprm_niche_research_seed
                MODIFY COLUMN niche_name LONGTEXT NOT NULL,
                MODIFY COLUMN business_type LONGTEXT NOT NULL,
                MODIFY COLUMN confidence_level LONGTEXT NOT NULL,
                MODIFY COLUMN created_by LONGTEXT NOT NULL;

  - changeSet:
      id: 2026-06-11-02-oprm-research-query-longtext-contract
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: oprm_research_query
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE oprm_research_query
                MODIFY COLUMN query_text LONGTEXT NOT NULL,
                MODIFY COLUMN query_goal LONGTEXT NOT NULL,
                MODIFY COLUMN source_group LONGTEXT NULL,
                MODIFY COLUMN created_by LONGTEXT NOT NULL;
