databaseChangeLog:
  - changeSet:
      id: 2026-06-15-hypothesis-pipeline-raw-response
      author: marketinghub
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'hypothesis_pain_stage_execution' AND column_name = 'raw_response'
      changes:
