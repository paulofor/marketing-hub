databaseChangeLog:
  - changeSet:
      id: 2026-06-17-facebook-campaign-publication-job-step
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: facebook_campaign_publication_job_step
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE facebook_campaign_publication_job_step (
                  id BIGINT AUTO_INCREMENT PRIMARY KEY,
                  job_id CHAR(64) NOT NULL,
                  experiment_id BIGINT,
                  step_name VARCHAR(120) NOT NULL,
                  provider VARCHAR(32) NOT NULL DEFAULT 'FACEBOOK',
                  endpoint LONGTEXT,
                  http_method VARCHAR(16),
                  status_code INT,
                  request_payload LONGTEXT,
                  response_payload LONGTEXT,
                  error_message LONGTEXT,
                  occurred_at DATETIME(6) NOT NULL,
                  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  CONSTRAINT fk_fb_campaign_publication_job_step_experiment FOREIGN KEY (experiment_id) REFERENCES experiment(id) ON DELETE SET NULL
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE INDEX idx_fb_campaign_publication_job_step_job ON facebook_campaign_publication_job_step (job_id, occurred_at, id);
              CREATE INDEX idx_fb_campaign_publication_job_step_experiment ON facebook_campaign_publication_job_step (experiment_id, occurred_at);
