databaseChangeLog:
  - changeSet:
      id: 2026-06-19-01-oprm-nichocnae-v2-stage-execution
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: oprm_nichocnae_v2_stage_execution
      changes:
        - createTable:
            tableName: oprm_nichocnae_v2_stage_execution
            remarks: Execuções imutáveis de etapa do pipeline OPRM NichoCNAE v2 com separação entre tentativa cognitiva e retry técnico.
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_oprm_nichocnae_v2_stage_execution
                    nullable: false
              - column:
                  name: job_id
                  type: VARCHAR(96)
                  constraints:
                    nullable: false
              - column:
                  name: research_cycle_id
                  type: BIGINT
              - column:
                  name: source_niche_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cnae_code
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: stage_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: technical_retry_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: knowledge_version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: failure_type
                  type: VARCHAR(32)
              - column:
                  name: input_payload
                  type: LONGTEXT
              - column:
                  name: output_payload
                  type: LONGTEXT
              - column:
                  name: error_message
                  type: LONGTEXT
              - column:
                  name: next_stage_code
                  type: VARCHAR(64)
              - column:
                  name: materialization_enabled
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: oprm_nichocnae_v2_stage_execution
            indexName: idx_oprm_nichocnae_v2_stage_pending
            columns:
              - column:
                  name: stage_code
              - column:
                  name: status
              - column:
                  name: created_at
        - createIndex:
            tableName: oprm_nichocnae_v2_stage_execution
            indexName: idx_oprm_nichocnae_v2_stage_source
            columns:
              - column:
                  name: source_niche_id
              - column:
                  name: stage_code
              - column:
                  name: attempt_number
              - column:
                  name: technical_retry_number
