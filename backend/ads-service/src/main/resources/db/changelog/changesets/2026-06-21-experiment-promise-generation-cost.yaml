databaseChangeLog:
  - changeSet:
      id: 2026-06-21-experiment-promise-generation-cost
      author: marketinghub
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: experiment_promise_generation_request
      changes:
        - addColumn:
            tableName: experiment_promise_generation_request
            columns:
              - column:
                  name: input_tokens
                  type: int
              - column:
                  name: output_tokens
                  type: int
              - column:
                  name: cost_usd
                  type: decimal(12,4)
      rollback:
        - dropColumn:
            tableName: experiment_promise_generation_request
            columnName: input_tokens
        - dropColumn:
            tableName: experiment_promise_generation_request
            columnName: output_tokens
        - dropColumn:
            tableName: experiment_promise_generation_request
            columnName: cost_usd
