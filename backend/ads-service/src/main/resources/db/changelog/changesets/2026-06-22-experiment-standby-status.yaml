databaseChangeLog:
  - changeSet:
      id: 2026-06-22-experiment-standby-status
      author: assistant
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "1"
            sql: |
              SELECT CASE
                       WHEN EXISTS (
                         SELECT 1
                         FROM information_schema.columns
                         WHERE table_schema = DATABASE()
                           AND table_name = 'experiment'
                           AND column_name = 'status'
                           AND data_type = 'enum'
                           AND column_type NOT LIKE '%''STANDBY''%'
                       ) THEN 1
                       ELSE 0
                     END;
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE experiment
                MODIFY COLUMN status ENUM(
                  'PLANNED',
                  'RUNNING',
                  'PAUSED',
                  'STANDBY',
                  'VALIDATED',
                  'INVALIDATED',
                  'INCONCLUSIVE',
                  'FINISHED',
                  'FAILED',
                  'USER_STOPPED'
                ) NULL;
