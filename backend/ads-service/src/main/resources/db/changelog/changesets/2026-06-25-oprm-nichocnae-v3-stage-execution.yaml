databaseChangeLog:
  - changeSet:
      id: 2026-06-25-01-oprm-nichocnae-v3-stage-execution
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: oprm_nichocnae_v3_stage_execution
      changes:
        - createTable:
            tableName: oprm_nichocnae_v3_stage_execution
            remarks: Execuções auditáveis das etapas do pipeline OPRM NichoCNAE v3.
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_oprm_nichocnae_v3_stage_execution
                    nullable: false
              - column:
                  name: job_id
                  type: VARCHAR(96)
                  constraints:
                    nullable: false
              - column:
                  name: cnae_code
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: stage_code
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_number
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: knowledge_version
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: input_payload
                  type: LONGTEXT
              - column:
                  name: output_payload
                  type: LONGTEXT
              - column:
                  name: next_stage_code
                  type: VARCHAR(80)
              - column:
                  name: error_message
                  type: LONGTEXT
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: oprm_nichocnae_v3_stage_execution
            indexName: idx_oprm_nichocnae_v3_pending
            columns:
              - column:
                  name: stage_code
              - column:
                  name: status
              - column:
                  name: created_at
        - createIndex:
            tableName: oprm_nichocnae_v3_stage_execution
            indexName: idx_oprm_nichocnae_v3_job
            columns:
              - column:
                  name: job_id
              - column:
                  name: stage_code
