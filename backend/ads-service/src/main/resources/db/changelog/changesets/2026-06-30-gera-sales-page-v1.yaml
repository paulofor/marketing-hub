databaseChangeLog:
  - changeSet:
      id: 2026-06-30-gera-sales-page-v1-01
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: ai_prompt_schema_template
      changes:
        - createTable:
            tableName: ai_prompt_schema_template
            columns:
              - column:
                  name: template_key
                  type: VARCHAR(191)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: pipeline_code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: stage_code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: openai_model
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: schema_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: prompt_markdown_content
                  type: LONGTEXT
                  constraints:
                    nullable: false
              - column:
                  name: schema_json
                  type: LONGTEXT
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: ai_prompt_schema_template
            indexName: idx_ai_prompt_schema_pipeline_stage
            columns:
              - column:
                  name: pipeline_code
              - column:
                  name: stage_code
              - column:
                  name: active

  - changeSet:
      id: 2026-06-30-gera-sales-page-v1-02
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            tableExists:
              tableName: gera_sales_page_stage_execution
      changes:
        - createTable:
            tableName: gera_sales_page_stage_execution
            columns:
              - column:
                  name: id_job
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: experiment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: stage_code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: execution_requested_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: processing_started_at
                  type: TIMESTAMP
              - column:
                  name: completed_at
                  type: TIMESTAMP
              - column:
                  name: prompt_template_key
                  type: VARCHAR(191)
              - column:
                  name: prompt
                  type: LONGTEXT
              - column:
                  name: prompt_markdown_content
                  type: LONGTEXT
              - column:
                  name: schema_json
                  type: LONGTEXT
              - column:
                  name: openai_request_body
                  type: LONGTEXT
              - column:
                  name: openai_model
                  type: VARCHAR(120)
              - column:
                  name: openai_job_id
                  type: VARCHAR(120)
              - column:
                  name: model_response
                  type: LONGTEXT
              - column:
                  name: raw_response
                  type: LONGTEXT
              - column:
                  name: error_message
                  type: LONGTEXT
              - column:
                  name: error_detail
                  type: LONGTEXT
              - column:
                  name: input_tokens
                  type: INT
              - column:
                  name: output_tokens
                  type: INT
              - column:
                  name: cost_usd
                  type: DECIMAL(12,6)
        - addForeignKeyConstraint:
            baseTableName: gera_sales_page_stage_execution
            baseColumnNames: experiment_id
            constraintName: fk_gera_sales_page_stage_execution_experiment
            referencedTableName: experiment
            referencedColumnNames: id
        - createIndex:
            tableName: gera_sales_page_stage_execution
            indexName: idx_gera_sales_page_pending
            columns:
              - column:
                  name: stage_code
              - column:
                  name: status
              - column:
                  name: execution_requested_at

  - changeSet:
      id: 2026-06-30-gera-sales-page-v1-03
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO pipeline (name, code, module, description, active, created_at, updated_at)
              SELECT 'GeraSalesPage v1', 'gera-sales-page-v1', 'EXPERIMENT',
                     'Pipeline independente para gerar página de vendas direta para checkout.',
                     true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM pipeline WHERE code = 'gera-sales-page-v1'
              );
              INSERT INTO ai_prompt_schema_template
                (template_key, pipeline_code, stage_code, version, openai_model, schema_name, prompt_markdown_content, schema_json, active, created_at, updated_at)
              VALUES
                ('gera-sales-page-v1:sales-page-offer-brief:v1', 'gera-sales-page-v1', 'sales-page-offer-brief', 'v1', 'gpt-5.5', 'gera_sales_page_v1_offer_brief',
                 'Você é um estrategista de vendas diretas. Gere a etapa sales-page-offer-brief do GeraSalesPage v1. Use o experimento, checkout e saídas anteriores abaixo. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["summary","promise","checkoutUrl","offerStack","risks"],"properties":{"summary":{"type":"string"},"promise":{"type":"string"},"checkoutUrl":{"type":"string"},"offerStack":{"type":"array","items":{"type":"string"}},"risks":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-wireframe:v1', 'gera-sales-page-v1', 'sales-page-wireframe', 'v1', 'gpt-5.5', 'gera_sales_page_v1_wireframe',
                 'Você é um arquiteto de página de vendas direta. Gere a etapa sales-page-wireframe do GeraSalesPage v1, focada em checkout real e sem formulário de lead. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["sections","primaryCta","checkoutUrl"],"properties":{"sections":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","goal","content"],"properties":{"id":{"type":"string"},"goal":{"type":"string"},"content":{"type":"string"}}}},"primaryCta":{"type":"string"},"checkoutUrl":{"type":"string"}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-copy:v1', 'gera-sales-page-v1', 'sales-page-copy', 'v1', 'gpt-5.5', 'gera_sales_page_v1_copy',
                 'Você é copywriter de resposta direta. Gere a etapa sales-page-copy do GeraSalesPage v1 usando a estrutura anterior. O CTA deve apontar para checkout, não para captura. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["headline","subheadline","sections","cta"],"properties":{"headline":{"type":"string"},"subheadline":{"type":"string"},"sections":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","title","body"],"properties":{"id":{"type":"string"},"title":{"type":"string"},"body":{"type":"string"}}}},"cta":{"type":"string"}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-visual-plan:v1', 'gera-sales-page-v1', 'sales-page-visual-plan', 'v1', 'gpt-5.5', 'gera_sales_page_v1_visual_plan',
                 'Você é diretor de arte de venda direta. Gere a etapa sales-page-visual-plan do GeraSalesPage v1 com imagens apenas quando reduzem objeção, demonstram produto ou aumentam prova. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["visualDirection","imageBriefs","trustElements"],"properties":{"visualDirection":{"type":"string"},"imageBriefs":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["sectionId","purpose","prompt"],"properties":{"sectionId":{"type":"string"},"purpose":{"type":"string"},"prompt":{"type":"string"}}}},"trustElements":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-html:v1', 'gera-sales-page-v1', 'sales-page-html', 'v1', 'gpt-5.5', 'gera_sales_page_v1_html',
                 'Você é desenvolvedor front-end de landing de vendas. Gere a etapa sales-page-html do GeraSalesPage v1 em HTML responsivo, com CTAs usando a URL de checkout real. Não crie formulário. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["html","checkoutUrl","notes"],"properties":{"html":{"type":"string"},"checkoutUrl":{"type":"string"},"notes":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-checkout-quality-review:v1', 'gera-sales-page-v1', 'sales-page-checkout-quality-review', 'v1', 'gpt-5.5', 'gera_sales_page_v1_checkout_quality_review',
                 'Você é auditor comercial. Revise a página de venda direta do GeraSalesPage v1. Bloqueie se CTA não apontar para checkout real, se houver formulário obrigatório ou se promessa/preço/garantia estiverem confusos. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["approved","blockers","recommendation"],"properties":{"approved":{"type":"boolean"},"blockers":{"type":"array","items":{"type":"string"}},"recommendation":{"type":"string"}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-publication-package:v1', 'gera-sales-page-v1', 'sales-page-publication-package', 'v1', 'gpt-5.5', 'gera_sales_page_v1_publication_package',
                 'Você é responsável por empacotar a página de venda direta para publicação. Gere o pacote final, mantendo HTML publicável, checkoutUrl e checklist de liberação para mídia paga. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["readyForTraffic","html","checkoutUrl","releaseChecklist"],"properties":{"readyForTraffic":{"type":"boolean"},"html":{"type":"string"},"checkoutUrl":{"type":"string"},"releaseChecklist":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON DUPLICATE KEY UPDATE updated_at = CURRENT_TIMESTAMP;
