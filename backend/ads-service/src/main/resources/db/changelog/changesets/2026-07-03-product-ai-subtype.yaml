databaseChangeLog:
  - changeSet:
      id: 2026-07-03-product-ai-subtype-01
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: hypothesis
        - not:
            columnExists:
              tableName: hypothesis
              columnName: product_ai_subtype
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE hypothesis
                ADD COLUMN product_ai_subtype VARCHAR(48) NULL AFTER kpi_target_cpl;
  - changeSet:
      id: 2026-07-03-product-ai-subtype-02
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: experiment
        - not:
            columnExists:
              tableName: experiment
              columnName: product_ai_subtype
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE experiment
                ADD COLUMN product_ai_subtype VARCHAR(48) NULL AFTER experiment_type;
  - changeSet:
      id: 2026-07-04-gera-sales-page-product-ai-templates-v2-001
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: ai_prompt_schema_template
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE ai_prompt_schema_template
              SET active = false, updated_at = CURRENT_TIMESTAMP
              WHERE pipeline_code = 'gera-sales-page-v1'
                AND stage_code IN (
                  'sales-page-offer-brief',
                  'sales-page-wireframe',
                  'sales-page-copy',
                  'sales-page-visual-plan',
                  'sales-page-html',
                  'sales-page-checkout-quality-review',
                  'sales-page-publication-package'
                );

              INSERT INTO ai_prompt_schema_template
                (template_key, pipeline_code, stage_code, version, openai_model, schema_name, prompt_markdown_content, schema_json, active, created_at, updated_at)
              VALUES
                ('gera-sales-page-v1:sales-page-offer-brief:v2', 'gera-sales-page-v1', 'sales-page-offer-brief', 'v2', 'gpt-5.5', 'gera_sales_page_v1_offer_brief',
                 'Você é um estrategista de vendas diretas. Gere a etapa sales-page-offer-brief do GeraSalesPage v1. Se experiment.checkoutUrl apontar para Lead Portal, flow ou funil de personalização, a página vende a promessa e conduz o lead ao formulário de personalização antes do checkout; não trate essa URL como checkout direto. Explique claramente amostra gratuita, produto pago, preço e entrega. Se a URL for checkout real, mantenha venda direta para checkout. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["summary","promise","checkoutUrl","offerStack","risks"],"properties":{"summary":{"type":"string"},"promise":{"type":"string"},"checkoutUrl":{"type":"string"},"offerStack":{"type":"array","items":{"type":"string"}},"risks":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-wireframe:v2', 'gera-sales-page-v1', 'sales-page-wireframe', 'v2', 'gpt-5.5', 'gera_sales_page_v1_wireframe',
                 'Você é um arquiteto de página de vendas. Gere a etapa sales-page-wireframe do GeraSalesPage v1. Se experiment.checkoutUrl apontar para Lead Portal, flow ou funil de personalização, a página deve conter promessa, prova, explicação da amostra personalizada e bloco de coleta pelo formulário gerenciado antes da compra; os CTAs devem avançar para esse formulário, não para checkout direto. Se a URL for checkout real, foque em checkout. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["sections","primaryCta","checkoutUrl"],"properties":{"sections":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","goal","content"],"properties":{"id":{"type":"string"},"goal":{"type":"string"},"content":{"type":"string"}}}},"primaryCta":{"type":"string"},"checkoutUrl":{"type":"string"}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-copy:v2', 'gera-sales-page-v1', 'sales-page-copy', 'v2', 'gpt-5.5', 'gera_sales_page_v1_copy',
                 'Você é copywriter de resposta direta. Gere a etapa sales-page-copy do GeraSalesPage v1. Se experiment.checkoutUrl apontar para Lead Portal, flow ou funil de personalização, deixe explícito: a primeira ação é enviar dados para receber uma amostra personalizada; a compra de preço informado libera a entrega paga completa; a amostra não é o produto inteiro. O CTA deve vender o benefício de preencher o formulário. Se a URL for checkout real, o CTA aponta para checkout. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["headline","subheadline","sections","cta"],"properties":{"headline":{"type":"string"},"subheadline":{"type":"string"},"sections":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","title","body"],"properties":{"id":{"type":"string"},"title":{"type":"string"},"body":{"type":"string"}}}},"cta":{"type":"string"}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-visual-plan:v2', 'gera-sales-page-v1', 'sales-page-visual-plan', 'v2', 'gpt-5.5', 'gera_sales_page_v1_visual_plan',
                 'Você é diretor de arte de venda direta. Gere a etapa sales-page-visual-plan do GeraSalesPage v1. Para URL de Lead Portal, flow ou funil de personalização, use visuais que materializem personalização, antes/depois, exemplo de amostra e diferença entre preview gratuito e entrega paga. Para checkout real, use imagens que reduzem objeção, demonstram produto ou aumentam prova. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["visualDirection","imageBriefs","trustElements"],"properties":{"visualDirection":{"type":"string"},"imageBriefs":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["sectionId","purpose","prompt"],"properties":{"sectionId":{"type":"string"},"purpose":{"type":"string"},"prompt":{"type":"string"}}}},"trustElements":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-html:v2', 'gera-sales-page-v1', 'sales-page-html', 'v2', 'gpt-5.5', 'gera_sales_page_v1_html',
                 'Você é desenvolvedor front-end de landing de vendas. Gere a etapa sales-page-html do GeraSalesPage v1 em HTML responsivo. Se experiment.checkoutUrl apontar para Lead Portal, flow ou funil de personalização, os CTAs devem apontar para o bloco de formulário gerenciado; não crie checkout direto como primeira ação e não crie campos próprios fora do formulário gerenciado. Explique amostra, preço e entrega paga com clareza. Se a URL for checkout real, use a URL de checkout real e não crie formulário. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["html","checkoutUrl","notes"],"properties":{"html":{"type":"string"},"checkoutUrl":{"type":"string"},"notes":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-checkout-quality-review:v2', 'gera-sales-page-v1', 'sales-page-checkout-quality-review', 'v2', 'gpt-5.5', 'gera_sales_page_v1_checkout_quality_review',
                 'Você é auditor comercial. Revise a página do GeraSalesPage v1. Se experiment.checkoutUrl apontar para Lead Portal, flow ou funil de personalização, aprove formulário e CTA para coleta de personalização, mas bloqueie se a página confundir amostra gratuita, compra paga, preço, entrega completa ou limites da amostra. Não exija checkout direto nesse caso. Se a URL for checkout real, bloqueie se CTA não apontar para checkout real ou se houver formulário obrigatório. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["approved","blockers","recommendation"],"properties":{"approved":{"type":"boolean"},"blockers":{"type":"array","items":{"type":"string"}},"recommendation":{"type":"string"}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ('gera-sales-page-v1:sales-page-publication-package:v2', 'gera-sales-page-v1', 'sales-page-publication-package', 'v2', 'gpt-5.5', 'gera_sales_page_v1_publication_package',
                 'Você é responsável por empacotar a página para publicação. Para URL de Lead Portal, flow ou funil de personalização, mantenha HTML publicável no funil-página, CTAs para o formulário gerenciado, clareza de amostra gratuita, produto pago, preço e entrega; o checklist deve confirmar que não há checkout direto como primeira ação. Para checkout real, mantenha checkoutUrl e checklist de liberação para mídia paga. Responda apenas JSON válido aderente ao schema. Experimento: {{experiment}} Saídas anteriores: {{previousStageOutputs}}',
                 '{"type":"object","additionalProperties":false,"required":["readyForTraffic","html","checkoutUrl","releaseChecklist"],"properties":{"readyForTraffic":{"type":"boolean"},"html":{"type":"string"},"checkoutUrl":{"type":"string"},"releaseChecklist":{"type":"array","items":{"type":"string"}}}}',
                 true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
              ON DUPLICATE KEY UPDATE
                prompt_markdown_content = VALUES(prompt_markdown_content),
                schema_json = VALUES(schema_json),
                active = true,
                updated_at = CURRENT_TIMESTAMP;
