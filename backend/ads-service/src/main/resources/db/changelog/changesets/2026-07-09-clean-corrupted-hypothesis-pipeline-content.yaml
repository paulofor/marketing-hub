databaseChangeLog:
  - changeSet:
      id: 2026-07-09-clean-corrupted-hypothesis-pipeline-content
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE hypothesis
              SET problem = 'Dor prioritária: agenda domiciliar instável por faltas, cancelamentos em cima da hora e ausência de regras claras com clientes.',
                  promise = 'Resultado desejável: uma manicure em domicílio conduzir a agenda com mais firmeza, clareza e previsibilidade, perdendo menos tempo com faltas, cancelamentos em cima da hora e deslocamentos mal planejados.',
                  mechanism = 'Mecanismo: Agenda Blindada por Confirmação e Rotas, com confirmação antecipada, política simples de sinal/cancelamento, mensagens prontas e organização por região.',
                  unique_mechanism = 'Agenda Blindada por Confirmação e Rotas',
                  success_rule = 'Prova: Diagnóstico Agenda Blindada de 7 Dias, mostrando atendimentos confirmados, horários vulneráveis, riscos de falta, deslocamentos soltos e mensagens prontas para agir antes do prejuízo.',
                  entrega = 'Oferta: Agenda Blindada 7D para Manicures em Domicílio, um kit digital com diagnóstico da agenda, mapa de risco, política de agendamento, mensagens de WhatsApp e checklist de organização por região.',
                  framework_json = '{"version":"dor-resultado-mecanismo-prova-oferta/v1","pain":{"surface":"Minha agenda até parece cheia, mas basta uma cliente desmarcar em cima da hora ou não aparecer que eu perco o horário, o deslocamento e ainda fico correndo atrás de encaixe para fechar o mês.","root":"Agenda domiciliar instável por faltas, cancelamentos em cima da hora e ausência de regras claras com clientes.","emotional":"A profissional sente ansiedade, frustração e medo de parecer grossa ao impor regras, mesmo trabalhando muito e entregando bom serviço.","social":"A falta de previsibilidade faz a manicure parecer desorganizada e reforça a comparação com profissionais que mostram agenda cheia nas redes.","cost":"Perda de dinheiro, horários vagos, deslocamentos sem retorno, material e tempo desperdiçados e menor previsibilidade de faturamento.","summary":"Dor prioritária: agenda domiciliar instável por faltas, cancelamentos em cima da hora e ausência de regras claras com clientes."},"result":{"desiredResult":"Agenda mais previsível e respeitada, com clientes sabendo quando confirmar, remarcar ou cancelar.","desiredIdentity":"Profissional organizada, firme e confiável, sem parecer grossa.","businessOutcome":"Menos faltas evitáveis, melhor aproveitamento de deslocamentos e maior previsibilidade da semana.","successSignal":"Mais atendimentos confirmados antes do deslocamento e menos horários vulneráveis sem ação.","summary":"Resultado desejável: uma manicure em domicílio conduzir a agenda com mais firmeza, clareza e previsibilidade."},"mechanism":{"core":"Confirmação antecipada, política simples de sinal/cancelamento, mensagens prontas e organização por região.","unique":"Agenda Blindada por Confirmação e Rotas.","visible":"Mapa de risco dos próximos 7 dias com status de confirmação, deslocamento e mensagens sugeridas.","believability":"O mecanismo atua em perdas evitáveis da rotina: falta de confirmação, regra mal explicada, cancelamento tardio e deslocamento sem segurança.","summary":"Mecanismo: Agenda Blindada por Confirmação e Rotas."},"proof":{"type":"Diagnóstico operacional com simulação antes/depois da agenda de 7 dias.","asset":"Diagnóstico Agenda Blindada de 7 Dias.","message":"A manicure enxerga se a agenda que parece cheia está realmente segura e recebe prioridades e mensagens para agir antes do deslocamento.","deliveryStage":"Pré-venda e demonstração do produto digital.","summary":"Prova: Diagnóstico Agenda Blindada de 7 Dias."},"offer":{"name":"Agenda Blindada 7D para Manicures em Domicílio","corePromise":"Organizar os próximos 7 dias de atendimentos em domicílio para reduzir improviso, faltas evitáveis e deslocamentos perdidos.","deliverables":"Diagnóstico da agenda, mapa de risco, política de agendamento, mensagens de WhatsApp e checklist de organização por região.","riskReversal":"A oferta não promete agenda cheia; promete clareza operacional e ações práticas para reduzir perdas evitáveis.","priceLogic":"Low-ticket prático, percebido como economia de tempo e proteção de horários já vendidos.","cta":"Blindar minha agenda dos próximos 7 dias","summary":"Oferta: Agenda Blindada 7D para Manicures em Domicílio."},"checklist":{"painReady":true,"resultReady":true,"mechanismReady":true,"proofReady":true,"offerReady":true,"approvedForExperiment":true,"notes":"Conteúdo saneado para remover caractere corrompido e JSON serializado dentro de campos comerciais."}}'
              WHERE id = UNHEX('06983F36590343FE90B29DA42FF9F15C');
