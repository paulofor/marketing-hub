databaseChangeLog:
  - changeSet:
      id: 2026-07-24-creative-rejection-reason
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: creative
        - not:
            - columnExists:
                tableName: creative
                columnName: rejection_reason
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE creative
                ADD COLUMN rejection_reason LONGTEXT NULL AFTER status;
