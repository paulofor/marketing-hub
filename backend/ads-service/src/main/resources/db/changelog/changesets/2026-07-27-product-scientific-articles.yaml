databaseChangeLog:
  - changeSet:
      id: 2026-07-27-product-scientific-articles-001
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: product
        - not:
            tableExists:
              tableName: product_scientific_article
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_scientific_article (
                id BIGINT NOT NULL AUTO_INCREMENT,
                product_id BIGINT NOT NULL,
                link VARCHAR(1024) NOT NULL,
                original_title VARCHAR(512) NOT NULL,
                portuguese_title VARCHAR(512) NOT NULL,
                summary LONGTEXT NOT NULL,
                mechanism_application LONGTEXT NOT NULL,
                created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                CONSTRAINT pk_product_scientific_article PRIMARY KEY (id),
                CONSTRAINT fk_product_scientific_article_product
                  FOREIGN KEY (product_id) REFERENCES product (id),
                CONSTRAINT uq_product_scientific_article_link UNIQUE (product_id, link)
              );
              CREATE INDEX idx_product_scientific_article_product
                ON product_scientific_article (product_id, id);
  - changeSet:
      id: 2026-07-27-product-scientific-articles-musa-seed-002
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: product
        - tableExists:
            tableName: product_scientific_article
        - columnExists:
            tableName: product
            columnName: slug
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO product_scientific_article (
                product_id,
                link,
                original_title,
                portuguese_title,
                summary,
                mechanism_application
              )
              SELECT id,
                     'https://doi.org/10.1016/j.jesp.2012.02.008',
                     'Enclothed cognition',
                     'Cognição vestida',
                     'O artigo propõe que a roupa pode influenciar processos psicológicos quando a pessoa atribui significado simbólico à peça e a usa no contexto da tarefa.',
                     'Sustenta a ideia de microdecisões intencionais: no MUSA, a peça-sinal e o acabamento não são vendidos como luxo, mas como gatilhos de presença percebida e autopercepção mais alinhada.'
                FROM product
               WHERE slug = 'metodo-musa-7-dias'
              ON DUPLICATE KEY UPDATE
                original_title = VALUES(original_title),
                portuguese_title = VALUES(portuguese_title),
                summary = VALUES(summary),
                mechanism_application = VALUES(mechanism_application);
              INSERT INTO product_scientific_article (
                product_id,
                link,
                original_title,
                portuguese_title,
                summary,
                mechanism_application
              )
              SELECT id,
                     'https://doi.org/10.1177/1948550615579462',
                     'The Cognitive Consequences of Formal Clothing',
                     'As consequências cognitivas da roupa formal',
                     'O estudo relaciona roupa formal a mudanças em processamento cognitivo e percepção de poder situacional, indicando que formalidade visual pode alterar a forma como a pessoa se percebe e atua.',
                     'Apoia o mecanismo de presença elegante acessível ao transformar formalidade em pequenos sinais práticos: cor, corte, acabamento e postura, sem exigir troca completa de guarda-roupa.'
                FROM product
               WHERE slug = 'metodo-musa-7-dias'
              ON DUPLICATE KEY UPDATE
                original_title = VALUES(original_title),
                portuguese_title = VALUES(portuguese_title),
                summary = VALUES(summary),
                mechanism_application = VALUES(mechanism_application);
              INSERT INTO product_scientific_article (
                product_id,
                link,
                original_title,
                portuguese_title,
                summary,
                mechanism_application
              )
              SELECT id,
                     'https://doi.org/10.1108/13612021311305128',
                     'The influence of clothing on first impressions',
                     'A influência da roupa nas primeiras impressões',
                     'O artigo analisa como escolhas de vestimenta participam da formação de primeiras impressões em contextos sociais e profissionais.',
                     'Dá base para o MUSA tratar roupa, coerência de cor e acabamento como sinais de leitura rápida. A promessa deve falar em favorecer percepção de cuidado e intenção, não em controlar a opinião de todos.'
                FROM product
               WHERE slug = 'metodo-musa-7-dias'
              ON DUPLICATE KEY UPDATE
                original_title = VALUES(original_title),
                portuguese_title = VALUES(portuguese_title),
                summary = VALUES(summary),
                mechanism_application = VALUES(mechanism_application);
              INSERT INTO product_scientific_article (
                product_id,
                link,
                original_title,
                portuguese_title,
                summary,
                mechanism_application
              )
              SELECT id,
                     'https://doi.org/10.1177/10888683231157961',
                     'Dress is a Fundamental Component of Person Perception',
                     'A roupa é um componente fundamental da percepção de pessoas',
                     'A revisão posiciona a roupa como componente relevante da percepção social, conectando vestimenta a julgamentos sobre pessoa, contexto e intenção.',
                     'Sustenta a arquitetura do mecanismo como sistema de sinais repetíveis: reduzir ruído visual, escolher uma peça-sinal e manter coerência ajudam a comunicar presença de forma mais clara e responsável.'
                FROM product
               WHERE slug = 'metodo-musa-7-dias'
              ON DUPLICATE KEY UPDATE
                original_title = VALUES(original_title),
                portuguese_title = VALUES(portuguese_title),
                summary = VALUES(summary),
                mechanism_application = VALUES(mechanism_application);
