databaseChangeLog:
  - changeSet:
      id: 2026-07-28-experiment-video-hls-playback-url-001
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: experiment_video_asset
        - not:
            - columnExists:
                tableName: experiment_video_asset
                columnName: hls_playback_url
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE experiment_video_asset
                  ADD COLUMN hls_playback_url VARCHAR(2048) NULL AFTER asset_url;

  - changeSet:
      id: 2026-07-28-experiment-video-hls-playback-url-002
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: experiment_video_asset
        - columnExists:
            tableName: experiment_video_asset
            columnName: hls_playback_url
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE experiment_video_asset
                 SET hls_playback_url = asset_url
               WHERE hls_playback_url IS NULL
                 AND asset_url LIKE '%.m3u8%';

  - changeSet:
      id: 2026-07-28-experiment-video-hls-playback-url-003
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: experiment_video_asset
        - columnExists:
            tableName: experiment_video_asset
            columnName: hls_playback_url
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE experiment_video_asset
                 SET hls_playback_url = '/assets/hls/musa-v6-microexperiencia-visivel/index.m3u8'
               WHERE id IN (22, 23)
                 AND sales_video_job_id = 20462
                 AND status = 'READY'
                 AND review_status = 'APPROVED';
