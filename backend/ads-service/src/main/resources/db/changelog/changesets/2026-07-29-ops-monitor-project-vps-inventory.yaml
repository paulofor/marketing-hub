databaseChangeLog:
  - changeSet:
      id: 2026-07-29-ops-monitor-012-project-vps-inventory
      author: marketing-hub
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - tableExists:
            tableName: ops_monitored_module
