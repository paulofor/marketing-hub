databaseChangeLog:
  - logicalFilePath: db/changelog/changesets/2026-07-30-pde-slot-editable-contract.yaml
  - changeSet:
      id: 2026-07-30-pde-slot-editable-contract-001
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: pde_production_slot
        - not:
            columnExists:
              tableName: pde_production_slot
              columnName: draft_experience_json
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE pde_production_slot
                ADD COLUMN draft_experience_json LONGTEXT NULL,
                ADD COLUMN published_experience_json LONGTEXT NULL,
                ADD COLUMN published_by VARCHAR(191) NULL,
                ADD COLUMN published_at DATETIME NULL,
                ADD KEY idx_pde_production_slot_published (product_slug, experience_version, published_at);
