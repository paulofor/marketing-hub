databaseChangeLog:
  - logicalFilePath: db/changelog/changesets/2026-07-30-pde-slot-layout-key.yaml
  - changeSet:
      id: 2026-07-30-pde-slot-layout-key-001
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: pde_production_slot
        - not:
            columnExists:
              tableName: pde_production_slot
              columnName: layout_key
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE pde_production_slot
                ADD COLUMN layout_key VARCHAR(80) NOT NULL DEFAULT 'video-explicativo' AFTER experience_version,
                ADD KEY idx_pde_production_slot_layout (product_slug, layout_key);

              UPDATE pde_production_slot
              SET layout_key = CASE
                WHEN slot_code = 'v6' THEN 'video-motivacional'
                WHEN slot_code = 'v7' THEN 'espelho-antes-de-sair'
                WHEN slot_code IN ('v8', 'v9', 'v10') THEN 'espelho-antes-de-sair'
                WHEN experience_version LIKE '%estrada-desejo%' THEN 'estrada-desejo'
                ELSE 'video-explicativo'
              END
              WHERE product_slug = 'metodo-musa-7-dias';
