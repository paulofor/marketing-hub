databaseChangeLog:
  - changeSet:
      id: 2026-08-03-growth-operator-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - not:
            - tableExists:
                tableName: growth_operator_execution
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE growth_operator_execution (
                id BIGINT NOT NULL AUTO_INCREMENT,
                commercial_plan_id BIGINT NOT NULL,
                week_number INT NOT NULL,
                status VARCHAR(32) NOT NULL,
                authority_mode VARCHAR(32) NOT NULL,
                objective TEXT NOT NULL,
                blocker TEXT NULL,
                evidence_snapshot LONGTEXT NULL,
                alternatives_json LONGTEXT NULL,
                diagnosis_json LONGTEXT NULL,
                raw_model_response LONGTEXT NULL,
                recommended_decision VARCHAR(32) NULL,
                recommended_action TEXT NULL,
                error_message TEXT NULL,
                model VARCHAR(100) NULL,
                input_tokens BIGINT NULL,
                output_tokens BIGINT NULL,
                estimated_cost DECIMAL(12,4) NULL,
                started_at DATETIME NULL,
                finished_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                CONSTRAINT fk_growth_operator_plan
                  FOREIGN KEY (commercial_plan_id) REFERENCES commercial_plan(id),
                INDEX idx_growth_operator_pending (status, created_at),
                INDEX idx_growth_operator_plan (commercial_plan_id, created_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
