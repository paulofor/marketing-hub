databaseChangeLog:
  - changeSet:
      id: 2026-08-04-financial-agent-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE financial_agent_execution (
                id BIGINT NOT NULL AUTO_INCREMENT,
                commercial_plan_id BIGINT NOT NULL,
                status VARCHAR(32) NOT NULL,
                authority_mode VARCHAR(64) NOT NULL,
                financial_snapshot LONGTEXT NOT NULL,
                reconciliation_json LONGTEXT NULL,
                daily_report LONGTEXT NULL,
                raw_model_response LONGTEXT NULL,
                model VARCHAR(191) NULL,
                estimated_cost DECIMAL(12,4) NULL,
                error_message TEXT NULL,
                started_at DATETIME NULL,
                finished_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                CONSTRAINT fk_financial_agent_execution_plan
                  FOREIGN KEY (commercial_plan_id) REFERENCES commercial_plan(id),
                INDEX idx_financial_agent_plan_created (commercial_plan_id, created_at),
                INDEX idx_financial_agent_status_created (status, created_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
