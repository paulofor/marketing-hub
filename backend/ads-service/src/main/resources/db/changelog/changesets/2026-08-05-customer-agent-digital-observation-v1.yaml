databaseChangeLog:
  - changeSet:
      id: 2026-08-05-customer-agent-digital-observation-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE customer_digital_observation (
                id BIGINT NOT NULL AUTO_INCREMENT,
                persona_id BIGINT NOT NULL,
                objective TEXT NOT NULL,
                authorized_sources_json LONGTEXT NOT NULL,
                status VARCHAR(30) NOT NULL,
                device_profile VARCHAR(40) NOT NULL,
                observation_json LONGTEXT NULL,
                simulated_reaction_json LONGTEXT NULL,
                commercial_hypothesis_json LONGTEXT NULL,
                human_confirmation_json LONGTEXT NULL,
                raw_model_response LONGTEXT NULL,
                model_name VARCHAR(255) NULL,
                started_at DATETIME NULL,
                finished_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                INDEX idx_customer_digital_observation_status (status, created_at),
                CONSTRAINT fk_customer_digital_observation_persona FOREIGN KEY (persona_id) REFERENCES customer_persona(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
