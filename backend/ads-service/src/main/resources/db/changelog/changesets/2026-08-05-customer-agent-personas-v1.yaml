databaseChangeLog:
  - changeSet:
      id: 2026-08-05-customer-agent-personas-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE customer_persona (
                id BIGINT NOT NULL AUTO_INCREMENT,
                persona_key VARCHAR(100) NOT NULL,
                name VARCHAR(255) NOT NULL,
                product_id BIGINT NULL,
                version_number INT NOT NULL DEFAULT 1,
                confidence_level VARCHAR(40) NOT NULL,
                life_context TEXT NOT NULL,
                pain TEXT NOT NULL,
                desired_progress TEXT NOT NULL,
                awareness_level VARCHAR(60) NULL,
                objections LONGTEXT NULL,
                trust_criteria LONGTEXT NULL,
                language_samples LONGTEXT NULL,
                evidence_json LONGTEXT NOT NULL,
                active TINYINT(1) NOT NULL DEFAULT 1,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                UNIQUE INDEX uq_customer_persona_key_version (persona_key, version_number),
                INDEX idx_customer_persona_product (product_id),
                CONSTRAINT fk_customer_persona_product FOREIGN KEY (product_id) REFERENCES product(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE customer_agent_evaluation (
                id BIGINT NOT NULL AUTO_INCREMENT,
                persona_id BIGINT NOT NULL,
                asset_type VARCHAR(40) NOT NULL,
                asset_reference VARCHAR(255) NOT NULL,
                status VARCHAR(30) NOT NULL,
                simulated_assessment LONGTEXT NULL,
                hypothesis_json LONGTEXT NULL,
                human_result_json LONGTEXT NULL,
                raw_model_response LONGTEXT NULL,
                model_name VARCHAR(255) NULL,
                started_at DATETIME NULL,
                finished_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                INDEX idx_customer_agent_status (status, created_at),
                CONSTRAINT fk_customer_agent_persona FOREIGN KEY (persona_id) REFERENCES customer_persona(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              INSERT INTO agent (
                theme_id, name, agent_key, status, current_version, execution_mode,
                description, owner_name, business_objective, success_metrics, model_name,
                trigger_policy, authority_policy, prompt_contract_path, schema_contract_path
              )
              SELECT at.id, 'Agente Cliente', 'customer-agent', 'TEST', 1, 'ON_DEMAND',
                'Avalia ofertas, videos e paginas por personas baseadas em evidencias sem simular validacao comercial.',
                'Marketing Hub', 'Antecipar objecoes e atritos antes de testes com trafego humano.',
                'Correspondencia entre previsoes e comportamento humano posterior.', 'gpt-5.6-sol',
                'Avaliacao solicitada para ativo e persona selecionados.',
                'Somente leitura; nao publica, altera ativo, campanha, preco ou resultado humano.',
                'customer-agent-worker/src/main/resources/prompts/customer-agent/v1/evaluation.md',
                'customer-agent-worker/src/main/resources/prompts/customer-agent/v1/evaluation-schema.json'
              FROM agent_theme at
              WHERE at.name = 'Operacoes Autonomas'
                AND NOT EXISTS (SELECT 1 FROM agent WHERE agent_key = 'customer-agent');

              INSERT INTO agent_version (agent_id, version_number, contract_snapshot, created_at)
              SELECT a.id, 1,
                CONCAT('{"agentKey":"customer-agent","version":1,"status":"TEST","model":"gpt-5.6-sol","prompt":"', a.prompt_contract_path, '","schema":"', a.schema_contract_path, '"}'),
                UTC_TIMESTAMP()
              FROM agent a
              WHERE a.agent_key = 'customer-agent'
                AND NOT EXISTS (
                  SELECT 1 FROM agent_version av
                  WHERE av.agent_id = a.id AND av.version_number = 1
                );
