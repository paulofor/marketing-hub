databaseChangeLog:
  - changeSet:
      id: 2026-08-06-codex-agent-execution-telemetry-v1
      author: codex
      preConditions:
        onFail: HALT
        dbms:
          type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE codex_agent_execution_telemetry (
                id BIGINT NOT NULL AUTO_INCREMENT,
                agent_type VARCHAR(64) NOT NULL,
                execution_id BIGINT NOT NULL,
                status VARCHAR(32) NOT NULL,
                process_id BIGINT NULL,
                process_alive TINYINT(1) NOT NULL DEFAULT 0,
                event_count BIGINT NOT NULL DEFAULT 0,
                output_bytes BIGINT NOT NULL DEFAULT 0,
                input_tokens BIGINT NULL,
                output_tokens BIGINT NULL,
                last_event_type VARCHAR(64) NULL,
                last_activity_at DATETIME NULL,
                started_at DATETIME NOT NULL,
                finished_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                UNIQUE KEY uk_codex_agent_execution (agent_type, execution_id),
                KEY idx_codex_agent_activity (status, last_activity_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
