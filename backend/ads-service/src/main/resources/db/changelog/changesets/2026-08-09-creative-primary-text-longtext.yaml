databaseChangeLog:
  - changeSet:
      id: 2026-08-09-creative-primary-text-longtext
      author: marketinghub
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: creative
        - columnExists:
            tableName: creative
            columnName: primary_text
      changes:
        - modifyDataType:
            tableName: creative
            columnName: primary_text
            newDataType: LONGTEXT
      rollback:
        - modifyDataType:
            tableName: creative
            columnName: primary_text
            newDataType: VARCHAR(255)
