databaseChangeLog:
  - changeSet:
      id: 2026-08-09-premium-agent-memory-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE premium_agent_memory (
                id BIGINT NOT NULL AUTO_INCREMENT,
                agent_key VARCHAR(80) NOT NULL,
                tenant_key VARCHAR(120) NOT NULL,
                scope_type VARCHAR(60) NOT NULL,
                scope_id VARCHAR(120) NOT NULL,
                specialty VARCHAR(120) NOT NULL,
                content_text TEXT NOT NULL,
                evidence_text TEXT NOT NULL,
                source_reference VARCHAR(700) NULL,
                source_execution_id VARCHAR(120) NOT NULL,
                status VARCHAR(30) NOT NULL,
                confidence DECIMAL(5,4) NOT NULL,
                content_sha256 VARCHAR(64) NOT NULL,
                contract_version VARCHAR(30) NOT NULL,
                valid_until DATETIME NULL,
                retrieval_count BIGINT NOT NULL DEFAULT 0,
                last_retrieved_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                UNIQUE KEY uk_premium_agent_memory_dedup (agent_key, tenant_key, scope_type, scope_id, content_sha256),
                INDEX idx_premium_agent_memory_retrieval (agent_key, scope_type, scope_id, status, valid_until),
                INDEX idx_premium_agent_memory_tenant (agent_key, tenant_key, status)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE premium_agent_memory_feedback (
                id BIGINT NOT NULL AUTO_INCREMENT,
                memory_id BIGINT NOT NULL,
                outcome VARCHAR(30) NOT NULL,
                evidence_text TEXT NOT NULL,
                source_reference VARCHAR(700) NULL,
                created_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                INDEX idx_premium_agent_memory_feedback_memory (memory_id, created_at),
                CONSTRAINT fk_premium_agent_memory_feedback_memory FOREIGN KEY (memory_id) REFERENCES premium_agent_memory(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
