databaseChangeLog:
  - changeSet:
      id: 2026-08-11-agent-task-inbox
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE agent_task (
                id BIGINT NOT NULL AUTO_INCREMENT,
                assigned_agent_id BIGINT NOT NULL,
                requested_by_agent_id BIGINT NULL,
                requested_by_type VARCHAR(20) NOT NULL,
                requested_by_name VARCHAR(100) NOT NULL,
                title VARCHAR(160) NOT NULL,
                description LONGTEXT NOT NULL,
                priority VARCHAR(20) NOT NULL,
                status VARCHAR(30) NOT NULL,
                source_reference VARCHAR(200) NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                INDEX idx_agent_task_inbox (assigned_agent_id, status, created_at),
                INDEX idx_agent_task_requester (requested_by_agent_id, created_at),
                CONSTRAINT fk_agent_task_assignee FOREIGN KEY (assigned_agent_id) REFERENCES agent(id),
                CONSTRAINT fk_agent_task_requester FOREIGN KEY (requested_by_agent_id) REFERENCES agent(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE agent_task;
