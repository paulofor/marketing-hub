databaseChangeLog:
  - changeSet:
      id: 2026-08-11-opportunity-dossier-v1
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE opportunity_dossier (
                id BIGINT NOT NULL AUTO_INCREMENT,
                title VARCHAR(191) NOT NULL,
                owner_agent_key VARCHAR(64) NOT NULL,
                status VARCHAR(32) NOT NULL,
                target_audience VARCHAR(512) NOT NULL,
                main_pain VARCHAR(512) NOT NULL,
                reference_product VARCHAR(512) NOT NULL,
                ai_advantage LONGTEXT NOT NULL,
                proposed_offer LONGTEXT NULL,
                preliminary_price DECIMAL(12,2) NULL,
                delivery_model LONGTEXT NULL,
                known_risks LONGTEXT NULL,
                experiment_recommendation LONGTEXT NULL,
                human_decision_by VARCHAR(191) NULL,
                human_decision_at DATETIME NULL,
                converted_plan_id BIGINT NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                CONSTRAINT fk_opportunity_dossier_plan FOREIGN KEY (converted_plan_id) REFERENCES commercial_plan(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE opportunity_evidence (
                id BIGINT NOT NULL AUTO_INCREMENT,
                dossier_id BIGINT NOT NULL,
                source_url VARCHAR(1024) NOT NULL,
                summary LONGTEXT NOT NULL,
                created_by VARCHAR(191) NOT NULL,
                created_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                KEY idx_opportunity_evidence_dossier (dossier_id),
                CONSTRAINT fk_opportunity_evidence_dossier FOREIGN KEY (dossier_id) REFERENCES opportunity_dossier(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE opportunity_agent_review (
                id BIGINT NOT NULL AUTO_INCREMENT,
                dossier_id BIGINT NOT NULL,
                agent_key VARCHAR(64) NOT NULL,
                decision VARCHAR(24) NULL,
                rationale LONGTEXT NULL,
                risks LONGTEXT NULL,
                recommendation LONGTEXT NULL,
                requested_at DATETIME NOT NULL,
                completed_at DATETIME NULL,
                PRIMARY KEY (id),
                UNIQUE KEY uk_opportunity_review_agent (dossier_id, agent_key),
                CONSTRAINT fk_opportunity_review_dossier FOREIGN KEY (dossier_id) REFERENCES opportunity_dossier(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
