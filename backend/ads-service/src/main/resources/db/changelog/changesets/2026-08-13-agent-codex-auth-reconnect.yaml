databaseChangeLog:
  - changeSet:
      id: 2026-08-13-agent-codex-auth-reconnect
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE agent_codex_auth_reconnect (
                id BIGINT NOT NULL AUTO_INCREMENT,
                agent_id BIGINT NOT NULL,
                status VARCHAR(30) NOT NULL,
                verification_url VARCHAR(500) NULL,
                user_code VARCHAR(30) NULL,
                requested_by VARCHAR(100) NOT NULL,
                detail VARCHAR(500) NULL,
                requested_at DATETIME NOT NULL,
                started_at DATETIME NULL,
                completed_at DATETIME NULL,
                PRIMARY KEY (id),
                INDEX idx_agent_codex_auth_agent_requested (agent_id, requested_at),
                INDEX idx_agent_codex_auth_pending (agent_id, status, requested_at),
                CONSTRAINT fk_agent_codex_auth_agent FOREIGN KEY (agent_id) REFERENCES agent(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
