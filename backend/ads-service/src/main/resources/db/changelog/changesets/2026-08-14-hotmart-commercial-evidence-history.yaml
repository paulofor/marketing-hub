databaseChangeLog:
  - changeSet:
      id: 2026-08-14-hotmart-commercial-evidence-history
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE mois_collected_reference
                ADD COLUMN hotmart_rating DECIMAL(5,2) NULL AFTER hotmart_price,
                ADD COLUMN hotmart_review_count INT NULL AFTER hotmart_rating,
                ADD COLUMN hotmart_blueprint DECIMAL(10,2) NULL AFTER hotmart_review_count,
                ADD COLUMN hotmart_commission VARCHAR(128) NULL AFTER hotmart_blueprint,
                ADD COLUMN hotmart_category VARCHAR(255) NULL AFTER hotmart_commission,
                ADD COLUMN hotmart_format VARCHAR(128) NULL AFTER hotmart_category;
              CREATE INDEX idx_mois_hotmart_reference_history
                ON mois_collected_reference (workspace_id, source, reference_id, collected_at);
