databaseChangeLog:
  - changeSet:
      id: 2026-08-17-temis-visual-learning-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE commercial_plan_image_studio_job
                ADD COLUMN playbook_version VARCHAR(80) NULL AFTER model,
                ADD COLUMN playbook_context_key VARCHAR(120) NULL AFTER playbook_version,
                ADD COLUMN playbook_json LONGTEXT NULL AFTER playbook_context_key,
                ADD INDEX idx_image_studio_playbook_context
                  (playbook_context_key, playbook_version, created_at);

              CREATE TABLE temis_visual_learning_run (
                id BIGINT NOT NULL AUTO_INCREMENT,
                context_key VARCHAR(120) NOT NULL,
                status VARCHAR(32) NOT NULL,
                baseline_version VARCHAR(80) NOT NULL,
                candidate_version VARCHAR(80) NOT NULL,
                replay_case_ids_json LONGTEXT NOT NULL,
                holdout_case_ids_json LONGTEXT NOT NULL,
                input_json LONGTEXT NOT NULL,
                output_json LONGTEXT NULL,
                producer_execution_id VARCHAR(64) NULL,
                error LONGTEXT NULL,
                memory_id BIGINT NULL,
                learning_experiment_id BIGINT NULL,
                started_at DATETIME NULL,
                finished_at DATETIME NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                UNIQUE KEY uk_temis_visual_learning_candidate (candidate_version),
                INDEX idx_temis_visual_learning_queue (status, created_at),
                INDEX idx_temis_visual_learning_context (context_key, status, id),
                CONSTRAINT fk_temis_visual_learning_memory
                  FOREIGN KEY (memory_id) REFERENCES premium_agent_memory(id),
                CONSTRAINT fk_temis_visual_learning_experiment
                  FOREIGN KEY (learning_experiment_id) REFERENCES governed_agent_learning_experiment(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE TABLE temis_visual_learning_case (
                id BIGINT NOT NULL AUTO_INCREMENT,
                source_type VARCHAR(24) NOT NULL,
                source_id BIGINT NOT NULL,
                commercial_plan_id BIGINT NULL,
                experiment_id BIGINT NULL,
                context_key VARCHAR(120) NOT NULL,
                playbook_version VARCHAR(80) NOT NULL,
                placement VARCHAR(32) NOT NULL,
                format VARCHAR(32) NOT NULL,
                attempt_number INT NOT NULL,
                approved BIT NOT NULL DEFAULT 0,
                quality_score DECIMAL(8,4) NOT NULL,
                cost_usd DECIMAL(12,4) NOT NULL,
                issue_codes_json LONGTEXT NOT NULL,
                evidence_json LONGTEXT NOT NULL,
                learning_run_id BIGINT NULL,
                created_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                UNIQUE KEY uk_temis_visual_learning_source (source_type, source_id),
                INDEX idx_temis_visual_learning_sample
                  (context_key, learning_run_id, id),
                INDEX idx_temis_visual_learning_metrics
                  (context_key, playbook_version, id),
                CONSTRAINT fk_temis_visual_learning_case_plan
                  FOREIGN KEY (commercial_plan_id) REFERENCES commercial_plan(id),
                CONSTRAINT fk_temis_visual_learning_case_experiment
                  FOREIGN KEY (experiment_id) REFERENCES experiment(id),
                CONSTRAINT fk_temis_visual_learning_case_run
                  FOREIGN KEY (learning_run_id) REFERENCES temis_visual_learning_run(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
