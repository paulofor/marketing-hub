databaseChangeLog:
  - changeSet:
      id: 2026-08-20-agent-task-model-cost
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE agent_task
                ADD COLUMN input_tokens BIGINT NULL AFTER execution_error,
                ADD COLUMN cached_input_tokens BIGINT NULL AFTER input_tokens,
                ADD COLUMN output_tokens BIGINT NULL AFTER cached_input_tokens,
                ADD COLUMN estimated_cost_usd DECIMAL(18,8) NULL AFTER output_tokens,
                ADD COLUMN cost_estimation_status VARCHAR(32) NOT NULL DEFAULT 'NOT_REPORTED' AFTER estimated_cost_usd,
                ADD COLUMN model_usage_updated_at DATETIME NULL AFTER cost_estimation_status;
              ALTER TABLE gera_landing_stage_execution
                ADD COLUMN cached_input_tokens INT NULL AFTER input_tokens;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE agent_task
                DROP COLUMN model_usage_updated_at,
                DROP COLUMN cost_estimation_status,
                DROP COLUMN estimated_cost_usd,
                DROP COLUMN output_tokens,
                DROP COLUMN cached_input_tokens,
                DROP COLUMN input_tokens;
              ALTER TABLE gera_landing_stage_execution
                DROP COLUMN cached_input_tokens;
