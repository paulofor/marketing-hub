  - changeSet:
      id: 2026-08-20-business-process-value-chains-3
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_chain_definition
                (chain_code, name, purpose, outcome_description, primary_metric, version_number, status, created_at, published_at)
              SELECT
                'pde-value-creation-delivery',
                'Criação e entrega de valor de Produtos Digitais Experienciais',
                'Transformar uma oportunidade real em produto incrível, comunicação eficaz, venda, entrega satisfatória e aprendizado para escala.',
                'Produto Digital Experiencial vendido, entregue com satisfação e convertido em decisão comercial baseada em evidências.',
                'Tempo até venda entregue com satisfação',
                1,
                'PUBLISHED',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_chain_definition
                WHERE chain_code = 'pde-value-creation-delivery' AND version_number = 1
              );

  - changeSet:
      id: 2026-08-20-business-process-value-chains-4
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT chain_definition.id, process_definition.id, 1,
                'Seleciona uma dor real e uma oportunidade com intenção de compra antes de consumir esforço de produção.',
                UTC_TIMESTAMP()
              FROM business_process_chain_definition chain_definition
              JOIN business_process_definition process_definition
                ON process_definition.process_code = 'pde-opportunity-discovery'
               AND process_definition.version_number = 1
              WHERE chain_definition.chain_code = 'pde-value-creation-delivery'
                AND chain_definition.version_number = 1
                AND NOT EXISTS (
                  SELECT 1 FROM business_process_chain_item item
                  WHERE item.chain_definition_id = chain_definition.id AND item.sequence_number = 1
                );

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
