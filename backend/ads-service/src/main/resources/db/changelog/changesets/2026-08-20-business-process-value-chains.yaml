                'Plano Comercial e contrato funcional do PDE aprovados.',
                'Versão canônica do PDE acessível, utilizável, íntegra, aprovada e pronta para venda, com conteúdo, progresso e entregáveis versionados.',
                1,
                'PUBLISHED',
                'PDE Platform / product-manufacturing-approval',
                '{"nodes":[{"id":"start","type":"START","label":"Contrato funcional aprovado","owner":"Backend","description":"A versão do plano define o produto a construir."},{"id":"journey","type":"TASK","label":"Construir jornada de valor","owner":"Operação de Produto","description":"Materializa diagnóstico, etapas, ações e progresso."},{"id":"deliverables","type":"TASK","label":"Produzir entregáveis premium","owner":"Têmis e executores de produto","description":"Cria conteúdos, imagens, vídeos e arquivos finais."},{"id":"access","type":"TASK","label":"Implementar acesso e continuidade","owner":"PDE Platform","description":"Garante entrada, retomada, erros e suporte mínimo."},{"id":"review","type":"TASK","label":"Revisar experiência completa","owner":"Psique e revisão independente","description":"Valida utilidade, facilidade, integridade e fidelidade."},{"id":"gate","type":"GATEWAY","label":"PDE aprovado?","owner":"Backend","description":"Bloqueia placeholder, ativo em rascunho ou dependência manual oculta."},{"id":"end","type":"END","label":"PDE canônico pronto para venda","owner":"Backend","description":"Versão comercial rastreável fica congelada."}],"flows":[{"from":"start","to":"journey"},{"from":"journey","to":"deliverables"},{"from":"deliverables","to":"access"},{"from":"access","to":"review"},{"from":"review","to":"gate"},{"from":"gate","to":"end"}]}',
