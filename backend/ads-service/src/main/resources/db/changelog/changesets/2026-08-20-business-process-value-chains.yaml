                'Comprovar que produto, venda, entrega e mensuração funcionam ponta a ponta antes de liberar tráfego e orçamento.',
                'Operação de Experimentos',
                'PDE e kit comercial aprovados.',
                'Preflight aprovado e experimento apto a RUNNING, ou bloqueio persistido com causa-raiz e ação corretiva explícitas.',
