                'Kit comercial aprovado com criativos, destino, oferta, checkout, acesso e eventos coerentes, sem ativação automática de mídia.',
                1,
                'PUBLISHED',
                'creative-production-approval / landing-page-generation',
                '{"nodes":[{"id":"start","type":"START","label":"PDE aprovado","owner":"Backend","description":"Produto real e plano vigente orientam a comunicação."},{"id":"message","type":"TASK","label":"Definir mensagem e campanha","owner":"Têmis","description":"Escolhe ângulos, prova e continuidade de promessa."},{"id":"creative","type":"TASK","label":"Criar e aprovar criativos","owner":"Têmis e Psique","description":"Usa produto real com revisão independente."},{"id":"destination","type":"TASK","label":"Construir destino de venda","owner":"Dédalo","description":"Materializa landing ou microexperiência pública."},{"id":"checkout","type":"TASK","label":"Conectar oferta, checkout e acesso","owner":"Backend","description":"Preserva continuidade até a entrega."},{"id":"tracking","type":"TASK","label":"Instrumentar a jornada","owner":"Backend","description":"Registra visita, valor, CTA, checkout, compra e primeiro uso."},{"id":"gate","type":"GATEWAY","label":"Jornada comercial aprovada?","owner":"Backend","description":"Exige correspondência entre promessa, produto e entrega."},{"id":"end","type":"END","label":"Comunicação pronta para homologação","owner":"Backend","description":"Ativos e contratos ficam prontos sem gerar gasto."}],"flows":[{"from":"start","to":"message"},{"from":"message","to":"creative"},{"from":"creative","to":"destination"},{"from":"destination","to":"checkout"},{"from":"checkout","to":"tracking"},{"from":"tracking","to":"gate"},{"from":"gate","to":"end"}]}',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
