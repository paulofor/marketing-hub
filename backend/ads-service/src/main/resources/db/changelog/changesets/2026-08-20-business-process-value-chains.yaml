                'Plano Comercial / EPM / Framework Dor-Resultado-Mecanismo-Prova-Oferta',
                '{"nodes":[{"id":"start","type":"START","label":"Oportunidade aprovada","owner":"Backend","description":"Dossiê válido inicia o desenho comercial."},{"id":"positioning","type":"TASK","label":"Definir público, dor e transformação","owner":"Dédalo","description":"Consolida a tese comercial central."},{"id":"experience","type":"TASK","label":"Desenhar experiência e oferta","owner":"Dédalo","description":"Define entrada, jornada, entrega, preço e CTA."},{"id":"economics","type":"TASK","label":"Limitar orçamento e métricas","owner":"Plutus","description":"Registra teto, prazo e critérios de continuar, ajustar e parar."},{"id":"review","type":"TASK","label":"Revisar valor e risco comercial","owner":"Psique e Têmis","description":"Valida desejo, clareza, fidelidade e compliance."},{"id":"gate","type":"GATEWAY","label":"Plano Comercial aprovado?","owner":"Backend","description":"Somente plano completo pode orientar produção."},{"id":"end","type":"END","label":"Plano Comercial vigente","owner":"Backend","description":"Versão aprovada governa produto e comunicação."}],"flows":[{"from":"start","to":"positioning"},{"from":"positioning","to":"experience"},{"from":"experience","to":"economics"},{"from":"economics","to":"review"},{"from":"review","to":"gate"},{"from":"gate","to":"end"}]}',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
