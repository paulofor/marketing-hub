                'Sinais reais de dor, busca, reclamação, alternativa ou intenção de compra.',
                'Oportunidade PDE aprovada, rejeitada ou devolvida para pesquisa com evidências, público, dor raiz, encaixe da experiência e risco principal.',
                1,
                'PUBLISHED',
                'descoberta-produtos-pde-canon.v1 / dossiê de oportunidade',
