                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-opportunity-discovery' AND version_number = 1
