                '{"nodes":[{"id":"start","type":"START","label":"Formato e contratos aprovados","owner":"Backend","description":"Plano define produto, prova e continuidade a construir."},{"id":"implementation","type":"TASK","label":"Materializar o formato aprovado","owner":"Operação de Produto","description":"Constrói kit, webapp, agente, automação, área ou solução híbrida sem troca silenciosa."},{"id":"journey","type":"TASK","label":"Construir jornada de valor","owner":"Executor do formato","description":"Materializa entrada, ações, estado e resultado observável."},{"id":"deliverables","type":"TASK","label":"Produzir componentes premium","owner":"Têmis e executores de produto","description":"Cria conteúdos, telas, imagens, vídeos, arquivos e automações aplicáveis."},{"id":"proof","type":"TASK","label":"Construir pacote de prova verificável","owner":"Têmis","description":"Materializa demonstração, amostra, descrição, perguntas, requisitos e limitações sem prova social fabricada."},{"id":"access","type":"TASK","label":"Implementar acesso e continuidade","owner":"Executor do formato","description":"Garante entrada, persistência, retomada, segregação, indicação consentida, erros e suporte mínimo."},{"id":"review","type":"TASK","label":"Revisar produto completo","owner":"Psique e revisão independente","description":"Valida utilidade, facilidade, prova, integridade, segurança e fidelidade à promessa."},{"id":"gate","type":"GATEWAY","label":"PDE aprovado?","owner":"Backend","description":"Bloqueia pergunta prioritária sem resposta, prova fabricada, placeholder ou dependência manual oculta."},{"id":"end","type":"END","label":"Produto canônico pronto para venda","owner":"Backend","description":"Versão comercial e pacote de prova ficam congelados."}],"flows":[{"from":"start","to":"implementation"},{"from":"implementation","to":"journey"},{"from":"journey","to":"deliverables"},{"from":"deliverables","to":"proof"},{"from":"proof","to":"access"},{"from":"access","to":"review"},{"from":"review","to":"gate"},{"from":"gate","to":"end"}]}',
