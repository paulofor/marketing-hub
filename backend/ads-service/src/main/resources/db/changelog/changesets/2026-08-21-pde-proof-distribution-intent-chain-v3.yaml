rom":"proof","to":"channel"},{"from":"channel","to":"creative"},{"from":"creative","to":"destination"},{"from":"destination","to":"intent"},{"from":"intent","to":"checkout"},{"from":"checkout","to":"tracking"},{"from":"tracking","to":"gate"},{"from":"gate","to":"end"}]}',
