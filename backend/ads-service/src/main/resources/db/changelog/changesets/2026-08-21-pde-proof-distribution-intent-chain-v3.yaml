                '{"nodes":[{"id":"start","type":"START","label":"Oportunidade aprovada","owner":"Backend","description":"Dossiê válido inicia o desenho comercial."},{"id":"positioning","type":"TASK","label":"Definir público, dor e transformação","owner":"Dédalo","description":"Consolida a tese comercial central."},{"id":"format","type":"TASK","label":"Escolher o melhor formato digital","owner":"Dédalo","description":"Compara três alternativas viáveis por valor, adoção, custo, risco e escala."},{"id":"proof","type":"TASK","label":"Desenhar prova antes da compra","owner":"Têmis","description":"Liga cada promessa e pergunta prioritária a demonstração, fonte e limitação verificáveis."},{"id":"distribution","type":"TASK","label":"Escolher distribuição acumulável","owner":"Hermes","description":"Compara mídia, rede recorrente por performance e ativo próprio ou parceria com atribuição e economia unitária."},{"id":"intent","type":"TASK","label":"Governar resposta à intenção","owner":"Hermes e Têmis","description":"Define sinais permitidos, CTA ou prova adaptável, fallback neutro e teste sem preço individual oculto."},{"id":"experience","type":"TASK","label":"Desenhar produto e oferta","owner":"Dédalo","description":"Define entrada, jornada, entrega, preço e CTA no formato escolhido."},{"id":"economics","type":"TASK","label":"Limitar orçamento e métricas","owner":"Plutus","description":"Registra economia unitária, teto, prazo e critérios de continuar, ajustar e parar."},{"id":"review","type":"TASK","label":"Revisar valor e risco comercial","owner":"Psique e Têmis","description":"Valida desejo, utilidade, prova, fidelidade, viabilidade e compliance."},{"id":"gate","type":"GATEWAY","label":"Plano Comercial aprovado?","owner":"Backend","description":"Somente plano rastreável de produto, prova e distribuição pode orientar produção."},{"id":"end","type":"END","label":"Plano Comercial vigente","owner":"Backend","description":"Versão aprovada governa formato, produto, prova e comunicação."}],"flows":[{"from":"start","to":"positioning"},{"from":"positioning","to":"format"},{"from":"format","to":"proof"},{"from":"proof","to":"distribution"},{"from":"distribution","to":"intent"},{"from":"intent","to":"experience"},{"from":"experience","to":"economics"},{"from":"economics","to":"review"},{"from":"review","to":"gate"},{"from":"gate","to":"end"}]}',
