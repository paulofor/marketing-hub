databaseChangeLog:
  - changeSet:
      id: 2026-08-22-business-process-responsibility-boundaries-1
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE business_process_definition
                ADD COLUMN process_type VARCHAR(20) NOT NULL DEFAULT 'VALUE_PROCESS' AFTER technical_reference,
                ADD COLUMN parent_process_code VARCHAR(100) NULL AFTER process_type,
                ADD INDEX idx_business_process_parent (parent_process_code, status);

  - changeSet:
      id: 2026-08-22-business-process-responsibility-boundaries-2
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT
                'pde-communication-sales-journey',
                'Comunicação e jornada de venda do PDE',
                'Orquestrar mensagem, criativos, destino, checkout e mensuração sem refazer o trabalho dos subprocessos especializados.',
                'Operação de Experimentos',
                'PDE aprovado com Cartão de Decisão, pacote de prova e Plano Comercial vigente.',
                'Jornada integrada e coerente, com criativos e destino aprovados pelos subprocessos canônicos, pronta para homologação.',
                4,
                'PUBLISHED',
                'creative-production-approval / landing-page-generation / pde-responsibility-boundaries-2026-08-22',
                'VALUE_PROCESS',
                NULL,
                '{"nodes":[{"id":"start","type":"START","label":"PDE e decisão aprovados","owner":"Backend","description":"Produto, prova e plano orientam a jornada."},{"id":"contract","type":"TASK","label":"Congelar contrato da jornada","owner":"Têmis e Hermes","description":"Define mensagem, canais, prova, controle, CTA, checkout, acesso e eventos sem produzir peças."},{"id":"creatives","type":"TASK","label":"Executar criação e aprovação de criativos","owner":"Backend","description":"Delega toda produção e aprovação das peças ao subprocesso canônico.","subprocessCode":"creative-production-approval"},{"id":"destination","type":"TASK","label":"Executar geração do destino de venda","owner":"Backend","description":"Delega a landing ao subprocesso canônico quando esse for o destino aprovado; outras microexperiências usam contrato próprio.","subprocessCode":"landing-page-generation"},{"id":"integration","type":"TASK","label":"Integrar canal, checkout, acesso e eventos","owner":"Backend","description":"Conecta somente versões aprovadas e preserva atribuição até compra e primeiro uso."},{"id":"gate","type":"GATEWAY","label":"Jornada integrada sem lacunas?","owner":"Backend","description":"Exige coerência, rastreabilidade e ausência de produção duplicada fora dos subprocessos."},{"id":"end","type":"END","label":"Comunicação pronta para homologação","owner":"Backend","description":"A jornada fica pronta sem ativar mídia."}],"flows":[{"from":"start","to":"contract"},{"from":"contract","to":"creatives"},{"from":"creatives","to":"destination"},{"from":"destination","to":"integration"},{"from":"integration","to":"gate"},{"from":"gate","to":"end"}]}',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-communication-sales-journey' AND version_number = 4
              );

              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT
                'experiment-homologation-activation',
                'Homologação técnica de experimento',
                'Comprovar superfícies, compra de teste, eventos e orçamento de qualquer experimento sem decidir ativação nem operar tráfego.',
                'Operação de Experimentos',
                'Experimento planejado com ativos candidatos, destino, checkout e limites disponíveis.',
                'Preflight técnico com evidências válidas ou bloqueio causal, pronto para decisão do processo de valor pai.',
                4,
                'PUBLISHED',
                'experiment-preflight / pde-responsibility-boundaries-2026-08-22',
                'SUBPROCESS',
                'pde-commercial-homologation-activation',
                '{"nodes":[{"id":"start","type":"START","label":"Experimento pronto para preflight","owner":"Backend do experimento","description":"Versões candidatas e limites estão congelados."},{"id":"surfaces","type":"TASK","label":"Validar criativo e destino publicados","owner":"Quality Review","description":"Comprova versão, mobile, desempenho, links, ativos e correspondência com a oferta."},{"id":"transaction","type":"TASK","label":"Testar compra, acesso e entrega","owner":"Operação de Experimentos","description":"Executa transação segregada e confirma checkout, mensagem, acesso e integridade sem venda falsa."},{"id":"measurement","type":"TASK","label":"Validar eventos, deduplicação e orçamento","owner":"Operador de Crescimento e Plutus","description":"Comprova funil, segregação, teto e regras de parada sem iniciar aquisição."},{"id":"gate","type":"GATEWAY","label":"Preflight técnico aprovado?","owner":"Backend do experimento","description":"Persiste evidências e bloqueia qualquer lacuna com causa e ação."},{"id":"end","type":"END","label":"Preflight entregue ao processo pai","owner":"Backend do experimento","description":"O subprocesso termina sem autorizar RUNNING e sem monitorar tráfego."}],"flows":[{"from":"start","to":"surfaces"},{"from":"surfaces","to":"transaction"},{"from":"transaction","to":"measurement"},{"from":"measurement","to":"gate"},{"from":"gate","to":"end"}]}',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'experiment-homologation-activation' AND version_number = 4
              );

              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT
                'pde-commercial-homologation-activation',
                'Homologação e ativação comercial do PDE',
                'Validar os riscos específicos do PDE, consumir um único preflight técnico e registrar a decisão humana de ativação.',
                'Operação de Experimentos',
                'PDE e jornada aprovados com fatos, controle e versões rastreáveis.',
                'PDE autorizado para RUNNING ou bloqueado com causa e ação, sem repetir testes técnicos já executados.',
                4,
                'PUBLISHED',
                'experiment-homologation-activation / pde-responsibility-boundaries-2026-08-22',
                'VALUE_PROCESS',
                NULL,
                '{"nodes":[{"id":"start","type":"START","label":"Produto e jornada aprovados","owner":"Backend","description":"As versões exatas iniciam a decisão comercial."},{"id":"pdeGate","type":"TASK","label":"Validar fatos, controle e valor do PDE","owner":"Psique e revisão independente","description":"Comprova Cartão de Decisão, prova, adequação, personalização explicável e caminho neutro."},{"id":"preflight","type":"TASK","label":"Executar preflight técnico do experimento","owner":"Backend","description":"Consome uma única homologação técnica e reutiliza suas evidências sem refazer testes.","subprocessCode":"experiment-homologation-activation"},{"id":"decision","type":"GATEWAY","label":"Valor e preflight estão aprovados?","owner":"Backend","description":"Exige gates específicos e técnicos verdes, persistindo a causa de qualquer bloqueio."},{"id":"authorization","type":"TASK","label":"Autorizar ativação e orçamento","owner":"Operador humano","description":"Autoriza explicitamente RUNNING dentro do teto; aprovação técnica isolada não libera gasto."},{"id":"end","type":"END","label":"Decisão de ativação registrada","owner":"Backend","description":"O processo termina ao autorizar ou bloquear, sem operar o experimento."}],"flows":[{"from":"start","to":"pdeGate"},{"from":"pdeGate","to":"preflight"},{"from":"preflight","to":"decision"},{"from":"decision","to":"authorization","label":"Aprovado"},{"from":"authorization","to":"end"},{"from":"decision","to":"end","label":"Bloqueado"}]}',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-commercial-homologation-activation' AND version_number = 4
              );

              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT
                'pde-sales-delivery-learning',
                'Venda, entrega e aprendizado do PDE',
                'Orquestrar otimização e entrega, consolidando somente seus resultados em uma decisão comercial por vendas satisfatórias.',
                'Operador de Crescimento',
                'Ativação autorizada com orçamento, canais, versão e critérios vigentes.',
                'Decisão de continuar, ajustar, escalar ou parar baseada em vendas, margem, entrega e satisfação consolidadas sem dupla execução.',
                4,
                'PUBLISHED',
                'operacao-otimizacao-experimento / venda-entrega-satisfacao-cliente / pde-responsibility-boundaries-2026-08-22',
                'VALUE_PROCESS',
                NULL,
                '{"nodes":[{"id":"start","type":"START","label":"Ativação autorizada","owner":"Backend","description":"Orçamento e regras iniciam o ciclo."},{"id":"optimization","type":"TASK","label":"Operar e otimizar o experimento","owner":"Backend","description":"Delega aquisição, mensuração e teste de variável ao subprocesso canônico.","subprocessCode":"operacao-otimizacao-experimento"},{"id":"delivery","type":"TASK","label":"Entregar cada venda e acompanhar satisfação","owner":"Backend","description":"Delega conciliação, entrega, suporte, satisfação e reembolso ao subprocesso canônico.","subprocessCode":"venda-entrega-satisfacao-cliente"},{"id":"consolidate","type":"TASK","label":"Consolidar resultado comercial","owner":"Backend","description":"Cruza vendas, receita, margem, entrega, satisfação e aprendizado sem reexecutar os subprocessos."},{"id":"decision","type":"GATEWAY","label":"Qual decisão comercial?","owner":"Backend e operador humano","description":"Decide CONTINUAR, AJUSTAR, ESCALAR ou PARAR; tarefas e impacto estimado não contam como venda."},{"id":"end","type":"END","label":"Ciclo decidido por vendas entregues","owner":"Backend","description":"A decisão e suas evidências ficam auditáveis."}],"flows":[{"from":"start","to":"optimization"},{"from":"start","to":"delivery"},{"from":"optimization","to":"consolidate"},{"from":"delivery","to":"consolidate"},{"from":"consolidate","to":"decision"},{"from":"decision","to":"end"}]}',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-sales-delivery-learning' AND version_number = 4
              );

  - changeSet:
      id: 2026-08-22-business-process-responsibility-boundaries-3
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE business_process_definition
              SET status = 'RETIRED'
              WHERE process_code = 'pde-communication-sales-journey'
                AND status = 'PUBLISHED'
                AND version_number <> 4;

              UPDATE business_process_definition
              SET status = 'RETIRED'
              WHERE process_code = 'experiment-homologation-activation'
                AND status = 'PUBLISHED'
                AND version_number <> 4;

              UPDATE business_process_definition
              SET status = 'RETIRED'
              WHERE process_code = 'pde-commercial-homologation-activation'
                AND status = 'PUBLISHED'
                AND version_number <> 4;

              UPDATE business_process_definition
              SET status = 'RETIRED'
              WHERE process_code = 'pde-sales-delivery-learning'
                AND status = 'PUBLISHED'
                AND version_number <> 4;

              UPDATE business_process_definition
              SET status = 'RETIRED'
              WHERE process_code = 'product-manufacturing-approval'
                AND status = 'PUBLISHED';

              UPDATE business_process_definition
              SET process_type = 'SUBPROCESS',
                  parent_process_code = 'pde-communication-sales-journey'
              WHERE process_code IN ('creative-production-approval', 'landing-page-generation')
                AND status = 'PUBLISHED';

              UPDATE business_process_definition
              SET process_type = 'SUBPROCESS',
                  parent_process_code = 'pde-sales-delivery-learning'
              WHERE process_code IN ('operacao-otimizacao-experimento', 'venda-entrega-satisfacao-cliente')
                AND status = 'PUBLISHED';

  - changeSet:
      id: 2026-08-22-business-process-responsibility-boundaries-4
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_chain_definition
                (chain_code, name, purpose, outcome_description, primary_metric,
                 version_number, status, created_at, published_at)
              SELECT
                'pde-value-creation-delivery',
                'Criação e entrega de valor de Produtos Digitais Experienciais',
                'Transformar oportunidade em produto vendido e entregue por processos de valor únicos, delegando trabalho especializado sem sobreposição.',
                'PDE vendido e entregue com satisfação, com responsabilidades exclusivas e aprendizado auditável para escala.',
                'Tempo até venda entregue com satisfação',
                5,
                'PUBLISHED',
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_chain_definition
                WHERE chain_code = 'pde-value-creation-delivery' AND version_number = 5
              );

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT c.id, p.id, 1, 'Escolhe uma oportunidade comprovada sem duplicar pesquisa em etapas posteriores.', UTC_TIMESTAMP()
              FROM business_process_chain_definition c
              JOIN business_process_definition p ON p.process_code = 'pde-opportunity-discovery' AND p.status = 'PUBLISHED'
              LEFT JOIN business_process_chain_item i ON i.chain_definition_id = c.id AND i.sequence_number = 1
              WHERE c.chain_code = 'pde-value-creation-delivery' AND c.version_number = 5 AND i.id IS NULL;

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT c.id, p.id, 2, 'Define oferta, formato, prova, distribuição e limites antes da construção.', UTC_TIMESTAMP()
              FROM business_process_chain_definition c
              JOIN business_process_definition p ON p.process_code = 'pde-commercial-plan-offer' AND p.status = 'PUBLISHED'
              LEFT JOIN business_process_chain_item i ON i.chain_definition_id = c.id AND i.sequence_number = 2
              WHERE c.chain_code = 'pde-value-creation-delivery' AND c.version_number = 5 AND i.id IS NULL;

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT c.id, p.id, 3, 'Constrói e aprova o produto completo como única autoridade de materialização.', UTC_TIMESTAMP()
              FROM business_process_chain_definition c
              JOIN business_process_definition p ON p.process_code = 'pde-construction-approval' AND p.status = 'PUBLISHED'
              LEFT JOIN business_process_chain_item i ON i.chain_definition_id = c.id AND i.sequence_number = 3
              WHERE c.chain_code = 'pde-value-creation-delivery' AND c.version_number = 5 AND i.id IS NULL;

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT c.id, p.id, 4, 'Orquestra criativos, destino, checkout e eventos por subprocessos especializados.', UTC_TIMESTAMP()
              FROM business_process_chain_definition c
              JOIN business_process_definition p ON p.process_code = 'pde-communication-sales-journey' AND p.status = 'PUBLISHED'
              LEFT JOIN business_process_chain_item i ON i.chain_definition_id = c.id AND i.sequence_number = 4
              WHERE c.chain_code = 'pde-value-creation-delivery' AND c.version_number = 5 AND i.id IS NULL;

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT c.id, p.id, 5, 'Decide ativação uma vez, reutilizando o preflight técnico sem repetir homologação.', UTC_TIMESTAMP()
              FROM business_process_chain_definition c
              JOIN business_process_definition p ON p.process_code = 'pde-commercial-homologation-activation' AND p.status = 'PUBLISHED'
              LEFT JOIN business_process_chain_item i ON i.chain_definition_id = c.id AND i.sequence_number = 5
              WHERE c.chain_code = 'pde-value-creation-delivery' AND c.version_number = 5 AND i.id IS NULL;

              INSERT INTO business_process_chain_item
                (chain_definition_id, process_definition_id, sequence_number, value_contribution, created_at)
              SELECT c.id, p.id, 6, 'Consolida otimização e entrega em uma decisão única por vendas satisfatórias.', UTC_TIMESTAMP()
              FROM business_process_chain_definition c
              JOIN business_process_definition p ON p.process_code = 'pde-sales-delivery-learning' AND p.status = 'PUBLISHED'
              LEFT JOIN business_process_chain_item i ON i.chain_definition_id = c.id AND i.sequence_number = 6
              WHERE c.chain_code = 'pde-value-creation-delivery' AND c.version_number = 5 AND i.id IS NULL;

              UPDATE business_process_chain_definition
              SET status = 'RETIRED'
              WHERE chain_code = 'pde-value-creation-delivery'
                AND status = 'PUBLISHED'
                AND version_number <> 5;
