databaseChangeLog:
  - changeSet:
      id: 2026-08-25-product-process-time-cost
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_process_period (
                id BIGINT NOT NULL AUTO_INCREMENT,
                product_id BIGINT NOT NULL,
                process_definition_id BIGINT NOT NULL,
                process_code_snapshot VARCHAR(100) NOT NULL,
                process_name_snapshot VARCHAR(160) NOT NULL,
                sequence_number INT NOT NULL,
                entered_at DATETIME NOT NULL,
                exited_at DATETIME NULL,
                entry_evidence VARCHAR(40) NOT NULL,
                exit_evidence VARCHAR(40) NULL,
                objective_achieved TINYINT(1) NOT NULL DEFAULT 0,
                open_slot TINYINT NULL DEFAULT 1,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                INDEX idx_product_process_period_timeline (product_id, entered_at, id),
                INDEX idx_product_process_period_open (product_id, exited_at),
                CONSTRAINT uk_product_process_period_open UNIQUE (product_id, open_slot),
                CONSTRAINT fk_product_process_period_product
                  FOREIGN KEY (product_id) REFERENCES product(id),
                CONSTRAINT fk_product_process_period_definition
                  FOREIGN KEY (process_definition_id) REFERENCES business_process_definition(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              INSERT INTO product_process_period
                (product_id, process_definition_id, process_code_snapshot,
                 process_name_snapshot, sequence_number, entered_at, entry_evidence,
                 objective_achieved, open_slot, created_at, updated_at)
              SELECT p.id,
                     process_definition.id,
                     process_definition.process_code,
                     process_definition.name,
                     chain_item.sequence_number,
                     COALESCE(p.updated_at, p.created_at, UTC_TIMESTAMP()),
                     'BACKFILLED_PRODUCT_UPDATE',
                     0,
                     1,
                     UTC_TIMESTAMP(),
                     UTC_TIMESTAMP()
                FROM product p
                JOIN business_process_chain_definition chain_definition
                  ON chain_definition.chain_code = 'pde-value-creation-delivery'
                 AND chain_definition.status = 'PUBLISHED'
                LEFT JOIN business_process_chain_definition newer_chain
                  ON newer_chain.chain_code = chain_definition.chain_code
                 AND newer_chain.status = 'PUBLISHED'
                 AND newer_chain.version_number > chain_definition.version_number
                JOIN business_process_chain_item chain_item
                  ON chain_item.chain_definition_id = chain_definition.id
                JOIN business_process_definition process_definition
                  ON process_definition.id = chain_item.process_definition_id
               WHERE newer_chain.id IS NULL
                 AND process_definition.process_code = CASE
                   WHEN UPPER(REPLACE(COALESCE(p.commercial_status, ''), '-', '_'))
                     IN ('OPORTUNIDADE_EM_DESCOBERTA', 'DESCOBERTA_E_PRIORIZACAO')
                     THEN 'pde-opportunity-discovery'
                   WHEN UPPER(REPLACE(COALESCE(p.commercial_status, ''), '-', '_'))
                     IN ('IDEIA_PRIORIZADA_PARA_TESTE', 'PLANO_COMERCIAL', 'PLANO_COMERCIAL_E_OFERTA')
                     THEN 'pde-commercial-plan-offer'
                   WHEN UPPER(REPLACE(COALESCE(p.commercial_status, ''), '-', '_'))
                     = 'CONSTRUCAO_E_APROVACAO'
                     THEN 'pde-construction-approval'
                   WHEN UPPER(REPLACE(COALESCE(p.commercial_status, ''), '-', '_'))
                     IN ('COMUNICACAO_E_JORNADA', 'COMUNICACAO_E_JORNADA_DE_VENDA')
                     THEN 'pde-communication-sales-journey'
                   WHEN UPPER(REPLACE(COALESCE(p.commercial_status, ''), '-', '_'))
                     IN ('VALIDACAO_COMERCIAL', 'HOMOLOGACAO_E_ATIVACAO',
                         'HOMOLOGACAO_COMERCIAL_E_ATIVACAO')
                     THEN 'pde-commercial-homologation-activation'
                   WHEN UPPER(REPLACE(COALESCE(p.commercial_status, ''), '-', '_'))
                     IN ('ATIVO', 'ACTIVE', 'RUNNING', 'ESCALA', 'ESCALANDO',
                         'VENDA_ENTREGA_E_APRENDIZADO')
                     THEN 'pde-sales-delivery-learning'
                   ELSE p.commercial_status
                 END;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE product_process_period;
