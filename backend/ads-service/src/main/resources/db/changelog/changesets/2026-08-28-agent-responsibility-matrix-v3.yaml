databaseChangeLog:
  - changeSet:
      id: 2026-08-28-agent-responsibility-matrix-v3-1-agent-contracts
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE agent
              SET current_version = current_version + 1,
                  name = CASE agent_key
                    WHEN 'market-radar' THEN 'Agente de Inteligência Factual de Mercado'
                    WHEN 'experiment-strategist' THEN 'Estrategista-Chefe de Mercado'
                    WHEN 'financial-agent' THEN 'Agente de Validação Financeira'
                    WHEN 'landing-generator' THEN 'Agente de Construção PDE'
                    WHEN 'videomaker' THEN 'Agente de Produção Audiovisual'
                    WHEN 'customer-agent' THEN 'Agente de Experiência Humana'
                    WHEN 'meta-ad-approver' THEN 'Agente de Integridade Comercial'
                    WHEN 'growth-operator' THEN 'Operador de Crescimento'
                    ELSE name
                  END,
                  description = CASE agent_key
                    WHEN 'market-radar' THEN 'Reúne fatos de demanda, concorrentes, linguagem pública, ofertas e fontes sem escolher estratégia.'
                    WHEN 'experiment-strategist' THEN 'Define mercado, desejo, diferenciação, posicionamento, portfólio, tese de oferta e hipótese prioritária.'
                    WHEN 'financial-agent' THEN 'Valida preço como hipótese, margem, CAC, orçamento, custos, receita e risco financeiro.'
                    WHEN 'landing-generator' THEN 'Materializa arquitetura, jornada, entregáveis, acesso, landing e artefatos não audiovisuais do PDE.'
                    WHEN 'videomaker' THEN 'Materializa roteiro técnico, cenas, áudio, montagem, legendas e entrega audiovisual.'
                    WHEN 'customer-agent' THEN 'Avalia compreensão, reação afetiva e sensorial, prazer, desejo, esforço, confiança e objeções.'
                    WHEN 'meta-ad-approver' THEN 'Revisa verdade, prova, fidelidade, direitos, compliance e segurança sem criar o ativo avaliado.'
                    WHEN 'growth-operator' THEN 'Opera distribuição, instrumentação, atribuição, funil, gargalo e otimização sem reescrever estratégia.'
                    ELSE description
                  END,
                  business_objective = CASE agent_key
                    WHEN 'market-radar' THEN 'Entregar a Atena um dossiê factual rastreável e atual para reduzir decisões comerciais sem evidência.'
                    WHEN 'experiment-strategist' THEN 'Escolher o que vender, para quem, por que será desejado e como posicionar para gerar vendas com valor.'
                    WHEN 'financial-agent' THEN 'Proteger margem e caixa com limites econômicos auditáveis antes de gasto e escala.'
                    WHEN 'landing-generator' THEN 'Transformar estratégia e economia aprovadas em PDE e superfícies úteis, fáceis e vendáveis.'
                    WHEN 'videomaker' THEN 'Entregar audiovisual tecnicamente íntegro e aderente ao briefing aprovado.'
                    WHEN 'customer-agent' THEN 'Comprovar se uma pessoa entende, deseja e percebe valor no material real.'
                    WHEN 'meta-ad-approver' THEN 'Impedir promessa falsa, prova insuficiente, direito violado ou comunicação comercial insegura.'
                    WHEN 'growth-operator' THEN 'Levar ativos aprovados ao mercado, medir eventos reais e resolver o primeiro gargalo do funil.'
                    ELSE business_objective
                  END,
                  success_metrics = CASE agent_key
                    WHEN 'market-radar' THEN 'Cobertura, atualidade, independência e rastreabilidade das fontes aceitas por Atena.'
                    WHEN 'experiment-strategist' THEN 'Estratégias operáveis que originam vendas entregues, sem contar recomendação como resultado.'
                    WHEN 'financial-agent' THEN 'Margem protegida, limites respeitados, CAC e receita reconciliados e zero gasto não autorizado.'
                    WHEN 'landing-generator' THEN 'Artefatos aprovados na primeira tentativa, menor retrabalho e jornada funcional até valor percebido.'
                    WHEN 'videomaker' THEN 'Pacotes audiovisuais aprovados, íntegros, dentro do teto e sem retrabalho recorrente.'
                    WHEN 'customer-agent' THEN 'Gates humanos baseados em evidência, com defeitos de compreensão, desejo e esforço localizados.'
                    WHEN 'meta-ad-approver' THEN 'Zero autoaprovação, prova rastreável e bloqueios comerciais com causa e critério de aceite.'
                    WHEN 'growth-operator' THEN 'Instrumentação íntegra, gargalo resolvido e decisões baseadas em venda, entrega e satisfação reais.'
                    ELSE success_metrics
                  END,
                  responsibility_contract = CASE agent_key
                    WHEN 'market-radar' THEN 'Domínio MARKET_EVIDENCE. Entrega fatos e lacunas; não decide público prioritário, posicionamento, oferta, formato ou canal.'
                    WHEN 'experiment-strategist' THEN 'Domínio MARKET_STRATEGY. Produz Contrato Estratégico de Mercado versionado; não coleta em paralelo sem causa nem opera distribuição.'
                    WHEN 'financial-agent' THEN 'Domínio FINANCIAL_VALIDATION. Valida economia e limites; não cria posicionamento, comunicação, produto, campanha ou movimentação financeira.'
                    WHEN 'landing-generator' THEN 'Domínio PDE_CONSTRUCTION. Materializa estratégia e economia aprovadas; não redefine mercado, preço nem aprova o próprio trabalho.'
                    WHEN 'videomaker' THEN 'Domínio AUDIOVISUAL_PRODUCTION. Produz audiovisual aprovado; não redefine estratégia, landing, integridade ou publicação.'
                    WHEN 'customer-agent' THEN 'Domínio HUMAN_EXPERIENCE_REVIEW. Avalia artefato real; não inventa fatos, decide compliance, altera preço ou materializa correção.'
                    WHEN 'meta-ad-approver' THEN 'Domínio COMMERCIAL_INTEGRITY_REVIEW. Revisa ativo real; não cria copy, conceito, imagem, vídeo, landing ou produto.'
                    WHEN 'growth-operator' THEN 'Domínio GROWTH_OPERATION. Opera estratégia imutável; contradição de mercado retorna para nova execução de Atena.'
                    ELSE responsibility_contract
                  END,
                  orchestrator_policy = CASE agent_key
                    WHEN 'market-radar' THEN 'Entrega o dossiê factual a Atena e encerra sem selecionar estratégia.'
                    WHEN 'experiment-strategist' THEN 'É a única autora da estratégia e publica versão e SHA-256 para os consumidores.'
                    WHEN 'financial-agent' THEN 'Bloqueia inviabilidade financeira sem alterar estratégia ou autorizar gasto.'
                    WHEN 'landing-generator' THEN 'Consome contratos aprovados e envia artefatos reais para Psique e Têmis em atividades separadas.'
                    WHEN 'videomaker' THEN 'Executa somente jobs autorizados e entrega o candidato para gates independentes.'
                    WHEN 'customer-agent' THEN 'Decide somente experiência humana e nunca substitui o artefato reprovado.'
                    WHEN 'meta-ad-approver' THEN 'Decide somente integridade comercial e devolve causa e critério, nunca uma peça substituta.'
                    WHEN 'growth-operator' THEN 'Só opera após gates e autorização aplicáveis; mudança estratégica abre nova análise de Atena.'
                    ELSE orchestrator_policy
                  END,
                  analysis_policy = CASE agent_key
                    WHEN 'market-radar' THEN 'Separar fato, inferência, hipótese, lacuna e qualidade da fonte.'
                    WHEN 'experiment-strategist' THEN 'Comparar três estratégias, tentar refutar a escolhida e preservar as evidências de Argos.'
                    WHEN 'financial-agent' THEN 'Separar valores reconciliados de cenários e estimativas; comparar três envelopes.'
                    WHEN 'landing-generator' THEN 'Comparar três formas de materializar sem trocar silenciosamente os contratos predecessores.'
                    WHEN 'videomaker' THEN 'Escolher solução técnica por cena dentro do briefing, teto e critérios de QA.'
                    WHEN 'customer-agent' THEN 'Registrar primeiro impulso, evidência sensorial disponível, compreensão, esforço, confiança e objeções.'
                    WHEN 'meta-ad-approver' THEN 'Comparar promessa, prova, ativo e direitos; bloquear criação disfarçada de revisão.'
                    WHEN 'growth-operator' THEN 'Confirmar o primeiro gargalo no histórico e comparar três ações operacionais sem trocar estratégia.'
                    ELSE analysis_policy
                  END,
                  offering_policy = CASE agent_key
                    WHEN 'market-radar' THEN 'Dossiê factual com fontes e lacunas, sem recomendação estratégica final.'
                    WHEN 'experiment-strategist' THEN 'Contrato Estratégico de Mercado imutável com hipótese, métrica e critérios.'
                    WHEN 'financial-agent' THEN 'Parecer econômico com cenários, teto, margem, CAC máximo e risco.'
                    WHEN 'landing-generator' THEN 'Produto, landing e artefatos não audiovisuais versionados e separados da auditoria.'
                    WHEN 'videomaker' THEN 'Pacote audiovisual versionado com jobs, custos, mídia e QA.'
                    WHEN 'customer-agent' THEN 'Parecer humano estruturado com evidência e mudanças requeridas, sem ativo substituto.'
                    WHEN 'meta-ad-approver' THEN 'Gate de integridade com causa, impacto e critério de aceite, sem conteúdo substituto.'
                    WHEN 'growth-operator' THEN 'Contrato operacional e diagnóstico com eventos reais e decisão continuar, ajustar ou parar.'
                    ELSE offering_policy
                  END,
                  prompt_contract_path = CASE agent_key
                    WHEN 'market-radar' THEN 'product-discovery-worker/prompts/productdiscovery.v1/research/system.md'
                    WHEN 'experiment-strategist' THEN 'experiment-strategist-worker/src/main/resources/prompts/experiment-strategist/v2/research.md'
                    WHEN 'financial-agent' THEN 'financial-agent-worker/src/main/resources/prompts/financial-agent/v1/report.md'
                    WHEN 'landing-generator' THEN 'landing-generator-agent-worker/src/main/resources/prompts/pde-construction/v1/journey.md'
                    WHEN 'videomaker' THEN 'video-management-service/src/main/resources/prompts/apollo/v2/production-mission.md'
                    WHEN 'customer-agent' THEN 'customer-agent-worker/src/main/resources/prompts/psique/behavioral-core-v3.md'
                    WHEN 'meta-ad-approver' THEN 'meta-ad-approver-worker/src/main/resources/prompts/meta-ad-approver/v2/review.md'
                    WHEN 'growth-operator' THEN 'growth-operator-worker/src/main/resources/prompts/growth-operator/v2/diagnosis.md'
                    ELSE prompt_contract_path
                  END,
                  schema_contract_path = CASE agent_key
                    WHEN 'market-radar' THEN 'product-discovery-worker/prompts/productdiscovery.v1/research/response-schema.json'
                    WHEN 'experiment-strategist' THEN 'experiment-strategist-worker/src/main/resources/prompts/experiment-strategist/v2/research-schema.json'
                    WHEN 'financial-agent' THEN 'financial-agent-worker/src/main/resources/prompts/financial-agent/v1/report-schema.json'
                    WHEN 'landing-generator' THEN 'landing-generator-agent-worker/src/main/resources/prompts/pde-construction/v1/journey-schema.json'
                    WHEN 'videomaker' THEN 'video-management-service/src/main/resources/prompts/apollo/v2/production-mission-schema.json'
                    WHEN 'customer-agent' THEN 'customer-agent-worker/src/main/resources/prompts/customer-agent/behavioral-v3/evaluation-schema.json'
                    WHEN 'meta-ad-approver' THEN 'meta-ad-approver-worker/src/main/resources/prompts/meta-ad-approver/v2/review-schema.json'
                    WHEN 'growth-operator' THEN 'growth-operator-worker/src/main/resources/prompts/growth-operator/v2/diagnosis-schema.json'
                    ELSE schema_contract_path
                  END
              WHERE agent_key IN (
                'market-radar', 'experiment-strategist', 'financial-agent', 'landing-generator',
                'videomaker', 'customer-agent', 'meta-ad-approver', 'growth-operator'
              );

              INSERT INTO agent_version (agent_id, version_number, contract_snapshot, created_at)
              SELECT a.id, a.current_version,
                JSON_OBJECT(
                  'agentKey', a.agent_key,
                  'version', a.current_version,
                  'status', a.status,
                  'model', COALESCE(a.model_name, ''),
                  'responsibilityDomain', CASE a.agent_key
                    WHEN 'market-radar' THEN 'MARKET_EVIDENCE'
                    WHEN 'experiment-strategist' THEN 'MARKET_STRATEGY'
                    WHEN 'financial-agent' THEN 'FINANCIAL_VALIDATION'
                    WHEN 'landing-generator' THEN 'PDE_CONSTRUCTION'
                    WHEN 'videomaker' THEN 'AUDIOVISUAL_PRODUCTION'
                    WHEN 'customer-agent' THEN 'HUMAN_EXPERIENCE_REVIEW'
                    WHEN 'meta-ad-approver' THEN 'COMMERCIAL_INTEGRITY_REVIEW'
                    WHEN 'growth-operator' THEN 'GROWTH_OPERATION'
                  END,
                  'prompt', a.prompt_contract_path,
                  'schema', a.schema_contract_path,
                  'matrixVersion', 'AGENT_RESPONSIBILITY_MATRIX_V1'
                ),
                UTC_TIMESTAMP()
              FROM agent a
              LEFT JOIN agent_version av
                ON av.agent_id = a.id AND av.version_number = a.current_version
              WHERE a.agent_key IN (
                  'market-radar', 'experiment-strategist', 'financial-agent', 'landing-generator',
                  'videomaker', 'customer-agent', 'meta-ad-approver', 'growth-operator'
                )
                AND av.id IS NULL;

  - changeSet:
      id: 2026-08-28-agent-responsibility-matrix-v3-2-execution-resources
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE business_process_execution_resource
              SET name = 'Materializador visual técnico de Dédalo',
                  description = 'Cria, edita e compõe imagens sob o contrato de construção PDE, preservando entregáveis reais e sua linhagem.',
                  responsible_agent_key = 'landing-generator',
                  usage_instructions = 'Execute a produção visual no container técnico themis-image-studio pelo contrato pending do backend. O código do executor é legado; a autoria funcional pertence a Dédalo e o resultado exige revisões independentes de Psique e Têmis.',
                  active = 1,
                  updated_at = UTC_TIMESTAMP()
              WHERE resource_code = 'themis-image-studio';

              INSERT INTO business_process_execution_resource
                (resource_code, name, description, resource_type, responsible_agent_key,
                 executor_reference, usage_instructions, active, created_at, updated_at)
              SELECT 'pde-visual-materialization',
                'Materializador visual de Dédalo',
                'Cria, edita e compõe imagens e peças estáticas sob o contrato de construção PDE.',
                'CONTAINER',
                'landing-generator',
                'themis-image-studio',
                'Consuma a fila pending canônica de materialização visual. O executor_reference preserva o nome técnico legado; autoria, contexto e tarefa pertencem a Dédalo e o resultado exige gates independentes.',
                1,
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_execution_resource
                WHERE resource_code = 'pde-visual-materialization'
              );

              INSERT INTO business_process_execution_resource
                (resource_code, name, description, resource_type, responsible_agent_key,
                 executor_reference, usage_instructions, active, created_at, updated_at)
              SELECT 'video-management-service',
                'Materializador audiovisual de Apolo',
                'Produz roteiro técnico, cenas, áudio, montagem, legendas e mídia sob briefing aprovado.',
                'CONTAINER',
                'videomaker',
                'video-management-service',
                'Consuma somente a fila pending canônica de Apolo, preserve jobs, custos e artefatos e devolva o candidato ao backend sem publicar nem aprovar.',
                1,
                UTC_TIMESTAMP(),
                UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_execution_resource
                WHERE resource_code = 'video-management-service'
              );

  - changeSet:
      id: 2026-08-28-agent-responsibility-matrix-v3-2-processes
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT 'pde-opportunity-discovery', 'Descoberta factual da oportunidade PDE',
                'Reunir evidências factuais de mercado antes de qualquer decisão estratégica.',
                'Argos', 'Novo ciclo de pesquisa ou sinal real de mercado.',
                'Dossiê factual rastreável pronto para a decisão estratégica de Atena.',
                6, 'PUBLISHED', 'agent-responsibility-matrix-v3 / MARKET_EVIDENCE',
                'VALUE_PROCESS', NULL,
                '{"nodes":[{"id":"start","type":"START","label":"Pergunta de mercado recebida","owner":"Backend","description":"O recorte e a origem da pesquisa ficam congelados."},{"id":"marketEvidence","type":"TASK","label":"Reunir evidências factuais de mercado","owner":"Argos","description":"Documenta demanda, concorrentes, linguagem pública, ofertas, preços visíveis, fontes, lacunas e qualidade sem escolher posicionamento, formato ou canal.","responsibleAgentKeys":["market-radar"],"responsibilityDomain":"MARKET_EVIDENCE"},{"id":"gate","type":"GATEWAY","label":"Dossiê factual suficiente?","owner":"Backend","description":"Bloqueia fonte vazia, vencida, artificial ou sem rastreabilidade."},{"id":"end","type":"END","label":"Dossiê entregue a Atena","owner":"Backend","description":"A pesquisa termina sem selecionar estratégia nem fabricar venda."}],"flows":[{"from":"start","to":"marketEvidence"},{"from":"marketEvidence","to":"gate"},{"from":"gate","to":"end"}]}',
                UTC_TIMESTAMP(), UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-opportunity-discovery' AND version_number = 6
              );

              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT 'pde-commercial-plan-offer', 'Estratégia, economia e arquitetura comercial do PDE',
                'Transformar o dossiê factual em estratégia, limite econômico e arquitetura de produto com um único dono por decisão.',
                'Backend de Planejamento Comercial',
                'Dossiê factual de Argos aprovado.',
                'Plano comercial versionado sem coautoria, pronto para construção.',
                5, 'PUBLISHED', 'agent-responsibility-matrix-v3 / MARKET_STRATEGY / FINANCIAL_VALIDATION / PDE_CONSTRUCTION',
                'VALUE_PROCESS', NULL,
                '{"nodes":[{"id":"start","type":"START","label":"Dossiê factual aprovado","owner":"Backend","description":"A versão factual de Argos inicia o plano."},{"id":"marketStrategy","type":"TASK","label":"Definir estratégia geral de mercado","owner":"Atena","description":"Define público prioritário, desejo, diferenciação, posicionamento, tese de oferta, portfólio e hipótese; não escolhe preço nem operação.","responsibleAgentKeys":["experiment-strategist"],"responsibilityDomain":"MARKET_STRATEGY"},{"id":"economics","type":"TASK","label":"Validar economia e limites","owner":"Plutus","description":"Valida preço como hipótese, margem, CAC, orçamento, custos, receita e risco sem reescrever a estratégia.","responsibleAgentKeys":["financial-agent"],"responsibilityDomain":"FINANCIAL_VALIDATION"},{"id":"productArchitecture","type":"TASK","label":"Definir arquitetura de materialização","owner":"Dédalo","description":"Converte estratégia e economia aprovadas em arquitetura do PDE, jornada, entregáveis, acesso e superfícies sem redefinir mercado ou preço.","responsibleAgentKeys":["landing-generator"],"responsibilityDomain":"PDE_CONSTRUCTION"},{"id":"gate","type":"GATEWAY","label":"Contratos completos e coerentes?","owner":"Backend","description":"Exige versões, hashes, entradas, saídas e critérios de bloqueio dos três domínios."},{"id":"end","type":"END","label":"Plano comercial vigente","owner":"Backend","description":"O plano orienta materialização sem autorizar publicação ou gasto."}],"flows":[{"from":"start","to":"marketStrategy"},{"from":"marketStrategy","to":"economics"},{"from":"economics","to":"productArchitecture"},{"from":"productArchitecture","to":"gate"},{"from":"gate","to":"end"}]}',
                UTC_TIMESTAMP(), UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-commercial-plan-offer' AND version_number = 5
              );

              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT 'pde-construction-approval', 'Construção e aprovação independente do PDE',
                'Materializar o PDE e submetê-lo a experiência humana e integridade comercial em gates separados.',
                'Backend de Construção PDE',
                'Estratégia, economia e arquitetura comercial aprovadas.',
                'Produto funcional aprovado em experiência e integridade, sem autoaprovação.',
                5, 'PUBLISHED', 'agent-responsibility-matrix-v3 / construction-independent-gates',
                'VALUE_PROCESS', NULL,
                '{"nodes":[{"id":"start","type":"START","label":"Contratos aprovados","owner":"Backend","description":"Estratégia, economia e arquitetura chegam congeladas."},{"id":"journey","type":"TASK","label":"Construir jornada de valor","owner":"Dédalo","description":"Materializa entrada, ações, estado e primeiro resultado útil sem mudar a estratégia.","responsibleAgentKeys":["landing-generator"],"responsibilityDomain":"PDE_CONSTRUCTION"},{"id":"deliverables","type":"TASK","label":"Produzir entregáveis do PDE","owner":"Dédalo","description":"Produz componentes não audiovisuais reais, versionados e separados da auditoria.","responsibleAgentKeys":["landing-generator"],"responsibilityDomain":"PDE_CONSTRUCTION"},{"id":"audiovisual","type":"TASK","label":"Executar produção audiovisual quando prevista","owner":"Apolo","description":"Produz roteiro, cenas, áudio, montagem e legendas em jobs versionados quando a arquitetura exigir vídeo ou áudio.","responsibleAgentKeys":["videomaker"],"responsibilityDomain":"AUDIOVISUAL_PRODUCTION","executionResourceCode":"video-management-service"},{"id":"access","type":"TASK","label":"Implementar acesso e continuidade","owner":"Dédalo","description":"Garante entrada, retomada, segregação, preferências, erros e suporte.","responsibleAgentKeys":["landing-generator"],"responsibilityDomain":"PDE_CONSTRUCTION"},{"id":"humanExperienceReview","type":"TASK","label":"Revisar experiência humana","owner":"Psique","description":"Avalia compreensão, reação afetiva e sensorial, prazer, desejo, esforço, confiança e objeções no produto real.","responsibleAgentKeys":["customer-agent"],"responsibilityDomain":"HUMAN_EXPERIENCE_REVIEW"},{"id":"commercialIntegrityReview","type":"TASK","label":"Revisar integridade comercial","owner":"Têmis","description":"Avalia verdade, prova, fidelidade, direitos, compliance e segurança sem produzir correção.","responsibleAgentKeys":["meta-ad-approver"],"responsibilityDomain":"COMMERCIAL_INTEGRITY_REVIEW"},{"id":"readiness","type":"GATEWAY","label":"Produto aprovado nos dois gates?","owner":"Backend","description":"Exige pareceres independentes e zero bloqueio crítico."},{"id":"end","type":"END","label":"PDE canônico pronto","owner":"Backend","description":"Versão aprovada fica pronta para comunicação, sem publicação."}],"flows":[{"from":"start","to":"journey"},{"from":"journey","to":"deliverables"},{"from":"deliverables","to":"audiovisual"},{"from":"audiovisual","to":"access"},{"from":"access","to":"humanExperienceReview"},{"from":"humanExperienceReview","to":"commercialIntegrityReview"},{"from":"commercialIntegrityReview","to":"readiness"},{"from":"readiness","to":"end"}]}',
                UTC_TIMESTAMP(), UTC_TIMESTAMP()
              FROM DUAL
              WHERE NOT EXISTS (
                SELECT 1 FROM business_process_definition
                WHERE process_code = 'pde-construction-approval' AND version_number = 5
              );

              INSERT INTO business_process_definition
                (process_code, name, purpose, owner_name, trigger_description, outcome_description,
                 version_number, status, technical_reference, process_type, parent_process_code,
                 diagram_json, created_at, published_at)
              SELECT 'pde-communication-sales-journey', 'Comunicação e jornada de venda do PDE',
                'Orquestrar materialização, revisão e integração sem atribuir autoria de comunicação a Têmis ou estratégia a Hermes.',
                'Backend de Experimentos', 'PDE aprovado e Plano Comercial vigente.',
                'Jornada integrada e rastreável pronta para homologação, sem ativar mídia.',
                6, 'PUBLISHED', 'agent-responsibility-matrix-v3 / materialize-review-integrate',
                'VALUE_PROCESS', NULL,
