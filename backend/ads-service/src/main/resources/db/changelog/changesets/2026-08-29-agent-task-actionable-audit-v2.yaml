databaseChangeLog:
  - changeSet:
      id: 2026-08-29-agent-task-actionable-audit-v2-1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE agent_task
                ADD COLUMN execution_mode VARCHAR(24) NULL AFTER execution_model_code,
                ADD COLUMN blocker_category VARCHAR(40) NULL AFTER execution_prompt,
                ADD COLUMN blocker_action LONGTEXT NULL AFTER blocker_category;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE agent_task
                DROP COLUMN blocker_action,
                DROP COLUMN blocker_category,
                DROP COLUMN execution_mode;

  - changeSet:
      id: 2026-08-29-agent-task-actionable-audit-v2-2
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE agent_task_audit_link (
                id BIGINT NOT NULL AUTO_INCREMENT,
                agent_task_id BIGINT NOT NULL,
                link_type VARCHAR(32) NOT NULL,
                label VARCHAR(200) NOT NULL,
                url VARCHAR(2048) NOT NULL,
                access_method VARCHAR(32) NULL,
                accessed_at DATETIME NULL,
                display_order INT NOT NULL,
                created_at DATETIME NOT NULL,
                PRIMARY KEY (id),
                INDEX idx_agent_task_audit_link_task (agent_task_id, link_type, display_order),
                CONSTRAINT fk_agent_task_audit_link_task
                  FOREIGN KEY (agent_task_id) REFERENCES agent_task(id) ON DELETE CASCADE
              );
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE agent_task_audit_link;
