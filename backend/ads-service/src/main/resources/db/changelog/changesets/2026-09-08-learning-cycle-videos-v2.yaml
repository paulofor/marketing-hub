databaseChangeLog:
  - changeSet:
      id: 2026-09-08-learning-cycle-videos-v2
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM business_process_definition WHERE process_code='value-chain-learning-sales-cycle' AND version_number=1
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_definition
               (process_code,name,purpose,owner_name,trigger_description,outcome_description,version_number,status,technical_reference,process_type,execution_scope,parent_process_code,diagram_json,created_at,published_at)
               SELECT process_code,name,'Governar aprendizado, vídeos AD e de entrada PDE, homologação e decisão por vendas e valor entregue.',owner_name,trigger_description,'Experimento com dois vídeos rastreáveis, gates independentes, resultados próprios e aprendizado para o sucessor.',2,'PUBLISHED',technical_reference,process_type,execution_scope,parent_process_code,'{"schemaVersion":"LEARNING_SALES_CYCLE_V2","nodes":[{"id":"start","type":"START","label":"Aprendizado anterior ou primeira hipótese"},{"id":"LEARNING","type":"TASK","label":"Aprendizado e hipótese","owner":"Hermes · síntese; operador · registro","description":"Concilie o experimento anterior. Registre o aprendizado, as limitações e uma hipótese verificável, incluindo explicação concorrente.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"PLANNING","type":"TASK","label":"Planejar o experimento","owner":"Atena e Plutus · pareceres separados; operador · registro","description":"Defina uma variável principal, oferta, canal, público, amostra, janela, teto total e regras de parada. Preserve as demais condições para tornar a comparação clara.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"ADJUSTMENT","type":"TASK","label":"Ajustar produto e comunicação","owner":"Dédalo · produto; Íris e Apolo · comunicação","description":"Execute a atividade indicada pela causa. Entregue uma ação útil para a cliente e uma comunicação fiel. Registre a versão e as provas do ajuste.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"VIDEO_BRIEF","type":"TASK","label":"Definir os dois vídeos","owner":"Íris · briefing; Plutus · limite de produção","description":"Defina objetivo, CTA e métrica próprios do vídeo AD e da entrada LANDING_HERO. Demonstre o produto real e registre a hipótese principal, as variáveis mantidas e a referência do teto de produção. Consumo exige autorização e preflight no Estúdio.","runtimePath":"/audio-video-studio"},{"id":"CAMPAIGN_VIDEO","type":"TASK","label":"Produzir vídeo do criativo de campanha","owner":"Apolo · produção no Estúdio","description":"No Estúdio, use o produto e o experimento deste ciclo para produzir um vídeo AD com gancho, prova fiel, áudio, legendas e CTA para a experiência. Passe por preflight e Plutus antes de consumir. Selecione aqui o ativo pronto; ausência ou falha exige correção.","runtimePath":"/audio-video-studio"},{"id":"PDE_ENTRY_VIDEO","type":"TASK","label":"Produzir vídeo de entrada do PDE","owner":"Apolo · demonstração da experiência real","description":"Produza um LANDING_HERO distinto do mesmo experimento: mostre o que a pessoa faz, o primeiro resultado útil e a continuidade paga. Use a versão ajustada e legendas. Assistir deve ser opcional, com CTA acessível e fallback.","runtimePath":"/audio-video-studio"},{"id":"VIDEO_APPROVAL","type":"TASK","label":"Revisar e integrar os dois vídeos","owner":"Psique e Têmis · revisão; operador · integração","description":"Aprove os ativos nos gates oficiais. No experimento, crie e aprove o criativo a partir do AD. Em Versões PDE, inclua o LANDING_HERO no rascunho da versão deste ciclo. Registre reprodução, legendas, fallback, CTA sem assistir e mobile com testes segregados. Concluir não publica nem autoriza campanha.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"VALIDATION","type":"TASK","label":"Homologar a mesma versão","owner":"Harness técnico, Psique e Têmis · gates independentes","description":"Execute homologação técnica e avaliações independentes da mesma versão. Informe a instância real do gate multiagente aprovado, a prova da jornada e, se realizada, a observação humana consentida. Reprovação volta ao ajuste.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"qualityDecision","type":"GATEWAY","label":"Versão homologada?","description":"Reprovação exige correção e nova evidência para a versão afetada."},{"id":"AUTHORIZATION","type":"TASK","label":"Autorizar orçamento e janela","owner":"Operador responsável pela autorização","description":"Confira os gates, confirme a versão, o teto total de mídia e a janela. A autorização registrada no ciclo não aciona campanha: execute o fluxo oficial do experimento.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"PUBLICATION","type":"TASK","label":"Conferir publicação","owner":"Operador · fluxo oficial do experimento","description":"Abra o experimento e solicite sua publicação pelo fluxo oficial. Depois confira aqui o run produtivo, o preflight, a data e o teto aprovados.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"MEASUREMENT","type":"TASK","label":"Medir vendas e valor entregue","owner":"Hermes e Plutus · conciliação; operador · registro","description":"Registre uma fotografia cumulativa e datada deste experimento: funil, vendas líquidas, receita, contribuição, entrega, uso e satisfação. Declare fonte e segregação de dados de teste. Separe AD e entrada por ativo. Reprodução é auxiliar; priorize primeiro resultado, compra, receita por visitante e contribuição.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"DECISION","type":"TASK","label":"Registrar decisão comercial","owner":"Operador responsável pela decisão","description":"Use as evidências para ajustar, continuar coleta, corrigir medição, solicitar escala ou encerrar. Dados insuficientes não provam rejeição. Cada decisão preserva causa e próxima ação.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"commercialDecision","type":"GATEWAY","label":"O que os resultados autorizam?","description":"Ajustar, continuar, corrigir dados, solicitar escala ou encerrar."},{"id":"SCALE_AUTHORIZATION","type":"TASK","label":"Autorizar expansão","owner":"Operador responsável pela autorização","description":"Reavalie contribuição, vendas e valor entregue. Defina uma nova autorização explícita e atualize os limites pelo fluxo oficial antes de continuar o acompanhamento.","runtimePath":"/business-process-chains/learning-cycles"},{"id":"end","type":"END","label":"Preservar resultados e aprendizado"}],"flows":[{"from":"start","to":"LEARNING"},{"from":"LEARNING","to":"PLANNING"},{"from":"PLANNING","to":"ADJUSTMENT"},{"from":"ADJUSTMENT","to":"VIDEO_BRIEF"},{"from":"VIDEO_BRIEF","to":"CAMPAIGN_VIDEO"},{"from":"CAMPAIGN_VIDEO","to":"PDE_ENTRY_VIDEO"},{"from":"PDE_ENTRY_VIDEO","to":"VIDEO_APPROVAL"},{"from":"VIDEO_APPROVAL","to":"VALIDATION"},{"from":"VALIDATION","to":"qualityDecision"},{"from":"AUTHORIZATION","to":"PUBLICATION"},{"from":"PUBLICATION","to":"MEASUREMENT"},{"from":"MEASUREMENT","to":"DECISION"},{"from":"DECISION","to":"commercialDecision"},{"from":"qualityDecision","to":"ADJUSTMENT","label":"Reprovado: corrigir a mesma iteração","kind":"REWORK"},{"from":"qualityDecision","to":"AUTHORIZATION","label":"Aprovado: mesma versão"},{"from":"commercialDecision","to":"LEARNING","label":"Ajustar: novo experimento com memória","kind":"REWORK"},{"from":"commercialDecision","to":"ADJUSTMENT","label":"Correção técnica: pausar e revalidar o mesmo experimento","kind":"REWORK"},{"from":"commercialDecision","to":"MEASUREMENT","label":"Continuar dentro dos limites / corrigir medição","kind":"REWORK"},{"from":"commercialDecision","to":"SCALE_AUTHORIZATION","label":"Vendas, contribuição e valor comprovados"},{"from":"SCALE_AUTHORIZATION","to":"MEASUREMENT","label":"Nova autorização explícita","kind":"REWORK"},{"from":"commercialDecision","to":"end","label":"Encerrar / inconclusivo"},{"from":"VIDEO_APPROVAL","to":"ADJUSTMENT","label":"Reprovado: corrigir causa e renovar evidências","kind":"REWORK"}]}',NOW(),NOW()
               FROM business_process_definition source
               WHERE source.process_code='value-chain-learning-sales-cycle' AND source.version_number=1
               AND NOT EXISTS (SELECT 1 FROM business_process_definition target WHERE target.process_code=source.process_code AND target.version_number=2);
