      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DELETE a FROM business_process_activity_definition a
              JOIN business_process_definition p ON p.id=a.process_definition_id
              LEFT JOIN learning_sales_cycle_v1 c ON c.process_definition_id=p.id
              LEFT JOIN business_process_activity_instance i ON i.activity_definition_id=a.id
              WHERE p.process_code='value-chain-learning-sales-cycle' AND p.version_number=2 AND c.id IS NULL AND i.id IS NULL;
              DELETE p FROM business_process_definition p
              LEFT JOIN business_process_activity_definition a ON a.process_definition_id=p.id
              LEFT JOIN learning_sales_cycle_v1 c ON c.process_definition_id=p.id
              WHERE p.process_code='value-chain-learning-sales-cycle' AND p.version_number=2 AND a.id IS NULL AND c.id IS NULL;
              UPDATE business_process_definition previous_version
              LEFT JOIN business_process_definition current_version ON current_version.process_code=previous_version.process_code AND current_version.version_number=2
              SET previous_version.status='PUBLISHED'
              WHERE previous_version.process_code='value-chain-learning-sales-cycle' AND previous_version.version_number=1 AND current_version.id IS NULL;
