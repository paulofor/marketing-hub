               SELECT p.id,'ADJUSTMENT','Ajustar produto e comunicação','Execute a atividade indicada pela causa. Entregue uma ação útil para a cliente e uma comunicação fiel. Registre a versão e as provas do ajuste.','Dédalo · produto; Íris e Apolo · comunicação',
               '{"id":"ADJUSTMENT","type":"TASK","label":"Ajustar produto e comunicação","owner":"Dédalo · produto; Íris e Apolo · comunicação","description":"Execute a atividade indicada pela causa. Entregue uma ação útil para a cliente e uma comunicação fiel. Registre a versão e as provas do ajuste.","runtimePath":"/business-process-chains/learning-cycles"}',NOW()
