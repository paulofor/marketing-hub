  - changeSet:
      id: 2026-09-08-learning-sales-cycles-v1-clock-precision
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE business_process_activity_instance
                MODIFY entered_at DATETIME(6) NOT NULL,
                MODIFY exited_at DATETIME(6) NULL,
                MODIFY created_at DATETIME(6) NOT NULL,
                MODIFY updated_at DATETIME(6) NOT NULL;
              ALTER TABLE agent_task MODIFY created_at DATETIME(6) NOT NULL;
              ALTER TABLE facebook_ads_campaign
                MODIFY created_at TIMESTAMP(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6);
      # Precisão maior é compatível com o código anterior; rollback não destrói a cronologia auditada.
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: SELECT 1;
