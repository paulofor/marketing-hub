databaseChangeLog:
  - changeSet:
      id: 2026-09-08-pde-learning-cycle-organization-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM business_process_chain_definition WHERE chain_code='pde-value-creation-delivery' AND version_number=12
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM business_process_definition WHERE process_code='pde-sales-delivery-learning' AND version_number=4
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM business_process_definition WHERE process_code='value-chain-learning-sales-cycle' AND version_number=2
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_definition
               (process_code,name,purpose,owner_name,trigger_description,outcome_description,version_number,status,
                technical_reference,process_type,parent_process_code,execution_scope,diagram_json,created_at,published_at)
               SELECT source.process_code,source.name,
                'Vender, entregar valor e conduzir ciclos por experimento: resultados orientam ajustes, revalidação e decisões de investimento.',
                source.owner_name,source.trigger_description,
                'Decisão registrada no ciclo, com evidências, responsável e retorno ao processo da causa; vendas e entrega preservadas.',
                5,'PUBLISHED',source.technical_reference,source.process_type,source.parent_process_code,source.execution_scope,
                '{"nodes":[{"id":"start","type":"START","label":"Ativação autorizada","owner":"Backend","description":"Orçamento e regras iniciam o ciclo."},{"id":"optimization","type":"TASK","label":"Operar e otimizar o experimento","owner":"Backend","description":"Delega aquisição, mensuração e teste de variável ao subprocesso canônico.","subprocessCode":"operacao-otimizacao-experimento"},{"id":"delivery","type":"TASK","label":"Entregar cada venda e acompanhar satisfação","owner":"Backend","description":"Delega conciliação, entrega, suporte, satisfação e reembolso ao subprocesso canônico.","subprocessCode":"venda-entrega-satisfacao-cliente"},{"id":"consolidate","type":"TASK","label":"Consolidar resultado comercial","owner":"Backend","description":"Cruza vendas, receita, margem, entrega, satisfação e aprendizado sem reexecutar os subprocessos."},{"id":"learningCycle","type":"TASK","label":"Conduzir o ciclo de aprendizado e vendas","owner":"Operador responsável pelo produto","description":"Abra ou retome o ciclo deste produto e experimento. Concilie resultados, registre a decisão e siga a atividade orientada. Mudança comercial exige experimento sucessor com o aprendizado anterior; correção técnica permanece na mesma iteração com revalidação.","subprocessCode":"value-chain-learning-sales-cycle"},{"id":"decision","type":"GATEWAY","label":"Qual decisão comercial?","owner":"Backend e operador humano","description":"A decisão persistida no ciclo determina o retorno pela causa. Continuar coleta respeita janela e orçamento. Ajustar estratégia, produto ou comunicação exige revalidação; escala exige nova autorização. Encerrar preserva resultados e limitações."},{"id":"end","type":"END","label":"Ciclo decidido por vendas entregues","owner":"Backend","description":"A decisão e suas evidências ficam auditáveis."}],"flows":[{"from":"start","to":"optimization"},{"from":"start","to":"delivery"},{"from":"optimization","to":"consolidate"},{"from":"delivery","to":"consolidate"},{"from":"consolidate","to":"learningCycle","label":"Resultados e limitações disponíveis"},{"from":"learningCycle","to":"decision","label":"Decisão registrada no ciclo"},{"from":"decision","to":"optimization","label":"Continuar coleta dentro da janela e do orçamento","kind":"REWORK"},{"from":"decision","to":"optimization","label":"Corrigir medição; preservar o experimento","kind":"REWORK"},{"from":"decision","to":"learningCycle","label":"Ajustar: sucessor com memória → processo 2, 3 ou 4 → homologação 5 → operação 6","kind":"REWORK"},{"from":"decision","to":"learningCycle","label":"Escalar: comprovar contribuição e valor → nova autorização no processo 5","kind":"REWORK"},{"from":"decision","to":"end","label":"Encerrar ou inconclusivo: preservar evidências"}],"learningCycleReturns":[{"label":"Estratégia e economia","condition":"A evidência exige rever oferta, preço ou viabilidade. Defina a hipótese do sucessor.","processCode":"pde-commercial-plan-offer"},{"label":"Utilidade do produto","condition":"A cliente não consegue aplicar o resultado ou perceber valor. Corrija a entrega e renove os pareceres.","processCode":"pde-construction-approval"},{"label":"Comunicação e vídeos","condition":"O benefício ou a entrada não são compreendidos. Ajuste mensagem, demonstração e criativo.","processCode":"pde-communication-sales-journey"},{"label":"Homologação e autorização","condition":"Depois dos ajustes, valide a mesma versão e obtenha autorização explícita antes de publicar ou expandir.","processCode":"pde-commercial-homologation-activation"},{"label":"Coleta e medição","condition":"Continuar somente com dados válidos dentro dos limites; corrigir dados inválidos antes de decidir sobre desempenho.","processCode":"pde-sales-delivery-learning"}]}',UTC_TIMESTAMP(),UTC_TIMESTAMP()
               FROM business_process_definition source
               WHERE source.process_code='pde-sales-delivery-learning' AND source.version_number=4
               AND NOT EXISTS (SELECT 1 FROM business_process_definition target
                WHERE target.process_code=source.process_code AND target.version_number=5);

              INSERT INTO business_process_activity_definition
               (process_definition_id,activity_id,name,objective,owner_name,execution_resource_code,subprocess_code,definition_json,created_at)
               SELECT p.id,
                JSON_UNQUOTE(JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,'].id'))),
                JSON_UNQUOTE(JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,'].label'))),
                JSON_UNQUOTE(JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,'].description'))),
                JSON_UNQUOTE(JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,'].owner'))),
                NULL,JSON_UNQUOTE(JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,'].subprocessCode'))),
                JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,']')),UTC_TIMESTAMP()
               FROM business_process_definition p
               JOIN (SELECT 1 number UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4) n
               LEFT JOIN business_process_activity_definition existing ON existing.process_definition_id=p.id
                AND existing.activity_id=JSON_UNQUOTE(JSON_EXTRACT(p.diagram_json,CONCAT('$.nodes[',n.number,'].id')))
               WHERE p.process_code='pde-sales-delivery-learning' AND p.version_number=5 AND existing.id IS NULL;

              INSERT INTO business_process_chain_definition
               (chain_code,name,purpose,outcome_description,primary_metric,version_number,status,created_at,published_at)
               SELECT source.chain_code,source.name,source.purpose,
                'Venda entregue e ciclo de aprendizado decidido no processo 6, com retorno orientado à causa e próxima ação auditável.',
                source.primary_metric,13,'PUBLISHED',UTC_TIMESTAMP(),UTC_TIMESTAMP()
               FROM business_process_chain_definition source
               WHERE source.chain_code='pde-value-creation-delivery' AND source.version_number=12
               AND NOT EXISTS (SELECT 1 FROM business_process_chain_definition target
                WHERE target.chain_code=source.chain_code AND target.version_number=13);

              INSERT INTO business_process_chain_item
               (chain_definition_id,process_definition_id,sequence_number,value_contribution,created_at)
               SELECT target.id,CASE WHEN old_process.process_code='pde-sales-delivery-learning' THEN new_process.id ELSE item.process_definition_id END,
                item.sequence_number,CASE WHEN old_process.process_code='pde-sales-delivery-learning'
                 THEN 'Vendas e valor entregue alimentam o ciclo: decidir, corrigir a causa e revalidar antes de investir novamente.'
                 ELSE item.value_contribution END,UTC_TIMESTAMP()
               FROM business_process_chain_definition source
               JOIN business_process_chain_item item ON item.chain_definition_id=source.id
               JOIN business_process_definition old_process ON old_process.id=item.process_definition_id
               JOIN business_process_definition new_process ON new_process.process_code='pde-sales-delivery-learning' AND new_process.version_number=5
               JOIN business_process_chain_definition target ON target.chain_code=source.chain_code AND target.version_number=13
               LEFT JOIN business_process_chain_item existing ON existing.chain_definition_id=target.id AND existing.sequence_number=item.sequence_number
               WHERE source.chain_code='pde-value-creation-delivery' AND source.version_number=12 AND existing.id IS NULL;

              UPDATE business_process_definition SET status='RETIRED'
               WHERE process_code='pde-sales-delivery-learning' AND version_number=4 AND status='PUBLISHED';
              UPDATE business_process_definition SET status='PUBLISHED'
               WHERE process_code='pde-sales-delivery-learning' AND version_number=5;
              UPDATE business_process_chain_definition SET status='RETIRED'
               WHERE chain_code='pde-value-creation-delivery' AND version_number=12 AND status='PUBLISHED';
              UPDATE business_process_chain_definition SET status='PUBLISHED'
               WHERE chain_code='pde-value-creation-delivery' AND version_number=13;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE business_process_chain_definition SET status='RETIRED'
               WHERE chain_code='pde-value-creation-delivery' AND version_number=13;
              UPDATE business_process_definition SET status='RETIRED'
               WHERE process_code='pde-sales-delivery-learning' AND version_number=5;
              UPDATE business_process_chain_definition SET status='PUBLISHED'
               WHERE chain_code='pde-value-creation-delivery' AND version_number=12;
              UPDATE business_process_definition SET status='PUBLISHED'
               WHERE process_code='pde-sales-delivery-learning' AND version_number=4;
