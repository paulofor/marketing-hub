databaseChangeLog:
  - changeSet:
      id: 2026-09-09-learning-cycle-automatic-measurement-v3
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM business_process_definition WHERE process_code='value-chain-learning-sales-cycle' AND version_number=2
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO business_process_definition
               (process_code,name,purpose,owner_name,trigger_description,outcome_description,version_number,status,
                technical_reference,process_type,execution_scope,parent_process_code,diagram_json,created_at,published_at)
              SELECT source.process_code,source.name,
               'Transformar automaticamente resultados atribuídos em decisões para melhorar produto, comunicação, vendas líquidas e contribuição.',
               source.owner_name,source.trigger_description,
               'Fotografia automática auditável ou bloqueio da fonte, seguida de decisão comercial e próxima ação explícita.',
               3,'PUBLISHED',source.technical_reference,source.process_type,source.execution_scope,source.parent_process_code,
               JSON_SET(source.diagram_json,
                '$.schemaVersion','LEARNING_SALES_CYCLE_V3',
                '$.nodes[12].owner','Marketing Hub · conciliação automática; Hermes e Plutus · interpretação',
                '$.nodes[12].description','O backend lê automaticamente o funil atribuído, métricas do canal, vendas, reembolsos, custos, entrega, uso e satisfação. Persiste fonte, período e segregação. Fonte ausente ou inconsistente bloqueia sem virar zero e orienta a correção; a tela não recebe digitação de resultados.'),
               UTC_TIMESTAMP(),UTC_TIMESTAMP()
              FROM business_process_definition source
              WHERE source.process_code='value-chain-learning-sales-cycle' AND source.version_number=2
              AND NOT EXISTS (SELECT 1 FROM business_process_definition target
               WHERE target.process_code=source.process_code AND target.version_number=3);

              INSERT INTO business_process_activity_definition
               (process_definition_id,activity_id,name,objective,owner_name,execution_resource_code,subprocess_code,definition_json,created_at)
              SELECT target.id,activity.activity_id,activity.name,
               CASE WHEN activity.activity_id='MEASUREMENT'
                THEN 'Conciliar automaticamente as fontes oficiais atribuídas ao experimento e bloquear qualquer ausência ou divergência sem registrá-la como zero.'
                ELSE activity.objective END,
               CASE WHEN activity.activity_id='MEASUREMENT'
                THEN 'Marketing Hub · conciliação automática; Hermes e Plutus · interpretação'
                ELSE activity.owner_name END,
               activity.execution_resource_code,activity.subprocess_code,
               CASE WHEN activity.activity_id='MEASUREMENT'
                THEN JSON_SET(activity.definition_json,
                 '$.owner','Marketing Hub · conciliação automática; Hermes e Plutus · interpretação',
                 '$.description','O backend lê automaticamente o funil atribuído, métricas do canal, vendas, reembolsos, custos, entrega, uso e satisfação. Persiste fonte, período e segregação. Fonte ausente ou inconsistente bloqueia sem virar zero e orienta a correção; a tela não recebe digitação de resultados.')
                ELSE activity.definition_json END,
               UTC_TIMESTAMP()
              FROM business_process_definition source
              JOIN business_process_activity_definition activity ON activity.process_definition_id=source.id
              JOIN business_process_definition target ON target.process_code=source.process_code AND target.version_number=3
              LEFT JOIN business_process_activity_definition existing ON existing.process_definition_id=target.id
               AND existing.activity_id=activity.activity_id
              WHERE source.process_code='value-chain-learning-sales-cycle' AND source.version_number=2
               AND existing.id IS NULL;

              UPDATE business_process_definition previous_version
              JOIN business_process_definition current_version
               ON current_version.process_code=previous_version.process_code AND current_version.version_number=3
              SET previous_version.status='RETIRED'
              WHERE previous_version.process_code='value-chain-learning-sales-cycle'
               AND previous_version.version_number=2 AND previous_version.status='PUBLISHED';
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DELETE activity FROM business_process_activity_definition activity
              JOIN business_process_definition process ON process.id=activity.process_definition_id
              LEFT JOIN business_process_activity_instance instance ON instance.activity_definition_id=activity.id
              LEFT JOIN learning_sales_cycle_v1 cycle ON cycle.process_definition_id=process.id
              WHERE process.process_code='value-chain-learning-sales-cycle' AND process.version_number=3
               AND instance.id IS NULL AND cycle.id IS NULL;
              DELETE process FROM business_process_definition process
              LEFT JOIN business_process_activity_definition activity ON activity.process_definition_id=process.id
              LEFT JOIN learning_sales_cycle_v1 cycle ON cycle.process_definition_id=process.id
              WHERE process.process_code='value-chain-learning-sales-cycle' AND process.version_number=3
               AND activity.id IS NULL AND cycle.id IS NULL;
              UPDATE business_process_definition previous_version
              LEFT JOIN business_process_definition current_version
               ON current_version.process_code=previous_version.process_code AND current_version.version_number=3
              SET previous_version.status='PUBLISHED'
              WHERE previous_version.process_code='value-chain-learning-sales-cycle'
               AND previous_version.version_number=2 AND current_version.id IS NULL;
