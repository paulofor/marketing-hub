databaseChangeLog:
  - changeSet:
      id: 2026-09-14-product-execution-profiles-v1-profile
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_execution_profile_v1 (
                id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                product_id BIGINT NOT NULL,
                revision_number INT NOT NULL,
                chain_id BIGINT NOT NULL,
                commercial_plan_id BIGINT NOT NULL,
                commercial_plan_version INT NOT NULL,
                product_type VARCHAR(191),
                product_format VARCHAR(191),
                contract_json LONGTEXT NOT NULL,
                composition_json LONGTEXT NOT NULL,
                created_by VARCHAR(100) NOT NULL,
                created_at DATETIME(6) NOT NULL,
                CONSTRAINT uq_execution_profile_revision UNIQUE(product_id, revision_number),
                CONSTRAINT fk_execution_profile_product FOREIGN KEY(product_id) REFERENCES product(id),
                CONSTRAINT fk_execution_profile_chain FOREIGN KEY(chain_id) REFERENCES business_process_chain_definition(id),
                CONSTRAINT fk_execution_profile_plan FOREIGN KEY(commercial_plan_id) REFERENCES commercial_plan(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE product_execution_profile_v1;
  - changeSet:
      id: 2026-09-14-product-execution-profiles-v1-binding
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_execution_binding_v1 (
                id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                product_id BIGINT NOT NULL,
                profile_id BIGINT NOT NULL,
                source_reference VARCHAR(191) COLLATE utf8mb4_bin NOT NULL,
                learning_cycle_id BIGINT,
                created_by VARCHAR(100) NOT NULL,
                created_at DATETIME(6) NOT NULL,
                CONSTRAINT uq_execution_binding_source UNIQUE(source_reference),
                CONSTRAINT fk_execution_binding_profile FOREIGN KEY(profile_id) REFERENCES product_execution_profile_v1(id),
                CONSTRAINT fk_execution_binding_product FOREIGN KEY(product_id) REFERENCES product(id),
                CONSTRAINT fk_execution_binding_cycle FOREIGN KEY(learning_cycle_id) REFERENCES learning_sales_cycle_v1(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE product_execution_binding_v1;
  - changeSet:
      id: 2026-09-14-product-execution-profiles-v1-review
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_execution_review_v1 (
                id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                profile_id BIGINT NOT NULL,
                checkpoint VARCHAR(32) NOT NULL,
                financial_execution_id BIGINT NOT NULL,
                approved BIT(1) NOT NULL,
                reviewed_by VARCHAR(100) NOT NULL,
                rationale TEXT NOT NULL,
                created_at DATETIME(6) NOT NULL,
                INDEX idx_execution_review_profile(profile_id, id),
                CONSTRAINT fk_execution_review_profile FOREIGN KEY(profile_id) REFERENCES product_execution_profile_v1(id),
                CONSTRAINT fk_execution_review_financial FOREIGN KEY(financial_execution_id) REFERENCES financial_agent_execution(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE product_execution_review_v1;
  - changeSet:
      id: 2026-09-14-product-execution-profiles-v1-consumption
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_execution_consumption_v1 (
                id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                binding_id BIGINT NOT NULL,
                operation_key VARCHAR(100) COLLATE utf8mb4_bin NOT NULL,
                usage_key VARCHAR(100) COLLATE utf8mb4_bin NOT NULL,
                input_hash VARCHAR(64) NOT NULL,
                units INT NOT NULL,
                reserved_brl DECIMAL(18,6) NOT NULL,
                actual_brl DECIMAL(18,6),
                status VARCHAR(32) NOT NULL,
                evidence TEXT,
                test_data BIT(1) NOT NULL,
                created_at DATETIME(6) NOT NULL,
                finished_at DATETIME(6),
                CONSTRAINT uq_execution_consumption_operation UNIQUE(binding_id, operation_key),
                INDEX idx_execution_consumption_usage(binding_id, usage_key, test_data),
                CONSTRAINT fk_execution_consumption_binding FOREIGN KEY(binding_id) REFERENCES product_execution_binding_v1(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE product_execution_consumption_v1;
