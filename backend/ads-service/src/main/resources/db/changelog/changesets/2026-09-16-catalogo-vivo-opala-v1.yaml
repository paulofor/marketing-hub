databaseChangeLog:
  - changeSet:
      id: 2026-09-16-catalogo-vivo-opala-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "7"
            sql: >-
              SELECT COUNT(*) FROM business_process_activity_definition a
              JOIN business_process_definition p ON p.id=a.process_definition_id
              WHERE p.process_code='opala-commercial-preparation-v1' AND p.version_number=1
              AND JSON_LENGTH(JSON_EXTRACT(a.definition_json,'$.responsibleAgentKeys'))=1
        - sqlCheck:
            expectedResult: "4"
            sql: SELECT COUNT(*) FROM agent WHERE agent_key IN ('landing-generator','financial-agent','customer-agent','meta-ad-approver')
        - sqlCheck:
            expectedResult: "1"
            sql: SELECT COUNT(*) FROM product_type_definition WHERE code='PDE'
      changes:
        - sqlFile:
            path: 2026-09-16-catalogo-vivo-opala-v1.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: >-
              SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Catálogo Vivo preserva histórico. Recupere versões pela ativação administrativa; remoção exige migração explícita.';
