databaseChangeLog:
  - logicalFilePath: db/changelog/changesets/2026-09-16-vega-v12-commercial-candidate.yaml
  - changeSet:
      id: 2026-09-16-vega-v12-commercial-candidate-001
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - tableExists:
            tableName: pde_production_slot
        - tableExists:
            tableName: experiment
        - columnExists:
            tableName: pde_production_slot
            columnName: draft_experience_json
        - columnExists:
            tableName: pde_production_slot
            columnName: published_experience_json
        - columnExists:
            tableName: experiment
            columnName: commercial_checkout_url
      changes:
        - sqlFile:
            path: 2026-09-16-vega-v12-commercial-candidate.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DELETE FROM pde_production_slot
              WHERE product_slug = 'metodo-musa-7-dias'
                AND slot_code = 'v8'
                AND experience_version = 'musa-pde-entry-v12-primeiro-ajuste-aplicavel'
                AND status = 'CANDIDATE'
                AND published_experience_json IS NULL
                AND validation_status IS NULL
                AND notes = 'Vega v12 candidata do experimento 92; promover o mesmo artefato somente após homologação.';
