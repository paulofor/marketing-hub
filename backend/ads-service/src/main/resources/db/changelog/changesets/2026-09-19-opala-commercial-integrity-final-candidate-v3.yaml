databaseChangeLog:
  - changeSet:
      id: 2026-09-19-opala-commercial-integrity-final-candidate-v3
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT COUNT(*) FROM catalogo_vivo_binding_v1 b
              JOIN business_process_activity_definition a ON a.id=b.activity_definition_id
              JOIN business_process_definition p ON p.id=a.process_definition_id
              JOIN catalogo_vivo_prompt_version_v1 v ON v.id=b.active_version_id
              WHERE p.process_code='opala-commercial-preparation-v1' AND p.version_number=1
              AND a.activity_id='commercialIntegrityReview' AND v.version_number=2
              AND v.sha256='8ff0e4cb56deef842ab5e29e9c797f92b5aeec3f3b07b75b01b08b6a67143766'
      changes:
        - sqlFile:
            path: 2026-09-19-opala-commercial-integrity-final-candidate-v3.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: >-
              SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'A versão Opala v3 fecha a seleção do criativo final e suas provas; rollback operacional exige nova versão revisada pelo Catálogo Vivo.';
