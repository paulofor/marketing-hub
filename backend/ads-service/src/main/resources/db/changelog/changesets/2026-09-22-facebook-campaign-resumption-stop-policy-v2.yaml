databaseChangeLog:
  - changeSet:
      id: 2026-09-22-experiment-purchase-stop-count-v1
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - not:
            - columnExists:
                tableName: experiment
                columnName: purchase_stop_count
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: ALTER TABLE experiment ADD COLUMN purchase_stop_count INT NULL AFTER zero_result_spend_limit;
