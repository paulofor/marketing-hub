            expectedResult: 0
            sql: SELECT COUNT(*) FROM business_process_definition WHERE COALESCE(JSON_UNQUOTE(JSON_EXTRACT(diagram_json,'$.commercialCriteriaVersion')),'') <> 'PDE_COMMERCIAL_PRINCIPLES_V1' AND ((process_code='pde-commercial-plan-offer' AND version_number=7) OR (process_code='pde-construction-approval' AND version_number=9) OR (process_code='pde-communication-sales-journey' AND version_number=8) OR (process_code='pde-tasting-proof-of-value' AND version_number=3) OR (process_code='operacao-otimizacao-experimento' AND version_number=6) OR (process_code='value-chain-learning-sales-cycle' AND version_number=5) OR (process_code='pde-sales-delivery-learning' AND version_number=9))
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM business_process_chain_definition WHERE chain_code='pde-value-creation-delivery' AND version_number=18 AND purpose NOT LIKE '%Critérios comerciais explícitos v1.'
      changes:
        - sqlFile:
            path: 2026-09-22-pde-commercial-principles-v1.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='pde-commercial-plan-offer' AND version_number=7;
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='pde-construction-approval' AND version_number=9;
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='pde-communication-sales-journey' AND version_number=8;
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='pde-tasting-proof-of-value' AND version_number=3;
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='operacao-otimizacao-experimento' AND version_number=6;
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='value-chain-learning-sales-cycle' AND version_number=5;
              UPDATE business_process_definition SET status='RETIRED' WHERE process_code='pde-sales-delivery-learning' AND version_number=9;
              UPDATE business_process_chain_definition SET status='RETIRED' WHERE chain_code='pde-value-creation-delivery' AND version_number=18;
