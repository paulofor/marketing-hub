            expectedResult: 1
            sql: SELECT IF(COUNT(*)=6,1,0) FROM business_process_chain_item i JOIN business_process_chain_definition c ON c.id=i.chain_definition_id WHERE c.chain_code='pde-value-creation-delivery' AND c.version_number=17
