databaseChangeLog:
  - changeSet:
      id: 2026-09-25-facebook-campaign-replaces-id-v1
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - not:
            - columnExists:
                tableName: facebook_ads_campaign
                columnName: replaces_campaign_id
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: ALTER TABLE facebook_ads_campaign ADD COLUMN replaces_campaign_id VARCHAR(36) NULL AFTER lifetime_budget_minor;
