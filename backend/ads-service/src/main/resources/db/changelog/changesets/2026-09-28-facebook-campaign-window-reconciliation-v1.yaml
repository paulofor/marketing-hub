databaseChangeLog:
  - changeSet:
      id: 2026-09-28-facebook-campaign-meta-configured-status-v1
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - not:
            - columnExists:
                tableName: facebook_ads_campaign
                columnName: meta_configured_status
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: ALTER TABLE facebook_ads_campaign ADD COLUMN meta_configured_status VARCHAR(32) NULL AFTER status;
