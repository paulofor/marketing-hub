databaseChangeLog:
  - changeSet:
      id: 2026-09-29-hypothesis-product-ai-subtype-varchar-v1
      author: marketinghub
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        dbms:
          type: mysql
        columnExists:
          tableName: hypothesis
          columnName: product_ai_subtype
        sqlCheck:
          expectedResult: "1"
          sql: >-
            SELECT CASE WHEN DATA_TYPE = 'varchar' AND CHARACTER_MAXIMUM_LENGTH >= 48 THEN 0 ELSE 1 END
              FROM information_schema.COLUMNS
             WHERE TABLE_SCHEMA = DATABASE()
               AND TABLE_NAME = 'hypothesis'
               AND COLUMN_NAME = 'product_ai_subtype'
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |-
              ALTER TABLE hypothesis
                MODIFY COLUMN product_ai_subtype VARCHAR(48) NULL;

  - changeSet:
      id: 2026-09-29-experiment-product-ai-subtype-varchar-v1
