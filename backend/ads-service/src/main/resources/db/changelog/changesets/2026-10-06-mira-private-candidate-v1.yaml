databaseChangeLog:
  - changeSet:
      id: 2026-10-06-mira-private-candidate-v1
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS mira_private_session_v1 (
                id VARCHAR(36) NOT NULL PRIMARY KEY,
                cycle_id BIGINT NOT NULL,
                product_id BIGINT NOT NULL,
                experiment_id BIGINT NOT NULL,
                prototype_version VARCHAR(160) NOT NULL,
                session_hash VARCHAR(64) NOT NULL,
                revoked BIT NOT NULL DEFAULT 0,
                expires_at DATETIME(6) NOT NULL,
                created_at DATETIME(6) NOT NULL,
                payload_json LONGTEXT NOT NULL,
                UNIQUE KEY uk_mira_private_session_hash (session_hash),
                KEY ix_mira_private_cycle (cycle_id, created_at),
                CONSTRAINT fk_mira_private_cycle FOREIGN KEY (cycle_id) REFERENCES learning_sales_cycle_v1(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: DROP TABLE IF EXISTS mira_private_session_v1;
