databaseChangeLog:
  - changeSet:
      id: 2026-10-21-opala-static-creative-v2
      author: codex
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT COUNT(*) FROM catalogo_vivo_binding_v1 b
              JOIN business_process_activity_definition a ON a.id=b.activity_definition_id
              JOIN business_process_definition p ON p.id=a.process_definition_id
              JOIN catalogo_vivo_prompt_version_v1 v ON v.id=b.active_version_id
              WHERE p.process_code='opala-commercial-preparation-v1' AND p.version_number=1
              AND a.activity_id='creative' AND v.version_number=1
              AND v.sha256='cf98b9ce37ac0ff2293e8e55a3a0686d16f1a9efc88e5d87248b9c497ef0fa25'
              AND b.schema_sha256='128d45becffeabb4f303699cd781285b2b3f522c6b960a0f21e4085d6f2c3fbd'
        - sqlCheck:
            expectedResult: "0"
            sql: >-
              SELECT COUNT(*) FROM catalogo_vivo_prompt_version_v1 v
              JOIN catalogo_vivo_binding_v1 b ON b.id=v.binding_id
              JOIN business_process_activity_definition a ON a.id=b.activity_definition_id
              JOIN business_process_definition p ON p.id=a.process_definition_id
              WHERE p.process_code='opala-commercial-preparation-v1' AND p.version_number=1
              AND a.activity_id='creative' AND v.version_number=2
      changes:
        - sqlFile:
            path: 2026-10-21-opala-static-creative-v2.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: >-
              SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Preserve tarefas e auditoria Opala; rollback operacional exige selecionar uma versão textual revisada pelo Catálogo Vivo.';
