databaseChangeLog:
  - changeSet:
      id: 2026-10-21-pde-paid-visual-v1
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE pde_paid_visual_order (
                payment_id VARCHAR(80) NOT NULL PRIMARY KEY,
                product_id BIGINT NOT NULL,
                experiment_id BIGINT NOT NULL,
                product_slug VARCHAR(191) NOT NULL,
                experience_version VARCHAR(120) NOT NULL,
                buyer_email VARCHAR(254) NOT NULL,
                amount_brl DECIMAL(12,2) NOT NULL,
                payment_status VARCHAR(32) NOT NULL,
                paid_at DATETIME NOT NULL,
                expires_at DATETIME NOT NULL,
                access_hash VARCHAR(64) NULL,
                last_email_at DATETIME NULL,
                initial_job_id VARCHAR(96) NULL,
                regeneration_job_id VARCHAR(96) NULL,
                contract_json LONGTEXT NOT NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NOT NULL,
                UNIQUE KEY uk_paid_visual_access (access_hash),
                KEY ix_paid_visual_buyer (experiment_id, buyer_email(191), paid_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
