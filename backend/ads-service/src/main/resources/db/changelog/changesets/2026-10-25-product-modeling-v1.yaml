databaseChangeLog:
  - changeSet:
      id: 2026-10-25-product-modeling-v1
      author: codex
      preConditions:
        - onFail: HALT
        - dbms:
            type: mysql
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE product_modeling_v1 (
                id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY,
                request_key VARCHAR(36) NOT NULL,
                product_id BIGINT NULL,
                product_name VARCHAR(191) NOT NULL,
                desired_outcome VARCHAR(2000) NOT NULL,
                references_json LONGTEXT NOT NULL,
                big_idea_snapshot LONGTEXT NULL,
                discovery_cycle_id BIGINT NULL,
                learning_cycle_id BIGINT NULL,
                experiment_id BIGINT NULL,
                adopted_context_json LONGTEXT NULL,
                adopted_at DATETIME(6) NULL,
                created_at DATETIME(6) NOT NULL,
                UNIQUE KEY uk_modeling_learning_cycle (learning_cycle_id),
                UNIQUE KEY uk_modeling_experiment (experiment_id),
                CONSTRAINT fk_modeling_learning FOREIGN KEY (learning_cycle_id) REFERENCES learning_sales_cycle_v1(id),
                CONSTRAINT fk_modeling_experiment FOREIGN KEY (experiment_id) REFERENCES experiment(id),
                UNIQUE KEY uk_modeling_request (request_key),
                UNIQUE KEY uk_modeling_discovery (discovery_cycle_id),
                CONSTRAINT fk_modeling_product FOREIGN KEY (product_id) REFERENCES product(id),
                CONSTRAINT fk_modeling_discovery FOREIGN KEY (discovery_cycle_id) REFERENCES product_discovery_cycle(id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
