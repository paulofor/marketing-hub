databaseChangeLog:
  - changeSet:
      id: 2026-12-20-experiment-report-request
      author: repo
      preConditions:
        onFail: MARK_RAN
        and:
          - dbms:
              type: mysql
      changes:
        - sql:
            dbms: mysql
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE experiment_report_request (
                  id BIGINT AUTO_INCREMENT PRIMARY KEY,
                  experiment_id BIGINT NOT NULL,
                  status VARCHAR(32) NOT NULL,
                  requested_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  completed_at DATETIME(6) NULL,
                  requested_by VARCHAR(191) NULL,
                  download_url VARCHAR(512) NULL,
                  payload_snapshot LONGTEXT NULL,
                  failure_reason LONGTEXT NULL,
                  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  updated_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                  CONSTRAINT fk_experiment_report_request_experiment FOREIGN KEY (experiment_id)
                      REFERENCES experiment(id)
                      ON DELETE CASCADE
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;

              CREATE INDEX idx_exp_report_request_experiment ON experiment_report_request (experiment_id, requested_at);
              CREATE INDEX idx_exp_report_request_status ON experiment_report_request (status, requested_at);
