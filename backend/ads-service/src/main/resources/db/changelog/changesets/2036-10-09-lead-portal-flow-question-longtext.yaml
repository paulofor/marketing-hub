databaseChangeLog:
  - changeSet:
      id: 2036-10-09-lead-portal-question-longtext
      author: ai
      preConditions:
        onFail: MARK_RAN
        and:
          - dbms:
              type: mysql
          - not:
              sqlCheck:
                expectedResult: "0"
                sql: |
                  SELECT COUNT(*)
                    FROM information_schema.columns
                   WHERE table_schema = DATABASE()
                     AND table_name = 'lead_portal_flow_question'
                     AND column_name IN ('title','description','placeholder')
                     AND data_type <> 'longtext'
      changes:
        - modifyDataType:
            dbms: mysql
            tableName: lead_portal_flow_question
            columnName: title
            newDataType: LONGTEXT
        - modifyDataType:
            dbms: mysql
            tableName: lead_portal_flow_question
            columnName: description
            newDataType: LONGTEXT
        - modifyDataType:
            dbms: mysql
            tableName: lead_portal_flow_question
            columnName: placeholder
            newDataType: LONGTEXT

  - changeSet:
      id: 2036-10-09-lead-portal-question-option-longtext
      author: ai
      preConditions:
        onFail: MARK_RAN
        and:
          - dbms:
              type: mysql
          - not:
              sqlCheck:
                expectedResult: "0"
                sql: |
