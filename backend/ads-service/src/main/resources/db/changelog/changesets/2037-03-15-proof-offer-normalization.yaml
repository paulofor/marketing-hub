databaseChangeLog:
  - changeSet:
      id: 2037-03-15-deliverable-package-allow-null-experiment
      author: marketinghub
      preConditions:
        onFail: MARK_RAN
        dbms:
          type: mysql
        columnExists:
          tableName: deliverable_package
          columnName: experiment_id
      changes:
        - dropNotNullConstraint:
            tableName: deliverable_package
            columnName: experiment_id
            columnDataType: BIGINT

  - changeSet:
      id: 2037-03-15-deliverable-package-hypothesis-column
      author: marketinghub
      preConditions:
        onFail: MARK_RAN
        dbms:
          type: mysql
        not:
          columnExists:
            tableName: deliverable_package
            columnName: hypothesis_id
      changes:
        - addColumn:
            tableName: deliverable_package
            columns:
              - column:
                  name: hypothesis_id
                  type: BINARY(16)
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: deliverable_package
            baseColumnNames: hypothesis_id
            referencedTableName: hypothesis
            referencedColumnNames: id
            onDelete: SET NULL
            constraintName: fk_deliverable_package_hypothesis
        - createIndex:
            indexName: idx_deliverable_package_hypothesis
            tableName: deliverable_package
            columns:
              - column:
                  name: hypothesis_id

  - changeSet:
      id: 2037-03-15-deliverable-package-hypothesis-unique-name
      author: marketinghub
      preConditions:
        onFail: MARK_RAN
        dbms:
          type: mysql
        columnExists:
          tableName: deliverable_package
          columnName: hypothesis_id
      changes:
        - addUniqueConstraint:
            tableName: deliverable_package
            columnNames: hypothesis_id, name
            constraintName: uq_deliverable_package_hypothesis_name

  - changeSet:
      id: 2037-03-15-hypothesis-offer-package
      author: marketinghub
      preConditions:
        onFail: MARK_RAN
        dbms:
          type: mysql
        not:
          columnExists:
            tableName: hypothesis
            columnName: offer_package_id
      changes:
        - addColumn:
            tableName: hypothesis
            columns:
              - column:
                  name: offer_package_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: hypothesis
            baseColumnNames: offer_package_id
            referencedTableName: deliverable_package
            referencedColumnNames: id
            onDelete: SET NULL
            constraintName: fk_hypothesis_offer_package
        - createIndex:
            indexName: idx_hypothesis_offer_package
            tableName: hypothesis
            columns:
              - column:
                  name: offer_package_id

  - changeSet:
      id: 2037-03-15-proof-artifact-table
      author: marketinghub
      preConditions:
        onFail: MARK_RAN
        dbms:
          type: mysql
        not:
          tableExists:
            tableName: proof_artifact
      changes:
        - createTable:
            tableName: proof_artifact
            tableOptions: ENGINE=InnoDB DEFAULT CHARSET=utf8mb4
            columns:
              - column:
                  name: id
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_proof_artifact
                    nullable: false
              - column:
                  name: market_niche_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_proof_artifact_niche
                    references: market_niche(id)
              - column:
                  name: hypothesis_id
                  type: BINARY(16)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_proof_artifact_hypothesis
                    references: hypothesis(id)
              - column:
                  name: experiment_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_proof_artifact_experiment
                    references: experiment(id)
              - column:
                  name: visual_proof_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_proof_artifact_visual_proof
                    references: visual_proof(id)
              - column:
                  name: stage
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: custom_type
                  type: VARCHAR(120)
              - column:
                  name: asset_plan
                  type: LONGTEXT
              - column:
                  name: asset_url
                  type: VARCHAR(512)
              - column:
                  name: message
                  type: LONGTEXT
              - column:
                  name: delivery_notes
                  type: LONGTEXT
              - column:
                  name: prompt
                  type: LONGTEXT
              - column:
                  name: model
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_proof_artifact_hypothesis
            tableName: proof_artifact
            columns:
              - column:
                  name: hypothesis_id
        - createIndex:
            indexName: idx_proof_artifact_experiment
            tableName: proof_artifact
            columns:
              - column:
                  name: experiment_id
        - createIndex:
            indexName: idx_proof_artifact_stage
            tableName: proof_artifact
            columns:
              - column:
                  name: stage
