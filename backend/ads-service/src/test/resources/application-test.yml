spring:
  datasource:
    # Cada contexto possui schema próprio, inclusive quando outro contexto sai do cache Spring.
    url: jdbc:h2:mem:ads-test-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false

lead-portal:
  worker:
    processing-guard:
      enabled: false
