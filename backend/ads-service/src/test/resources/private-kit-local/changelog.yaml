              CREATE TABLE learning_sales_cycle_v1 (
                id BIGINT NOT NULL AUTO_INCREMENT PRIMARY KEY, product_id BIGINT NOT NULL,
                chain_definition_id BIGINT NOT NULL, chain_code VARCHAR(100) NOT NULL,
                process_definition_id BIGINT NOT NULL, experiment_id BIGINT NOT NULL,
                previous_cycle_id BIGINT NULL, request_key VARCHAR(36) NOT NULL,
                creation_json LONGTEXT NOT NULL, brief_json LONGTEXT NOT NULL, inherited_learning_json LONGTEXT NOT NULL,
                stage VARCHAR(32) NOT NULL, status VARCHAR(32) NOT NULL, product_version VARCHAR(160) NOT NULL,
                budget_limit_brl DECIMAL(12,2) NOT NULL, window_start DATETIME(6) NULL, window_end DATETIME(6) NULL,
                return_process_id BIGINT NULL, return_activity_id VARCHAR(100) NULL, current_instance_id BIGINT NULL,
                open_slot INT NULL, revision BIGINT NOT NULL, baseline TINYINT(1) NOT NULL,
                created_at DATETIME(6) NOT NULL, updated_at DATETIME(6) NOT NULL,
                version_changed_at DATETIME(6) NOT NULL, closed_at DATETIME(6) NULL
              );
