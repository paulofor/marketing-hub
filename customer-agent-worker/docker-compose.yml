services:
  customer-agent-worker:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal}
      CUSTOMER_AGENT_MODEL: ${CUSTOMER_AGENT_MODEL:-gpt-5.6-sol}
      CUSTOMER_AGENT_EVALUATION_TIMEOUT_MINUTES: ${CUSTOMER_AGENT_EVALUATION_TIMEOUT_MINUTES:-40}
      CUSTOMER_AGENT_MODEL_TIMEOUT: ${CUSTOMER_AGENT_MODEL_TIMEOUT:-PT40M}
      CUSTOMER_AGENT_POLL_MS: ${CUSTOMER_AGENT_POLL_MS:-60000}
      CUSTOMER_AGENT_OBSERVATION_POLL_MS: ${CUSTOMER_AGENT_OBSERVATION_POLL_MS:-60000}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CUSTOMER_AGENT_MCP_URL: ${CUSTOMER_AGENT_MCP_URL:-http://host.docker.internal}
      LOG_FILE_NAME: /tmp/customer-agent-worker.log
      AGENT_HEALTH_KEY: customer-agent
      AGENT_HEALTH_VERSION: "1"
      AGENT_BUILD_REFERENCE: ${AGENT_BUILD_REFERENCE:-local}
    ports:
      - "${CUSTOMER_AGENT_WORKER_PORT:-8099}:8099"
    volumes:
      - ${CUSTOMER_AGENT_CODEX_HOME:?Defina a sessão Codex compartilhada dos agentes}:/home/operator/.codex
      - ${MARKETING_HUB_REPOSITORY:-..}:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/agent-health-report.mjs"]
      interval: 5m
      timeout: 20s
      retries: 2
      start_period: 30s
