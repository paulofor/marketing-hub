services:
  agent-executor-admin-controller:
    image: ${AGENT_EXECUTOR_ADMIN_IMAGE:-marketing-hub/agent-executor-admin-controller:local}
    build:
      context: ../..
      dockerfile: deploy/agent-executor-admin-controller/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://191.252.181.168
      MARKETING_HUB_REPOSITORY: /opt/marketing-hub/repo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/marketing-hub/repo:/opt/marketing-hub/repo
