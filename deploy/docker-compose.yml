version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE:-marketinghub-backend}:latest
    container_name: marketinghub-backend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./volumes/backend/uploads:/app/uploads
      - ./volumes/backend/logs:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-marketinghub-frontend}:latest
    container_name: marketinghub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  video-management:
    image: ${VIDEO_MGMT_IMAGE:-marketinghub-video-management}:latest
    container_name: marketinghub-video-management
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VIDEO_BACKEND_BASE_URL: ${VIDEO_BACKEND_BASE_URL:-http://backend:8000}
      VIDEO_AUTH_TOKEN: ${VIDEO_AUTH_TOKEN:-}
      VIDEO_JOBS_POLLING_ENABLED: ${VIDEO_JOBS_POLLING_ENABLED:-false}
      VIDEO_JOBS_POLL_INTERVAL: ${VIDEO_JOBS_POLL_INTERVAL:-PT30S}
      VIDEO_JOBS_BATCH_SIZE: ${VIDEO_JOBS_BATCH_SIZE:-10}
      TZ: America/Sao_Paulo
    ports:
      - "${VIDEO_MANAGEMENT_PORT:-8095}:8095"
