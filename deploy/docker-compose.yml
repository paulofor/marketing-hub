version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE:-marketinghub-backend}:latest
    container_name: marketinghub-backend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./volumes/backend/uploads:/app/uploads
      - ./volumes/backend/logs:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-marketinghub-frontend}:latest
    container_name: marketinghub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  video-management:
    image: ${VIDEO_MGMT_IMAGE:-marketinghub-video-management}:latest
    container_name: marketinghub-video-management
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VIDEO_BACKEND_BASE_URL: ${VIDEO_BACKEND_BASE_URL:-http://backend:8000}
      VIDEO_AUTH_TOKEN: ${VIDEO_AUTH_TOKEN:-}
      VIDEO_JOBS_POLLING_ENABLED: ${VIDEO_JOBS_POLLING_ENABLED:-false}
      VIDEO_JOBS_POLL_INTERVAL: ${VIDEO_JOBS_POLL_INTERVAL:-PT30S}
      VIDEO_JOBS_BATCH_SIZE: ${VIDEO_JOBS_BATCH_SIZE:-10}
      TZ: America/Sao_Paulo
    ports:
      - "${VIDEO_MANAGEMENT_PORT:-8095}:8095"

  mcp-server:
    image: ${MCP_SERVER_IMAGE:-marketinghub-mcp-server}:latest
    container_name: marketinghub-mcp-server
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-marketing_hub_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASS:-}}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-marketing-hub-mcp}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-1.0.0}
      TZ: America/Sao_Paulo
    ports:
      - "${MCP_SERVER_PORT:-8096}:8096"
