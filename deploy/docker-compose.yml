version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE:-marketinghub-backend}:latest
    container_name: marketinghub-backend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./volumes/backend/uploads:/app/uploads
      - ./volumes/backend/logs:/app/logs

  frontend:
    image: ${FRONTEND_IMAGE:-marketinghub-frontend}:latest
    container_name: marketinghub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
