version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE:-marketinghub-backend}:${BACKEND_IMAGE_TAG:-2026.04.15}
    container_name: marketinghub-backend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=60 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/backend-oom.hprof}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      HARNESS_LIBRARY_INTERNAL_SIGNING_KEY_FILE: ${HARNESS_LIBRARY_INTERNAL_SIGNING_KEY_FILE:-/run/secrets/harness_library_internal_signing_key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MOIS_SALES_PAGE_BACKFILL_ENABLED: ${MOIS_SALES_PAGE_BACKFILL_ENABLED:-false}
      LEAD_PORTAL_PAYMENTS_AUTH_TOKEN: ${LEAD_PORTAL_PAYMENTS_AUTH_TOKEN:?LEAD_PORTAL_PAYMENTS_AUTH_TOKEN is required}
      CUSTOMER_AGENT_MEMORY_BUCKET: ${CUSTOMER_AGENT_MEMORY_BUCKET:-}
      CUSTOMER_AGENT_MEMORY_REGION: ${CUSTOMER_AGENT_MEMORY_REGION:-us-east-1}
      CUSTOMER_AGENT_MEMORY_ENDPOINT: ${CUSTOMER_AGENT_MEMORY_ENDPOINT:-}
      CUSTOMER_AGENT_MEMORY_PREFIX: ${CUSTOMER_AGENT_MEMORY_PREFIX:-customer-agent-memory/v1}
      CUSTOMER_AGENT_MEMORY_RETENTION_DAYS: ${CUSTOMER_AGENT_MEMORY_RETENTION_DAYS:-365}
      COMMERCE_SUPPLIER_DISPLAY_NAME: ${COMMERCE_SUPPLIER_DISPLAY_NAME:-Digicom Digital}
      COMMERCE_SUPPLIER_REGISTRATION_NUMBER: ${COMMERCE_SUPPLIER_REGISTRATION_NUMBER:-25.215.414/0001-69}
      COMMERCE_SUPPLIER_SUPPORT_EMAIL: ${COMMERCE_SUPPLIER_SUPPORT_EMAIL:-contato@digicomdigital.com.br}
      EXPERIMENT_STRATEGIST_MEMORY_BUCKET: ${EXPERIMENT_STRATEGIST_MEMORY_BUCKET:-}
      EXPERIMENT_STRATEGIST_MEMORY_REGION: ${EXPERIMENT_STRATEGIST_MEMORY_REGION:-us-east-1}
      EXPERIMENT_STRATEGIST_MEMORY_ENDPOINT: ${EXPERIMENT_STRATEGIST_MEMORY_ENDPOINT:-}
      EXPERIMENT_STRATEGIST_MEMORY_PREFIX: ${EXPERIMENT_STRATEGIST_MEMORY_PREFIX:-experiment-strategist-memory/v1}
      EXPERIMENT_STRATEGIST_MEMORY_RETENTION_DAYS: ${EXPERIMENT_STRATEGIST_MEMORY_RETENTION_DAYS:-365}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${CUSTOMER_AGENT_MEMORY_REGION:-us-east-1}
    ports:
      - "80:8000"
      - "8000:8000"
    volumes:
      - ./volumes/backend/uploads:/app/uploads
      - ./volumes/backend/logs:/app/logs
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
      - ${HARNESS_LIBRARY_INTERNAL_SIGNING_KEY_HOST_FILE:-/root/infra/harness-library/secrets/internal_signing_key}:/run/secrets/harness_library_internal_signing_key:ro

  backend-log-reader:
    image: nginx:1.27-alpine
    container_name: marketinghub-backend-log-reader
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./nginx/backend-logs/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/backend/logs:/var/log/marketinghub/backend:ro

  frontend:
    image: ${FRONTEND_IMAGE:-marketinghub-frontend}:${FRONTEND_IMAGE_TAG:-2026.04.15}
    container_name: marketinghub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  video-management:
    image: ${VIDEO_MGMT_IMAGE:-marketinghub-video-management}:${VIDEO_MGMT_IMAGE_TAG:-2026.04.15}
    container_name: marketinghub-video-management
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VIDEO_BACKEND_BASE_URL: ${VIDEO_BACKEND_BASE_URL:-http://backend:8000}
      BACKEND_URL: ${VIDEO_BACKEND_BASE_URL:-http://backend:8000}
      AGENT_HEALTH_KEY: videomaker
      MARKETING_HUB_REPOSITORY: /app
      CODEX_HOME: /root/.codex
      VIDEO_AUTH_TOKEN: ${VIDEO_AUTH_TOKEN:-}
      VIDEO_JOBS_POLLING_ENABLED: ${VIDEO_JOBS_POLLING_ENABLED:-true}
      VIDEO_JOBS_POLL_INTERVAL: ${VIDEO_JOBS_POLL_INTERVAL:-PT30S}
      VIDEO_JOBS_BATCH_SIZE: ${VIDEO_JOBS_BATCH_SIZE:-10}
      VIDEO_REFERENCE_ANALYSIS_ENABLED: ${VIDEO_REFERENCE_ANALYSIS_ENABLED:-true}
      VIDEO_REFERENCE_ANALYSIS_POLL_INTERVAL: ${VIDEO_REFERENCE_ANALYSIS_POLL_INTERVAL:-PT30S}
      VIDEO_REFERENCE_ANALYSIS_MODEL: ${VIDEO_REFERENCE_ANALYSIS_MODEL:-gpt-5.6}
      VIDEO_REFERENCE_ANALYSIS_MAX_OUTPUT_TOKENS: ${VIDEO_REFERENCE_ANALYSIS_MAX_OUTPUT_TOKENS:-4000}
      VIDEO_REFERENCE_ANALYSIS_BUDGET_LIMIT_USD: ${VIDEO_REFERENCE_ANALYSIS_BUDGET_LIMIT_USD:-0.75}
      VIDEO_REFERENCE_ANALYSIS_RESERVATION_USD: ${VIDEO_REFERENCE_ANALYSIS_RESERVATION_USD:-0.25}
      VIDEO_REFERENCE_ANALYSIS_INPUT_PRICE_PER_MILLION_USD: ${VIDEO_REFERENCE_ANALYSIS_INPUT_PRICE_PER_MILLION_USD:-4.00}
      VIDEO_REFERENCE_ANALYSIS_OUTPUT_PRICE_PER_MILLION_USD: ${VIDEO_REFERENCE_ANALYSIS_OUTPUT_PRICE_PER_MILLION_USD:-20.00}
      VIDEO_PDE_AUDIOVISUAL_ENABLED: ${VIDEO_PDE_AUDIOVISUAL_ENABLED:-true}
      VIDEO_PROVIDERS_VEO_ENABLED: ${VIDEO_PROVIDERS_VEO_ENABLED:-true}
      VIDEO_PROVIDERS_LUMA_ENABLED: ${VIDEO_PROVIDERS_LUMA_ENABLED:-true}
      VIDEO_PROVIDERS_LUMA_OPENAI_REFERENCE_IMAGE_ENABLED: ${VIDEO_PROVIDERS_LUMA_OPENAI_REFERENCE_IMAGE_ENABLED:-true}
      VIDEO_PROVIDERS_KLING_ENABLED: ${VIDEO_PROVIDERS_KLING_ENABLED:-true}
      VIDEO_PROVIDERS_RUNWAY_ENABLED: ${VIDEO_PROVIDERS_RUNWAY_ENABLED:-true}
      VIDEO_PROVIDERS_HEYGEN_ENABLED: ${VIDEO_PROVIDERS_HEYGEN_ENABLED:-true}
      VIDEO_PROVIDERS_POST_PRODUCTION_ENABLED: ${VIDEO_PROVIDERS_POST_PRODUCTION_ENABLED:-true}
      VIDEO_PROVIDERS_POST_PRODUCTION_OPENAI_TTS_ENABLED: ${VIDEO_PROVIDERS_POST_PRODUCTION_OPENAI_TTS_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-5.6}
      OPENAI_IMAGE_TOOL_MODEL: ${OPENAI_IMAGE_TOOL_MODEL:-gpt-image-2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts-2025-12-15}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-marin}
      GEMINI_API_KEY_FILE: ${GEMINI_API_KEY_FILE:-/run/secrets/gemini_api_key}
      LUMA_API_KEY_FILE: ${LUMA_API_KEY_FILE:-/run/secrets/luma_api_key}
      KLING_API_KEY_FILE: ${KLING_API_KEY_FILE:-/run/secrets/kling_api_key}
      HEYGEN_API_KEY_FILE: ${HEYGEN_API_KEY_FILE:-/run/secrets/heygen_api_key}
      RUNWAY_API_KEY_FILE: ${RUNWAY_API_KEY_FILE:-/run/secrets/runway_api_key}
      VIDEO_PROVIDERS_HEYGEN_AVATAR_ID: ${VIDEO_PROVIDERS_HEYGEN_AVATAR_ID:-}
      VIDEO_PROVIDERS_HEYGEN_VOICE_ID: ${VIDEO_PROVIDERS_HEYGEN_VOICE_ID:-}
      VIDEO_PROVIDERS_VEO_MODEL: ${VIDEO_PROVIDERS_VEO_MODEL:-veo-3.1-generate-preview}
      VIDEO_PROVIDERS_KLING_MODEL: ${VIDEO_PROVIDERS_KLING_MODEL:-kling-v2-1-master}
      VIDEO_PROVIDERS_RUNWAY_MODEL: ${VIDEO_PROVIDERS_RUNWAY_MODEL:-gen4.5}
      LOGGING_FILE_NAME: ${VIDEO_MANAGEMENT_LOG_FILE:-/app/logs/video-management-service.log}
      TZ: America/Sao_Paulo
    ports:
      - "${VIDEO_MANAGEMENT_PORT:-8095}:8095"
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
      - ${GEMINI_API_KEY_HOST_FILE:-/root/infra/gemini-token/gemini_api_key}:/run/secrets/gemini_api_key:ro
      - ${LUMA_API_KEY_HOST_FILE:-/root/infra/luma-token/luma_api_key}:/run/secrets/luma_api_key:ro
      - ${KLING_API_KEY_HOST_FILE:-/root/infra/kling-token/kling_api_key}:/run/secrets/kling_api_key:ro
      - ${HEYGEN_API_KEY_HOST_FILE:-/root/infra/heygen-token/heygen_api_key}:/run/secrets/heygen_api_key:ro
      - ${RUNWAY_API_KEY_HOST_FILE:-/root/infra/runaway-token/runaway_api_key}:/run/secrets/runway_api_key:ro
      - ${APOLLO_CODEX_HOME_HOST_DIR:-/root/infra/apollo-codex-home}:/root/.codex
      - ./volumes/video-management/logs:/app/logs

  oprm-worker:
    image: ${OPRM_IMAGE:-marketinghub-oprm}:${OPRM_IMAGE_TAG:-2026.04.15}
    container_name: marketinghub-oprm
    restart: on-failure:5
    environment:
      SPRING_PROFILES_ACTIVE: ${OPRM_SPRING_PROFILE:-default}
      OPRM_BACKEND_BASE_URL: ${OPRM_BACKEND_BASE_URL:-http://191.252.181.168:8000}
      OPRM_JOBS_POLLING_ENABLED: ${OPRM_JOBS_POLLING_ENABLED:-false}
      OPRM_JOBS_POLL_INTERVAL: ${OPRM_JOBS_POLL_INTERVAL:-PT5M}
      TZ: America/Sao_Paulo
    ports:
      - "${OPRM_PORT:-8093}:8093"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  mois:
    image: ${MOIS_IMAGE:-marketinghub-mois}:${MOIS_IMAGE_TAG:-2026.04.23}
    container_name: marketinghub-mois
    restart: unless-stopped
    environment:
      MOIS_PORT: ${MOIS_PORT:-8094}
      MOIS_PUBLIC_BASE_URL: ${MOIS_PUBLIC_BASE_URL:-http://177.153.62.107:8094}
      TZ: America/Sao_Paulo
    ports:
      - "${MOIS_PUBLIC_BIND_IP:-177.153.62.107}:${MOIS_PORT:-8094}:8094"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mcp-server:
    image: ${MCP_SERVER_IMAGE:-marketinghub-mcp-server}:${MCP_SERVER_IMAGE_TAG:-2026.04.15}
    container_name: marketinghub-mcp-server
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: marketing_hub_user
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASS}
      MCP_PDE_DATASOURCE_URL: ${MCP_PDE_DATASOURCE_URL:-${PDE_ACCESS_JDBC_URL:-}}
      MCP_PDE_DATASOURCE_USERNAME: ${MCP_PDE_DATASOURCE_USERNAME:-${PDE_ACCESS_JDBC_USERNAME:-}}
      MCP_PDE_DATASOURCE_PASSWORD: ${MCP_PDE_DATASOURCE_PASSWORD:-${PDE_ACCESS_JDBC_PASSWORD:-}}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-marketing-hub-mcp}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-1.0.0}
      MCP_LOG_PDE_PLATFORM_BACKEND_PATH: ${MCP_LOG_PDE_PLATFORM_BACKEND_PATH:-http://163.245.200.7:8096/actuator/logfile}
      MCP_LOG_VIDEO_MANAGEMENT_SERVICE_PATH: ${MCP_LOG_VIDEO_MANAGEMENT_SERVICE_PATH:-http://177.153.62.107:8095/actuator/logfile}
      MCP_LOG_CUSTOMER_AGENT_WORKER_PATH: ${MCP_LOG_CUSTOMER_AGENT_WORKER_PATH:-http://163.245.202.80:8099/ops-customer-agent-observability-v1/customer-agent-worker-log}
      MCP_LOG_FINANCIAL_AGENT_WORKER_PATH: ${MCP_LOG_FINANCIAL_AGENT_WORKER_PATH:-http://163.245.202.80:8095/ops-financial-agent-observability-v1/financial-agent-worker-log}
      MCP_LOG_EXPERIMENT_STRATEGIST_WORKER_PATH: ${MCP_LOG_EXPERIMENT_STRATEGIST_WORKER_PATH:-http://163.245.202.80:8096/ops-experiment-strategist-observability-v1/logfile}
      MCP_LOG_PRODUCT_DISCOVERY_WORKER_PATH: ${MCP_LOG_PRODUCT_DISCOVERY_WORKER_PATH:-http://163.245.202.80:18081/ops-product-discovery-observability-v1/logfile}
      MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_URL: ${MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_URL:-http://163.245.202.80:18081/healthz}
      MCP_LOG_GROWTH_OPERATOR_WORKER_PATH: ${MCP_LOG_GROWTH_OPERATOR_WORKER_PATH:-http://163.245.202.80:8094/ops-growth-operator-observability-v1/logfile}
      MCP_GROWTH_OPERATOR_WORKER_HEALTH_URL: ${MCP_GROWTH_OPERATOR_WORKER_HEALTH_URL:-http://163.245.202.80:8094/ops-growth-operator-observability-v1/health}
      MCP_LOG_COMMUNICATION_AGENT_WORKER_PATH: ${MCP_LOG_COMMUNICATION_AGENT_WORKER_PATH:-http://163.245.202.80:8101/ops-communication-agent-observability-v1/logfile}
      MCP_CHAT_LOG_ALLOWED_CONTAINERS: ${MCP_CHAT_LOG_ALLOWED_CONTAINERS:-marketinghub-fashion-chat}
      MCP_VPS_HOST_INVENTORY_ENABLED: ${MCP_VPS_HOST_INVENTORY_ENABLED:-true}
      MCP_VPS_HOST_INVENTORY_ALLOWED_HOSTS: ${MCP_VPS_HOST_INVENTORY_ALLOWED_HOSTS:-191.252.210.83,191.252.120.96,191.252.181.168,191.252.102.54,177.153.62.107,163.245.200.7,163.245.202.80}
      MCP_VPS_HOST_INVENTORY_USER: ${MCP_VPS_HOST_INVENTORY_USER:-root}
      MCP_VPS_HOST_INVENTORY_IDENTITY_FILE: ${MCP_VPS_HOST_INVENTORY_IDENTITY_FILE:-/opt/marketinghub/mcp/ssh/id_ed25519}
      MCP_VPS_HOST_INVENTORY_KNOWN_HOSTS_FILE: ${MCP_VPS_HOST_INVENTORY_KNOWN_HOSTS_FILE:-/opt/marketinghub/mcp/ssh/known_hosts}
      TZ: America/Sao_Paulo
    ports:
      - "${MCP_SERVER_PORT:-8096}:8096"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/marketinghub/mcp/ssh:/opt/marketinghub/mcp/ssh:ro

  mcp-nginx:
    image: nginx:1.27-alpine
    container_name: marketinghub-mcp-nginx
    restart: unless-stopped
    depends_on:
      - mcp-server
    ports:
      - "${MCP_NGINX_HTTP_PORT:-80}:80"
      - "${MCP_NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/mcp/${MCP_NGINX_CONF:-default.http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/mcp/certbot/www:/var/www/certbot:ro
      - ./volumes/mcp/certbot/conf:/etc/letsencrypt:ro
