services:
  pde-rigel-creative-capture:
    build:
      context: ./frontend
      dockerfile: Dockerfile.assisted-service-e2e
    environment:
      PDE_ASSISTED_FRONTEND_URL: http://pde-platform-frontend-kit-validation
      RIGEL_CREATIVE_EVIDENCE_DIR: /evidence/proof
    depends_on:
      pde-platform-backend-kit-validation:
        condition: service_healthy
      pde-platform-frontend-kit-validation:
        condition: service_healthy
    volumes:
      - ../deploy/local-validation/rigel-creative-production-v6/evidence:/evidence
    command:
      - npx
      - playwright
      - test
      - tests/rigel-creative-proof.spec.ts
      - --config=playwright.rigel-creative-proof.config.ts
      - --reporter=line
