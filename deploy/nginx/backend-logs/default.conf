server {
    listen 8099;
    server_name _;

    location = /ops-mh-observability-v2/backend-log-stream-x9k {
        alias /var/log/marketinghub/backend/marketinghub-backend.log;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
