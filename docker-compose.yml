version: '3.9'
services:
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    image: marketinghub/ai-worker:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-marketing_hub_user}
      MYSQL_PASS: ${MYSQL_PASS:-Ab9!rG4wX8_tMq2Bz7#HpK5V}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-o3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_SEARCH_ID: ${GOOGLE_SEARCH_ID:-}
    ports:
      - "4567:4567"
    volumes:
      - /etc/openai/chave:/run/secrets/openai_api_key:ro

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    image: marketinghub/email-service:latest
    restart: unless-stopped
    # Permite que o container resolva serviços que estão rodando no host
    # (ex.: marketinghub-backend rodando via systemd ou em outro compose).
    extra_hosts:
      - "marketinghub-backend:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-marketing_hub_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASS:-Ab9!rG4wX8_tMq2Bz7#HpK5V}}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.hostinger.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-imagens@oportunidadebrasil.shop}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-Russo007&}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE:-true}
      MARKETING_HUB_BASE_URL: ${MARKETING_HUB_BASE_URL:-http://marketinghub-backend:8000}
      MARKETING_HUB_TEMPLATES_PATH: ${MARKETING_HUB_TEMPLATES_PATH:-/api/v1/email-templates}
      MARKETING_HUB_AUTH_TOKEN: ${MARKETING_HUB_AUTH_TOKEN:-}
      CLOUDFLARE_BASE_URL: ${CLOUDFLARE_BASE_URL:-https://api.cloudflare.com/client/v4}
      CLOUDFLARE_DELIVERY_BASE_URL: ${CLOUDFLARE_DELIVERY_BASE_URL:-https://imagedelivery.net}
      CLOUDFLARE_DELIVERY_HASH: ${CLOUDFLARE_DELIVERY_HASH:-}
      CLOUDFLARE_DEFAULT_VARIANT: ${CLOUDFLARE_DEFAULT_VARIANT:-public}
      CLOUDFLARE_AUTH_TOKEN: ${CLOUDFLARE_AUTH_TOKEN:-}
      EMAIL_SERVICE_FROM_ADDRESS: ${EMAIL_SERVICE_FROM_ADDRESS:-imagens@oportunidadebrasil.shop}
      EMAIL_SERVICE_DRY_RUN: ${EMAIL_SERVICE_DRY_RUN:-false}
      EMAIL_TRACKING_BASE_URL: ${EMAIL_TRACKING_BASE_URL:-http://191.252.92.222:8000/api/v1/tracking/pixel}
    ports:
      - "8086:8080"

  lead-portal-payments-service:
    build:
      context: ./lead-portal-payments-service
      dockerfile: Dockerfile
    image: marketinghub/lead-portal-payments-service:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${PAYMENTS_DATASOURCE_URL:-jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${PAYMENTS_DATASOURCE_USERNAME:-marketing_hub_user}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENTS_DATASOURCE_PASSWORD:-Ab9!rG4wX8_tMq2Bz7#HpK5V}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-APP_USR-6371948622467215-020511-5317ef62bbd997d52c2979a29f2c8419-133771061}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-http://host.docker.internal:8092/api/v1/mercadopago/webhook}
      MERCADO_PAGO_SUCCESS_URL: ${MERCADO_PAGO_SUCCESS_URL:-}
      MERCADO_PAGO_FAILURE_URL: ${MERCADO_PAGO_FAILURE_URL:-}
      MERCADO_PAGO_PENDING_URL: ${MERCADO_PAGO_PENDING_URL:-}
      LEAD_PORTAL_STORAGE_BUCKET: ${LEAD_PORTAL_STORAGE_BUCKET:-leadportal}
      LEAD_PORTAL_STORAGE_ENDPOINT: ${LEAD_PORTAL_STORAGE_ENDPOINT:-}
      LEAD_PORTAL_STORAGE_ACCESS_KEY_ID: ${LEAD_PORTAL_STORAGE_ACCESS_KEY_ID:-}
      LEAD_PORTAL_STORAGE_SECRET_ACCESS_KEY: ${LEAD_PORTAL_STORAGE_SECRET_ACCESS_KEY:-}
      LEAD_PORTAL_STORAGE_REGION: ${LEAD_PORTAL_STORAGE_REGION:-auto}
      LEAD_PORTAL_STORAGE_PUBLIC_BASE_URL: ${LEAD_PORTAL_STORAGE_PUBLIC_BASE_URL:-}
      LEAD_PORTAL_ORIGINALS_PREFIX: ${LEAD_PORTAL_ORIGINALS_PREFIX:-originals}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-imagens@oportunidadebrasil.shop}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.hostinger.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-imagens@oportunidadebrasil.shop}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-Russo007&}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE:-true}
      PAYMENTS_DEFAULT_AMOUNT: ${PAYMENTS_DEFAULT_AMOUNT:-49.90}
      PAYMENTS_DEFAULT_CURRENCY: ${PAYMENTS_DEFAULT_CURRENCY:-BRL}
      DELIVERY_ENABLED: ${DELIVERY_ENABLED:-true}
      DELIVERY_BATCH_SIZE: ${DELIVERY_BATCH_SIZE:-3}
      DELIVERY_INITIAL_DELAY: ${DELIVERY_INITIAL_DELAY:-20000}
      DELIVERY_FIXED_DELAY: ${DELIVERY_FIXED_DELAY:-60000}
    ports:
      - "8092:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
