openapi: 3.0.3
info:
  title: Marketing Hub Backend - GeraLanding wireframe interno
  version: v1
  description: |
    Contrato canônico dos endpoints HTTP internos do backend `ads-service` para a fila da etapa
    `landing-page-wireframe` do GeraLanding.

    Fonte de verdade revisada em código:
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/wireframe/web/BackendWireframeController.java`

    Este Swagger mantém somente os endpoints internos necessários para o Worker AI consumir jobs
    pendentes de wireframe, informar o prompt enviado para IA e, em seguida, informar a resposta recebida da IA.
servers:
  - url: http://191.252.181.168
    description: Backend principal para acessos executados pelo Codex
  - url: http://191.252.181.168:8000
    description: Backend principal documentado para operação externa
tags:
  - name: landing-page-wireframe
    description: Etapa de geração do wireframe da landing.
paths:
  /api/internal/geralanding/wireframe/stage-executions/pending:
    get:
      tags:
        - landing-page-wireframe
      summary: Lista jobs pendentes internos da etapa landing-page-wireframe.
      description: Retorna jobs de wireframe com status INICIADO, independente de experimento, para processamento pelo Worker AI.
      operationId: pendingGeraLandingWireframeExecutions
      responses:
        '200':
          description: Lista de jobs pendentes da etapa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingStageExecution'
  /api/internal/geralanding/wireframe/stage-executions/{idJob}/recebe-prompt:
    post:
      tags:
        - landing-page-wireframe
      summary: Recebe o prompt interno enviado para IA no job de wireframe.
      description: Endpoint para o Worker AI informar o prompt enviado para IA e o identificador do job aberto na OpenAI, preservando rastreabilidade do envio.
      operationId: recebePromptGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecebePromptRequest'
      responses:
        '202':
          description: Prompt aceito para rastreabilidade do envio à IA.
  /api/internal/geralanding/wireframe/stage-executions/{idJob}/recebe-resposta:
    post:
      tags:
        - landing-page-wireframe
      summary: Recebe a resposta interna retornada pela IA no job de wireframe.
      description: Endpoint para o Worker AI informar sucesso ou falha da IA; o backend persiste métricas, artefato em sucesso e erro operacional em falha.
      operationId: recebeRespostaGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecebeRespostaRequest'
      responses:
        '202':
          description: Resposta aceita e execução concluída ou marcada como falha.
components:
  parameters:
    IdJob:
      name: idJob
      in: path
      required: true
      description: Identificador textual do job da execução da etapa.
      schema:
        type: string
        minLength: 1
  schemas:
    RecebePromptRequest:
      type: object
      additionalProperties: false
      description: Payload do prompt enviado para IA pelo Worker AI.
      properties:
        prompt:
          type: string
          minLength: 1
          description: Prompt final enviado ao provedor de IA.
        jobidopenai:
          type: string
          minLength: 1
          description: Identificador do job aberto na OpenAI para rastreabilidade.
      required:
        - prompt
        - jobidopenai
    RecebeRespostaRequest:
      type: object
      description: Payload de retorno da IA pelo Worker AI para sucesso ou falha da etapa wireframe.
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
          description: ID do experimento associado à execução.
        stageCode:
          type: string
          minLength: 1
          description: Código canônico da etapa.
        modelResponse:
          type: string
          nullable: true
          description: Resposta retornada pelo modelo quando a execução teve sucesso.
        inputTokens:
          type: integer
          format: int32
          nullable: true
          description: Tokens de entrada reportados pelo provedor.
        outputTokens:
          type: integer
          format: int32
          nullable: true
          description: Tokens de saída reportados pelo provedor.
        costUsd:
          type: number
          format: double
          nullable: true
          description: Custo estimado da execução em dólar.
        openAiJobId:
          type: string
          nullable: true
          description: Identificador do job no provedor OpenAI.
        errorMessage:
          type: string
          nullable: true
          description: Mensagem operacional da falha quando a etapa não conclui.
        errorDetail:
          type: string
          nullable: true
          description: Detalhe técnico da falha quando disponível.
      required:
        - experimentId
        - stageCode
    PendingStageExecution:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        jobid:
          type: string
          description: Identificador do job pendente na etapa wireframe.
        stageCode:
          type: string
        experiment:
          $ref: '#/components/schemas/PendingStageExperiment'
        hypothesis:
          $ref: '#/components/schemas/PendingStageHypothesis'
      required:
        - experimentId
        - jobid
        - stageCode
        - experiment
        - hypothesis
    PendingStageExperiment:
      type: object
      additionalProperties: false
      description: Dados do experimento associados ao job pendente de wireframe.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        hypothesis:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
        creativeTextPrompt:
          type: string
          nullable: true
        creativeImagePrompt:
          type: string
          nullable: true
        campaignAngle:
          $ref: '#/components/schemas/JsonBackedArtifact'
        adCopy:
          $ref: '#/components/schemas/JsonBackedArtifact'
        adImageBriefing:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageCopy:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageWireframe:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageImagePlanning:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageDesignPreset:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageDeliverables:
          $ref: '#/components/schemas/JsonBackedArtifact'
        htmlGeraLanding:
          type: string
          nullable: true
      required:
        - id
    JsonBackedArtifact:
      description: Artefato persistido em coluna textual, mas exposto como JSON estruturado quando o conteúdo armazenado for JSON válido; texto bruto só é aceito para conteúdo realmente textual ou fallback de diagnóstico.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
    PendingStageHypothesis:
      type: object
      additionalProperties: false
      description: Hipótese e framework canônico associados ao job pendente de wireframe.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
        framework:
          $ref: '#/components/schemas/PendingStageHypothesisFramework'
      required:
        - framework
    PendingStageHypothesisFramework:
      type: object
      additionalProperties: true
      description: Framework Dor → Resultado → Mecanismo → Prova → Oferta da hipótese.
      properties:
        version:
          type: string
          nullable: true
        pain:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        mechanism:
          type: object
          additionalProperties: true
        proof:
          type: object
          additionalProperties: true
        offer:
          type: object
          additionalProperties: true
        checklist:
          type: object
          additionalProperties: true
      required:
        - pain
        - result
        - mechanism
        - proof
        - offer
        - checklist
