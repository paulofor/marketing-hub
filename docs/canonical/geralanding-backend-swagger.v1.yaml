openapi: 3.0.3
info:
  title: Marketing Hub Backend - GeraLanding wireframe
  version: v1.1.0
  description: |
    Contrato canônico dos endpoints HTTP do backend `ads-service` para a etapa
    `landing-page-wireframe` do GeraLanding.

    Fonte de verdade revisada em código:
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/wireframe/web/BackendWireframeController.java`

    Este Swagger documenta os endpoints públicos da tela de experimento para acionar/consultar
    a etapa wireframe e os endpoints internos necessários para o Worker AI consumir jobs
    pendentes de wireframe, informar o prompt enviado para IA e, em seguida, informar a resposta recebida da IA.
servers:
  - url: http://191.252.181.168
    description: Backend principal para acessos executados pelo Codex
  - url: http://191.252.181.168:8000
    description: Backend principal documentado para operação externa
tags:
  - name: landing-page-wireframe
    description: Etapa de geração do wireframe da landing.
  - name: landing-page-wireframe-internal
    description: Endpoints internos da fila da etapa wireframe consumidos pelo Worker AI.
paths:
  /api/experiments/{experimentId}/geralanding/wireframe/start:
    post:
      tags:
        - landing-page-wireframe
      summary: Inicia manualmente uma execução da etapa landing-page-wireframe.
      description: Registra uma execução inicial da etapa para o experimento informado e retorna o job aceito para processamento assíncrono.
      operationId: startGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '202':
          description: Execução inicial registrada para processamento assíncrono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireframeStartResponse'
        '404':
          description: Experimento não encontrado.
  /api/experiments/{experimentId}/geralanding/wireframe/stage-executions:
    get:
      tags:
        - landing-page-wireframe
      summary: Lista execuções da etapa landing-page-wireframe de um experimento.
      description: Retorna até 20 execuções do experimento para a etapa wireframe, ordenadas da mais recente para a mais antiga.
      operationId: listGeraLandingWireframeExecutions
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - name: includeCompleted
          in: query
          required: false
          description: Quando false, omite execuções com status CONCLUIDO.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Lista de execuções da etapa wireframe.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WireframeStageExecutionSummary'
        '404':
          description: Experimento não encontrado.
  /api/experiments/{experimentId}/geralanding/wireframe/stage-executions/{idJob}:
    get:
      tags:
        - landing-page-wireframe
      summary: Detalha uma execução da etapa landing-page-wireframe.
      description: Retorna os dados operacionais, prompts, resposta, HTML provisório, erro e métricas de uma execução específica.
      operationId: detailGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdJob'
      responses:
        '200':
          description: Detalhe da execução solicitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireframeStageExecutionDetail'
        '404':
          description: Experimento ou execução não encontrada.
  /api/internal/geralanding/wireframe/stage-executions/pending:
    get:
      tags:
        - landing-page-wireframe-internal
      summary: Lista jobs pendentes internos da etapa landing-page-wireframe.
      description: Retorna jobs de wireframe com status INICIADO, independente de experimento, para processamento pelo Worker AI.
      operationId: pendingGeraLandingWireframeExecutions
      responses:
        '200':
          description: Lista de jobs pendentes da etapa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingStageExecution'
  /api/internal/geralanding/wireframe/stage-executions/{idJob}/recebe-prompt:
    post:
      tags:
        - landing-page-wireframe-internal
      summary: Recebe o prompt interno enviado para IA no job de wireframe.
      description: Endpoint para o Worker AI informar o prompt enviado para IA e o identificador do job aberto na OpenAI, preservando rastreabilidade do envio.
      operationId: recebePromptGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecebePromptRequest'
      responses:
        '202':
          description: Prompt aceito para rastreabilidade do envio à IA.
  /api/internal/geralanding/wireframe/stage-executions/{idJob}/recebe-resposta:
    post:
      tags:
        - landing-page-wireframe-internal
      summary: Recebe a resposta interna retornada pela IA no job de wireframe.
      description: Endpoint para o Worker AI informar sucesso ou falha da IA; o backend persiste métricas, artefato em sucesso e erro operacional em falha.
      operationId: recebeRespostaGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecebeRespostaRequest'
      responses:
        '202':
          description: Resposta aceita e execução concluída ou marcada como falha.
components:
  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      description: ID numérico interno do experimento.
      schema:
        type: integer
        format: int64
    IdJob:
      name: idJob
      in: path
      required: true
      description: Identificador textual do job da execução da etapa.
      schema:
        type: string
        minLength: 1
  schemas:
    WireframeStartResponse:
      type: object
      additionalProperties: false
      properties:
        idJob:
          type: string
          description: Identificador textual do job criado para a execução.
        status:
          type: string
          description: Status inicial da execução.
      required:
        - idJob
        - status
    WireframeStageExecutionSummary:
      type: object
      additionalProperties: false
      properties:
        idJob:
          type: string
          description: Identificador textual do job da execução.
        status:
          type: string
          description: Status atual da execução.
        executionRequestedAt:
          type: string
          format: date-time
          nullable: true
          description: Data/hora em que a execução foi solicitada.
        costUsd:
          type: number
          format: double
          nullable: true
          description: Custo estimado da execução em dólar, quando disponível.
    WireframeStageExecutionDetail:
      type: object
      additionalProperties: false
      properties:
        idJob:
          type: string
        experimentId:
          type: integer
          format: int64
        stageCode:
          type: string
          example: landing-page-wireframe
        executionRequestedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        promptTemplateId:
          type: string
          nullable: true
        promptContent:
          type: string
          nullable: true
        prompt:
          type: string
          nullable: true
        openAiRequestBody:
          type: string
          nullable: true
        openAiModel:
          type: string
          nullable: true
        schemaJson:
          type: string
          nullable: true
        promptMarkdownContent:
          type: string
          nullable: true
        status:
          type: string
        openAiJobId:
          type: string
          nullable: true
        modelResponse:
          type: string
          nullable: true
        provisionalHtml:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        errorDetail:
          type: string
          nullable: true
        inputTokens:
          type: integer
          format: int32
          nullable: true
        outputTokens:
          type: integer
          format: int32
          nullable: true
        costUsd:
          type: number
          format: double
          nullable: true
    RecebePromptRequest:
      type: object
      additionalProperties: false
      description: Payload do prompt enviado para IA pelo Worker AI.
      properties:
        prompt:
          type: string
          minLength: 1
          description: Prompt final enviado ao provedor de IA.
        jobidopenai:
          type: string
          minLength: 1
          description: Identificador do job aberto na OpenAI para rastreabilidade.
      required:
        - prompt
        - jobidopenai
    RecebeRespostaRequest:
      type: object
      description: Payload de retorno da IA pelo Worker AI para sucesso ou falha da etapa wireframe.
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
          description: ID do experimento associado à execução.
        stageCode:
          type: string
          minLength: 1
          description: Código canônico da etapa.
        modelResponse:
          type: string
          nullable: true
          description: Resposta retornada pelo modelo quando a execução teve sucesso.
        inputTokens:
          type: integer
          format: int32
          nullable: true
          description: Tokens de entrada reportados pelo provedor.
        outputTokens:
          type: integer
          format: int32
          nullable: true
          description: Tokens de saída reportados pelo provedor.
        costUsd:
          type: number
          format: double
          nullable: true
          description: Custo estimado da execução em dólar.
        openAiJobId:
          type: string
          nullable: true
          description: Identificador do job no provedor OpenAI.
        errorMessage:
          type: string
          nullable: true
          description: Mensagem operacional da falha quando a etapa não conclui.
        errorDetail:
          type: string
          nullable: true
          description: Detalhe técnico da falha quando disponível.
      required:
        - experimentId
        - stageCode
    PendingStageExecution:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        jobid:
          type: string
          description: Identificador do job pendente na etapa wireframe.
        stageCode:
          type: string
        experiment:
          $ref: '#/components/schemas/PendingStageExperiment'
        hypothesis:
          $ref: '#/components/schemas/PendingStageHypothesis'
      required:
        - experimentId
        - jobid
        - stageCode
        - experiment
        - hypothesis
    PendingStageExperiment:
      type: object
      additionalProperties: false
      description: Dados do experimento associados ao job pendente de wireframe.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        hypothesis:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
        creativeTextPrompt:
          type: string
          nullable: true
        creativeImagePrompt:
          type: string
          nullable: true
        campaignAngle:
          $ref: '#/components/schemas/JsonBackedArtifact'
        adCopy:
          $ref: '#/components/schemas/JsonBackedArtifact'
        adImageBriefing:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageCopy:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageWireframe:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageImagePlanning:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageDesignPreset:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageDeliverables:
          $ref: '#/components/schemas/JsonBackedArtifact'
        htmlGeraLanding:
          type: string
          nullable: true
      required:
        - id
    JsonBackedArtifact:
      description: Artefato persistido em coluna textual, mas exposto como JSON estruturado quando o conteúdo armazenado for JSON válido; texto bruto só é aceito para conteúdo realmente textual ou fallback de diagnóstico.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
    PendingStageHypothesis:
      type: object
      additionalProperties: false
      description: Hipótese e framework canônico associados ao job pendente de wireframe.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
        framework:
          $ref: '#/components/schemas/PendingStageHypothesisFramework'
      required:
        - framework
    PendingStageHypothesisFramework:
      type: object
      additionalProperties: true
      description: Framework Dor → Resultado → Mecanismo → Prova → Oferta da hipótese.
      properties:
        version:
          type: string
          nullable: true
        pain:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        mechanism:
          type: object
          additionalProperties: true
        proof:
          type: object
          additionalProperties: true
        offer:
          type: object
          additionalProperties: true
        checklist:
          type: object
          additionalProperties: true
      required:
        - pain
        - result
        - mechanism
        - proof
        - offer
        - checklist
