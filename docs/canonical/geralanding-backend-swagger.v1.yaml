components:
  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      description: Identificador numérico do experimento dono da execução GeraLanding.
      schema:
        type: integer
        format: int64
        minimum: 1
    IdJob:
      name: idJob
      in: path
      required: true
      description: Identificador textual do job da execução da etapa.
      schema:
        type: string
        minLength: 1
    IncludeCompleted:
      name: includeCompleted
      in: query
      required: false
      description: Quando `true`, inclui execuções com status `CONCLUIDO`; o padrão do backend é `true`.
      schema:
        type: boolean
        default: true
  schemas:
    StageStatus:
      type: string
      description: Status operacional persistido para a execução da etapa.
      enum:
        - INICIADO
        - AGUARDANDO_RETORNO_OPENAI
        - EM_PROCESSAMENTO
        - CONCLUIDO
        - FALHA
    StageStartResponse:
      type: object
      required:
        - idJob
        - status
      additionalProperties: false
      properties:
        idJob:
          type: string
          description: Identificador do job criado para a etapa.
        status:
          $ref: '#/components/schemas/StageStatus'
    PendingStageExecution:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        jobid:
          type: string
          description: Identificador do job pendente na etapa wireframe.
        stageCode:
          type: string
        experiment:
          $ref: '#/components/schemas/PendingStageExperiment'
      required:
        - experimentId
        - jobid
        - stageCode
        - experiment
    PendingStageExperiment:
      type: object
      additionalProperties: false
      description: Resumo mínimo do experimento associado ao job pendente.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        hypothesis:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
      required:
        - id
    StageExecutionSummary:
      type: object
      required:
        - idJob
        - status
        - executionRequestedAt
      additionalProperties: false
      properties:
        idJob:
          type: string
          description: Identificador do job da etapa.
        status:
          $ref: '#/components/schemas/StageStatus'
        executionRequestedAt:
          type: string
          format: date-time
          description: Momento em que a execução foi solicitada.
        costUsd:
          type: number
          format: double
          nullable: true
          description: Custo estimado/persistido da execução em dólar, quando disponível.
    StageExecutionDetail:
      type: object
      required:
        - idJob
        - experimentId
        - stageCode
        - status
      additionalProperties: false
      properties:
        idJob:
          type: string
        experimentId:
          type: integer
          format: int64
        stageCode:
          type: string
          enum:
            - landing-page-wireframe
            - landing-page-copy
            - landing-page-image-planning
            - landing-page-design-preset
            - landing-page-deliverables
        executionRequestedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        promptTemplateId:
          type: string
          nullable: true
        promptContent:
          type: string
          nullable: true
        prompt:
          type: string
          nullable: true
        openAiRequestBody:
          type: string
          nullable: true
          description: Corpo bruto enviado para a OpenAI quando persistido para rastreabilidade.
        openAiModel:
          type: string
          nullable: true
        schemaJson:
          type: string
          nullable: true
        promptMarkdownContent:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StageStatus'
        openAiJobId:
          type: string
          nullable: true
        modelResponse:
          type: string
          nullable: true
        provisionalHtml:
          type: string
          nullable: true
          description: HTML provisório produzido pela etapa quando aplicável.
        errorMessage:
          type: string
          nullable: true
        errorDetail:
          type: string
          nullable: true
        inputTokens:
          type: integer
          format: int32
          nullable: true
        outputTokens:
          type: integer
          format: int32
          nullable: true
        costUsd:
          type: number
          format: double
          nullable: true
