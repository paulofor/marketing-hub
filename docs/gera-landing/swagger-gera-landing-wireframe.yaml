openapi: 3.0.3
info:
  title: Gera Landing API
  version: 1.0.0
  description: |
    Contrato Swagger para disparo da etapa de wireframe no Gera Landing,
    incluindo envio explícito do prompt montado e código da etapa.
servers:
  - url: http://191.252.181.168:8000
paths:
  /api/experiments/{experimentId}/geralanding/wireframe/start:
    post:
      tags:
        - Gera Landing
      summary: Inicia geração de wireframe da landing
      description: |
        Inicia a etapa de wireframe do Gera Landing para um experimento.
        O experimento é identificado exclusivamente pelo experimentId na URL; o payload contém apenas dados da etapa.
      parameters:
        - name: experimentId
          in: path
          required: true
          description: ID numérico interno do experimento.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeraLandingWireframeStartRequest'
            examples:
              exemploPadrao:
                summary: Exemplo de disparo com prompt e código da etapa
                value:
                  stageCode: LANDING_PAGE_WIREFRAME
                  prompt:
                    templateId: geralanding/wireframe/v1
                    content: |
                      [PROMPT FINAL MONTADO]
                      Gerar wireframe da landing conforme regras globais e artefatos do experimento.
      responses:
        '202':
          description: Etapa aceita para processamento assíncrono.
        '400':
          description: Payload inválido.
        '404':
          description: Experimento não encontrado.
components:
  schemas:
    GeraLandingWireframeStartRequest:
      type: object
      required:
        - stageCode
        - prompt
      properties:
        stageCode:
          type: string
          description: Código da etapa do pipeline.
          enum:
            - LANDING_PAGE_WIREFRAME
        prompt:
          type: object
          required:
            - content
          properties:
            templateId:
              type: string
              description: Identificador da versão do template de prompt usado.
            content:
              type: string
              description: Prompt final montado enviado ao motor de geração.
