openapi: 3.0.3
info:
  title: Ferramenta auditiva de Psique
  version: v1
paths:
  /api/internal/agent-tasks/{agentKey}/stage-executions/{taskId}/audio-reviews:
    parameters:
      - {name: agentKey, in: path, required: true, schema: {type: string, enum: [customer-agent]}}
      - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      summary: Recupera recibos, identidade, diagnóstico, reserva e estimativa sem consumo.
      responses:
        '200': {description: Lista de recibos auditivos da tarefa.}
    post:
      summary: Persiste request integral e reserva conservadora antes da chamada única.
      description: >-
        Uma nova tarefa pode receber o recibo COMPLETED de outra tarefa do mesmo produto,
        experimento, asset e hashes de vídeo, áudio e request. mayInvoke=false: o custo e o
        ID continuam na origem, sem novo lançamento. O parecer final deve citar esse ID e
        revalidar mídia, contexto e resultado. STOP e autorização do ciclo são preservados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, videoSha256, audioSha256, request]
              properties:
                assetId: {type: integer, format: int64}
                videoSha256: {type: string}
                audioSha256: {type: string}
                request: {type: object, description: Request Chat Completions integral com áudio WAV.}
      responses:
        '200': {description: mayInvoke true somente na primeira reserva; replays nunca autorizam repetição.}
        '409': {description: Contexto, pausa, custo desconhecido ou saldo impedem consumo; motivo explícito.}
  /api/internal/agent-tasks/{agentKey}/stage-executions/{taskId}/audio-reviews/{assetId}/result:
    parameters:
      - {name: agentKey, in: path, required: true, schema: {type: string}}
      - {name: taskId, in: path, required: true, schema: {type: integer, format: int64}}
      - {name: assetId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Preserva response bruto antes da validação e concilia estimativa por modalidade.
      description: >-
        Confronta o parecer com o mix e os segmentos medidos da mídia exata. Música declarada
        em mix somente de voz ou intervalos incompatíveis com SEGMENT_AUDIO_DURATION geram
        INVALID, preservando resposta, custo e motivo. A aprovação final revalida o recibo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawResponse]
              properties:
                rawResponse: {type: string, description: Exceção explícita de auditoria bruta; não é saída funcional.}
      responses:
        '200': {description: COMPLETED, INVALID, REFUSED ou COST_PENDING; recusa não é avaliação. Repetir o mesmo callback é idempotente e não autoriza nova inferência.}
