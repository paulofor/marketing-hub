openapi: 3.0.3
info:
  title: Marketing Hub - Caixa de Entrada dos Agentes
  version: 1.0.0
paths:
  /api/agent-tasks/active:
    get:
      summary: Lista todas as tarefas que ainda exigem atuação dos agentes
      responses:
        '200':
          description: Tarefas pendentes, em andamento ou bloqueadas, ordenadas pela atividade mais recente
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentTaskResponse'}
  /api/agent-tasks/agents/{agentKey}:
    get:
      summary: Lista a caixa de entrada de um agente
      parameters:
        - name: agentKey
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Tarefas ordenadas da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentTaskResponse'}
  /api/agent-tasks:
    post:
      summary: Abre uma solicitação humana para um agente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HumanTaskRequest'}
      responses:
        '201': {description: Tarefa criada}
  /api/agent-tasks/{taskId}/status:
    patch:
      summary: Evolui o estado auditável de uma tarefa
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, COMPLETED, BLOCKED, CANCELLED]
      responses:
        '200': {description: Estado atualizado}
        '409': {description: Transição inválida}
  /api/internal/agent-tasks/v1:
    post:
      summary: Permite que um agente delegue uma tarefa a outro agente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentTaskRequest'}
      responses:
        '201': {description: Delegação registrada}
  /api/internal/agent-tasks/v1/{taskId}/gate-decision:
    post:
      summary: Registra a decisão do gate pelo agente destinatário
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GateDecisionRequest'}
      responses:
        '200': {description: Gate decidido e tarefa encerrada ou bloqueada}
        '403': {description: Identidade diferente do agente destinatário}
        '409': {description: Tarefa comum ou gate já decidido}
  /api/internal/agent-tasks/v1/gates:
    post:
      summary: Permite que um agente abra um gate na mesa do responsável
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentGateRequest'}
      responses:
        '201': {description: Gate pendente registrado na mesa}
  /api/internal/agent-tasks/{agentKey}/stage-executions/{taskId}/result:
    post:
      summary: Conclui a atividade e contabiliza o uso de modelos
      parameters:
        - $ref: '#/components/parameters/AgentKey'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteTaskRequest'}
      responses:
        '204': {description: Resultado, evidências, tokens e custo estimado persistidos}
        '409': {description: Tarefa não reservada pelo agente}
  /api/internal/agent-tasks/{agentKey}/stage-executions/{taskId}/failure:
    post:
      summary: Bloqueia a atividade preservando resultado parcial e uso de modelos
      parameters:
        - $ref: '#/components/parameters/AgentKey'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FailTaskRequest'}
      responses:
        '204': {description: Falha e consumo já realizado persistidos}
        '409': {description: Tarefa não reservada pelo agente}
components:
  parameters:
    AgentKey:
      name: agentKey
      in: path
      required: true
      schema: {type: string}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: integer, format: int64}
  schemas:
    AgentTaskResponse:
      type: object
      required: [id, assignedAgentKey, title, status, costEstimationStatus]
      properties:
        id: {type: integer, format: int64}
        assignedAgentKey: {type: string}
        title: {type: string}
        status: {type: string}
        inputTokens: {type: integer, format: int64, nullable: true}
        cachedInputTokens: {type: integer, format: int64, nullable: true}
        outputTokens: {type: integer, format: int64, nullable: true}
        estimatedCostUsd: {type: number, format: decimal, nullable: true}
        costEstimationStatus:
          type: string
          enum: [NOT_REPORTED, NOT_APPLICABLE, ESTIMATED, PARTIALLY_ESTIMATED, PRICING_UNAVAILABLE]
        modelUsageUpdatedAt: {type: string, format: date-time, nullable: true}
    ModelUsage:
      type: object
      required: [modelCode, serviceTier, inputTokens, cachedInputTokens, outputTokens]
      properties:
        modelCode: {type: string, maxLength: 128}
        serviceTier: {type: string, enum: [STANDARD, FLEX, BATCH]}
        inputTokens: {type: integer, format: int64, minimum: 0}
        cachedInputTokens:
          type: integer
          format: int64
          minimum: 0
          description: Parcela de inputTokens atendida pelo cache; não pode exceder a entrada.
        outputTokens: {type: integer, format: int64, minimum: 0}
    CompleteTaskRequest:
      type: object
      required: [resultJson, evidenceJson]
      properties:
        resultJson: {type: string}
        evidenceJson: {type: string}
        modelUsages:
          type: array
          description: Chamadas feitas durante esta tentativa; vazio significa que a atividade não usou modelo.
          items: {$ref: '#/components/schemas/ModelUsage'}
    FailTaskRequest:
      type: object
      required: [error]
      properties:
        error: {type: string}
        resultJson: {type: string, nullable: true}
        evidenceJson: {type: string, nullable: true}
        modelUsages:
          type: array
          items: {$ref: '#/components/schemas/ModelUsage'}
    HumanTaskRequest:
      type: object
      required: [assignedAgentKey, requestedByName, title, description, priority, exceptional]
      properties:
        assignedAgentKey: {type: string, maxLength: 100}
        requestedByName: {type: string, maxLength: 100}
        title: {type: string, maxLength: 160}
        description: {type: string}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
        sourceReference: {type: string, maxLength: 200}
        processDefinitionId:
          type: integer
          format: int64
          description: Versão publicada do processo; obrigatória quando exceptional=false.
        processActivityId:
          type: string
          maxLength: 100
          description: Atividade TASK atribuída ao agente no processo publicado.
        exceptional:
          type: boolean
          description: Indica demanda governada fora do catálogo de processos.
        exceptionReason:
          type: string
          maxLength: 500
          description: Obrigatória quando exceptional=true.
    AgentTaskRequest:
      type: object
      required: [requestedByAgentKey, assignedAgentKey, title, description, priority]
      properties:
        requestedByAgentKey: {type: string, maxLength: 100}
        assignedAgentKey: {type: string, maxLength: 100}
        title: {type: string, maxLength: 160}
        description: {type: string}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
        sourceReference: {type: string, maxLength: 200}
    GateDecisionRequest:
      type: object
      required: [decidedByAgentKey, decision, reason]
      properties:
        decidedByAgentKey: {type: string, maxLength: 100}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string}
    AgentGateRequest:
      allOf:
        - $ref: '#/components/schemas/AgentTaskRequest'
        - type: object
          required: [gateCode]
          properties:
            gateCode: {type: string, maxLength: 100}
