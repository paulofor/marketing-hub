openapi: 3.0.3
info:
  title: Marketing Hub - Gestão de Agentes
  version: 1.3.0
paths:
  /api/agents/work-monitor:
    get:
      summary: Lista o trabalho e o consumo diário de tokens dos agentes
      responses:
        "200":
          description: Estado operacional persistido, atualizado automaticamente pela tela.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentWorkMonitor"
  /api/agents/work-monitor/{agentId}/automatic-execution:
    put:
      summary: Alterna a execução automática do agente entre PLAY e STOP
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [automaticExecutionEnabled]
              properties:
                automaticExecutionEnabled:
                  type: boolean
      responses:
        "200":
          description: Estado operacional persistido e auditado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAutomaticExecutionControl"
  /api/internal/agents/executor-health/{agentKey}/automatic-execution:
    get:
      summary: Informa se o executor pode iniciar trabalho automático
      parameters:
        - in: path
          name: agentKey
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verdade operacional que o executor deve consultar antes de cada rotina.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAutomaticExecutionControl"
  /api/agents/portrait:
    post:
      summary: Envia a figura mitológica de um agente
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem PNG, JPEG ou WebP de até 5 MB.
      responses:
        "200":
          description: Imagem armazenada e pronta para associação ao cadastro.
          content:
            application/json:
              schema:
                type: object
                required: [assetId, url]
                properties:
                  assetId:
                    type: integer
                    format: int64
                  url:
                    type: string
                    format: uri
        "400":
          description: Arquivo vazio, grande ou em formato não permitido.
components:
  schemas:
    AgentWorkMonitor:
      type: object
      required:
        - agentId
        - agentKey
        - nickname
        - agentName
        - automaticExecutionEnabled
        - automaticExecutionStatus
        - workStatus
        - currentWork
        - externalDecisionRequired
        - dailyTokens
        - dailyTokenDate
      properties:
        agentId:
          type: integer
          format: int64
        agentKey:
          type: string
        nickname:
          type: string
        agentName:
          type: string
        automaticExecutionEnabled:
          type: boolean
        automaticExecutionStatus:
          type: string
          enum: [PLAY, STOP]
        automaticExecutionChangedAt:
          type: string
          format: date-time
          nullable: true
        automaticExecutionChangedBy:
          type: string
          nullable: true
        workStatus:
          type: string
        currentWork:
          type: string
        progressDetail:
          type: string
          nullable: true
        difficulty:
          type: string
          nullable: true
        externalDecisionRequired:
          type: boolean
        externalDecision:
          type: string
          nullable: true
        sourceReference:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        dailyTokens:
          type: integer
          format: int64
          description: Soma de tokens de entrada e saída reportados pelas execuções iniciadas no dia comercial.
        dailyTokenDate:
          type: string
          format: date
          description: Dia comercial do contador no fuso America/Sao_Paulo.
    AgentAutomaticExecutionControl:
      type: object
      required:
        - agentId
        - agentKey
        - automaticExecutionEnabled
        - automaticExecutionStatus
      properties:
        agentId:
          type: integer
          format: int64
        agentKey:
          type: string
        automaticExecutionEnabled:
          type: boolean
        automaticExecutionStatus:
          type: string
          enum: [PLAY, STOP]
        changedAt:
          type: string
          format: date-time
          nullable: true
        changedBy:
          type: string
          nullable: true
