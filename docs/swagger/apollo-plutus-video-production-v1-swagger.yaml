openapi: 3.0.3
info:
  title: Ciclos de vídeo de Apolo e Plutus
  version: 1.2.0
paths:
  /api/sales-videos/autonomy/v1/cycles:
    post:
      summary: Solicita um ciclo de produção ainda sem autorização de consumo
      description: No caminho legado exige roteiro aprovado. Um recibo integral vigente de vídeo privado aceita perfil DRAFT para preparar prova real e briefing de Íris no mesmo ciclo, sem inferência antes da prontidão. PRIVATE_READY exige Íris concluída e Plutus aprovado, permite TEST privado e não preenche approvedBy nem autoriza publicação comercial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoProjectId, budgetLimitUsd, productionProfile, learningObjective, successCriterion, requestedBy]
              properties:
                videoProjectId: {type: integer, format: int64}
                budgetLimitUsd: {type: number, minimum: 0.01}
                productionProfile: {type: string, enum: [DRAFT_INSTAGRAM, FINAL_CAMPAIGN]}
                learningObjective: {type: string, minLength: 1}
                successCriterion: {type: string, minLength: 1}
                requestedBy: {type: string, minLength: 1}
      responses:
        '201': {description: Ciclo enviado ao preflight oficial do agregador}
        '400': {description: Perfil sem roteiro aprovado; SCRIPT_NOT_FOUND identifica o perfil a preparar e não cria ciclo nem tarefa paga}
        '403': {description: Perfil não pertence ao tenant ativo}
  /api/sales-videos/autonomy/v1/provider-preflights:
    post:
      summary: Executa somente saldo, quota e dry run, sem reserva ou geração
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoProjectId, budgetLimitUsd, productionProfile, learningObjective, successCriterion, requestedBy]
              properties:
                videoProjectId: {type: integer, format: int64}
                budgetLimitUsd: {type: number, minimum: 0.01, description: Teto analítico sem autorização de consumo}
                productionProfile: {type: string, enum: [DRAFT_INSTAGRAM, FINAL_CAMPAIGN]}
                learningObjective: {type: string, minLength: 1}
                successCriterion: {type: string, minLength: 1}
                requestedBy: {type: string, minLength: 1}
      responses:
        '201': {description: Preflight isolado criado sem reserva, Plutus ou job de geração}
  /api/sales-videos/projects/{projectId}/autonomy/v1/cycles:
    get:
      summary: Lista os ciclos auditáveis do projeto
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Histórico do projeto}
  /api/internal/sales-videos/autonomy/v1/financial-review/pending:
    get:
      summary: Lista a caixa financeira pendente de Plutus
      responses:
        '200': {description: Ciclos com snapshot e eventual resposta bruta para retomada idempotente}
  /api/internal/sales-videos/autonomy/v1/financial-review/reconcile:
    post:
      summary: Encerra revisões financeiras cuja reserva expirou sem consumo
      responses:
        '204': {description: Reservas expiradas liberadas e ciclos bloqueados de forma auditável}
  /api/internal/sales-videos/autonomy/v1/provider-preflight/pending:
    get:
      summary: Lista ciclos aguardando snapshot oficial e dry run do executor
      responses:
        '200': {description: Contexto sanitizado para o preflight do agregador}
  /api/internal/sales-videos/autonomy/v1/cycles/{cycleId}/provider-preflight-result:
    post:
      summary: Persiste saldo, quota, rotas e custo sem reservar ou gerar
      parameters:
        - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, accountKey, sourceUrl, observedAt]
              properties:
                status: {type: string, enum: [READY, BLOCKED]}
                accountKey: {type: string}
                routerConfigId: {type: string, nullable: true}
                payloadSha256: {type: string, nullable: true}
                executionRequestsJson: {type: string, nullable: true}
                organizationSnapshotJson: {type: string, nullable: true}
                routingResponseJson: {type: string, nullable: true}
                selectedRoutesJson: {type: string, nullable: true}
                estimatedCredits: {type: number, nullable: true}
                officialBalanceCredits: {type: number, nullable: true}
                maxMonthlyCreditSpend: {type: integer, format: int64, nullable: true}
                quotaSnapshotJson: {type: string, nullable: true}
                usageSnapshotJson: {type: string, nullable: true}
                failureCode: {type: string, nullable: true}
                failureDetail: {type: string, nullable: true}
                sourceUrl: {type: string, format: uri}
                observedAt: {type: string, format: date-time}
      responses:
        '200': {description: Preflight persistido e, quando completo, encaminhado a Plutus}
        '400': {description: Snapshot ou hash inválido}
        '409': {description: Resultado divergente ou conta incompatível}
  /api/internal/sales-videos/autonomy/v1/cycles/{cycleId}/financial-review-audit:
    post:
      summary: Audita prompt, resposta bruta e uso do modelo antes de aplicar o parecer de Plutus
      parameters:
        - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawModelResponse, executionAudit]
              properties:
                rawModelResponse: {type: string, minLength: 1}
                executionAudit: {type: object}
                modelUsages:
                  type: array
                  items: {type: object}
      responses:
        '204': {description: Interação auditada sem avançar o ciclo}
        '409': {description: Gate não pendente ou resposta divergente já persistida}
  /api/internal/sales-videos/autonomy/v1/cycles/{cycleId}/financial-decision:
    post:
      summary: Registra decisão de Plutus, reserva créditos e só então enfileira Apolo
      parameters:
        - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason, decidedByAgentKey, recommendedAggregator, recommendedRoute, estimatedCostUsd, costBenefitBasis, creditAction]
              properties:
                decision: {type: string, enum: [APPROVED, REJECTED]}
                reason: {type: string, minLength: 1}
                decidedByAgentKey: {type: string, enum: [financial-agent]}
                recommendedAggregator: {type: string}
                recommendedRoute: {type: string}
                estimatedCostUsd: {type: number, minimum: 0}
                costBenefitBasis: {type: string, minLength: 1}
                creditAction: {type: string, enum: [NO_PURCHASE, RECHARGE_REQUIRED, BLOCKED_UNKNOWN]}
                recommendedRechargeCredits: {type: number, minimum: 0, nullable: true}
                rechargeUrl: {type: string, format: uri, nullable: true}
      responses:
        '200': {description: Ciclo decidido}
        '403': {description: Identidade diferente de Plutus}
        '409': {description: Ciclo já decidido}

  /internal/video/jobs/{jobId}/spending/{purpose}:
    get:
      summary: Consultar autoridade de consumo do job de vídeo
      description: 'SINGLE_VIDEO_BOUNDED_V1: o header é handshake do executor; o servidor
        resolve recibo, contexto, STOP, tarifa, reserva e lock compartilhado. Não aprova
        produto nem publicação.'
      parameters:
      - &id001
        name: jobId
        in: path
        required: true
        schema:
          type: integer
      - &id002
        name: purpose
        in: path
        required: true
        schema:
          type: string
      - &id003
        name: X-Single-Video-Spending-Contract
        in: header
        required: true
        schema:
          type: string
          enum:
          - SINGLE_VIDEO_BOUNDED_V1
      responses:
        '200':
          description: Estado persistido, inclusive replay sem novo consumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVideoSpendContext'
        '400':
          description: Contrato, cobertura, vigência ou executor recusado antes de chamada
            externa.
        '409':
          description: Estado ou contexto incompatível; preservar reservas e conciliar.
  /internal/video/jobs/{jobId}/spending/{purpose}/reserve:
    post:
      summary: Reservar PLAN, CLIP_N ou VOICE_N pelo request real
      description: 'SINGLE_VIDEO_BOUNDED_V1: o header é handshake do executor; o servidor
        resolve recibo, contexto, STOP, tarifa, reserva e lock compartilhado. Não aprova
        produto nem publicação.'
      parameters:
      - *id001
      - *id002
      - *id003
      responses:
        '200':
          description: Estado persistido, inclusive replay sem novo consumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVideoSpendLease'
        '400':
          description: Contrato, cobertura, vigência ou executor recusado antes de chamada
            externa.
        '409':
          description: Estado ou contexto incompatível; preservar reservas e conciliar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleVideoSpendReserve'
  /internal/video/jobs/{jobId}/spending/{purpose}/{reservationId}/begin:
    post:
      summary: Admitir uma única chamada externa do job
      description: 'SINGLE_VIDEO_BOUNDED_V1: o header é handshake do executor; o servidor
        resolve recibo, contexto, STOP, tarifa, reserva e lock compartilhado. Não aprova
        produto nem publicação.'
      parameters:
      - *id001
      - *id002
      - name: reservationId
        in: path
        required: true
        schema:
          type: integer
      - *id003
      responses:
        '200':
          description: Estado persistido, inclusive replay sem novo consumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVideoSpendLease'
        '400':
          description: Contrato, cobertura, vigência ou executor recusado antes de chamada
            externa.
        '409':
          description: Estado ou contexto incompatível; preservar reservas e conciliar.
  /internal/video/jobs/{jobId}/spending/{purpose}/{reservationId}/result:
    post:
      summary: Preservar resposta ou incerteza do job sem novo consumo
      description: 'SINGLE_VIDEO_BOUNDED_V1: o header é handshake do executor; o servidor
        resolve recibo, contexto, STOP, tarifa, reserva e lock compartilhado. Não aprova
        produto nem publicação.'
      parameters:
      - *id001
      - *id002
      - name: reservationId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Estado persistido, inclusive replay sem novo consumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleVideoSpendLease'
        '400':
          description: Contrato, cobertura, vigência ou executor recusado antes de chamada
            externa.
        '409':
          description: Estado ou contexto incompatível; preservar reservas e conciliar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleVideoSpendResult'

components:
  schemas:
    SingleVideoSpendContext:
      type: object
      properties:
        required:
          type: boolean
        receiptId:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        blocker:
          type: string
          nullable: true
        reservation:
          $ref: '#/components/schemas/SingleVideoSpendLease'
        voiceModel:
          type: string
          nullable: true
    SingleVideoSpendLease:
      type: object
      required:
      - id
      - receiptId
      - state
      - mayInvoke
      - maximumUsd
      - requestSha256
      - request
      - quoteExpiresAt
      properties:
        id:
          type: integer
          format: int64
        receiptId:
          type: integer
          format: int64
        state:
          type: string
          enum:
          - RESERVED
          - SUBMITTED
          - UNCERTAIN
          - RESPONSE_RECORDED
        mayInvoke:
          type: boolean
          description: Somente a primeira transição begin permite enviar; replay nunca
            autoriza novo POST.
        maximumUsd:
          type: number
          description: Máximo retido, não custo faturado ou saldo conciliado.
        requestSha256:
          type: string
        request:
          type: object
          additionalProperties: true
        rawResponse:
          type: string
          nullable: true
        quoteExpiresAt:
          type: string
          format: date-time
          description: Renovar RESERVED vencida no mesmo ID antes de begin, sem reduzir
            reserva ou zerar histórico.
    SingleVideoSpendReserve:
      type: object
      required:
      - request
      properties:
        request:
          type: object
          additionalProperties: true
        inputTokenCount:
          type: object
          description: Responses usa contagem oficial response.input_tokens do corpo imutável;
            voz/clipes dispensam contagem de tokens.
          nullable: true
    SingleVideoSpendResult:
      type: object
      properties:
        httpStatus:
          type: integer
          nullable: true
        rawResponse:
          type: string
          nullable: true
        providerRequestId:
          type: string
          nullable: true
