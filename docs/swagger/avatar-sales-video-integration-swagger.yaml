openapi: 3.0.3
info:
  title: Avatar Sales Video - Backend x Video Module Integration API
  version: 1.0.0
  description: |
    Contrato de integração entre o `backend/ads-service` (fonte canônica de estado/persistência)
    e o módulo assíncrono de vídeo (`video-management-service`) para o pipeline Avatar Sales Video.

    Escopo: endpoints usados na troca de dados operacional do ciclo de render.
servers:
  - url: http://backend:8000
    description: Ambiente local/staging
  - url: http://191.252.181.168:8000
    description: Backend staging compartilhado (Sprint V1)

tags:
  - name: InternalVideoJobs
    description: Endpoints internos consumidos pelo módulo de vídeo para orquestrar jobs.
  - name: InternalAiSalesVideo
    description: Endpoints internos consumidos pelo ai-worker para geração de scripts de vídeo.
  - name: PublicVideoProfiles
    description: Endpoints de leitura de perfil usados pelo módulo de vídeo.

paths:
  /internal/video/jobs:
    get:
      tags: [InternalVideoJobs]
      summary: Lista jobs de vídeo para processamento assíncrono
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/SalesVideoStatus'
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/SalesVideoJobType'
        - in: query
          name: providerFamily
          schema:
            $ref: '#/components/schemas/SalesVideoProviderFamily'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 25
      responses:
        '200':
          description: Lista de jobs encontrada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesVideoJobDto'

  /internal/video/jobs/{jobId}:
    get:
      tags: [InternalVideoJobs]
      summary: Busca um job específico
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'
        '404':
          description: Job não encontrado

  /internal/video/jobs/{jobId}/claim:
    post:
      tags: [InternalVideoJobs]
      summary: Faz claim de job para o worker atual
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobClaimRequest'
      responses:
        '200':
          description: Claim aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'
        '404':
          description: Job não encontrado para claim
        '409':
          description: Job já está claimed por outro worker

  /internal/video/jobs/{jobId}/heartbeat:
    post:
      tags: [InternalVideoJobs]
      summary: Atualiza heartbeat do job em execução
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobHeartbeatRequest'
      responses:
        '200':
          description: Heartbeat registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'

  /internal/video/jobs/{jobId}/progress:
    post:
      tags: [InternalVideoJobs]
      summary: Reporta progresso intermediário do job
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProgressRequest'
      responses:
        '200':
          description: Progresso atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'

  /internal/video/jobs/{jobId}/complete:
    post:
      tags: [InternalVideoJobs]
      summary: Marca job como concluído
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCompletionRequest'
      responses:
        '200':
          description: Job concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'

  /internal/video/jobs/{jobId}/fail:
    post:
      tags: [InternalVideoJobs]
      summary: Marca job como falho
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobFailureRequest'
      responses:
        '200':
          description: Falha registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'

  /internal/video/jobs/{jobId}/expired:
    post:
      tags: [InternalVideoJobs]
      summary: Marca job como expirado pelo provider
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobExpirationRequest'
      responses:
        '200':
          description: Expiração registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoJobDto'

  /internal/ai/sales-videos/profiles/{profileId}:
    get:
      tags: [InternalAiSalesVideo]
      summary: Carrega perfil de vídeo para geração de script pelo ai-worker
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoProfileDto'
        '404':
          description: Perfil não encontrado

  /api/sales-videos/rollout/status:
    get:
      tags: [PublicVideoProfiles]
      summary: Consulta elegibilidade de rollout para o tenant ativo
      responses:
        '200':
          description: Status de rollout do tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoRolloutStatusDto'

  /api/sales-videos/profiles/{profileId}/rollout-status:
    get:
      tags: [PublicVideoProfiles]
      summary: Consulta elegibilidade de rollout para um perfil específico
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Status de rollout do perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoRolloutStatusDto'
        '404':
          description: Perfil não encontrado
  /api/sales-videos/profiles/{profileId}:
    get:
      tags: [PublicVideoProfiles]
      summary: Carrega perfil para execução do render
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoProfileDto'
        '404':
          description: Perfil não encontrado

  /api/sales-videos/profiles/{profileId}/compliance:
    patch:
      tags: [PublicVideoProfiles]
      summary: Atualiza checklist mínimo de compliance do perfil
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalesVideoComplianceRequest'
      responses:
        '200':
          description: Compliance atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoProfileDto'

  /api/sales-videos/profiles/{profileId}/commercial-playbooks:
    get:
      tags: [PublicVideoProfiles]
      summary: Lista playbooks comerciais ativos/inativos para o perfil
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Playbooks encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesVideoCommercialPlaybookDto'
    post:
      tags: [PublicVideoProfiles]
      summary: Cria playbook comercial inicial (objeção + CTA) por nicho/variação
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesVideoCommercialPlaybookRequest'
      responses:
        '200':
          description: Playbook criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoCommercialPlaybookDto'

  /api/sales-videos/profiles/{profileId}/conversion-events:
    post:
      tags: [PublicVideoProfiles]
      summary: Registra evento de conversão vinculado ao perfil/job/script
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesVideoConversionEventRequest'
      responses:
        '200':
          description: Evento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoConversionEventDto'

  /api/sales-videos/profiles/{profileId}/performance-summary:
    get:
      tags: [PublicVideoProfiles]
      summary: Resume performance comercial por script/provider para o perfil
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Resumo calculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesVideoPerformanceSummaryDto'

components:
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    SalesVideoStatus:
      type: string
      enum:
        - DRAFT
        - SCRIPT_PENDING
        - SCRIPT_READY
        - STORYBOARD_PENDING
        - STORYBOARD_READY
        - VIDEO_REQUESTED
        - VIDEO_PROCESSING
        - VIDEO_READY
        - VIDEO_FAILED
        - PUBLISHED
        - ARCHIVED

    SalesVideoJobType:
      type: string
      enum: [SCRIPT, STORYBOARD, RENDER, PUBLISH, RETRY]

    SalesVideoProviderFamily:
      type: string
      enum: [OPENAI, EXTERNAL_VIDEO_MODULE]

    SalesVideoExecutionMode:
      type: string
      enum: [TEST, PRODUCTION]

    SalesVideoRetryReason:
      type: string
      enum:
        - MANUAL_INTERVENTION
        - PROVIDER_FAILURE
        - ASSET_EXPIRED
        - QUALITY_ASSURANCE
        - AUTO_RECOVERY
        - OTHER

    SalesVideoKind:
      type: string
      enum: [HERO, OBJECTION, PROOF]

    SalesVideoScriptSource:
      type: string
      enum: [MANUAL, OPENAI]

    SalesVideoScriptStatus:
      type: string
      enum: [DRAFT, READY_FOR_REVIEW, APPROVED, ARCHIVED]

    SalesVideoJobDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profileId: { type: integer, format: int64 }
        scriptId: { type: integer, format: int64 }
        tenantId: { type: string }
        providerFamily: { $ref: '#/components/schemas/SalesVideoProviderFamily' }
        executionMode: { $ref: '#/components/schemas/SalesVideoExecutionMode' }
        providerName: { type: string }
        providerJobId: { type: string }
        jobType: { $ref: '#/components/schemas/SalesVideoJobType' }
        status: { $ref: '#/components/schemas/SalesVideoStatus' }
        retryAttempt: { type: integer }
        retryReason: { $ref: '#/components/schemas/SalesVideoRetryReason' }
        retryOfJobId: { type: integer, format: int64 }
        retryNotes: { type: string }
        progressPercent: { type: integer }
        failureCode: { type: string }
        failureDetail: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        assetId: { type: integer, format: int64 }
        posterAssetId: { type: integer, format: int64 }
        vttAssetId: { type: integer, format: int64 }
        metadataJson: { type: string }
        auditSnapshotJson: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SalesVideoScriptDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        version: { type: integer }
        createdBy: { type: string }
        scriptText: { type: string }
        hookText: { type: string }
        ctaText: { type: string }
        captionText: { type: string }
        storyboardJson: { type: string }
        source: { $ref: '#/components/schemas/SalesVideoScriptSource' }
        model: { type: string }
        prompt: { type: string }
        status: { $ref: '#/components/schemas/SalesVideoScriptStatus' }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }


    SalesVideoRolloutStatusDto:
      type: object
      properties:
        rolloutEnabled: { type: boolean }
        tenantEligible: { type: boolean }
        profileEligible: { type: boolean }
        tenantId: { type: string }
        profileId: { type: integer, format: int64, nullable: true }
        allowedTenants:
          type: array
          items: { type: string }
        allowedProfileIds:
          type: array
          items: { type: integer, format: int64 }

    SalesVideoProfileDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        landingPageId: { type: integer, format: int64 }
        tenantId: { type: string }
        createdBy: { type: string }
        videoKind: { $ref: '#/components/schemas/SalesVideoKind' }
        title: { type: string }
        personaName: { type: string }
        personaStyle: { type: string }
        voiceStyle: { type: string }
        language: { type: string }
        targetDurationSeconds: { type: integer }
        requiresConsent: { type: boolean }
        consentRecordedBy: { type: string }
        consentRecordedAt: { type: string, format: date-time }
        consentEvidenceUrl: { type: string }
        humanReviewApprovedBy: { type: string }
        humanReviewApprovedAt: { type: string, format: date-time }
        complianceNotes: { type: string }
        status: { $ref: '#/components/schemas/SalesVideoStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestScript: { $ref: '#/components/schemas/SalesVideoScriptDto' }
        lastJob: { $ref: '#/components/schemas/SalesVideoJobDto' }

    JobClaimRequest:
      type: object
      required: [workerId]
      properties:
        workerId:
          type: string
          minLength: 1
        message:
          type: string

    RequestVideoRenderRequest:
      type: object
      required: [requestedBy]
      properties:
        requestedBy: { type: string }
        providerFamily: { $ref: '#/components/schemas/SalesVideoProviderFamily' }
        providerName: { type: string }
        executionMode: { $ref: '#/components/schemas/SalesVideoExecutionMode' }

    JobHeartbeatRequest:
      type: object
      properties:
        message: { type: string }
        detailsJson: { type: string }

    JobProgressRequest:
      type: object
      properties:
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        status: { $ref: '#/components/schemas/SalesVideoStatus' }
        message: { type: string }
        detailsJson: { type: string }

    GeneratedScriptResultPayload:
      type: object
      properties:
        scriptText: { type: string }
        hookText: { type: string }
        ctaText: { type: string }
        captionText: { type: string }
        storyboardJson: { type: string }
        prompt: { type: string }
        model: { type: string }

    JobCompletionRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/SalesVideoStatus' }
        assetId: { type: integer, format: int64 }
        posterAssetId: { type: integer, format: int64 }
        vttAssetId: { type: integer, format: int64 }
        providerJobId: { type: string }
        metadataJson: { type: string }
        message: { type: string }
        detailsJson: { type: string }
        scriptResult:
          $ref: '#/components/schemas/GeneratedScriptResultPayload'

    JobFailureRequest:
      type: object
      properties:
        failureCode: { type: string }
        failureDetail: { type: string }
        status: { $ref: '#/components/schemas/SalesVideoStatus' }
        message: { type: string }
        retryable:
          type: boolean
          description: Sinaliza se a falha é elegível para retry técnico automático.
        retryReason:
          $ref: '#/components/schemas/SalesVideoRetryReason'

    JobExpirationRequest:
      type: object
      properties:
        message: { type: string }
        detailsJson: { type: string }

    UpdateSalesVideoComplianceRequest:
      type: object
      properties:
        requiresConsent: { type: boolean }
        consentRecordedBy: { type: string }
        consentEvidenceUrl: { type: string }
        humanReviewApproved:
          type: boolean
          description: Marca revisão humana obrigatória como aprovada ou revogada.
        humanReviewApprovedBy: { type: string }
        complianceNotes: { type: string }

    SalesVideoConversionEventType:
      type: string
      enum: [VIEW, LEAD, QUALIFIED_LEAD, CHECKOUT_STARTED, PURCHASE]

    CreateSalesVideoCommercialPlaybookRequest:
      type: object
      required: [nicheKey, variantKey, objectionText, ctaText]
      properties:
        nicheKey: { type: string }
        variantKey: { type: string }
        objectionText: { type: string }
        ctaText: { type: string }
        active: { type: boolean }
        createdBy: { type: string }

    SalesVideoCommercialPlaybookDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profileId: { type: integer, format: int64 }
        tenantId: { type: string }
        nicheKey: { type: string }
        variantKey: { type: string }
        objectionText: { type: string }
        ctaText: { type: string }
        active: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSalesVideoConversionEventRequest:
      type: object
      required: [eventType]
      properties:
        jobId: { type: integer, format: int64 }
        scriptId: { type: integer, format: int64 }
        eventType: { $ref: '#/components/schemas/SalesVideoConversionEventType' }
        eventValue: { type: number, format: double }
        currencyCode: { type: string }
        source: { type: string }
        occurredAt: { type: string, format: date-time }
        metadataJson: { type: string }

    SalesVideoConversionEventDto:
      type: object
      properties:
        id: { type: integer, format: int64 }
        profileId: { type: integer, format: int64 }
        jobId: { type: integer, format: int64 }
        scriptId: { type: integer, format: int64 }
        tenantId: { type: string }
        eventType: { $ref: '#/components/schemas/SalesVideoConversionEventType' }
        eventValue: { type: number, format: double }
        currencyCode: { type: string }
        source: { type: string }
        occurredAt: { type: string, format: date-time }
        metadataJson: { type: string }
        createdAt: { type: string, format: date-time }

    SalesVideoVariantPerformanceDto:
      type: object
      properties:
        scriptId: { type: integer, format: int64, nullable: true }
        providerName: { type: string, nullable: true }
        variantKey: { type: string }
        events: { type: integer, format: int64 }
        leads: { type: integer, format: int64 }
        purchases: { type: integer, format: int64 }
        revenue: { type: number, format: double }

    SalesVideoPerformanceSummaryDto:
      type: object
      properties:
        profileId: { type: integer, format: int64 }
        tenantId: { type: string }
        totalEvents: { type: integer, format: int64 }
        totalLeads: { type: integer, format: int64 }
        totalPurchases: { type: integer, format: int64 }
        totalRevenue: { type: number, format: double }
        variants:
          type: array
          items:
            $ref: '#/components/schemas/SalesVideoVariantPerformanceDto'
