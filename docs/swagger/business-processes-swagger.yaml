openapi: 3.0.3
info:
  title: Catálogo de processos de negócio
  version: 1.7.0
  description: Cadastro versionado de processos de valor, subprocessos, atividades e documentos no Marketing Hub.
paths:
  /api/business-processes:
    get:
      summary: Lista as versões dos processos
      responses:
        "200": { description: Catálogo e diagramas persistidos }
    post:
      summary: Cria uma versão em rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProcessDefinition" }
      responses:
        "201": { description: Rascunho criado }
        "400": { description: Grafo ou recurso especializado inválido }
  /api/business-processes/{id}:
    put:
      summary: Atualiza uma versão em rascunho
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProcessDefinition" }
      responses:
        "200": { description: Rascunho atualizado }
        "409": { description: Versão já publicada ou aposentada }
  /api/business-processes/{processDefinitionId}/composition:
    get:
      summary: Exibe a composição hierárquica oficial do processo
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
      responses:
        "200":
          description: Processo, pai opcional e subprocessos publicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProcessComposition"
        "404": { description: Processo não encontrado }
  /api/business-processes/{processDefinitionId}/document-activities:
    get:
      summary: Lista atividades que já produziram documentos concluídos
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
      responses:
        "200":
          description: Identificadores das atividades documentais
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "404": { description: Processo não encontrado }
  /api/business-processes/{processDefinitionId}/documents:
    get:
      summary: Lista os dez documentos mais recentes do processo
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
      responses:
        "200":
          description: Documentos do processo ordenados do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/BusinessProcessActivityDocument"
        "404": { description: Processo não encontrado }
  /api/business-processes/{processDefinitionId}/activities/{activityId}/documents:
    get:
      summary: Lista os dez documentos mais recentes da atividade
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documentos ordenados do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/BusinessProcessActivityDocument"
        "404": { description: Processo ou atividade TASK não encontrada }
  /api/business-processes/{processDefinitionId}/activities/{activityId}/executions:
    get:
      summary: Lista as dez tarefas mais recentes da atividade no processo canônico
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Atividade selecionada e tarefas reais de todas as versões do mesmo processo, incluindo cobertura composta persistida sem duplicar custo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProcessActivityExecutionHistory"
        "404": { description: Processo ou atividade TASK não encontrada }
  /api/business-processes/{processDefinitionId}/products/{productId}/activity-executions:
    get:
      summary: Lista as atividades e tarefas do produto no processo canônico
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Atividades da versão selecionada e tarefas reais do produto em todas as versões do mesmo processo, com custo único por tarefa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProcessActivityExecutionHistory"
        "404": { description: Processo ou produto não encontrado }
  /api/business-processes/{processDefinitionId}/products/{productId}/activities/{activityId}/execution-requests:
    post:
      summary: Executa a atividade backend ou abre atomicamente suas tarefas responsáveis
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resultado operacional persistido ou tarefas criadas na referência corrente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProcessActivityExecutionRequest"
        "404": { description: Processo, produto ou atividade não encontrada }
        "409":
          {
            description: Processo,
            produto,
            atividade,
            estado atual ou contexto sem condição de execução,
          }
components:
  parameters:
    ProcessDefinitionId:
      name: processDefinitionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    BusinessProcessDefinition:
      type: object
      required:
        - processCode
        - name
        - purpose
        - ownerName
        - triggerDescription
        - outcomeDescription
        - versionNumber
        - processType
        - diagram
      properties:
        processCode: { type: string }
        name: { type: string }
        purpose: { type: string }
        ownerName: { type: string }
        triggerDescription: { type: string }
        outcomeDescription: { type: string }
        versionNumber: { type: integer, minimum: 1 }
        technicalReference: { type: string, nullable: true }
        processType:
          type: string
          enum: [VALUE_PROCESS, SUBPROCESS]
          description: Classifica a autoridade de negócio ou a capacidade especializada.
        parentProcessCode:
          type: string
          nullable: true
          description: Obrigatório somente para subprocesso e aponta ao processo de valor pai publicado.
        parentProcessDefinitionId:
          type: integer
          format: int64
          readOnly: true
          nullable: true
        parentProcessName:
          type: string
          readOnly: true
          nullable: true
        activities:
          type: array
          readOnly: true
          description: Identidades relacionais dos nós TASK, persistidas na mesma versão do grafo.
          items:
            $ref: "#/components/schemas/BusinessProcessActivityDefinition"
        diagram:
          $ref: "#/components/schemas/ProcessDiagram"
    BusinessProcessActivityDefinition:
      type: object
      required: [id, activityId, name]
      properties:
        id: { type: integer, format: int64, nullable: true }
        activityId: { type: string }
        name: { type: string }
        objective: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
        executionResourceCode: { type: string, nullable: true }
        subprocessCode: { type: string, nullable: true }
    BusinessProcessComposition:
      type: object
      required: [process, subprocessCount, subprocesses]
      properties:
        process:
          $ref: "#/components/schemas/BusinessProcessReference"
        parentProcess:
          allOf:
            - $ref: "#/components/schemas/BusinessProcessReference"
          nullable: true
        subprocessCount:
          type: integer
          minimum: 0
          description: Contagem oficial de subprocessos publicados do processo.
        subprocesses:
          type: array
          items:
            $ref: "#/components/schemas/BusinessProcessReference"
    BusinessProcessReference:
      type: object
      required:
        - id
        - processCode
        - name
        - purpose
        - ownerName
        - versionNumber
        - status
        - processType
      properties:
        id: { type: integer, format: int64 }
        processCode: { type: string }
        name: { type: string }
        purpose: { type: string }
        ownerName: { type: string }
        versionNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        processType: { type: string, enum: [VALUE_PROCESS, SUBPROCESS] }
    ProcessDiagram:
      type: object
      required: [nodes, flows]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ProcessNode" }
        flows:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
              label: { type: string, nullable: true }
    ProcessNode:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { type: string, enum: [START, TASK, GATEWAY, END] }
        label: { type: string }
        owner: { type: string, nullable: true }
        description: { type: string, nullable: true }
        executionResourceCode:
          type: string
          nullable: true
          description: Código opcional de recurso ativo, permitido somente em TASK.
        subprocessCode:
          type: string
          nullable: true
          description: Código de subprocesso publicado, exclusivo em relação ao recurso especializado.
        responsibleAgentKeys:
          type: array
          nullable: true
          uniqueItems: true
          description: Identidades técnicas dos coautores obrigatórios da atividade.
          items: { type: string }
        documentOutput:
          type: object
          nullable: true
          description: Saída documental opcional, permitida somente em TASK.
          required: [label]
          properties:
            label: { type: string, minLength: 1, maxLength: 160 }
    BusinessProcessActivityDocument:
      type: object
      required:
        - taskId
        - title
        - assignedAgentKey
        - assignedAgentNickname
        - costEstimationStatus
        - finishedAt
      properties:
        taskId: { type: integer, format: int64 }
        title: { type: string }
        sourceReference: { type: string, nullable: true }
        assignedAgentKey: { type: string }
        assignedAgentNickname: { type: string }
        resultJson: { type: string, nullable: true }
        evidenceJson: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, format: decimal, nullable: true }
        costEstimationStatus: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time }
        modelCode: { type: string, nullable: true }
        executionMode:
          {
            type: string,
            enum: [MODEL, DETERMINISTIC, NOT_STARTED],
            nullable: true,
          }
        reasoningEffort: { type: string, nullable: true }
        productInternalName: { type: string, nullable: true }
        promptSent: { type: string, nullable: true }
        accessedUrls:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskAuditLink" }
        visualEvidence:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskVisualEvidence" }
        visualAudit:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiqueVisualAudit" }]
        purchaseEmotion:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiquePurchaseEmotion" }]
    BusinessProcessActivityExecutionHistory:
      type: object
      required:
        - selectedProcessDefinitionId
        - processCode
        - processName
        - selectedProcessVersionNumber
        - selectedProcessStatus
        - activityId
        - activityName
        - executions
      properties:
        selectedProcessDefinitionId: { type: integer, format: int64 }
        processCode: { type: string }
        processName: { type: string }
        selectedProcessVersionNumber: { type: integer }
        selectedProcessStatus:
          { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        activityId: { type: string }
        activityName: { type: string }
        activityOwnerName: { type: string, nullable: true }
        executions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/BusinessProcessActivityExecution"
    BusinessProcessActivityExecution:
      type: object
      required:
        - taskId
        - processDefinitionId
        - processVersionNumber
        - title
        - status
        - assignedAgentKey
        - assignedAgentNickname
        - costEstimationStatus
        - createdAt
      properties:
        taskId: { type: integer, format: int64 }
        processDefinitionId: { type: integer, format: int64 }
        processVersionNumber: { type: integer }
        title: { type: string }
        status:
          {
            type: string,
            enum: [PENDING, IN_PROGRESS, COMPLETED, BLOCKED, CANCELLED],
          }
        sourceReference: { type: string, nullable: true }
        assignedAgentKey: { type: string }
        assignedAgentNickname: { type: string }
        comments: { type: string, nullable: true }
        evidenceJson: { type: string, nullable: true }
        executionError: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, format: decimal, nullable: true }
        costEstimationStatus: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        modelCode: { type: string, nullable: true }
        executionMode:
          {
            type: string,
            enum: [MODEL, DETERMINISTIC, NOT_STARTED],
            nullable: true,
          }
        reasoningEffort: { type: string, nullable: true }
        productInternalName: { type: string, nullable: true }
        promptSent: { type: string, nullable: true }
        blockerGuidance:
          type: object
          nullable: true
          properties:
            category:
              type: string
              enum:
                [
                  FUNCTIONAL_ADJUSTMENT,
                  MISSING_EVIDENCE,
                  COMMERCIAL_RISK,
                  AUTHORIZATION_REQUIRED,
                  TECHNICAL_FAILURE,
                ]
            recommendedAction: { type: string }
            helpLinks: { type: array, items: { type: object } }
        accessedUrls:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskAuditLink"
        visualEvidence:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskVisualEvidence" }
        visualAudit:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiqueVisualAudit" }]
        purchaseEmotion:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiquePurchaseEmotion" }]
    AgentTaskAuditLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
        accessMethod: { type: string, nullable: true }
        accessedAt: { type: string, format: date-time, nullable: true }
    AgentTaskVisualEvidence:
      type: object
      required:
        [
          id,
          captureSessionId,
          evidenceKey,
          evidenceType,
          label,
          deviceProfile,
          pageNumber,
          viewportWidth,
          viewportHeight,
          pageHeightPx,
          scrollY,
          sourceUrl,
          finalUrl,
          contentUrl,
          sizeBytes,
          sha256,
          capturedAt,
        ]
      properties:
        id: { type: integer, format: int64 }
        captureSessionId: { type: string }
        evidenceKey: { type: string }
        evidenceType: { type: string, enum: [FULL_PAGE, FOLD] }
        label: { type: string }
        deviceProfile:
          { type: string, enum: [IPHONE_15_PRO, PIXEL_7, DESKTOP_1440] }
        pageNumber: { type: integer, minimum: 1 }
        foldNumber: { type: integer, minimum: 1, nullable: true }
        viewportWidth: { type: integer, minimum: 1 }
        viewportHeight: { type: integer, minimum: 1 }
        pageHeightPx: { type: integer, minimum: 1 }
        scrollY: { type: integer, minimum: 0 }
        sourceUrl: { type: string, format: uri }
        finalUrl: { type: string, format: uri }
        contentUrl: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        capturedAt: { type: string, format: date-time }
    PsiqueVisualAudit:
      type: object
      required:
        [
          captureSessionId,
          mobileFirst,
          fullPageEvidenceIds,
          fullPageContinuity,
          overallAestheticAssessment,
          foldAnalyses,
        ]
      properties:
        captureSessionId: { type: string }
        mobileFirst: { type: boolean, enum: [true] }
        fullPageEvidenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
        fullPageContinuity: { type: string }
        overallAestheticAssessment: { type: string }
        foldAnalyses:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PsiqueVisualFoldAnalysis" }
    PsiqueVisualFoldAnalysis:
      type: object
      required:
        [
          artifactId,
          deviceProfile,
          pageNumber,
          foldNumber,
          aestheticAssessment,
          visualHierarchy,
          legibility,
          emotionEvoked,
          ctaVisibility,
        ]
      properties:
        artifactId: { type: integer, format: int64 }
        deviceProfile: { type: string, enum: [IPHONE_15_PRO] }
        pageNumber: { type: integer, minimum: 1 }
        foldNumber: { type: integer, minimum: 1 }
        aestheticAssessment: { type: string }
        visualHierarchy: { type: string }
        legibility: { type: string }
        emotionEvoked: { type: string }
        ctaVisibility: { type: string }
    PsiquePurchaseEmotion:
      type: object
      required:
        [
          acquisitionExpectation,
          acquisitionAnxiety,
          expectedPostDeliveryFeeling,
          emotionalTension,
          evidenceBoundary,
        ]
      properties:
        acquisitionExpectation: { type: string }
        acquisitionAnxiety: { type: string }
        expectedPostDeliveryFeeling: { type: string }
        emotionalTension: { type: string }
        evidenceBoundary: { type: string }
    ProductProcessActivityExecutionHistory:
      type: object
      required:
        - productId
        - selectedProcessDefinitionId
        - processCode
        - processName
        - selectedProcessVersionNumber
        - selectedProcessStatus
        - activityCount
        - activitiesWithTasksCount
        - uniqueTaskCount
        - knownEstimatedCostUsd
        - costCoverage
        - activities
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string, nullable: true }
        productInternalName: { type: string, nullable: true }
        selectedProcessDefinitionId: { type: integer, format: int64 }
        processCode: { type: string }
        processName: { type: string }
        selectedProcessVersionNumber: { type: integer }
        selectedProcessStatus:
          { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        activityCount: { type: integer, minimum: 0 }
        activitiesWithTasksCount: { type: integer, minimum: 0 }
        uniqueTaskCount: { type: integer, minimum: 0 }
        knownEstimatedCostUsd: { type: number, format: decimal }
        costCoverage:
          {
            type: string,
            enum: [NO_EXECUTIONS, NOT_REPORTED, PARTIAL, COMPLETE],
          }
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ProductProcessActivityExecutionGroup"
    ProductProcessActivityExecutionGroup:
      type: object
      required:
        - activityId
        - activityName
        - sequenceNumber
        - selectedVersionActivity
        - taskCount
        - tasks
        - executionRequestAvailable
        - executionRequestReason
      properties:
        activityDefinitionId: { type: integer, format: int64, nullable: true }
        activityId: { type: string }
        activityName: { type: string }
        activityObjective: { type: string, nullable: true }
        activityOwnerName: { type: string, nullable: true }
        sequenceNumber: { type: integer, minimum: 1 }
        selectedVersionActivity: { type: boolean }
        taskCount: { type: integer, minimum: 0 }
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/BusinessProcessActivityExecution"
        executionRequestAvailable:
          type: boolean
          description: Informa se a atividade inédita ou bloqueada pode iniciar uma tentativa auditável.
        executionRequestReason:
          type: string
          description: Explica a disponibilidade, a preservação da tentativa anterior ou o bloqueio do comando.
    ProductProcessActivityExecutionRequest:
      type: object
      required:
        - processDefinitionId
        - productId
        - activityId
        - sourceReference
        - tasks
        - operationalState
        - objectiveAchieved
        - message
      properties:
        processDefinitionId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        activityId: { type: string }
        sourceReference: { type: string }
        tasks:
          type: array
          items: { type: object }
        operationalState:
          type: string
          enum: [PENDING, IN_PROGRESS, BLOCKED, COMPLETED]
        objectiveAchieved: { type: boolean }
        message: { type: string }
