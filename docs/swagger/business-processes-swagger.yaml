openapi: 3.0.3
info:
  title: Catálogo de processos de negócio
  version: 1.12.0
  description: Cadastro versionado de processos de valor, subprocessos, atividades, documentos e execuções independentes no Marketing Hub.
paths:
  /api/business-processes:
    get:
      summary: Lista as versões dos processos
      responses:
        "200": { description: Catálogo e diagramas persistidos }
    post:
      summary: Cria uma versão em rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProcessDefinition" }
      responses:
        "201": { description: Rascunho criado }
        "400": { description: Grafo ou recurso especializado inválido }
  /api/business-processes/{id}:
    put:
      summary: Atualiza uma versão em rascunho
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProcessDefinition" }
      responses:
        "200": { description: Rascunho atualizado }
        "409": { description: Versão já publicada ou aposentada }
  /api/business-processes/{processDefinitionId}/composition:
    get:
      summary: Exibe a composição hierárquica oficial do processo
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
      responses:
        "200":
          description: Processo, pai opcional e subprocessos publicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProcessComposition"
        "404": { description: Processo não encontrado }
  /api/business-processes/{processDefinitionId}/document-activities:
    get:
      summary: Lista atividades que já produziram documentos concluídos
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
      responses:
        "200":
          description: Identificadores das atividades documentais
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "404": { description: Processo não encontrado }
  /api/business-processes/{processDefinitionId}/documents:
    get:
      summary: Lista os dez documentos mais recentes do processo
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
      responses:
        "200":
          description: Documentos do processo ordenados do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/BusinessProcessActivityDocument"
        "404": { description: Processo não encontrado }
  /api/business-processes/{processDefinitionId}/activities/{activityId}/documents:
    get:
      summary: Lista os dez documentos mais recentes da atividade
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documentos ordenados do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/BusinessProcessActivityDocument"
        "404": { description: Processo ou atividade TASK não encontrada }
  /api/business-processes/{processDefinitionId}/activities/{activityId}/executions:
    get:
      summary: Lista as dez tarefas mais recentes da atividade no processo canônico
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Atividade selecionada e tarefas reais de todas as versões do mesmo processo, incluindo cobertura composta persistida sem duplicar custo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessProcessActivityExecutionHistory"
        "404": { description: Processo ou atividade TASK não encontrada }
  /api/business-processes/{processDefinitionId}/products/{productId}/activity-executions:
    get:
      summary: Lista as atividades e tarefas do produto no processo canônico
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Atividades da versão selecionada e tarefas reais do produto em todas as versões do mesmo processo, com custo único por tarefa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProcessActivityExecutionHistory"
        "404": { description: Processo ou produto não encontrado }
  /api/business-processes/{processDefinitionId}/products/{productId}/activities/{activityId}/execution-requests:
    post:
      summary: Executa o comando backend, abre tarefas ou registra uma decisão humana
      parameters:
        - $ref: "#/components/parameters/ProcessDefinitionId"
        - name: productId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: Obrigatório somente para atividades de aprovação humana.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductProcessActivityExecutionCommand"
      responses:
        "200":
          description: Resultado operacional persistido ou tarefas criadas na referência corrente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductProcessActivityExecutionRequest"
        "404": { description: Processo, produto ou atividade não encontrada }
        "409":
          {
            description: Processo,
            produto,
            atividade,
            estado atual ou contexto sem condição de execução,
          }
  /api/independent-business-process-executions/catalog:
    get:
      summary: Lista processos publicados que podem ser iniciados sem produto
      responses:
        "200":
          description: Catálogo operacional com campos declarados pelo backend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndependentBusinessProcessCatalog"
  /api/independent-business-process-executions:
    get:
      summary: Lista execuções independentes por cursor, sem antecipar o detalhe auditável
      parameters:
        - name: limit
          in: query
          required: false
          description: Quantidade da página; o padrão é 10 e o limite absoluto é 50.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: beforeId
          in: query
          required: false
          description: Busca somente execuções com identificador anterior ao cursor informado.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Página leve com estado, progresso, consumo e causa persistida
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/IndependentBusinessProcessExecutionSummary"
        "400": { description: Limite ou cursor fora do contrato }
    post:
      summary: Inicia idempotentemente um processo sem vínculo com produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartIndependentBusinessProcessExecution"
      responses:
        "201":
          description: Entidade técnica e primeira tarefa BPM criadas na mesma transação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndependentBusinessProcessExecution"
        "400":
          {
            description: Entrada incompatível com os campos declarados pelo backend,
          }
        "409":
          {
            description: Versão,
            escopo,
            adaptador ou chave idempotente incompatível,
          }
  /api/independent-business-process-executions/{executionId}:
    get:
      summary: Detalha atividades e tentativas de uma execução independente
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Resumo consolidado e trilha auditável de tarefas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndependentBusinessProcessExecution"
        "404": { description: Execução independente não encontrada }
components:
  parameters:
    ProcessDefinitionId:
      name: processDefinitionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    BusinessProcessDefinition:
      type: object
      required:
        - processCode
        - name
        - purpose
        - ownerName
        - triggerDescription
        - outcomeDescription
        - versionNumber
        - processType
        - executionScope
        - diagram
      properties:
        processCode: { type: string }
        name: { type: string }
        purpose: { type: string }
        ownerName: { type: string }
        triggerDescription: { type: string }
        outcomeDescription: { type: string }
        versionNumber: { type: integer, minimum: 1 }
        technicalReference: { type: string, nullable: true }
        processType:
          type: string
          enum: [VALUE_PROCESS, SUBPROCESS]
          description: Classifica a autoridade de negócio ou a capacidade especializada.
        executionScope:
          type: string
          enum: [PRODUCT, INDEPENDENT, PRODUCT_OR_INDEPENDENT]
          description: Declara se a versão exige produto, aceita execução independente ou ambos.
        parentProcessCode:
          type: string
          nullable: true
          description: Obrigatório somente para subprocesso e aponta ao processo de valor pai publicado.
        parentProcessDefinitionId:
          type: integer
          format: int64
          readOnly: true
          nullable: true
        parentProcessName:
          type: string
          readOnly: true
          nullable: true
        activities:
          type: array
          readOnly: true
          description: Identidades relacionais dos nós TASK, persistidas na mesma versão do grafo.
          items:
            $ref: "#/components/schemas/BusinessProcessActivityDefinition"
        diagram:
          $ref: "#/components/schemas/ProcessDiagram"
    BusinessProcessActivityDefinition:
      type: object
      required: [id, activityId, name]
      properties:
        id: { type: integer, format: int64, nullable: true }
        activityId: { type: string }
        name: { type: string }
        objective: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
        executionResourceCode: { type: string, nullable: true }
        subprocessCode: { type: string, nullable: true }
    BusinessProcessComposition:
      type: object
      required: [process, subprocessCount, subprocesses]
      properties:
        process:
          $ref: "#/components/schemas/BusinessProcessReference"
        parentProcess:
          allOf:
            - $ref: "#/components/schemas/BusinessProcessReference"
          nullable: true
        subprocessCount:
          type: integer
          minimum: 0
          description: Contagem oficial de subprocessos publicados do processo.
        subprocesses:
          type: array
          items:
            $ref: "#/components/schemas/BusinessProcessReference"
    BusinessProcessReference:
      type: object
      required:
        - id
        - processCode
        - name
        - purpose
        - ownerName
        - versionNumber
        - status
        - processType
      properties:
        id: { type: integer, format: int64 }
        processCode: { type: string }
        name: { type: string }
        purpose: { type: string }
        ownerName: { type: string }
        versionNumber: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        processType: { type: string, enum: [VALUE_PROCESS, SUBPROCESS] }
    ProcessDiagram:
      type: object
      required: [nodes, flows]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ProcessNode" }
        flows:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string }
              to: { type: string }
              label: { type: string, nullable: true }
    ProcessNode:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { type: string, enum: [START, TASK, GATEWAY, END] }
        label: { type: string }
        owner: { type: string, nullable: true }
        description: { type: string, nullable: true }
        executionResourceCode:
          type: string
          nullable: true
          description: Código opcional de recurso ativo, permitido somente em TASK.
        subprocessCode:
          type: string
          nullable: true
          description: Código de subprocesso publicado, exclusivo em relação ao recurso especializado.
        responsibleAgentKeys:
          type: array
          nullable: true
          uniqueItems: true
          description: Identidades técnicas dos coautores obrigatórios da atividade.
          items: { type: string }
        documentOutput:
          type: object
          nullable: true
          description: Saída documental opcional, permitida somente em TASK.
          required: [label]
          properties:
            label: { type: string, minLength: 1, maxLength: 160 }
    BusinessProcessActivityDocument:
      type: object
      required:
        - taskId
        - title
        - assignedAgentKey
        - assignedAgentNickname
        - costEstimationStatus
        - finishedAt
      properties:
        taskId: { type: integer, format: int64 }
        title: { type: string }
        sourceReference: { type: string, nullable: true }
        assignedAgentKey: { type: string }
        assignedAgentNickname: { type: string }
        resultJson: { type: string, nullable: true }
        evidenceJson: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, format: decimal, nullable: true }
        costEstimationStatus: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time }
        modelCode: { type: string, nullable: true }
        executionMode:
          {
            type: string,
            enum: [MODEL, DETERMINISTIC, NOT_STARTED],
            nullable: true,
          }
        reasoningEffort: { type: string, nullable: true }
        productInternalName: { type: string, nullable: true }
        promptSent: { type: string, nullable: true }
        agentPromptPart: { type: string, nullable: true }
        activityPromptPart: { type: string, nullable: true }
        accessedUrls:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskAuditLink" }
        visualEvidence:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskVisualEvidence" }
        visualAudit:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiqueVisualAudit" }]
        purchaseEmotion:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiquePurchaseEmotion" }]
    BusinessProcessActivityExecutionHistory:
      type: object
      required:
        - selectedProcessDefinitionId
        - processCode
        - processName
        - selectedProcessVersionNumber
        - selectedProcessStatus
        - activityId
        - activityName
        - executions
      properties:
        selectedProcessDefinitionId: { type: integer, format: int64 }
        processCode: { type: string }
        processName: { type: string }
        selectedProcessVersionNumber: { type: integer }
        selectedProcessStatus:
          { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        activityId: { type: string }
        activityName: { type: string }
        activityOwnerName: { type: string, nullable: true }
        executions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/BusinessProcessActivityExecution"
    BusinessProcessActivityExecution:
      type: object
      required:
        - taskId
        - processDefinitionId
        - processVersionNumber
        - title
        - status
        - assignedAgentKey
        - assignedAgentNickname
        - costEstimationStatus
        - createdAt
      properties:
        taskId: { type: integer, format: int64 }
        processDefinitionId: { type: integer, format: int64 }
        processVersionNumber: { type: integer }
        title: { type: string }
        status:
          {
            type: string,
            enum: [PENDING, IN_PROGRESS, COMPLETED, BLOCKED, CANCELLED],
          }
        sourceReference: { type: string, nullable: true }
        assignedAgentKey: { type: string }
        assignedAgentNickname: { type: string }
        comments: { type: string, nullable: true }
        evidenceJson: { type: string, nullable: true }
        executionError: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, format: decimal, nullable: true }
        costEstimationStatus: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        modelCode: { type: string, nullable: true }
        executionMode:
          {
            type: string,
            enum: [MODEL, DETERMINISTIC, NOT_STARTED],
            nullable: true,
          }
        reasoningEffort: { type: string, nullable: true }
        productInternalName: { type: string, nullable: true }
        promptSent: { type: string, nullable: true }
        agentPromptPart: { type: string, nullable: true }
        activityPromptPart: { type: string, nullable: true }
        blockerGuidance:
          type: object
          nullable: true
          properties:
            category:
              type: string
              enum:
                [
                  FUNCTIONAL_ADJUSTMENT,
                  MISSING_EVIDENCE,
                  COMMERCIAL_RISK,
                  AUTHORIZATION_REQUIRED,
                  TECHNICAL_FAILURE,
                ]
            recommendedAction: { type: string }
            helpLinks: { type: array, items: { type: object } }
        accessedUrls:
          type: array
          items:
            $ref: "#/components/schemas/AgentTaskAuditLink"
        visualEvidence:
          type: array
          items: { $ref: "#/components/schemas/AgentTaskVisualEvidence" }
        visualAudit:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiqueVisualAudit" }]
        purchaseEmotion:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PsiquePurchaseEmotion" }]
    AgentTaskAuditLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
        accessMethod: { type: string, nullable: true }
        accessedAt: { type: string, format: date-time, nullable: true }
    AgentTaskVisualEvidence:
      type: object
      required:
        [
          id,
          captureSessionId,
          evidenceKey,
          evidenceType,
          label,
          deviceProfile,
          pageNumber,
          viewportWidth,
          viewportHeight,
          pageHeightPx,
          scrollY,
          sourceUrl,
          finalUrl,
          contentUrl,
          sizeBytes,
          sha256,
          capturedAt,
        ]
      properties:
        id: { type: integer, format: int64 }
        captureSessionId: { type: string }
        evidenceKey: { type: string }
        evidenceType: { type: string, enum: [FULL_PAGE, FOLD] }
        label: { type: string }
        deviceProfile:
          { type: string, enum: [IPHONE_15_PRO, PIXEL_7, DESKTOP_1440] }
        pageNumber: { type: integer, minimum: 1 }
        foldNumber: { type: integer, minimum: 1, nullable: true }
        viewportWidth: { type: integer, minimum: 1 }
        viewportHeight: { type: integer, minimum: 1 }
        pageHeightPx: { type: integer, minimum: 1 }
        scrollY: { type: integer, minimum: 0 }
        sourceUrl: { type: string, format: uri }
        finalUrl: { type: string, format: uri }
        contentUrl: { type: string }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, minLength: 64, maxLength: 64 }
        capturedAt: { type: string, format: date-time }
    PsiqueVisualAudit:
      type: object
      required:
        [
          captureSessionId,
          mobileFirst,
          fullPageEvidenceIds,
          fullPageContinuity,
          overallAestheticAssessment,
          foldAnalyses,
        ]
      properties:
        captureSessionId: { type: string }
        mobileFirst: { type: boolean, enum: [true] }
        fullPageEvidenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, format: int64 }
        fullPageContinuity: { type: string }
        overallAestheticAssessment: { type: string }
        foldAnalyses:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PsiqueVisualFoldAnalysis" }
    PsiqueVisualFoldAnalysis:
      type: object
      required:
        [
          artifactId,
          deviceProfile,
          pageNumber,
          foldNumber,
          aestheticAssessment,
          visualHierarchy,
          legibility,
          emotionEvoked,
          ctaVisibility,
        ]
      properties:
        artifactId: { type: integer, format: int64 }
        deviceProfile: { type: string, enum: [IPHONE_15_PRO] }
        pageNumber: { type: integer, minimum: 1 }
        foldNumber: { type: integer, minimum: 1 }
        aestheticAssessment: { type: string }
        visualHierarchy: { type: string }
        legibility: { type: string }
        emotionEvoked: { type: string }
        ctaVisibility: { type: string }
    PsiquePurchaseEmotion:
      type: object
      required:
        [
          acquisitionExpectation,
          acquisitionAnxiety,
          expectedPostDeliveryFeeling,
          emotionalTension,
          evidenceBoundary,
        ]
      properties:
        acquisitionExpectation: { type: string }
        acquisitionAnxiety: { type: string }
        expectedPostDeliveryFeeling: { type: string }
        emotionalTension: { type: string }
        evidenceBoundary: { type: string }
    ProductProcessActivityExecutionHistory:
      type: object
      required:
        - productId
        - selectedProcessDefinitionId
        - processCode
        - processName
        - selectedProcessVersionNumber
        - selectedProcessStatus
        - activityCount
        - activitiesWithTasksCount
        - uniqueTaskCount
        - knownEstimatedCostUsd
        - costCoverage
        - activities
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string, nullable: true }
        productInternalName: { type: string, nullable: true }
        selectedProcessDefinitionId: { type: integer, format: int64 }
        processCode: { type: string }
        processName: { type: string }
        selectedProcessVersionNumber: { type: integer }
        selectedProcessStatus:
          { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        activityCount: { type: integer, minimum: 0 }
        activitiesWithTasksCount: { type: integer, minimum: 0 }
        uniqueTaskCount: { type: integer, minimum: 0 }
        knownEstimatedCostUsd: { type: number, format: decimal }
        costCoverage:
          {
            type: string,
            enum: [NO_EXECUTIONS, NOT_REPORTED, PARTIAL, COMPLETE],
          }
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ProductProcessActivityExecutionGroup"
    ProductProcessActivityExecutionGroup:
      type: object
      required:
        - activityId
        - activityName
        - sequenceNumber
        - selectedVersionActivity
        - taskCount
        - tasks
        - executionRequestAvailable
        - executionRequestReason
        - executionControl
      properties:
        activityDefinitionId: { type: integer, format: int64, nullable: true }
        activityId: { type: string }
        activityName: { type: string }
        activityObjective: { type: string, nullable: true }
        activityOwnerName: { type: string, nullable: true }
        sequenceNumber: { type: integer, minimum: 1 }
        selectedVersionActivity: { type: boolean }
        taskCount: { type: integer, minimum: 0 }
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/BusinessProcessActivityExecution"
        executionRequestAvailable:
          type: boolean
          description: Informa se a atividade inédita ou bloqueada pode iniciar uma tentativa auditável.
        executionRequestReason:
          type: string
          description: Explica a disponibilidade, a preservação da tentativa anterior ou o bloqueio do comando.
        executionControl:
          $ref: "#/components/schemas/ProductProcessActivityExecutionControl"
    ProductProcessActivityRequirement:
      type: object
      required: [code, title, satisfied, detail, recommendation]
      properties:
        code: { type: string }
        title: { type: string }
        satisfied: { type: boolean }
        detail: { type: string }
        recommendation: { type: string }
    ProductProcessActivityExecutionControl:
      type: object
      required:
        - executorType
        - interactionType
        - description
        - actionAvailable
        - availabilityReason
        - confirmationRequired
        - requirements
      properties:
        executorType:
          type: string
          enum: [AGENT, BACKEND, HUMAN, HISTORICAL, UNCONFIGURED]
        interactionType:
          type: string
          enum: [COMMAND, WORKSPACE, APPROVAL, SUBPROCESS, AUTOMATIC, STATUS]
        actionLabel: { type: string, nullable: true }
        description: { type: string }
        actionAvailable: { type: boolean }
        availabilityReason: { type: string }
        confirmationRequired: { type: boolean }
        confirmationTitle: { type: string, nullable: true }
        confirmationMessage: { type: string, nullable: true }
        confirmationToken: { type: string, nullable: true }
        workspaceCode:
          type: string
          nullable: true
          enum: [EXPERIMENT_PREFLIGHT, EXPERIMENT_ACTIVATION]
        workspaceReferenceId: { type: integer, format: int64, nullable: true }
        targetProcessDefinitionId:
          { type: integer, format: int64, nullable: true }
        decisionMode:
          type: string
          enum: [DETAILED, REVIEW_AND_ACCEPT]
          description: Define se a decisão exige formulário completo ou apenas revisão e aceite.
        auditEvidenceReference:
          type: string
          nullable: true
          description: Referência persistida que o backend registrará sem exigir redigitação.
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/ProductProcessActivityRequirement"
    ProductProcessActivityExecutionCommand:
      type: object
      description: Decisão explícita exigida para uma atividade de aprovação humana.
      required:
        - decision
        - confirmationToken
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        operatorName:
          type: string
          minLength: 3
          maxLength: 191
          description: Obrigatório no modo DETAILED; resolvido pelo backend em REVIEW_AND_ACCEPT.
        justification:
          type: string
          minLength: 10
          maxLength: 2000
          description: Obrigatória no modo DETAILED e em reprovação; gerada pelo backend na aprovação simplificada.
        evidenceReference:
          type: string
          minLength: 3
          maxLength: 1000
          description: Obrigatória no modo DETAILED; resolvida pelo backend em REVIEW_AND_ACCEPT.
        confirmationToken: { type: string }
    ProductProcessActivityExecutionRequest:
      type: object
      required:
        - processDefinitionId
        - productId
        - activityId
        - sourceReference
        - tasks
        - operationalState
        - objectiveAchieved
        - message
      properties:
        processDefinitionId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        activityId: { type: string }
        sourceReference: { type: string }
        tasks:
          type: array
          items: { type: object }
        operationalState:
          type: string
          enum: [PENDING, IN_PROGRESS, BLOCKED, COMPLETED]
        objectiveAchieved: { type: boolean }
        message: { type: string }
    IndependentBusinessProcessInputField:
      type: object
      required: [key, label, controlType, required]
      properties:
        key: { type: string }
        label: { type: string }
        controlType: { type: string, enum: [TEXT, TEXTAREA, SELECT] }
        required: { type: boolean }
        maxLength: { type: integer, nullable: true }
        defaultValue: { type: string, nullable: true }
        helpText: { type: string, nullable: true }
        options:
          type: array
          description: Opções canônicas exigidas quando controlType for SELECT.
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessInputOption"
    IndependentBusinessProcessInputOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    IndependentBusinessProcessCatalog:
      type: object
      required:
        [
          processDefinitionId,
          processCode,
          name,
          purpose,
          ownerName,
          triggerDescription,
          outcomeDescription,
          versionNumber,
          executionAvailable,
          executionAvailabilityReason,
          inputFields,
        ]
      properties:
        processDefinitionId: { type: integer, format: int64 }
        processCode: { type: string }
        name: { type: string }
        purpose: { type: string }
        ownerName: { type: string }
        triggerDescription: { type: string }
        outcomeDescription: { type: string }
        versionNumber: { type: integer }
        executionAvailable: { type: boolean }
        executionAvailabilityReason: { type: string }
        inputFields:
          type: array
          items:
            {
              $ref: "#/components/schemas/IndependentBusinessProcessInputField",
            }
    StartIndependentBusinessProcessExecution:
      type: object
      required: [requestKey, processDefinitionId, requestedByName, input]
      properties:
        requestKey: { type: string, format: uuid }
        processDefinitionId: { type: integer, format: int64 }
        requestedByName: { type: string, maxLength: 100 }
        input:
          type: object
          additionalProperties: { type: string }
          description: Não admite productId nem experimentId; campos aceitos vêm do catálogo.
    IndependentBusinessProcessExecutionSummary:
      type: object
      required:
        [
          id,
          requestKey,
          processDefinitionId,
          processCode,
          processName,
          processVersionNumber,
          sourceReference,
          displayName,
          requestedByName,
          input,
          status,
          activityCount,
          completedActivityCount,
          costCoverage,
          createdAt,
        ]
      properties:
        id: { type: integer, format: int64 }
        requestKey: { type: string, format: uuid }
        processDefinitionId: { type: integer, format: int64 }
        processCode: { type: string }
        processName: { type: string }
        processVersionNumber: { type: integer }
        sourceReference: { type: string }
        displayName: { type: string }
        requestedByName: { type: string }
        input: { type: object, additionalProperties: { type: string } }
        status:
          type: string
          enum:
            [NOT_STARTED, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]
        activityCount: { type: integer, minimum: 0 }
        completedActivityCount: { type: integer, minimum: 0 }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, nullable: true }
        costCoverage: { type: string, enum: [COMPLETE, PARTIAL, NOT_REPORTED] }
        latestError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    IndependentBusinessProcessExecution:
      type: object
      required: [execution, activities]
      properties:
        execution:
          $ref: "#/components/schemas/IndependentBusinessProcessExecutionSummary"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessActivity"
        processReport:
          allOf:
            - $ref: "#/components/schemas/IndependentBusinessProcessFlowReport"
          nullable: true
    IndependentBusinessProcessActivity:
      type: object
      required: [activityId, activityName, status, tasks]
      properties:
        activityId: { type: string }
        activityName: { type: string }
        status:
          type: string
          enum:
            [NOT_STARTED, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessTask"
    IndependentBusinessProcessTask:
      type: object
      required:
        [
          taskId,
          processDefinitionId,
          processVersionNumber,
          sourceReference,
          status,
          assignedAgentKey,
          assignedAgentNickname,
          title,
          costEstimationStatus,
          createdAt,
        ]
      properties:
        taskId: { type: integer, format: int64 }
        processDefinitionId: { type: integer, format: int64 }
        processVersionNumber: { type: integer }
        sourceReference: { type: string }
        status: { type: string }
        assignedAgentKey: { type: string }
        assignedAgentNickname: { type: string }
        title: { type: string }
        result: { type: object, nullable: true, additionalProperties: true }
        evidence: { type: object, nullable: true, additionalProperties: true }
        executionError: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, nullable: true }
        costEstimationStatus: { type: string }
        modelCode: { type: string, nullable: true }
        executionMode:
          type: string
          nullable: true
          enum: [MODEL, DETERMINISTIC, NOT_STARTED]
        reasoningEffort: { type: string, nullable: true }
        productInternalName:
          type: string
          nullable: true
          description: Permanece nulo em uma execução independente sem vínculo artificial a produto.
        promptSent: { type: string, nullable: true }
        agentPromptPart: { type: string, nullable: true }
        activityPromptPart: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    IndependentBusinessProcessFlowReport:
      type: object
      required:
        [
          reportType,
          status,
          headline,
          acquisitionChannel,
          candidateCount,
          dossierReadyCount,
          plannedProductCount,
          privateValidationHandoff,
          sourceCoverage,
          candidates,
        ]
      properties:
        reportType:
          { type: string, enum: [PDE_OPPORTUNITY_TO_PRIVATE_VALIDATION_V2] }
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, BLOCKED, COMPLETED]
        headline: { type: string }
        acquisitionChannel: { type: string, enum: [Instagram] }
        candidateCount: { type: integer, minimum: 0, maximum: 3 }
        dossierReadyCount: { type: integer, minimum: 0, maximum: 3 }
        plannedProductCount: { type: integer, minimum: 0, maximum: 1 }
        privateValidationHandoff:
          $ref: "#/components/schemas/IndependentBusinessProcessPrivateValidationHandoff"
        sourceCoverage:
          type: array
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessSourceCoverage"
        marketExpansion:
          allOf:
            - $ref: "#/components/schemas/IndependentBusinessProcessMarketExpansion"
          nullable: true
        candidates:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessCandidate"
    IndependentBusinessProcessPrivateValidationHandoff:
      type: object
      required: [available, cycleId, status, actionLabel, reason]
      properties:
        available: { type: boolean }
        cycleId: { type: integer, format: int64 }
        status:
          type: string
          enum:
            [
              AVAILABLE,
              WAITING_RESEARCH,
              NO_READY_DOSSIER,
              PRODUCT_PLANNED,
              IN_PROGRESS,
              MATERIALIZATION_PENDING,
            ]
        actionLabel: { type: string, enum: [Retomar com Atena] }
        reason: { type: string }
    IndependentBusinessProcessSourceCoverage:
      type: object
      required: [sourceCode, label, status, itemCount, summary]
      properties:
        sourceCode: { type: string, enum: [WEB, META, PESQUISAS, MARKETPLACE] }
        label: { type: string }
        status:
          {
            type: string,
            enum:
              [
                IN_PROGRESS,
                OBSERVED,
                OBSERVED_EMPTY,
                AWAITING_OBSERVATION,
                UNAVAILABLE,
                MISSING,
                BLOCKED,
              ],
          }
        itemCount: { type: integer, minimum: 0 }
        summary: { type: string }
    IndependentBusinessProcessMarketExpansion:
      type: object
      required: [attemptsCompleted, maxAttempts, attempts]
      properties:
        strategyCode: { type: string, nullable: true }
        attemptsCompleted: { type: integer, minimum: 1, maximum: 3 }
        maxAttempts: { type: integer, minimum: 1, maximum: 3 }
        stopReason:
          type: string
          nullable: true
          enum:
            [
              DOSSIER_READY_FOUND,
              NO_NEW_EVIDENCE,
              REPEATED_RESEARCH_LENS,
              EXPANSION_NOT_APPLICABLE,
              ATTEMPT_LIMIT_REACHED,
            ]
        stopSummary: { type: string, nullable: true }
        finalResearchLens: { type: string, nullable: true }
        attempts:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessMarketExpansionAttempt"
    IndependentBusinessProcessMarketExpansionAttempt:
      type: object
      required:
        [
          attemptNumber,
          newPublicEvidenceCount,
          newComparableOfferCount,
          newMetaAdCount,
          candidateCount,
          dossierReadyCount,
          metaAdsObserved,
          metaAdvertisersObserved,
        ]
      properties:
        attemptNumber: { type: integer, minimum: 1, maximum: 3 }
        researchLens: { type: string, nullable: true }
        expansionAxis: { type: string, nullable: true }
        rationale: { type: string, nullable: true }
        newPublicEvidenceCount: { type: integer, minimum: 0 }
        newComparableOfferCount: { type: integer, minimum: 0 }
        newMetaAdCount: { type: integer, minimum: 0 }
        candidateCount: { type: integer, minimum: 0, maximum: 3 }
        dossierReadyCount: { type: integer, minimum: 0, maximum: 3 }
        outcome:
          type: string
          nullable: true
          enum:
            [
              ADJUST_AND_CONTINUE,
              DOSSIER_READY_FOUND,
              NO_NEW_EVIDENCE,
              REPEATED_RESEARCH_LENS,
              EXPANSION_NOT_APPLICABLE,
              ATTEMPT_LIMIT_REACHED,
            ]
        metaQuery: { type: string, nullable: true }
        metaCoverageStatus: { type: string, nullable: true }
        metaCollectionMode: { type: string, nullable: true }
        metaAdsObserved: { type: integer, minimum: 0 }
        metaAdvertisersObserved: { type: integer, minimum: 0 }
        metaCoverageSummary: { type: string, nullable: true }
        metaSearchUrl: { type: string, format: uri, nullable: true }
    IndependentBusinessProcessCandidate:
      type: object
      required:
        [
          opportunityId,
          name,
          maturity,
          decision,
          observedLanguage,
          currentAlternatives,
          nextAction,
          sources,
          stages,
        ]
      properties:
        opportunityId: { type: integer, format: int64 }
        name: { type: string }
        primaryAudience: { type: string, nullable: true }
        rootPain: { type: string, nullable: true }
        score: { type: number, nullable: true }
        maturity:
          type: string
          enum: [SIGNAL, RESEARCHABLE, DOSSIER_READY, HUMAN_REVIEW, REJECTED]
        decision:
          { type: string, enum: [APPROVE, RESEARCH_MORE, HUMAN_REVIEW, REJECT] }
        purchaseSituation: { type: string, nullable: true }
        observedLanguage: { type: array, items: { type: string } }
        currentAlternatives: { type: array, items: { type: string } }
        residualEffort: { type: string, nullable: true }
        instagramFitEvidence: { type: string, nullable: true }
        commercialRisk: { type: string, nullable: true }
        dossierId: { type: integer, format: int64, nullable: true }
        dossierStatus: { type: string, nullable: true }
        commercialPlanId: { type: integer, format: int64, nullable: true }
        productId: { type: integer, format: int64, nullable: true }
        productName: { type: string, nullable: true }
        productStatus: { type: string, nullable: true }
        nextAction: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessCandidateSource"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/IndependentBusinessProcessCandidateStage"
    IndependentBusinessProcessCandidateSource:
      type: object
      required: [sourceType, title]
      properties:
        sourceType: { type: string, enum: [WEB, META, PESQUISAS, MARKETPLACE] }
        title: { type: string }
        url: { type: string, nullable: true }
        evidence: { type: string, nullable: true }
    IndependentBusinessProcessCandidateStage:
      type: object
      required: [stageCode, label, agent, status]
      properties:
        stageCode:
          { type: string, enum: [ARGOS, ATENA, PLUTUS, DEDALO, PRODUCT] }
        label: { type: string }
        agent: { type: string }
        status: { type: string }
        decision: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        taskId: { type: integer, format: int64, nullable: true }
        estimatedCostUsd: { type: number, nullable: true }
        blocker: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
