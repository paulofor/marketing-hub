openapi: 3.0.3
info:
  title: Customer Agent Hybrid Memory API
  version: v1
paths:
  /api/customer-agent/v1/evaluations:
    post:
      summary: Agenda avaliação baseline ou comparação comportamental v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEvaluation'
      responses:
        '200': { description: Avaliação persistida e pendente }
    get:
      summary: Lista avaliações com baseline e resultado comportamental separados
      responses:
        '200': { description: Histórico auditável das avaliações }
  /api/customer-agent/v1/internal/evaluations/pending/claim:
    post:
      summary: Reserva a próxima avaliação para o customer-agent-worker
      responses:
        '200': { description: Avaliação reservada }
        '404': { description: Nenhuma avaliação pendente }
  /api/customer-agent/v1/personas/{personaId}/memory-motivations:
    get:
      summary: Lista o histórico append-only dos vetores motivacionais da persona
      parameters:
        - in: path
          name: personaId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Hipóteses simuladas e confirmações humanas com origem separada }
  /api/customer-agent/v1/personas/{personaId}/memory-evidence:
    get:
      summary: Lista metadados das evidências privadas de uma persona
      parameters:
        - in: path
          name: personaId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Evidências auditáveis }
    post:
      summary: Preserva evidência pesada no S3 e procedência no MySQL
      parameters:
        - in: path
          name: personaId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [memoryLayer, file]
              properties:
                observationId: { type: integer, format: int64 }
                memoryLayer:
                  type: string
                  enum: [EXTERNAL_OBSERVATION, SIMULATED_INTERPRETATION, COMMERCIAL_HYPOTHESIS, HUMAN_RESULT, CONFIRMED_LEARNING]
                sourceUrl: { type: string, format: uri }
                file: { type: string, format: binary }
      responses:
        '200': { description: Evidência criada ou deduplicada }
  /api/customer-agent/v1/memory-evidence/{id}/content:
    get:
      summary: Recupera conteúdo privado pelo backend
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Conteúdo original da evidência }
components:
  schemas:
    StartEvaluation:
      type: object
      required: [personaId, assetType, assetReference]
      properties:
        personaId: { type: integer, format: int64 }
        assetType: { type: string, enum: [PAGE, VIDEO, OFFER] }
        assetReference: { type: string, maxLength: 255 }
        simulationVersion:
          type: string
          enum: [BASELINE_V1, BEHAVIORAL_V1]
          default: BASELINE_V1
    MotivationalVector:
      type: object
      required: [motivationalDirection, painIntensity, pleasureIntensity, fearWeight, frustrationWeight, effortWeight, reliefWeight, desireWeight, trustWeight, belongingWeight, evidenceStrength, confidenceScore, sourceReference, rationale]
      properties:
        motivationalDirection: { type: string, enum: [AWAY_FROM_PAIN, TOWARD_PLEASURE, MIXED] }
        painIntensity: { type: integer, minimum: 0, maximum: 5 }
        pleasureIntensity: { type: integer, minimum: 0, maximum: 5 }
        fearWeight: { type: integer, minimum: 0, maximum: 5 }
        frustrationWeight: { type: integer, minimum: 0, maximum: 5 }
        effortWeight: { type: integer, minimum: 0, maximum: 5 }
        reliefWeight: { type: integer, minimum: 0, maximum: 5 }
        desireWeight: { type: integer, minimum: 0, maximum: 5 }
        trustWeight: { type: integer, minimum: 0, maximum: 5 }
        belongingWeight: { type: integer, minimum: 0, maximum: 5 }
        evidenceStrength: { type: integer, minimum: 0, maximum: 5 }
        confidenceScore: { type: integer, minimum: 0, maximum: 5 }
        sourceReference: { type: string }
        rationale: { type: string }
