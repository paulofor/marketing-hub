openapi: 3.0.3
info:
  title: Marketing Hub Experiment Cockpit API
  version: 1.1.0
paths:
  /api/experiments/{id}/cockpit:
    get:
      summary: Retorna o cockpit comercial consolidado do experimento.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Cockpit comercial do experimento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentCockpit"
components:
  schemas:
    ExperimentCockpit:
      type: object
      required:
        - experimentId
        - experimentName
        - scoreboard
        - question
        - health
        - sampleDecision
        - funnel
        - bottleneck
        - learnings
        - nextActions
      properties:
        experimentId:
          type: integer
          format: int64
        experimentName:
          type: string
        status:
          type: string
        experimentType:
          type: string
        campaignObjective:
          type: string
        scoreboard:
          $ref: "#/components/schemas/ExperimentCockpitScoreboard"
        question:
          $ref: "#/components/schemas/ExperimentCockpitQuestion"
        health:
          $ref: "#/components/schemas/ExperimentCockpitHealth"
        sampleDecision:
          $ref: "#/components/schemas/ExperimentCockpitSampleDecision"
        funnel:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentCockpitFunnelStage"
        bottleneck:
          $ref: "#/components/schemas/ExperimentCockpitBottleneck"
        learnings:
          type: array
          items:
            type: string
        nextActions:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentCockpitAction"
    ExperimentCockpitScoreboard:
      type: object
      properties:
        spend:
          type: number
        revenue:
          type: number
        margin:
          type: number
        roas:
          type: number
        impressions:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
        ctr:
          type: number
        cpc:
          type: number
        directContacts:
          type: integer
          format: int64
        directContactTarget:
          type: integer
        humanVisitors:
          type: integer
          format: int64
          description: Visitantes humanos distintos atribuídos ao experimento e segregados de QA, robôs e crawlers.
        pageViews:
          type: integer
          format: int64
        partialVideoViews:
          type: integer
          format: int64
        completeVideoViews:
          type: integer
          format: int64
        leads:
          type: integer
          format: int64
        checkoutAccesses:
          type: integer
          format: int64
        purchases:
          type: integer
          format: int64
        costPerLead:
          type: number
        costPerCheckoutAccess:
          type: number
        costPerPurchase:
          type: number
    ExperimentCockpitQuestion:
      type: object
      properties:
        pain:
          type: string
        promise:
          type: string
        mechanism:
          type: string
        offer:
          type: string
        primaryCta:
          type: string
        primaryVariable:
          type: string
        primaryMetric:
          type: string
    ExperimentCockpitHealth:
      type: object
      properties:
        status:
          type: string
        headline:
          type: string
        description:
          type: string
        blockers:
          type: array
          items:
            type: string
    ExperimentCockpitSampleDecision:
      type: object
      required:
        - applicable
        - measurementAvailable
        - measurementSource
        - status
        - headline
        - explanation
        - humanVisitors
        - initialTargetVisitors
        - visitorsRemainingForInitialDecision
        - targetPurchasesAtInitialDecision
        - precisionTargetVisitors
        - visitorsRemainingForPrecisionDecision
        - purchases
        - zeroPrimaryResultStopSpend
        - projectionConfidence
        - financialGuardrail
        - recommendation
      properties:
        applicable:
          type: boolean
          description: Indica se a estratégia de visitantes pagos se aplica ao objetivo e canal.
        measurementAvailable:
          type: boolean
        measurementSource:
          type: string
        status:
          type: string
          enum:
            - NOT_APPLICABLE
            - MEASUREMENT_UNAVAILABLE
            - MEASUREMENT_INVALID
            - CONFIGURATION_REQUIRED
            - INSUFFICIENT_DATA
            - INITIAL_TARGET_REACHED
            - INITIAL_ZERO_SALES_REJECTED
            - INITIAL_TARGET_NOT_REACHED
            - PRECISION_TARGET_REACHED
            - PRECISION_TARGET_NOT_REACHED
        headline:
          type: string
        explanation:
          type: string
        humanVisitors:
          type: integer
          format: int64
        initialTargetVisitors:
          type: integer
        visitorsRemainingForInitialDecision:
          type: integer
          format: int64
        targetPurchasesAtInitialDecision:
          type: integer
        precisionTargetVisitors:
          type: integer
        visitorsRemainingForPrecisionDecision:
          type: integer
          format: int64
        purchases:
          type: integer
          format: int64
        observedPurchaseRatePercent:
          type: number
          nullable: true
        confidenceLower95Percent:
          type: number
          nullable: true
          description: Limite inferior bilateral exato de Clopper-Pearson em percentual.
        confidenceUpper95Percent:
          type: number
          nullable: true
          description: Limite superior bilateral exato de Clopper-Pearson em percentual.
        zeroPurchaseUpper95Percent:
          type: number
          nullable: true
          description: Limite superior unilateral exato de 95% quando não há compra.
        estimatedCostPerHumanVisitor:
          type: number
          nullable: true
        projectedSpendForInitialTarget:
          type: number
          nullable: true
        projectedSpendForPrecisionTarget:
          type: number
          nullable: true
        zeroPrimaryResultStopSpend:
          type: number
          description: Gasto em BRL que aciona a parada automática quando não existe resultado primário.
        mediaSpendLimit:
          type: number
          nullable: true
        initialTargetFitsMediaSpendLimit:
          type: boolean
          nullable: true
        precisionTargetFitsMediaSpendLimit:
          type: boolean
          nullable: true
        projectionConfidence:
          type: string
          enum: [NOT_APPLICABLE, UNAVAILABLE, PRELIMINARY, OBSERVED]
        financialGuardrail:
          type: string
        recommendation:
          type: string
    ExperimentCockpitFunnelStage:
      type: object
      properties:
        stage:
          type: string
        label:
          type: string
        order:
          type: integer
        totalCount:
          type: integer
          format: int64
        uniqueCount:
          type: integer
          format: int64
        lastEventAt:
          type: string
          format: date-time
        source:
          type: string
    ExperimentCockpitBottleneck:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        severity:
          type: string
        diagnosis:
          type: string
        commercialImpact:
          type: string
        recommendedFocus:
          type: string
    ExperimentCockpitAction:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        rationale:
          type: string
        targetRoute:
          type: string
