openapi: 3.0.3
info:
  title: Estrategista de Experimentos v1
  version: 1.4.0
paths:
  /api/experiment-strategist/v1/commercial-plans/{planId}/executions:
    post:
      summary: Solicita uma pesquisa estrategica somente leitura.
      responses:
        '200': {description: Pesquisa colocada na fila}
        '400': {description: Pergunta de pesquisa ausente}
    get:
      summary: Lista pesquisas, pareceres, fontes e falhas do planejamento.
      responses:
        '200': {description: Historico auditavel}
  /api/experiment-strategist/v1/internal/executions/pending/claim:
    post:
      summary: Reserva a pesquisa pendente mais antiga para o worker.
      responses:
        '200': {description: Pesquisa reservada}
        '404': {description: Fila vazia}
  /api/experiment-strategist/v1/internal/executions/{id}/complete:
    post:
      summary: Persiste diagnóstico, inteligência de mercado, três alternativas, posicionamento, fontes e recomendação sem executá-la.
      responses:
        '200': {description: Parecer persistido}
        '409': {description: Execucao fora do estado RUNNING}
  /api/experiment-strategist/v1/internal/executions/{id}/behavioral-snapshots/reserve:
    post:
      summary: Reserva uma consulta agregada e segregada do Microsoft Clarity.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReserveBehavioralSnapshotRequest'}
      responses:
        '200': {description: Consulta reservada com texto canônico}
        '400': {description: Dimensão, janela ou experimento inválido}
        '429': {description: Cota segura por execução ou por dia atingida}
  /api/experiment-strategist/v1/internal/executions/{id}/behavioral-snapshots/{snapshotId}/complete:
    post:
      summary: Persiste a resposta bruta agregada do MCP oficial do Clarity.
      responses:
        '200': {description: Snapshot agregado concluído e auditável}
        '409': {description: Snapshot ou execução fora do estado esperado}
  /api/experiment-strategist/v1/internal/executions/{id}/behavioral-snapshots/{snapshotId}/fail:
    post:
      summary: Persiste a falha técnica da consulta Clarity sem inventar evidência.
      responses:
        '200': {description: Falha do snapshot persistida}
  /api/experiment-strategist/v1/internal/executions/{id}/fail:
    post:
      summary: Persiste a causa detalhada da falha do worker.
      responses:
        '200': {description: Falha persistida}
  /api/experiment-strategist/v1/commercial-plans/{planId}/research-context:
    get:
      summary: Consolida funil, aprendizados e memoria comportamental vigente.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: Contexto somente leitura}
  /api/experiment-strategist/v1/memory:
    post:
      summary: Registra hipotese ou aprendizado comportamental auditavel.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMemoryRequest'}
      responses:
        '200': {description: Memoria registrada}
        '400': {description: Contrato invalido ou confirmacao sem resultado posterior}
  /api/experiment-strategist/v1/commercial-plans/{planId}/memory:
    get:
      summary: Lista memorias vigentes do planejamento.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: Memorias vigentes}
  /api/experiment-strategist/v1/memory/{memoryId}/artifacts:
    post:
      summary: Anonimiza e armazena artefato textual no S3 privado.
      parameters:
        - in: path
          name: memoryId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtifactRequest'}
      responses:
        '200': {description: Metadados seguros do artefato}
        '503': {description: Bucket nao configurado}
components:
  schemas:
    ReserveBehavioralSnapshotRequest:
      type: object
      required: [experimentId, dimension, windowDays]
      properties:
        experimentId: {type: integer, format: int64, minimum: 1}
        dimension: {type: string, enum: [PAGE, SOURCE, DEVICE]}
        windowDays: {type: integer, minimum: 1, maximum: 3}
    CreateMemoryRequest:
      type: object
      required: [commercialPlanId, behavioralMechanism, statement, evidenceLevel, confidence, validationStatus]
      properties:
        commercialPlanId: {type: integer, format: int64}
        executionId: {type: integer, format: int64}
        behavioralMechanism: {type: string}
        statement: {type: string}
        evidenceLevel: {type: string}
        confidence: {type: string}
        validationStatus: {type: string}
        sourceReferences: {type: array, items: {type: object}}
        observedOutcome: {type: string}
        validityDays: {type: integer, minimum: 1}
    ArtifactRequest:
      type: object
      required: [artifactType, content]
      properties:
        artifactType: {type: string}
        sourceUrl: {type: string}
        content: {type: string, description: Texto anonimizado pelo backend antes do S3}
