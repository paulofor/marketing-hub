openapi: 3.0.3
info:
  title: Experiment Video Assets API
  version: "1.0"
  description: Contratos para registrar vídeos como ativos mensuráveis de experimentos.
paths:
  /api/experiments/{experimentId}/video-assets:
    get:
      summary: Lista vídeos de um experimento
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Vídeos encontrados
    post:
      summary: Cria vídeo comercial para um experimento
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentVideoAssetRequest"
      responses:
        "200":
          description: Vídeo criado
  /api/experiments/{experimentId}/video-assets/{videoAssetId}:
    patch:
      summary: Atualiza vídeo comercial de um experimento
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: videoAssetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperimentVideoAssetRequest"
      responses:
        "200":
          description: Vídeo atualizado
  /api/experiments/{experimentId}/video-assets/veo-render-requests:
    post:
      summary: Solicita vídeo VEO com roteiro e personagem registrados no Marketing Hub
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestExperimentVeoVideoRequest"
      responses:
        "200":
          description: Job VEO criado e vinculado ao experimento
  /api/experiments/{experimentId}/video-assets/planned-render-requests:
    post:
      summary: Solicita render dos vídeos planejados preservando os ativos existentes
      description: Para ativos `LANDING_HERO` com Luma, o backend normaliza duração curta legada para hero comercial de 30s e registra metadados de estratégia híbrida, recomendando derivados de 10-15s para mídia paga.
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPlannedExperimentVideoRenderRequest"
      responses:
        "200":
          description: Jobs criados e vinculados aos ativos planejados
components:
  schemas:
    CreateExperimentVideoAssetRequest:
      type: object
      required:
        - slot
        - objective
        - primaryMetric
        - provider
        - model
      properties:
        slot:
          type: string
          enum: [AD, LANDING_HERO, FORM_EXPLAINER, PRE_CHECKOUT]
        objective:
          type: string
        primaryMetric:
          type: string
        script:
          type: string
        prompt:
          type: string
        provider:
          type: string
          example: VEO
        model:
          type: string
          example: veo-3.1-generate-preview
        status:
          type: string
          enum: [PLANNED, GENERATING, READY, FAILED]
        assetUrl:
          type: string
        thumbnailUrl:
          type: string
        durationSeconds:
          type: integer
        aspectRatio:
          type: string
          example: "9:16"
        requestJson:
          type: string
        responseJson:
          type: string
        cost:
          type: number
        reviewStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        requiredForRelease:
          type: boolean
        salesVideoProfileId:
          type: integer
          format: int64
        salesVideoJobId:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        landingVideoSlotId:
          type: integer
          format: int64
    UpdateExperimentVideoAssetRequest:
      allOf:
        - $ref: "#/components/schemas/CreateExperimentVideoAssetRequest"
    RequestExperimentVeoVideoRequest:
      type: object
      required:
        - slot
        - title
        - objective
        - primaryMetric
        - scriptText
        - requestedBy
      properties:
        slot:
          type: string
          enum: [AD, LANDING_HERO, FORM_EXPLAINER, PRE_CHECKOUT]
        title:
          type: string
        objective:
          type: string
        primaryMetric:
          type: string
        personaName:
          type: string
        personaStyle:
          type: string
        voiceStyle:
          type: string
        language:
          type: string
          example: pt-BR
        targetDurationSeconds:
          type: integer
        scriptText:
          type: string
        hookText:
          type: string
        ctaText:
          type: string
        captionText:
          type: string
        characterImagePrompt:
          type: string
          description: Prompt da imagem da personagem gerada pela OpenAI.
        characterImageModel:
          type: string
          example: gpt-image-2
        characterImageJobId:
          type: string
        characterImageAssetId:
          type: integer
          format: int64
        characterImageReferenceUrl:
          type: string
        providerName:
          type: string
          example: VEO
        executionMode:
          type: string
          enum: [TEST, PRODUCTION]
        requestedBy:
          type: string
        requiredForRelease:
          type: boolean
    RequestPlannedExperimentVideoRenderRequest:
      type: object
      required:
        - requestedBy
      properties:
        requestedBy:
          type: string
        executionMode:
          type: string
          enum: [TEST, PRODUCTION]
        personaName:
          type: string
        personaStyle:
          type: string
        voiceStyle:
          type: string
        language:
          type: string
          example: pt-BR
        requiredForRelease:
          type: boolean
