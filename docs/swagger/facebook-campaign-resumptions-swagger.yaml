openapi: 3.0.3
info:
  title: Retomada financeira de campanhas Meta
  version: 3.0.0
  description: Autoriza orçamento diário, teto acumulado, janela e condições de parada; preserva histórico e confirma Meta antes de RUNNING. Quando a Meta proíbe converter uma hierarquia diária abaixo do mínimo da conta, cria uma substituta auditada com orçamento vitalício apenas no saldo restante.
paths:
  /api/facebook-campaign-resumptions/experiments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Consulta disponibilidade, gasto sincronizado, limite efetivo e último pedido
      responses:
        '200':
          description: Resumo persistido; available e blocker governam a tela
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicable: {type: boolean}
                  available: {type: boolean}
                  blocker: {type: string, nullable: true}
                  synchronizedSpend: {type: number}
                  dailyBudget: {type: number, nullable: true}
                  currentLimit: {type: number, nullable: true}
                  zeroResultStopSpend: {type: number}
                  zeroPurchaseStopSpend: {type: number, nullable: true}
                  purchaseStopCount: {type: integer, nullable: true}
                  latest: {$ref: '#/components/schemas/Execution'}
    post:
      summary: Registra orçamento, janela e paradas autorizadas sem ativar mídia na requisição
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totalLimit, dailyBudget, startDate, endDate, zeroResultSpendLimit, zeroPurchaseSpendLimit, reason, authorizeSpending]
              properties:
                totalLimit: {type: number, minimum: 0.01, multipleOf: 0.01, description: 'Teto acumulado BRL, incluindo gasto anterior'}
                dailyBudget: {type: number, minimum: 0.01, multipleOf: 0.01, description: 'Ritmo diário máximo no conjunto; pode encerrar antes pelo teto acumulado'}
                startDate: {type: string, format: date, description: 'Início entre hoje e 30 dias em America/Sao_Paulo; a fila não entrega antes desta data'}
                endDate: {type: string, format: date, description: 'Fim na mesma janela, às 23:59:59 em America/Sao_Paulo'}
                zeroResultSpendLimit: {type: number, minimum: 0.01, multipleOf: 0.01, description: 'Gasto acumulado máximo sem qualquer resultado primário'}
                zeroPurchaseSpendLimit: {type: number, minimum: 0.01, multipleOf: 0.01, nullable: true, description: 'Gasto acumulado máximo sem compra, mesmo com resultado intermediário'}
                purchaseStopCount: {type: integer, minimum: 1, nullable: true, description: 'Compras atribuídas que encerram a coleta como sucesso'}
                reason: {type: string, minLength: 10, maxLength: 800}
                authorizeSpending: {type: boolean, enum: [true]}
                useTotalLimitForZeroResults: {type: boolean, description: 'Compatibilidade legada; usa o teto como limite sem resultados quando zeroResultSpendLimit estiver ausente'}
      responses:
        '200': {description: 'Pedido pendente ou repetição idempotente; não significa campanha ativa'}
        '400': {description: 'Consentimento, teto, motivo ou prazo inválidos'}
        '409': {description: 'Campanha incompatível, requisitos pendentes ou outra retomada em andamento'}
  /api/facebook-campaign-resumptions/pending:
    get:
      summary: Ponto canônico inicial do executor; até 20 pedidos pendentes ou com reserva expirada
      responses:
        '200': {description: 'Lista de Execution sem leaseToken'}
  /api/facebook-campaign-resumptions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Consulta o estado persistido para desambiguar resposta perdida do callback
      responses:
        '200':
          description: 'Execution atual; COMPLETED confirma que o backend efetivou a ativação'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Execution'}
        '404': {description: 'Pedido inexistente'}
  /api/facebook-campaign-resumptions/{id}/claim:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Reserva exclusiva por quinze minutos; permite recuperação idempotente após queda
      responses:
        '200': {description: 'Execution com leaseToken exclusivo'}
        '409': {description: 'Já reservado ou concluído'}
  /api/facebook-campaign-resumptions/{id}/result:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Confirma execução ou falha, validando evidência nativa antes de RUNNING
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseToken, success]
              properties:
                leaseToken: {type: string}
                success: {type: boolean}
                error: {type: string, nullable: true}
                evidence:
                  type: object
                  description: 'Snapshots Meta sem token. Sucesso exige IDs, campanha ACTIVE, budgetMode, orçamento/teto nativos, startDate, endDate e gasto acumulado menor que o teto.'
                replacement:
                  allOf:
                    - $ref: '#/components/schemas/CampaignReplacement'
                  nullable: true
                  description: 'Obrigatório somente quando a campanha diária é substituída por incompatibilidade do mínimo nativo da conta.'
      responses:
        '200': {description: 'Resultado persistido; callback repetido é idempotente'}
        '409': {description: 'Reserva inválida ou evidência divergente'}
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: {type: integer, format: int64}
  schemas:
    Execution:
      type: object
      properties:
        id: {type: integer, format: int64}
        experimentId: {type: integer, format: int64}
        campaignId: {type: string}
        adSetId: {type: string}
        status: {type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED]}
        totalLimit: {type: number}
        dailyBudget: {type: number, nullable: true}
        historicalSpend: {type: number, description: 'Gasto congelado de campanhas físicas anteriores do mesmo experimento; nunca inferido como zero pelo executor'}
        startDate: {type: string, format: date, nullable: true}
        endDate: {type: string, format: date}
        zeroResultSpendLimit: {type: number, nullable: true}
        zeroPurchaseSpendLimit: {type: number, nullable: true}
        purchaseStopCount: {type: integer, nullable: true}
        reason: {type: string}
        destinationUrl: {type: string}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        leaseToken: {type: string, nullable: true}
        error: {type: string, nullable: true}
        evidence: {type: object, nullable: true}
    CampaignReplacement:
      type: object
      required: [sourceCampaignId, sourceAdSetId, campaignId, adSetId, lifetimeBudgetMinor, confirmedPriorSpend, ads]
      properties:
        sourceCampaignId: {type: string, description: 'Campanha original que deve permanecer pausada'}
        sourceAdSetId: {type: string}
        campaignId: {type: string, description: 'Campanha substituta confirmada como ACTIVE'}
        adSetId: {type: string, description: 'Conjunto substituto com orçamento vitalício sobre o saldo restante'}
        lifetimeBudgetMinor: {type: integer, format: int64, minimum: 1}
        confirmedPriorSpend: {type: number, minimum: 0, description: 'Gasto acumulado confirmado antes da ativação da substituta'}
        ads:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReplacementAd'}
    ReplacementAd:
      type: object
      required: [sourceAdId, adId]
      properties:
        sourceAdId: {type: string}
        adId: {type: string, description: 'Anúncio substituto que reutiliza o criativo aprovado da origem'}
