openapi: 3.0.3
info:
  title: Projeção de receita de Plutus
  version: 1.1.0
paths:
  /api/experiment-strategist/v1/commercial-plans/{planId}/commercial-assumptions:
    post:
      summary: Abre ou retoma a proposta vigente de Atena e sua validação única de Plutus.
      description: Reutiliza resposta concluída na mesma versão, sem nova inferência. Retomadas concorrentes não duplicam a validação. Mudança de contexto exige proposta própria; falha inalterada não autoriza repetir o modelo.
      responses:
        '200': {description: Proposta enfileirada ou reutilizada; validação de Plutus persistida após o commit}
        '409': {description: Trabalho ativo em outro contexto ou falha anterior cuja causa deve ser corrigida}
  /api/financial-agent/v1/commercial-plans/{planId}/commercial-assumptions:
    get:
      summary: Lista as validações conjuntas de premissas do plano.
      responses:
        '200': {description: Histórico auditável das validações}
  /api/financial-agent/v1/commercial-plans/{planId}/revenue-projections:
    post:
      summary: Solicita projeção de receita somente leitura ligada à versão oficial do plano
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                decisionContext:
                  type: string
                  nullable: true
                  maxLength: 64000
                  description: Contexto de decisão; também comporta o snapshot de premissas, fontes e cálculos de uma revisão financeira, sem truncamento.
      responses:
        '200': {description: Projeção enfileirada e tarefa aberta na mesa de Plutus}
    get:
      summary: Lista projeções sem misturar cenários com receita realizada
      responses:
        '200': {description: Histórico auditável de projeções}
