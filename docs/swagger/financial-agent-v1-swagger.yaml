openapi: 3.0.3
info:
  title: Agente Financeiro v1
  version: 1.0.0
paths:
  /api/financial-agent/v1/video-providers/credit-balances:
    get:
      summary: Lista saldo estimado, capacidade e divergências dos provedores de vídeo
      responses:
        '200':
          description: Monitor financeiro transversal dos provedores de vídeo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: {type: string}
                    purchasedCredits: {type: integer, format: int64}
                    estimatedConsumedCredits: {type: integer, format: int64, nullable: true}
                    estimatedAvailableCredits: {type: integer, format: int64, nullable: true}
                    acceptedSceneRequests: {type: integer, format: int64}
                    sceneRequests:
                      type: array
                      items:
                        type: object
                        properties:
                          jobId: {type: integer, format: int64}
                          productionCycleId: {type: integer, format: int64, nullable: true}
                          sceneNumber: {type: integer}
                          plannedSceneCount: {type: integer}
                          providerTaskId: {type: string, nullable: true}
                          model: {type: string, nullable: true}
                          durationSeconds: {type: integer, nullable: true}
                          estimatedCredits: {type: integer, nullable: true}
                          estimatedCostUsd: {type: number, nullable: true}
                          billedCredits: {type: integer, nullable: true}
                          billedCostUsd: {type: number, nullable: true}
                          settlementStatus: {type: string, enum: [CHARGED, REFUNDED], nullable: true}
                          billingEvidence: {type: string, nullable: true}
                          acceptedAt: {type: string, format: date-time}
  /api/financial-agent/v1/providers/{provider}/credit-purchases:
    parameters:
      - in: path
        name: provider
        required: true
        schema: {type: string}
    get:
      summary: Lista recargas de créditos do provedor
      responses:
        '200': {description: Histórico de recargas}
    post:
      summary: Registra recarga pré-paga sem contabilizá-la como consumo de render
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchasedAt, amount, currency, creditsPurchased]
              properties:
                purchasedAt: {type: string, format: date-time}
                amount: {type: number, minimum: 0.000001}
                currency: {type: string, minLength: 3, maxLength: 3}
                creditsPurchased: {type: integer, minimum: 1}
                evidenceReference: {type: string, maxLength: 500, nullable: true}
      responses:
        '200': {description: Recarga registrada de forma idempotente}
  /api/financial-agent/v1/commercial-plans/{planId}/executions:
    get:
      summary: Lista relatórios financeiros do planejamento
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: Relatórios encontrados}
    post:
      summary: Solicita conciliação financeira somente leitura
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: Conciliação criada}
  /api/financial-agent/v1/internal/commercial-plans/{planId}/intelligence:
    get:
      summary: Consulta snapshot financeiro oficial do planejamento
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200': {description: Snapshot financeiro, ledger do Estúdio e cobertura das fontes}
