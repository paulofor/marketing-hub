openapi: 3.0.3
info:
  title: GeraAnuncio v2 API
  version: v2
  description: Contratos internos do pipeline GeraAnuncio v2 para geração separada de texto e imagem de anúncios pelo AI Worker.
paths:
  /api/internal/aiworker/geracaoanuncios/v1/texto/stage-executions/start:
    post:
      summary: Inicia execução da etapa Texto pela chave do experimento
      description: Endpoint usado pela tela administrativa para iniciar a etapa de texto do GeraAnuncio v2 usando o código/chave operacional do experimento.
      parameters:
        - name: experimentKey
          in: query
          required: true
          schema:
            type: string
          description: Código/chave operacional do experimento; atualmente corresponde ao id numérico do experimento.
      responses:
        '200':
          description: Solicitação registrada na etapa Texto do GeraAnuncio v2.
  /api/internal/aiworker/geracaoanuncios/v1/texto/stage-executions/experiments/{experimentId}/start:
    post:
      summary: Inicia execução da etapa Texto para um experimento
      description: Endpoint usado pela tela administrativa para iniciar a etapa de texto do GeraAnuncio v2.
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Solicitação registrada na etapa Texto do GeraAnuncio v2.
  /api/internal/aiworker/geracaoanuncios/v1/texto/stage-executions/pending:
    post:
      summary: Lista execuções pendentes da etapa Texto
      description: Endpoint canônico usado pelo AI Worker para consumir a fila da etapa Texto, retornando cada objeto pendente com o jobId UUID da execução.
      responses:
        '200':
          description: Execuções pendentes retornadas com contexto e artefatos anteriores.
  /api/internal/aiworker/geracaoanuncios/v1/texto/stage-executions/{experimentKey}/jobs/{jobId}/recebeRequest:
    post:
      summary: Registra request operacional da etapa Texto
      description: Recebe o request gerado pelo AI Worker vinculado ao id do objeto e ao jobId UUID criado no start.
      parameters:
        - name: experimentKey
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Request aceito para auditoria.
  /api/internal/aiworker/geracaoanuncios/v1/texto/stage-executions/{stageExecutionId}/prompt:
    post:
      summary: Registra prompt enviado ao modelo na etapa Texto
      parameters:
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Prompt aceito para auditoria.
  /api/internal/aiworker/geracaoanuncios/v1/texto/stage-executions/{stageExecutionId}/response:
    post:
      summary: Registra resposta do modelo e saída estruturada da etapa Texto
      parameters:
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Resposta aceita para auditoria e relatório.
  /api/internal/aiworker/geracaoanuncios/v1/imagem/stage-executions/start:
    post:
      summary: Inicia execução da etapa Imagem pela chave do experimento
      description: Endpoint usado pela tela administrativa para iniciar a etapa de imagem do GeraAnuncio v2 usando o código/chave operacional do experimento.
      parameters:
        - name: experimentKey
          in: query
          required: true
          schema:
            type: string
          description: Código/chave operacional do experimento; atualmente corresponde ao id numérico do experimento.
      responses:
        '200':
          description: Solicitação registrada na etapa Imagem do GeraAnuncio v2.
  /api/internal/aiworker/geracaoanuncios/v1/imagem/stage-executions/experiments/{experimentId}/start:
    post:
      summary: Inicia execução da etapa Imagem para um experimento
      description: Endpoint usado pela tela administrativa para iniciar a etapa de imagem do GeraAnuncio v2.
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Solicitação registrada na etapa Imagem do GeraAnuncio v2.
  /api/internal/aiworker/geracaoanuncios/v1/imagem/stage-executions/pending:
    post:
      summary: Lista execuções pendentes da etapa Imagem
      description: Endpoint canônico usado pelo AI Worker para consumir a fila da etapa Imagem, retornando cada objeto pendente com o jobId UUID da execução.
      responses:
        '200':
          description: Execuções pendentes retornadas com contexto e artefatos anteriores.
  /api/internal/aiworker/geracaoanuncios/v1/imagem/stage-executions/{experimentKey}/jobs/{jobId}/recebeRequest:
    post:
      summary: Registra request operacional da etapa Imagem
      description: Recebe o request gerado pelo AI Worker vinculado ao id do objeto e ao jobId UUID criado no start.
      parameters:
        - name: experimentKey
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Request aceito para auditoria.
  /api/internal/aiworker/geracaoanuncios/v1/imagem/stage-executions/{stageExecutionId}/prompt:
    post:
      summary: Registra prompt enviado ao modelo na etapa Imagem
      parameters:
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Prompt aceito para auditoria.
  /api/internal/aiworker/geracaoanuncios/v1/imagem/stage-executions/{stageExecutionId}/response:
    post:
      summary: Registra resposta do modelo e saída estruturada da etapa Imagem
      parameters:
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Resposta aceita para auditoria e relatório.
