        '404':
          description: Experimento não encontrado.
  /api/experiments/{experimentId}/geralanding/quality-review/stage-executions:
    get:
      tags: [landing-page-quality-review]
      summary: Lista execuções da etapa landing-page-quality-review.
      operationId: listGeraLandingQualityReviewExecutions
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IncludeCompleted'
      responses:
        '200':
          $ref: '#/components/responses/StageExecutionSummaryList'
        '404':
          description: Experimento não encontrado.
  /api/experiments/{experimentId}/geralanding/quality-review/stage-executions/{idJob}:
    get:
      tags: [landing-page-quality-review]
      summary: Detalha uma execução da etapa landing-page-quality-review.
      operationId: detailGeraLandingQualityReviewExecution
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdJob'
      responses:
        '200':
          $ref: '#/components/responses/StageExecutionDetail'
        '404':
          description: Experimento ou execução não encontrada.
  /api/internal/geralanding/quality-review/stage-executions/pending:
    get:
      tags: [landing-page-quality-review]
      summary: Lista jobs pendentes da revisão visual para o Worker AI.
      operationId: listPendingGeraLandingQualityReviewExecutions
      responses:
        '200':
          description: Jobs pendentes retornados.
  /api/internal/geralanding/quality-review/stage-executions/{idJob}/recebe-prompt:
    post:
      tags: [landing-page-quality-review]
      summary: Recebe prompt, schema e request multimodal enviados à OpenAI.
      operationId: receivePromptGeraLandingQualityReviewExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      responses:
        '202':
          description: Execução marcada como aguardando retorno da OpenAI.
  /api/internal/geralanding/quality-review/stage-executions/{idJob}/recebe-resposta:
    post:
      tags: [landing-page-quality-review]
      summary: Recebe diagnóstico visual da OpenAI e conclui ou falha a execução.
      operationId: receiveResponseGeraLandingQualityReviewExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      responses:
        '202':
          description: Resposta da revisão visual processada.
  /api/experiments/{experimentId}/geralanding/landing/approve-and-publish:
    post:
      tags: [landing-page-publication]
      summary: Alias legado compatível para aprovar e publicar a landing pública.
      operationId: approveAndPublishGeraLandingPublicLanding
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          $ref: '#/components/responses/PublicLandingPublication'
        '404':
          description: Experimento não encontrado.
        '409':
          description: HTML da landing ainda não foi gerado.
        '502':
          description: Lead Portal indisponível ou base URL não configurada.
  /api/experiments/{experimentId}/geralanding/landing/stage-executions:
    get:
      tags: [landing-page-publication]
      summary: Rota canônica de listagem da landing pública.
      description: Implementada para manter a matriz de endpoints por etapa; responde 410 porque a publicação é síncrona e não possui fila própria.
      operationId: listGeraLandingPublicLandingExecutions
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '410':
          description: Landing pública não possui stage-executions próprias.
  /api/experiments/{experimentId}/geralanding/landing/stage-executions/{idJob}:
    get:
      tags: [landing-page-publication]
      summary: Rota canônica de detalhe da landing pública.
      description: Implementada para manter a matriz de endpoints por etapa; responde 410 porque a publicação é síncrona e não possui job próprio.
      operationId: detailGeraLandingPublicLandingExecution
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdJob'
      responses:
        '410':
          description: Landing pública não possui detalhe de execução próprio.
  /api/internal/geralanding/landing/stage-executions/pending:
    get:
      tags: [landing-page-publication]
      summary: Lista pendências internas da landing pública.
      description: Retorna lista vazia porque a publicação da landing pública é síncrona.
      operationId: pendingGeraLandingPublicLandingExecutions
      responses:
        '200':
          description: Lista vazia de pendências da landing pública.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicLandingPending'
  /api/internal/geralanding/landing/stage-executions/{idJob}/recebe-prompt:
    post:
      tags: [landing-page-publication]
      summary: Rota canônica interna de prompt da landing pública.
      description: Implementada para manter a matriz de endpoints por etapa; responde 410 porque a publicação não aciona IA diretamente.
      operationId: recebePromptGeraLandingPublicLandingExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        '410':
          description: Landing pública não recebe prompt de IA.
  /api/internal/geralanding/landing/stage-executions/{idJob}/recebe-resposta:
    post:
      tags: [landing-page-publication]
      summary: Rota canônica interna de resposta da landing pública.
      description: Implementada para manter a matriz de endpoints por etapa; responde 410 porque a publicação não aciona IA diretamente.
      operationId: recebeRespostaGeraLandingPublicLandingExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        '410':
          description: Landing pública não recebe resposta de IA.
components:
  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      description: ID numérico interno do experimento.
      schema:
        type: integer
        format: int64
    IdJob:
      name: idJob
      in: path
      required: true
      description: Identificador do job da execução.
      schema:
        type: string
    IncludeCompleted:
      name: includeCompleted
      in: query
      required: false
      description: Quando false, omite execuções concluídas.
      schema:
        type: boolean
        default: true
  requestBodies:
    OpenAiPromptDispatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAiPromptDispatchRequest'
    OpenAiPromptDispatchWithExperiment:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAiPromptDispatchWithExperimentRequest'
    PromptReceiveDirect:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromptReceiveDirectRequest'
    OpenAiDispatchMarker:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAiDispatchMarkerRequest'
    OpenAiStageResult:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAiStageResultRequest'
    OpenAiStageResultWithProvisionalHtml:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenAiStageResultWithProvisionalHtmlRequest'
  responses:
    StageExecutionSummaryList:
      description: Lista de execuções da etapa.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StageExecutionSummary'
    StageExecutionDetail:
      description: Detalhe da execução da etapa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StageExecutionDetail'
    PendingStageExecutionList:
      description: Lista de jobs pendentes da etapa.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PendingStageExecution'
    PublicLandingPublication:
      description: Landing aprovada e publicada com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicLandingPublicationResponse'
  schemas:
    StageStartResponse:
      type: object
      additionalProperties: false
      properties:
        idJob:
          type: string
        status:
          type: string
      required:
        - idJob
        - status
    QualityReviewStartResponse:
      allOf:
        - $ref: '#/components/schemas/StageStartResponse'
        - type: object
          additionalProperties: false
          properties:
            qualityReview:
              type: string
              description: JSON serializado com score, bloqueios e recomendações de regeneração.
          required:
            - qualityReview
    StageExecutionSummary:
      type: object
      additionalProperties: false
      properties:
        idJob:
          type: string
        status:
          type: string
        executionRequestedAt:
          type: string
          format: date-time
          nullable: true
        costUsd:
          type: number
          format: double
          nullable: true
        score:
          type: number
          format: double
          nullable: true
          description: Score final retornado pela IA para a etapa Quality Review, quando disponível.
        approvalRecommendation:
          type: string
          nullable: true
          description: Recomendação da IA para publicação da landing na etapa Quality Review.
          enum:
            - APPROVE_FOR_PUBLICATION
            - REGENERATE_BEFORE_PUBLICATION
        approvedForPublication:
          type: boolean
          nullable: true
          description: Indica se a recomendação mais recente aprova a landing para publicação.
      required:
        - idJob
        - status
    StageExecutionDetail:
      type: object
      additionalProperties: false
      properties:
        idJob:
          type: string
        experimentId:
          type: integer
          format: int64
        stageCode:
          type: string
        executionRequestedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        promptTemplateId:
          type: string
          nullable: true
        promptContent:
          type: string
          nullable: true
        prompt:
          type: string
          nullable: true
        openAiRequestBody:
          type: string
          nullable: true
        openAiModel:
          type: string
          nullable: true
        schemaJson:
          type: string
          nullable: true
        promptMarkdownContent:
          type: string
          nullable: true
        status:
          type: string
        openAiJobId:
          type: string
          nullable: true
        modelResponse:
          type: string
          nullable: true
        provisionalHtml:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        errorDetail:
          type: string
          nullable: true
        qualityReviewAudit:
          type: string
          nullable: true
          description: JSON de auditoria da evidência visual do Quality Review com hashes de HTML, screenshots, prompt, request e alertas de reuso/contradição.
        inputTokens:
          type: integer
          format: int32
          nullable: true
        outputTokens:
          type: integer
          format: int32
          nullable: true
        costUsd:
          type: number
          format: double
          nullable: true
      required:
        - idJob
        - experimentId
        - stageCode
        - status
    PendingStageExecution:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        jobid:
          type: string
        idJob:
          type: string
          nullable: true
        stageCode:
          type: string
        status:
          type: string
          nullable: true
        experiment:
          $ref: '#/components/schemas/PendingStageExperiment'
        hypothesis:
          $ref: '#/components/schemas/PendingStageHypothesis'
      required:
        - experimentId
        - jobid
        - stageCode
    PendingStageExperiment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        hypothesis:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
        creativeTextPrompt:
          type: string
          nullable: true
        creativeImagePrompt:
          type: string
          nullable: true
        campaignAngle:
          $ref: '#/components/schemas/JsonBackedArtifact'
        adCopy:
          $ref: '#/components/schemas/JsonBackedArtifact'
        adImageBriefing:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageCopy:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageWireframe:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageImagePlanning:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageImageAssets:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageDesignPreset:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageQualityReview:
          $ref: '#/components/schemas/JsonBackedArtifact'
        landingPageDeliverables:
          $ref: '#/components/schemas/JsonBackedArtifact'
        htmlGeraLanding:
          type: string
          nullable: true
      required:
        - id
    PendingStageHypothesis:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
        framework:
          type: object
          nullable: true
          additionalProperties: true
    JsonBackedArtifact:
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
    OpenAiPromptDispatchRequest:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
        promptMarkdownContent:
          type: string
          nullable: true
        schemaJson:
          type: string
          minLength: 1
        requestBodyJson:
          type: string
          minLength: 1
          description: Campo canônico aceito pelos controllers pt-BR.
        openAiRequestBody:
          type: string
          minLength: 1
          description: Alias aceito por alguns DTOs via JsonAlias.
        openAiModel:
          type: string
          nullable: true
        jobidopenai:
          type: string
          minLength: 1
        openAiJobId:
          type: string
          minLength: 1
          description: Alias aceito por alguns DTOs via JsonAlias.
        qualityReviewAudit:
          type: object
          nullable: true
          additionalProperties: true
          description: Auditoria estruturada da evidência visual do Quality Review, incluindo hashes de HTML/screenshots e versão operacional do prompt.
      required:
        - prompt
        - schemaJson
        - requestBodyJson
        - jobidopenai
    OpenAiPromptDispatchWithExperimentRequest:
      allOf:
        - $ref: '#/components/schemas/OpenAiPromptDispatchRequest'
        - type: object
          properties:
            experimentId:
              type: integer
              format: int64
              nullable: true
            stageCode:
              type: string
              nullable: true
    PromptReceiveDirectRequest:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        stageCode:
          type: string
        prompt:
          type: string
          minLength: 1
      required:
        - experimentId
        - stageCode
        - prompt
    OpenAiDispatchMarkerRequest:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        stageCode:
          type: string
        openAiJobId:
          type: string
      required:
        - experimentId
        - stageCode
    OpenAiStageResultRequest:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        stageCode:
          type: string
          minLength: 1
        modelResponse:
          type: string
          nullable: true
        inputTokens:
          type: integer
          format: int32
          nullable: true
        outputTokens:
          type: integer
          format: int32
          nullable: true
        costUsd:
          type: number
          format: double
          nullable: true
        openAiJobId:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        errorDetail:
          type: string
          nullable: true
      required:
        - experimentId
        - stageCode
    OpenAiStageResultWithProvisionalHtmlRequest:
      allOf:
        - $ref: '#/components/schemas/OpenAiStageResultRequest'
        - type: object
          properties:
            provisionalHtml:
              type: string
              nullable: true
    PublicLandingPublicationResponse:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
        flowId:
          type: integer
          format: int64
          nullable: true
        iframeUrl:
          type: string
          nullable: true
        standaloneUrl:
          type: string
          nullable: true
        message:
          type: string
      required:
        - experimentId
        - message
    PublicLandingPending:
      type: object
      additionalProperties: false
      properties:
        experimentId:
          type: integer
          format: int64
          nullable: true
        idJob:
          type: string
          nullable: true
        stageCode:
          type: string
          nullable: true
