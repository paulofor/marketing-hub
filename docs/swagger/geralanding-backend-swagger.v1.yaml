openapi: 3.0.3
info:
  title: Marketing Hub Backend - GeraLanding API
  version: v1.3.0
  description: |
    Contrato canônico dos endpoints HTTP implementados no backend `ads-service`
    para o módulo GeraLanding.

    Fonte de verdade revisada em código em 2026-06-03:
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/wireframe/web/BackendWireframeController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/copy/web/GeraLandingCopyController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/imageplanning/web/GeraLandingImagePlanningController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/imagegeneration/web/BackendImageGenerationController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/presetdesign/web/BackendPresetDesignController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/qualityreview/controller/BackendQualityReviewController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/deliverables/web/GeraLandingDeliverablesController.java`
    - `backend/ads-service/src/main/java/com/marketinghub/geralanding/publiclanding/web/BackendPublicLandingController.java`

    Este arquivo é o Swagger/OpenAPI canônico do GeraLanding. Arquivos operacionais
    duplicados fora de `docs/canonical` devem ser considerados obsoletos quando divergirem
    deste contrato.
servers:
  - url: http://191.252.181.168
    description: Backend principal para acessos executados pelo Codex
  - url: http://191.252.181.168:8000
    description: Backend principal documentado para operação externa
tags:
  - name: landing-page-wireframe
    description: Etapa de geração do wireframe da landing.
  - name: landing-page-copy
    description: Etapa de geração da copy da landing.
  - name: landing-page-image-planning
    description: Etapa de planejamento dos prompts de imagem.
  - name: landing-page-image-generation
    description: Etapa de geração dos assets de imagem.
  - name: landing-page-design-preset
    description: Etapa de preset visual da landing.
  - name: landing-page-quality-review
    description: Quality Gate comercial da landing gerada.
  - name: landing-page-deliverables
    description: Etapa de empacotamento dos entregáveis da landing.
  - name: landing-page-publication
    description: Aprovação e publicação da landing final.
paths:
  /api/experiments/{experimentId}/geralanding/wireframe/start:
    post:
      tags: [landing-page-wireframe]
      summary: Inicia manualmente a etapa landing-page-wireframe.
      operationId: startGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '202':
          description: Execução inicial registrada para processamento assíncrono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageStartResponse'
        '404':
          description: Experimento não encontrado.
  /api/experiments/{experimentId}/geralanding/wireframe/stage-executions:
    get:
      tags: [landing-page-wireframe]
      summary: Lista execuções da etapa landing-page-wireframe.
      operationId: listGeraLandingWireframeExecutions
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IncludeCompleted'
      responses:
        '200':
          $ref: '#/components/responses/StageExecutionSummaryList'
        '404':
          description: Experimento não encontrado.
  /api/experiments/{experimentId}/geralanding/wireframe/stage-executions/{idJob}:
    get:
      tags: [landing-page-wireframe]
      summary: Detalha uma execução da etapa landing-page-wireframe.
      operationId: detailGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdJob'
      responses:
        '200':
          $ref: '#/components/responses/StageExecutionDetail'
        '404':
          description: Experimento ou execução não encontrada.
  /api/internal/geralanding/wireframe/stage-executions/pending:
    get:
      tags: [landing-page-wireframe]
      summary: Lista jobs pendentes da etapa landing-page-wireframe.
      operationId: pendingGeraLandingWireframeExecutions
      responses:
        '200':
          $ref: '#/components/responses/PendingStageExecutionList'
  /api/internal/geralanding/wireframe/stage-executions/{idJob}/recebe-prompt:
    post:
      tags: [landing-page-wireframe]
      summary: Recebe prompt, schema e request bruto enviados para IA na etapa wireframe.
      operationId: recebePromptGeraLandingWireframeExecution
      parameters:
        - $ref: '#/components/parameters/IdJob'
      requestBody:
        $ref: '#/components/requestBodies/OpenAiPromptDispatch'
      responses:
        '202':
          description: Prompt recebido e execução marcada como aguardando retorno da OpenAI.
        '400':
          description: Payload inválido.
        '404':
          description: Execução não encontrada.
  /api/internal/geralanding/wireframe/stage-executions/{idJob}/recebe-resposta:
    post:
      tags: [landing-page-wireframe]
      summary: Recebe resposta da IA para a etapa wireframe.
      operationId: recebeRespostaGeraLandingWireframeExecution
      parameters:
