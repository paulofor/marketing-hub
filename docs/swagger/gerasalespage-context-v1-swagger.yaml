openapi: 3.0.3
info:
  title: GeraSalesPage v1 — contexto comercial do produto
  version: 1.3.0
paths:
  /api/internal/gerasalespage/v1/{stageCode}/stage-executions/pending:
    get:
      summary: Entrega pendências com experimento e condições oficiais do produto
      parameters:
        - in: path
          name: stageCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contrato aditivo; produto ausente é objeto vazio, nunca condições inventadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    experimentId:
                      type: integer
                      format: int64
                    replayOnly:
                      type: boolean
                      description: Recuperação exclusiva do recibo exato; ausência bloqueia sem inferência.
                    auditedPrompt:
                      type: string
                      nullable: true
                      description: Prompt original literal somente em replay, após revalidação semântica.
                    auditedRequestBodyJson:
                      type: string
                      nullable: true
                      description: Request original literal somente em replay, sem reconstruir ou alterar seu hash.
                    experiment:
                      type: object
                      additionalProperties: true
                      properties:
                        feoDeliverablePackage:
                          $ref: '#/components/schemas/DeclaredDeliverablePackage'
                        product:
                          $ref: '#/components/schemas/ProductCommercialContext'
                        approvedLandingVideo:
                          $ref: '#/components/schemas/ApprovedLandingVideo'
components:
  schemas:
    DeclaredDeliverablePackage:
      type: object
      additionalProperties: true
      description: Pacote FEO persistido tem prioridade. Sem FEO, kit low-ticket recebe itens textuais concordantes de delivery.formats nos dois contratos do produto, com preço compatível. Objeto vazio indica fonte ausente. Não representa homologação, arquivo ou ID FEO inventado.
      properties:
        source: {type: string, enum: [PRODUCT_DELIVERY_CONTRACT]}
        productId: {type: integer, format: int64}
        productVersion: {type: string, nullable: true}
        deliverables:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              sourceField: {type: string}
              title: {type: string}
              publicTitle: {type: string}
              description: {type: string}
              publicDescription: {type: string}
    ApprovedLandingVideo:
      type: object
      description: Demonstração revalidada do recibo do ciclo; ausente no legado, sem acesso privado ou autorizações.
      required: [assetId, assetUrl, sha256, captions, captionsBurnedIn, role, reviewStatus]
      properties:
        assetId: {type: integer, format: int64}
        assetUrl: {type: string, format: uri}
        sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
        captions: {type: string}
        captionsBurnedIn: {type: boolean, enum: [true]}
        role: {type: string, enum: [LANDING_HERO]}
        reviewStatus: {type: string, enum: [APPROVED]}
    ProductCommercialContext:
      type: object
      description: Fontes atuais do cadastro; contratos JSON são objetos, sem dupla serialização.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        typeCode:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        deliveryMode:
          type: string
          nullable: true
        revenueModel:
          type: string
          nullable: true
        valueUnit:
          type: string
          nullable: true
        priceBrl:
          type: number
          nullable: true
        promise:
          type: string
          nullable: true
        deliverable:
          type: string
          nullable: true
        checkoutMonetization:
          type: string
          nullable: true
        riskReversal:
          type: string
          nullable: true
        validationContract:
          description: JSON estruturado; campo legado não JSON permanece texto e ausência permanece objeto vazio.
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
        experienceContract:
          description: JSON estruturado com entrega e condições cadastradas, sem padrões inferidos.
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
