openapi: 3.0.3
info:
  title: Operador de Crescimento v1
  version: 1.0.0
  description: Diagnosticos Codex auditaveis com pausa preventiva governada pelo backend.
paths:
  /api/growth-operator/v1/mcp-tools:
    get:
      summary: Lista o catalogo MCP autorizado para o Operador.
      responses:
        "200":
          description: Ferramentas MCP retornadas.
  /api/growth-operator/v1/commercial-plans/{planId}/executions:
    get:
      summary: Lista diagnosticos de um planejamento.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Historico retornado.}
    post:
      summary: Solicita diagnostico somente leitura.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekNumber, objective]
              properties:
                weekNumber: {type: integer}
                objective: {type: string}
      responses:
        "200": {description: Pendencia criada.}
  /api/growth-operator/v1/internal/executions/pending/claim:
    post:
      summary: Reserva a proxima pendencia para o worker.
      responses:
        "200": {description: Pendencia reservada.}
        "404": {description: Fila vazia.}
  /api/growth-operator/v1/commercial-plans/{planId}/tasks:
    get:
      summary: Lista pendencias abertas e resultados comprovados do planejamento.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Pendencias auditaveis retornadas.}
  /api/growth-operator/v1/commercial-plans/{planId}/tasks/{taskId}/resolve:
    post:
      summary: Conclui uma pendencia com evidencia humana.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
        - in: path
          name: taskId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence: {type: string, minLength: 10}
      responses:
        "200": {description: Pendencia concluida com evidencia.}
  /api/growth-operator/v1/internal/commercial-plans/{planId}/executions/ensure:
    post:
      summary: Delega ao backend a decisao de criar o proximo ciclo automatico.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Ciclo atual ou novo ciclo criado quando as evidencias mudam.}
  /api/growth-operator/v1/internal/commercial-plans/{planId}/session-intelligence:
    get:
      summary: Entrega sessoes, jornadas e eventos detalhados anonimizados ao agente.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
        - in: query
          name: eventLimit
          required: false
          schema: {type: integer, default: 2000, minimum: 1, maximum: 2000}
      responses:
        "200": {description: Inteligencia de sessoes atual retornada em modo somente leitura.}
  /api/growth-operator/v1/internal/commercial-plans/{planId}/video-strategy-intelligence:
    get:
      summary: Entrega estrategia, custos, progressao e aprendizados dos videos ao agente.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Inteligencia comercial de videos retornada em modo somente leitura.}
  /api/growth-operator/v1/internal/commercial-plans/{planId}/experiment/pause:
    post:
      summary: Solicita pausa preventiva condicionada aos gates comprovados pelo backend.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExperimentActionRequest"}
      responses:
        "200": {description: Pausa executada e encaminhada ao worker da Meta.}
        "409": {description: Gate ou estado do experimento nao autoriza a pausa.}
  /api/growth-operator/v1/internal/commercial-plans/{planId}/experiment/resume-request:
    post:
      summary: Registra solicitacao de retomada sem reativar o experimento.
      parameters:
        - in: path
          name: planId
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExperimentActionRequest"}
      responses:
        "200": {description: Pedido registrado como dependente de aprovacao humana.}
  /api/growth-operator/v1/internal/executions/{id}/complete:
    post:
      summary: Registra diagnostico, evidencias e recomendacao sem aplica-la.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Diagnostico registrado.}
  /api/growth-operator/v1/internal/executions/{id}/fail:
    post:
      summary: Registra falha tecnica da execucao.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200": {description: Falha registrada.}
components:
  schemas:
    ExperimentActionRequest:
      type: object
      required: [reason, evidence]
      properties:
        reason: {type: string, minLength: 10, maxLength: 500}
        evidence:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string, minLength: 3, maxLength: 300}
