openapi: 3.0.3
info:
  title: Hypothesis Pipeline Stages API
  version: 1.0.0
  description: Contratos das etapas Dor, Resultado, Mecanismo, Prova e Oferta do pipeline de hipótese.
paths:
  /api/niches/{nicheId}/hypothesis-pipeline/summary:
    get:
      summary: Lista o conteúdo final concluído de cada etapa do framework de hipótese.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Conteúdos finais retornados com origem no banco de dados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HypothesisStageFinalSummaryResponse'
  /api/niches/{nicheId}/hypothesis-pipeline/finalize:
    post:
      summary: Fecha o framework concluído como hipótese disponível para gerar experimento.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeHypothesisRequest'
      responses:
        '201':
          description: Hipótese criada em BACKLOG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisDto'
  /api/niches/{nicheId}/hypothesis-pipeline/pain/start:
    post:
      summary: Inicia a construção auditável da dor do nicho.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '202':
          description: Execução iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisPainStartResponse'
  /api/niches/{nicheId}/hypothesis-pipeline/pain/stage-executions:
    get:
      summary: Lista execuções da etapa Dor para acompanhamento na tela de nova hipótese.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: includeCompleted
          schema: { type: boolean, default: true }
        - in: query
          name: hypothesisId
          required: false
          schema: { type: string, format: uuid }
          description: Quando informado, retorna apenas execuções vinculadas à hipótese; quando omitido, retorna apenas execuções ainda não fechadas em hipótese.
      responses:
        '200':
          description: Execuções retornadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HypothesisPainExecutionSummaryResponse'
  /api/niches/{nicheId}/hypothesis-pipeline/pain/stage-executions/{idJob}:
    get:
      summary: Consulta detalhe auditável de uma execução da etapa Dor para a tela de detalhe do job.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: idJob
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalhe da execução retornado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisPainExecutionDetailResponse'
  /api/internal/hypothesis-pipeline/pain/stage-executions/pending:
    get:
      summary: Lista jobs pendentes da etapa Dor para o Worker AI.
      responses:
        '200':
          description: Jobs pendentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HypothesisPainPendingExecution'
  /api/internal/hypothesis-pipeline/pain/stage-executions/{idJob}/running:
    post:
      summary: Marca uma execução como em processamento.
      parameters:
        - in: path
          name: idJob
          required: true
          schema: { type: string }
      responses:
        '202': { description: Execução marcada. }
  /api/internal/hypothesis-pipeline/pain/stage-executions/{idJob}/recebe-prompt:
    post:
      summary: Recebe prompt, schema e request cru enviados para a OpenAI.
      parameters:
        - in: path
          name: idJob
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecebePromptRequest'
      responses:
        '202': { description: Prompt registrado. }
  /api/internal/hypothesis-pipeline/pain/stage-executions/{idJob}/recebe-resposta:
    post:
      summary: Recebe resposta ou erro da OpenAI para concluir a etapa Dor.
      parameters:
        - in: path
          name: idJob
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecebeRespostaRequest'
      responses:
        '202': { description: Resposta registrada. }
  /api/niches/{nicheId}/hypothesis-pipeline/result/start:
    post:
      summary: Inicia a construção auditável do resultado desejado do nicho.
      parameters:
        - in: path
          name: nicheId
