openapi: 3.0.3
info:
  title: Gerador de Imagens do Estúdio
  version: 1.3.0
paths:
  /api/image-generator/generations:
    post:
      summary: Gera imagens com atribuição financeira obrigatória
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, commercialPlanId, prompt]
              properties:
                productId: { type: integer, format: int64 }
                commercialPlanId: { type: integer, format: int64 }
                experimentId: { type: integer, format: int64, nullable: true }
                prompt: { type: string, maxLength: 4000 }
                operationKey:
                  {
                    type: string,
                    maxLength: 100,
                    description: "Chave única da operação; obrigatória quando o experimento está vinculado à ficha de execução v1.",
                  }
      responses:
        "200": { description: Lote comparativo gerado e auditado no ledger }
        "400": { description: Contexto comercial ausente ou inconsistente }
        "502": { description: Provedor não concluiu nenhuma imagem }
  /api/image-generator/generations/{jobId}/landing-assets:
    post:
      summary: Aplica uma geração concluída a um slot do rascunho da landing
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experimentId, slotId]
              properties:
                experimentId: { type: integer, format: int64 }
                slotId:
                  type: string
                  enum: [hero-media-img, prova-img]
      responses:
        "200":
          {
            description: Asset persistido e HTML de rascunho atualizado sem publicação,
          }
        "404": { description: Geração ou experimento não encontrado }
        "409": { description: Produto ou slot incompatível com a landing }

  /api/image-generator/generations/{jobId}/cost-reconciliation:
    post:
      summary: Reconcilia estimativa pelos tokens já auditados, sem nova inferência
      description: Soma o modelo principal e a ferramenta de imagem; mantém custo desconhecido quando dados ou tarifas forem incompletos. Atualiza idempotentemente a tentativa no ledger, preservando cobrança já conciliada.
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
        - {
            in: query,
            name: productId,
            required: true,
            schema: { type: integer, format: int64 },
          }
        - {
            in: query,
            name: commercialPlanId,
            required: true,
            schema: { type: integer, format: int64 },
          }
        - {
            in: query,
            name: experimentId,
            schema: { type: integer, format: int64 },
          }
      responses:
        "200":
          description: Estimativa reconciliada ou pendência de fonte sem consumo adicional
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [ESTIMATED, COST_PENDING] }
                  estimatedCostUsd: { type: number, nullable: true }
                  evidence: { type: string }
                  pricingSource: { type: string, nullable: true }
                  pricingCheckedOn: { type: string, nullable: true }
        "404": { description: Geração ausente ou pertencente a outro contexto }
        "422": { description: Auditoria não pôde ser lida }
