openapi: 3.0.3
info:
  title: Kit privado — sessão e apresentação por estado
  version: 1.3.0
  description: Prova sintética governada pelo backend; não autoriza compra, publicação ou gasto.
servers:
  - url: http://191.252.181.168
paths:
  /api/pde/kit/private/v1/admin/implementations:
    get:
      summary: Consulta desenho aprovado e capacidade de teste instalada
      parameters:
        - { in: query, name: productId, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: cycleId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: "Revisão, ID/hash da arquitetura e perfis instalados, sem efeito de execução" }
        '409': { description: "Ciclo, desenho ou adaptador incompatíveis" }
    post:
      summary: Vincula capacidade instalada ao desenho exato, sem gasto nem homologação implícita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey, expectedRevision, productId, cycleId, architectureTaskId, architectureSha256, profileCode, operatorName]
              properties:
                requestKey: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 0 }
                productId: { type: integer, format: int64 }
                cycleId: { type: integer, format: int64 }
                architectureTaskId: { type: integer, format: int64 }
                architectureSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                profileCode: { type: string, enum: [beauty-v1] }
                operatorName: { type: string, maxLength: 160 }
      responses:
        '200': { description: "Vínculo idempotente; não altera tarefas, estágio, autorizações ou pareceres" }
        '409': { description: "Revisão, identidade, conteúdo ou arquitetura incompatíveis" }
  /api/pde/kit/private/v1/internal/sessions:
    post:
      summary: Emite acesso privado para a fixture do mesmo produto, ciclo e versão
      description: >-
        Exige ciclo OPEN não baseline em ADJUSTMENT, VALIDATION ou nas etapas audiovisuais
        VIDEO_BRIEF, CAMPAIGN_VIDEO, PDE_ENTRY_VIDEO e VIDEO_APPROVAL. Preserva os contratos
        aprovados da mesma versão e recusa tentativa posterior bloqueada. Não abre capacidade
        durante planejamento, fases comerciais ou após encerramento do ciclo.
      parameters:
        - in: header
          name: X-PDE-Internal-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Create' }
      responses:
        '200':
          description: Acesso opaco; guardar o token fora de URLs e evidências
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  sessionToken: { type: string }
                  session: { $ref: '#/components/schemas/SessionView' }
        '400': { description: "Entrada inválida ou condição de segurança desconhecida" }
        '409': { description: 'Ciclo ou contrato sem capacidade privada, identidade divergente ou condição SAFETY usada em outro cenário' }
  /api/pde/kit/private/v1/admin/sessions:
    post:
      summary: Emite o mesmo acesso sintético pela administração
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Create' }
      responses:
        '200': { description: "Mesmo contrato da emissão interna" }
  /api/pde/kit/private/v1/session:
    get:
      summary: Recupera estado, motivo e apresentação canônica da sessão autenticada
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      responses:
        '200':
          description: Sessão preservada sem nova composição ou evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { description: "Acesso inválido, expirado ou revogado" }
  /api/pde/kit/private/v1/input:
    put:
      summary: Confere briefing sintético antes da reserva; SAFETY preserva bloqueio e causa
      parameters:
        - $ref: '#/components/parameters/SessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, professionalName, cityRegion, whatsapp, services, visualStyle, weeklyGoal, consentAccepted]
              properties:
                email: { type: string, format: email, maxLength: 160, example: teste+kit@sandbox.local }
                professionalName: { type: string, maxLength: 100 }
                cityRegion: { type: string, maxLength: 100 }
                whatsapp: { type: string, enum: ['00000000000'] }
                services: { type: string, maxLength: 160 }
                visualStyle: { type: string, maxLength: 100 }
                weeklyGoal: { type: string, maxLength: 200 }
                preferredColors: { type: string, maxLength: 100 }
                notes: { type: string, maxLength: 500 }
                consentAccepted: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Estado real; BLOCKED_SAFE não possui manifesto ou composição
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '409': { description: "Consentimento, identidade, quota ou contrato incompatíveis" }
components:
  parameters:
    SessionToken:
      in: header
      name: X-Kit-Session
      required: true
      schema: { type: string }
  schemas:
    Create:
      type: object
      required: [requestKey, productId, cycleId, prototypeVersion, scenarioCode, deviceProfile]
      properties:
        requestKey: { type: string, format: uuid }
        productId: { type: integer, format: int64, minimum: 1 }
        cycleId: { type: integer, format: int64, minimum: 1 }
        prototypeVersion: { type: string, maxLength: 160 }
        scenarioCode: { type: string, enum: [ADHERENT, RECOVERY, SAFETY] }
        deviceProfile: { type: string, enum: [DESKTOP_1440, IPHONE_15_PRO, PIXEL_7] }
        safetyCase:
          type: string
          nullable: true
          enum: [UNVERIFIED_VISUAL_ORIGIN, EXTERNAL_ACTION]
          description: Somente SAFETY. Ausência preserva REVIEW_REQUIRED, sem inventar causa. Reuso de requestKey exige a mesma condição.
    SessionView:
      type: object
      required: [id, productId, cycleId, experimentId, prototypeVersion, status, reason, presentation, events]
      properties:
        id: { type: string }
        productId: { type: integer, format: int64 }
        cycleId: { type: integer, format: int64 }
        experimentId: { type: integer, format: int64 }
        prototypeVersion: { type: string }
        status: { type: string, enum: [INPUT, QUEUED, RUNNING, READY, FAILED, BLOCKED_SAFE] }
        reason: { type: string, description: 'Causa operacional para auditoria; não renderizar como mensagem da experiência.' }
        presentation:
          type: object
          required: [title, introduction, statusMessage, reasonCode, nextStep, nextActionLabel, nextActionPath]
          properties:
            title: { type: string }
            introduction: { type: string }
            statusMessage: { type: string, description: 'Mensagem simples e segura para a interface, sem erros brutos ou identificadores internos.' }
            reasonCode: { type: string }
            nextStep: { type: string }
            nextActionLabel: { type: string }
            nextActionPath:
              type: string
              description: Caminho da revisão administrativa do mesmo produto e ciclo, sem token; vazio quando não há ação interna.
        specialties:
          type: array
          description: Opções efetivamente suportadas pela família desta sessão. A seleção não troca o perfil de versões históricas.
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              serviceExample: { type: string }
              sampleHeadline: { type: string }
              sampleCaption: { type: string }
        input:
          type: object
          properties:
            specialtyCode:
              type: string
              nullable: true
              enum: [nails-v1, barber-v1, hair-v1, makeup-v1, brows-v1, aesthetics-v1]
              description: Obrigatório na família beauty-v1; ausente preserva o perfil histórico. Recusado quando divergente da versão.

        firstApplication: { type: object, nullable: true }
        manifest: { type: object, nullable: true }
        events: { type: array, items: { type: object } }
