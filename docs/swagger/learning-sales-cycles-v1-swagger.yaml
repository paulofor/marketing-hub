# Em DECISION, commands exige evidence.decisionProposalId vigente e evidence.humanApproved=true.
# A proposta é lida pela API em learning-cycle-decision-v1-swagger.yaml; operatorName identifica o aprovador declarado.
openapi: 3.0.3
info:
  title: Ciclos de aprendizado e vendas da Cadeia de Valor
  version: 1.0.0
  description: >-
    O backend governa etapas, memória, autoria, idempotência e decisões por experimento.
    Nenhuma rota ativa campanha, altera orçamento de mídia ou cria venda.
    Ao entrar em MEASUREMENT, o backend concilia automaticamente analytics atribuído,
    canal, desfechos financeiros, custos e valor entregue. A tela não envia métricas.
    Fonte indisponível ou inconsistente persiste MEASUREMENT_BLOCKED e nunca vira zero.
    Adoção histórica aceita run produtivo publicado ou recibo externo datado da campanha Meta
    do próprio experimento. Persiste evento ADOPT_BASELINE com source, experimentId, reference,
    recordedAt, preflightRecorded e summary. A lacuna histórica não dispensa run/preflight do sucessor.
servers:
  - url: /api/business-process-chains/learning-cycles/v1
paths:
  /products/{productId}/process-context:
    get:
      summary: Identificar o ciclo da atividade, memória herdada e próximo trabalho na cadeia
      description: >-
        Somente leitura. Sem cycleId, resolve o único ciclo aberto compatível; não cria tarefas.
        cycleNumber é o ordinal na linhagem do produto, distinto do id e da versão do BPM.
        nextWork usa a situação oficial das atividades e conserva os bloqueios e o retorno original.
        Os cards de produto também consomem este contrato, usando produto, processo coordenador,
        ciclo e cadeia de salesFlow. A posição comercial e os custos acumulados não representam
        a atividade ou as métricas do ciclo atual. Falha de leitura deve aparecer explicitamente.
      parameters:
        - {$ref: '#/components/parameters/ProductId'}
        - {name: processDefinitionId, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: cycleId, in: query, schema: {type: integer, format: int64}}
        - {name: chainId, in: query, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Contexto segregado; corpo vazio quando não há ciclo aberto aplicável
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycleId: {type: integer, format: int64}
                  cycleNumber: {type: integer}
                  experimentId: {type: integer, format: int64}
                  chainDefinitionId: {type: integer, format: int64}
                  productVersion: {type: string}
                  status: {type: string}
                  stageLabel: {type: string}
                  hypothesis: {type: string}
                  mainChange: {type: string}
                  cycleUrl: {type: string}
                  previousLearning:
                    type: array
                    items: {type: object, description: 'cycleId, experimentId, action, summary, evidenceReference, learning, nextHypothesis e limitation preservados da memória herdada.'}
                  nextWork: {type: object, nullable: true, description: 'processDefinitionId, processNumber, processName, activityId, activityNumber, activityName, responsible, state, reason e url da situação oficial.'}
        '404': {description: Produto, processo ou ciclo inexistente}
        '409': {description: Ciclo ambíguo, linhagem inválida ou produto/cadeia divergente}
  /catalog:
    get:
      summary: Consultar BPM versionado, destinos de correção e experimentos elegíveis
      parameters:
        - {name: chainId, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: productId, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Grafo persistido, versão, atividades reais e opções segregadas pelo produto
          content:
            application/json:
              schema:
                type: object
                required: [processDefinitionId, version, diagram, returnTargets, experiments, entry]
                properties:
                  processDefinitionId: {type: integer, format: int64}
                  version: {type: integer}
                  diagram: {type: object, description: 'Grafo com nodes START/TASK/GATEWAY/END e flows; kind REWORK identifica retorno condicional.'}
                  returnTargets: {type: array, items: {type: object, description: 'processDefinitionId, processCode, processName, activityId, activityName, owner'}}
                  experiments: {type: array, items: {type: object, description: 'id, name, status, available, baseline, reason; somente experimentos do próprio produto'}}
                  entry: {$ref: '#/components/schemas/Entry'}
                  successorChainDefinitionId: {type: integer, format: int64, nullable: true, description: 'Versão publicada da mesma cadeia indicada pelo backend para criar o sucessor.'}
                  successorChainName: {type: string, nullable: true}
                  createExperimentUrl: {type: string, nullable: true, description: 'Cadastro oficial com produto e nicho existentes; não usar o wizard que recria a descoberta.'}
        '404': {description: Cadeia, produto ou BPM não instalado}
  /entry:
    get:
      summary: Resolver a entrada do ciclo pelo processo de venda ou pelo subprocesso
      description: >-
        Somente leitura. Conserva a cadeia solicitada e retoma a ocorrência aberta do produto.
        Sem chainId, prefere a cadeia publicada que contém a versão exata do pai.
        Processo sem vínculo ou cadeia divergente devolve corpo vazio; nunca escolhe outro produto.
        Não cria ciclo, experimento, tarefa ou autorização.
      parameters:
        - {name: processDefinitionId, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: productId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: chainId, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Hierarquia, chamada no BPM, navegação contextual e destinos reais; vazio se não aplicável
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entry'}
        '404': {description: Processo, produto, cadeia ou BPM não encontrado}
  /products/{productId}:
    parameters:
      - {$ref: '#/components/parameters/ProductId'}
    get:
      summary: Consultar histórico, memória herdada, aprovações e próximos comandos do produto
      parameters:
        - {name: chainId, in: query, required: false, schema: {type: integer, format: int64}, description: Filtra pelo código da cadeia preservando seu histórico entre versões}
      responses:
        '200':
          description: Histórico de ciclos com revisão, etapa e decisões auditáveis
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Cycle'}}
        '404': {description: Produto não encontrado}
    post:
      summary: Adotar experimento planejado ou referência histórica interrompida
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCycle'}
      responses:
        '200':
          description: Ciclo criado ou recibo idempotente existente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '400': {description: Campos inválidos}
        '404': {description: Referência não encontrada}
        '409': {description: Experimento incompatível, ciclo aberto, predecessor sem decisão de ajuste ou chave reutilizada com outro conteúdo}
  /products/{productId}/{cycleId}/commands:
    parameters:
      - {$ref: '#/components/parameters/ProductId'}
      - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Aplicar decisão com revisão esperada e recibo idempotente
      description: >-
        COMPLETE avança a etapa após validar sua evidência. REWORK exige nova versão e retorna
        ao ajuste antes da publicação; após publicação, exige experimento pausado e technicalOnly=true
        (mesma hipótese, oferta e aquisição), com nova homologação e publicação oficial posterior.
        ADJUST encerra o ciclo para um sucessor, exigindo experimento fora de RUNNING.
        CONTINUE respeita qualidade, leitura atual, teto e janela. FIX_MEASUREMENT preserva o experimento.
        SCALE exige amostra, vendas líquidas, contribuição positiva, entrega, uso e satisfação.
        AUTHORIZE_SCALE exige confirmação explícita e limite consistente no experimento oficial.
        STOP e INCONCLUSIVE exigem experimento fora de RUNNING e preservam o histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Command'}
      responses:
        '200':
          description: Decisão aplicada ou replay idempotente; nenhuma publicação externa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '400': {description: Contrato inválido}
        '404': {description: Ciclo não encontrado neste produto}
        '409': {description: Revisão obsoleta, comando incompatível, evidência insuficiente ou limite atingido}
  /products/{productId}/{cycleId}/measurement-reconciliation:
    parameters:
      - {$ref: '#/components/parameters/ProductId'}
      - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      summary: Reconciliar novamente as fontes oficiais da etapa de medição
      description: >-
        Não aceita contagens, valores, autoria ou justificativa da tela. O backend resolve o
        experimento e lê o mesmo recorte atribuído usado por Hermes, além das métricas do canal,
        eventos financeiros internos e custos auditáveis, limitado à janela autorizada do ciclo.
        Persiste MEASURE quando as fontes são coerentes ou MEASUREMENT_BLOCKED com a causa quando
        não são. Não publica, vende nem gasta.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconcileMeasurement'}
      responses:
        '200':
          description: Fotografia automática ou bloqueio persistido e auditável
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '400': {description: Contrato inválido}
        '404': {description: Ciclo não encontrado neste produto}
        '409': {description: Revisão obsoleta ou ciclo fora da etapa de medição}
components:
  parameters:
    ProductId: {name: productId, in: path, required: true, schema: {type: integer, format: int64}}
  schemas:
    Entry:
      type: object
      nullable: true
      required: [chainDefinitionId, chainName, parentProcessDefinitionId, parentProcessName, sequenceNumber, processDefinitionId, processName, integrated, canStartCycle, guidance, workspaceUrl, actionLabel, parentUrl, returnRoutes]
      properties:
        chainDefinitionId: {type: integer, format: int64}
        chainName: {type: string}
        parentProcessDefinitionId: {type: integer, format: int64}
        parentProcessName: {type: string}
        sequenceNumber: {type: integer, description: Posição real do pai na cadeia}
        activityId: {type: string, nullable: true, description: Atividade persistida que chama o ciclo}
        activityName: {type: string, nullable: true, description: Nome da atividade de origem no processo pai}
        activitySequenceNumber: {type: integer, nullable: true, description: Posição da atividade de chamada entre as tarefas do BPM pai}
        processDefinitionId: {type: integer, format: int64}
        processName: {type: string}
        integrated: {type: boolean, description: Chamada TASK com fluxos de entrada e saída na versão exata do pai}
        canStartCycle: {type: boolean, description: Cadeia e pai publicados com chamada integrada; demais gates continuam obrigatórios}
        guidance: {type: string}
        workspaceUrl: {type: string, description: Rota local com cadeia e produto; ciclo aberto conserva sua cadeia histórica}
        actionLabel: {type: string}
        parentUrl: {type: string}
        returnRoutes:
          type: array
          description: Destinos de orientação declarados no BPM e resolvidos na mesma cadeia; não são decisões executadas
          items:
            type: object
            required: [label, condition, processDefinitionId, sequenceNumber, processName, url]
            properties:
              label: {type: string}
              condition: {type: string}
              processDefinitionId: {type: integer, format: int64}
              sequenceNumber: {type: integer}
              processName: {type: string}
              url: {type: string}
    CreateCycle:
      type: object
      required: [requestKey, chainDefinitionId, experimentId, productVersion, hypothesis, mainChange, successCriterion, audience, offer, acquisition, budgetLimitBrl, windowStart, windowEnd, sampleTarget, minimumNetSales, operatorName]
      properties:
        requestKey: {type: string, format: uuid}
        chainDefinitionId: {type: integer, format: int64}
        experimentId: {type: integer, format: int64}
        previousCycleId: {type: integer, format: int64, nullable: true}
        baseline: {type: boolean, default: false}
        productVersion: {type: string, maxLength: 160}
        hypothesis: {type: string, maxLength: 1000}
        mainChange: {type: string, maxLength: 1000}
        successCriterion: {type: string, maxLength: 1000}
        audience: {type: string, maxLength: 500}
        offer: {type: string, maxLength: 500}
        acquisition: {type: string, maxLength: 500}
        budgetLimitBrl: {type: number, minimum: 0, multipleOf: 0.01}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        sampleTarget: {type: integer, minimum: 1, maximum: 10000000}
        minimumNetSales: {type: integer, minimum: 1, maximum: 1000000}
        operatorName: {type: string, maxLength: 160}
    Command:
      type: object
      required: [requestKey, expectedRevision, action, operatorName, summary, evidenceReference, evidence]
      properties:
        requestKey: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0}
        action: {type: string, enum: [COMPLETE, REWORK, ADJUST, CONTINUE, FIX_MEASUREMENT, SCALE, AUTHORIZE_SCALE, STOP, INCONCLUSIVE]}
        operatorName: {type: string, maxLength: 160}
        summary: {type: string, maxLength: 4000}
        evidenceReference: {type: string, maxLength: 1200}
        evidence:
          type: object
          description: >-
            LEARNING: learning, competingExplanation. PLANNING: planReference, stopRule.
            ADJUSTMENT: productVersion, changeEvidence.
            VIDEO_BRIEF (BPM v2): briefReference, campaignGoal, campaignCta, campaignMetric,
            pdeGoal, pdeCta, pdeMetric, controlledVariables, productionBudgetReference.
            CAMPAIGN_VIDEO: campaignVideoAssetId (AD pronto deste experimento), productionEvidence.
            PDE_ENTRY_VIDEO: pdeVideoAssetId (LANDING_HERO pronto), productionEvidence.
            VIDEO_APPROVAL: creativeId, pdeSlotId, technicalEvidence, customerReviewEvidence,
            captionsVerified=true, mobileVerified=true, optionalPlaybackVerified=true, testDataExcluded=true.
            O backend confere status, aprovação, vínculos e URLs e grava assinaturas do conteúdo lido.
            Revalida a integração antes da homologação, autorização e publicação, exigindo o contrato
            publicado na confirmação produtiva. Nenhum comando gera vídeo ou autoriza consumo externo.
            VALIDATION: approvalInstanceId
            (gate canônico real do mesmo produto/versão), journeyEvidence, humanObservationEvidence opcional,
            instrumentationVerified=true. AUTHORIZATION: confirmed=true, productVersion, budgetLimitBrl.
            REWORK: productVersion nova, rootCause, returnProcessId, returnActivityId.
            ADJUST: rootCause, learning, nextHypothesis, returnProcessId, returnActivityId.
            FIX_MEASUREMENT: rootCause, correctionPlan. SCALE: scaleHypothesis.
            AUTHORIZE_SCALE: confirmed, productVersion, budgetLimitBrl novo, windowEnd novo.
            Campos monetários e contagens são números; flags são booleanos; datas são ISO-8601.
            Limite total do comando: 64 KB. Resultados comerciais não são aceitos neste comando.
    ReconcileMeasurement:
      type: object
      additionalProperties: false
      required: [requestKey, expectedRevision]
      properties:
        requestKey: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0}
    Cycle:
      type: object
      required: [id, productId, experimentId, revision, stage, status, brief, inheritedLearning, events, commands, canCreateSuccessor]
      properties:
        id: {type: integer, format: int64}
        productId: {type: integer, format: int64}
        experimentId: {type: integer, format: int64}
        previousCycleId: {type: integer, format: int64, nullable: true}
        successorCycleId: {type: integer, format: int64, nullable: true}
        chainDefinitionId: {type: integer, format: int64}
        processDefinitionId: {type: integer, format: int64}
        revision: {type: integer}
        stage: {type: string, enum: [LEARNING, PLANNING, ADJUSTMENT, VIDEO_BRIEF, CAMPAIGN_VIDEO, PDE_ENTRY_VIDEO, VIDEO_APPROVAL, VALIDATION, AUTHORIZATION, PUBLICATION, MEASUREMENT, DECISION, SCALE_AUTHORIZATION]}
        stageLabel: {type: string}
        status: {type: string, enum: [OPEN, ADJUSTED, CLOSED, INCONCLUSIVE]}
        baseline: {type: boolean}
        productVersion: {type: string}
        budgetLimitBrl: {type: number}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        nextAction: {type: string}
        responsible: {type: string}
        workUrl: {type: string, nullable: true, description: 'Nulo enquanto o ajuste encerrado ainda exige criar sucessor; depois aponta à ocorrência sucessora. Ajuste aberto inclui ciclo, cadeia e atividade de retorno.'}
        returnProcessId: {type: integer, format: int64, nullable: true}
        returnActivityId: {type: string, nullable: true}
        diagram: {type: object, description: Grafo da versão exata do BPM da ocorrência; não substituir pelo catálogo atual}
        evidenceOptions:
          type: object
          description: Seleções lidas no backend para campaignVideoAssetId, pdeVideoAssetId, creativeId e pdeSlotId
          additionalProperties: {type: array, items: {type: object, properties: {id: {type: integer}, label: {type: string}}}}
        workLinks: {type: array, items: {type: object, properties: {label: {type: string}, url: {type: string}}}}
        brief: {type: object}
        inheritedLearning: {type: object, description: Snapshot do predecessor; memória mais antiga permanece acessível por referência ao ciclo anterior}
        approvalOptions: {type: array, items: {type: object, properties: {id: {type: integer}, label: {type: string}}}}
        events: {type: array, items: {type: object, description: 'id, revision, fromStage, toStage, action, operatorName, summary, evidenceReference, evidence (objeto), createdAt'}}
        commands: {type: array, items: {type: object, properties: {action: {type: string}, label: {type: string}, available: {type: boolean}, reason: {type: string}}}}
        canCreateSuccessor: {type: boolean}
        createdAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time, nullable: true}

    SalesFlow:
      type: object
      description: >-
        Leitura comum ao histórico e às atividades do Processo 6, baseada em eventos imutáveis.
        A versão atual do BPM explica caminhos compatíveis de ciclos históricos, sem alterar seus
        vínculos. Não há mutação em GET. A sequência do subprocesso usa a atividade chamadora (6.4).
      required: [productId, experimentId, cycleId, chainDefinitionId, modelProcessDefinitionId, state, reason, navigationUrl, modelUrl, activities, transitions]
      properties:
        productId: {type: integer, format: int64}
        experimentId: {type: integer, format: int64}
        cycleId: {type: integer, format: int64}
        cycleProcessDefinitionId: {type: integer, format: int64}
        chainDefinitionId: {type: integer, format: int64, description: 'Versão original do ciclo'}
        modelProcessDefinitionId: {type: integer, format: int64, description: 'BPM versionado com caminhos e retornos explícitos'}
        currentActivityId: {type: string, nullable: true}
        currentActivityName: {type: string, nullable: true}
        currentActivitySequenceNumber: {type: integer, nullable: true}
        state: {type: string}
        reason: {type: string}
        navigationUrl: {type: string}
        modelUrl: {type: string}
        activities:
          type: array
          items:
            type: object
            required: [activityId, sequenceNumber, name, state, objectiveAchieved, reason]
            properties:
              activityId: {type: string}
              sequenceNumber: {type: integer}
              name: {type: string}
              state: {type: string, enum: [HISTORICAL, NOT_APPLICABLE, RECORDED, WAITING, IN_PROGRESS, BLOCKED, COMPLETED]}
              objectiveAchieved: {type: boolean}
              reason: {type: string}
              evidenceReference: {type: string, nullable: true}
              enteredAt: {type: string, format: date-time, nullable: true}
              exitedAt: {type: string, format: date-time, nullable: true}
        transitions:
          type: array
          items:
            type: object
            required: [eventId, revision, action, from, to, returnFlow, reason, responsible, evidenceReference, occurredAt]
            properties:
              eventId: {type: integer, format: int64}
              revision: {type: integer, format: int64}
              action: {type: string}
              flowId: {type: string, nullable: true}
              from: {type: string}
              to: {type: string}
              returnFlow: {type: boolean}
              reason: {type: string}
              responsible: {type: string}
              evidenceReference: {type: string}
              occurredAt: {type: string, format: date-time}
