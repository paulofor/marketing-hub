openapi: 3.0.3
info:
  title: Marketing Hub Meta Audiences API
  version: 1.0.0
paths:
  /api/meta-audiences:
    post:
      summary: Persiste audiência Meta Ads já preparada pelo módulo OPRM executor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaAudienceRequest'
      responses:
        '200':
          description: Audiência persistida no backend conforme decisão do OPRM.
  /api/meta-audiences/niches/{nicheId}:
    get:
      summary: Lista planos de audiência CNAE vinculados a um nicho.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Planos de audiência do nicho.
  /api/meta-audiences/experiment-links:
    post:
      summary: Vincula uma audiência CNAE a um experimento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkMetaAudienceExperimentRequest'
      responses:
        '200':
          description: Vínculo persistido entre experimento e audiência.
  /api/meta-audiences/experiments/{experimentId}:
    get:
      summary: Lista audiências CNAE usadas por um experimento.
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Audiências vinculadas ao experimento.
  /api/meta-audiences/niches/{nicheId}/experiment-links:
    get:
      summary: Lista vínculos de audiência CNAE por nicho.
      parameters:
        - in: path
          name: nicheId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Vínculos de audiência e experimento do nicho.
  /api/internal/meta-audiences/pending:
    get:
      summary: Lista audiências prontas para o Facebook Ads Worker criar na Meta.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de pendências internas.
  /api/internal/meta-audiences/{id}/sync:
    patch:
      summary: Registra o resultado da criação/sincronização da audiência na Meta.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Audiência atualizada.
components:
  schemas:
    MetaAudienceRequest:
      type: object
      required: [marketNicheId, cnaeCode, audienceName, segmentName, facebookAdAccountId, audienceType, sourceType, eligibilityStatus]
      properties:
        marketNicheId: { type: integer, format: int64 }
        cnaeCode: { type: string }
        audienceName: { type: string }
        segmentName: { type: string }
        segmentDescription: { type: string }
        painFocus: { type: string }
        desiredOutcomeFocus: { type: string }
        offerAngle: { type: string }
        filterStrategy: { type: string }
        facebookAdAccountId: { type: string }
        audienceType: { type: string }
        sourceType: { type: string }
        eligibilityStatus: { type: string }
        totalContacts: { type: integer, format: int64 }
        uniqueEmails: { type: integer, format: int64 }
        estimatedContacts: { type: integer, format: int64 }
    LinkMetaAudienceExperimentRequest:
      type: object
      required: [metaAudienceId, metaAudienceSegmentId, experimentId]
      properties:
        metaAudienceId: { type: integer, format: int64 }
        metaAudienceSegmentId: { type: integer, format: int64 }
        experimentId: { type: integer, format: int64 }
        channel: { type: string }
        painAngle: { type: string }
        promise: { type: string }
        offer: { type: string }
        activationStatus: { type: string }
        decisionSnapshotJson: { type: string }
    ExperimentMetaAudienceResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        experimentId: { type: integer, format: int64 }
        marketNicheId: { type: integer, format: int64 }
        metaAudienceId: { type: integer, format: int64 }
        metaAudienceSegmentId: { type: integer, format: int64 }
        cnaeCode: { type: string }
        audienceName: { type: string }
        segmentName: { type: string }
        activationStatus: { type: string }
        channel: { type: string }
        painAngle: { type: string }
        promise: { type: string }
        offer: { type: string }
        decisionSnapshotJson: { type: string }
        analysisSummary: { type: string }
