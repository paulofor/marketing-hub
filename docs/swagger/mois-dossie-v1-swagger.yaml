        limit:
          type: integer
          format: int32
    DossierIntakePendingResponse:
      type: object
      required:
        - claimed
        - jobs
      properties:
        claimed:
          type: boolean
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DossierIntakePendingJob'
    DossierIntakePendingJob:
