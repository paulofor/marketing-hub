openapi: 3.0.3
info:
  title: MOIS Sales Library Worker Dossiê Produto v1 API
  version: v1
  description: >-
    Swagger dos contratos internos do backend para o executor
    moissaleslibraryworker.dossieproduto.v1. O backend é a fonte de verdade
    da fila, auditoria, status e avanço; o worker consome pending e reporta
    request/response pelas rotas canônicas.
servers:
  - url: http://191.252.181.168
    description: Backend principal para uso do Codex e workers
tags:
  - name: moissaleslibraryworker.dossieproduto.v1
    description: Pipeline v1 de dossiê de produto da biblioteca de páginas de venda MOIS
paths:
  /api/internal/moissaleslibraryworker/dossieproduto/v1/{etapa}/stage-executions/{idExterno}/situacao:
    post:
      tags:
        - moissaleslibraryworker.dossieproduto.v1
      summary: Consulta registros existentes da auditoria por etapa, identificador externo e status
      operationId: situacaoMoisDossieProdutoV1StageExecutions
      parameters:
        - name: etapa
          in: path
          required: true
          schema:
            type: string
          description: Código slug da etapa do pipeline.
        - name: idExterno
          in: path
          required: true
          schema:
            type: string
          description: Chave operacional da página/produto MOIS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DossierSituacaoRequest"
      responses:
        '200':
          description: Registros encontrados com OR entre os status informados, ordenados por dataHora descendente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DossierSituacaoResponse"
  /api/internal/moissaleslibraryworker/dossieproduto/v1/intake/stage-executions/{idExterno}/start:
    post:
      tags:
        - moissaleslibraryworker.dossieproduto.v1
      summary: Inicia manualmente a etapa Entrada inicial do dossiê MOIS v1
      operationId: startMoisDossieProdutoV1IntakeStageExecution
      parameters:
        - name: idExterno
          in: path
          required: true
          schema:
            type: string
          description: Chave operacional da página/produto MOIS.
      responses:
        '200':
          description: Etapa iniciada sem corpo de resposta
  /api/internal/moissaleslibraryworker/dossieproduto/v1/intake/stage-executions/pending:
    post:
      tags:
        - moissaleslibraryworker.dossieproduto.v1
