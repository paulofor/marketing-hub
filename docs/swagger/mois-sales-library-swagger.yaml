openapi: 3.0.3
info:
  title: Marketing Hub - MOIS Sales Library
  version: 0.7.0
  description: Contratos operacionais da Biblioteca de Páginas de Vendas do MOIS. Na Fase 6, ingestão, captura HTML e análise usam `mois_sales_page` e `mois_sales_page_job_execution` como fonte de verdade operacional atual; tabelas legadas ficam congeladas em somente leitura para auditoria/backfill histórico e não alimentam a UI principal. A Etapa 3 (`MARKET_WARMUP_RESEARCH`) possui contrato HTTP completo para investigação de sucesso do produto, consulta, auditoria de fontes/sinais e integração interna do worker, incluindo respostas de erro padronizadas.
servers:
  - url: /api/mois/sales-library
paths:
  /urls:ingest:
    post:
      summary: Ingere URLs externas no modelo operacional novo
      description: Cria/atualiza primariamente `mois_sales_page`; quando a URL é nova, cria execução `PAGE_ANALYSIS` pendente em `mois_sales_page_job_execution`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryIngestRequest'
      responses:
        '202':
          description: URLs aceitas para ingestão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryIngestResponse'
  /hotmart-products:ingest:
    post:
      summary: Ingere URLs de produtos Hotmart coletados no modelo operacional novo
      description: Lê `mois_collected_reference` como origem bruta e grava o estado operacional em `mois_sales_page` com execução pendente em `mois_sales_page_job_execution` para páginas novas.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryHotmartCollectedIngestRequest'
      responses:
        '202':
          description: Produtos avaliados para ingestão operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryHotmartCollectedIngestResponse'
  /entries:
    get:
      summary: Lista entradas operacionais consolidadas da biblioteca
      description: Lê `mois_sales_page` como fonte de verdade operacional atual; não consulta `mois_sales_library_url_ingest` para alimentar a UI principal na Fase 6.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Entradas consolidadas em `mois_sales_page`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryEntryPageResponse'
  /collected-references/url-summary:
    get:
      summary: Resume URLs únicas da origem bruta coletada
      description: Lê `mois_collected_reference` somente como origem bruta e retorna contadores de URLs únicas efetivas, cobertura em `mois_sales_page` e desdobramento por origem/tipo sem expor contagem de linhas brutas.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cobertura de URLs únicas coletadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceUrlSummaryResponse'
  /pages:
    get:
      summary: Lista páginas operacionais consolidadas
      description: Retorna páginas de `mois_sales_page`; aceita filtro e ordenação de aquecimento para a biblioteca priorizar globalmente páginas com maior score da Etapa 3.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: marketWarmupFilter
          description: Filtro operacional da Etapa 3 usado pela biblioteca para priorização comercial.
          schema:
            type: string
            enum: [ALL, WITH_DOSSIER, HOT_OR_PROMISING, PENDING_OR_RUNNING, FAILED, WITHOUT_DOSSIER]
            default: ALL
        - in: query
          name: sort
          description: Ordenação da listagem consolidada; `MARKET_WARMUP_SCORE` prioriza os maiores scores salvos da Etapa 3.
          schema:
            type: string
            enum: [RECENT_ANALYSIS, MARKET_WARMUP_SCORE]
            default: RECENT_ANALYSIS
      responses:
        '200':
          description: Páginas consolidadas conforme filtro e ordenação solicitados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryPageListResponse'
  /pages/summary:
    get:
      summary: Resume páginas operacionais consolidadas
      description: Retorna contadores de `mois_sales_page`; o campo `captured` usa `html_bytes > 0` como critério canônico de HTML útil obtido para a etapa 1.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contadores globais da biblioteca operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryPageSummaryResponse'
  /pending:
    get:
      summary: Lista páginas pendentes elegíveis para análise comercial
      description: Retorna páginas de `mois_sales_page` com `html_bytes > 0` e sem análise concluída, anulada ou em execução, sem reservar job nem alterar status. Serve para auditoria operacional da fila real da Etapa 2.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: source
          schema:
            type: string
            default: HOTMART
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Páginas aptas para processamento pela etapa 2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryPendingAnalysisResponse'
  /jobs:
    get:
      summary: Lista execuções operacionais consolidadas
      description: Lê `mois_sales_page_job_execution`; campos compatíveis legados expostos no DTO representam identificadores operacionais novos.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Execuções consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryJobPageResponse'
  /jobs/{jobId}:
    get:
      summary: Busca uma execução operacional consolidada
      description: Lê `mois_sales_page_job_execution` pelo identificador exposto como `jobId`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Execução encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryJobResponse'
        '404':
          description: Execução não encontrada
  /jobs:claim:
    post:
      summary: Reserva a próxima execução de análise pelo modelo operacional novo
      description: Retorna `jobId` como identificador de `mois_sales_page_job_execution`; tabelas legadas não são atualizadas pela reserva operacional.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryClaimRequest'
      responses:
        '200':
          description: Resultado da reserva operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryClaimResponse'
  /jobs/{jobId}:complete:
    post:
      summary: Conclui uma execução de análise operacional
      description: Atualiza `mois_sales_page_job_execution` e o estado atual de `mois_sales_page`, sem escrita nas tabelas legadas.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryCompleteRequest'
      responses:
        '204':
          description: Execução concluída
  /jobs/{jobId}:fail:
    post:
      summary: Registra falha de uma execução de análise operacional
      description: Atualiza `mois_sales_page_job_execution` e `mois_sales_page`, sem escrita nas tabelas legadas.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryFailRequest'
      responses:
        '204':
          description: Falha registrada
  /collected-reference-html:claim:
    post:
      summary: Reserva uma referência coletada para captura de HTML bruto
      description: Lê `mois_collected_reference` como origem bruta, cria/atualiza `mois_sales_page` e retorna `captureId` como execução `COLLECTED_REFERENCE_HTML` em `mois_sales_page_job_execution`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlClaimRequest'
      responses:
        '200':
          description: Resultado da reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlClaimResponse'
  /collected-reference-html/{captureId}:complete:
    post:
      summary: Persiste HTML bruto capturado para a referência reservada
      description: Persiste HTML bruto, hash e metadados em `mois_sales_page_job_execution` e consolida status/bytes em `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlCompleteRequest'
      responses:
        '200':
          description: Captura persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /collected-reference-html/{captureId}:fail:
    post:
      summary: Registra falha de captura de HTML bruto
      description: Marca a execução `COLLECTED_REFERENCE_HTML` como `FAILED` e atualiza o último erro em `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlFailRequest'
      responses:
        '200':
          description: Falha persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /html-captures:claim:
    post:
      summary: Reserva uma execução de captura HTML pelo modelo operacional novo
      description: Retorna `snapshotId` como identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`; `pageId` identifica `mois_sales_page`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureClaimRequest'
      responses:
        '200':
          description: Resultado da reserva de captura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCaptureClaimResponse'
  /html-captures/{snapshotId}:complete:
    post:
      summary: Conclui uma execução de captura HTML operacional
      description: Atualiza `mois_sales_page_job_execution` com HTML bruto, hash, screenshot e metadados de redirecionamento; atualiza também o estado atual de `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureCompleteRequest'
      responses:
        '200':
          description: Captura concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCapturePersistResponse'
  /html-captures/{snapshotId}:fail:
    post:
      summary: Registra falha de uma execução de captura HTML operacional
      description: Atualiza falha em `mois_sales_page_job_execution` e reflete causa-raiz no estado atual de `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureFailRequest'
      responses:
        '200':
          description: Falha registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCapturePersistResponse'
  /snapshots:capture:
    post:
      summary: Executa captura HTML backend para páginas sem HTML útil usando o modelo operacional novo
      description: A etapa 1 seleciona páginas com `COALESCE(html_bytes, 0) = 0`; quando `force=true`, ignora cooldown/limite de falhas, mas continua sem recapturar páginas com `html_bytes > 0`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibrarySnapshotCaptureRequest'
      responses:
        '202':
          description: Captura executada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibrarySnapshotCaptureResponse'
  /pages/{pageId}/market-warmup:request:
    post:
      summary: Solicita investigação de sucesso do produto para uma página
      description: Cria ou reutiliza um job pendente da Etapa 3 para uma página de venda já existente. A execução agenda a investigação de autoridade, canais, funil, prova social e distribuição que podem explicar o sucesso do produto.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '202':
          description: Investigação de sucesso solicitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupRequestResponse'
        '400':
          $ref: '#/components/responses/MarketWarmupBadRequest'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
        '409':
          $ref: '#/components/responses/MarketWarmupConflict'
  /pages/{pageId}/market-warmup:
    get:
      summary: Consulta o dossiê de sucesso do produto da página
      description: Retorna o dossiê final da Etapa 3 com score, força da máquina de venda, motor provável, hipótese de sucesso e próxima investigação, sem JSON serializado em campos textuais.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Dossiê de sucesso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSummaryResponse'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
  /pages/{pageId}/market-warmup/search-attempts:
    get:
      summary: Lista tentativas de busca pública do dossiê
      description: Retorna as queries executadas pelo worker, quantos resultados foram lidos e por que não viraram fonte qualificada.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Tentativas de busca pública da investigação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSearchAttemptListResponse'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
  /pages/{pageId}/market-warmup/sources:
    get:
      summary: Lista fontes públicas da investigação de sucesso
      description: Retorna fontes rastreáveis usadas para explicar autoridade, canais, funil, prova social, distribuição e score da Etapa 3.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Fontes públicas da investigação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSourceListResponse'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
  /pages/{pageId}/market-warmup/signals:
    get:
      summary: Lista sinais que explicam a venda do produto
      description: Retorna os sinais extraídos das fontes públicas para explicar como o produto vendeu ou ganhou tração.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Sinais da investigação de sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSignalListResponse'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
  /market-warmup/jobs:claim:
    post:
      summary: Reserva internamente uma pesquisa pendente de aquecimento
      description: Endpoint de uso exclusivo do worker da Etapa 3. O worker conversa somente com o backend principal e não acessa o banco diretamente.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupClaimRequest'
      responses:
        '200':
          description: Resultado da reserva interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupClaimResponse'
        '400':
          $ref: '#/components/responses/MarketWarmupBadRequest'
        '403':
          $ref: '#/components/responses/MarketWarmupForbidden'
  /market-warmup/jobs:reprocess-stale:
    post:
      summary: Reprocessa jobs antigos presos em execução
      description: Ação operacional da Fase 10 para refileirar jobs `FETCHING` antigos sem acesso direto ao banco.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupReprocessStaleRequest'
      responses:
        '200':
          description: Quantidade de jobs refileirados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupReprocessStaleResponse'
        '400':
          $ref: '#/components/responses/MarketWarmupBadRequest'
        '403':
          $ref: '#/components/responses/MarketWarmupForbidden'
  /market-warmup/jobs/{jobId}:complete:
    post:
      summary: Conclui internamente uma pesquisa de aquecimento
      description: Recebe fontes, sinais e resumo final em estruturas próprias; é proibido enviar JSON serializado dentro de campos textuais funcionais.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/MarketWarmupJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupCompleteRequest'
      responses:
        '204':
          description: Pesquisa concluída
        '400':
          $ref: '#/components/responses/MarketWarmupBadRequest'
        '403':
          $ref: '#/components/responses/MarketWarmupForbidden'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
        '409':
          $ref: '#/components/responses/MarketWarmupConflict'
  /market-warmup/jobs/{jobId}:fail:
    post:
      summary: Registra falha interna da pesquisa de aquecimento
      description: Persiste categoria e mensagem operacional para a falha ficar visível por página e por job.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/MarketWarmupJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupFailRequest'
      responses:
        '204':
          description: Falha registrada
        '400':
          $ref: '#/components/responses/MarketWarmupBadRequest'
        '403':
          $ref: '#/components/responses/MarketWarmupForbidden'
        '404':
          $ref: '#/components/responses/MarketWarmupNotFound'
        '409':
          $ref: '#/components/responses/MarketWarmupConflict'
components:
  responses:
    MarketWarmupBadRequest:
      description: Requisição inválida para o contrato da Etapa 3. Use quando houver campo obrigatório ausente, tipo inválido, score fora de 0 a 100, `sourceIndex` inexistente ou tentativa de enviar JSON serializado em campo textual funcional.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketWarmupErrorResponse'
    MarketWarmupForbidden:
      description: Worker ou módulo sem permissão para executar contrato interno da Etapa 3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketWarmupErrorResponse'
    MarketWarmupNotFound:
      description: Página, job, resumo, fontes ou sinais da Etapa 3 não encontrados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketWarmupErrorResponse'
    MarketWarmupConflict:
      description: Estado operacional incompatível com a ação solicitada, como solicitar pesquisa sem análise comercial concluída, concluir job não reservado ou falhar job já finalizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketWarmupErrorResponse'
  parameters:
    PageId:
      in: path
      name: pageId
      required: true
      description: Identificador de `mois_sales_page`.
      schema:
        type: integer
        format: int64
    MarketWarmupJobId:
      in: path
      name: jobId
      required: true
      description: Identificador de `mois_sales_page_market_warmup_job`.
      schema:
        type: integer
        format: int64
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: integer
        format: int64
    CaptureId:
      in: path
      name: captureId
      required: true
      description: Identificador da execução `COLLECTED_REFERENCE_HTML` em `mois_sales_page_job_execution`.
      schema:
        type: integer
        format: int64
    SnapshotId:
      in: path
      name: snapshotId
      required: true
      description: Identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`.
      schema:
        type: integer
        format: int64
  schemas:
    MarketWarmupErrorResponse:
      type: object
      required: [errorCode, message, timestamp]
      description: Erro padronizado dos contratos da Etapa 3, sem payload bruto, segredo ou JSON serializado em campo textual funcional.
      properties:
        errorCode:
          type: string
          description: Código estável para tratamento operacional.
          example: MARKET_WARMUP_INVALID_STATE
        message:
          type: string
          description: Mensagem objetiva para operador ou worker entender a causa provável.
          example: A página ainda não possui análise comercial concluída para iniciar a Etapa 3.
        field:
          type: string
          nullable: true
          description: Campo inválido quando o erro for de validação de contrato.
          example: summary.scoreTotal
        jobId:
          type: integer
          format: int64
          nullable: true
          description: Job relacionado ao erro, quando disponível.
        pageId:
          type: integer
          format: int64
          nullable: true
          description: Página relacionada ao erro, quando disponível.
        timestamp:
          type: string
          format: date-time
          description: Momento em que o backend gerou a resposta de erro.
    MarketWarmupJobStatus:
      type: string
      enum: [PENDING, FETCHING, DONE, FAILED]
      description: Estado operacional do job da Etapa 3.
    MarketWarmupTemperature:
      type: string
      enum: [HOT, PROMISING, WARM, COLD, SATURATED]
      description: Temperatura comercial calculada para o mercado.
    MarketWarmupEcosystemType:
      type: string
      enum: [SPECIALISTS_HEATED, CREATORS_HEATED, RECURRING_PAIN_HEATED, COMPETITORS_HEATED, COLD_OR_UNEDUCATED, SATURATED]
      description: Tipo principal de ecossistema encontrado.
    MarketWarmupRecommendation:
