openapi: 3.0.3
info:
  title: Marketing Hub - MOIS Sales Library
  version: 0.3.0
  description: Contratos operacionais da Biblioteca de Páginas de Vendas do MOIS. Na Fase 5, os endpoints de jobs de análise usam `mois_sales_page` e `mois_sales_page_job_execution` como fonte operacional principal; tabelas legadas são mantidas apenas para auditoria transitória.
servers:
  - url: /api/mois/sales-library
paths:
  /jobs:claim:
    post:
      summary: Reserva a próxima execução de análise pelo modelo operacional novo
      description: Retorna `jobId` como identificador de `mois_sales_page_job_execution`; o backend espelha no legado somente para auditoria durante a transição.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryClaimRequest'
      responses:
        '200':
          description: Resultado da reserva operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryClaimResponse'
  /jobs/{jobId}:complete:
    post:
      summary: Conclui uma execução de análise operacional
      description: Atualiza primariamente `mois_sales_page_job_execution` e o estado atual de `mois_sales_page`; o legado recebe espelho de auditoria quando houver vínculo.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryCompleteRequest'
      responses:
        '204':
          description: Execução concluída
  /jobs/{jobId}:fail:
    post:
      summary: Registra falha de uma execução de análise operacional
      description: Atualiza primariamente `mois_sales_page_job_execution` e `mois_sales_page`; o legado recebe espelho de auditoria quando houver vínculo.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryFailRequest'
      responses:
        '204':
          description: Falha registrada
  /collected-reference-html:claim:
    post:
      summary: Reserva uma referência coletada para captura de HTML bruto
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlClaimRequest'
      responses:
        '200':
          description: Resultado da reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlClaimResponse'
  /collected-reference-html/{captureId}:complete:
    post:
      summary: Persiste HTML bruto capturado para a referência reservada
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlCompleteRequest'
      responses:
        '200':
          description: Captura persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /collected-reference-html/{captureId}:fail:
    post:
      summary: Registra falha de captura de HTML bruto
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlFailRequest'
      responses:
        '200':
          description: Falha persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /snapshots:capture:
    post:
      summary: Executa captura de snapshots HTML para páginas sem captura recente
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibrarySnapshotCaptureRequest'
      responses:
        '202':
          description: Captura executada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibrarySnapshotCaptureResponse'
components:
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: integer
        format: int64
    CaptureId:
      in: path
      name: captureId
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    SalesLibraryClaimRequest:
      type: object
      required: [workspaceId, source]
      properties:
        workspaceId:
          type: string
          example: workspace-001
        source:
          type: string
          example: HOTMART
    SalesLibraryClaimedJob:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
          description: Identificador de `mois_sales_page_job_execution` na Fase 5.
        pageId:
          type: integer
          format: int64
          description: Identificador de `mois_sales_page`.
        urlCanonical:
          type: string
        title:
          type: string
    SalesLibraryClaimResponse:
      type: object
      properties:
        claimed:
          type: boolean
        job:
          $ref: '#/components/schemas/SalesLibraryClaimedJob'
    SalesLibraryCompleteRequest:
      type: object
      properties:
        scoreTotal:
          type: number
        sectionsJson:
          type: string
        copyJson:
          type: string
        visualJson:
          type: string
        imageJson:
          type: string
        analysisNotes:
          type: string
        requestPayloadJson:
          type: string
        parserVersion:
          type: string
        promptVersion:
          type: string
        modelName:
          type: string
        analyzedAt:
          type: string
          format: date-time
    SalesLibraryFailRequest:
      type: object
      properties:
        errorCategory:
          type: string
        errorMessage:
          type: string
    CollectedReferenceHtmlClaimRequest:
      type: object
      required: [workspaceId, source]
      properties:
        workspaceId:
          type: string
          example: workspace-001
        source:
          type: string
          example: HOTMART
    CollectedReferenceHtmlCaptureJob:
      type: object
      properties:
        captureId:
          type: integer
          format: int64
        collectedReferenceId:
          type: integer
          format: int64
        collectionJobId:
          type: string
        referenceId:
          type: string
        source:
          type: string
        title:
          type: string
        url:
          type: string
        urlSource:
          type: string
    CollectedReferenceHtmlClaimResponse:
      type: object
      properties:
        claimed:
          type: boolean
        job:
          $ref: '#/components/schemas/CollectedReferenceHtmlCaptureJob'
    CollectedReferenceHtmlCompleteRequest:
      type: object
      required: [rawHtml]
      properties:
        rawHtml:
          type: string
        finalUrl:
          type: string
        httpStatus:
          type: integer
        contentType:
          type: string
        fetchedAt:
          type: string
          format: date-time
    CollectedReferenceHtmlFailRequest:
      type: object
      properties:
        errorCategory:
          type: string
        errorMessage:
          type: string
    CollectedReferenceHtmlPersistResponse:
      type: object
      properties:
        captureId:
          type: integer
          format: int64
        status:
          type: string
    SalesLibrarySnapshotCaptureRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
          example: workspace-001
        limit:
          type: integer
          minimum: 1
          maximum: 20
          example: 5
        force:
          type: boolean
          description: Quando verdadeiro, recaptura páginas mesmo que já possuam snapshot CAPTURED/FETCHING ou estejam em cooldown por falha recente/recorrente.
    SalesLibrarySnapshotCaptureItem:
      type: object
      properties:
        pageId:
          type: integer
          format: int64
        snapshotId:
          type: integer
          format: int64
          nullable: true
        urlCanonical:
          type: string
        redirectDestinationUrl:
          type: string
          nullable: true
          description: URL final após redirecionamentos da URL canônica original.
        redirectRootUrl:
          type: string
          nullable: true
          description: Raiz scheme://host[:port] derivada do destino redirecionado e usada como fallback quando o caminho final não entrega HTML capturável.
        status:
          type: string
          enum: [CAPTURED, DUPLICATE, FAILED]
        snapshotHash:
          type: string
          nullable: true
        httpStatus:
          type: integer
          nullable: true
        rawHtmlBytes:
          type: integer
          format: int64
        screenshotBytes:
          type: integer
          format: int64
        errorMessage:
          type: string
          nullable: true
          description: Categoria e detalhe operacional da falha, por exemplo HTTP_404, DESTINATION_DNS_FAILURE, REDIRECT_WITHOUT_HTML, TIMEOUT ou FINAL_URL_UNAVAILABLE.
    SalesLibrarySnapshotCaptureResponse:
      type: object
      properties:
        workspaceId:
          type: string
        requestedLimit:
          type: integer
        force:
          type: boolean
        processed:
          type: integer
        captured:
          type: integer
        failed:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesLibrarySnapshotCaptureItem'
        capturedAt:
          type: string
          format: date-time
