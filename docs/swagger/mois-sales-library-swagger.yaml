openapi: 3.0.3
info:
  title: Marketing Hub - MOIS Sales Library
  version: 0.6.0
  description: Contratos operacionais da Biblioteca de Páginas de Vendas do MOIS. Na Fase 6, ingestão, captura HTML e análise usam `mois_sales_page` e `mois_sales_page_job_execution` como fonte de verdade operacional atual; tabelas legadas ficam congeladas em somente leitura para auditoria/backfill histórico e não alimentam a UI principal.
servers:
  - url: /api/mois/sales-library
paths:
  /urls:ingest:
    post:
      summary: Ingere URLs externas no modelo operacional novo
      description: Cria/atualiza primariamente `mois_sales_page`; quando a URL é nova, cria execução `PAGE_ANALYSIS` pendente em `mois_sales_page_job_execution`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryIngestRequest'
      responses:
        '202':
          description: URLs aceitas para ingestão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryIngestResponse'
  /hotmart-products:ingest:
    post:
      summary: Ingere URLs de produtos Hotmart coletados no modelo operacional novo
      description: Lê `mois_collected_reference` como origem bruta e grava o estado operacional em `mois_sales_page` com execução pendente em `mois_sales_page_job_execution` para páginas novas.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryHotmartCollectedIngestRequest'
      responses:
        '202':
          description: Produtos avaliados para ingestão operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryHotmartCollectedIngestResponse'
  /entries:
    get:
      summary: Lista entradas operacionais consolidadas da biblioteca
      description: Lê `mois_sales_page` como fonte de verdade operacional atual; não consulta `mois_sales_library_url_ingest` para alimentar a UI principal na Fase 6.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Entradas consolidadas em `mois_sales_page`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryEntryPageResponse'
  /collected-references/url-summary:
    get:
      summary: Resume URLs únicas da origem bruta coletada
      description: Lê `mois_collected_reference` somente como origem bruta e retorna contadores de URLs únicas efetivas, cobertura em `mois_sales_page` e desdobramento por origem/tipo sem expor contagem de linhas brutas.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cobertura de URLs únicas coletadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceUrlSummaryResponse'
  /pages:
    get:
      summary: Lista páginas operacionais consolidadas
      description: Retorna páginas de `mois_sales_page` ordenadas por `last_analyzed_at` decrescente, com `updated_at` e `id` como desempate; a UI principal consome as 20 análises mais recentes usando `pageSize=20`.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Páginas consolidadas ordenadas da análise mais recente para a mais antiga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryPageListResponse'
  /pages/summary:
    get:
      summary: Resume páginas operacionais consolidadas
      description: Retorna contadores de `mois_sales_page`; o campo `captured` usa `html_bytes > 0` como critério canônico de HTML útil obtido para a etapa 1.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contadores globais da biblioteca operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryPageSummaryResponse'
  /jobs:
    get:
      summary: Lista execuções operacionais consolidadas
      description: Lê `mois_sales_page_job_execution`; campos compatíveis legados expostos no DTO representam identificadores operacionais novos.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Execuções consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryJobPageResponse'
  /jobs/{jobId}:
    get:
      summary: Busca uma execução operacional consolidada
      description: Lê `mois_sales_page_job_execution` pelo identificador exposto como `jobId`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Execução encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryJobResponse'
        '404':
          description: Execução não encontrada
  /jobs:claim:
    post:
      summary: Reserva a próxima execução de análise pelo modelo operacional novo
      description: Retorna `jobId` como identificador de `mois_sales_page_job_execution`; tabelas legadas não são atualizadas pela reserva operacional.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryClaimRequest'
      responses:
        '200':
          description: Resultado da reserva operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryClaimResponse'
  /jobs/{jobId}:complete:
    post:
      summary: Conclui uma execução de análise operacional
      description: Atualiza `mois_sales_page_job_execution` e o estado atual de `mois_sales_page`, sem escrita nas tabelas legadas.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryCompleteRequest'
      responses:
        '204':
          description: Execução concluída
  /jobs/{jobId}:fail:
    post:
      summary: Registra falha de uma execução de análise operacional
      description: Atualiza `mois_sales_page_job_execution` e `mois_sales_page`, sem escrita nas tabelas legadas.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryFailRequest'
      responses:
        '204':
          description: Falha registrada
  /collected-reference-html:claim:
    post:
      summary: Reserva uma referência coletada para captura de HTML bruto
      description: Lê `mois_collected_reference` como origem bruta, cria/atualiza `mois_sales_page` e retorna `captureId` como execução `COLLECTED_REFERENCE_HTML` em `mois_sales_page_job_execution`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlClaimRequest'
      responses:
        '200':
          description: Resultado da reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlClaimResponse'
  /collected-reference-html/{captureId}:complete:
    post:
      summary: Persiste HTML bruto capturado para a referência reservada
      description: Persiste HTML bruto, hash e metadados em `mois_sales_page_job_execution` e consolida status/bytes em `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlCompleteRequest'
      responses:
        '200':
          description: Captura persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /collected-reference-html/{captureId}:fail:
    post:
      summary: Registra falha de captura de HTML bruto
      description: Marca a execução `COLLECTED_REFERENCE_HTML` como `FAILED` e atualiza o último erro em `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlFailRequest'
      responses:
        '200':
          description: Falha persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /html-captures:claim:
    post:
      summary: Reserva uma execução de captura HTML pelo modelo operacional novo
      description: Retorna `snapshotId` como identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`; `pageId` identifica `mois_sales_page`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureClaimRequest'
      responses:
        '200':
          description: Resultado da reserva de captura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCaptureClaimResponse'
  /html-captures/{snapshotId}:complete:
    post:
      summary: Conclui uma execução de captura HTML operacional
      description: Atualiza `mois_sales_page_job_execution` com HTML bruto, hash, screenshot e metadados de redirecionamento; atualiza também o estado atual de `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureCompleteRequest'
      responses:
        '200':
          description: Captura concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCapturePersistResponse'
  /html-captures/{snapshotId}:fail:
    post:
      summary: Registra falha de uma execução de captura HTML operacional
      description: Atualiza falha em `mois_sales_page_job_execution` e reflete causa-raiz no estado atual de `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureFailRequest'
      responses:
        '200':
          description: Falha registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCapturePersistResponse'
  /snapshots:capture:
    post:
      summary: Executa captura HTML backend para páginas sem HTML útil usando o modelo operacional novo
      description: A etapa 1 seleciona páginas com `COALESCE(html_bytes, 0) = 0`; quando `force=true`, ignora cooldown/limite de falhas, mas continua sem recapturar páginas com `html_bytes > 0`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibrarySnapshotCaptureRequest'
      responses:
        '202':
          description: Captura executada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibrarySnapshotCaptureResponse'
  /pages/{pageId}/market-warmup:request:
    post:
      summary: Solicita pesquisa de aquecimento de mercado para uma página
      description: Cria ou reutiliza um job pendente da Etapa 3 para uma página de venda já existente. A execução apenas agenda a pesquisa; o worker interno processa posteriormente via endpoints de claim e conclusão.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '202':
          description: Pesquisa de aquecimento solicitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupRequestResponse'
        '404':
          description: Página não encontrada
  /pages/{pageId}/market-warmup:
    get:
      summary: Consulta o resumo da pesquisa de aquecimento da página
      description: Retorna o dossiê final da Etapa 3 com score, temperatura, tipo de ecossistema e recomendação objetiva, sem JSON serializado em campos textuais.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Resumo de aquecimento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSummaryResponse'
        '404':
          description: Pesquisa ainda inexistente para a página
  /pages/{pageId}/market-warmup/sources:
    get:
      summary: Lista fontes públicas da pesquisa de aquecimento
      description: Retorna fontes rastreáveis usadas para sustentar o score e a recomendação da Etapa 3.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Fontes públicas da pesquisa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSourceListResponse'
  /pages/{pageId}/market-warmup/signals:
    get:
      summary: Lista sinais comerciais da pesquisa de aquecimento
      description: Retorna os sinais extraídos das fontes públicas para explicar o score da Etapa 3.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Sinais comerciais da pesquisa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupSignalListResponse'
  /market-warmup/jobs:claim:
    post:
      summary: Reserva internamente uma pesquisa pendente de aquecimento
      description: Endpoint de uso exclusivo do worker da Etapa 3. O worker conversa somente com o backend principal e não acessa o banco diretamente.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupClaimRequest'
      responses:
        '200':
          description: Resultado da reserva interna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWarmupClaimResponse'
  /market-warmup/jobs/{jobId}:complete:
    post:
      summary: Conclui internamente uma pesquisa de aquecimento
      description: Recebe fontes, sinais e resumo final em estruturas próprias; é proibido enviar JSON serializado dentro de campos textuais funcionais.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/MarketWarmupJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupCompleteRequest'
      responses:
        '204':
          description: Pesquisa concluída
        '400':
          description: Payload inválido para o contrato da Etapa 3
        '404':
          description: Job não encontrado
  /market-warmup/jobs/{jobId}:fail:
    post:
      summary: Registra falha interna da pesquisa de aquecimento
      description: Persiste categoria e mensagem operacional para a falha ficar visível por página e por job.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/MarketWarmupJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWarmupFailRequest'
      responses:
        '204':
          description: Falha registrada
        '404':
          description: Job não encontrado
components:
  parameters:
    PageId:
      in: path
      name: pageId
      required: true
      description: Identificador de `mois_sales_page`.
      schema:
        type: integer
        format: int64
    MarketWarmupJobId:
      in: path
      name: jobId
      required: true
      description: Identificador de `mois_sales_page_market_warmup_job`.
      schema:
        type: integer
        format: int64
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: integer
        format: int64
    CaptureId:
      in: path
      name: captureId
      required: true
      description: Identificador da execução `COLLECTED_REFERENCE_HTML` em `mois_sales_page_job_execution`.
      schema:
        type: integer
        format: int64
    SnapshotId:
      in: path
      name: snapshotId
      required: true
      description: Identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`.
      schema:
        type: integer
        format: int64
  schemas:
    MarketWarmupJobStatus:
      type: string
      enum: [PENDING, FETCHING, DONE, FAILED]
      description: Estado operacional do job da Etapa 3.
    MarketWarmupTemperature:
      type: string
      enum: [HOT, PROMISING, WARM, COLD, SATURATED]
      description: Temperatura comercial calculada para o mercado.
    MarketWarmupEcosystemType:
      type: string
      enum: [SPECIALISTS_HEATED, CREATORS_HEATED, RECURRING_PAIN_HEATED, COMPETITORS_HEATED, COLD_OR_UNEDUCATED, SATURATED]
      description: Tipo principal de ecossistema encontrado.
    MarketWarmupRecommendation:
      type: string
      enum: [PRIORITIZE, OBSERVE, RESEARCH_MORE, DISCARD, SATURATED_REQUIRES_ANGLE]
      description: Decisão comercial objetiva da Etapa 3.
    MarketWarmupPlatform:
      type: string
      enum: [WEB, GOOGLE, YOUTUBE, INSTAGRAM, TIKTOK, BLOG, FORUM, COMMUNITY, MARKETPLACE, REVIEW_SITE, OTHER]
      description: Plataforma pública de origem da evidência.
    MarketWarmupSourceType:
      type: string
      enum: [PRODUCT_PRESENCE, CREATOR_CONTENT, SPECIALIST_CONTENT, COMMUNITY_DISCUSSION, REVIEW, COMPLAINT, COMPETITOR_OFFER, AFFILIATE_PROMOTION, SOCIAL_POST, SEARCH_RESULT, OTHER]
      description: Tipo funcional da fonte pública.
    MarketWarmupSignalType:
      type: string
      enum: [PAIN_EXPLICIT, BUYING_INTENT, OBJECTION, SOCIAL_PROOF, CREATOR_AUTHORITY, COMPETITOR_OFFER, COMMUNITY_ACTIVITY, CONTENT_RECENCY, SATURATION_RISK, CHANNEL_FIT]
      description: Sinal comercial extraído de fonte pública.
    MarketWarmupRequestResponse:
      type: object
      properties:
        pageId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/MarketWarmupJobStatus'
        createdAt:
          type: string
          format: date-time
    MarketWarmupSummaryResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        pageId:
          type: integer
          format: int64
        scoreTotal:
          type: number
        marketTemperature:
          $ref: '#/components/schemas/MarketWarmupTemperature'
        ecosystemType:
          $ref: '#/components/schemas/MarketWarmupEcosystemType'
        recommendation:
          $ref: '#/components/schemas/MarketWarmupRecommendation'
        mainPains:
          type: array
          items: { type: string }
        mainObjections:
          type: array
          items: { type: string }
        mainPromises:
          type: array
          items: { type: string }
        mainChannels:
          type: array
          items: { type: string }
        mainCompetitors:
          type: array
          items: { type: string }
        saturationRisk:
          type: string
          nullable: true
        opportunityRecommendation:
          type: string
          nullable: true
        nextExperimentSuggestion:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MarketWarmupJobStatus'
        errorCategory:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarketWarmupSourceResponse:
      type: object
      properties:
        sourceId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        pageId:
          type: integer
          format: int64
        platform:
          $ref: '#/components/schemas/MarketWarmupPlatform'
        sourceType:
          $ref: '#/components/schemas/MarketWarmupSourceType'
        sourceUrl:
          type: string
          format: uri
        sourceTitle:
          type: string
          nullable: true
        authorName:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        followersOrSubscribers:
          type: integer
          format: int64
          nullable: true
        viewsCount:
          type: integer
          format: int64
          nullable: true
        likesCount:
          type: integer
          format: int64
          nullable: true
        commentsCount:
          type: integer
          format: int64
          nullable: true
        recencyScore:
          type: number
          nullable: true
        engagementScore:
          type: number
          nullable: true
        evidenceSummary:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarketWarmupSourceListResponse:
      type: object
      properties:
        pageId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketWarmupSourceResponse'
    MarketWarmupSignalResponse:
      type: object
      properties:
        signalId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        sourceId:
          type: integer
          format: int64
        pageId:
          type: integer
          format: int64
        signalType:
          $ref: '#/components/schemas/MarketWarmupSignalType'
        signalStrength:
          type: number
        signalText:
          type: string
        businessInterpretation:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    MarketWarmupSignalListResponse:
      type: object
      properties:
        pageId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketWarmupSignalResponse'
    MarketWarmupClaimRequest:
      type: object
      required: [workspaceId, workerId]
      properties:
        workspaceId:
          type: string
        workerId:
          type: string
    MarketWarmupClaimedJob:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        pageId:
          type: integer
          format: int64
        workspaceId:
          type: string
        urlCanonical:
          type: string
        title:
          type: string
          nullable: true
        offerSummary:
          type: string
          nullable: true
        mechanismSummary:
          type: string
          nullable: true
        promiseSummary:
          type: string
          nullable: true
        proofSummary:
          type: string
          nullable: true
    MarketWarmupClaimResponse:
      type: object
      properties:
        claimed:
          type: boolean
        job:
          $ref: '#/components/schemas/MarketWarmupClaimedJob'
    MarketWarmupSourceCompleteItem:
      type: object
      required: [platform, sourceType, sourceUrl]
      properties:
        platform:
          $ref: '#/components/schemas/MarketWarmupPlatform'
        sourceType:
