openapi: 3.0.3
info:
  title: Marketing Hub - MOIS Sales Library
  version: 0.5.0
  description: Contratos operacionais da Biblioteca de Páginas de Vendas do MOIS. Na Fase 6, ingestão, captura HTML e análise usam `mois_sales_page` e `mois_sales_page_job_execution` como fonte de verdade operacional atual; tabelas legadas ficam congeladas em somente leitura para auditoria/backfill histórico e não alimentam a UI principal.
servers:
  - url: /api/mois/sales-library
paths:
  /urls:ingest:
    post:
      summary: Ingere URLs externas no modelo operacional novo
      description: Cria/atualiza primariamente `mois_sales_page`; quando a URL é nova, cria execução `PAGE_ANALYSIS` pendente em `mois_sales_page_job_execution`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryIngestRequest'
      responses:
        '202':
          description: URLs aceitas para ingestão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryIngestResponse'
  /hotmart-products:ingest:
    post:
      summary: Ingere URLs de produtos Hotmart coletados no modelo operacional novo
      description: Lê `mois_collected_reference` como origem bruta e grava o estado operacional em `mois_sales_page` com execução pendente em `mois_sales_page_job_execution` para páginas novas.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryHotmartCollectedIngestRequest'
      responses:
        '202':
          description: Produtos avaliados para ingestão operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryHotmartCollectedIngestResponse'
  /entries:
    get:
      summary: Lista entradas operacionais consolidadas da biblioteca
      description: Lê `mois_sales_page` como fonte de verdade operacional atual; não consulta `mois_sales_library_url_ingest` para alimentar a UI principal na Fase 6.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Entradas consolidadas em `mois_sales_page`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryEntryPageResponse'
  /jobs:
    get:
      summary: Lista execuções operacionais consolidadas
      description: Lê `mois_sales_page_job_execution`; campos compatíveis legados expostos no DTO representam identificadores operacionais novos.
      tags: [MOIS Sales Library]
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Execuções consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryJobPageResponse'
  /jobs/{jobId}:
    get:
      summary: Busca uma execução operacional consolidada
      description: Lê `mois_sales_page_job_execution` pelo identificador exposto como `jobId`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Execução encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryJobResponse'
        '404':
          description: Execução não encontrada
  /jobs:claim:
    post:
      summary: Reserva a próxima execução de análise pelo modelo operacional novo
      description: Retorna `jobId` como identificador de `mois_sales_page_job_execution`; tabelas legadas não são atualizadas pela reserva operacional.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryClaimRequest'
      responses:
        '200':
          description: Resultado da reserva operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibraryClaimResponse'
  /jobs/{jobId}:complete:
    post:
      summary: Conclui uma execução de análise operacional
      description: Atualiza `mois_sales_page_job_execution` e o estado atual de `mois_sales_page`, sem escrita nas tabelas legadas.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryCompleteRequest'
      responses:
        '204':
          description: Execução concluída
  /jobs/{jobId}:fail:
    post:
      summary: Registra falha de uma execução de análise operacional
      description: Atualiza `mois_sales_page_job_execution` e `mois_sales_page`, sem escrita nas tabelas legadas.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibraryFailRequest'
      responses:
        '204':
          description: Falha registrada
  /collected-reference-html:claim:
    post:
      summary: Reserva uma referência coletada para captura de HTML bruto
      description: Lê `mois_collected_reference` como origem bruta, cria/atualiza `mois_sales_page` e retorna `captureId` como execução `COLLECTED_REFERENCE_HTML` em `mois_sales_page_job_execution`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlClaimRequest'
      responses:
        '200':
          description: Resultado da reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlClaimResponse'
  /collected-reference-html/{captureId}:complete:
    post:
      summary: Persiste HTML bruto capturado para a referência reservada
      description: Persiste HTML bruto, hash e metadados em `mois_sales_page_job_execution` e consolida status/bytes em `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlCompleteRequest'
      responses:
        '200':
          description: Captura persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /collected-reference-html/{captureId}:fail:
    post:
      summary: Registra falha de captura de HTML bruto
      description: Marca a execução `COLLECTED_REFERENCE_HTML` como `FAILED` e atualiza o último erro em `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectedReferenceHtmlFailRequest'
      responses:
        '200':
          description: Falha persistida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectedReferenceHtmlPersistResponse'
  /html-captures:claim:
    post:
      summary: Reserva uma execução de captura HTML pelo modelo operacional novo
      description: Retorna `snapshotId` como identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`; `pageId` identifica `mois_sales_page`.
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureClaimRequest'
      responses:
        '200':
          description: Resultado da reserva de captura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCaptureClaimResponse'
  /html-captures/{snapshotId}:complete:
    post:
      summary: Conclui uma execução de captura HTML operacional
      description: Atualiza `mois_sales_page_job_execution` com HTML bruto, hash, screenshot e metadados de redirecionamento; atualiza também o estado atual de `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureCompleteRequest'
      responses:
        '200':
          description: Captura concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCapturePersistResponse'
  /html-captures/{snapshotId}:fail:
    post:
      summary: Registra falha de uma execução de captura HTML operacional
      description: Atualiza falha em `mois_sales_page_job_execution` e reflete causa-raiz no estado atual de `mois_sales_page`.
      tags: [MOIS Sales Library]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlCaptureFailRequest'
      responses:
        '200':
          description: Falha registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlCapturePersistResponse'
  /snapshots:capture:
    post:
      summary: Executa captura HTML backend para páginas sem captura recente usando o modelo operacional novo
      tags: [MOIS Sales Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesLibrarySnapshotCaptureRequest'
      responses:
        '202':
          description: Captura executada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesLibrarySnapshotCaptureResponse'
components:
  parameters:
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: integer
        format: int64
    CaptureId:
      in: path
      name: captureId
      required: true
      description: Identificador da execução `COLLECTED_REFERENCE_HTML` em `mois_sales_page_job_execution`.
      schema:
        type: integer
        format: int64
    SnapshotId:
      in: path
      name: snapshotId
      required: true
      description: Identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`.
      schema:
        type: integer
        format: int64
  schemas:
    SalesLibraryClaimRequest:
      type: object
      required: [workspaceId, source]
      properties:
        workspaceId:
          type: string
          example: workspace-001
        source:
          type: string
          example: HOTMART
    SalesLibraryClaimedJob:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
          description: Identificador de `mois_sales_page_job_execution` na Fase 5.
        pageId:
          type: integer
          format: int64
          description: Identificador de `mois_sales_page`.
        urlCanonical:
          type: string
        title:
          type: string
    SalesLibraryClaimResponse:
      type: object
      properties:
        claimed:
          type: boolean
        job:
          $ref: '#/components/schemas/SalesLibraryClaimedJob'
    SalesLibraryCompleteRequest:
      type: object
      properties:
        scoreTotal:
          type: number
        sectionsJson:
          type: string
        copyJson:
          type: string
        visualJson:
          type: string
        imageJson:
          type: string
        analysisNotes:
          type: string
        requestPayloadJson:
          type: string
        parserVersion:
          type: string
        promptVersion:
          type: string
        modelName:
          type: string
        analyzedAt:
          type: string
          format: date-time
    SalesLibraryFailRequest:
      type: object
      properties:
        errorCategory:
          type: string
        errorMessage:
          type: string
    CollectedReferenceHtmlClaimRequest:
      type: object
      required: [workspaceId, source]
      properties:
        workspaceId:
          type: string
          example: workspace-001
        source:
          type: string
          example: HOTMART
    CollectedReferenceHtmlCaptureJob:
      type: object
      properties:
        captureId:
          type: integer
          format: int64
        collectedReferenceId:
          type: integer
          format: int64
        collectionJobId:
          type: string
        referenceId:
          type: string
        source:
          type: string
        title:
          type: string
        url:
          type: string
        urlSource:
          type: string
    CollectedReferenceHtmlClaimResponse:
      type: object
      properties:
        claimed:
          type: boolean
        job:
          $ref: '#/components/schemas/CollectedReferenceHtmlCaptureJob'
    CollectedReferenceHtmlCompleteRequest:
      type: object
      required: [rawHtml]
      properties:
        rawHtml:
          type: string
        finalUrl:
          type: string
        httpStatus:
          type: integer
        contentType:
          type: string
        fetchedAt:
          type: string
          format: date-time
    CollectedReferenceHtmlFailRequest:
      type: object
      properties:
        errorCategory:
          type: string
        errorMessage:
          type: string
    CollectedReferenceHtmlPersistResponse:
      type: object
      properties:
        captureId:
          type: integer
          format: int64
        status:
          type: string
    SalesLibraryIngestRequest:
      type: object
      required: [workspaceId, source, urls]
      properties:
        workspaceId:
          type: string
        source:
          type: string
        urls:
          type: array
          items:
            $ref: '#/components/schemas/SalesLibraryUrlItem'
    SalesLibraryUrlItem:
      type: object
      required: [url]
      properties:
        url:
          type: string
        title:
          type: string
        capturedAt:
          type: string
          format: date-time
    SalesLibraryIngestResponse:
      type: object
      properties:
        workspaceId:
          type: string
        source:
          type: string
        received:
          type: integer
        persisted:
          type: integer
    SalesLibraryHotmartCollectedIngestRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
        jobId:
          type: string
          nullable: true
        limit:
          type: integer
          maximum: 400
          nullable: true
    SalesLibraryHotmartCollectedIngestResponse:
      type: object
      properties:
        workspaceId:
          type: string
        jobId:
          type: string
          nullable: true
        collectedReferencesRead:
          type: integer
        eligibleUrls:
          type: integer
        insertedUrls:
          type: integer
        updatedUrls:
          type: integer
        jobsCreated:
          type: integer
        skippedWithoutUrl:
          type: integer
    SalesLibraryJobResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de `mois_sales_page_job_execution`.
        urlIngestId:
          type: integer
          format: int64
          description: Campo compatível; na Fase 5 representa `mois_sales_page.id`.
        status:
          type: string
        attempts:
          type: integer
        errorCategory:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    SalesLibraryJobPageResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesLibraryJobResponse'
    SalesLibraryEntryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de `mois_sales_page`.
        workspaceId:
          type: string
        source:
          type: string
        urlOriginal:
          type: string
        urlCanonical:
          type: string
        title:
          type: string
          nullable: true
        ingestCount:
          type: integer
        firstCapturedAt:
          type: string
          format: date-time
          nullable: true
          description: Campo compatível; na Fase 5 representa `mois_sales_page.first_seen_at`.
        lastCapturedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    SalesLibraryEntryPageResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesLibraryEntryResponse'
    HtmlCaptureClaimRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 20
        force:
          type: boolean
    HtmlCaptureJobResponse:
      type: object
      properties:
        snapshotId:
          type: integer
          format: int64
          description: Identificador compatível da execução `HTML_CAPTURE`.
        pageId:
          type: integer
          format: int64
        urlCanonical:
          type: string
        title:
          type: string
    HtmlCaptureClaimResponse:
      type: object
      properties:
        claimed:
          type: boolean
        job:
          $ref: '#/components/schemas/HtmlCaptureJobResponse'
    HtmlCaptureCompleteRequest:
      type: object
      required: [rawHtml]
      properties:
        rawHtml:
          type: string
        finalUrl:
          type: string
          nullable: true
        redirectDestinationUrl:
          type: string
          nullable: true
        redirectRootUrl:
          type: string
          nullable: true
        httpStatus:
          type: integer
          nullable: true
        contentType:
          type: string
          nullable: true
        sha256:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
    HtmlCaptureFailRequest:
      type: object
      properties:
        errorCategory:
          type: string
        errorMessage:
          type: string
        redirectDestinationUrl:
          type: string
          nullable: true
        redirectRootUrl:
          type: string
          nullable: true
        httpStatus:
          type: integer
          nullable: true
    HtmlCapturePersistResponse:
      type: object
      properties:
        snapshotId:
          type: integer
          format: int64
          description: Identificador compatível da execução `HTML_CAPTURE`.
        status:
          type: string
    SalesLibrarySnapshotCaptureRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
          example: workspace-001
        limit:
          type: integer
          minimum: 1
          maximum: 20
          example: 5
        force:
          type: boolean
          description: Quando verdadeiro, recaptura páginas mesmo que já possuam captura CAPTURED/FETCHING ou estejam em cooldown por falha recente/recorrente.
    SalesLibrarySnapshotCaptureItem:
      type: object
      properties:
        pageId:
          type: integer
          format: int64
        snapshotId:
          type: integer
          format: int64
          nullable: true
          description: Identificador compatível da execução `HTML_CAPTURE` em `mois_sales_page_job_execution`.
        urlCanonical:
          type: string
        redirectDestinationUrl:
          type: string
          nullable: true
          description: URL final após redirecionamentos da URL canônica original.
        redirectRootUrl:
          type: string
          nullable: true
          description: Raiz scheme://host[:port] derivada do destino redirecionado e usada como fallback quando o caminho final não entrega HTML capturável.
        status:
          type: string
          enum: [CAPTURED, DUPLICATE, FAILED]
        snapshotHash:
          type: string
          nullable: true
        httpStatus:
          type: integer
          nullable: true
        rawHtmlBytes:
          type: integer
          format: int64
        screenshotBytes:
          type: integer
          format: int64
        errorMessage:
          type: string
          nullable: true
          description: Categoria e detalhe operacional da falha, por exemplo HTTP_404, DESTINATION_DNS_FAILURE, REDIRECT_WITHOUT_HTML, TIMEOUT ou FINAL_URL_UNAVAILABLE.
    SalesLibrarySnapshotCaptureResponse:
      type: object
      properties:
        workspaceId:
          type: string
        requestedLimit:
          type: integer
        force:
          type: boolean
        processed:
          type: integer
        captured:
          type: integer
        failed:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesLibrarySnapshotCaptureItem'
        capturedAt:
          type: string
          format: date-time
