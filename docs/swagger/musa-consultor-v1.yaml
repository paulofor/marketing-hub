openapi: 3.0.3
info:
  title: MUSA consultor privado v1
  version: 1.0.0
  description: Jornada contínua segregada. Não concede assinatura, cobrança ou autorização comercial.
servers:
  - url: /api/pde/vega/consultor/v1
security:
  - privateSession: []
paths:
  /contract:
    get:
      security: []
      responses:
        '200': {description: Capacidade implementada, campos e limites privados}
  /login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessKey]
              properties:
                accessKey: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200': {description: Identidade e Set-Cookie HttpOnly Secure SameSite Strict; não altera expiresAt}
        '401': {description: Acesso inválido ou vencido}
  /logout:
    post:
      responses:
        '204': {description: Cookie removido; dados preservados}
  /workspace:
    get:
      responses:
        '200': {description: Rascunho, escolhas e preferência do proprietário; Cache-Control no-store}
        '401': {description: Acesso vencido ou revogado}
        '409': {description: Homologação encerrada ou contexto incompatível}
  /commands:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, payload]
              properties:
                action: {type: string, enum: [consent, draft, generate, save, event]}
                payload:
                  type: object
                  description: 'consent: accepted=true. draft: revision, answers. generate: operationKey (16–80 alfanuméricos/hífen), revision, answers, parentChoiceId opcional. save: operationId, revision. event: operationId, eventType. occasion<=160; existingSelection/stylePreference/reflection<=300. Reflection opcional.'
      responses:
        '200': {description: Operação persistida, inclusive bloqueio funcional sem cartão; replay devolve resultado existente}
        '409': {description: Revisão antiga, chave com outra entrada, recurso alheio ou limite técnico}
  /operations/{id}:
    get:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Operação própria já persistida, sem reexecução}
        '409': {description: Indisponível neste acesso, sem revelar outro proprietário}
  /internal/cycles/{cycleId}/access:
    post:
      security: [{operator: []}]
      parameters:
        - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Emissão sintética com chave entregue uma vez, hash persistido e expiração em 90 dias; máximo 18 acessos por ciclo/versão}
        '401': {description: Operador não autenticado}
        '409': {description: Ciclo fechado, versão incompatível, encerramento privado ou limite atingido}
  /internal/cycles/{cycleId}/harness-access:
    post:
      security: [{operator: []}]
      description: >-
        Reserva sob lock uma identidade cumulativa (máximo18) por cenário/dispositivo/papel.
        Pode adotar identidade AGENT_VALIDATION legada do mesmo contexto sem ler seus dados
        no workspace novo. Mantém raiz histórica, expiração, revogação e limite cumulativo24
        operações. Cada attemptId possui workspace próprio; tentativa ativa não pode ser
        substituída. Retry exige a mesma recoveryKey, armazenada somente como hash.
        Uma tentativa histórica não pode ser reaberta; fechamento do ciclo/homologação prevalece.
      parameters:
        - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, experimentId, prototypeVersion, sourceReference, attemptId, scenarioCode, deviceProfile, role, recoveryKey]
              properties:
                productId: {type: integer, format: int64}
                experimentId: {type: integer, format: int64}
                prototypeVersion: {type: string, enum: [musa-consultor-pwa-v1]}
                sourceReference: {type: string, pattern: '^experiment:[1-9][0-9]*$'}
                attemptId: {type: string, pattern: '^[A-Za-z0-9-]{16,80}$'}
                scenarioCode: {type: string, enum: [ADHERENT, RECOVERY, SAFETY]}
                deviceProfile: {type: string, enum: [DESKTOP_1440, IPHONE_15_PRO, PIXEL_7]}
                role: {type: string, enum: [PRIMARY, ISOLATION]}
                recoveryKey: {type: string, pattern: '^[a-f0-9]{64}$', writeOnly: true}
      responses:
        '200': {description: Mesma identidade e prazo; tentativa e compartimento explícitos, sem credenciais na resposta}
        '401': {description: Operador inválido ou identidade expirada/revogada}
        '409': {description: Contexto incompatível, encerramento, tentativa ativa/conflitante ou limite cumulativo}
  /internal/harness-access/finish:
    post:
      security: [{operator: [], privateSession: []}]
      description: Término idempotente da tentativa corrente; conserva dados e consumo, não aprova a homologação.
      responses:
        '200': {description: Estado e histórico preservados; permite próxima tentativa isolada}
        '401': {description: Sessão inválida}
        '409': {description: Acesso alheio ao harness ou contexto encerrado}
  /internal/access/{id}/renew:
    post:
      security: [{operator: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Mesma identidade e dados com validade renovada por 90 dias e auditoria; somente homologação aberta}
        '409': {description: Homologação fechada ou acesso revogado}
  /internal/cycles/{cycleId}/close:
    post:
      security: [{operator: []}]
      parameters:
        - {name: cycleId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Revogação de todos os acessos da versão no ciclo; dados preservados; reemissão bloqueada}
  /internal/report:
    get:
      security: [{operator: [], privateSession: []}]
      responses:
        '200': {description: Operações, entradas protegidas, regras, horários, auditoria e sinais segregados AGENT_VALIDATION/mh_internal_test; zero chamadas externas}
  /internal/events:
    post:
      security: [{operator: [], privateSession: []}]
      responses:
        '200': {description: Transporte sintético dos cinco sinais; CHECKOUT_STARTED permanece SIMULATED_NO_CHARGE}
components:
  securitySchemes:
    privateSession: {type: apiKey, in: cookie, name: musa-consultor-session}
    operator: {type: apiKey, in: header, name: X-PDE-Internal-Token}
