openapi: 3.1.0
info:
  title: Marketing Hub API
  version: 1.0.0
  description: |
    REST surface used by MarketingHub frontends, workers and integrations.
    This document highlights the orchestration endpoints introduced in Journey
    Orchestration Stage 2 while keeping the existing experiment and creative
    resources available.
servers:
  - url: https://api.marketinghub.local
    description: Production (placeholder)
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Journeys
    description: Modelagem de templates, passos e instâncias operacionais da jornada AIDA.
  - name: Journey Assignments
    description: Vínculo de leads ou segmentos às jornadas em execução.
  - name: Journey Events
    description: Ingestão de eventos multicanal utilizados para medir e avançar a jornada.
  - name: AI
    description: Observabilidade das execuções do worker de inteligência artificial.
paths:
  /api/ai/generations:
    get:
      tags: [AI]
      summary: Listar execuções do worker de IA
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - in: query
          name: domain
          schema:
            type: string
          description: Filtra por domínio da geração (por exemplo, NICHE_HYPOTHESIS).
      responses:
        '200':
          description: Lista paginada com as gerações registradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiWorkerGeneration'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
  /api/niches/{nicheId}/experiments:
    post:
      tags: [Experiments]
      summary: Criar experimento
      parameters:
        - $ref: '#/components/parameters/NicheIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Experimento criado com sucesso
        '400':
          description: Dados inválidos
    get:
      tags: [Experiments]
      summary: Listar experimentos do nicho
      parameters:
        - $ref: '#/components/parameters/NicheIdParam'
      responses:
        '200':
          description: Lista de experimentos do nicho
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experiment'
  /api/experiments:
    post:
      tags: [Experiments]
      summary: Criar experimento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Experimento criado
  /api/experiments/{id}/duplicate:
    post:
      tags: [Experiments]
      summary: Duplicar experimento
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Experimento duplicado
  /api/experiments/{experimentId}/funnel/analytics:
    get:
      tags: [Experiments]
      summary: Consultar analytics de sessões da landing do experimento
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sessões e eventos de analytics da landing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentLandingAnalytics'
  /api/experiments/{id}/creatives:
    post:
      tags: [Creatives]
      summary: Criar criativo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreativeRequest'
      responses:
        '201':
          description: Criativo criado
    get:
      tags: [Creatives]
      summary: Listar criativos do experimento
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de criativos
  /api/creatives/{id}/preview:
    get:
      tags: [Creatives]
      summary: Preview do criativo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Preview retornado
  /api/experiments/{experimentId}/landing:
    post:
      tags: [Landing Pages]
      summary: Criar landing page
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLandingPageRequest'
      responses:
        '201':
          description: Landing criada
    get:
      tags: [Landing Pages]
      summary: Listar landing pages do experimento
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de landings
  /api/angles:
    get:
      tags: [Creatives]
      summary: Listar angles
      responses:
        '200':
          description: Lista de angles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AngleDto'
    post:
      tags: [Creatives]
      summary: Criar angle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAngleRequest'
      responses:
        '201':
          description: Angle criado
        '400':
          description: Dados inválidos
  /api/angles/{id}:
    put:
      tags: [Creatives]
      summary: Atualizar angle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AngleDto'
      responses:
        '200':
          description: Angle atualizado
  /api/visual-proofs:
    get:
      tags: [Creatives]
      summary: Listar visual proofs
      responses:
        '200':
          description: Lista de visual proofs
    post:
      tags: [Creatives]
      summary: Criar visual proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisualProofRequest'
      responses:
        '201':
          description: Visual proof criado
  /api/emotional-triggers:
    get:
      tags: [Creatives]
      summary: Listar emotional triggers
      responses:
        '200':
          description: Lista de gatilhos emocionais
    post:
      tags: [Creatives]
      summary: Criar emotional trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmotionalTriggerRequest'
      responses:
        '201':
          description: Trigger criado
  /api/creatives/{id}/labels:
    patch:
      tags: [Creatives]
      summary: Atualizar labels do criativo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreativeLabelsRequest'
      responses:
        '200':
          description: Labels atualizadas
  /api/niches/{nicheId}/hypotheses:
    get:
      tags: [Hypotheses]
      summary: Listar hipóteses do nicho
      parameters:
        - $ref: '#/components/parameters/NicheIdParam'
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de hipóteses
  /api/hypotheses:
    post:
      tags: [Hypotheses]
      summary: Criar hipótese
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHypothesisRequest'
      responses:
        '201':
          description: Hipótese criada
    get:
      tags: [Hypotheses]
      summary: Listar hipóteses
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Lista de hipóteses
  /api/hypotheses/{id}:
    put:
      tags: [Hypotheses]
      summary: Atualizar hipótese
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHypothesisRequest'
      responses:
        '200':
          description: Hipótese atualizada
  /api/hypotheses/{id}/status:
    patch:
      tags: [Hypotheses]
      summary: Atualizar status da hipótese
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status atualizado
  /api/experiments/{experimentId}/hypotheses/board:
    get:
      tags: [Hypotheses]
      summary: Visualizar hipóteses em formato Kanban
      parameters:
        - in: path
          name: experimentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Quadro retornado
  /api/instagram-creatives/approved:
    get:
      tags: [Creatives]
      summary: Listar criativos do Instagram aprovados
      responses:
        '200':
          description: Lista de criativos aprovados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstagramCreative'
  /api/facebook-campaigns/experiments-ready:
    get:
      tags: [Experiments]
      summary: Listar experimentos prontos para campanhas no Facebook
      responses:
        '200':
          description: Lista de experimentos prontos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experiment'

  /api/journey-templates:
    get:
      tags: [Journeys]
      summary: Listar templates de jornada
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Lista paginada de templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/JourneyTemplateSummary'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
    post:
      tags: [Journeys]
      summary: Criar template de jornada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyTemplateRequest'
      responses:
        '201':
          description: Template criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyTemplate'
        '400':
          description: Erro de validação ao criar o template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journey-templates/{id}:
    get:
      tags: [Journeys]
      summary: Consultar template de jornada
      parameters:
        - $ref: '#/components/parameters/JourneyTemplateIdParam'
      responses:
        '200':
          description: Template encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyTemplate'
        '404':
          description: Template não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    patch:
      tags: [Journeys]
      summary: Atualizar template de jornada
      parameters:
        - $ref: '#/components/parameters/JourneyTemplateIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyTemplateUpdateRequest'
      responses:
        '200':
          description: Template atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyTemplate'
        '400':
          description: Erro de validação ao atualizar o template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Template não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    delete:
      tags: [Journeys]
      summary: Remover template de jornada
      parameters:
        - $ref: '#/components/parameters/JourneyTemplateIdParam'
      responses:
        '204':
          description: Template removido
        '404':
          description: Template não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journey-templates/{id}/steps:
    get:
      tags: [Journeys]
      summary: Listar passos de um template
      parameters:
        - $ref: '#/components/parameters/JourneyTemplateIdParam'
      responses:
        '200':
          description: Passos ordenados do template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JourneyStep'
        '404':
          description: Template não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    post:
      tags: [Journeys]
      summary: Adicionar passo ao template
      parameters:
        - $ref: '#/components/parameters/JourneyTemplateIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyStepRequest'
      responses:
        '201':
          description: Passo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStep'
        '400':
          description: Erro de validação ao criar o passo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Template não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journey-steps/{id}:
    get:
      tags: [Journeys]
      summary: Consultar passo específico
      parameters:
        - $ref: '#/components/parameters/JourneyStepIdParam'
      responses:
        '200':
          description: Passo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStep'
        '404':
          description: Passo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    patch:
      tags: [Journeys]
      summary: Atualizar passo de jornada
      parameters:
        - $ref: '#/components/parameters/JourneyStepIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyStepUpdateRequest'
      responses:
        '200':
          description: Passo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStep'
        '400':
          description: Erro de validação ao atualizar o passo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Passo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    delete:
      tags: [Journeys]
      summary: Remover passo de jornada
      parameters:
        - $ref: '#/components/parameters/JourneyStepIdParam'
      responses:
        '204':
          description: Passo removido
        '404':
          description: Passo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journeys:
    get:
      tags: [Journeys]
      summary: Listar jornadas
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - in: query
          name: templateId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/JourneyStatus'
      responses:
        '200':
          description: Lista paginada de jornadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Journey'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
    post:
      tags: [Journeys]
      summary: Criar jornada operacional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyRequest'
      responses:
        '201':
          description: Jornada criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          description: Erro de validação ao criar a jornada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Recursos relacionados não encontrados (template, nicho ou experimento)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journeys/metrics:
    get:
      tags: [Journeys]
      summary: Obter métricas agregadas das jornadas
      responses:
        '200':
          description: Métricas consolidadas das jornadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyMetrics'
  /api/journeys/{id}:
    get:
      tags: [Journeys]
      summary: Consultar jornada
      parameters:
        - $ref: '#/components/parameters/JourneyIdParam'
      responses:
        '200':
          description: Jornada encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '404':
          description: Jornada não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    patch:
      tags: [Journeys]
      summary: Atualizar jornada
      parameters:
        - $ref: '#/components/parameters/JourneyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyUpdateRequest'
      responses:
        '200':
          description: Jornada atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          description: Erro de validação ao atualizar a jornada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Jornada não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    delete:
      tags: [Journeys]
      summary: Remover jornada
      parameters:
        - $ref: '#/components/parameters/JourneyIdParam'
      responses:
        '204':
          description: Jornada removida
        '404':
          description: Jornada não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journeys/{id}/assignments:
    get:
      tags: [Journey Assignments]
      summary: Listar vínculos da jornada
      parameters:
        - $ref: '#/components/parameters/JourneyIdParam'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/JourneyAssignmentStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Lista paginada de vínculos
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/JourneyAssignment'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
        '404':
          description: Jornada não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    post:
      tags: [Journey Assignments]
      summary: Vincular leads ou segmentos à jornada
      parameters:
        - $ref: '#/components/parameters/JourneyIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyAssignmentRequest'
      responses:
        '201':
          description: Vínculos criados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JourneyAssignment'
        '400':
          description: Erro de validação ao atribuir leads ou segmentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Jornada ou passo relacionado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/journey-assignments/{assignmentId}:
    delete:
      tags: [Journey Assignments]
      summary: Remover vínculo de jornada
      parameters:
        - $ref: '#/components/parameters/JourneyAssignmentIdParam'
      responses:
        '204':
          description: Vínculo removido
        '404':
          description: Vínculo não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/events:
    post:
      tags: [Journey Events]
      summary: Registrar evento multicanal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventLogRequest'
      responses:
        '201':
          description: Evento armazenado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLog'
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Jornada ou passo de jornada não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'

components:
  parameters:
    NicheIdParam:
      in: path
      name: nicheId
      required: true
      schema:
        type: integer
    JourneyTemplateIdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
    JourneyStepIdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
    JourneyIdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
    JourneyAssignmentIdParam:
      in: path
      name: assignmentId
      required: true
      schema:
        type: integer
    PageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      in: query
      name: size
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20

  schemas:
    ProblemResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    AiWorkerGeneration:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domain:
          type: string
        referenceId:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        prompt:
          type: string
          nullable: true
        rawResponse:
          type: string
          nullable: true
        inputTokens:
          type: integer
          nullable: true
        outputTokens:
          type: integer
          nullable: true
        costUsd:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
    CreateExperimentRequest:
      type: object
      required:
        - journeyTemplateId
      properties:
        marketNicheId:
          type: integer
        hypothesisId:
          type: string
        name:
          type: string
        hypothesis:
          type: string
        kpiTarget:
          type: number
        metricPresetId:
          type: string
        sampleSize:
          type: integer
        mde:
          type: number
        startDate:
          type: string
          format: date
