openapi: 3.0.3
info:
  title: OPRM ↔ Backend Integration API
  version: 1.0.0
  description: |
    Contrato oficial da Sprint 1 para integração backend principal do Marketing Hub e worker OPRM.
servers:
  - url: https://backend.marketinghub.local
    description: Backend principal
  - url: http://localhost:8080
    description: Ambiente local
paths:
  /api/oprm/jobs/claim:
    post:
      tags: [jobs]
      summary: Claim de job disponível para processamento do OPRM
      operationId: claimOprmJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OprmJobClaimRequest'
      responses:
        '200':
          description: Job disponível e reservado para o worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmJobClaimResponse'
        '204':
          description: Nenhum job disponível no momento.
        '409':
          description: Conflito de lock/claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
        '422':
          description: Contrato inválido (versão incompatível ou payload inconsistente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
  /api/oprm/jobs/{jobId}:
    get:
      tags: [jobs]
      summary: Consulta os detalhes do job
      operationId: getOprmJobDetails
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes completos do job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmJobDetailResponse'
        '404':
          description: Job não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
  /api/oprm/jobs/{jobId}/status:
    post:
      tags: [jobs]
      summary: Atualiza o status de processamento do job
      operationId: updateOprmJobStatus
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OprmJobStatusUpdateRequest'
      responses:
        '202':
          description: Status aceito para processamento assíncrono.
        '404':
          description: Job não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
        '409':
          description: Transição de estado inválida para o job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
  /api/oprm/artifacts:
    post:
      tags: [artifacts]
      summary: Publica artefato gerado pelo OPRM
      operationId: publishOprmArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OprmArtifactPublishRequest'
      responses:
        '202':
          description: Artefato aceito para persistência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmArtifactPublishResponse'
        '409':
          description: Duplicidade de idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
        '422':
          description: Envelope inválido ou lineage insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
  /api/oprm/feedback:
    post:
      tags: [feedback]
      summary: Publica snapshot de feedback loop
      operationId: publishOprmFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OprmFeedbackPublishRequest'
      responses:
        '202':
          description: Feedback aceito para persistência.
        '422':
          description: Snapshot inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
  /api/oprm/heartbeat:
    post:
      tags: [operations]
      summary: Heartbeat operacional do worker OPRM
      operationId: publishOprmHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OprmHeartbeatRequest'
      responses:
        '202':
          description: Heartbeat recebido.
        '422':
          description: Heartbeat inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OprmApiErrorResponse'
components:
  schemas:
    OprmJobClaimRequest:
      type: object
      required: [workerId, workerVersion, contractVersion, maxJobs, leaseSeconds]
      properties:
        workerId:
          type: string
        workerVersion:
          type: string
        contractVersion:
          type: string
          example: '1.0'
        maxJobs:
          type: integer
          minimum: 1
          maximum: 20
        leaseSeconds:
          type: integer
          minimum: 30
    OprmJobClaimResponse:
      type: object
      required: [jobId, jobType, occupationSeedRef, correlationId, parameters, claimedAt, leaseExpiresAt]
      properties:
        jobId:
          type: string
        jobType:
          $ref: '#/components/schemas/OprmJobType'
        occupationSeedRef:
          type: string
        correlationId:
          type: string
        parameters:
          type: object
          additionalProperties: true
        claimedAt:
          type: string
          format: date-time
        leaseExpiresAt:
          type: string
          format: date-time
    OprmJobDetailResponse:
      type: object
      required: [jobId, jobType, jobStatus, occupationSeedRef, correlationId, attemptCount, createdAt, parameters, inputRefs]
      properties:
        jobId:
          type: string
        jobType:
          $ref: '#/components/schemas/OprmJobType'
        jobStatus:
          $ref: '#/components/schemas/OprmJobStatus'
        occupationSeedRef:
          type: string
        correlationId:
          type: string
        attemptCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        claimedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        parameters:
          type: object
          additionalProperties: true
        inputRefs:
          type: array
          items:
            type: string
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    OprmArtifactPublishRequest:
      type: object
      required: [jobId, correlationId, artifact, lineage, idempotencyKey]
      properties:
        jobId:
          type: string
        correlationId:
          type: string
        artifact:
          $ref: '#/components/schemas/OprmArtifactEnvelopeDto'
        lineage:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
    OprmArtifactPublishResponse:
      type: object
      required: [artifactId, artifactType, artifactVersion, persistedAt, status, duplicated]
      properties:
        artifactId:
          type: string
        artifactType:
          type: string
        artifactVersion:
          type: string
        persistedAt:
          type: string
          format: date-time
        status:
          type: string
        duplicated:
          type: boolean
    OprmArtifactEnvelopeDto:
      type: object
      required:
        - artifactType
        - artifactVersion
        - artifactId
        - moduleName
        - producer
        - createdAt
        - correlationId
        - traceId
        - sourceRefs
        - inputRefs
        - payload
        - status
        - metadata
      properties:
        artifactType:
          type: string
        artifactVersion:
          type: string
        artifactId:
          type: string
        moduleName:
          type: string
          example: oprm
        producer:
          type: string
        createdAt:
          type: string
          format: date-time
        correlationId:
          type: string
        traceId:
          type: string
        sourceRefs:
          type: array
          items:
            type: string
        inputRefs:
          type: array
          items:
            type: string
        payload:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/OprmArtifactStatus'
        confidenceScore:
          type: number
          format: double
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    OprmJobStatusUpdateRequest:
      type: object
      required: [workerId, status, occurredAt]
      properties:
        workerId:
          type: string
        status:
          $ref: '#/components/schemas/OprmJobStatus'
        occurredAt:
          type: string
          format: date-time
        phase:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        metrics:
          type: object
          additionalProperties: true
          nullable: true
    OprmFeedbackPublishRequest:
      type: object
      required:
        - jobId
        - correlationId
        - occupationName
        - personaLabel
        - baselineRoutineArtifactId
        - baselineFrameworkArtifactId
        - recalibratedPainSignals
        - recalibratedMechanismSignals
        - hypothesisComparison
        - scoreReweighting
        - generatedAt
      properties:
        jobId:
          type: string
        correlationId:
          type: string
        occupationName:
          type: string
        personaLabel:
          type: string
        baselineRoutineArtifactId:
          type: string
        baselineFrameworkArtifactId:
          type: string
        recalibratedPainSignals:
          type: object
          additionalProperties: true
        recalibratedMechanismSignals:
          type: object
          additionalProperties: true
        hypothesisComparison:
          type: object
          additionalProperties: true
        scoreReweighting:
          type: object
          additionalProperties: true
        generatedAt:
          type: string
          format: date-time
    OprmHeartbeatRequest:
      type: object
      required: [workerId, workerVersion, contractVersion, sentAt, health, counters]
      properties:
        workerId:
          type: string
        workerVersion:
          type: string
        contractVersion:
          type: string
          example: '1.0'
        sentAt:
          type: string
          format: date-time
        health:
          type: object
          additionalProperties: true
        counters:
          type: object
          additionalProperties: true
    OprmApiErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
    OprmJobType:
      type: string
      enum:
        - OCCUPATION_MAPPING
        - FEEDBACK_RECALIBRATION
    OprmJobStatus:
      type: string
      enum:
        - PENDING
        - CLAIMED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - RETRY_WAIT
        - CANCELLED
    OprmArtifactStatus:
      type: string
      enum:
        - DRAFT
        - GENERATED
        - VALIDATED
        - REJECTED
        - PUBLISHED
        - SUPERSEDED
