          type: string
          nullable: true
        researchMode:
          type: string
        solutionLanguageRiskScore:
          type: number
          nullable: true
        sourceScore:
          type: number
          nullable: true
        status:
          type: string
        totalQueries:
          type: integer
          nullable: true
        totalSourceCandidates:
          type: integer
          nullable: true
        totalSourceSnapshots:
          type: integer
          nullable: true
        totalExtractedSignals:
          type: integer
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
