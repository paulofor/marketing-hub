        alreadyMaterialized:
          type: boolean
          description: Indica se o ciclo já possui market_niche associado e não deve ser tratado como criação de novo nicho.
        cnaeCode:
          type: string
          example: '9602501'
        cnaeDescription:
          type: string
          example: Cabeleireiros, manicure e pedicure
        nicheName:
          type: string
          example: Cabeleireiros, manicures e pedicures
        sourceScore:
          type: number
          format: double
          example: 90.0
        audienceName:
          type: string
          nullable: true
          example: Manicures MEI que atendem por agenda própria
        autonomousProfessionalFitScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        sourceFreshnessScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        outdatedSourceRiskScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        structuredBusinessDriftRiskScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        gateStatus:
          type: string
          nullable: true
          example: MEI_AUDIENCE_READY
        triggerSource:
          type: string
          description: Origem do ciclo; `AUTO_SCORE_QUEUE` para fila automática e `MANUAL_REPROCESS` para ciclos criados pelo botão Reprocessar CNAE.
          enum:
            - AUTO_SCORE_QUEUE
            - MANUAL_REPROCESS
          example: AUTO_SCORE_QUEUE
        cycleStatus:
          type: string
          description: Status do ciclo; STALLED, NEEDS_MORE_RESEARCH, GENERIC e ENRICHED_NICHE_FAILED podem abrir novo ciclo manual pelo endpoint de reprocessamento.
          example: RUNNING
        processedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
          example: '500 Internal Server Error: nicheName is required'
