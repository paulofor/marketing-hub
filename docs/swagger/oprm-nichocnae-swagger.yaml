openapi: 3.0.3
info:
  title: OPRM Nicho CNAE Pipeline API
  version: 0.5.0
  description: Endpoints internos do backend para o pipeline OPRM de pesquisa de rotina por nicho CNAE.
paths:
  /api/oprm/cnaes/{cnaeCode}/opportunity-score:
    get:
      summary: Retorna o score OPRM calculado para o CNAE exibido na tela de detalhe.
      tags: [OPRM CNAE]
      parameters:
        - $ref: '#/components/parameters/CnaeCode'
      responses:
        '200':
          description: Score de oportunidade do CNAE.
        '404':
          description: Score ainda não calculado para o CNAE.
  /api/oprm/market/import-runs/cnaes/{cnaeCode}/latest-volume:
    get:
      summary: Retorna volume de mercado e score agregado do CNAE no snapshot mais recente.
      tags: [OPRM CNAE]
      parameters:
        - $ref: '#/components/parameters/CnaeCode'
      responses:
        '200':
          description: Volume de estabelecimentos, empresas, MEIs e score do CNAE.
        '404':
          description: CNAE não encontrado no snapshot mais recente.
  /api/internal/oprm/nichocnae/routine-research-orchestrator/stage-executions/pending:
    get:
      summary: Lista o próximo nicho CNAE pendente para a etapa zero.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Próximo nicho pendente, quando existir.
  /api/oprm/nichocnae/routine-research-orchestrator/recent-processed:
    get:
      summary: Lista os últimos nichos processados pela etapa zero para exibição no card operacional.
      tags: [OPRM Nicho CNAE]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Últimos nichos com ciclo de pesquisa criado pelo orquestrador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineResearchOrchestratorRecent'
  /api/oprm/nichocnae/routine-research-orchestrator/recent-processed/{researchCycleId}/reprocess:
    post:
      summary: Cria imediatamente novo ciclo para reprocessar CNAE falho, fraco, genérico ou com falha na materialização final.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Novo ciclo criado e nicho marcado como em pesquisa para sair de FAILED, STALLED, NEEDS_MORE_RESEARCH, GENERIC ou ENRICHED_NICHE_FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineResearchOrchestratorReprocessResult'
        '404':
          description: Ciclo ou nicho CNAE de origem não encontrado.
        '409':
          description: Ciclo não está em status FAILED, STALLED, NEEDS_MORE_RESEARCH, GENERIC ou ENRICHED_NICHE_FAILED e não pode ser reprocessado.
  /api/oprm/nichocnae/cnaes/{cnaeCode}/routine-research-orchestrator/run:
    post:
      summary: Encerra ciclos abertos e executa a etapa zero para iniciar um novo pipeline NichoCNAE do CNAE escolhido manualmente na tela de detalhe.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/CnaeCode'
      responses:
        '202':
          description: Ciclos abertos anteriores encerrados, ciclo novo criado e nicho marcado como em pesquisa para o CNAE informado.
        '404':
          description: Não existe candidato de nicho com score para iniciar um novo pipeline desse CNAE.
  /api/internal/oprm/nichocnae/routine-research-orchestrator/run-next:
    post:
      summary: Executa a etapa zero e abre o próximo ciclo de pesquisa de rotina.
      tags: [OPRM Nicho CNAE]
      responses:
        '202':
          description: Ciclo criado e nicho marcado como em pesquisa.
        '200':
          description: Nenhum nicho pendente encontrado.
  /api/internal/oprm/nichocnae/routine-research-cycle/stage-executions/pending:
    get:
      summary: Lista ciclos de pesquisa de rotina em execução para continuidade do pipeline.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Ciclos em execução.
  /api/oprm/nichocnae/cnaes/{cnaeCode}/routine-research-cycle/stage-executions:
    get:
      summary: Lista ciclos de pesquisa de rotina por código CNAE para acompanhamento da tela de detalhe.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/CnaeCode'
      responses:
        '200':
          description: Lista de ciclos vinculados ao CNAE.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineResearchCycleExecutionSummary'
  /api/oprm/nichocnae/{sourceNicheId}/routine-research-cycle/stage-executions:
    get:
      summary: Lista ciclos de pesquisa de rotina por nicho CNAE de origem.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/SourceNicheId'
      responses:
        '200':
          description: Lista de ciclos vinculados ao nicho.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineResearchCycleExecutionSummary'
  /api/oprm/nichocnae/routine-research-cycle/stage-executions/{researchCycleId}:
    get:
      summary: Detalha um ciclo de pesquisa de rotina.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Detalhe do ciclo.

  /api/internal/oprm/nichocnae/niche-research-seed-builder/stage-executions/pending:
    get:
      summary: Lista ciclos pendentes para geração do seed e queries da etapa dois.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Ciclos em execução sem seed de pesquisa gerado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NicheResearchSeedBuilderPending'
  /api/internal/oprm/nichocnae/niche-research-seed-builder/stage-executions/{researchCycleId}/complete:
    post:
      summary: Persiste a saída validada da etapa dois com seed e queries.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteNicheResearchSeedBuilderRequest'
      responses:
        '200':
          description: Seed e queries gravados para o ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteNicheResearchSeedBuilderResponse'
        '400':
          description: Payload inválido, query duplicada, objetivo não suportado ou mais de 15 queries.
        '404':
          description: Ciclo de pesquisa não encontrado.
  /api/internal/oprm/nichocnae/niche-research-seed-builder/stage-executions/{researchCycleId}/fail:
    post:
      summary: Registra falha operacional da etapa dois.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailNicheResearchSeedBuilderRequest'
      responses:
        '204':
          description: Falha registrada.
        '404':
          description: Ciclo de pesquisa não encontrado.
  /api/oprm/nichocnae/niche-research-seed-builder/stage-executions/{researchCycleId}:
    get:
      summary: Detalha o seed e as queries gerados na etapa dois.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Seed e queries do ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NicheResearchSeedBuilderDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/internal/oprm/nichocnae/source-searcher/stage-executions/pending:
    get:
      summary: Lista frases de pesquisa pendentes para a etapa três de busca de fontes.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Frases pendentes para execução em provedor de busca configurável.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceSearcherPending'
  /api/internal/oprm/nichocnae/source-searcher/stage-executions/{researchQueryId}/complete:
    post:
      summary: Persiste os resultados da busca pública para uma frase de pesquisa da etapa três.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchQueryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSourceSearcherRequest'
      responses:
        '200':
          description: Fontes candidatas gravadas e query marcada como concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSourceSearcherResponse'
        '400':
          description: Payload inválido, posição inválida, URL duplicada ou mais de 20 resultados.
        '404':
          description: Frase de pesquisa não encontrada.
  /api/internal/oprm/nichocnae/source-searcher/stage-executions/{researchQueryId}/fail:
    post:
      summary: Registra falha operacional da etapa três para uma frase de pesquisa.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchQueryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailSourceSearcherRequest'
      responses:
        '204':
          description: Falha registrada na frase de pesquisa.
        '404':
          description: Frase de pesquisa não encontrada.
  /api/oprm/nichocnae/source-searcher/stage-executions/{researchCycleId}:
    get:
      summary: Detalha as fontes candidatas encontradas para um ciclo de pesquisa.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Fontes candidatas do ciclo de pesquisa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSearcherDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/internal/oprm/nichocnae/source-fetcher/stage-executions/pending:
    get:
      summary: Lista fontes candidatas pendentes para a etapa quatro de coleta curta.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Fontes candidatas encontradas e ainda não selecionadas para fetch.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceFetcherPending'
  /api/internal/oprm/nichocnae/source-fetcher/stage-executions/{sourceCandidateId}/complete:
    post:
      summary: Persiste metadados e trecho curto coletados para uma fonte candidata da etapa quatro.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/SourceCandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSourceFetcherRequest'
      responses:
        '200':
          description: Snapshot curto gravado e fonte candidata marcada como coletada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSourceFetcherResponse'
        '400':
          description: Payload inválido, trecho curto muito longo ou fonte já coletada.
        '404':
          description: Fonte candidata não encontrada.
  /api/internal/oprm/nichocnae/source-fetcher/stage-executions/{sourceCandidateId}/fail:
    post:
      summary: Registra rejeição ou falha operacional da etapa quatro para uma fonte candidata.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/SourceCandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailSourceFetcherRequest'
      responses:
        '204':
          description: Rejeição ou falha registrada na fonte candidata.
        '404':
          description: Fonte candidata não encontrada.
  /api/oprm/nichocnae/source-fetcher/stage-executions/{researchCycleId}:
    get:
      summary: Detalha os snapshots curtos coletados para um ciclo de pesquisa.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Snapshots curtos do ciclo de pesquisa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFetcherDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/internal/oprm/nichocnae/signal-extractor/stage-executions/pending:
    get:
      summary: Lista snapshots curtos pendentes para a etapa cinco de extração de sinais.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Snapshots curtos completos e ainda pendentes de extração.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignalExtractorPending'
  /api/internal/oprm/nichocnae/signal-extractor/stage-executions/{sourceSnapshotId}/complete:
    post:
      summary: Persiste sinais estruturados extraídos de um snapshot curto da etapa cinco.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/SourceSnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSignalExtractorRequest'
      responses:
        '200':
          description: Sinais gravados e snapshot marcado como concluído na etapa cinco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSignalExtractorResponse'
        '400':
          description: Payload inválido, sinais vazios ou evidência/texto acima do limite.
        '404':
          description: Snapshot curto não encontrado.
  /api/internal/oprm/nichocnae/signal-extractor/stage-executions/{sourceSnapshotId}/fail:
    post:
      summary: Registra falha operacional da etapa cinco para um snapshot curto.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/SourceSnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailSignalExtractorRequest'
      responses:
        '204':
          description: Falha registrada no snapshot curto.
        '404':
          description: Snapshot curto não encontrado.
  /api/oprm/nichocnae/signal-extractor/stage-executions/{researchCycleId}:
    get:
      summary: Detalha os sinais extraídos para um ciclo de pesquisa.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Sinais estruturados do ciclo de pesquisa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalExtractorDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/internal/oprm/nichocnae/routine-synthesizer/stage-executions/pending:
    get:
      summary: Lista ciclos com sinais extraídos pendentes para a etapa seis de síntese da rotina.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Ciclos pendentes com sinais selecionados para síntese.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineSynthesizerPending'
  /api/internal/oprm/nichocnae/routine-synthesizer/stage-executions/{researchCycleId}/complete:
    post:
      summary: Persiste o cartão de rotina sintetizado da etapa seis.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRoutineSynthesizerRequest'
      responses:
        '200':
          description: Cartão de rotina persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteRoutineSynthesizerResponse'
        '400':
          description: Payload inválido ou resumo vazio.
  /api/internal/oprm/nichocnae/routine-synthesizer/stage-executions/{researchCycleId}/fail:
    post:
      summary: Registra falha operacional da etapa seis.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailRoutineSynthesizerRequest'
      responses:
        '204':
          description: Falha registrada.
  /api/oprm/nichocnae/routine-synthesizer/stage-executions/{researchCycleId}:
    get:
      summary: Detalha o cartão de rotina sintetizado para um ciclo de pesquisa.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Detalhe público da síntese de rotina.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineSynthesizerDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/internal/oprm/nichocnae/mei-audience-segmenter/stage-executions/pending:
    get:
      summary: Lista cartões de rotina pendentes para segmentação comportamental MEI/autônomo por IA.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Cartões pendentes com fontes, indicadores e sinais para segmentação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeiAudienceSegmenterPending'
  /api/internal/oprm/nichocnae/mei-audience-segmenter/stage-executions/{researchCycleId}/complete:
    post:
      summary: Persiste o perfil comportamental MEI/autônomo segmentado por IA.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMeiAudienceSegmenterRequest'
      responses:
        '200':
          description: Perfil MEI/autônomo persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteMeiAudienceSegmenterResponse'
        '400':
          description: Payload inválido ou contaminado por linguagem de solução.
  /api/internal/oprm/nichocnae/mei-audience-segmenter/stage-executions/{researchCycleId}/fail:
    post:
      summary: Registra falha operacional da segmentação MEI/autônomo.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailMeiAudienceSegmenterRequest'
      responses:
        '204':
          description: Falha registrada.

  /api/oprm/nichocnae/mei-audience-profiles/research-cycles/{researchCycleId}:
    get:
      summary: Detalha o perfil final aprovado de público-alvo MEI/autônomo sem criar produto ou oferta.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Perfil MEI/autônomo aprovado pelo gate e seguro para consumo posterior por MDS, MOIS e estratégia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeiAudienceProfileDetailResponse'
        '404':
          description: Perfil MEI/autônomo não encontrado para o ciclo informado.
        '409':
          description: Perfil ainda não aprovado ou bloqueado por contaminação de solução.

  /api/internal/oprm/nichocnae/routine-quality-gate/stage-executions/pending:
    get:
      summary: Lista cartões de rotina pendentes para a etapa sete de gate de qualidade.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Cartões pendentes com contadores de fontes e sinais.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineQualityGatePending'
  /api/internal/oprm/nichocnae/routine-quality-gate/stage-executions/{researchCycleId}/complete:
    post:
      summary: Persiste a decisão de qualidade da etapa sete.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRoutineQualityGateRequest'
      responses:
        '200':
          description: Decisão de qualidade persistida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteRoutineQualityGateResponse'
        '400':
          description: Payload inválido ou decisão fora do contrato.
  /api/internal/oprm/nichocnae/routine-quality-gate/stage-executions/{researchCycleId}/fail:
    post:
      summary: Registra falha operacional da etapa sete.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailRoutineQualityGateRequest'
      responses:
        '204':
          description: Falha registrada.
  /api/oprm/nichocnae/routine-quality-gate/stage-executions/{researchCycleId}:
    get:
      summary: Detalha a decisão de qualidade do cartão de rotina.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Detalhe público do gate de qualidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineQualityGateDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/internal/oprm/nichocnae/enriched-niche-materializer/stage-executions/pending:
    get:
      summary: Lista cartões aprovados para materializar nicho e nicho enriquecido.
      tags: [OPRM Nicho CNAE]
      responses:
        '200':
          description: Cartões aprovados com payload fechado para a etapa final.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedNicheMaterializerPending'
  /api/internal/oprm/nichocnae/enriched-niche-materializer/stage-executions/{researchCycleId}/complete:
    post:
      summary: Alimenta market_niche e market_niche_enrichment_profile.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteEnrichedNicheMaterializerRequest'
      responses:
        '200':
          description: Nicho e nicho enriquecido materializados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteEnrichedNicheMaterializerResponse'
        '400':
          description: Payload inválido ou card ainda não aprovado.
  /api/internal/oprm/nichocnae/enriched-niche-materializer/stage-executions/{researchCycleId}/fail:
    post:
      summary: Registra falha operacional da etapa final.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailEnrichedNicheMaterializerRequest'
      responses:
        '204':
          description: Falha registrada.
  /api/oprm/nichocnae/enriched-niche-materializer/stage-executions/{researchCycleId}:
    get:
      summary: Detalha o nicho enriquecido materializado para o ciclo.
      tags: [OPRM Nicho CNAE]
      parameters:
        - $ref: '#/components/parameters/ResearchCycleId'
      responses:
        '200':
          description: Detalhe público da etapa final de materialização.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedNicheMaterializerDetailResponse'
        '404':
          description: Ciclo de pesquisa não encontrado.

  /api/oprm/nichocnae/enriched-niche-materializer/profiles/{profileId}:
    get:
      summary: Detalha o nicho enriquecido materializado pelo perfil.
      tags: [OPRM Nicho CNAE]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalhe público do perfil de nicho enriquecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedNicheMaterializerDetailResponse'
        '404':
          description: Perfil de nicho enriquecido ou ciclo de pesquisa não encontrado.


  /api/oprm/nichocnae/enriched-niche-materializer/profiles/{profileId}/pipeline-markdown:
    get:
      summary: Baixa documento Markdown com auditoria completa do pipeline e conclusão final do nicho enriquecido.
      tags: [OPRM Nicho CNAE]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Documento Markdown baixável com todo o pipeline processado.
          headers:
            Content-Disposition:
              description: Nome do arquivo Markdown para download.
              schema:
                type: string
          content:
            text/markdown:
              schema:
                type: string
        '404':
          description: Perfil de nicho enriquecido ou ciclo de pesquisa não encontrado.

components:
