openapi: 3.0.3
info:
  title: OPRM NichoCNAE v2 Candidate Generator API
  version: "1.0"
paths:
  /api/internal/oprm/nichocnae/v2/candidate-generator/stage-executions/cnaes/{cnaeCode}:
    post:
      summary: Grava um novo job pendente da v2 para o CNAE selecionado, sem executar o fluxo no backend.
      parameters:
        - name: cnaeCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job pendente gravado para consumo do executor externo OPRM.
        "404":
          description: Não existe candidato com score para o CNAE informado.
        "409":
          description: Pipeline v2 desabilitado por feature flag.
  /api/internal/oprm/nichocnae/v2/candidate-generator/stage-executions/cnaes/{cnaeCode}/jobs:
    get:
      summary: Lista jobs v2 do CNAE separados entre abertos e encerrados
      description: Contrato de leitura para a tela administrativa exibir jobs abertos com etapa atual e histórico de jobs concluídos/encerrados.
      parameters:
        - name: cnaeCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Listas de jobs abertas e encerradas para o CNAE informado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cnaeCode
                  - cnaeAiCostUsd
                  - cnaeUsedAi
                  - openJobs
                  - completedJobs
                properties:
                  cnaeCode:
                    type: string
                  cnaeAiCostUsd:
                    type: number
                    description: Soma dos custos de IA em USD registrados nos outputPayloads dos jobs listados para o CNAE.
                  cnaeUsedAi:
                    type: boolean
                    description: Indica se algum job listado do CNAE registrou custo ou sinal explícito de uso de IA.
                  openJobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CandidateGeneratorCnaeJobSummary"
                  completedJobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/CandidateGeneratorCnaeJobSummary"
  /api/internal/oprm/nichocnae/v2/candidate-generator/stage-executions/jobs/{jobId}:
    get:
      summary: Detalha as etapas persistidas de um job v2
      description: Contrato de leitura para a tela administrativa mostrar cada etapa executada até o ponto de fracasso ou sucesso.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Histórico cronológico das etapas do job informado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateGeneratorJobDetailResponse"
        "404":
          description: Job não encontrado.
  /api/internal/oprm/nichocnae/v2/candidate-generator/stage-executions/pending:
    get:
      summary: Lista execuções pendentes da etapa candidate-generator v2
      responses:
        "200":
          description: Pendências disponíveis para o executor OPRM com envelope comum completo (stageExecutionId, jobId, researchCycleId, sourceNicheId, cnaeCode, cnaeDescription, attemptNumber, technicalRetryNumber, knowledgeVersion e materializationEnabled).
  /api/internal/oprm/nichocnae/v2/candidate-generator/stage-executions/{stageExecutionId}/complete:
    post:
      summary: Registra conclusão de execução da etapa candidate-generator v2
      parameters:
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Conclusão registrada; callbacks de etapas que usam OpenAI podem enviar openAiInteractions com modelo, service tier, tokens, custo, request e response brutos para auditoria.
  /api/internal/oprm/nichocnae/v2/candidate-generator/stage-executions/{stageExecutionId}/fail:
    post:
      summary: Registra falha e retry técnico da etapa candidate-generator v2
      parameters:
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Falha registrada
components:
  schemas:
    CandidateGeneratorCnaeJobSummary:
      type: object
      required:
        - jobId
        - cnaeCode
        - status
        - lastStageStatus
        - materializationEnabled
        - usedAi
        - aiCostUsd
      properties:
        jobId:
          type: string
        cnaeCode:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - COMPLETED
        currentStageCode:
          type: string
          nullable: true
        lastStageCode:
          type: string
          nullable: true
        lastStageStatus:
          type: string
        attemptNumber:
          type: integer
          nullable: true
        technicalRetryNumber:
          type: integer
          nullable: true
        knowledgeVersion:
          type: integer
          nullable: true
        materializationEnabled:
          type: boolean
        finalDecision:
          type: string
          nullable: true
          description: Decisão funcional persistida na última etapa, como NO_VIABLE_SUBNICHE.
        finalDecisionLabel:
          type: string
          nullable: true
          description: Rótulo de negócio para explicar a conclusão ou bloqueio ao usuário.
        finalDecisionReason:
          type: string
          nullable: true
          description: Motivo curto da decisão final, preservando contagens relevantes.
        outcomeStatus:
          type: string
          nullable: true
          enum:
            - SUCCESS
            - FAILURE
            - IN_PROGRESS
          description: Classificação simples para a UI exibir sucesso, fracasso ou andamento sem inferência local.
        outcomeMessage:
          type: string
          nullable: true
          description: Mensagem principal de negócio explicando o que aconteceu e o que fazer.
        actionLabel:
          type: string
          nullable: true
          description: Texto do comando principal recomendado para o usuário.
        actionUrl:
          type: string
          nullable: true
          description: URL interna do comando principal para visualizar o nicho, materializar ou pesquisar outro recorte.
        usedAi:
          type: boolean
          description: Indica se o job registrou custo ou sinal explícito de uso de IA.
        aiCostUsd:
          type: number
          description: Soma dos custos de IA em USD encontrados nos outputPayloads persistidos do job.
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CandidateGeneratorJobDetailResponse:
      type: object
      required:
        - jobId
        - cnaeCode
        - status
        - stages
      properties:
        jobId:
          type: string
        cnaeCode:
          type: string
        status:
          type: string
        finalDecision:
          type: string
          nullable: true
        finalDecisionLabel:
          type: string
          nullable: true
        finalDecisionReason:
          type: string
          nullable: true
        outcomeStatus:
          type: string
          nullable: true
        outcomeMessage:
          type: string
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/CandidateGeneratorJobStageStep"
    CandidateGeneratorJobStageStep:
      type: object
      required:
        - stageExecutionId
        - stageCode
        - status
        - createdAt
        - updatedAt
      properties:
        stageExecutionId:
          type: string
        stageCode:
          type: string
        status:
          type: string
        failureType:
          type: string
          nullable: true
        attemptNumber:
          type: integer
          nullable: true
        technicalRetryNumber:
          type: integer
          nullable: true
        knowledgeVersion:
          type: integer
          nullable: true
        materializationEnabled:
          type: boolean
          nullable: true
        inputPayload:
          type: string
          nullable: true
        outputPayload:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        nextStageCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
