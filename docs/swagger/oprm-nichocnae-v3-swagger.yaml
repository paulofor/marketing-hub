openapi: 3.0.3
info:
  title: OPRM NichoCNAE v3 API
  version: v3
  description: Endpoints internos por etapa para transformar CNAE em persona operacional, rotina e tarefas diárias.
paths:
  /api/internal/oprm/nichocnae/v3/{stage}/stage-executions:
    post:
      summary: Cria uma execução pendente de etapa NichoCNAE v3.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StagePendingRequest'
      responses:
        '200':
          description: Execução criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageExecutionResponse'
  /api/internal/oprm/nichocnae/v3/{stage}/stage-executions/cnaes/{cnaeCode}:
    post:
      summary: Inicia a primeira execução v3 para um CNAE.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: cnaeCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execução criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageExecutionResponse'
  /api/internal/oprm/nichocnae/v3/{stage}/stage-executions/pending:
    get:
      summary: Lista pendências da etapa para consumo do executor OPRM.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pendências disponíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StagePendingRequest'
  /api/internal/oprm/nichocnae/v3/{stage}/stage-executions/{stageExecutionId}/complete:
    post:
      summary: Registra conclusão de etapa pelo executor OPRM.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Execução concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageExecutionResponse'
  /api/internal/oprm/nichocnae/v3/{stage}/stage-executions/{stageExecutionId}/fail:
    post:
      summary: Registra falha de etapa pelo executor OPRM.
      parameters:
        - name: stage
          in: path
          required: true
          schema:
            type: string
        - name: stageExecutionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailureRequest'
      responses:
        '200':
          description: Execução marcada como falha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageExecutionResponse'
  /api/oprm/nichocnae/v3/cnaes/{cnaeCode}/progress:
    get:
      summary: Consulta o progresso do job v3 mais recente de um CNAE para a tela administrativa.
      parameters:
        - name: cnaeCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progresso persistido do pipeline com entrada e saída de cada etapa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobProgressResponse'
components:
  schemas:
    StagePendingRequest:
      type: object
      properties:
        stageExecutionId:
          type: integer
          format: int64
        jobId:
          type: string
        cnaeCode:
          type: string
        inputPayload:
          type: string
        attemptNumber:
          type: integer
        knowledgeVersion:
          type: integer
    CompletionRequest:
      type: object
      properties:
        outputPayload:
          type: string
        nextStageCode:
          type: string
    FailureRequest:
      type: object
      properties:
        errorMessage:
          type: string
    JobProgressResponse:
      type: object
      properties:
        jobId:
          type: string
        cnaeCode:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageProgressResponse'
        finalizationReview:
          type: object
          nullable: true
    StageProgressResponse:
      type: object
      properties:
        stageExecutionId:
          type: integer
          format: int64
        stageCode:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
        inputPayload:
          type: string
          nullable: true
        outputPayload:
          type: string
          nullable: true
    StageExecutionResponse:
      type: object
      properties:
        stageExecutionId:
          type: integer
          format: int64
        jobId:
          type: string
        cnaeCode:
          type: string
        stageCode:
          type: string
        status:
          type: string
