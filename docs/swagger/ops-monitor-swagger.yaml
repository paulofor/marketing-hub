openapi: 3.0.3
info:
  title: Ops Monitor API
  version: v1
paths:
  /api/internal/ops-monitor/v1/module-checks/stage-executions/pending:
    get:
      summary: Lista módulos pendentes para verificação pelo worker
      responses:
        '200': { description: OK }
  /api/internal/ops-monitor/v1/modules/{moduleCode}/heartbeat:
    post:
      summary: Registra heartbeat operacional do módulo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/internal/ops-monitor/v1/modules/{moduleCode}/incidents:
    post:
      summary: Registra incidente operacional do módulo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/summary:
    get:
      summary: Retorna resumo executivo de saúde operacional
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/modules:
    get:
      summary: Lista cadastro canônico de módulos monitorados
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpsMonitoredModule'
    post:
      summary: Cria módulo monitorado pelo sistema administrativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsMonitoredModuleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsMonitoredModule'
  /api/ops-monitor/v1/modules/{moduleCode}:
    get:
      summary: Busca módulo monitorado para edição
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsMonitoredModule'
    put:
      summary: Atualiza módulo monitorado pelo sistema administrativo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsMonitoredModuleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsMonitoredModule'
    delete:
      summary: Desativa módulo monitorado sem apagar histórico operacional
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/modules/availability:
    get:
      summary: Lista status atual dos módulos

      parameters:
        - in: query
          name: criticality
          required: false
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [BACKEND, WORKER, COLLECTOR, PORTAL, SERVICE, PDE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAvailabilityResponse'
  /api/ops-monitor/v1/modules/{moduleCode}/availability-history:
    get:
      summary: Lista histórico de disponibilidade do módulo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/incidents/open:
    get:
      summary: Lista incidentes abertos

      parameters:
        - in: query
          name: criticality
          required: false
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [BACKEND, WORKER, COLLECTOR, PORTAL, SERVICE, PDE] }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/incidents/history:
    get:
      summary: Lista histórico recente de incidentes

      parameters:
        - in: query
          name: criticality
          required: false
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [BACKEND, WORKER, COLLECTOR, PORTAL, SERVICE, PDE] }
      responses:
        '200': { description: OK }

components:
  schemas:
    OpsMonitoredModuleRequest:
      type: object
      required: [code, name, type, baseUrl, healthPath]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [BACKEND, FRONTEND, WORKER, COLLECTOR, PORTAL, SERVICE, PDE, VPS] }
        baseUrl: { type: string }
        healthPath: { type: string }
        logPath: { type: string, nullable: true }
        publishedVersion: { type: string, nullable: true }
        productUrl: { type: string, nullable: true }
        monitoringUrl: { type: string, nullable: true }
        containerImageVersion: { type: string, nullable: true }
        enabled: { type: boolean }
        criticality: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        offlineThresholdSeconds: { type: integer, format: int32 }
    OpsMonitoredModule:
      allOf:
        - $ref: '#/components/schemas/OpsMonitoredModuleRequest'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time, nullable: true }
    ModuleAvailabilityResponse:
      type: object
      properties:
        moduleCode: { type: string }
        name: { type: string }
        type: { type: string }
        criticality: { type: string }
        publishedVersion:
          type: string
          nullable: true
          description: Versão comercial/publicada do PDE quando aplicável.
        productUrl:
          type: string
          nullable: true
          description: URL pública do produto.
        monitoringUrl:
          type: string
          nullable: true
          description: Link operacional com marcador de monitoramento para não misturar com tráfego comercial.
        containerImageVersion:
          type: string
          nullable: true
          description: Referência da imagem/container publicada quando disponível.
        status: { type: string }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastResponseTimeMs: { type: integer, format: int64, nullable: true }
        lastError: { type: string, nullable: true }
        attemptedUrl:
          type: string
          nullable: true
          description: URL completa de healthcheck que o monitor tenta acessar para o módulo.
        lastCheckAgeSeconds:
          type: integer
          format: int64
          nullable: true
          description: Idade em segundos do último heartbeat usado na classificação.
        heartbeatStale:
          type: boolean
          description: Indica que o último heartbeat ultrapassou a janela operacional configurada.
        statusReason:
          type: string
          nullable: true
          description: Motivo administrativo para o status efetivo exibido no painel.
