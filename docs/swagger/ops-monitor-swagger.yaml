openapi: 3.0.3
info:
  title: Ops Monitor API
  version: v1
paths:
  /api/internal/ops-monitor/v1/module-checks/stage-executions/pending:
    get:
      summary: Lista módulos pendentes para verificação pelo worker
      responses:
        '200': { description: OK }
  /api/internal/ops-monitor/v1/modules/{moduleCode}/heartbeat:
    post:
      summary: Registra heartbeat operacional do módulo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/internal/ops-monitor/v1/modules/{moduleCode}/incidents:
    post:
      summary: Registra incidente operacional do módulo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/summary:
    get:
      summary: Retorna resumo executivo de saúde operacional
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/modules/availability:
    get:
      summary: Lista status atual dos módulos

      parameters:
        - in: query
          name: criticality
          required: false
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [BACKEND, WORKER, COLLECTOR, PORTAL, SERVICE] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAvailabilityResponse'
  /api/ops-monitor/v1/modules/{moduleCode}/availability-history:
    get:
      summary: Lista histórico de disponibilidade do módulo
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/incidents/open:
    get:
      summary: Lista incidentes abertos

      parameters:
        - in: query
          name: criticality
          required: false
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [BACKEND, WORKER, COLLECTOR, PORTAL, SERVICE] }
      responses:
        '200': { description: OK }
  /api/ops-monitor/v1/incidents/history:
    get:
      summary: Lista histórico recente de incidentes

      parameters:
        - in: query
          name: criticality
          required: false
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [BACKEND, WORKER, COLLECTOR, PORTAL, SERVICE] }
      responses:
        '200': { description: OK }

components:
  schemas:
    ModuleAvailabilityResponse:
      type: object
      properties:
        moduleCode: { type: string }
        name: { type: string }
        type: { type: string }
        criticality: { type: string }
        status: { type: string }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastResponseTimeMs: { type: integer, format: int64, nullable: true }
        lastError: { type: string, nullable: true }
        attemptedUrl:
          type: string
          nullable: true
          description: URL completa de healthcheck que o monitor tenta acessar para o módulo.
