openapi: 3.0.3
info:
  title: PDE Platform API
  version: 1.0.0
  description: Contratos públicos usados para entregar e homologar Produtos Digitais Experienciais.
paths:
  /api/pde/products/{productSlug}/commercial-offer:
    get:
      summary: Entrega ao frontend PDE a oferta canônica do Marketing Hub
      operationId: getPdeCommercialOffer
      parameters:
        - name: productSlug
          in: path
          required: true
          schema:
            type: string
        - name: slotCode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Oferta vinculada ao produto, slot, experimento e nicho vigentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialOffer"
        "503":
          description: Oferta canônica indisponível no Marketing Hub.
  /api/pde/products/{productSlug}/integration-contract:
    get:
      summary: Consulta o contrato preparado da jornada comercial PDE
      operationId: getProductJourneyIntegrationContract
      parameters:
        - name: productSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotas, eventos e correlações implementados para a versão vigente do produto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductJourneyIntegrationContract"
        "404":
          description: Produto PDE não encontrado.
  /api/pde/agent-validation/v1/products/{productSlug}/contract:
    get:
      summary: Consulta identidade e travas da superfície privada de homologação
      operationId: getPdeAgentValidationContractV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
      responses:
        "200":
          description: Contrato sanitizado, sem credencial ou evidência de sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationContract"
  /api/pde/agent-validation/v1/products/{productSlug}/internal/sessions:
    post:
      summary: Abre uma sessão sintética segregada para o harness autorizado
      operationId: createPdeAgentValidationSessionV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeInternalToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationSessionRequest"
      responses:
        "201":
          description: Sessão opaca vinculada ao produto, cenário e versão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
        "403":
          description: Credencial interna ausente ou inválida.
  /api/pde/agent-validation/v1/products/{productSlug}/internal/evidence/{evidenceId}:
    get:
      summary: Recupera a evidência técnica sanitizada de uma sessão
      operationId: getPdeAgentValidationEvidenceV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeInternalToken"
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Eventos, fixtures, custo e efeitos externos persistidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationEvidence"
        "403":
          description: Credencial interna ausente ou inválida.
  /api/pde/agent-validation/v1/products/{productSlug}/internal/session-expiration:
    post:
      summary: Expira deterministicamente uma sessão no harness de recuperação
      operationId: expirePdeAgentValidationSessionV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeInternalToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionToken]
              properties:
                sessionToken: { type: string, writeOnly: true }
      responses:
        "200": { description: Sessão curta marcada como expirada. }
        "403": { description: Credencial interna ou sessão inválida. }
  /api/pde/agent-validation/v1/products/{productSlug}/session:
    get:
      summary: Retoma o checkpoint de uma sessão provisionada pelo harness
      operationId: getPdeAgentValidationSessionV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      responses:
        "200":
          description: Estado retomável da mesma sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
        "403":
          description: Sessão ausente, inválida ou expirada.
  /api/pde/agent-validation/v1/products/{productSlug}/consent:
    post:
      summary: Registra o consentimento sintético versionado antes da entrada
      operationId: acceptPdeAgentValidationConsentV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationConsent"
      responses:
        "200":
          description: Consentimento aceito sem inferir qualquer sinal comercial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/input:
    put:
      summary: Persiste a entrada sintética mínima da sessão
      operationId: savePdeAgentValidationInputV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationInput"
      responses:
        "200":
          description: Entrada aceita e evento inicial persistido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/generate:
    post:
      summary: Materializa três fixtures estáticas ou um bloqueio seguro
      operationId: generatePdeAgentValidationResultV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      responses:
        "200":
          description: Pacote estático pronto ou bloqueado, sempre sem provider pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/events:
    post:
      summary: Registra exclusivamente um sinal comercial explícito do cenário sintético
      operationId: recordPdeAgentValidationEventV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationEvent"
      responses:
        "200":
          description: Evento validado na ordem funcional e persistido uma única vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/milestones/result-presented:
    post:
      summary: Registra que o pacote foi apresentado sem inferir valor ou uso
      operationId: markPdeAgentValidationResultPresentedV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationPackageMilestone"
      responses:
        "200":
          description: Marco operacional persistido fora da telemetria comercial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/milestones/save-interest:
    post:
      summary: Registra interesse explícito em preservar o pacote
      operationId: markPdeAgentValidationSaveInterestV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationConfirmation"
      responses:
        "200":
          description: Interesse operacional persistido sem criar conversão comercial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/continuity:
    post:
      summary: Emite uma credencial rotativa após política e interesse explícitos
      operationId: createPdeAgentValidationContinuityV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationContinuityRequest"
      responses:
        "201":
          description: Credencial devolvida uma vez e persistida somente como hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationContinuityCredential"
  /api/pde/agent-validation/v1/products/{productSlug}/continuity/resume:
    post:
      summary: Rotaciona a credencial e restaura uma sessão curta do mesmo pacote
      operationId: resumePdeAgentValidationContinuityV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationContinuityResumeRequest"
      responses:
        "200":
          description: Nova sessão e nova credencial rotacionada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationContinuityResume"
        "403": { description: Credencial inválida, reutilizada ou expirada. }
  /api/pde/agent-validation/v1/products/{productSlug}/packages/{packageId}:
    get:
      summary: Entrega o pacote somente à sessão autenticada proprietária
      operationId: getPdeAgentValidationResultPackageV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
        - name: packageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: O mesmo pacote estático previamente materializado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationResultPackage"
        "403": { description: Pacote não pertence à sessão autenticada. }
  /api/pde/agent-validation/v1/products/{productSlug}/milestones/access-completed:
    post:
      summary: Confirma o acesso autenticado ao pacote preservado
      operationId: markPdeAgentValidationAccessCompletedV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationPackageMilestone"
      responses:
        "200":
          description: Acesso confirmado como marco operacional independente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/milestones/return-completed:
    post:
      summary: Confirma o retorno ao mesmo pacote e fingerprint
      operationId: markPdeAgentValidationReturnCompletedV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentValidationPackageMilestone"
      responses:
        "200":
          description: Retorno confirmado sem criar um evento de funil adicional.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/completion:
    post:
      summary: Encerra o cenário depois dos sinais e marcos exigidos
      operationId: completePdeAgentValidationScenarioV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
        - $ref: "#/components/parameters/PdeAgentSession"
      responses:
        "200":
          description: Cenário encerrado com evidência persistida e custo externo zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentValidationSession"
  /api/pde/agent-validation/v1/products/{productSlug}/safety:
    get:
      summary: Confirma que cobrança, publicação, campanha e provider estão desativados
      operationId: getPdeAgentValidationSafetyV1
      parameters:
        - $ref: "#/components/parameters/AgentValidationProductSlug"
      responses:
        "200":
          description: Envelope de efeitos externos nulos.
components:
  parameters:
    AgentValidationProductSlug:
      name: productSlug
      in: path
      required: true
      schema:
        type: string
        example: pde-planejado-46
    PdeInternalToken:
      name: X-PDE-Internal-Token
      in: header
      required: true
      schema: { type: string, writeOnly: true }
    PdeAgentSession:
      name: X-PDE-Agent-Session
      in: header
      required: true
      schema: { type: string, format: uuid, writeOnly: true }
  schemas:
    CommercialOffer:
      type: object
      required:
        - productSlug
        - experienceVersion
        - layoutKey
        - experimentId
        - priceBrl
        - checkoutUrl
        - salesPageUrl
      properties:
        productSlug: { type: string }
        experienceVersion: { type: string }
        layoutKey: { type: string }
        experimentId: { type: integer, format: int64 }
        experimentStatus: { type: string }
        acquisitionChannel: { type: string, nullable: true }
        pain: { type: string }
        proof: { type: string }
        promise: { type: string }
        primaryCta: { type: string }
        priceBrl: { type: number }
        checkoutUrl: { type: string, format: uri }
        salesPageUrl: { type: string, format: uri }
        targetAudience: { type: string, nullable: true }
        productFormat: { type: string, nullable: true }
        deliveryMode: { type: string, nullable: true }
        valueUnit: { type: string, nullable: true }
        supplierDisplayName: { type: string }
        supplierRegistrationNumber: { type: string }
        supportEmail: { type: string, format: email }
        termsUrl: { type: string, format: uri }
        privacyUrl: { type: string, format: uri }
        refundPolicyUrl: { type: string, format: uri }
        facebookPixelId:
          type: string
          nullable: true
          description: Pixel criado pelo worker para o nicho comercial vigente.
    ProductJourneyIntegrationContract:
      type: object
      required:
        - productSlug
        - experienceVersion
        - contractVersion
        - eventsPath
        - analyticsSummaryPath
        - loginPath
        - workspacePathTemplate
        - missionCompletionPathTemplate
        - requiredEventTypes
        - correlationKeys
        - sourceOfTruth
        - testTrafficPolicy
      properties:
        productSlug:
          type: string
        experienceVersion:
          type: string
        contractVersion:
          type: string
          example: PDE_COMMERCIAL_JOURNEY_EVENTS_V1
        eventsPath:
          type: string
        analyticsSummaryPath:
          type: string
        loginPath:
          type: string
        workspacePathTemplate:
          type: string
        missionCompletionPathTemplate:
          type: string
        requiredEventTypes:
          type: array
          items:
            type: string
        correlationKeys:
          type: array
          items:
            type: string
        sourceOfTruth:
          type: string
          example: pde_funnel_event
        testTrafficPolicy:
          type: string
    AgentValidationContract:
      type: object
      required:
        - productId
        - productSlug
        - prototypeVersion
        - fixtureContract
        - checkoutMode
        - published
        - paymentEnabled
        - mediaSpendBrl
        - providerCallsAuthorized
        - intakeConsentVersion
        - instrumentationEvents
        - errorStates
      properties:
        productId: { type: integer, format: int64, example: 11 }
        productSlug: { type: string, example: pde-planejado-46 }
        prototypeVersion: { type: string, example: alcyone-private-v3 }
        experienceName: { type: string }
        fixtureContract: { type: string, example: PDE_STATIC_RESULT_FIXTURES_V1 }
        fixtureManifestPath: { type: string }
        productStatus: { type: string, example: PLANNED }
        checkoutMode: { type: string, example: SIMULATED_NO_CHARGE }
        intakeConsentVersion: { type: string, example: ALCYONE_AGENT_INTAKE_CONSENT_V1 }
        continuityPolicyVersion: { type: string, example: ALCYONE_AGENT_CONTINUITY_V1 }
        sessionTtlSeconds: { type: integer, format: int64, example: 1800 }
        continuityTtlSeconds: { type: integer, format: int64, example: 86400 }
        instrumentationEvents:
          type: array
          minItems: 5
          maxItems: 5
          uniqueItems: true
          items: { type: string }
        errorStates:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/AgentValidationErrorState"
        published: { type: boolean, example: false }
        paymentEnabled: { type: boolean, example: false }
        mediaSpendBrl: { type: integer, example: 0 }
        providerCallsAuthorized: { type: integer, example: 0 }
    AgentValidationSessionRequest:
      type: object
      required: [sourceReference, scenarioCode]
      properties:
        sourceReference:
          type: string
          example: product:11@agent-validation-v1
        scenarioCode:
          type: string
          enum: [ADHERENT, RECOVERY, SAFETY]
    AgentValidationInput:
      type: object
      required: [occasion, eventDate, preferences, constraints, pieceReferences]
      properties:
        occasion: { type: string, maxLength: 160 }
        eventDate: { type: string, format: date }
        preferences:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, maxLength: 120 }
        constraints:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, maxLength: 160 }
        pieceReferences:
          type: array
          minItems: 2
          maxItems: 8
          items: { type: string, maxLength: 160 }
    AgentValidationConsent:
      type: object
      required: [accepted, consentVersion]
      properties:
        accepted: { type: boolean, enum: [true] }
        consentVersion: { type: string, example: ALCYONE_AGENT_INTAKE_CONSENT_V1 }
    AgentValidationEvent:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          enum:
            - VALUE_MOMENT
            - READY_RESULT_USED
            - PREFERRED_OVER_FREE
            - CHECKOUT_STARTED
        confirmed: { type: boolean, nullable: true }
        selectedLookId: { type: string, nullable: true }
        alternativeCode: { type: string, nullable: true }
        justification: { type: string, maxLength: 500, nullable: true }
    AgentValidationConfirmation:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, enum: [true] }
        justification: { type: string, maxLength: 500, nullable: true }
    AgentValidationPackageMilestone:
      type: object
      required: [resultPackageId, resultPackageFingerprint]
      properties:
        resultPackageId: { type: string, format: uuid }
        resultPackageFingerprint: { type: string }
    AgentValidationErrorState:
      type: object
      required: [code, message, recoveryAction]
      properties:
        code: { type: string }
        message: { type: string }
        recoveryAction: { type: string }
    AgentValidationSafetyOutcome:
      type: object
      required: [code, reason, noResultMessage, safeAction, resultGenerated, providerCalled]
      properties:
        code: { type: string, enum: [OUT_OF_SCOPE] }
        reason: { type: string }
        noResultMessage: { type: string }
        safeAction: { type: string }
        resultGenerated: { type: boolean, enum: [false] }
        providerCalled: { type: boolean, enum: [false] }
    AgentValidationSession:
      type: object
      required:
        - sessionToken
        - productId
        - productSlug
        - prototypeVersion
        - sourceReference
        - scenarioCode
        - trafficClass
        - mhInternalTest
        - status
        - events
        - checkoutMode
        - finished
        - evidenceId
        - providerCalls
        - providerCostUsd
      properties:
        sessionToken: { type: string, writeOnly: true, nullable: true }
        productId: { type: integer, format: int64 }
        productSlug: { type: string }
        prototypeVersion: { type: string }
        sourceReference: { type: string }
        scenarioCode: { type: string }
        trafficClass: { type: string, example: AGENT_VALIDATION }
        mhInternalTest: { type: boolean, example: true }
        status: { type: string, enum: [AUTHORIZED, INPUT_READY, READY, BLOCKED] }
        input: { $ref: "#/components/schemas/AgentValidationInput" }
        looks:
          type: array
          items: { $ref: "#/components/schemas/AgentValidationLook" }
        selectedLookId: { type: string, nullable: true }
        blocker: { type: string, nullable: true }
        safetyOutcome:
          allOf:
            - $ref: "#/components/schemas/AgentValidationSafetyOutcome"
          nullable: true
        events:
          type: array
          uniqueItems: true
          items: { type: string }
        checkoutMode: { type: string, example: SIMULATED_NO_CHARGE }
        finished: { type: boolean }
        evidenceId: { type: string, format: uuid }
        resultPackageId: { type: string, format: uuid, nullable: true }
        resultPackageFingerprint: { type: string, nullable: true }
        sessionExpiresAt: { type: string, format: date-time }
        consentVersion: { type: string, nullable: true }
        consentedAt: { type: string, format: date-time, nullable: true }
        continuityPolicyVersion: { type: string, nullable: true }
        policyAcknowledged: { type: boolean }
        milestones:
          $ref: "#/components/schemas/AgentValidationMilestones"
        providerCalls: { type: integer, example: 0 }
        providerCostUsd: { type: integer, example: 0 }
    AgentValidationMilestones:
      type: object
      properties:
        inputAcceptedAt: { type: string, format: date-time, nullable: true }
        resultReadyAt: { type: string, format: date-time, nullable: true }
        resultPresentedAt: { type: string, format: date-time, nullable: true }
        saveInterestAt: { type: string, format: date-time, nullable: true }
        continuityCredentialCreatedAt: { type: string, format: date-time, nullable: true }
        accessAuthenticatedAt: { type: string, format: date-time, nullable: true }
        accessCompletedAt: { type: string, format: date-time, nullable: true }
        returnedAt: { type: string, format: date-time, nullable: true }
        safetyBlockedAt: { type: string, format: date-time, nullable: true }
        recoveryCompletedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    AgentValidationContinuityRequest:
      type: object
      required: [policyAcknowledged, policyVersion]
      properties:
        policyAcknowledged: { type: boolean, example: true }
        policyVersion: { type: string, example: ALCYONE_AGENT_CONTINUITY_V1 }
    AgentValidationContinuityCredential:
      type: object
      required: [policyVersion, policyAcknowledgedAt, continuityExpiresAt, resultPackageId, continuationCredential]
      properties:
        policyVersion: { type: string }
        policyAcknowledgedAt: { type: string, format: date-time }
        continuityExpiresAt: { type: string, format: date-time }
        resultPackageId: { type: string, format: uuid }
        continuationCredential: { type: string, writeOnly: true }
    AgentValidationContinuityResumeRequest:
      type: object
      required: [continuationCredential, policyVersion]
      properties:
        continuationCredential: { type: string, writeOnly: true }
        policyVersion: { type: string, example: ALCYONE_AGENT_CONTINUITY_V1 }
    AgentValidationContinuityResume:
      type: object
      required: [sessionToken, sessionExpiresAt, continuationCredential, continuityExpiresAt, resultPackageId, session]
      properties:
        sessionToken: { type: string, writeOnly: true }
        sessionExpiresAt: { type: string, format: date-time }
        continuationCredential: { type: string, writeOnly: true }
        continuityExpiresAt: { type: string, format: date-time }
        resultPackageId: { type: string, format: uuid }
        session: { $ref: "#/components/schemas/AgentValidationSession" }
    AgentValidationResultPackage:
      type: object
      required: [resultPackageId, resultPackageFingerprint, looks]
      properties:
        resultPackageId: { type: string, format: uuid }
        resultPackageFingerprint: { type: string }
        looks:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/AgentValidationLook" }
    AgentValidationLook:
      type: object
      required: [id, title, imagePath, whyItWorks, practicalAdjustment]
      properties:
        id: { type: string }
        title: { type: string }
        imagePath: { type: string }
        whyItWorks: { type: string }
        practicalAdjustment: { type: string }
    AgentValidationEvidence:
      allOf:
        - $ref: "#/components/schemas/AgentValidationSession"
        - type: object
          required:
            - readingId
            - executionId
            - fixtureContract
