openapi: 3.0.3
info:
  title: Marketing Hub Pipeline Governance API
  version: "1.0.0"
  description: Endpoints administrativos para governança de pipelines e etapas sem criar tabelas novas.
servers:
  - url: /api
paths:
  /pipelines/metadata:
    get:
      summary: Lista metadados oficiais de pipelines, módulos e etapas permitidas.
      responses:
        "200":
          description: Metadados oficiais para controlar campos editáveis na tela.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineMetadata"
  /pipelines/geralanding/stage-models:
    get:
      summary: Lista modelos OpenAI configurados no banco para as etapas do Gera Landing.
      description: Retorna uma posição para cada etapa exibida na aba Gera landing do experimento, usando as configurações ativas salvas em pipeline_stage/openai_model.
      responses:
        "200":
          description: Modelos configurados por etapa do Gera Landing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeraLandingStageModel"
  /pipelines/{id}/diagnostics:
    get:
      summary: Diagnostica aderência do pipeline salvo no banco à definição oficial do backend.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Status do contrato operacional e divergências acionáveis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineDiagnostics"
        "404":
          description: Pipeline não encontrado.
  /pipelines/{id}/sync:
    post:
      summary: Sincroniza com segurança um pipeline existente contra a definição oficial.
      description: Não aceita payload; repara somente campos estruturais seguros e preserva configuração operacional.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resultado da sincronização segura com ações aplicadas e divergências restantes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSyncResult"
        "404":
          description: Pipeline não encontrado.
  /pipelines/{id}/rebuild-official-stages:
    post:
      summary: Recria etapas oficiais de um pipeline após confirmação explícita do usuário.
      description: Não aceita payload; remove as etapas operacionais atuais do pipeline oficial e recria somente as etapas canônicas, reaproveitando descrição e modelo OpenAI quando houver mapeamento seguro.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Resultado da recriação controlada das etapas oficiais.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSyncResult"
        "404":
          description: Pipeline não encontrado.
  /pipelines/official/{code}/sync:
    post:
      summary: Cria ou sincroniza um pipeline oficial ausente pelo código canônico.
      description: Não aceita payload; usa exclusivamente o contrato oficial exposto em metadata.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado da criação/sincronização segura do pipeline oficial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineSyncResult"
components:
  schemas:
    GeraLandingStageModel:
      type: object
      required: [stageCode]
      properties:
        stageCode:
          type: string
          example: landing-page-wireframe
        pipelineId:
          type: integer
          format: int64
          nullable: true
        pipelineCode:
          type: string
          nullable: true
          example: experiment-pipeline
        pipelineStageId:
          type: integer
          format: int64
          nullable: true
        pipelineStageCode:
          type: string
          nullable: true
          example: LANDING_PAGE_WIREFRAME
        openAiModelId:
          type: integer
          format: int64
          nullable: true
        openAiModelName:
          type: string
          nullable: true
          example: GPT Vendas
        openAiModelCode:
          type: string
          nullable: true
          example: gpt-vendas
    PipelineMetadata:
      type: object
      required: [validModules, officialPipelines]
      properties:
        validModules:
          type: array
          items:
            type: string
        officialPipelines:
          type: array
          items:
            $ref: "#/components/schemas/OfficialPipeline"
    OfficialPipeline:
      type: object
      required: [module, code, name, canonicalVersion, official, aliases, fieldPolicy, stages]
      properties:
        module:
          type: string
          example: EXPERIMENT
        code:
          type: string
          example: experiment-pipeline
        name:
          type: string
          example: Pipeline de Experimento
        canonicalVersion:
          type: string
          example: procedimento-experimento-canon.v1
        official:
          type: boolean
          example: true
        aliases:
          type: array
          items:
            type: string
        fieldPolicy:
          $ref: "#/components/schemas/PipelineFieldPolicy"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/OfficialPipelineStage"
    OfficialPipelineStage:
      type: object
      required: [canonicalCode, operationalCode, name, position, required, configurable, fieldPolicy, aliases]
      properties:
        canonicalCode:
          type: string
          example: LANDING_PAGE_WIREFRAME
        operationalCode:
          type: string
          example: landing-page-wireframe
        name:
          type: string
          example: Landing Page Wireframe
        position:
          type: integer
          example: 4
        required:
          type: boolean
          example: true
        configurable:
          type: boolean
          example: true
        executionModule:
          type: string
          nullable: true
          description: Módulo executor quando a etapa roda fora do backend; nulo significa backend principal.
          example: ai-worker
        rootPackage:
          type: string
          nullable: true
          description: Pacote raiz no backend ou no módulo executor onde a etapa é implementada.
          example: com.marketinghub.experiment.pipeline
        fieldPolicy:
          $ref: "#/components/schemas/StageFieldPolicy"
        aliases:
          type: array
          items:
            type: string
    PipelineDiagnostics:
      type: object
      required: [pipelineId, pipelineCode, status, expectedStages, configuredStages, issues]
      properties:
        pipelineId:
          type: integer
          format: int64
        pipelineCode:
          type: string
        canonicalPipelineCode:
          type: string
          nullable: true
        status:
          type: string
          enum: [OK, ATENÇÃO, BLOQUEADO]
        expectedStages:
          type: integer
        configuredStages:
          type: integer
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PipelineDiagnosticsIssue"
    PipelineDiagnosticsIssue:
      type: object
      required: [severity, message, rootCause, recommendedAction]
      properties:
        severity:
          type: string
          enum: [ERROR, WARN, INFO]
        stageCode:
          type: string
          nullable: true
        canonicalCode:
          type: string
          nullable: true
        message:
          type: string
        rootCause:
          type: string
        recommendedAction:
          type: string

    PipelineFieldPolicy:
      type: object
      required: [codeStructural, moduleStructural, nameStructural, descriptionOperational, activeOperational]
      properties:
        codeStructural: { type: boolean }
        moduleStructural: { type: boolean }
        nameStructural: { type: boolean }
        descriptionOperational: { type: boolean }
        activeOperational: { type: boolean }
    StageFieldPolicy:
      type: object
      required: [codeStructural, positionStructural, nameStructural, requiredStructural, descriptionOperational, activeOperational, openAiModelOperational]
      properties:
        codeStructural: { type: boolean }
        positionStructural: { type: boolean }
        nameStructural: { type: boolean }
        requiredStructural: { type: boolean }
        descriptionOperational: { type: boolean }
        activeOperational: { type: boolean }
        openAiModelOperational: { type: boolean }
    PipelineSyncResult:
      type: object
      required: [status, synchronizedSafely, expectedStages, configuredStages, appliedActions, issues]
      properties:
        status:
          type: string
          enum: [OK, ATENÇÃO, BLOQUEADO]
        synchronizedSafely:
          type: boolean
        pipelineId:
          type: integer
          format: int64
          nullable: true
        pipelineCode:
          type: string
          nullable: true
        canonicalPipelineCode:
          type: string
          nullable: true
        expectedStages:
          type: integer
        configuredStages:
          type: integer
        appliedActions:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/PipelineDiagnosticsIssue"
