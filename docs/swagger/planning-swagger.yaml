openapi: 3.0.3
info:
  title: Marketing Hub Planning API
  version: v1
paths:
  /api/planning/commercial-plans/{id}/image-studio/jobs:
    get:
      summary: Lista criações e edições visuais auditáveis do plano
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Histórico do Estúdio de Imagens comerciais de Íris }
    post:
      summary: Solicita a Íris criação ou edição de uma peça visual comercial
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, prompt, label, purposes]
              properties:
                operation: { type: string, enum: [CREATE, EDIT] }
                sourceAssetId: { type: integer, format: int64, nullable: true }
                referenceAssetIds:
                  type: array
                  maxItems: 4
                  items: { type: integer, format: int64 }
                prompt: { type: string }
                label: { type: string }
                purposes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [LANDING, ADS, SOCIAL] }
                size: { type: string, enum: [1024x1024, 1024x1536, 1536x1024, 2048x2048, 2048x1152, 1152x2048] }
                quality: { type: string, enum: [medium, high], default: high }
      responses:
        '200': { description: Job criado como PENDING; não aprova nem publica o resultado }
        '400': { description: Contrato, referência ou finalidade inválida }
  /api/internal/planning/image-studio/v1/stage-executions/pending:
    get:
      summary: Reserva para o recurso técnico de Íris produções pendentes ou com lease vencida
      responses:
        '200': { description: Jobs segregados por plano com referências autorizadas }
  /api/internal/planning/image-studio/v1/stage-executions/{jobId}/artifact:
    post:
      summary: Recebe do recurso técnico de Íris o binário e a auditoria integral da produção
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [producerExecutionId, file, model, requestJson, responseJson]
              properties:
                producerExecutionId: { type: string }
                file: { type: string, format: binary }
                model: { type: string, enum: [gpt-image-2] }
                requestJson: { type: string }
                responseJson: { type: string }
                usageJson: { type: string, nullable: true }
                costUsd: { type: number, nullable: true }
      responses:
        '200': { description: Peça comercial persistida como DRAFT e revisão aberta }
  /api/internal/planning/image-studio/v1/reviews/pending:
    get:
      summary: Reserva peças comerciais DRAFT para uma execução independente de Têmis
      responses:
        '200': { description: Peças comerciais que aguardam inspeção premium }
  /api/internal/planning/image-studio/v1/reviews/{assetId}/result:
    post:
      summary: Recebe o parecer de uma execução independente de Têmis
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Asset aprovado ou devolvido para ajuste pelo backend }
        '400': { description: Autoaprovação ou decisão inválida bloqueada }
  /api/planning/commercial-plans/{id}/visual-assets:
    get:
      summary: Lista o Kit Visual versionado do plano comercial
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Kit visual completo }
    post:
      summary: Anexa uma referência visual como rascunho
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetUrl, label, purpose, origin, rightsStatement]
              properties:
                assetUrl: { type: string }
                label: { type: string }
                purpose: { type: string, enum: [ADS, LANDING, SOCIAL, DELIVERY, PRODUCT_PROOF] }
                origin: { type: string }
                rightsStatement: { type: string }
      responses:
        '200': { description: Referência criada como DRAFT }
  /api/planning/commercial-plans/{id}/visual-assets/approved-package:
    post:
      summary: Importa um pacote criativo aprovado com arquivos, hashes e pareceres auditáveis
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200': { description: Ativos aprovados importados de forma idempotente }
        '400': { description: Pacote, hashes, contrato ou pareceres inválidos }
  /api/planning/commercial-plans/{id}/visual-assets/{assetId}/status:
    patch:
      summary: Aprova ou retira uma referência do Kit Visual
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: assetId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, RETIRED] }
      responses:
        '200': { description: Estado atualizado }
  /api/planning/commercial-plans:
    post:
      tags: [planning]
      summary: Cria plano comercial com premissas financeiras versionadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialPlanFinancialAssumptions"
      responses:
        "200":
          description: Plano criado e primeira versão congelada.
  /api/planning/commercial-plans/{id}:
    put:
      tags: [planning]
      summary: Atualiza o plano e cria nova versão das premissas.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialPlanFinancialAssumptions"
      responses:
        "200":
          description: Plano atualizado sem autorizar gastos.
  /api/planning/commercial-plans/{id}/versions:
    get:
      tags: [planning]
      summary: Lista versões imutáveis do contexto comercial.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Histórico auditável do plano.
  /api/planning/commercial-plans/{id}/context/current:
    get:
      tags: [planning]
      summary: Entrega a versão corrente do contexto para agentes, tarefas e gates.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Snapshot funcional com identidade de versão.
  /api/planning/commercial-plans/{id}/agent-activity:
    get:
      tags: [planning]
      summary: Consolida trabalhos, dificuldades, decisões e finanças dos agentes no plano.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Prestação de contas persistida e segregada pelo plano.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialPlanAgentActivity"
  /api/planning/commercial-plans/{id}/operational-flow:
    get:
      tags: [planning]
      summary: Entrega a etapa corrente e a próxima ação do fluxo comercial simplificado.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Fluxo calculado pelo backend sem autorizar publicação ou gasto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialPlanOperationalFlow"
  /api/planning/commercial-plans/{id}/weeks:
    get:
      tags:
        - planning
      summary: Lista semanas do planejamento comercial com métricas de funil.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Semanas do plano comercial.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommercialPlanWeek"
  /api/planning/commercial-plans/{id}/weeks/commitments/{commitmentId}/status:
    patch:
      tags: [planning]
      summary: Atualiza o andamento de um compromisso semanal sem alterar sua estratégia.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: commitmentId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Compromisso atualizado e preservado na versão original do plano.
components:
  schemas:
    CommercialPlanOperationalFlow:
      type: object
      required: [commercialPlanId, currentStage, status, nextAction, expectedMetric, decisionCriterion, stages, specialistDecisions]
      properties:
        commercialPlanId: {type: integer, format: int64}
        currentStage: {type: string}
        status: {type: string, enum: [APROVADO, BLOQUEADO, AJUSTE_NECESSARIO, EM_ANDAMENTO]}
        nextAction: {type: string}
        blocker: {type: string, nullable: true}
        expectedMetric: {type: string}
        decisionCriterion: {type: string}
        stages:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              label: {type: string}
              status: {type: string, enum: [CONCLUIDO, ATUAL, PENDENTE]}
        specialistDecisions:
          type: array
          items:
            type: object
            properties:
              specialist: {type: string}
              responsibility: {type: string}
              decision: {type: string}
              nextAction: {type: string}
    CommercialPlanFinancialAssumptions:
      type: object
      description: Premissas estimadas e segregadas; não representam valores realizados.
      properties:
        offerPriceBrl: {type: number, minimum: 0, nullable: true}
        variableCostPerSaleBrl: {type: number, minimum: 0, nullable: true}
        expectedMonthlyTraffic: {type: integer, minimum: 0, nullable: true}
        expectedConversionRatePercent: {type: number, minimum: 0, maximum: 100, nullable: true}
        expectedCacBrl: {type: number, minimum: 0, nullable: true}
        expectedRefundRatePercent: {type: number, minimum: 0, maximum: 100, nullable: true}
        fixedOperationalCostBrl: {type: number, minimum: 0, nullable: true}
    CommercialPlanAgentActivity:
      type: object
      properties:
        commercialPlanId: {type: integer, format: int64}
        currentVersion: {type: integer}
        budgetLimitBrl: {type: number, nullable: true}
        campaignCostBrl: {type: number, nullable: true}
        aiCostBrl: {type: number, nullable: true}
        totalCostBrl: {type: number, nullable: true}
        revenueBrl: {type: number, nullable: true}
        videoBudgetLimitUsd: {type: number}
        videoKnownCostUsd: {type: number}
        openTasks: {type: integer, format: int64}
        pendingDecisions: {type: integer, format: int64}
        entries:
          type: array
          items:
            type: object
            properties:
              recordType: {type: string}
              agentKey: {type: string}
              agentNickname: {type: string}
              title: {type: string}
              status: {type: string}
              difficulty: {type: string, nullable: true}
              externalDecisionRequired: {type: boolean}
              externalDecision: {type: string, nullable: true}
              sourceReference: {type: string, nullable: true}
              budgetLimitUsd: {type: number, nullable: true}
              knownCostUsd: {type: number, nullable: true}
              financialDecision: {type: string, nullable: true}
              occurredAt: {type: string, format: date-time, nullable: true}
    CommercialPlanWeek:
      type: object
      properties:
        weekNumber:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        experimentsCreated:
          type: integer
        totalCost:
          type: number
        totalRevenue:
          type: number
        objectivesEditable:
          type: boolean
        objectiveEditWindowMessage:
          type: string
        funnelStages:
          type: array
          items:
            $ref: "#/components/schemas/CommercialPlanFunnelStage"
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/CommercialPlanWeekCommitment"
        experiments:
          type: array
          items:
            type: object
    CommercialPlanFunnelStage:
      type: object
      properties:
        code:
          type: string
          example: CHECKOUT_CLICK
        name:
          type: string
          example: Clique no plano ou checkout
        plannedTotal:
          type: integer
          format: int64
          nullable: true
        actualTotal:
          type: integer
          format: int64
          nullable: true
        conversionFromPreviousStep:
          type: number
          nullable: true
          description: Percentual de conversão contra a etapa aplicável anterior.
        costPerConversion:
          type: number
          nullable: true
        uniqueCount:
          type: integer
          format: int64
          nullable: true
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        applicable:
          type: boolean
        evidenceSource:
          type: string
    CommercialPlanWeekCommitment:
      type: object
      description: Compromisso temporal vinculado à versão oficial do Plano Comercial.
      properties:
        id: {type: integer, format: int64, nullable: true}
        sequenceOrder: {type: integer}
        objectiveText: {type: string}
        score: {type: integer, nullable: true, minimum: 0, maximum: 10}
        planVersionNumber: {type: integer}
        assignedAgentKey: {type: string, nullable: true}
        assignedAgentNickname: {type: string, nullable: true}
        expectedResult: {type: string, nullable: true}
        executionStatus:
          type: string
          enum: [PLANNED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED]
        dueDate: {type: string, format: date}
        plannedCost: {type: number, nullable: true}
        plannedRevenue: {type: number, nullable: true}
