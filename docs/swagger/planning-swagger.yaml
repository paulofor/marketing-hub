openapi: 3.0.3
info:
  title: Marketing Hub Planning API
  version: v1
paths:
  /api/planning/commercial-plans/{id}/versions:
    get:
      tags: [planning]
      summary: Lista versões imutáveis do contexto comercial.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Histórico auditável do plano.
  /api/planning/commercial-plans/{id}/context/current:
    get:
      tags: [planning]
      summary: Entrega a versão corrente do contexto para agentes, tarefas e gates.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Snapshot funcional com identidade de versão.
  /api/planning/commercial-plans/{id}/agent-activity:
    get:
      tags: [planning]
      summary: Consolida trabalhos, dificuldades, decisões e finanças dos agentes no plano.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Prestação de contas persistida e segregada pelo plano.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialPlanAgentActivity"
  /api/planning/commercial-plans/{id}/weeks:
    get:
      tags:
        - planning
      summary: Lista semanas do planejamento comercial com métricas de funil.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Semanas do plano comercial.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommercialPlanWeek"
components:
  schemas:
    CommercialPlanAgentActivity:
      type: object
      properties:
        commercialPlanId: {type: integer, format: int64}
        currentVersion: {type: integer}
        budgetLimitBrl: {type: number, nullable: true}
        campaignCostBrl: {type: number, nullable: true}
        aiCostBrl: {type: number, nullable: true}
        totalCostBrl: {type: number, nullable: true}
        revenueBrl: {type: number, nullable: true}
        videoBudgetLimitUsd: {type: number}
        videoKnownCostUsd: {type: number}
        openTasks: {type: integer, format: int64}
        pendingDecisions: {type: integer, format: int64}
        entries:
          type: array
          items:
            type: object
            properties:
              recordType: {type: string}
              agentKey: {type: string}
              agentNickname: {type: string}
              title: {type: string}
              status: {type: string}
              difficulty: {type: string, nullable: true}
              externalDecisionRequired: {type: boolean}
              externalDecision: {type: string, nullable: true}
              sourceReference: {type: string, nullable: true}
              budgetLimitUsd: {type: number, nullable: true}
              knownCostUsd: {type: number, nullable: true}
              financialDecision: {type: string, nullable: true}
              occurredAt: {type: string, format: date-time, nullable: true}
    CommercialPlanWeek:
      type: object
      properties:
        weekNumber:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        experimentsCreated:
          type: integer
        totalCost:
          type: number
        totalRevenue:
          type: number
        objectivesEditable:
          type: boolean
        objectiveEditWindowMessage:
          type: string
        funnelStages:
          type: array
          items:
            $ref: "#/components/schemas/CommercialPlanFunnelStage"
        objectives:
          type: array
          items:
            type: object
        experiments:
          type: array
          items:
            type: object
    CommercialPlanFunnelStage:
      type: object
      properties:
        code:
          type: string
          example: CHECKOUT_CLICK
        name:
          type: string
          example: Clique no plano ou checkout
        plannedTotal:
          type: integer
          format: int64
          nullable: true
        actualTotal:
          type: integer
          format: int64
          nullable: true
        conversionFromPreviousStep:
          type: number
          nullable: true
          description: Percentual de conversão contra a etapa aplicável anterior.
        costPerConversion:
          type: number
          nullable: true
        uniqueCount:
          type: integer
          format: int64
          nullable: true
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        applicable:
          type: boolean
        evidenceSource:
          type: string
