openapi: 3.0.3
info:
  title: Product AI Experiment Preparation API
  version: 1.0.0
  description: Contrato para validar se uma hipótese Produto IA pode virar experimento rastreável.
paths:
  /api/product-ai/experiment-preparations/{hypothesisId}:
    get:
      summary: Consulta preparo sistêmico de Produto IA
      description: Retorna bloqueios e rascunho canônico para criar experimento somente quando a hipótese possui nicho, dor, persona, promessa, mecanismo, preço, pacote de oferta, entregáveis e descrição da amostra.
      parameters:
        - name: hypothesisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preparo retornado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAiExperimentPreparation'
        '404':
          description: Hipótese não encontrada.
  /api/product-ai/hypotheses/{hypothesisId}/personalized-sample-preparation:
    post:
      summary: Prepara hipótese para AI Personalized Sample
      description: Completa uma hipótese já criada pelo sistema com subtipo, preço inicial, pacote de oferta e entregável mínimo para o MVP de amostra personalizada. Não cria experimento.
      parameters:
        - name: hypothesisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Hipótese preparada e diagnóstico de experimento retornado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizedSamplePreparation'
        '400':
          description: Hipótese ainda não possui rastreabilidade mínima de nicho, dor, persona, promessa e mecanismo.
        '404':
          description: Hipótese não encontrada.
  /api/product-ai/experiments/{experimentId}/personalized-sample-funnel:
    post:
      summary: Cria funil de coleta para AI Personalized Sample
      description: Cria ou reaproveita o Lead Portal Flow canônico que coleta os dados mínimos do lead para gerar uma amostra personalizada. Quando o contexto indicar DecoraIA, decoração ou melhoria de ambiente por foto, o funil exige upload da foto do ambiente e campos específicos do piloto visual. O fluxo fica aprovado e vinculado ao experimento.
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Funil criado ou normalizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizedSampleFunnel'
        '400':
          description: Experimento não é AI_PERSONALIZED_SAMPLE ou não possui nicho.
        '404':
          description: Experimento não encontrado.
components:
  schemas:
    PersonalizedSampleFunnel:
      type: object
      properties:
        experimentId:
          type: integer
          format: int64
        leadPortalFlowId:
          type: integer
          format: int64
        leadPortalFlowSlug:
          type: string
          example: product-ai-exp-55-personalized-sample
        approved:
          type: boolean
          example: true
        approvedAt:
          type: string
          format: date-time
        dataKeys:
          type: array
          items:
            type: string
          example:
            - nome
            - email
            - whatsapp
            - negocio_projeto
            - contexto_atual
            - objetivo_visual
            - dados_personalizacao
            - preferencias_visuais
    PersonalizedSamplePreparation:
      type: object
      properties:
        hypothesisId:
          type: string
          format: uuid
        hypothesisTitle:
          type: string
        productAiSubtype:
          type: string
          example: AI_PERSONALIZED_SAMPLE
        price:
          type: number
          format: decimal
          example: 27.00
        offerPackageId:
          type: integer
          format: int64
        offerPackageName:
          type: string
          example: Pacote inicial de amostra personalizada
        deliverableId:
          type: integer
          format: int64
        deliverableTitle:
          type: string
          example: Amostra visual personalizada
        experimentPreparation:
          $ref: '#/components/schemas/ProductAiExperimentPreparation'
    ProductAiExperimentPreparation:
      type: object
      required: [hypothesisId, hypothesisTitle, ready, blockers]
      properties:
        hypothesisId:
          type: string
          format: uuid
        hypothesisTitle:
          type: string
        productAiSubtype:
          type: string
          nullable: true
          example: AI_PERSONALIZED_SAMPLE
        ready:
          type: boolean
        blockers:
          type: array
          items:
            type: string
        draft:
          nullable: true
          $ref: '#/components/schemas/ProductAiExperimentDraft'
    ProductAiExperimentDraft:
      type: object
      properties:
        experimentType:
          type: string
          example: LOW_TICKET_PRODUCT
        productAiSubtype:
          type: string
          example: AI_PERSONALIZED_SAMPLE
        stage:
          type: string
          example: SAMPLE
        campaignObjective:
          type: string
          example: SALES
        primaryVariable:
          type: string
          example: Amostra visual personalizada
        primaryMetric:
          type: string
          example: Compra aprovada e custo de IA por compra
        unitPrice:
          type: number
          format: decimal
