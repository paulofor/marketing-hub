openapi: 3.0.3
info:
  title: Marketing Hub - Product Discovery
  version: 1.1.0
  description: Endpoints administrativos e internos da descoberta de produtos PDE.
paths:
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/pending:
    get:
      tags: [Product Discovery]
      summary: Reserva uma execução nova ou recupera lease expirado
      responses:
        "200":
          description: Lista com no máximo uma execução e seu lease exclusivo
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: "#/components/schemas/ProductDiscoveryPendingExecution"
  /api/product-discovery/v1/cycles/{cycleId}/research-plan:
    get:
      tags: [Product Discovery]
      summary: Consulta o plano auditável de pesquisa dirigida de Argos
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Plano persistido sem credenciais dos marketplaces
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/plan:
    post:
      tags: [Product Discovery]
      summary: Registra o plano dirigido antes da coleta
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionLeaseId, planJson, rawResponse, model]
              properties:
                executionLeaseId: { type: string, format: uuid }
                planJson: { type: string }
                rawResponse: { type: string }
                model: { type: string }
      responses:
        "200":
          description: Plano auditado
        "409":
          description: Lease expirado ou substituído
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/meta-ad-evidence:
    post:
      tags: [Product Discovery]
      summary: Solicita e consulta a cobertura atual da categoria na Meta Ads Library
      description: Cria ou reutiliza uma investigação canônica sem expor a credencial Meta ao Argos. Anúncios são sinais de investimento, não vendas comprovadas.
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceRequest"
      responses:
        "200":
          description: Cobertura auditável da categoria no Instagram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceList"
        "400":
          description: País, plataforma ou limite inválido
        "409":
          description: Lease expirado ou substituído
  /api/internal/product-discovery/productdiscovery/v1/meta-ad-evidence:
    get:
      tags: [Product Discovery]
      summary: Consulta evidências Meta já persistidas sem iniciar coleta
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
        - in: query
          name: country
          schema: { type: string, default: BR, pattern: "^[A-Za-z]{2}$" }
        - in: query
          name: publisherPlatform
          schema: { type: string, default: INSTAGRAM, enum: [INSTAGRAM] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Evidências persistidas e métricas de cobertura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceList"
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/complete:
    post:
      tags: [Product Discovery]
      summary: Conclui somente a tentativa que possui o lease vigente
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDiscoveryResult"
      responses:
        "200": { description: Pesquisa concluída }
        "409": { description: Lease expirado ou substituído }
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/fail:
    post:
      tags: [Product Discovery]
      summary: Registra falha somente para o lease vigente
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Falha auditada }
        "409": { description: Lease expirado ou substituído }
  /api/product-discovery/v1/maturity-ranking:
    get:
      tags:
        - Product Discovery
      summary: Retorna o ranking gerencial por maturidade comercial de oportunidades PDE.
      operationId: getProductDiscoveryMaturityRanking
      responses:
        "200":
          description: Ranking com nichos priorizados, travas comerciais e trilhas recomendadas para novos ciclos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMaturityRanking"
  /api/product-discovery/v1/cycles:
    get:
      tags:
        - Product Discovery
      summary: Lista ciclos recentes de descoberta PDE.
      operationId: listProductDiscoveryCycles
      responses:
        "200":
          description: Ciclos recentes.
    post:
      tags:
        - Product Discovery
      summary: Cria um ciclo de descoberta PDE para pesquisa pelo worker.
      operationId: createProductDiscoveryCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDiscoveryCycle"
      responses:
        "201":
          description: Ciclo criado.
  /api/product-discovery/v1/cycles/{cycleId}:
    get:
      tags:
        - Product Discovery
      summary: Retorna um ciclo com oportunidades ranqueadas.
      operationId: getProductDiscoveryCycle
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detalhe do ciclo.
        "404":
          description: Ciclo não encontrado.
  /api/product-discovery/v1/legacy-artificial-evidence/archive:
    post:
      tags:
        - Product Discovery
      summary: Arquiva ciclos legados compostos somente por evidências artificiais.
      operationId: archiveProductDiscoveryArtificialLegacyEvidence
      responses:
        "200":
          description: Resultado auditável da limpeza lógica, sem exclusão do histórico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryLegacyCleanup"
components:
  schemas:
    ProductDiscoveryMetaAdEvidenceRequest:
      type: object
      required: [executionLeaseId, query]
      properties:
        executionLeaseId: { type: string }
        query: { type: string }
        country: { type: string, default: BR, pattern: "^[A-Za-z]{2}$" }
        publisherPlatform:
          { type: string, default: INSTAGRAM, enum: [INSTAGRAM] }
        limit: { type: integer, minimum: 1, maximum: 50, default: 25 }
    ProductDiscoveryMetaAdEvidenceList:
      type: object
      required:
        - query
        - country
        - publisherPlatform
        - sourceStatus
        - collectionMode
        - adsObserved
        - activeAds
        - advertisersObserved
        - interpretation
        - items
      properties:
        cycleId: { type: integer, format: int64, nullable: true }
        query: { type: string }
        country: { type: string }
        publisherPlatform: { type: string, enum: [INSTAGRAM] }
        sourceStatus:
          type: string
          enum:
            - OBSERVED
            - STALE
            - NO_ACTIVE_ADS
            - NOT_REQUESTED
            - NO_RELEVANT_PLATFORM_EVIDENCE
            - AWAITING_OFFICIAL_COLLECTION
            - AWAITING_SUPERVISED_OBSERVATION
        collectionMode:
          { type: string, enum: [PERSISTED_ONLY, OFFICIAL_API, SUPERVISED] }
        investigationId: { type: integer, format: int64, nullable: true }
        searchUrl: { type: string, format: uri, nullable: true }
        adsObserved: { type: integer, minimum: 0 }
        activeAds: { type: integer, minimum: 0 }
        advertisersObserved: { type: integer, minimum: 0 }
        latestObservationAt: { type: string, format: date-time, nullable: true }
        interpretation: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidence"
    ProductDiscoveryMetaAdEvidence:
      type: object
      properties:
        metaAdId: { type: string }
        advertiserName: { type: string, nullable: true }
        adTexts:
          type: array
          items: { type: string }
        publisherPlatforms:
          type: array
          items: { type: string }
        formatTypes:
          type: array
          items: { type: string }
        destinationUrl: { type: string, nullable: true }
        snapshotUrl: { type: string, nullable: true }
        active: { type: boolean }
        commercialSignal: { type: boolean }
        observations: { type: integer, minimum: 1 }
        longevityDays: { type: integer, minimum: 0 }
        sustainedInvestmentSignal: { type: boolean }
        evidenceConfidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
    ProductDiscoveryPendingExecution:
      type: object
      required:
        [
          cycleId,
          pipelineCode,
          stageCode,
          theme,
          country,
          language,
          researchMode,
          marketType,
          executionLeaseId,
          executionAttempt,
        ]
      properties:
        cycleId: { type: integer, format: int64 }
        pipelineCode: { type: string, enum: [productdiscovery.v1] }
        stageCode: { type: string, enum: [research] }
        executionLeaseId: { type: string, format: uuid }
        executionAttempt: { type: integer, minimum: 1 }
        theme: { type: string }
        targetAudience: { type: string, nullable: true }
        country: { type: string }
        language: { type: string }
        acquisitionChannel: { type: string, nullable: true }
        commercialConstraints: { type: string, nullable: true }
        forbiddenCategories: { type: string, nullable: true }
        objective: { type: string, nullable: true }
        researchMode:
          { type: string, enum: [DISCOVER_MARKETS, VALIDATE_MARKET] }
        marketType: { type: string, enum: [B2C, B2B, UNSPECIFIED] }
        referenceSources:
          type: string
          nullable: true
          description: Uma URL editorial pública por linha.
    ProductDiscoveryResult:
      type: object
      required: [executionLeaseId, decisionSummary, opportunities]
      properties:
        executionLeaseId: { type: string, format: uuid }
        decisionSummary: { type: string }
        opportunities:
          type: array
          description: Candidatas factuais; sinais imaturos permanecem RESEARCH_MORE.
          items: { type: object }
        evidenceReport:
          type: object
          nullable: true
          description: Cobertura funcional das fontes e gates, separada da auditoria técnica.
        analysisAudit:
          $ref: "#/components/schemas/ProductDiscoveryAnalysisAudit"
    ProductDiscoveryAnalysisAudit:
      type: object
      nullable: true
      required: [rawResponse, model, executionMode]
      properties:
        rawResponse: { type: string }
        model: { type: string, maxLength: 128 }
        executionMode: { type: string, enum: [MODEL, DETERMINISTIC] }
        promptSent: { type: string, nullable: true }
        agentPromptPart: { type: string, nullable: true }
        activityPromptPart: { type: string, nullable: true }
        reasoningEffort: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        accessedUrls:
          type: array
          maxItems: 50
          items:
            type: object
            required: [url]
            properties:
              url: { type: string, format: uri }
              label: { type: string, nullable: true }
              accessMethod: { type: string, nullable: true }
              accessedAt: { type: string, format: date-time, nullable: true }
    ProductDiscoveryLegacyCleanup:
      type: object
      properties:
        archivedCycles:
          type: integer
        archivedOpportunities:
          type: integer
        cycleIds:
          type: array
          items:
            type: integer
            format: int64
        reason:
          type: string
    ProductDiscoveryMaturityRanking:
      type: object
      properties:
        strategyName:
          type: string
        decisionCriterion:
          type: string
        recommendedPriority:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryMaturityItem"
        recommendedTracks:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryResearchTrack"
    ProductDiscoveryMaturityItem:
      type: object
      properties:
        position:
          type: integer
        niche:
          type: string
        maturity:
          type: string
          example: Oportunidade promissora
        summary:
          type: string
        commercialReason:
          type: string
        recommendedAction:
          type: string
        evidence:
          type: array
          items:
            type: string
        guardrails:
          type: array
          items:
            type: string
    ProductDiscoveryResearchTrack:
      type: object
      properties:
        name:
          type: string
        focus:
          type: string
        reason:
          type: string
        theme:
          type: string
        targetAudience:
          type: string
        acquisitionChannel:
          type: string
        objective:
          type: string
        commercialConstraints:
          type: string
        forbiddenCategories:
          type: string
    CreateProductDiscoveryCycle:
      type: object
      required:
        - theme
      properties:
        theme:
          type: string
        targetAudience:
          type: string
        country:
          type: string
          example: BR
        language:
          type: string
          example: pt-BR
        acquisitionChannel:
          type: string
        researchMode:
          type: string
          enum: [DISCOVER_MARKETS, VALIDATE_MARKET]
          default: VALIDATE_MARKET
        marketType:
          type: string
          enum: [B2C, B2B, UNSPECIFIED]
          default: UNSPECIFIED
        referenceSources:
          type: string
          description: Uma URL editorial pública por linha.
        commercialConstraints:
          type: string
        forbiddenCategories:
          type: string
        objective:
          type: string
