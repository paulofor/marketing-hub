openapi: 3.0.3
info:
  title: Marketing Hub - Product Discovery
  version: 1.4.0
  description: Endpoints administrativos e internos da descoberta de produtos PDE.
paths:
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/pending:
    get:
      tags: [Product Discovery]
      summary: Reserva uma execução nova ou recupera lease expirado
      responses:
        "200":
          description: Lista com no máximo uma execução e seu lease exclusivo
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: "#/components/schemas/ProductDiscoveryPendingExecution"
  /api/product-discovery/v1/cycles/{cycleId}/research-plan:
    get:
      tags: [Product Discovery]
      summary: Consulta o plano auditável de pesquisa dirigida de Argos
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Plano persistido sem credenciais dos marketplaces
  /api/product-discovery/v1/cycles/{cycleId}/supervised-meta-session:
    get:
      tags: [Product Discovery]
      summary: Exibe a sessão supervisionada da Biblioteca Meta vinculada ao ciclo
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Busca oficial, cobertura, linguagem observada e prontidão da reanálise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoverySupervisedMetaSession"
        "404":
          description: Ciclo ou sessão ainda não materializada
        "409":
          description: Ciclo fora do recorte B2C para Instagram
  /api/product-discovery/v1/cycles/{cycleId}/supervised-meta-session/observations:
    post:
      tags: [Product Discovery]
      summary: Registra uma observação humana da Biblioteca pública da Meta
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDiscoverySupervisedMetaObservation"
      responses:
        "200":
          description: Observação persistida e sessão recalculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoverySupervisedMetaSession"
        "400":
          description: URL, plataforma ou campos observados inválidos
        "404":
          description: Ciclo ou sessão supervisionada não encontrada
        "409":
          description: Tentativa em andamento ou investigação fora do modo supervisionado
  /api/product-discovery/v1/cycles/{cycleId}/supervised-meta-session/resume:
    post:
      tags: [Product Discovery]
      summary: Abre uma nova tentativa de Argos com a mesma investigação supervisionada
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Reanálise enfileirada de forma idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoverySupervisedMetaSession"
        "409":
          description: Ainda não existe anúncio atual, ativo e observado no Instagram
        "404":
          description: Ciclo ou sessão supervisionada não encontrada
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/plan:
    post:
      tags: [Product Discovery]
      summary: Registra o plano dirigido antes da coleta
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionLeaseId, planJson, rawResponse, model]
              properties:
                executionLeaseId: { type: string, format: uuid }
                planJson: { type: string }
                rawResponse: { type: string }
                model: { type: string }
      responses:
        "200":
          description: Plano auditado
        "409":
          description: Lease expirado ou substituído
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/meta-ad-evidence:
    post:
      tags: [Product Discovery]
      summary: Solicita e consulta a cobertura atual da categoria na Meta Ads Library
      description: Cria ou reutiliza uma investigação canônica sem expor a credencial Meta ao Argos. Anúncios são sinais de investimento, não vendas comprovadas.
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceRequest"
      responses:
        "200":
          description: Cobertura auditável da categoria no Instagram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceList"
        "400":
          description: País, plataforma ou limite inválido
        "409":
          description: Lease expirado ou substituído
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/meta-ad-browser-collection:
    post:
      tags: [Product Discovery]
      summary: Registra a observação pública da Biblioteca Meta para uma tentativa
      description: Preserva payload bruto, filtros e desfecho do Chromium sem tratar anúncio como venda.
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDiscoveryMetaAdBrowserCollectionRequest"
      responses:
        "200":
          description: Cobertura auditável da tentativa após a coleta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceList"
        "400":
          description: Payload, limite ou filtro inválido
        "409":
          description: Lease expirado ou investigação divergente da tentativa
  /api/internal/product-discovery/productdiscovery/v1/meta-ad-evidence:
    get:
      tags: [Product Discovery]
      summary: Consulta evidências Meta já persistidas sem iniciar coleta
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
        - in: query
          name: country
          schema: { type: string, default: BR, pattern: "^[A-Za-z]{2}$" }
        - in: query
          name: publisherPlatform
          schema: { type: string, default: INSTAGRAM, enum: [INSTAGRAM] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Evidências persistidas e métricas de cobertura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidenceList"
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/complete:
    post:
      tags: [Product Discovery]
      summary: Conclui somente a tentativa que possui o lease vigente
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDiscoveryResult"
      responses:
        "200": { description: Pesquisa concluída }
        "409": { description: Lease expirado ou substituído }
  /api/internal/product-discovery/productdiscovery/v1/research/stage-executions/{cycleId}/fail:
    post:
      tags: [Product Discovery]
      summary: Registra falha somente para o lease vigente
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Falha auditada }
        "409": { description: Lease expirado ou substituído }
  /api/product-discovery/v1/maturity-ranking:
    get:
      tags:
        - Product Discovery
      summary: Retorna o ranking gerencial por maturidade comercial de oportunidades PDE.
      operationId: getProductDiscoveryMaturityRanking
      responses:
        "200":
          description: Ranking com nichos priorizados, travas comerciais e trilhas recomendadas para novos ciclos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryMaturityRanking"
  /api/product-discovery/v1/cycles:
    get:
      tags:
        - Product Discovery
      summary: Lista ciclos recentes de descoberta PDE.
      operationId: listProductDiscoveryCycles
      responses:
        "200":
          description: Ciclos recentes.
    post:
      tags:
        - Product Discovery
      summary: Cria um ciclo de descoberta PDE para pesquisa pelo worker.
      operationId: createProductDiscoveryCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDiscoveryCycle"
      responses:
        "201":
          description: Ciclo criado.
  /api/product-discovery/v1/cycles/{cycleId}:
    get:
      tags:
        - Product Discovery
      summary: Retorna um ciclo com oportunidades ranqueadas.
      operationId: getProductDiscoveryCycle
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detalhe do ciclo.
        "404":
          description: Ciclo não encontrado.
  /api/product-discovery/v1/cycles/{cycleId}/private-validation-handoff:
    post:
      tags:
        - Product Discovery
      summary: Retoma o handoff privado com os dossiês atuais sem repetir Argos.
      operationId: resumeProductDiscoveryPrivateValidationHandoff
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Dossiês encaminhados idempotentemente à versão publicada do fluxo privado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryPrivateValidationHandoff"
        "404":
          description: Ciclo não encontrado.
        "409":
          description: Pesquisa factual ainda não concluída.
        "422":
          description: Ciclo concluído sem dossiê factual pronto.
  /api/product-discovery/v1/legacy-artificial-evidence/archive:
    post:
      tags:
        - Product Discovery
      summary: Arquiva ciclos legados compostos somente por evidências artificiais.
      operationId: archiveProductDiscoveryArtificialLegacyEvidence
      responses:
        "200":
          description: Resultado auditável da limpeza lógica, sem exclusão do histórico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDiscoveryLegacyCleanup"
components:
  schemas:
    ProductDiscoveryPrivateValidationHandoff:
      type: object
      required:
        - cycleId
        - sourceReference
        - dossierReadyCount
        - status
        - nextActivity
        - message
      properties:
        cycleId: { type: integer, format: int64 }
        sourceReference:
          type: string
          pattern: "^product-discovery-cycle:[0-9]+$"
        dossierReadyCount: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [QUEUED_FOR_PRIVATE_VALIDATION]
        nextActivity:
          type: string
          enum: [ATENA_PRIVATE_PROTOTYPE_SELECTION]
        message: { type: string }
    ProductDiscoveryMetaAdEvidenceRequest:
      type: object
      required: [executionLeaseId, attemptNumber, query]
      properties:
        executionLeaseId: { type: string }
        attemptNumber: { type: integer, minimum: 1, maximum: 3 }
        query: { type: string, maxLength: 60 }
        country: { type: string, default: BR, pattern: "^[A-Za-z]{2}$" }
        publisherPlatform:
          { type: string, default: INSTAGRAM, enum: [INSTAGRAM] }
        limit: { type: integer, minimum: 1, maximum: 50, default: 25 }
    ProductDiscoveryMetaAdEvidenceList:
      type: object
      required:
        - query
        - country
        - publisherPlatform
        - sourceStatus
        - collectionMode
        - adsObserved
        - activeAds
        - advertisersObserved
        - interpretation
        - items
      properties:
        cycleId: { type: integer, format: int64, nullable: true }
        query: { type: string }
        country: { type: string }
        publisherPlatform: { type: string, enum: [INSTAGRAM] }
        sourceStatus:
          type: string
          enum:
            - OBSERVED
            - STALE
            - NO_ACTIVE_ADS
            - NOT_REQUESTED
            - NO_RELEVANT_PLATFORM_EVIDENCE
            - NO_MATCHING_ACTIVE_ADS
            - AWAITING_OFFICIAL_COLLECTION
            - AWAITING_PUBLIC_BROWSER
            - AWAITING_SUPERVISED_OBSERVATION
        collectionMode:
          {
            type: string,
            enum: [PERSISTED_ONLY, OFFICIAL_API, PUBLIC_BROWSER, SUPERVISED],
          }
        investigationId: { type: integer, format: int64, nullable: true }
        searchUrl: { type: string, format: uri, nullable: true }
        adsObserved: { type: integer, minimum: 0 }
        activeAds: { type: integer, minimum: 0 }
        advertisersObserved: { type: integer, minimum: 0 }
        latestObservationAt: { type: string, format: date-time, nullable: true }
        interpretation: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidence"
    ProductDiscoveryMetaAdBrowserCollectionRequest:
      type: object
      required:
        - executionLeaseId
        - attemptNumber
        - investigationId
        - collectorRunId
        - searchUrl
        - outcome
        - platformFilterConfirmed
        - startedAt
        - finishedAt
        - observations
      properties:
        executionLeaseId: { type: string, maxLength: 36 }
        attemptNumber: { type: integer, minimum: 1, maximum: 3 }
        investigationId: { type: integer, format: int64 }
        collectorRunId: { type: string, maxLength: 80 }
        searchUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://((www|business)\\.)?facebook\\.com/ads/library/.*$"
        outcome:
          type: string
          enum: [OBSERVED, EMPTY, FALLBACK_REQUIRED]
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        platformFilterConfirmed: { type: boolean }
        pageTitle: { type: string, maxLength: 255 }
        errorMessage: { type: string, maxLength: 1000 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        observations:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required:
              - metaAdId
              - advertiserName
              - active
              - publisherPlatforms
              - formatTypes
              - texts
              - snapshotUrl
              - pageActive
              - commercialSignal
              - rawPayload
            properties:
              metaAdId: { type: string, maxLength: 120 }
              advertiserName: { type: string, maxLength: 255 }
              active: { type: boolean }
              publisherPlatforms:
                type: array
                minItems: 1
                maxItems: 1
                items: { type: string, enum: [INSTAGRAM] }
              formatTypes:
                type: array
                maxItems: 3
                items: { type: string, maxLength: 80 }
              texts:
                type: array
                minItems: 1
                maxItems: 10
                items: { type: string, maxLength: 5000 }
              destinationUrl: { type: string, format: uri, maxLength: 2048 }
              snapshotUrl: { type: string, format: uri, maxLength: 2048 }
              pageActive: { type: boolean }
              commercialSignal: { type: boolean }
              rawPayload: { type: object }
    ProductDiscoverySupervisedMetaObservation:
      type: object
      required:
        [adReference, advertiserName, adLibraryUrl, adText, publisherPlatforms]
      properties:
        adReference: { type: string, maxLength: 120 }
        advertiserName: { type: string, maxLength: 255 }
        adLibraryUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https://((www|business)\\.)?facebook\\.com/ads/library/.*$"
        adText: { type: string, maxLength: 5000 }
        publisherPlatforms:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string, enum: [INSTAGRAM, FACEBOOK] }
        formatType: { type: string, maxLength: 80, nullable: true }
        mediaUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        destinationUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        pageActive: { type: boolean }
        commercialSignal: { type: boolean }
        observedAt:
          type: string
          format: date-time
          nullable: true
          description: Instante presente ou passado; quando omitido, o backend usa o recebimento.
    ProductDiscoverySupervisedMetaSession:
      type: object
      required:
        - cycleId
        - investigationId
        - cycleStatus
        - query
        - country
        - publisherPlatform
        - sourceStatus
        - collectionMode
        - collectionReason
        - searchUrl
        - adsObserved
        - activeAds
        - advertisersObserved
        - interpretation
        - canRegisterObservation
        - canResume
        - resumeReason
        - items
      properties:
        cycleId: { type: integer, format: int64 }
        investigationId: { type: integer, format: int64 }
        cycleStatus: { type: string }
        query: { type: string }
        country: { type: string }
        publisherPlatform: { type: string, enum: [INSTAGRAM] }
        sourceStatus:
          type: string
          enum:
            - OBSERVED
            - STALE
            - NO_ACTIVE_ADS
            - NO_RELEVANT_PLATFORM_EVIDENCE
            - AWAITING_SUPERVISED_OBSERVATION
        collectionMode: { type: string, enum: [SUPERVISED] }
        collectionReason: { type: string }
        searchUrl: { type: string, format: uri }
        nextObservationAt: { type: string, format: date-time, nullable: true }
        adsObserved: { type: integer, minimum: 0 }
        activeAds: { type: integer, minimum: 0 }
        advertisersObserved: { type: integer, minimum: 0 }
        latestObservationAt: { type: string, format: date-time, nullable: true }
        interpretation: { type: string }
        canRegisterObservation: { type: boolean }
        canResume: { type: boolean }
        resumeReason: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryMetaAdEvidence"
    ProductDiscoveryMetaAdEvidence:
      type: object
      properties:
        metaAdId: { type: string }
        advertiserName: { type: string, nullable: true }
        adTexts:
          type: array
          items: { type: string }
        publisherPlatforms:
          type: array
          items: { type: string }
        formatTypes:
          type: array
          items: { type: string }
        destinationUrl: { type: string, nullable: true }
        snapshotUrl: { type: string, nullable: true }
        active: { type: boolean }
        commercialSignal: { type: boolean }
        observations: { type: integer, minimum: 1 }
        longevityDays: { type: integer, minimum: 0 }
        sustainedInvestmentSignal: { type: boolean }
        evidenceConfidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
    ProductDiscoveryPendingExecution:
      type: object
      required:
        [
          cycleId,
          pipelineCode,
          stageCode,
          theme,
          country,
          language,
          researchMode,
          marketType,
          executionLeaseId,
          executionAttempt,
        ]
      properties:
        cycleId: { type: integer, format: int64 }
        pipelineCode: { type: string, enum: [productdiscovery.v1] }
        stageCode: { type: string, enum: [research] }
        executionLeaseId: { type: string, format: uuid }
        executionAttempt: { type: integer, minimum: 1 }
        theme: { type: string, maxLength: 191 }
        targetAudience: { type: string, maxLength: 191, nullable: true }
        country: { type: string }
        language: { type: string }
        acquisitionChannel: { type: string, nullable: true }
        commercialConstraints: { type: string, nullable: true }
        forbiddenCategories: { type: string, nullable: true }
        objective: { type: string, nullable: true }
        researchMode:
          { type: string, enum: [DISCOVER_MARKETS, VALIDATE_MARKET] }
        marketType: { type: string, enum: [B2C, B2B, UNSPECIFIED] }
        referenceSources:
          type: string
          nullable: true
          description: Uma URL editorial pública por linha.
    ProductDiscoveryResult:
      type: object
      required: [executionLeaseId, decisionSummary, opportunities]
      properties:
        executionLeaseId: { type: string, format: uuid }
        decisionSummary: { type: string }
        opportunities:
          type: array
          maxItems: 3
          description: No modo DISCOVER_MARKETS, são obrigatórias 2–3 candidatas factuais; sinais imaturos permanecem RESEARCH_MORE.
          items:
            $ref: "#/components/schemas/ProductDiscoveryOpportunityResult"
        evidenceReport:
          type: object
          nullable: true
          description: Cobertura funcional das fontes e gates, separada da auditoria técnica.
        analysisAudit:
          $ref: "#/components/schemas/ProductDiscoveryAnalysisAudit"
    ProductDiscoveryAnalysisAudit:
      type: object
      nullable: true
      required: [rawResponse, model, executionMode]
      properties:
        rawResponse: { type: string }
        model: { type: string, maxLength: 128 }
        executionMode: { type: string, enum: [MODEL, DETERMINISTIC] }
        promptSent: { type: string, nullable: true }
        agentPromptPart: { type: string, nullable: true }
        activityPromptPart: { type: string, nullable: true }
        reasoningEffort: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        accessedUrls:
          type: array
          maxItems: 50
          items:
            type: object
            required: [url]
            properties:
              url: { type: string, format: uri }
              label: { type: string, nullable: true }
              accessMethod: { type: string, nullable: true }
              accessedAt: { type: string, format: date-time, nullable: true }
    ProductDiscoveryOpportunityResult:
      type: object
      required: [name, primaryAudience, rootPain, score, maturity, decision]
      properties:
        name: { type: string, maxLength: 191 }
        primaryAudience: { type: string, maxLength: 191 }
        rootPain: { type: string }
        practicalPain: { type: string, nullable: true }
        emotionalPain: { type: string, nullable: true }
        scaleEvidence: { type: string, nullable: true }
        unmetnessEvidence: { type: string, nullable: true }
        pdeExperience: { type: string, nullable: true }
        firstCampaignAngle: { type: string, nullable: true }
        commercialRisk: { type: string, nullable: true }
        evidenceJson:
          type: string
          nullable: true
          description: Evidências exatas e rastreáveis; o payload bruto permanece na auditoria.
        score: { type: number }
        maturity:
          type: string
          enum: [SIGNAL, RESEARCHABLE, DOSSIER_READY, HUMAN_REVIEW, REJECTED]
        decision:
          type: string
          enum: [APPROVE, RESEARCH_MORE, HUMAN_REVIEW, REJECT]
    ProductDiscoveryLegacyCleanup:
      type: object
      properties:
        archivedCycles:
          type: integer
        archivedOpportunities:
          type: integer
        cycleIds:
          type: array
          items:
            type: integer
            format: int64
        reason:
          type: string
    ProductDiscoveryMaturityRanking:
      type: object
      properties:
        strategyName:
          type: string
        decisionCriterion:
          type: string
        recommendedPriority:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryMaturityItem"
        recommendedTracks:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscoveryResearchTrack"
    ProductDiscoveryMaturityItem:
      type: object
      properties:
        position:
          type: integer
        niche:
          type: string
        maturity:
          type: string
          example: Oportunidade promissora
        summary:
          type: string
        commercialReason:
          type: string
        recommendedAction:
          type: string
        evidence:
          type: array
          items:
            type: string
        guardrails:
          type: array
          items:
            type: string
    ProductDiscoveryResearchTrack:
      type: object
      properties:
        name:
          type: string
        focus:
          type: string
        reason:
          type: string
        theme:
          type: string
          maxLength: 191
        targetAudience:
          type: string
          maxLength: 191
        acquisitionChannel:
          type: string
        objective:
          type: string
        commercialConstraints:
          type: string
        forbiddenCategories:
          type: string
    CreateProductDiscoveryCycle:
      type: object
      required:
        - theme
      properties:
        theme:
          type: string
        targetAudience:
          type: string
        country:
          type: string
          example: BR
        language:
          type: string
          example: pt-BR
        acquisitionChannel:
          type: string
        researchMode:
          type: string
