openapi: 3.0.3
info:
  title: Fichas de execução dos produtos
  version: 1.0.0
  description: >-
    Contrato administrativo de uma cadeia comum com percursos por capacidade de entrega.
    Revisões e vínculos são imutáveis. Checkpoints financeiros não substituem autorizações
    comerciais. Toda resposta representa dados do produto informado, sem promover estimativas
    a vendas medidas. A ficha não migra referências que já possuem tarefas ou execução.
paths:
  /api/products/{productId}/execution-profiles/v1:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Lista revisões, composição congelada, decisões e consumo
      responses:
        '200':
          description: Histórico do produto, da revisão mais recente para a anterior
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Profile' }
    post:
      summary: Cria revisão sem alterar vínculos existentes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProfile' }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/products/{productId}/execution-profiles/v1/catalog:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Lista capacidades, cadeias comuns publicadas, planos do produto e checkpoints
      responses:
        '200':
          description: Catálogo sem seleção automática pelo mineral
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities: { $ref: '#/components/schemas/Options' }
                  chains: { $ref: '#/components/schemas/Options' }
                  commercialPlans: { $ref: '#/components/schemas/Options' }
                  checkpoints: { $ref: '#/components/schemas/Options' }
                  imageModel: { type: string }
  /api/products/{productId}/execution-profiles/v1/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ProfileId'
    get:
      summary: Consulta a revisão exata dentro do produto
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '404': { description: Ficha ausente ou de outro produto }
  /api/products/{productId}/execution-profiles/v1/{id}/bindings:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Fixa a revisão antes do início de uma nova execução
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceReference, actor]
              properties:
                sourceReference: { type: string, example: 'experiment:123' }
                learningCycleId: { type: integer, format: int64, nullable: true }
                actor: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/products/{productId}/execution-profiles/v1/{id}/financial-analysis:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Solicita ou reutiliza análise de Plutus para a revisão
      description: >-
        A primeira solicitação usa o contrato existente de projeção financeira e pode gerar
        custo de IA. Solicitações posteriores reutilizam o parecer; falha com a mesma entrada
        exige correção e nova revisão. Uma análise concluída não aprova checkpoints automaticamente.
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/products/{productId}/execution-profiles/v1/{id}/financial-reviews:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Registra decisão humana contextual após leitura de Plutus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoint, financialExecutionId, approved, reviewedBy, rationale]
              properties:
                checkpoint: { type: string, enum: [OFFER, DELIVERY_DESIGN, HOMOLOGATION, OPERATION] }
                financialExecutionId: { type: integer, format: int64 }
                approved: { type: boolean }
                reviewedBy: { type: string }
                rationale: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/products/{productId}/execution-profiles/v1/{id}/consumption-reconciliations:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ProfileId'
    post:
      summary: Concilia custo pendente com comprovante oficial identificado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumptionId, actualBrl, providerReceipt, reviewedBy, rationale]
              properties:
                consumptionId: { type: integer, format: int64 }
                actualBrl: { type: number, minimum: 0 }
                providerReceipt: { type: string, description: 'Link https:// ou internal:// do comprovante; não usar estimativa.' }
                reviewedBy: { type: string }
                rationale: { type: string, description: Conferência do valor e câmbio aplicado }
                failed: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Profile' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    ProductId: { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    ProfileId: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
  responses:
    Profile:
      description: Ficha com histórico e pendências calculadas pelo backend
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Profile' }
    Invalid:
      description: Campo ou custo obrigatório ausente ou inválido
    Conflict:
      description: Identidade, versão, evidência, composição, margem ou autorização incompatível
  schemas:
    Options:
      type: array
      items:
        type: object
        properties:
          code: { type: string }
          name: { type: string }
    SaveProfile:
      type: object
      required: [chainId, commercialPlanId, createdBy, contract]
      properties:
        chainId: { type: integer, format: int64 }
        commercialPlanId: { type: integer, format: int64 }
        createdBy: { type: string, maxLength: 100 }
        contract: { $ref: '#/components/schemas/Contract' }
    Contract:
      type: object
      required: [productVersion, capability, purchasedOutcome, inputs, deliverables, qualityCriteria, deliveryMode, revenueModel, includedUnits, maximumAttempts, costModel, pricingRevision, usdBrl, maximumAttemptCostBrl, maximumDeliveryCostBrl, minimumContributionBrl, productionBudget, scenarios]
      properties:
        productVersion: { type: string }
        capability: { type: string, enum: [PERSONALIZED_IMAGES, GUIDED_EXPERIENCE, AI_TOOL, DIGITAL_PACKAGE] }
        purchasedOutcome: { type: string }
        inputs: { type: array, minItems: 1, items: { type: string } }
        deliverables: { type: array, minItems: 1, items: { type: string } }
        qualityCriteria: { type: array, minItems: 1, items: { type: string } }
        deliveryMode: { type: string }
        revenueModel: { type: string }
        audiovisualRequired: { type: boolean }
        includedUnits: { type: integer, minimum: 1, maximum: 1000 }
        maximumAttempts: { type: integer, minimum: 1, maximum: 5000 }
        costModel: { type: string, description: 'Modelo por entrega; NO_VARIABLE_AI_COST exige os dois custos de IA iguais a zero e impede chamadas pagas de entrega.' }
        pricingRevision: { type: string, description: Fonte e revisão de tarifa verificadas na análise }
        usdBrl: { type: number, minimum: 0.000001 }
        maximumAttemptCostBrl: { type: number, minimum: 0 }
        maximumDeliveryCostBrl: { type: number, minimum: 0 }
        minimumContributionBrl: { type: number, minimum: 0.01 }
        productionBudget:
          type: object
          description: Orçamento privado de produção e teste por execução; independente da entrega vendida. Três limites zero desabilitam consumo privado.
          required: [costModel, maximumAttempts, maximumAttemptCostBrl, maximumTotalCostBrl]
          properties:
            costModel: { type: string }
            maximumAttempts: { type: integer, minimum: 0, maximum: 5000 }
            maximumAttemptCostBrl: { type: number, minimum: 0 }
            maximumTotalCostBrl: { type: number, minimum: 0 }
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [code, priceBrl, acquisitionBrl, feesBrl, supportBrl, storageDeliveryBrl, otherCostsBrl]
            properties:
              code: { type: string, enum: [FAVORABLE, BASE, CONSERVATIVE] }
              priceBrl: { type: number, minimum: 0.01 }
              acquisitionBrl: { type: number, minimum: 0 }
              feesBrl: { type: number, minimum: 0 }
              supportBrl: { type: number, minimum: 0 }
              storageDeliveryBrl: { type: number, minimum: 0 }
              otherCostsBrl: { type: number, minimum: 0 }
    Profile:
      allOf:
        - $ref: '#/components/schemas/SaveProfile'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            productId: { type: integer, format: int64 }
            revision: { type: integer }
            commercialPlanVersion: { type: integer }
            productType: { type: string, nullable: true }
            productFormat: { type: string, nullable: true }
            routeName: { type: string }
            work: { type: array, items: { type: object, description: 'processCode, activityId, name, owner, requirements, applicable, applicabilityReason' } }
            processes: { type: array, items: { type: object, description: 'id, code, version, name, parentCode' } }
            economics: { type: array, items: { type: object, description: 'code, revenueBrl, fullCostBrl, contributionBrl, viable — projeções' } }
            blockers: { type: array, items: { type: string } }
            reviews: { type: array, items: { type: object, description: 'checkpoint, financialExecutionId, executionStatus, approved, decision, reviewedBy, rationale, createdAt' } }
            bindings: { type: array, items: { type: object, description: 'id, sourceReference, learningCycleId, createdBy' } }
            consumption: { type: array, items: { type: object, description: 'id, bindingId, operationKey, usageKey, units reservadas, reservedBrl, actualBrl nullable, status, evidence, testData, createdAt' } }
            createdAt: { type: string, format: date-time }
