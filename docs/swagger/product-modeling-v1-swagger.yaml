openapi: 3.0.3
info:
  title: Modelagem por referências internacionais
  version: 1.0.0
  description: Preparação internacional para o Brasil integrada à descoberta e à cadeia existentes. Leituras e preparo não iniciam inferência.
paths:
  /api/product-modeling/v1:
    get:
      summary: Lista as 50 preparações recentes e seu estado persistido
      responses:
        '200':
          description: Preparações, passagens, fontes e navegação canônica
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelingView' }
    post:
      summary: Prepara pesquisa internacional sem enfileirar tarefa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareModeling' }
      responses:
        '200':
          description: Rascunho salvo ou replay idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelingView' }
        '400': { description: Campos obrigatórios ou limites inválidos }
        '409': { description: Chave reutilizada com outra intenção ou referência insegura }
  /api/product-modeling/v1/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      summary: Consulta uma preparação sem iniciar trabalho
      responses:
        '200':
          description: Preparação consultada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelingView' }
        '409': { description: Preparação inexistente }
  /api/product-modeling/v1/{id}/start:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Libera Argos uma vez pela fila canônica; respeita STOP
      description: Exige comando explícito. Não transfere orçamento, autoriza mídia ou muda o produto. Pode consumir IA dentro das autorizações aplicáveis.
      responses:
        '200':
          description: Pesquisa iniciada ou estado existente preservado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelingView' }
        '409': { description: STOP ou preparação inexistente }
  /api/product-modeling/v1/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Retoma pesquisa interrompida antes da análise com recuperação comprovada
      description: Exige comando explícito. Aceita recusa 401 sem plano ou uso informado e reconexão posterior autenticada do mesmo Argos, ou recusa contratual da coleta Meta anterior à síntese com reutilização do plano original. Preserva limites, resposta, modelo, custo e histórico; não renova campanha. Repetição concorrente não duplica trabalho.
      responses:
        '200':
          description: Mesma pesquisa na fila ou em andamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelingView' }
        '409': { description: STOP, autenticação não corrigida, outra falha, análise já produzida ou tarefa ativa }
  /api/product-modeling/v1/{id}/adopt:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      summary: Congela fontes em um ciclo próprio ainda não executado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleId]
              properties:
                cycleId: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Vínculo idempotente sem executar processo ou transferir autorizações
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelingView' }
        '409': { description: Outra identidade, pesquisa incompleta, ciclo iniciado ou Big Idea alterada }
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  schemas:
    PrepareModeling:
      type: object
      required: [requestKey, desiredOutcome, referenceUrls]
      properties:
        requestKey: { type: string, format: uuid }
        productId: { type: integer, format: int64, minimum: 1, nullable: true }
        newProductName: { type: string, maxLength: 191, nullable: true, description: Obrigatório quando productId estiver ausente }
        desiredOutcome: { type: string, minLength: 1, maxLength: 2000 }
        referenceUrls:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uri, maxLength: 1000 }
          description: HTTPS público, sem parâmetros, fragmento, credenciais, IP ou porta. Coleta conserva proteção SSRF.
    ModelingView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64, nullable: true }
        productName: { type: string }
        desiredOutcome: { type: string }
        referenceUrls: { type: array, items: { type: string, format: uri } }
        researchScope: { type: string, enum: [MARKET_REFERENCES_V1, INTERNATIONAL_TO_BR_V1] }
        targetMarket: { type: string, example: Brasil }
        bigIdeaSnapshot: { type: object, nullable: true }
        discoveryCycleId: { type: integer, format: int64 }
        status: { type: string, description: Estado oficial da pesquisa, não da venda ou da cadeia inteira }
        guidance: { type: string }
        researchRecovery:
          type: object
          required: [available, reason]
          properties:
            available: { type: boolean }
            reason: { type: string }
            reconnectionId: { type: integer, format: int64, nullable: true }
        researchUrl: { type: string }
        productUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        learningCycleId: { type: integer, format: int64, nullable: true }
        chainUrl: { type: string, nullable: true }
        stages: { type: array, items: { type: object }, description: Tarefas vigentes por responsável e atividade, com resultado e link }
        availableCycles: { type: array, items: { type: object }, description: Ciclos do produto ainda sem tarefas nem execução }
        internationalAssessment:
          type: object
          nullable: true
          description: Parecer aprovado de Atena; referências com sinal, autoria, trecho preservado e limitação, mais adaptação brasileira. Não é prova de vendas.
          properties:
            references: { type: array, items: { type: object } }
            brazilAdaptation: { type: object, additionalProperties: { type: string } }
