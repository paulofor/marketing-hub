openapi: 3.0.3
info:
  title: Marketing Hub - Products
  version: 1.0.0
  description: Endpoints públicos e administrativos do cadastro comercial de produtos.
paths:
  /api/products/value-chain-positions:
    get:
      tags:
        - Products
      summary: Lista processo, subprocesso atual e próximo objetivo de cada produto.
      operationId: listProductValueChainPositions
      responses:
        "200":
          description: Posições resolvidas pelo backend a partir da cadeia e do histórico publicados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductValueChainPosition"
  /api/products:
    get:
      tags:
        - Products
      summary: Lista ou pesquisa produtos por suas identidades comercial e interna.
      operationId: listProducts
      parameters:
        - name: query
          in: query
          required: false
          description: Nome comercial, nome interno, apelido ou slug do produto.
          schema:
            type: string
            maxLength: 191
          example: MUSA v7
      responses:
        "200":
          description: Produtos encontrados no catálogo administrativo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags:
        - Products
      summary: Cadastra um produto preservando identidade interna e nome comercial.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpsertRequest"
      responses:
        "200":
          description: Produto cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Nome ou apelido já identifica outro produto.
  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Retorna o cadastro administrativo de um produto.
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Produto não encontrado.
    put:
      tags:
        - Products
      summary: Atualiza os dados e as identidades internas do produto.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpsertRequest"
      responses:
        "200":
          description: Produto atualizado sem alterar sua identidade canônica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Nome ou apelido já identifica outro produto.
  /api/products/{id}/internal-name:
    patch:
      tags:
        - Products
      summary: Atualiza somente o nome interno sem regravar o contrato comercial.
      operationId: updateProductInternalName
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInternalNameRequest"
      responses:
        "200":
          description: Nome interno atualizado sem alterar os demais campos do produto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: O nome interno já identifica outro produto.
  /api/product-types:
    get:
      tags:
        - Product Types
      summary: Lista ou pesquisa tipos por nome, codinome, código ou apelido.
      operationId: listProductTypes
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: includeRetired
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Tipos encontrados no catálogo administrativo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductTypeDefinition"
    post:
      tags:
        - Product Types
      summary: Cadastra um tipo extensível com codinome mineral próprio.
      operationId: createProductType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductTypeRequest"
      responses:
        "200":
          description: Tipo cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTypeDefinition"
        "400":
          description: Nome, codinome ou fronteira de uso inválidos.
        "409":
          description: Uma identidade já pertence a outro tipo.
  /api/product-types/{id}:
    get:
      tags:
        - Product Types
      summary: Retorna uma definição do catálogo de tipos.
      operationId: getProductType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Tipo encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTypeDefinition"
        "404":
          description: Tipo não encontrado.
    put:
      tags:
        - Product Types
      summary: Atualiza a definição e sua identidade interna governada.
      operationId: updateProductType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductTypeRequest"
      responses:
        "200":
          description: Tipo atualizado e vínculos preservados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTypeDefinition"
        "400":
          description: Nome, codinome ou fronteira de uso inválidos.
        "404":
          description: Tipo não encontrado.
        "409":
          description: Identidade ambígua ou código em uso alterado.
  /api/products/{id}/financial-summary:
    get:
      tags:
        - Products
      summary: Retorna custos, receitas e lucro do produto em visão mensal e anual.
      operationId: getProductFinancialSummary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Resumo financeiro do produto com valores em BRL e USD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFinancialSummary"
        "404":
          description: Produto não encontrado.
  /api/products/{id}/organic-video-plan:
    get:
      tags:
        - Products
      summary: Retorna o playbook de vídeos orgânicos recomendado para o produto.
      operationId: getProductOrganicVideoPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Plano de 9 vídeos em 7 dias com mix editorial, métricas e regras de decisão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOrganicVideoPlan"
        "404":
          description: Produto não encontrado.
  /api/products/{id}/pde-videos:
    get:
      tags:
        - Products
      summary: Lista vídeos HLS resolvidos para cada versão produtiva PDE do produto.
      operationId: listProductPdeVersionVideos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 4
      responses:
        "200":
          description: Painel de vídeos por versão PDE, já resolvido pelo backend.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PdeProductionSlotVideoPanel"
        "404":
          description: Produto não encontrado.
  /api/products/{id}/pde-production-slots:
    get:
      tags:
        - Products
      summary: Lista slots produtivos PDE do produto.
      operationId: listProductPdeProductionSlots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Slots produtivos PDE cadastrados para testes paralelos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostDeployPdeProductionSlot"
    post:
      tags:
        - Products
      summary: Cria ou atualiza um slot produtivo PDE e seu rascunho de contrato.
      operationId: saveProductPdeProductionSlot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePdeProductionSlotRequest"
      responses:
        "200":
          description: Slot PDE salvo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDeployPdeProductionSlot"
  /api/products/{id}/pde-production-slots/{slotCode}/publish:
    post:
      tags:
        - Products
      summary: Publica o contrato comercial independente de um slot PDE.
      operationId: publishProductPdeProductionSlotContract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: slotCode
          in: path
          required: true
          schema:
            type: string
          example: v6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPdeProductionSlotContractRequest"
      responses:
        "200":
          description: Contrato do slot publicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDeployPdeProductionSlot"
  /api/products/{id}/pde-production-slots/{slotCode}/validate:
    post:
      tags:
        - Products
      summary: Valida entrega pública real de um slot PDE.
      operationId: validateProductPdeProductionSlot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: slotCode
          in: path
          required: true
          schema:
            type: string
          example: v6
      responses:
        "200":
          description: Resultado da validação operacional do slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDeployPdeProductionSlot"
  /api/products/{id}/scientific-articles:
    get:
      tags:
        - Products
      summary: Lista artigos científicos usados para sustentar o mecanismo do produto.
      operationId: listProductScientificArticles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Lista de artigos científicos cadastrados para o produto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductScientificArticle"
        "404":
          description: Produto não encontrado.
    post:
      tags:
        - Products
      summary: Cadastra artigo científico usado na definição do mecanismo do produto.
      operationId: createProductScientificArticle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductScientificArticleRequest"
      responses:
        "200":
          description: Artigo científico cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductScientificArticle"
        "400":
          description: Campos obrigatórios ausentes ou inválidos.
        "404":
          description: Produto não encontrado.
  /api/products/{id}/scientific-articles/{articleId}:
    put:
      tags:
        - Products
      summary: Atualiza artigo científico usado na definição do mecanismo do produto.
      operationId: updateProductScientificArticle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductScientificArticleRequest"
      responses:
        "200":
          description: Artigo científico atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductScientificArticle"
        "400":
          description: Campos obrigatórios ausentes ou inválidos.
        "404":
          description: Produto ou artigo não encontrado.
    delete:
      tags:
        - Products
      summary: Remove artigo científico do cadastro de mecanismo do produto.
      operationId: deleteProductScientificArticle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Artigo científico removido.
        "404":
          description: Produto ou artigo não encontrado.
  /api/products/{id}/video-seed-image:
    patch:
      tags:
        - Products
      summary: Aprova, reprova ou deixa pendente a imagem semente usada na produção de vídeos do produto.
      operationId: updateProductVideoSeedImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductVideoSeedImageRequest"
      responses:
        "200":
          description: Produto atualizado com a revisão da imagem semente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Asset ausente, asset que não é imagem ou imagem ainda não pronta.
        "404":
          description: Produto ou asset não encontrado.
  /api/products/{id}/pde-persuasive-journey/default:
    post:
      tags:
        - Products
      summary: Insere a jornada persuasiva interativa padrão no contrato PDE do produto.
      operationId: applyDefaultPdePersuasiveJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Produto atualizado com persuasiveJourney no campo pdeExperienceJson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Produto não encontrado.
  /api/products/public/{productCode}/marketing-definition.md:
    get:
      tags:
        - Products
      summary: Baixa a definição pública de mercado em Markdown bruto.
      operationId: getPublicProductMarketingDefinitionMarkdown
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
          example: metodo-musa-7-dias
      responses:
        "200":
          description: Documento Markdown bruto com a definição comercial pública, incluindo identidade visual, logo, base científica e posicionamento de uso de IA quando cadastrados.
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Produto não encontrado.
  /api/products/public/{productCode}/pde-persuasive-journey:
    get:
      tags:
        - Products
      summary: Retorna a jornada persuasiva interativa cadastrada no contrato PDE do produto.
      operationId: getPublicPdePersuasiveJourney
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
          example: metodo-musa-7-dias
      responses:
        "200":
          description: Jornada persuasiva versionada usada para interpretar o questionário do PDE no funil comercial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdePersuasiveJourney"
        "404":
          description: Produto não encontrado ou jornada persuasiva não cadastrada.
  /api/products/public/{productCode}/marketing-definition:
    get:
      tags:
        - Products
      summary: Visualiza a definição pública de mercado com Markdown renderizado.
      operationId: getPublicProductMarketingDefinitionHtml
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
          example: metodo-musa-7-dias
      responses:
        "200":
          description: Página HTML com as mesmas informações do Markdown público renderizadas para leitura, incluindo identidade visual, logo, base científica e posicionamento de uso de IA quando cadastrados.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Produto não encontrado.
components:
  schemas:
    ProductValueChainPosition:
      type: object
      required:
        - productId
        - resolutionStatus
        - resolutionMessage
      properties:
        productId:
          type: integer
          format: int64
        commercialStatus:
          type: string
          nullable: true
        resolutionStatus:
          type: string
          enum:
            - IDENTIFIED
            - NOT_IDENTIFIED
            - CHAIN_UNAVAILABLE
        resolutionMessage:
          type: string
        processDefinitionId:
          type: integer
          format: int64
          nullable: true
        processName:
          type: string
          nullable: true
        sequenceNumber:
          type: integer
          nullable: true
        processCount:
          type: integer
          nullable: true
        subprocessPosition:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ProductSubprocessPosition"
    ProductSubprocessPosition:
      type: object
      required:
        - trackingStatus
        - subprocessCount
      properties:
        trackingStatus:
          type: string
          enum:
            - NOT_APPLICABLE
            - PLANNED
            - IN_PROGRESS
            - RECORDED
        subprocessCount:
          type: integer
          minimum: 0
        currentActivityName:
          type: string
          nullable: true
        currentSubprocessDefinitionId:
          type: integer
          format: int64
          nullable: true
        currentSubprocessCode:
          type: string
          nullable: true
        currentSubprocessName:
          type: string
          nullable: true
        currentSubprocessObjective:
          type: string
          nullable: true
        nextSubprocessDefinitionId:
          type: integer
          format: int64
          nullable: true
        nextSubprocessCode:
          type: string
          nullable: true
        nextSubprocessName:
          type: string
          nullable: true
        nextSubprocessObjective:
          type: string
          nullable: true
    ProductTypeDefinition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 191
        internalName:
          type: string
          maxLength: 191
          description: Codinome mineral estável usado somente na operação interna.
        description:
          type: string
          maxLength: 1000
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 191
        status:
          type: string
          enum:
            - PROPOSED
            - ACTIVE
            - RETIRED
        productCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SaveProductTypeRequest:
      type: object
      required:
        - name
        - internalName
        - aliases
        - status
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 191
        internalName:
          type: string
          minLength: 1
          maxLength: 191
          description: Codinome mineral único e estável.
        description:
          type: string
          maxLength: 1000
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 191
        status:
          type: string
          enum:
            - PROPOSED
            - ACTIVE
            - RETIRED
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
          description: Nome comercial usado nas superfícies públicas.
        internalName:
          type: string
          description: Nome de trabalho usado somente dentro do Marketing Hub.
        aliases:
          type: array
          description: Apelidos internos alternativos ou históricos.
          maxItems: 20
          items:
            type: string
            maxLength: 191
        productType:
          type: string
          description: Nome canônico sincronizado para clientes legados.
        productTypeId:
          type: integer
          format: int64
          description: Identidade estável do tipo no catálogo extensível.
        productTypeCode:
          type: string
          maxLength: 64
        productTypeInternalName:
          type: string
          maxLength: 191
          description: Codinome mineral interno do tipo de produto.
        productTypeStatus:
          type: string
          enum:
            - PROPOSED
            - ACTIVE
            - RETIRED
        pdeExperienceJson:
          type: string
        videoSeedImageAssetId:
          type: integer
          format: int64
        videoSeedCharacterName:
          type: string
          example: Sofia MUSA
        videoSeedReviewStatus:
          $ref: "#/components/schemas/ProductVideoSeedImageReviewStatus"
        videoSeedReviewNotes:
          type: string
        videoSeedReviewedBy:
          type: string
        videoSeedReviewedAt:
          type: string
          format: date-time
    ProductUpsertRequest:
      type: object
      additionalProperties: true
      properties:
        slug:
          type: string
          maxLength: 191
        name:
          type: string
          maxLength: 191
          description: Nome comercial visível ao cliente.
        internalName:
          type: string
          maxLength: 191
          description: Nome interno estável; quando omitido na criação, deriva do nome comercial.
        aliases:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 191
          description: Apelidos internos, únicos no catálogo e nunca publicados automaticamente.
        productTypeId:
          type: integer
          format: int64
          description: Tipo ativo selecionado no catálogo canônico.
        productType:
          type: string
          maxLength: 191
          deprecated: true
          description: Identidade legada resolvida por nome, código ou apelido cadastrado.
    UpdateProductInternalNameRequest:
      type: object
      required:
        - internalName
      additionalProperties: false
      properties:
        internalName:
          type: string
          minLength: 1
          maxLength: 191
          description: Codinome interno estável e não publicado ao cliente.
    ProductScientificArticle:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        link:
          type: string
          example: https://doi.org/10.1016/j.jesp.2012.02.008
        originalTitle:
          type: string
          example: Enclothed cognition
        portugueseTitle:
          type: string
          example: Cognição vestida
        summary:
          type: string
        mechanismApplication:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SaveProductScientificArticleRequest:
      type: object
      required:
        - link
        - originalTitle
        - portugueseTitle
        - summary
        - mechanismApplication
      properties:
        link:
          type: string
          maxLength: 1024
        originalTitle:
          type: string
          maxLength: 512
        portugueseTitle:
          type: string
          maxLength: 512
        summary:
          type: string
        mechanismApplication:
          type: string
    ProductFinancialSummary:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        productSlug:
          type: string
        exchangeRateBrlPerUsd:
          type: number
          format: decimal
          example: 5.00
        monthStart:
          type: string
          format: date-time
        yearStart:
          type: string
          format: date-time
        monthlyResults:
          type: array
          description: Mês corrente e três meses anteriores com custo, receita e lucro consolidados.
          items:
            $ref: "#/components/schemas/ProductFinancialMonthlyResult"
        costs:
          type: array
