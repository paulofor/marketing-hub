openapi: 3.0.3
info:
  title: Marketing Hub - Products
  version: 1.0.0
  description: Endpoints públicos e administrativos do cadastro comercial de produtos.
paths:
  /api/products/{id}/financial-summary:
    get:
      tags:
        - Products
      summary: Retorna custos, receitas e lucro do produto em visão mensal e anual.
      operationId: getProductFinancialSummary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Resumo financeiro do produto com valores em BRL e USD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFinancialSummary"
        "404":
          description: Produto não encontrado.
  /api/products/{id}/organic-video-plan:
    get:
      tags:
        - Products
      summary: Retorna o playbook de vídeos orgânicos recomendado para o produto.
      operationId: getProductOrganicVideoPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Plano de 9 vídeos em 7 dias com mix editorial, métricas e regras de decisão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOrganicVideoPlan"
        "404":
          description: Produto não encontrado.
  /api/products/{id}/video-seed-image:
    patch:
      tags:
        - Products
      summary: Aprova, reprova ou deixa pendente a imagem semente usada na produção de vídeos do produto.
      operationId: updateProductVideoSeedImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductVideoSeedImageRequest"
      responses:
        "200":
          description: Produto atualizado com a revisão da imagem semente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Asset ausente, asset que não é imagem ou imagem ainda não pronta.
        "404":
          description: Produto ou asset não encontrado.
  /api/products/{id}/pde-persuasive-journey/default:
    post:
      tags:
        - Products
      summary: Insere a jornada persuasiva interativa padrão no contrato PDE do produto.
      operationId: applyDefaultPdePersuasiveJourney
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Produto atualizado com persuasiveJourney no campo pdeExperienceJson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Produto não encontrado.
  /api/products/public/{productCode}/marketing-definition.md:
    get:
      tags:
        - Products
      summary: Baixa a definição pública de mercado em Markdown bruto.
      operationId: getPublicProductMarketingDefinitionMarkdown
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
          example: metodo-musa-7-dias
      responses:
        "200":
          description: Documento Markdown bruto com a definição comercial pública, incluindo identidade visual, logo, base científica e posicionamento de uso de IA quando cadastrados.
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Produto não encontrado.
  /api/products/public/{productCode}/pde-persuasive-journey:
    get:
      tags:
        - Products
      summary: Retorna a jornada persuasiva interativa cadastrada no contrato PDE do produto.
      operationId: getPublicPdePersuasiveJourney
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
          example: metodo-musa-7-dias
      responses:
        "200":
          description: Jornada persuasiva versionada usada para interpretar o questionário do PDE no funil comercial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdePersuasiveJourney"
        "404":
          description: Produto não encontrado ou jornada persuasiva não cadastrada.
  /api/products/public/{productCode}/marketing-definition:
    get:
      tags:
        - Products
      summary: Visualiza a definição pública de mercado com Markdown renderizado.
      operationId: getPublicProductMarketingDefinitionHtml
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
          example: metodo-musa-7-dias
      responses:
        "200":
          description: Página HTML com as mesmas informações do Markdown público renderizadas para leitura, incluindo identidade visual, logo, base científica e posicionamento de uso de IA quando cadastrados.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Produto não encontrado.
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        pdeExperienceJson:
          type: string
        videoSeedImageAssetId:
          type: integer
          format: int64
        videoSeedCharacterName:
          type: string
          example: Sofia MUSA
        videoSeedReviewStatus:
          $ref: "#/components/schemas/ProductVideoSeedImageReviewStatus"
        videoSeedReviewNotes:
          type: string
        videoSeedReviewedBy:
          type: string
        videoSeedReviewedAt:
          type: string
          format: date-time
    ProductFinancialSummary:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        productSlug:
          type: string
        exchangeRateBrlPerUsd:
          type: number
          format: decimal
          example: 5.00
        monthStart:
          type: string
          format: date-time
        yearStart:
          type: string
          format: date-time
        monthlyResults:
          type: array
          description: Mês corrente e três meses anteriores com custo, receita e lucro consolidados.
          items:
            $ref: "#/components/schemas/ProductFinancialMonthlyResult"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/ProductFinancialLine"
        revenue:
          $ref: "#/components/schemas/ProductFinancialLine"
        profit:
          $ref: "#/components/schemas/ProductFinancialLine"
    ProductFinancialMonthlyResult:
      type: object
      properties:
        monthStart:
          type: string
          format: date-time
        monthLabel:
          type: string
          example: Julho 2026
        cost:
          $ref: "#/components/schemas/ProductFinancialAmount"
        revenue:
          $ref: "#/components/schemas/ProductFinancialAmount"
        profit:
          $ref: "#/components/schemas/ProductFinancialAmount"
    ProductFinancialLine:
      type: object
      properties:
        type:
          type: string
          example: MEDIA
        label:
          type: string
          example: Mídia paga
        monthly:
          $ref: "#/components/schemas/ProductFinancialAmount"
        annual:
          $ref: "#/components/schemas/ProductFinancialAmount"
        source:
          type: string
    ProductFinancialAmount:
      type: object
      properties:
        brl:
          type: number
          format: decimal
          example: 250.00
        usd:
          type: number
          format: decimal
          example: 50.00
    ProductOrganicVideoPlan:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
          example: Método MUSA
        productSlug:
          type: string
          example: metodo-musa-7-dias
        strategyName:
          type: string
          example: 9 vídeos em 7 dias
        objective:
          type: string
        publishingWindow:
          type: string
        channelPriority:
          type: string
        mixRationale:
          type: string
        videos:
          type: array
          items:
            $ref: "#/components/schemas/ProductOrganicVideoPlanItem"
        decisionRules:
          type: array
          items:
            $ref: "#/components/schemas/ProductOrganicVideoDecisionRule"
        operatingPrinciples:
          type: array
          items:
            type: string
    ProductOrganicVideoPlanItem:
      type: object
      properties:
        day:
          type: integer
          example: 1
        sequence:
          type: integer
          example: 1
        category:
          type: string
          example: ENTRETENIMENTO_DOR
        funnelStage:
          type: string
          example: Desconhecido -> relevante
        mentalShift:
          type: string
          example: Isso acontece comigo.
        platformPriority:
          type: string
          example: TikTok + Reels
        hook:
          type: string
        scene:
          type: string
        message:
          type: string
        callToAction:
          type: string
        primaryMetric:
          type: string
        productionNotes:
          type: array
          items:
            type: string
    ProductOrganicVideoDecisionRule:
      type: object
      properties:
        signal:
          type: string
          example: Dor cotidiana
        condition:
          type: string
        decision:
          type: string
        commercialReason:
          type: string
    UpdateProductVideoSeedImageRequest:
      type: object
      required:
        - assetId
      properties:
        assetId:
          type: integer
          format: int64
          example: 99
        characterName:
          type: string
          example: Sofia MUSA
        reviewStatus:
          $ref: "#/components/schemas/ProductVideoSeedImageReviewStatus"
        reviewNotes:
          type: string
          example: Aprovada como imagem-mestre da Consultora MUSA.
        reviewedBy:
          type: string
          example: marketing@hub.local
    ProductVideoSeedImageReviewStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    PdePersuasiveJourney:
      type: object
      properties:
        version:
          type: string
          example: commercial-stages-v1
        framework:
          type: string
          example: Funil experiencial PDE
        psychologicalModel:
          type: string
          example: AIDA como apoio, não como eixo principal de leitura
        name:
          type: string
          example: Jornada Persuasiva Interativa do PDE
        objective:
          type: string
        productSlug:
          type: string
          example: metodo-musa-7-dias
        commercialPromise:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PdePersuasiveJourneyStep"
    PdePersuasiveJourneyStep:
      type: object
      properties:
        stageNumber:
          type: integer
          example: 2
        stage:
          type: string
          example: diagnostic_value
        stageName:
          type: string
          example: Envolvimento diagnóstico
        aidaLabel:
          type: string
          example: Interesse
          deprecated: true
        psychologicalRole:
          type: string
          example: Interesse + Desejo
        trackedSectionId:
          type: string
          example: interactive_diagnostic
          deprecated: true
        trackedSectionIds:
          type: array
          items:
            type: string
          example:
            - interactive_diagnostic
            - free_diagnostic_preview
        eventNames:
          type: array
          items:
            type: string
          example:
            - DIAGNOSTIC_CHOICE_SELECTED
            - SECTION_VIEW
        commercialFunction:
          type: string
        userShift:
          type: string
        primaryMetric:
          type: string
        optimizationRule:
          type: string
