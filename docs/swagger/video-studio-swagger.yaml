openapi: 3.0.3
info:
  title: Video Studio API
  version: 1.2.0
  description: Contratos administrativos para criação e edição de projetos de vídeo do Marketing Hub.
servers:
  - url: http://191.252.181.168:8000
    description: Backend operacional
tags:
  - name: VideoStudio
    description: Briefings persistidos para vídeos de produtos, campanhas, PDEs e orgânicos.
  - name: ResearchIntelligence
    description: Catálogo global de cartões e roteamento contextual para os agentes do harness.
paths:
  /api/research-intelligence/v1/catalog:
    get:
      tags: [ResearchIntelligence]
      summary: Consulta a Biblioteca de Inteligência global do Marketing Hub.
      description: O catálogo é independente de projeto; cada projeto e job recebe somente sua seleção contextual.
      responses:
        "200":
          description: Cartões compilados e políticas de roteamento vigentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchIntelligenceCatalog"
  /api/sales-videos/projects:
    get:
      tags: [VideoStudio]
      summary: Lista projetos editáveis de vídeo do tenant.
      responses:
        "200":
          description: Projetos encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoProjectDto"
    post:
      tags: [VideoStudio]
      summary: Cria projeto editável de vídeo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoProjectRequest"
      responses:
        "201":
          description: Projeto criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProjectDto"
  /api/sales-videos/projects/{projectId}:
    get:
      tags: [VideoStudio]
      summary: Consulta projeto editável de vídeo.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Projeto encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProjectDto"
    patch:
      tags: [VideoStudio]
      summary: Atualiza projeto editável de vídeo.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoProjectRequest"
      responses:
        "200":
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProjectDto"
  /api/sales-videos/reference-videos:
    get:
      tags: [VideoStudio]
      summary: Lista vídeos externos enviados para análise comercial.
      responses:
        "200":
          description: Vídeos de referência encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoReferenceDto"
    post:
      tags: [VideoStudio]
      summary: Cadastra vídeo externo na fila de análise do estúdio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoReferenceRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadVideoReferenceRequest"
      responses:
        "201":
          description: Vídeo enviado para análise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceDto"
  /api/sales-videos/reference-videos/{referenceId}:
    get:
      tags: [VideoStudio]
      summary: Consulta vídeo externo enviado para análise comercial.
      parameters:
        - $ref: "#/components/parameters/ReferenceId"
      responses:
        "200":
          description: Vídeo de referência encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceDto"
  /api/sales-videos/reference-videos/{referenceId}/analysis:
    patch:
      tags: [VideoStudio]
      summary: Registra contingência manual somente após falha da análise automática.
      parameters:
        - $ref: "#/components/parameters/ReferenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeVideoReferenceRequest"
      responses:
        "200":
          description: Análise registrada e vídeo liberado como aprendizado comercial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceDto"
        "400":
          description: Execução automática ativa ou concluída impede sobrescrita manual.
  /api/sales-videos/reference-analysis/v1/references/{referenceId}/latest:
    get:
      tags: [VideoStudio]
      summary: Consulta a execução automática mais recente da referência.
      parameters:
        - $ref: "#/components/parameters/ReferenceId"
      responses:
        "200":
          description: Execução e receita auditável encontradas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceAnalysisExecution"
  /api/sales-videos/reference-analysis/v1/references/{referenceId}/retry:
    post:
      tags: [VideoStudio]
      summary: Reenfileira a análise quando não existe tentativa ativa.
      parameters:
        - $ref: "#/components/parameters/ReferenceId"
      responses:
        "200":
          description: Nova tentativa persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceAnalysisExecution"
  /api/internal/sales-videos/reference-analysis/v1/analyze/stage-executions/pending:
    get:
      tags: [VideoStudio]
      summary: Entrega uma pendência com lease ao executor Apolo.
      parameters:
        - in: query
          name: workerId
          required: true
          schema: { type: string }
        - in: query
          name: budgetLimitUsd
          required: true
          description: Teto persistente para o lote de análises.
          schema: { type: number, minimum: 0.01 }
        - in: query
          name: reservationUsd
          required: true
          description: Reserva máxima assumida antes de cada chamada multimodal.
          schema: { type: number, minimum: 0.01 }
      responses:
        "200":
          description: Lista com zero ou uma execução pendente.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items:
                  $ref: "#/components/schemas/PendingVideoReferenceAnalysis"
  /api/internal/sales-videos/reference-analysis/v1/analyze/stage-executions/{executionId}/complete:
    post:
      tags: [VideoStudio]
      summary: Persiste saída, artefatos e auditoria completos da etapa.
      parameters:
        - in: path
          name: executionId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteVideoReferenceAnalysis"
      responses:
        "200":
          description: Execução concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceAnalysisExecution"
  /api/internal/sales-videos/reference-analysis/v1/analyze/stage-executions/{executionId}/fail:
    post:
      tags: [VideoStudio]
      summary: Persiste falha e toda auditoria disponível da etapa.
      parameters:
        - in: path
          name: executionId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailVideoReferenceAnalysis"
      responses:
        "200":
          description: Falha auditada e referência liberada para retry ou contingência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoReferenceAnalysisExecution"
components:
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: integer
        format: int64
    ReferenceId:
      in: path
      name: referenceId
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    VideoProjectStatus:
      type: string
      enum:
        - DRAFT
        - READY_FOR_SCRIPT
        - READY_FOR_RENDER
        - IN_PRODUCTION
        - READY_FOR_REVIEW
        - APPROVED
        - ARCHIVED
    VideoReferenceStatus:
      type: string
      enum:
        - QUEUED
        - ANALYZING
        - ANALYZED
        - REJECTED
    VideoReferenceAnalysisExecution:
      type: object
      required: [executionId, referenceId, attemptNumber, status, input]
      properties:
        executionId: { type: integer, format: int64 }
        referenceId: { type: integer, format: int64 }
        attemptNumber: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, BUDGET_BLOCKED]
        input: { type: object, additionalProperties: true }
        output:
          type: object
          nullable: true
          description: Diagnóstico, sequência, aplicações e receita importável produzidos por Apolo.
          additionalProperties: true
        artifacts:
          type: object
          nullable: true
          description: Hash, mídia, loudness, cortes e hashes dos contact sheets.
          additionalProperties: true
        model: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        costUsd: { type: number, nullable: true }
        decision: { type: string, nullable: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    PendingVideoReferenceAnalysis:
      type: object
      required:
        - executionId
        - referenceId
        - tenantId
        - attemptNumber
        - producerExecutionId
        - input
        - claimedAt
      properties:
        executionId: { type: integer, format: int64 }
        referenceId: { type: integer, format: int64 }
        tenantId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        producerExecutionId: { type: string }
        input: { type: object, additionalProperties: true }
        claimedAt: { type: string, format: date-time }
    CompleteVideoReferenceAnalysis:
      type: object
      required:
        - producerExecutionId
        - summaryMarkdown
        - output
        - artifacts
        - rawRequest
        - rawResponse
        - model
        - costUsd
        - decision
      properties:
        producerExecutionId: { type: string }
        summaryMarkdown: { type: string }
        output: { type: object, additionalProperties: true }
        artifacts: { type: object, additionalProperties: true }
        rawRequest: { type: object, additionalProperties: true }
        rawResponse: { type: object, additionalProperties: true }
        model: { type: string }
        inputTokens: { type: integer, format: int64, nullable: true }
        cachedInputTokens: { type: integer, format: int64, nullable: true }
        outputTokens: { type: integer, format: int64, nullable: true }
        costUsd: { type: number, minimum: 0 }
        decision: { type: string }
    FailVideoReferenceAnalysis:
      type: object
      required: [producerExecutionId, error]
      properties:
        producerExecutionId: { type: string }
        error: { type: string }
        artifacts: { type: object, additionalProperties: true, nullable: true }
        rawRequest: { type: object, additionalProperties: true, nullable: true }
        rawResponse:
          { type: object, additionalProperties: true, nullable: true }
        model: { type: string, nullable: true }
    CreateVideoReferenceRequest:
      type: object
      required:
        - title
        - sourceUrl
        - primaryLearningGoal
      properties:
        title: { type: string, maxLength: 255 }
        sourceUrl:
          type: string
          maxLength: 2048
          description: URL pública ou origem acessível do vídeo de referência.
        sourcePlatform: { type: string, nullable: true, maxLength: 64 }
        niche: { type: string, nullable: true, maxLength: 191 }
        funnelStage: { type: string, nullable: true, maxLength: 64 }
        primaryLearningGoal:
          type: string
          maxLength: 1024
          description: Gancho, ritmo, prova, objeção, CTA ou outro aprendizado desejado.
        successEvidence:
          type: string
          nullable: true
          description: Views, comentários, vendas, retenção ou observação comercial.
        createdBy: { type: string, nullable: true, maxLength: 191 }
    UploadVideoReferenceRequest:
      type: object
      required:
        - file
        - title
        - primaryLearningGoal
      properties:
        file:
          type: string
          format: binary
          description: Arquivo de vídeo enviado pelo usuário para análise.
        title: { type: string, maxLength: 255 }
        sourcePlatform:
          type: string
          nullable: true
          maxLength: 64
          description: Plataforma ou origem comercial do vídeo; assume Upload quando omitido.
        niche: { type: string, nullable: true, maxLength: 191 }
        funnelStage: { type: string, nullable: true, maxLength: 64 }
        primaryLearningGoal:
          type: string
          maxLength: 1024
          description: Gancho, ritmo, prova, objeção, CTA ou outro aprendizado desejado.
        successEvidence:
          type: string
          nullable: true
          description: Views, comentários, vendas, retenção ou observação comercial.
        createdBy: { type: string, nullable: true, maxLength: 191 }
    AnalyzeVideoReferenceRequest:
      type: object
      required:
        - evidence
        - commercialDiagnosis
        - sequenceAnalysis
        - systemLearnings
        - salesImprovements
        - operationalDecision
        - analyzedBy
      properties:
        evidence:
          type: string
          description: Dados técnicos, origem, duração, formato, ritmo e sinais usados como prova.
        commercialDiagnosis:
          type: string
          description: Papel no funil, promessa, emoção, prova, objeção e potencial de conversão.
        sequenceAnalysis:
          type: string
          description: Quebra por tempo, cortes, viradas, repetição e recompensa visual.
        systemLearnings:
          type: string
          description: Padrões que devem alimentar roteiros, criativos, CTAs e templates.
        salesImprovements:
          type: string
          description: Ações práticas para transformar retenção em clique, cadastro, checkout ou compra.
        operationalDecision:
          type: string
          description: Próximo movimento recomendado para reaproveitar o aprendizado comercial.
        analyzedBy:
          type: string
          description: Responsável pela análise registrada.
    VideoReferenceDto:
      allOf:
        - $ref: "#/components/schemas/CreateVideoReferenceRequest"
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string }
        analysisNotes: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/VideoReferenceStatus"
        analyzedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateVideoProjectRequest:
      type: object
      required:
        - contextType
        - productionMode
        - targetChannel
        - format
        - title
        - objective
      properties:
        productId: { type: integer, format: int64, nullable: true }
        experimentId: { type: integer, format: int64, nullable: true }
        salesVideoProfileId: { type: integer, format: int64, nullable: true }
        campaignKey: { type: string, nullable: true }
        videoCategory:
          type: string
          nullable: true
          enum: [COMMERCIAL_SHORT, LONG_FORM, INSTITUTIONAL_CONTENT]
          description: Categoria comercial que define a política de duração.
        contextType: { type: string, example: PRODUCT }
        productionMode: { type: string, example: MIXED_AI_SCENES }
        targetChannel: { type: string, example: INSTAGRAM_REELS }
        format: { type: string, example: VERTICAL_9_16 }
        title: { type: string }
        objective: { type: string }
        funnelStage: { type: string, nullable: true }
        primaryMetric: { type: string, nullable: true }
        strategyGroupKey:
          type: string
          nullable: true
          description: Agrupa peças complementares da mesma estratégia comercial.
        strategyRole:
          type: string
          nullable: true
          enum: [CAMPAIGN_QUALIFICATION, PDE_HERO_CONVERSION]
        commercialHypothesis: { type: string, nullable: true }
        persuasionFramework: { type: string, nullable: true }
        scientificBasis:
          type: string
          nullable: true
          description: Evidências aplicadas e limites explícitos da promessa.
        measurementPlan: { type: string, nullable: true }
        resultsSnapshot:
          type: string
          nullable: true
          description: Fotografia auditável de resultados reais observados.
        learningDecision:
          type: string
          nullable: true
          enum: [COLLECTING, CONTINUE, ADJUST, STOP]
        confirmedLearning: { type: string, nullable: true }
        nextVersionRecommendation: { type: string, nullable: true }
        hookText: { type: string, nullable: true }
        scriptText: { type: string, nullable: true }
        scenePlan: { type: string, nullable: true }
        visualReferences: { type: string, nullable: true }
        characterBible:
          type: string
          nullable: true
          description: Personagens, imagens mestre aprovadas, figurinos e URLs ou IDs de referência.
        environmentBible:
          type: string
          nullable: true
          description: Ambientes, imagens mestre, ângulos, entradas, saídas e mapa simples de cenário.
        objectBible:
          type: string
          nullable: true
          description: Produto, objetos, interface, marca, escala e arquivos separados de logotipo ou texto.
        visualStyleGuide:
          type: string
          nullable: true
          description: Direção visual, acabamento, luz, lente, enquadramento, paleta e textura.
        imageGenerationPlan:
          type: string
          nullable: true
          description: Plano para solicitar imagens mestre ao modelo de imagem antes da geração de vídeo.
        continuityRules:
          type: string
          nullable: true
          description: Regras de preservação visual entre cenas, takes e provedores.
        voiceoverPlan: { type: string, nullable: true }
        soundtrackPlan: { type: string, nullable: true }
        captionPlan: { type: string, nullable: true }
        ctaText: { type: string, nullable: true }
        targetDurationSeconds:
          type: integer
          minimum: 1
          description: Vídeo comercial curto aceita 6-60s; vídeo longo/VSL aceita 180s ou mais.
          nullable: true
        providerPlan: { type: string, nullable: true }
        characterPerformanceType:
          type: string
          enum: [image, video]
          nullable: true
        characterPerformanceUri:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL HTTPS da personagem original e autorizada usada pelo Act-Two.
        referencePerformanceUri:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL HTTPS da gravação de performance original e autorizada.
        referencePerformanceDurationSeconds:
          type: integer
          minimum: 3
          maximum: 30
          nullable: true
        performanceConsentEvidence:
          type: string
          maxLength: 2048
          nullable: true
        performanceRightsEvidence:
          type: string
          maxLength: 2048
          nullable: true
        editingNotes: { type: string, nullable: true }
        qualityGate: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/VideoProjectStatus"
        createdBy: { type: string, nullable: true }
    UpdateVideoProjectRequest:
      allOf:
        - $ref: "#/components/schemas/CreateVideoProjectRequest"
      properties:
        updatedBy: { type: string, nullable: true }
    VideoProjectDto:
      allOf:
        - $ref: "#/components/schemas/CreateVideoProjectRequest"
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string }
        updatedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        researchIntelligence:
          allOf:
            - $ref: "#/components/schemas/ResearchIntelligenceSelection"
          nullable: true
          description: Seleção completa somente no detalhe, criação e atualização do projeto.
    ResearchIntelligenceSelection:
      type: object
      required:
        [
          contractVersion,
          contextFingerprint,
          totalAvailableCards,
          routes,
          limitations,
        ]
      properties:
        contractVersion:
          type: string
          enum: [HARNESS_RESEARCH_INTELLIGENCE_V1]
        contextFingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
        totalAvailableCards: { type: integer, minimum: 1 }
        routes:
          type: array
          items:
            $ref: "#/components/schemas/ResearchIntelligenceRoute"
        limitations:
          type: array
          items: { type: string }
    ResearchIntelligenceCatalog:
      type: object
      required:
        - contractVersion
        - evaluatedOn
        - totalCompiledCards
        - activeCards
        - agentPolicies
        - cards
        - limitations
      properties:
        contractVersion:
          type: string
          enum: [HARNESS_RESEARCH_INTELLIGENCE_V1]
        evaluatedOn: { type: string, format: date }
        totalCompiledCards: { type: integer, minimum: 1 }
        activeCards: { type: integer, minimum: 0 }
        agentPolicies:
          type: array
          items:
            $ref: "#/components/schemas/ResearchIntelligenceAgentPolicy"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ResearchIntelligenceCard"
        limitations:
          type: array
          items: { type: string }
    ResearchIntelligenceAgentPolicy:
      type: object
      required:
        - agentKey
        - agentName
        - purpose
        - authority
        - collections
        - maxCardsPerContext
      properties:
        agentKey: { type: string }
        agentName: { type: string }
        purpose: { type: string }
        authority:
          type: string
          enum:
            [PRODUCTION_ADVISORY, COMMUNICATION_ADVISORY, REVIEW_CRITERIA_ONLY]
        collections:
          type: array
          minItems: 1
          items: { type: string }
        maxCardsPerContext: { type: integer, minimum: 1, maximum: 4 }
    ResearchIntelligenceRoute:
      type: object
      required:
        [agentKey, agentName, purpose, authority, selectionReason, cards]
      properties:
        agentKey: { type: string }
        agentName: { type: string }
        purpose: { type: string }
        authority:
          type: string
          enum:
            [PRODUCTION_ADVISORY, COMMUNICATION_ADVISORY, REVIEW_CRITERIA_ONLY]
        selectionReason: { type: string }
        cards:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/ResearchIntelligenceCard"
    ResearchIntelligenceCard:
      type: object
      required:
        - cardId
        - collection
        - title
        - finding
        - mechanism
        - commercialApplication
        - evidenceStrength
        - experimentHypothesis
        - risks
        - limits
        - sourcePath
        - sourceSha256
        - evidenceKind
      properties:
        cardId: { type: string, pattern: "^RI1-[0-9A-F]{12}$" }
        collection: { type: string }
        title: { type: string }
        finding: { type: string, maxLength: 700 }
        mechanism: { type: string, maxLength: 700 }
        commercialApplication: { type: string, maxLength: 700 }
        evidenceStrength: { type: string, maxLength: 500 }
        publishedOn: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        experimentHypothesis: { type: string, maxLength: 700 }
        risks: { type: string, maxLength: 700 }
        limits: { type: string }
        sourcePath: { type: string, pattern: "^pesquisas/" }
        sourceSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        evidenceKind: { type: string, enum: [EXTERNAL_RESEARCH] }
