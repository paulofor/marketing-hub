services:
  email-service:
    container_name: email-service
    build:
      context: .
    image: email-service
    restart: unless-stopped
    # Permite que o container resolva serviços que estão rodando no host
    # (ex.: marketinghub-backend rodando via systemd ou em outro compose).
    extra_hosts:
      - "marketinghub-backend:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:mem:emailservice;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.h2.Driver}
      MARKETING_HUB_BASE_URL: ${MARKETING_HUB_BASE_URL:-http://191.252.92.222:8000}
      MARKETING_HUB_TEMPLATES_PATH: ${MARKETING_HUB_TEMPLATES_PATH:-/api/v1/email-templates}
      MARKETING_HUB_LEAD_PORTAL_PACKAGES_BASE_PATH: ${MARKETING_HUB_LEAD_PORTAL_PACKAGES_BASE_PATH:-/api/internal/lead-portal/image-packages}
      MARKETING_HUB_AUTH_TOKEN: ${MARKETING_HUB_AUTH_TOKEN:-}
      CLOUDFLARE_BASE_URL: ${CLOUDFLARE_BASE_URL:-https://api.cloudflare.com/client/v4}
      CLOUDFLARE_DELIVERY_BASE_URL: ${CLOUDFLARE_DELIVERY_BASE_URL:-https://imagedelivery.net}
      CLOUDFLARE_DELIVERY_HASH: ${CLOUDFLARE_DELIVERY_HASH:-}
      CLOUDFLARE_DEFAULT_VARIANT: ${CLOUDFLARE_DEFAULT_VARIANT:-public}
      CLOUDFLARE_AUTH_TOKEN: ${CLOUDFLARE_AUTH_TOKEN:-}
      EMAIL_TRACKING_BASE_URL: ${EMAIL_TRACKING_BASE_URL:-http://191.252.92.222:8000/api/v1/tracking/pixel}
      EMAIL_SERVICE_FROM_ADDRESS: ${EMAIL_SERVICE_FROM_ADDRESS:-imagens@oportunidadebrasil.shop}
      EMAIL_SERVICE_DRY_RUN: ${EMAIL_SERVICE_DRY_RUN:-false}
      LEAD_PORTAL_DISPATCH_ENABLED: ${LEAD_PORTAL_DISPATCH_ENABLED:-true}
      LEAD_PORTAL_DISPATCH_BATCH_SIZE: ${LEAD_PORTAL_DISPATCH_BATCH_SIZE:-3}
      LEAD_PORTAL_DISPATCH_INITIAL_DELAY: ${LEAD_PORTAL_DISPATCH_INITIAL_DELAY:-20000}
      LEAD_PORTAL_DISPATCH_POLL_INTERVAL: ${LEAD_PORTAL_DISPATCH_POLL_INTERVAL:-60000}
    ports:
      - "8086:8080"

networks:
  default:
    driver: bridge
