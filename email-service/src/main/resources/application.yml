spring:
  application:
    name: email-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:marketing_hub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASS:Ab9!rG4wX8_tMq2Bz7#HpK5V}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  sql:
    init:
      mode: always
  mail:
    host: ${SPRING_MAIL_HOST:smtp.hostinger.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:imagens@oportunidadebrasil.shop}
    password: ${SPRING_MAIL_PASSWORD:Russo007&}
    properties:
      mail:
        debug: true
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
          ssl:
            enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:true}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,logfile
      base-path: /ops-email-gateway-7xk9
      path-mapping:
        logfile: email-service-audit-log
  endpoint:
    health:
      show-details: when_authorized
clients:
  marketing-hub:
    base-url: ${MARKETING_HUB_BASE_URL:http://191.252.181.168:8000}
    templates-path: ${MARKETING_HUB_TEMPLATES_PATH:/api/v1/email-templates}
    auth-token: ${MARKETING_HUB_AUTH_TOKEN:}
    connect-timeout: ${MARKETING_HUB_CONNECT_TIMEOUT:2000}
    # A exportação de pacotes pode levar vários segundos para gerar o ZIP + Base64;
    # com 5s víamos timeouts e reprocessamentos que derrubavam o backend.
    read-timeout: ${MARKETING_HUB_READ_TIMEOUT:60000}
  cloudflare:
    base-url: ${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4}
    delivery-base-url: ${CLOUDFLARE_DELIVERY_BASE_URL:https://imagedelivery.net}
    delivery-hash: ${CLOUDFLARE_DELIVERY_HASH:}
    default-variant: ${CLOUDFLARE_DEFAULT_VARIANT:public}
    auth-token: ${CLOUDFLARE_AUTH_TOKEN:}
    connect-timeout: ${CLOUDFLARE_CONNECT_TIMEOUT:2000}
    read-timeout: ${CLOUDFLARE_READ_TIMEOUT:5000}
lead-portal:
  notifications:
    max-attempts: ${LEAD_PORTAL_NOTIFICATIONS_MAX_ATTEMPTS:5}
    batch-size: ${LEAD_PORTAL_NOTIFICATIONS_BATCH_SIZE:3}
    lock-seconds: ${LEAD_PORTAL_NOTIFICATIONS_LOCK_SECONDS:300}
    tracking-base-url: ${LEAD_PORTAL_NOTIFICATIONS_TRACKING_BASE_URL:https://oportunidadebrasil.shop}
  storage:
    bucket: ${LEAD_PORTAL_STORAGE_BUCKET:leadportal}
    endpoint: ${LEAD_PORTAL_STORAGE_ENDPOINT:https://95b059f4f73518a658d07a19438f38c9.r2.cloudflarestorage.com}
    public-base-url: ${LEAD_PORTAL_STORAGE_PUBLIC_BASE_URL:https://pub-37cb222fbfe5470da56cce789c5beec1.r2.dev}
    access-key-id: ${LEAD_PORTAL_STORAGE_ACCESS_KEY_ID:fafc943bd27d2a1c55c84f80778994a0}
    secret-access-key: ${LEAD_PORTAL_STORAGE_SECRET_ACCESS_KEY:4ee618dd20bb752711ee0242469a70fadb9bdc0c921ded7e1177eeb681ddfc54}
    region: ${LEAD_PORTAL_STORAGE_REGION:auto}
    max-download-bytes: ${LEAD_PORTAL_STORAGE_MAX_DOWNLOAD_BYTES:26214400}
  dispatch:
    enabled: ${LEAD_PORTAL_DISPATCH_ENABLED:true}
    batch-size: ${LEAD_PORTAL_DISPATCH_BATCH_SIZE:3}
    initial-delay: ${LEAD_PORTAL_DISPATCH_INITIAL_DELAY:20000}
    poll-interval: ${LEAD_PORTAL_DISPATCH_POLL_INTERVAL:60000}
    # Timeout mais alto para baixar anexos grandes do storage
    read-timeout: ${LEAD_PORTAL_DISPATCH_READ_TIMEOUT:180000}
  payment-link:
    validate-host: ${LEAD_PORTAL_PAYMENT_VALIDATE_HOST:true}
    allowed-hosts: ${LEAD_PORTAL_PAYMENT_ALLOWED_HOSTS:pagamentopalf.site,www.pagamentopalf.site,www.mercadopago.com.br,mercadopago.com.br,www.mercadopago.com}
    entrypoint-base-url: ${LEAD_PORTAL_PAYMENT_ENTRYPOINT_BASE_URL:https://pagamentopalf.site/checkout}
    package-id-query-param: ${LEAD_PORTAL_PAYMENT_PACKAGE_PARAM:packageId}
    purchase-id-query-param: ${LEAD_PORTAL_PAYMENT_PURCHASE_PARAM:purchaseId}
    button-color: ${LEAD_PORTAL_PAYMENT_BUTTON_COLOR:#00a650}
    button-text: ${LEAD_PORTAL_PAYMENT_BUTTON_TEXT:Quero liberar as imagens originais}
    plain-text-intro: ${LEAD_PORTAL_PAYMENT_PLAIN_INTRO:Finalize o pagamento e libere as imagens originais:}
integrations:
  lead-portal-payments:
    enabled: ${LEAD_PORTAL_PAYMENTS_ENABLED:true}
    base-url: ${LEAD_PORTAL_PAYMENTS_BASE_URL:https://pagamentopalf.site}
    auth-token: ${LEAD_PORTAL_PAYMENTS_AUTH_TOKEN:}
    connect-timeout: ${LEAD_PORTAL_PAYMENTS_CONNECT_TIMEOUT:PT2S}
    # A criação de preferências no Mercado Pago pode levar quase dois minutos; aumentamos o timeout
    # para evitar reprocessamentos e falhas na etapa de disparo de e-mails.
    read-timeout: ${LEAD_PORTAL_PAYMENTS_READ_TIMEOUT:PT3M}

email-service:
  default-from-address: ${EMAIL_SERVICE_FROM_ADDRESS:imagens@oportunidadebrasil.shop}
  dry-run: ${EMAIL_SERVICE_DRY_RUN:false}

email:
  tracking:
    base-url: ${EMAIL_TRACKING_BASE_URL:http://191.252.120.96:8086/api/v1/tracking/pixel}

logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/email-service-audit.log}
  level:
    com.marketinghub.emailservice: INFO

premium-delivery:
  email:
    enabled: ${PREMIUM_DELIVERY_EMAIL_ENABLED:true}
    batch-size: ${PREMIUM_DELIVERY_EMAIL_BATCH_SIZE:5}
    max-attempts: ${PREMIUM_DELIVERY_EMAIL_MAX_ATTEMPTS:5}
    lock-seconds: ${PREMIUM_DELIVERY_EMAIL_LOCK_SECONDS:300}
    scheduler:
      delay: ${PREMIUM_DELIVERY_EMAIL_DELAY:60000}
      initial-delay: ${PREMIUM_DELIVERY_EMAIL_INITIAL_DELAY:30000}

