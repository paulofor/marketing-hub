services:
  experiment-strategist-worker:
    image: ${EXPERIMENT_STRATEGIST_IMAGE:-marketing-hub/experiment-strategist-worker:local}
    restart: unless-stopped
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      EXPERIMENT_STRATEGIST_CODEX_TIMEOUT: ${EXPERIMENT_STRATEGIST_CODEX_TIMEOUT:-PT40M}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      LOG_FILE_NAME: /tmp/experiment-strategist-worker.log
      EXPERIMENT_STRATEGIST_MCP_URL: ${EXPERIMENT_STRATEGIST_MCP_URL:-http://backend:8000}
    ports:
      - "8096:8096"
    volumes:
      - ${MARKETING_HUB_REPOSITORY_HOST:-..}:/workspace/marketing-hub:ro
      - ${EXPERIMENT_STRATEGIST_CODEX_HOME:?Defina uma identidade Codex exclusiva}:/home/strategist/.codex
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
