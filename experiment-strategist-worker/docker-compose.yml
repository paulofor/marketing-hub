services:
  experiment-strategist-worker:
    image: ${EXPERIMENT_STRATEGIST_IMAGE:-marketing-hub/experiment-strategist-worker:local}
    restart: unless-stopped
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      EXPERIMENT_STRATEGIST_CODEX_TIMEOUT: ${EXPERIMENT_STRATEGIST_CODEX_TIMEOUT:-PT40M}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      LOG_FILE_NAME: /tmp/experiment-strategist-worker.log
      EXPERIMENT_STRATEGIST_MCP_URL: ${EXPERIMENT_STRATEGIST_MCP_URL:-http://backend:8000}
      AGENT_HEALTH_KEY: experiment-strategist
      AGENT_HEALTH_VERSION: "5"
      AGENT_BUILD_REFERENCE: ${AGENT_BUILD_REFERENCE:-local}
      CODEX_HOME: /home/strategist/.codex
      CODEX_COMMAND: /workspace/marketing-hub/scripts/codex-oauth-session-safe.sh
      STRATEGIST_CODEX_EXECUTABLE: /workspace/marketing-hub/scripts/codex-oauth-session-safe.sh
      CLARITY_API_TOKEN_FILE: /run/secrets/clarity-api-token
    ports:
      - "8096:8096"
    volumes:
      - ${MARKETING_HUB_REPOSITORY_HOST:-..}:/workspace/marketing-hub:ro
      - ${EXPERIMENT_STRATEGIST_CODEX_HOME:?Defina a sessão Codex individual da Atena}:/home/strategist/.codex
      - ${EXPERIMENT_STRATEGIST_CLARITY_TOKEN_FILE_HOST:-/opt/growth-operator/agents/experiment-strategist/secrets/clarity-api-token}:/run/secrets/clarity-api-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/agent-health-report.mjs"]
      interval: 1m
      timeout: 20s
      retries: 2
      start_period: 30s
