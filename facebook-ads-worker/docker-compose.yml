version: '3.9'
services:
  facebook-ads-worker:
    container_name: facebook-ads-worker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: marketinghub/facebook-ads-worker:latest
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://191.252.92.222:8000}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-marketinghubdb}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      TARGETING_QUEUE_ENABLED: ${TARGETING_QUEUE_ENABLED:-true}
      TARGETING_QUEUE_BATCH_SIZE: ${TARGETING_QUEUE_BATCH_SIZE:-5}
      TARGETING_QUEUE_POLL_INTERVAL: ${TARGETING_QUEUE_POLL_INTERVAL:-PT30S}
      TARGETING_QUEUE_LOCK_TTL: ${TARGETING_QUEUE_LOCK_TTL:-PT2M}
      BACKEND_API_PREFIX: ${BACKEND_API_PREFIX:-/api}
      FACEBOOK_GRAPH_API_BASE_URL: ${FACEBOOK_GRAPH_API_BASE_URL:-https://graph.facebook.com}
      FACEBOOK_GRAPH_API_VERSION: ${FACEBOOK_GRAPH_API_VERSION:-v23.0}
      FACEBOOKCAMPAIGN_SCHEDULER_DELAY: ${FACEBOOKCAMPAIGN_SCHEDULER_DELAY:-60000}
      FACEBOOKPIXEL_SCHEDULER_DELAY: ${FACEBOOKPIXEL_SCHEDULER_DELAY:-60000}
      FACEBOOK_INTEREST_VALIDATION_SCHEDULER_DELAY: ${FACEBOOK_INTEREST_VALIDATION_SCHEDULER_DELAY:-900000}
      FACEBOOK_TOKEN_RENEWAL_SCHEDULER_DELAY: ${FACEBOOK_TOKEN_RENEWAL_SCHEDULER_DELAY:-21600000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${FACEBOOK_ADS_WORKER_PORT:-8082}:8080"
