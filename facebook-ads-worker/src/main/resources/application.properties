spring.application.name=facebook-ads-worker
backend.base-url=http://191.252.92.222:8000
backend.api-prefix=/api
facebook.graph-api.version=v23.0
facebookpixel.enabled=false
targeting.resolver.default-locale=pt_BR
targeting.resolver.default-country=BR
targeting.resolver.search-limit=25
targeting.resolver.result-limit=5
targeting.resolver.cache-ttl=PT30M
targeting.resolver.max-seed-variants=6
targeting.resolver.suggestions-enabled=true
targeting.resolver.suggestion-limit=10
targeting.resolver.suggestion-seed-limit=3

# Force servlet stack to allow blocking access to Meta Marketing API per https://developers.facebook.com/docs/marketing-api/audiences/reference/targeting-search/
spring.main.web-application-type=servlet
# Database connection
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:marketinghubdb}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:root}
spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:45000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:120000}

# Targeting resolution queue
targeting.queue.enabled=${TARGETING_QUEUE_ENABLED:true}
targeting.queue.batch-size=${TARGETING_QUEUE_BATCH_SIZE:5}
targeting.queue.poll-interval=${TARGETING_QUEUE_POLL_INTERVAL:PT30S}
targeting.queue.lock-ttl=${TARGETING_QUEUE_LOCK_TTL:PT2M}

