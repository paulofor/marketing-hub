spring.application.name=facebook-ads-worker
backend.base-url=http://191.252.181.168:8000
backend.api-prefix=/api
facebook.graph-api.version=v23.0
facebookpixel.enabled=${FACEBOOKPIXEL_ENABLED:false}
targeting.resolver.default-locale=pt_BR
targeting.resolver.default-country=BR
targeting.resolver.search-limit=25
targeting.resolver.result-limit=5
targeting.resolver.cache-ttl=PT30M
targeting.resolver.max-seed-variants=6
targeting.resolver.default-ad-account-id=${TARGETING_DEFAULT_AD_ACCOUNT_ID:act_939323521124952}
targeting.resolver.suggestions-enabled=true
targeting.resolver.suggestion-limit=10
targeting.resolver.suggestion-seed-limit=3

# Force servlet stack to allow blocking access to Meta Marketing API per https://developers.facebook.com/docs/marketing-api/audiences/reference/targeting-search/
spring.main.web-application-type=servlet
# Database connection (aligned with backend defaults)
db.host=${DB_HOST:d555d.vps-kinghost.net}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:marketinghubdb}
db.username=${DB_USERNAME:marketing_hub_user}
db.password=${DB_PASSWORD:Ab9!rG4wX8_tMq2Bz7#HpK5V}
db.pool.max-size=${DB_MAX_POOL_SIZE:6}
db.pool.min-idle=${DB_MIN_IDLE:2}
db.pool.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
db.pool.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}
db.pool.idle-timeout=${DB_IDLE_TIMEOUT:45000}
db.pool.max-lifetime=${DB_MAX_LIFETIME:120000}
db.pool.keepalive-time=${DB_KEEPALIVE_TIME:30000}

spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=marketingHubPool
spring.datasource.hikari.maximum-pool-size=${db.pool.max-size}
spring.datasource.hikari.minimum-idle=${db.pool.min-idle}
spring.datasource.hikari.connection-timeout=${db.pool.connection-timeout}
spring.datasource.hikari.validation-timeout=${db.pool.validation-timeout}
spring.datasource.hikari.idle-timeout=${db.pool.idle-timeout}
spring.datasource.hikari.max-lifetime=${db.pool.max-lifetime}
spring.datasource.hikari.keepalive-time=${db.pool.keepalive-time}

# Targeting resolution queue
targeting.queue.enabled=${TARGETING_QUEUE_ENABLED:true}
targeting.queue.batch-size=${TARGETING_QUEUE_BATCH_SIZE:5}
targeting.queue.poll-interval=${TARGETING_QUEUE_POLL_INTERVAL:PT30S}
targeting.queue.lock-ttl=${TARGETING_QUEUE_LOCK_TTL:PT2M}

# Observability / logs
management.endpoints.web.base-path=${MANAGEMENT_BASE_PATH:/worker-observability}
management.endpoints.web.exposure.include=${MANAGEMENT_EXPOSE_ENDPOINTS:health,info,loggers,logfile}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
logging.file.name=${FACEBOOK_ADS_WORKER_LOG_FILE:logs/facebook-ads-worker.log}

# Public runtime log endpoint (enabled by default for diagnostics in this module)
runtime.logs.public.enabled=${RUNTIME_LOGS_PUBLIC_ENABLED:true}
