spring.application.name=facebook-ads-worker
backend.base-url=http://191.252.92.222:8000
backend.api-prefix=/api
facebook.graph-api.version=v23.0
facebookpixel.enabled=false
targeting.resolver.default-locale=pt_BR
targeting.resolver.default-country=BR
targeting.resolver.search-limit=25
targeting.resolver.result-limit=5
targeting.resolver.cache-ttl=PT30M
targeting.resolver.max-seed-variants=6
targeting.resolver.suggestions-enabled=true
targeting.resolver.suggestion-limit=10
targeting.resolver.suggestion-seed-limit=3

# Force servlet stack to allow blocking access to Meta Marketing API per https://developers.facebook.com/docs/marketing-api/audiences/reference/targeting-search/
spring.main.web-application-type=servlet
