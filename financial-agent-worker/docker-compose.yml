services:
  financial-agent-worker:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      FINANCIAL_AGENT_CODEX_TIMEOUT: ${FINANCIAL_AGENT_CODEX_TIMEOUT:-PT40M}
      COMMERCIAL_PLAN_ID: ${COMMERCIAL_PLAN_ID:-2}
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
      LOG_FILE_NAME: /tmp/financial-agent-worker.log
      FINANCIAL_AGENT_MCP_URL: ${FINANCIAL_AGENT_MCP_URL:-http://backend:8000}
      AGENT_HEALTH_KEY: financial-agent
      AGENT_HEALTH_VERSION: "3"
      AGENT_BUILD_REFERENCE: ${AGENT_BUILD_REFERENCE:-local}
      CODEX_HOME: /home/financial-agent/.codex
      CODEX_COMMAND: /workspace/marketing-hub/scripts/codex-oauth-session-safe.sh
    ports:
      - "${FINANCIAL_AGENT_WORKER_PORT:-8095}:8095"
    volumes:
      - ${MARKETING_HUB_REPOSITORY_PATH:-..}:/workspace/marketing-hub:ro
      - ${FINANCIAL_AGENT_CODEX_HOME:?Defina a sessão Codex individual do Plutus}:/home/financial-agent/.codex
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/agent-health-report.mjs"]
      interval: 1m
      timeout: 20s
      retries: 2
      start_period: 30s
