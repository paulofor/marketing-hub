services:
  financial-agent-worker:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      FINANCIAL_AGENT_CODEX_TIMEOUT: ${FINANCIAL_AGENT_CODEX_TIMEOUT:-PT40M}
      COMMERCIAL_PLAN_ID: ${COMMERCIAL_PLAN_ID:-2}
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
      LOG_FILE_NAME: /tmp/financial-agent-worker.log
      FINANCIAL_AGENT_MCP_URL: ${FINANCIAL_AGENT_MCP_URL:-http://backend:8000}
    ports:
      - "${FINANCIAL_AGENT_WORKER_PORT:-8095}:8095"
    volumes:
      - ${MARKETING_HUB_REPOSITORY_PATH:-..}:/workspace/marketing-hub:ro
      - ${FINANCIAL_AGENT_CODEX_HOME:?Defina a sessão Codex compartilhada dos agentes}:/home/financial-agent/.codex
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
