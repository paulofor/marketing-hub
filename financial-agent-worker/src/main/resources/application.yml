server:
  port: 8095
spring:
  application:
    name: financial-agent-worker
  task:
    scheduling:
      pool:
        size: 4
management:
  endpoints:
    web:
      base-path: /ops-financial-agent-observability-v1
      exposure:
        include: health,logfile
      path-mapping:
        logfile: financial-agent-worker-log
logging:
  file:
    name: ${LOG_FILE_NAME:/tmp/financial-agent-worker.log}
financial-agent:
  backend-url: ${BACKEND_URL:http://backend:8000}
  repository-path: ${MARKETING_HUB_REPOSITORY:/workspace/marketing-hub}
  codex-command: ${CODEX_COMMAND:codex}
  model: ${CODEX_MODEL:gpt-5.6-sol}
  reasoning-effort: ${CODEX_REASONING_EFFORT:high}
  service-tier: ${CODEX_SERVICE_TIER:default}
  service-tier-exception-reason: ${CODEX_SERVICE_TIER_EXCEPTION_REASON:O catálogo do Codex OAuth não anuncia Flex para os modelos disponíveis ao harness.}
  commercial-plan-id: ${COMMERCIAL_PLAN_ID:}
  codex-timeout: ${FINANCIAL_AGENT_CODEX_TIMEOUT:PT40M}
