services:
  growth-operator-worker:
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    environment:
      BACKEND_URL: http://backend:8000
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
    volumes:
      - ..:/workspace/marketing-hub:ro
      - ${CODEX_HOME}:/home/operator/.codex:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
