services:
  growth-operator-worker:
    image: ${GROWTH_OPERATOR_IMAGE:-marketing-hub/growth-operator-worker:local}
    restart: unless-stopped
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
      MARKETING_HUB_URL: ${MARKETING_HUB_URL:-http://backend:8000}
      COMMERCIAL_PLAN_ID: ${COMMERCIAL_PLAN_ID:-1}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-high}
      GROWTH_OPERATOR_CODEX_TIMEOUT: ${GROWTH_OPERATOR_CODEX_TIMEOUT:-PT40M}
      AGENT_HEALTH_KEY: growth-operator
      AGENT_HEALTH_VERSION: "1"
      AGENT_BUILD_REFERENCE: ${AGENT_BUILD_REFERENCE:-local}
      CODEX_HOME: /home/operator/.codex
      CODEX_COMMAND: /workspace/marketing-hub/scripts/codex-oauth-session-safe.sh
    ports:
      - "8094:8094"
    volumes:
      - ${MARKETING_HUB_REPOSITORY_HOST:-..}:/workspace/marketing-hub:ro
      - ${GROWTH_OPERATOR_CODEX_HOME:?Defina a sessão Codex compartilhada dos agentes}:/home/operator/.codex
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/agent-health-report.mjs"]
      interval: 5m
      timeout: 20s
      retries: 2
      start_period: 30s
