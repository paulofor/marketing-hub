server:
  port: 8094
management:
  endpoints:
    web:
      base-path: /ops-growth-operator-observability-v1
      exposure:
        include: health,logfile
  endpoint:
    logfile:
      external-file: ${LOG_FILE_NAME:/tmp/growth-operator-worker.log}
spring:
  application:
    name: growth-operator-worker
logging:
  file:
    name: ${LOG_FILE_NAME:/tmp/growth-operator-worker.log}
growth-operator:
  backend-url: ${BACKEND_URL:http://backend:8000}
  repository-path: ${MARKETING_HUB_REPOSITORY:/workspace/marketing-hub}
  codex-command: ${CODEX_COMMAND:codex}
  model: ${CODEX_MODEL:}
  reasoning-effort: ${CODEX_REASONING_EFFORT:high}
  marketing-hub-url: ${MARKETING_HUB_URL:http://backend:8000}
  commercial-plan-id: ${COMMERCIAL_PLAN_ID:}
  codex-timeout: ${GROWTH_OPERATOR_CODEX_TIMEOUT:PT40M}
