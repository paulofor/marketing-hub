AWSTemplateFormatVersion: '2010-09-09'
Description: Bucket privado para evidencias pesadas da memoria do Agente Cliente
Parameters:
  BucketName:
    Type: String
  RetentionDays:
    Type: Number
    Default: 365
Resources:
  CustomerAgentMemoryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpirarMemoriasOperacionais
            Status: Enabled
            Prefix: customer-agent-memory/v1/
            ExpirationInDays: !Ref RetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
  CustomerAgentMemoryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CustomerAgentMemoryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NegarTransporteInseguro
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub '${CustomerAgentMemoryBucket.Arn}'
              - !Sub '${CustomerAgentMemoryBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  BucketName:
    Value: !Ref CustomerAgentMemoryBucket
