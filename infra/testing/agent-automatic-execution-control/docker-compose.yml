services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: marketinghub_test
      MYSQL_ROOT_PASSWORD: local-agent-control
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-agent-control"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ../../..
      dockerfile: backend/ads-service/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: marketinghub_test
      DB_USERNAME: root
      DB_PASSWORD: local-agent-control
      DB_MAX_POOL_SIZE: 4
      DB_MIN_IDLE: 1
      JAVA_OPTS: -Xms256m -Xmx1536m
      SPRING_LIQUIBASE_ENABLED: "false"
      INTEGRATIONS_LEAD_PORTAL_ENABLED: "false"
      INTEGRATIONS_LEAD_PORTAL_PAYMENTS_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "18000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--connect-timeout",
          "2",
          "--max-time",
          "4",
          "http://127.0.0.1:8000/ops-mh-observability-v2/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "15173:5173"

volumes:
  mysql-data:
