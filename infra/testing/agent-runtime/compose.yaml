services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: local-agent-runtime-only
      MYSQL_DATABASE: agent_runtime_test
    ports:
      - "33308:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-agent-runtime-only"]
      interval: 2s
      timeout: 2s
      retries: 40
