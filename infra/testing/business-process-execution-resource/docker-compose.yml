services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: marketinghub_process_resource
      MYSQL_ROOT_PASSWORD: local-process-resource
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-process-resource"]
      interval: 5s
      timeout: 3s
      retries: 60
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ../../..
      dockerfile: backend/ads-service/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: marketinghub_process_resource
      DB_USERNAME: root
      DB_PASSWORD: local-process-resource
      DB_MAX_POOL_SIZE: 4
      DB_MIN_IDLE: 1
      JAVA_OPTS: -Xms256m -Xmx1536m
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/changesets/2026-08-20-business-process-execution-resources.yaml
      OPENAI_API_KEY: local-homologation-only
      OPENAI_BASE_URL: http://openai-test-double/v1
      INTEGRATIONS_LEAD_PORTAL_ENABLED: "false"
      INTEGRATIONS_LEAD_PORTAL_PAYMENTS_ENABLED: "false"
      LEAD_PORTAL_WORKER_PROCESSING_GUARD_ENABLED: "false"
      FRAMEWORK_IMAGE_STALE_GUARD_ENABLED: "false"
      SALES_VIDEO_ASSETS_CLEANUP_ENABLED: "false"
      SALES_VIDEO_REPROCESS_AUTO_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      openai-test-double:
        condition: service_started
    ports:
      - "18031:8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--connect-timeout",
          "2",
          "--max-time",
          "4",
          "http://127.0.0.1:8000/ops-mh-observability-v2/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 90

  openai-test-double:
    image: nginx:1.27-alpine

  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        sed -i 's/listen 5173;/listen 80;\n    listen 5173;/'
        /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    ports:
      - "15184:5173"

  contract-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.contract-test
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  visual-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      FRONTEND_URL: http://frontend/business-processes
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mysql-data:
