services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: local-chatgpt-only
      MYSQL_DATABASE: chatgpt_test
    ports:
      - '33371:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-plocal-chatgpt-only']
      interval: 2s
      timeout: 2s
      retries: 50
