services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: local-mira-only
      MYSQL_DATABASE: mira_test
    ports:
      - '33307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-plocal-mira-only']
      interval: 2s
      timeout: 2s
      retries: 40
