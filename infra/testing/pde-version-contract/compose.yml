services:
  mysql:
    image: mysql:5.7
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${PDE_CONTRACT_MYSQL_PORT:-33385}:3306"
    environment:
      MYSQL_DATABASE: pde_contract_qa
      MYSQL_ROOT_PASSWORD: pde-contract-local-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppde-contract-local-only"]
      interval: 2s
      timeout: 3s
      retries: 60
