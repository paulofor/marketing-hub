services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: kit-local-root
      MYSQL_DATABASE: kit_local
      MYSQL_USER: kit
      MYSQL_PASSWORD: kit-local-only
    command: ['--max-allowed-packet=64M', '--innodb-buffer-pool-size=64M', '--innodb-log-file-size=32M', '--max-connections=20']
    # Fotografias usam volume descartável; tmpfs acumulava blobs e encerrava o MySQL por memória.
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '57283:3306'
    healthcheck:
      test: ['CMD','mysqladmin','ping','-h','127.0.0.1','-uroot','-pkit-local-root']
      interval: 3s
      retries: 30
    mem_limit: 1024m

volumes:
  mysql-data:
