services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: kit-local-root
      MYSQL_DATABASE: kit_local
      MYSQL_USER: kit
      MYSQL_PASSWORD: kit-local-only
    command: ['--max-allowed-packet=64M']
    ports:
      - '57283:3306'
    healthcheck:
      test: ['CMD','mysqladmin','ping','-h','127.0.0.1','-uroot','-pkit-local-root']
      interval: 3s
      retries: 30
    mem_limit: 512m
