services:
  profile-mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: execution_profiles_local
      MYSQL_ROOT_PASSWORD: profiles-local-only
    ports:
      - "18414:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pprofiles-local-only"]
      interval: 2s
      timeout: 2s
      retries: 45
