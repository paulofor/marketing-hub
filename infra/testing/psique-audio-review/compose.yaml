services:
  audio-mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: psique_audio_test
      MYSQL_ROOT_PASSWORD: audio-local-only
    tmpfs:
      - /var/lib/mysql:size=256m
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, -paudio-local-only]
      interval: 2s
      timeout: 3s
      retries: 40
