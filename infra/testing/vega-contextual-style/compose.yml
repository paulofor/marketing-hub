services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: vega_local
      MYSQL_USER: vega
      MYSQL_PASSWORD: vega-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "18326:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot-local-only"]
      interval: 3s
      timeout: 3s
      retries: 40
