services:
  vega-frontend:
    image: marketing-hub/pde-platform-frontend-vega:vega386-v11
  image-harness:
    image: marketing-hub/customer-agent-worker:vega386-v11
  backend-image:
    image: marketing-hub/backend:vega386-v11
  dedalo-image:
    image: marketing-hub/landing-generator-agent-worker:vega386-v11
    entrypoint: ["sh", "-c"]
    command:
      - >-
        java -version && codex --version && git --version && flock --version &&
        node --input-type=module -e 'import {chromium,devices} from "playwright-core"; const b=await chromium.launch(); for(const options of [{viewport:{width:1440,height:900}},devices["iPhone 15 Pro"],devices["Pixel 7"]]) {const p=await b.newPage({...options,defaultBrowserType:"chromium"}); await p.setContent("<html lang=pt-BR><button>Continuar</button></html>"); await p.getByRole("button").click(); await p.close();} await b.close(); console.log("Dédalo: runtime e navegador prontos");'
    profiles: [checks]
    mem_limit: 1g
    shm_size: 256m
    tmpfs: ["/tmp:size=256m,mode=1777"]
