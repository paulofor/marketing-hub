services:
  vega-frontend:
    image: marketing-hub/pde-platform-frontend-vega:vega380-v9
    environment:
      VEGA_BACKEND_URL: http://${VEGA_LOCAL_HOST:?IP da sandbox obrigatória}:18080
    networks:
      default:
        aliases: [pde-platform-frontend-vega-private]
    ports: ["18318:80"]
    mem_limit: 128m
  image-harness:
    image: marketing-hub/customer-agent-worker:vega380-v9
    entrypoint: ["node", "/app/browser/vega-agent-validation-harness.mjs"]
    command: ["/evidence/input.json", "/evidence/output.json", "/evidence/browser"]
    environment:
      PDE_INTERNAL_API_TOKEN: vega-local-internal-only
    volumes:
      - harness-evidence:/evidence
    mem_limit: 1g
    shm_size: 256m
    tmpfs: ["/tmp:size=256m,mode=1777"]
    profiles: [checks]
  backend-image:
    image: marketing-hub/backend:vega380-v9
    entrypoint: ["java", "-version"]
    profiles: [checks]
    mem_limit: 128m
  proxy:
    image: nginx:1.27-alpine
    extra_hosts: ["lead-portal-payments-service:127.0.0.1"]
    ports: ["18319:443"]
    mem_limit: 128m
  admin-image:
    image: marketing-hub/frontend:vega380-v9
    extra_hosts:
      - backend:${VEGA_LOCAL_HOST:?IP da sandbox obrigatória}
    ports: ["18320:5173"]
    mem_limit: 128m
  vega-worker:
    image: marketing-hub/pde-vega-private-worker:vega380-v9
    environment:
      VEGA_BACKEND_URL: http://${VEGA_LOCAL_HOST:?IP da sandbox obrigatória}:18080
      OPENAI_RESPONSES_URL: http://${VEGA_LOCAL_HOST:?IP da sandbox obrigatória}:18081/responses
      PDE_INTERNAL_API_TOKEN: vega-local-internal-only
      OPENAI_API_KEY: synthetic
      VEGA_OPENAI_MODEL: gpt-5-mini
    volumes:
      - worker-outbox:/data
    mem_limit: 128m
volumes:
  harness-evidence:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m,uid=10001,gid=10001
  worker-outbox:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=32m,uid=1000,gid=1000
