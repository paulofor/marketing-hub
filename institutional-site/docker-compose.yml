services:
  institutional-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinghub/institutional-site:latest
    container_name: institutional-site
    restart: unless-stopped
    ports:
      - "${INSTITUTIONAL_SITE_PORT:-8091}:80"
    networks:
      - shared-public

networks:
  shared-public:
    name: ${INSTITUTIONAL_SITE_NETWORK:-institutional-site-net}
    external: ${INSTITUTIONAL_SITE_NETWORK_EXTERNAL:-false}
