server:
  port: 8100
spring:
  application:
    name: landing-generator-agent-worker
management:
  endpoints:
    web:
      base-path: /ops-landing-generator-observability-v1
      exposure:
        include: health,info,metrics,prometheus,logfile
  endpoint.health.probes.enabled: true
logging:
  file:
    name: ${LOG_FILE_NAME:/tmp/landing-generator-agent-worker.log}
landing-generator-agent:
  backend-url: ${BACKEND_URL:http://backend:8000}
  marketing-hub-url: ${MARKETING_HUB_URL:http://backend:8000}
  repository-path: ${MARKETING_HUB_REPOSITORY:/workspace/marketing-hub}
  model: ${CODEX_MODEL:gpt-5.6-sol}
  reasoning-effort: ${CODEX_REASONING_EFFORT:high}
  codex-timeout: ${LANDING_GENERATOR_CODEX_TIMEOUT:PT40M}
