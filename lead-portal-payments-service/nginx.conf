############################
# UPSTREAMS
############################

upstream lead_portal_payments_backend {
    server lead-portal-payments-service:8080;
}

# Upgrade header p/ WebSocket / SSE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# formato com host/porta do upstream, IP/porta real, URI+query e tempos
# - ext_uri mostra exatamente o que chegou do cliente
# - int_uri informa para onde o request foi encaminhado (host interno + path)
log_format upstream_tap '$remote_addr - $host "$request" '
                        'ext_uri="$scheme://$host$request_uri" '
                        'int_uri="$proxy_internal_uri" '
                        'u_ip=$upstream_addr '
                        'status=$status u_status=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time';

# Quando não houver upstream (ex.: respostas 301 ou erros antes do proxy)
# o valor fica "-", evitando strings vazias como "http:///"
map $upstream_addr $proxy_internal_uri {
    ''      '-';
    default 'http://$upstream_addr$uri$is_args$args';
}

map $host $pde_platform_frontend_upstream {
    clubemusa.com.br pde-platform-frontend-v5:80;
    www.clubemusa.com.br pde-platform-frontend-v5:80;
    v1.clubemusa.com.br pde-platform-frontend-v5:80;
    v2.clubemusa.com.br pde-platform-frontend-v5:80;
    v5.clubemusa.com.br pde-platform-frontend-v5:80;
    v6.clubemusa.com.br pde-platform-frontend-v6:80;
    v7.clubemusa.com.br pde-platform-frontend-v7:80;
    v8.clubemusa.com.br pde-platform-frontend-v7:80;
    v9.clubemusa.com.br pde-platform-frontend-v7:80;
    v10.clubemusa.com.br pde-platform-frontend-v7:80;
    default '';
}

############################
# HTTP (porta 80)
############################

server {
    listen 80;
    listen [::]:80;
    server_name pagamentopalf.site www.pagamentopalf.site;

    access_log /dev/stdout upstream_tap;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        try_files $uri =404;
        log_not_found off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

