# Catch-all para desafios ACME quando o host ainda não está mapeado
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /dev/stdout upstream_tap;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        try_files $uri =404;
        log_not_found off;
    }

    location / {
        return 404;
    }
}

############################
# HTTPS (porta 443)
############################

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pagamentopalf.site www.pagamentopalf.site;
    access_log /dev/stdout upstream_tap;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Permite uploads até o limite aceito pelo backend
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/certs/live/pagamentopalf.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/pagamentopalf.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location ^~ /downloads/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Disposition "attachment";
    }

    location ^~ /sales-page- {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /obrigado-exp51.html {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ^~ /obrigado-exp {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ^~ /mh-api/ {
        proxy_set_header Host 191.252.181.168;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://191.252.181.168/api/;
    }

    # Backend payments
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://lead_portal_payments_backend;
    }
}

