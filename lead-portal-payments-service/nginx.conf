    listen [::]:443 ssl;
    server_name clubemusa.com.br www.clubemusa.com.br v1.clubemusa.com.br v2.clubemusa.com.br v5.clubemusa.com.br v6.clubemusa.com.br v7.clubemusa.com.br v8.clubemusa.com.br v9.clubemusa.com.br v10.clubemusa.com.br;
