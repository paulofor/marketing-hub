############################
# UPSTREAMS
############################

upstream lead_portal_payments_backend {
    server lead-portal-payments-service:8080;
}

# Upgrade header p/ WebSocket / SSE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# formato com host/porta do upstream, IP/porta real, URI+query e tempos
# - ext_uri mostra exatamente o que chegou do cliente
# - int_uri informa para onde o request foi encaminhado (host interno + path)
log_format upstream_tap '$remote_addr - $host "$request" '
                        'ext_uri="$scheme://$host$request_uri" '
                        'int_uri="$proxy_internal_uri" '
                        'u_ip=$upstream_addr '
                        'status=$status u_status=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time';

# Quando não houver upstream (ex.: respostas 301 ou erros antes do proxy)
# o valor fica "-", evitando strings vazias como "http:///"
map $upstream_addr $proxy_internal_uri {
    ''      '-';
    default 'http://$upstream_addr$uri$is_args$args';
}

############################
# pagamentopalf.online
############################

# HTTP (porta 80): ACME liberado, resto redireciona pra HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pagamentopalf.online www.pagamentopalf.online;

    # ⬇️ envia os logs de acesso para o stdout do contêiner
    access_log /dev/stdout upstream_tap;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # De novo: deixar /.well-known/acme-challenge/ acessível em HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (porta 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pagamentopalf.online www.pagamentopalf.online;
    access_log /dev/stdout upstream_tap;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Permite uploads até o limite aceito pelo backend
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/certs/live/pagamentopalf.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/pagamentopalf.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Backend payments
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://lead_portal_payments_backend;
    }
}
