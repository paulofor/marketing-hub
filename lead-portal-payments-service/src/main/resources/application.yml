server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lead-portal-payments-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:marketing_hub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASS:Ab9!rG4wX8_tMq2Bz7#HpK5V}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:db/changelog/lead-portal-purchase-add-checkout-expires.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

mercado-pago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:APP_USR-6371948622467215-020511-5317ef62bbd997d52c2979a29f2c8419-133771061}
  base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:https://pagamentopalf.online/api/v1/mercadopago/webhook}
  success-url: ${MERCADO_PAGO_SUCCESS_URL:https://pagamentopalf.online/checkout}
  failure-url: ${MERCADO_PAGO_FAILURE_URL:https://pagamentopalf.online/checkout}
  pending-url: ${MERCADO_PAGO_PENDING_URL:https://pagamentopalf.online/checkout}
  statement-descriptor: ${MERCADO_PAGO_STATEMENT_DESCRIPTOR:MarketingHub}

payments:
  default-amount: ${PAYMENTS_DEFAULT_AMOUNT:49.90}
  default-currency: ${PAYMENTS_DEFAULT_CURRENCY:BRL}
  checkout-ttl: ${PAYMENTS_CHECKOUT_TTL:PT72H}

delivery:
  enabled: ${DELIVERY_ENABLED:true}
  batch-size: ${DELIVERY_BATCH_SIZE:3}
  max-attempts: ${DELIVERY_MAX_ATTEMPTS:5}
  initial-delay: ${DELIVERY_INITIAL_DELAY:20000}
  fixed-delay: ${DELIVERY_FIXED_DELAY:60000}
