server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lead-portal-payments-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:marketing_hub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASS:Ab9!rG4wX8_tMq2Bz7#HpK5V}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:db/changelog/lead-portal-purchase-add-checkout-expires.sql
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
        transport:
          protocol: smtp

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

mercado-pago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:APP_USR-6371948622467215-020511-5317ef62bbd997d52c2979a29f2c8419-133771061}
  base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:https://pagamentopalf.online/api/v1/mercadopago/webhook}
  success-url: ${MERCADO_PAGO_SUCCESS_URL:https://pagamentopalf.online/pagamento/sucesso}
  failure-url: ${MERCADO_PAGO_FAILURE_URL:https://pagamentopalf.online/pagamento/falha}
  pending-url: ${MERCADO_PAGO_PENDING_URL:}
  statement-descriptor: ${MERCADO_PAGO_STATEMENT_DESCRIPTOR:MarketingHub}

lead-portal:
  storage:
    bucket: ${LEAD_PORTAL_STORAGE_BUCKET:leadportal}
    endpoint: ${LEAD_PORTAL_STORAGE_ENDPOINT:}
    access-key-id: ${LEAD_PORTAL_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${LEAD_PORTAL_STORAGE_SECRET_ACCESS_KEY:}
    region: ${LEAD_PORTAL_STORAGE_REGION:auto}
    public-base-url: ${LEAD_PORTAL_STORAGE_PUBLIC_BASE_URL:}
    originals-prefix: ${LEAD_PORTAL_ORIGINALS_PREFIX:originals}

payments:
  default-amount: ${PAYMENTS_DEFAULT_AMOUNT:49.90}
  default-currency: ${PAYMENTS_DEFAULT_CURRENCY:BRL}
  checkout-ttl: ${PAYMENTS_CHECKOUT_TTL:PT72H}

delivery:
  enabled: ${DELIVERY_ENABLED:true}
  batch-size: ${DELIVERY_BATCH_SIZE:3}
  max-attempts: ${DELIVERY_MAX_ATTEMPTS:5}
  initial-delay: ${DELIVERY_INITIAL_DELAY:20000}
  fixed-delay: ${DELIVERY_FIXED_DELAY:60000}

email:
  from: ${EMAIL_FROM_ADDRESS:no-reply@marketinghub}
  reply-to: ${EMAIL_REPLY_TO:}
  subject: ${EMAIL_SUBJECT:Suas imagens originais estão prontas}
