version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: lead-portal-backend
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: lead-portal-frontend
    expose:
      - "80"

  proxy:
    image: nginx:1.25-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/proxy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
