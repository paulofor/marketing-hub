services:
  backend:
    build:
      context: ./backend
    image: lead-portal-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: marketing_hub_user
      SPRING_DATASOURCE_PASSWORD: Ab9!rG4wX8_tMq2Bz7#HpK5V
      LEAD_PORTAL_STORAGE_BUCKET: lead-portal
      LEAD_PORTAL_STORAGE_ENDPOINT: https://95b059f4f73518a658d07a19438f38c9.r2.cloudflarestorage.com
      LEAD_PORTAL_STORAGE_ACCESS_KEY_ID: fafc943bd27d2a1c55c84f80778994a0
      LEAD_PORTAL_STORAGE_SECRET_ACCESS_KEY: 4ee618dd20bb752711ee0242469a70fadb9bdc0c921ded7e1177eeb681ddfc54
      LEAD_PORTAL_STORAGE_REGION: auto
      LEAD_PORTAL_STORAGE_PUBLIC_BASE_URL: https://95b059f4f73518a658d07a19438f38c9.r2.cloudflarestorage.com
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
        ipv4_address: 172.30.0.2
      public-net:
        aliases:
          - lead-backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: lead-portal-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        ipv4_address: 172.30.0.3
      public-net:
        aliases:
          - lead-frontend

  proxy:
    image: nginx:1.25-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
       # nossa config nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # webroot para desafios ACME
      - ./docker/proxy/html:/usr/share/nginx/html

      # certificados emitidos pelo certbot no host
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.4
      public-net:
        aliases:
          - public-proxy

  certbot-sandboxcodex:
    image: certbot/certbot:latest
    profiles:
      - certbot
    depends_on:
      proxy:
        condition: service_started
    environment:
      CERTBOT_EMAIL: "paulofore@gmail.com.br"
    command: >-
      sh -c "
        certbot certonly --non-interactive --agree-tos --no-eff-email \
          --email \"${CERTBOT_EMAIL}\" \
          --webroot --webroot-path=/var/www/certbot \
          -d sandboxcodex.shop -d www.sandboxcodex.shop
      "
    volumes:
      - ./docker/proxy/html:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/log/letsencrypt:/var/log/letsencrypt
    restart: "no"
    networks:
      default:
        ipv4_address: 172.30.0.6

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  public-net:
    name: public-net
    external: true
