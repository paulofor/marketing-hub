services:
  backend:
    build:
      context: ./backend
    image: lead-portal-backend
    expose:
      - "8080"
    networks:
      default: {}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: lead-portal-frontend
    expose:
      - "80"
    networks:
      default: {}
      public-net:
        aliases:
          - lead-frontend

  proxy:
    image: nginx:1.25-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # vamos montar os certificados emitidos depois (ver passo 3)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # webroot compartilhado com certbot, agora RW
      - ./docker/proxy/html:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      default: {}
      public-net:
        aliases:
          - public-proxy

networks:
  default: {}
  public-net:
    name: public-net
    external: true
