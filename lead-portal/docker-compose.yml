services:
  backend:
    build:
      context: ./backend
    image: lead-portal-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lead_portal?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: leadportal
      SPRING_DATASOURCE_PASSWORD: leadportal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
        ipv4_address: 172.30.0.2
      public-net:
        aliases:
          - lead-backend

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: leadportal
      MYSQL_DATABASE: lead_portal
      MYSQL_USER: leadportal
      MYSQL_PASSWORD: leadportal
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pleadportal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        ipv4_address: 172.30.0.5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: lead-portal-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        ipv4_address: 172.30.0.3
      public-net:
        aliases:
          - lead-frontend

  proxy:
    image: nginx:1.25-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
       # nossa config nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # webroot para desafios ACME
      - ./docker/proxy/html:/usr/share/nginx/html

      # certificados emitidos pelo certbot no host
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.4
      public-net:
        aliases:
          - public-proxy

  certbot-sandboxcodex:
    image: certbot/certbot:latest
    profiles:
      - certbot
    depends_on:
      proxy:
        condition: service_started
    environment:
      CERTBOT_EMAIL: "paulofore@gmail.com.br"
    command: >-
      sh -c "
        certbot certonly --non-interactive --agree-tos --no-eff-email \
          --email \"${CERTBOT_EMAIL}\" \
          --webroot --webroot-path=/var/www/certbot \
          -d sandboxcodex.shop -d www.sandboxcodex.shop
      "
    volumes:
      - ./docker/proxy/html:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/log/letsencrypt:/var/log/letsencrypt
    restart: "no"
    networks:
      default:
        ipv4_address: 172.30.0.6

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  public-net:
    name: public-net
    external: true
