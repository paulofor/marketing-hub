upstream lead_portal_backend {
    server backend:8080;
}

upstream lead_portal_frontend {
    server frontend:80;
}

upstream ai_hub_backend {
    # Marketing Hub backend published on the host (currently exposed on 8080)
    server host.docker.internal:8080;
}

upstream ai_hub_frontend {
    # Marketing Hub frontend published on the host (served on port 5173)
    server host.docker.internal:5173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://ai_hub_frontend;
    }

    location /api/ {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://ai_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }

    location = /api {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://ai_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }
}

