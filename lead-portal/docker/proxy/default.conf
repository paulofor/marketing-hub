upstream lead_portal_backend {
    server lead-backend:8080;
}

upstream lead_portal_frontend {
    server lead-frontend:80;
}

upstream vitrines_backend {
    # Vitrines backend published on the host (served on port 8085)
    server host.docker.internal:8085;
}

upstream vitrines_frontend {
    # Vitrines frontend published on the host (served on port 4173)
    server host.docker.internal:4173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name oportunidadenegocio.shop www.oportunidadenegocio.shop;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Allow ACME HTTP-01 challenges for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://lead_portal_frontend;
    }

    location /api/ {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://lead_portal_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }

    location = /api {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://lead_portal_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }
}

