#######################
# iahub.sbs - HTTP only temporário
#######################

server {
    listen 80;
    listen [::]:80;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Desafio ACME precisa servir desse path
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # (enquanto ainda não tem SSL válido, NÃO redireciona pra https
    # senão você redireciona pro 443 que ainda não existe e o browser vai quebrar)
    # Durante a emissão inicial, deixe apontar direto pro app:
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ai_hub_frontend;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend/;
    }

    location = /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend/;
    }
}

