############################
# UPSTREAMS (precisam ficar antes dos 'server { }')
############################

upstream ai_hub_backend {
    server host.docker.internal:8080;
}

upstream ai_hub_frontend {
    server host.docker.internal:5173;
}

# Upgrade header p/ WebSocket / SSE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# formato com host/porta do upstream, IP/porta real, URI+query e tempos
log_format upstream_tap '$remote_addr - $host "$request" '
                        'u_host=$proxy_host u_ip=$upstream_addr '
                        'u_uri="$uri$is_args$args" '
                        'status=$status u_status=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time';


############################
# iahub.sbs
############################

# HTTP (porta 80): expõe ACME e redireciona o resto pra HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # EXCEÇÃO: Let's Encrypt precisa chegar aqui em HTTP puro
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Todo o resto força HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (porta 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Certificados emitidos pelo certbot (montados via /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/iahub.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iahub.sbs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend iahub
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ai_hub_frontend;
    }

    # Backend iahub (/api e websocket/event-stream)
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend;
    }

    location = /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend;
    }
}

############################
# oportunidadebrasil.shop
############################

# HTTP (porta 80): ACME liberado, resto redireciona pra HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name oportunidadebrasil.shop www.oportunidadebrasil.shop;

    # ⬇️ ative o access log com o formato acima (arquivo dedicado por vhost ajuda no debug)
    access_log /var/log/nginx/oportunidade.access.log upstream_tap;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # De novo: deixar /.well-known/acme-challenge/ acessível em HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (porta 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oportunidadebrasil.shop www.oportunidadebrasil.shop;
    access_log /dev/stdout upstream_tap;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $lead_portal_frontend_upstream http://lead-frontend:80;
    set $lead_portal_backend_upstream http://lead-backend:8080;

    # Permite uploads de imagens até o limite aceito pelo backend (10 MB)
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/oportunidadebrasil.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oportunidadebrasil.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend lead portal
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ /index.html;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $lead_portal_frontend_upstream;
    }

    # Backend lead portal
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $lead_portal_backend_upstream;
    }

    location = /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $lead_portal_backend_upstream;
    }
}
