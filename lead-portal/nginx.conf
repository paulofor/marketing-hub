############################
# UPSTREAMS (precisam ficar antes dos 'server { }')
############################

upstream vitrines_backend {
    server host.docker.internal:8085;
}

upstream vitrines_frontend {
    server host.docker.internal:4173;
}

# Upgrade header p/ WebSocket / SSE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# formato com host/porta do upstream, IP/porta real, URI+query e tempos
# - ext_uri mostra exatamente o que chegou do cliente
# - int_uri informa para onde o request foi encaminhado (host interno + path)
log_format upstream_tap '$remote_addr - $host "$request" '
                        'ext_uri="$scheme://$host$request_uri" '
                        'int_uri="$proxy_internal_uri" '
                        'u_ip=$upstream_addr '
                        'status=$status u_status=$upstream_status '
                        'rt=$request_time urt=$upstream_response_time';

# Quando não houver upstream (ex.: respostas 301 ou erros antes do proxy)
# o valor fica "-", evitando strings vazias como "http:///"
map $upstream_addr $proxy_internal_uri {
    ''      '-';
    default 'http://$upstream_addr$uri$is_args$args';
}

############################
# oportunidadebrasil.shop
############################

# HTTP (porta 80): ACME liberado, resto redireciona pra HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name oportunidadebrasil.shop www.oportunidadebrasil.shop;

    # ⬇️ envia os logs de acesso para o stdout do contêiner
    access_log /dev/stdout upstream_tap;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # De novo: deixar /.well-known/acme-challenge/ acessível em HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (porta 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oportunidadebrasil.shop www.oportunidadebrasil.shop;
    access_log /dev/stdout upstream_tap;

    resolver 127.0.0.11 valid=30s ipv6=off;

    set $lead_portal_frontend_upstream http://lead-frontend:80;
    set $lead_portal_backend_upstream http://lead-backend:8080;

    # Permite uploads de imagens até o limite aceito pelo backend (10 MB)
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/oportunidadebrasil.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oportunidadebrasil.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend lead portal
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $lead_portal_frontend_upstream;
    }

    # Backend lead portal
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $lead_portal_backend_upstream;
    }

    location = /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $lead_portal_backend_upstream;
    }

}

############################
# sandboxcodex.shop
############################

# HTTP (porta 80): encaminha diretamente para o orquestrador (sem HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name sandboxcodex.shop www.sandboxcodex.shop;

    # ⬇️ envia os logs de acesso para o stdout do contêiner
    access_log /dev/stdout upstream_tap;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $sandboxcodex_upstream http://sandbox-orchestrator:8080;

    # Mantém o caminho ACME disponível caso o certificado seja gerado futuramente
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass $sandboxcodex_upstream;
    }
}

############################
# vitrineproduto.shop
############################

# HTTP (porta 80): encaminha para a vitrine (sem HTTPS por enquanto)
server {
    listen 80;
    listen [::]:80;
    server_name vitrineproduto.shop www.vitrineproduto.shop;

    access_log /dev/stdout upstream_tap;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Mantém o caminho ACME disponível caso o certificado seja gerado futuramente
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Frontend vitrine
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://vitrines_frontend;
    }

    # Backend vitrine
    location /vitrines/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://vitrines_backend;
    }

    location = /vitrines/api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://vitrines_backend;
    }
}
