upstream lead_portal_backend {
    server backend:8080;
}

upstream lead_portal_frontend {
    server frontend:80;
}

upstream ai_hub_backend {
    server host.docker.internal:8000;
}

upstream ai_hub_frontend {
    server host.docker.internal:5173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

#######################
# iahub.sbs
#######################

# Porta 80 -> só ACME e redirect
server {
    listen 80;
    listen [::]:80;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # deixamos o desafio ACME sem redirect
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # todo o resto força HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Porta 443 com TLS válido
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/nginx/certs/iahub.sbs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/iahub.sbs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ai_hub_frontend;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend/;
    }

    location = /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend/;
    }
}

