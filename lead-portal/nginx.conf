# ---------------------------
# BACKENDS / UPSTREAMS
# ---------------------------

upstream lead_portal_backend {
    server backend:8080;
}

upstream lead_portal_frontend {
    server frontend:80;
}

upstream ai_hub_backend {
    # backend do iahub rodando no host (você já exportou host.docker.internal via extra_hosts no compose)
    server host.docker.internal:8000;
}

upstream ai_hub_frontend {
    # frontend do iahub rodando no host na porta 5173
    server host.docker.internal:5173;
}

# Upgrade header pra WebSocket / SSE
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

#######################
# iahub.sbs - HTTP only temporário
#######################

server {
    listen 80;
    listen [::]:80;
    server_name iahub.sbs www.iahub.sbs;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Desafio ACME (Let's Encrypt HTTP-01)
    # A CA vai tentar pegar esse arquivo via HTTP puro na porta 80.
    # Ele PRECISA responder 200 aqui.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Frontend do iahub (sem redirect pra https ainda!)
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ai_hub_frontend;
    }

    # Backend /api do iahub
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend/;
    }

    location = /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://ai_hub_backend/;
    }
}

