version: '3.9'
services:
  market-research-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinghub/market-research-service:latest
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-marketing_hub_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-Ab9!rG4wX8_tMq2Bz7#HpK5V}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-o3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MARKET_RESEARCH_HTTP_TIMEOUT: ${MARKET_RESEARCH_HTTP_TIMEOUT:-PT12S}
      MARKET_RESEARCH_MAX_CONTEXT_LENGTH: ${MARKET_RESEARCH_MAX_CONTEXT_LENGTH:-8000}
      MARKET_RESEARCH_PER_SOURCE_MAX_LENGTH: ${MARKET_RESEARCH_PER_SOURCE_MAX_LENGTH:-2000}
    ports:
      - "8093:8080"
    volumes:
      - /etc/openai/chave:/run/secrets/openai_api_key:ro
