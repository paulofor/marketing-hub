version: '3.9'
services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinghub/mcp-server:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: marketing_hub_user
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASS}
      MCP_PDE_DATASOURCE_URL: ${MCP_PDE_DATASOURCE_URL:-${PDE_ACCESS_JDBC_URL:-}}
      MCP_PDE_DATASOURCE_USERNAME: ${MCP_PDE_DATASOURCE_USERNAME:-${PDE_ACCESS_JDBC_USERNAME:-}}
      MCP_PDE_DATASOURCE_PASSWORD: ${MCP_PDE_DATASOURCE_PASSWORD:-${PDE_ACCESS_JDBC_PASSWORD:-}}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-marketing-hub-mcp}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-1.0.0}
      MCP_LOG_BACKEND_PATH: ${MCP_LOG_BACKEND_PATH:-http://191.252.181.168:8099/ops-mh-observability-v2/backend-log-stream-x9k}
      MCP_LOG_AI_WORKER_PATH: ${MCP_LOG_AI_WORKER_PATH:-http://191.252.210.83:4567/worker-observability/logfile}
      MCP_LOG_LEAD_PORTAL_PATH: ${MCP_LOG_LEAD_PORTAL_PATH:-https://oportunidadebrasil.shop/api/ops-lp-observability-v2/logfile}
      MCP_LOG_FACEBOOK_ADS_PATH: ${MCP_LOG_FACEBOOK_ADS_PATH:-http://191.252.210.83:8082/public/runtime-logs/tail?lines=300}
      MCP_LOG_CUSTOMER_AGENT_WORKER_PATH: ${MCP_LOG_CUSTOMER_AGENT_WORKER_PATH:-http://163.245.202.80:8099/ops-customer-agent-observability-v1/customer-agent-worker-log}
      MCP_LOG_FINANCIAL_AGENT_WORKER_PATH: ${MCP_LOG_FINANCIAL_AGENT_WORKER_PATH:-http://163.245.202.80:8095/ops-financial-agent-observability-v1/financial-agent-worker-log}
      MCP_LOG_EXPERIMENT_STRATEGIST_WORKER_PATH: ${MCP_LOG_EXPERIMENT_STRATEGIST_WORKER_PATH:-http://163.245.202.80:8096/ops-experiment-strategist-observability-v1/logfile}
      MCP_LOG_META_AD_APPROVER_WORKER_PATH: ${MCP_LOG_META_AD_APPROVER_WORKER_PATH:-http://163.245.202.80:8097/ops-meta-ad-approver-observability-v1/logfile}
      MCP_LOG_THEMIS_IMAGE_STUDIO_PATH: ${MCP_LOG_THEMIS_IMAGE_STUDIO_PATH:-http://163.245.202.80:8098/ops-meta-ad-approver-observability-v1/logfile}
      MCP_LOG_LANDING_GENERATOR_AGENT_WORKER_PATH: ${MCP_LOG_LANDING_GENERATOR_AGENT_WORKER_PATH:-http://163.245.202.80:8100/ops-landing-generator-observability-v1/logfile}
      MCP_LOG_PDE_PLATFORM_BACKEND_PATH: ${MCP_LOG_PDE_PLATFORM_BACKEND_PATH:-http://163.245.200.7:8096/actuator/logfile}
      MCP_CHAT_LOG_ALLOWED_CONTAINERS: ${MCP_CHAT_LOG_ALLOWED_CONTAINERS:-marketinghub-fashion-chat,product-discovery-worker}
      MCP_DOCKER_OPS_ENABLED: ${MCP_DOCKER_OPS_ENABLED:-true}
      MCP_DOCKER_OPS_ALLOWED_CONTAINERS: ${MCP_DOCKER_OPS_ALLOWED_CONTAINERS:-marketinghub-backend,marketinghub-fashion-chat,product-discovery-worker,mcp-server}
      MCP_DOCKER_OPS_RESTART_ENABLED: ${MCP_DOCKER_OPS_RESTART_ENABLED:-false}
      MCP_VPS_HOST_INVENTORY_ENABLED: ${MCP_VPS_HOST_INVENTORY_ENABLED:-true}
      MCP_VPS_HOST_INVENTORY_ALLOWED_HOSTS: ${MCP_VPS_HOST_INVENTORY_ALLOWED_HOSTS:-191.252.210.83,191.252.120.96,191.252.181.168,191.252.102.54,177.153.62.107,163.245.200.7}
      MCP_VPS_HOST_INVENTORY_USER: ${MCP_VPS_HOST_INVENTORY_USER:-root}
      MCP_VPS_HOST_INVENTORY_IDENTITY_FILE: ${MCP_VPS_HOST_INVENTORY_IDENTITY_FILE:-/opt/marketinghub/mcp/ssh/id_ed25519}
      MCP_VPS_HOST_INVENTORY_KNOWN_HOSTS_FILE: ${MCP_VPS_HOST_INVENTORY_KNOWN_HOSTS_FILE:-/opt/marketinghub/mcp/ssh/known_hosts}
      MCP_PRODUCT_DISCOVERY_WORKER_CONTAINER: ${MCP_PRODUCT_DISCOVERY_WORKER_CONTAINER:-product-discovery-worker}
      MCP_LOG_PRODUCT_DISCOVERY_WORKER_PATH: ${MCP_LOG_PRODUCT_DISCOVERY_WORKER_PATH:-http://191.252.120.96:18081/ops-product-discovery-observability-v1/logfile}
      MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_URL: ${MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_URL:-http://191.252.120.96:18081/healthz}
      MCP_LOG_GROWTH_OPERATOR_WORKER_PATH: ${MCP_LOG_GROWTH_OPERATOR_WORKER_PATH:-http://163.245.202.80:8094/ops-growth-operator-observability-v1/logfile}
      MCP_GROWTH_OPERATOR_WORKER_HEALTH_URL: ${MCP_GROWTH_OPERATOR_WORKER_HEALTH_URL:-http://163.245.202.80:8094/ops-growth-operator-observability-v1/health}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/marketinghub/mcp/ssh:/opt/marketinghub/mcp/ssh:ro
    expose:
      - "8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/actuator/health/liveness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: marketinghub-mcp-nginx
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${MCP_NGINX_CONF:-default.http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
