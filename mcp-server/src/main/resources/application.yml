server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: mcp-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:marketing_hub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASS:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:0}

management:
  health:
    db:
      enabled: false
  endpoint:
    logfile:
      enabled: true
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,logfile
      path-mapping:
        logfile: mcp-runtime-log

logging:
  file:
    name: ${LOG_FILE_NAME:/tmp/mcp-server.log}

mcp:
  server-name: ${MCP_SERVER_NAME:marketing-hub-mcp}
  server-version: ${MCP_SERVER_VERSION:1.0.0}
  logs:
    backend-path: ${MCP_LOG_BACKEND_PATH:http://191.252.120.96:4567/worker-observability/logfile}
    ai-worker-path: ${MCP_LOG_AI_WORKER_PATH:http://191.252.120.96:4567/worker-observability/logfile}
    lead-portal-path: ${MCP_LOG_LEAD_PORTAL_PATH:http://191.252.120.96:8082/public/runtime-logs/tail?lines=300}
    facebook-ads-path: ${MCP_LOG_FACEBOOK_ADS_PATH:http://191.252.120.96:8082/public/runtime-logs/tail?lines=300}
    email-service-path: ${MCP_LOG_EMAIL_SERVICE_PATH:http://191.252.120.96:8086/ops-email-gateway-7xk9/email-service-audit-log}
    lead-portal-payment-path: ${MCP_LOG_LEAD_PORTAL_PAYMENT_PATH:http://163.245.200.7:8092/api/v1/logs/runtime?lines=200}
    mds-path: ${MCP_LOG_MDS_PATH:http://177.153.62.107:8091/actuator/logfile}
    mois-path: ${MCP_LOG_MOIS_PATH:http://191.252.120.96:8097/actuator/logfile}
    mois-sales-library-worker-path: ${MCP_LOG_MOIS_SALES_LIBRARY_WORKER_PATH:http://191.252.120.96:8097/actuator/logfile}
    mois-hotmart-path: ${MCP_LOG_MOIS_HOTMART_PATH:http://177.153.62.107:8096/ops-monitor/mois-hotmart-log}
    clickbank-coletor-mois-path: ${MCP_LOG_CLICKBANK_COLETOR_MOIS_PATH:http://177.153.62.107:9096/internal/ops-monitor/logfile}
    oprm-coletor-receita-path: ${MCP_LOG_OPRM_COLETOR_RECEITA_PATH:http://191.252.120.96:8094/actuator/logfile}
    ops-monitor-worker-path: ${MCP_LOG_OPS_MONITOR_WORKER_PATH:http://191.252.120.96:8098/actuator/logfile}
    pde-platform-backend-path: ${MCP_LOG_PDE_PLATFORM_BACKEND_PATH:http://163.245.200.7:8096/actuator/logfile}
    video-management-service-path: ${MCP_LOG_VIDEO_MANAGEMENT_SERVICE_PATH:http://177.153.62.107:8095/actuator/logfile}
    fetch-timeout-seconds: ${MCP_LOG_FETCH_TIMEOUT_SECONDS:45}
    fetch-attempts: ${MCP_LOG_FETCH_ATTEMPTS:3}
    fetch-retry-delay-millis: ${MCP_LOG_FETCH_RETRY_DELAY_MILLIS:400}
    max-lines: ${MCP_LOG_MAX_LINES:500}
    http-tail-range-bytes: ${MCP_LOG_HTTP_TAIL_RANGE_BYTES:262144}
  chat-logs:
    enabled: ${MCP_CHAT_LOG_ENABLED:true}
    allowed-containers: ${MCP_CHAT_LOG_ALLOWED_CONTAINERS:marketinghub-fashion-chat,product-discovery-worker}
    docker-command: ${MCP_CHAT_LOG_DOCKER_COMMAND:docker}
    max-lines: ${MCP_CHAT_LOG_MAX_LINES:500}
    timeout-seconds: ${MCP_CHAT_LOG_TIMEOUT_SECONDS:20}
  product-discovery-worker:
    enabled: ${MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_ENABLED:true}
    container: ${MCP_PRODUCT_DISCOVERY_WORKER_CONTAINER:product-discovery-worker}
    docker-command: ${MCP_PRODUCT_DISCOVERY_WORKER_DOCKER_COMMAND:${MCP_CHAT_LOG_DOCKER_COMMAND:docker}}
    health-url: ${MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_URL:http://127.0.0.1:8080/healthz}
    timeout-seconds: ${MCP_PRODUCT_DISCOVERY_WORKER_HEALTH_TIMEOUT_SECONDS:10}
  meta:
    enabled: ${MCP_META_ENABLED:true}
    graph-base-url: ${MCP_META_GRAPH_BASE_URL:https://graph.facebook.com}
    graph-version: ${MCP_META_GRAPH_VERSION:v23.0}
    access-token: ${MCP_META_GRAPH_ACCESS_TOKEN:}
    debug-access-token: ${MCP_META_GRAPH_DEBUG_ACCESS_TOKEN:${MCP_META_GRAPH_ACCESS_TOKEN:}}
    docs-allowed-hosts: ${MCP_META_DOCS_ALLOWED_HOSTS:developers.facebook.com,business.facebook.com,www.facebook.com}
  github:
    enabled: ${MCP_GITHUB_ENABLED:false}
    api-base-url: ${MCP_GITHUB_API_BASE_URL:https://api.github.com}
    owner: ${MCP_GITHUB_OWNER:}
    repo: ${MCP_GITHUB_REPO:}
    token: ${MCP_GITHUB_TOKEN:}
  pde:
    datasource:
      url: ${MCP_PDE_DATASOURCE_URL:}
      username: ${MCP_PDE_DATASOURCE_USERNAME:}
      password: ${MCP_PDE_DATASOURCE_PASSWORD:}
      driver-class-name: ${MCP_PDE_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
