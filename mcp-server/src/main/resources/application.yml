server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: mcp-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://d555d.vps-kinghost.net:3306/marketinghubdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:marketing_hub_user}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASS:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mcp:
  server-name: ${MCP_SERVER_NAME:marketing-hub-mcp}
  server-version: ${MCP_SERVER_VERSION:1.0.0}
  api-key: ${MCP_API_KEY:}
  logs:
    backend-path: ${MCP_LOG_BACKEND_PATH:http://191.252.181.168:8000/ops-mh-observability-v2/backend-log-stream-x9k}
    ai-worker-path: ${MCP_LOG_AI_WORKER_PATH:/var/log/ai-worker/application.log}
    lead-portal-path: ${MCP_LOG_LEAD_PORTAL_PATH:https://oportunidadebrasil.shop/api/ops-lp-observability-v2/logfile}
    facebook-ads-path: ${MCP_LOG_FACEBOOK_ADS_PATH:/var/log/facebook-ads-worker/application.log}
    max-lines: ${MCP_LOG_MAX_LINES:500}
