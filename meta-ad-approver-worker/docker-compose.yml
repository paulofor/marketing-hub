services:
  meta-ad-approver-worker:
    image: ${META_AD_APPROVER_IMAGE:-marketing-hub/meta-ad-approver-worker:local}
    restart: unless-stopped
    init: true
    build:
      context: .
      args:
        CODEX_VERSION: "0.146.0"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      MARKETING_HUB_REPOSITORY: /workspace/marketing-hub
      MARKETING_HUB_URL: ${MARKETING_HUB_URL:-http://backend:8000}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-high}
      META_AD_APPROVER_CODEX_TIMEOUT: ${META_AD_APPROVER_CODEX_TIMEOUT:-PT40M}
      TEMIS_COMMERCIAL_MODEL_INACTIVITY_TIMEOUT: ${TEMIS_COMMERCIAL_MODEL_INACTIVITY_TIMEOUT:-PT10M}
      TEMIS_COMMERCIAL_MODEL_ABSOLUTE_TIMEOUT: ${TEMIS_COMMERCIAL_MODEL_ABSOLUTE_TIMEOUT:-PT40M}
      TEMIS_COMMERCIAL_MODEL_MAX_ATTEMPTS: ${TEMIS_COMMERCIAL_MODEL_MAX_ATTEMPTS:-2}
      TEMIS_COMMERCIAL_EVIDENCE_PATH: /app/commercial-evidence
      AGENT_HEALTH_KEY: meta-ad-approver
      AGENT_HEALTH_VERSION: "4"
      AGENT_BUILD_REFERENCE: ${AGENT_BUILD_REFERENCE:-local}
      TEMIS_EXECUTION_ROLE: review
      CODEX_HOME: /home/approver/.codex
      CODEX_COMMAND: /workspace/marketing-hub/scripts/codex-oauth-session-safe.sh
    ports:
      - "8097:8097"
    volumes:
      - ${MARKETING_HUB_REPOSITORY_HOST:-..}:/workspace/marketing-hub:ro
      - ${META_AD_APPROVER_CODEX_HOME:?Defina a sessão Codex individual da Têmis}:/home/approver/.codex
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/agent-health-report.mjs"]
      interval: 1m
      timeout: 20s
      retries: 2
      start_period: 30s

  iris-image-studio:
    image: ${IRIS_IMAGE_STUDIO_IMAGE:-marketing-hub/iris-image-studio:local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.image-studio
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      IRIS_EXECUTION_ROLE: image-studio
      SPRING_APPLICATION_NAME: iris-image-studio
      SERVER_PORT: "8098"
      LOG_FILE_NAME: /tmp/iris-image-studio.log
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      IRIS_IMAGE_TIMEOUT: ${IRIS_IMAGE_TIMEOUT:-PT3M}
      IRIS_IMAGE_BACKEND_READ_TIMEOUT: ${IRIS_IMAGE_BACKEND_READ_TIMEOUT:-PT5M}
      IRIS_IMAGE_STUDIO_PENDING_LIMIT: ${IRIS_IMAGE_STUDIO_PENDING_LIMIT:-1}
    ports:
      - "8098:8098"
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8098/ops-meta-ad-approver-observability-v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
