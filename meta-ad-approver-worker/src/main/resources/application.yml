server:
  port: 8097
spring:
  application:
    name: meta-ad-approver-worker
management:
  endpoints:
    web:
      base-path: /ops-meta-ad-approver-observability-v1
      exposure:
        include: health,logfile
  endpoint:
    logfile:
      external-file: ${LOG_FILE_NAME:/tmp/meta-ad-approver-worker.log}
logging:
  file:
    name: ${LOG_FILE_NAME:/tmp/meta-ad-approver-worker.log}
meta-ad-approver:
  backend-url: ${BACKEND_URL:http://backend:8000}
  marketing-hub-url: ${MARKETING_HUB_URL:http://backend:8000}
  repository-path: ${MARKETING_HUB_REPOSITORY:/workspace/marketing-hub}
  codex-command: ${CODEX_COMMAND:codex}
  model: ${CODEX_MODEL:gpt-5.6-sol}
  reasoning-effort: ${CODEX_REASONING_EFFORT:high}
  codex-timeout: ${META_AD_APPROVER_CODEX_TIMEOUT:PT40M}
  backend-connect-timeout: ${META_AD_APPROVER_BACKEND_CONNECT_TIMEOUT:PT10S}
  backend-read-timeout: ${META_AD_APPROVER_BACKEND_READ_TIMEOUT:PT30S}
  pending-limit: ${META_AD_APPROVER_PENDING_LIMIT:3}
