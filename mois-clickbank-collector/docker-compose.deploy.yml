services:
  mois-clickbank-collector:
    image: ${MOIS_HOTMART_COLLECTOR_IMAGE}
    build: null
    container_name: mois-clickbank-collector
    restart: unless-stopped
    environment:
      - COLLECTOR_HOTMART_USERNAME=${COLLECTOR_HOTMART_USERNAME:-}
      - COLLECTOR_HOTMART_PASSWORD=${COLLECTOR_HOTMART_PASSWORD:-}
      - COLLECTOR_HOTMART_SESSION_COOKIE=${COLLECTOR_HOTMART_SESSION_COOKIE:-}
      - COLLECTOR_SCHEDULER_ENABLED=${COLLECTOR_SCHEDULER_ENABLED:-true}
      - COLLECTOR_SCHEDULER_CRON=${COLLECTOR_SCHEDULER_CRON:-0 0 * * * *}
      - COLLECTOR_SCHEDULER_SOURCE=${COLLECTOR_SCHEDULER_SOURCE:-clickbank-market}
      - COLLECTOR_SCHEDULER_MAX_PRODUCTS=${COLLECTOR_SCHEDULER_MAX_PRODUCTS:-25}
    ports:
      - "9096:9096"
