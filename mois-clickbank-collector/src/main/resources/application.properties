spring.application.name=mois-clickbank-collector
server.port=${MOIS_CLICKBANK_PORT:9096}

# Actuator observability

logging.file.name=${APP_LOG_FILE:/app/logs/marketinghub-mois.log}
management.endpoint.logfile.external-file=${logging.file.name}
management.endpoints.web.exposure.include=health,loggers,logfile
management.endpoints.web.base-path=/internal/ops-monitor
management.endpoints.web.path-mapping.logfile=logfile
management.endpoint.health.show-details=always

# Clickbank authenticated collection
collector.playwright.headless=${COLLECTOR_PLAYWRIGHT_HEADLESS:true}
collector.playwright.chromium-executable-path=${COLLECTOR_PLAYWRIGHT_EXECUTABLE_PATH:}
collector.clickbank.search-url=${COLLECTOR_CLICKBANK_SEARCH_URL:https://app.clickbank.com/market/search}
collector.clickbank.top-offers-url=${COLLECTOR_CLICKBANK_TOP_OFFERS_URL:https://www.clickbank.com/blog/clickbank-top-offers/}
collector.clickbank.session-cookie=${COLLECTOR_CLICKBANK_SESSION_COOKIE:}
collector.clickbank.username=${COLLECTOR_CLICKBANK_USERNAME:}
collector.clickbank.password=${COLLECTOR_CLICKBANK_PASSWORD:}
collector.clickbank.username-fallback=${COLLECTOR_CLICKBANK_USERNAME_FALLBACK:}
collector.clickbank.password-fallback=${COLLECTOR_CLICKBANK_PASSWORD_FALLBACK:}
collector.clickbank.graphql-url=${COLLECTOR_CLICKBANK_GRAPHQL_URL:https://accounts.clickbank.com/graphql}

# Automatic execution on even hours
collector.scheduler.enabled=${COLLECTOR_SCHEDULER_ENABLED:true}
collector.scheduler.cron=${COLLECTOR_SCHEDULER_CRON:0 0 */2 * * *}
collector.scheduler.source=${COLLECTOR_SCHEDULER_SOURCE:clickbank-market}
collector.scheduler.max-products=${COLLECTOR_SCHEDULER_MAX_PRODUCTS:25}
