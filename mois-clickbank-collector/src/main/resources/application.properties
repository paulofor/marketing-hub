spring.application.name=mois-clickbank-collector
server.port=${MOIS_HOTMART_PORT:8096}

# Actuator observability

logging.file.name=${APP_LOG_FILE:/app/logs/marketinghub-mois.log}
management.endpoint.logfile.external-file=${logging.file.name}
management.endpoints.web.exposure.include=health,loggers,logfile
management.endpoints.web.base-path=/ops-monitor
management.endpoints.web.path-mapping.logfile=mois-clickbank-log
management.endpoint.health.show-details=always

# Clickbank authenticated collection
collector.playwright.headless=${COLLECTOR_PLAYWRIGHT_HEADLESS:true}
collector.playwright.chromium-executable-path=${COLLECTOR_PLAYWRIGHT_EXECUTABLE_PATH:}
collector.clickbank.search-url=${COLLECTOR_HOTMART_SEARCH_URL:https://app.clickbank.com/market/search}
collector.clickbank.session-cookie=${COLLECTOR_HOTMART_SESSION_COOKIE:}
collector.clickbank.username=paulofore@gmail.com
collector.clickbank.password=FQ3nW5*c.KnrdLY
collector.clickbank.username-fallback=paulofore@gmail.com
collector.clickbank.password-fallback=FQ3nW5*c.KnrdLY

# Automatic hourly execution
collector.scheduler.enabled=${COLLECTOR_SCHEDULER_ENABLED:true}
collector.scheduler.cron=${COLLECTOR_SCHEDULER_CRON:0 0 * * * *}
collector.scheduler.source=${COLLECTOR_SCHEDULER_SOURCE:clickbank-market}
collector.scheduler.max-products=${COLLECTOR_SCHEDULER_MAX_PRODUCTS:25}
