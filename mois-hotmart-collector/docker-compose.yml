services:
  mois-hotmart-collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketinghub/mois-hotmart-collector:0.1.0-snapshot
    container_name: mois-hotmart-collector
    environment:
      - MOIS_HOTMART_PORT=8096
      - COLLECTOR_HOTMART_USERNAME=${COLLECTOR_HOTMART_USERNAME:-}
      - COLLECTOR_HOTMART_PASSWORD=${COLLECTOR_HOTMART_PASSWORD:-}
      - COLLECTOR_HOTMART_SESSION_COOKIE=${COLLECTOR_HOTMART_SESSION_COOKIE:-}
      - COLLECTOR_SCHEDULER_ENABLED=${COLLECTOR_SCHEDULER_ENABLED:-true}
      - COLLECTOR_SCHEDULER_CRON=${COLLECTOR_SCHEDULER_CRON:-0 0 * * * *}
      - COLLECTOR_SCHEDULER_SOURCE=${COLLECTOR_SCHEDULER_SOURCE:-hotmart-market}
      - COLLECTOR_SCHEDULER_MAX_PRODUCTS=${COLLECTOR_SCHEDULER_MAX_PRODUCTS:-25}
    ports:
      - "8096:8096"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/api/v1/mois-hotmart/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
