spring.application.name=mois-hotmart-collector
server.port=${MOIS_HOTMART_PORT:8096}

# Actuator observability

logging.file.name=${APP_LOG_FILE:/app/logs/marketinghub-mois.log}
management.endpoint.logfile.external-file=${logging.file.name}
management.endpoints.web.exposure.include=health,loggers,logfile
management.endpoints.web.base-path=/ops-monitor
management.endpoints.web.path-mapping.logfile=mois-hotmart-log
management.endpoint.health.show-details=always

# Hotmart authenticated collection
collector.playwright.headless=${COLLECTOR_PLAYWRIGHT_HEADLESS:true}
collector.playwright.chromium-executable-path=${COLLECTOR_PLAYWRIGHT_EXECUTABLE_PATH:}
collector.hotmart.search-url=${COLLECTOR_HOTMART_SEARCH_URL:https://app.hotmart.com/market/search}
collector.hotmart.session-cookie=${COLLECTOR_HOTMART_SESSION_COOKIE:}
collector.hotmart.username=${COLLECTOR_HOTMART_USERNAME:}
collector.hotmart.password=${COLLECTOR_HOTMART_PASSWORD:}
collector.hotmart.username-file=${COLLECTOR_HOTMART_USERNAME_FILE:}
collector.hotmart.password-file=${COLLECTOR_HOTMART_PASSWORD_FILE:}
collector.hotmart.username-fallback=
collector.hotmart.password-fallback=

# Automatic scheduler execution
collector.scheduler.enabled=${COLLECTOR_SCHEDULER_ENABLED:false}
collector.scheduler.cron=${COLLECTOR_SCHEDULER_CRON:0 0 * * * *}
collector.scheduler.source=${COLLECTOR_SCHEDULER_SOURCE:hotmart-market}
collector.scheduler.max-products=${COLLECTOR_SCHEDULER_MAX_PRODUCTS:400}
