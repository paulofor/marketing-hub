services:
  mois-meta-ad-library-collector:
    image: ${MOIS_META_AD_LIBRARY_COLLECTOR_IMAGE}
    build: null
    container_name: mois-meta-ad-library-collector
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://191.252.181.168}
      META_AD_LIBRARY_ACCESS_TOKEN: ${RADAR_META_TOKEN:?RADAR_META_TOKEN is required}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8104/actuator/health/readiness | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
