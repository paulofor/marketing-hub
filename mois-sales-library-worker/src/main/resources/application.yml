server:
  port: ${SERVER_PORT:8097}

management:
  endpoint:
    logfile:
      enabled: true
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,logfile

logging:
  file:
    name: ${LOG_FILE_NAME:/tmp/mois-sales-library-worker.log}

spring:
  application:
    name: mois-sales-library-worker
worker:
  backend-base-url: ${BACKEND_BASE_URL:http://191.252.181.168:8000}
  workspace-id: ${MOIS_WORKSPACE_ID:workspace-001}
  source: ${MOIS_SOURCE:CLICKBANK}
  sources: ${MOIS_SOURCES:}
  raw-html-source: ${MOIS_RAW_HTML_SOURCE:HOTMART}
  raw-html-sources: ${MOIS_RAW_HTML_SOURCES:}
  poll-interval-ms: ${MOIS_POLL_INTERVAL_MS:15000}
  raw-html-poll-interval-ms: ${MOIS_RAW_HTML_POLL_INTERVAL_MS:30000}
  html-capture-poll-interval-ms: ${MOIS_HTML_CAPTURE_POLL_INTERVAL_MS:20000}
  html-capture-limit: ${MOIS_HTML_CAPTURE_LIMIT:1}
  html-capture-force: ${MOIS_HTML_CAPTURE_FORCE:false}
  market-warmup-enabled: ${MOIS_MARKET_WARMUP_ENABLED:true}
  market-warmup-poll-interval-ms: ${MOIS_MARKET_WARMUP_POLL_INTERVAL_MS:60000}
  market-warmup-worker-id: ${MOIS_MARKET_WARMUP_WORKER_ID:mois-sales-library-worker-v1}
  market-warmup-search-endpoint: ${MOIS_MARKET_WARMUP_SEARCH_ENDPOINT:https://duckduckgo.com/html/}
  market-warmup-search-limit: ${MOIS_MARKET_WARMUP_SEARCH_LIMIT:6}
  market-warmup-search-user-agent: ${MOIS_MARKET_WARMUP_SEARCH_USER_AGENT:Mozilla/5.0 MarketingHubBot/1.0}
  request-timeout-ms: ${MOIS_REQUEST_TIMEOUT_MS:300000}

openai:
  api-key: ${OPENAI_API_KEY:}
  api-key-file: ${OPENAI_API_KEY_FILE:/run/secrets/openai_api_key}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-5.2}
  batch-poll-interval-ms: ${OPENAI_BATCH_POLL_INTERVAL_MS:2000}
  batch-timeout-ms: ${OPENAI_BATCH_TIMEOUT_MS:1800000}
