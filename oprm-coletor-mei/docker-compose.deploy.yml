services:
  oprm-coletor-mei:
    image: ${OPRM_COLETOR_MEI_IMAGE}
    build: null
    restart: unless-stopped
    environment:
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_API_KEY_FILE: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_MODEL: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_MODEL:-gpt-4.1-mini}
      OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_API_KEY_FILE: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_MODEL: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_MODEL:-gpt-4.1-mini}
      OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_API_KEY_FILE: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_MODEL: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_MODEL:-gpt-5.2}
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
