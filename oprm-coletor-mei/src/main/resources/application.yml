server:
  port: 8094

spring:
  application:
    name: oprm-coletor-mei

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,logfile
  endpoint:
    health:
      probes:
        enabled: true

oprm:
  nichocnae:
    source-searcher:
      google:
        enabled: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_ENABLED:false}
        api-key: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_API_KEY:}
        search-engine-id: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_SEARCH_ENGINE_ID:}
        base-url: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_BASE_URL:https://www.googleapis.com/customsearch/v1}
        date-restrict: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_DATE_RESTRICT:m24}
        country-restrict: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_COUNTRY_RESTRICT:countryBR}
        language-restrict: ${OPRM_NICHO_CNAE_SOURCE_SEARCHER_GOOGLE_LANGUAGE_RESTRICT:lang_pt}
    seed-builder:
      openai:
        base-url: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_API_KEY:${OPENAI_API_KEY:}}
        api-key-file: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_API_KEY_FILE:${OPENAI_API_KEY_FILE:}}
        model: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_MODEL:gpt-5.2}
        service-tier: ${OPRM_NICHO_CNAE_SEED_BUILDER_OPENAI_SERVICE_TIER:flex}
    mei-audience-segmenter:
      openai:
        base-url: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_API_KEY:${OPENAI_API_KEY:}}
        api-key-file: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_API_KEY_FILE:${OPENAI_API_KEY_FILE:}}
        model: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_MODEL:gpt-5.2}
        expected-api-key-variable: OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_API_KEY
        fallback-api-key-variable: OPENAI_API_KEY
        service-tier: ${OPRM_MEI_AUDIENCE_SEGMENTER_OPENAI_SERVICE_TIER:flex}
  pipelines.nichocnae.v3:
    persona-candidate-generator:
      openai:
        base-url: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_API_KEY:${OPENAI_API_KEY:}}
        api-key-file: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_API_KEY_FILE:${OPENAI_API_KEY_FILE:/run/secrets/openai_api_key}}
        model: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_MODEL:gpt-5.2}
        service-tier: ${OPRM_NICHO_CNAE_V3_PERSONA_CANDIDATE_GENERATOR_OPENAI_SERVICE_TIER:flex}

  market-import:
    collector:
      backend-base-url: ${OPRM_COLLECTOR_BACKEND_BASE_URL:http://191.252.181.168}
      temp-dir: ${OPRM_MARKET_IMPORT_TEMP_DIR:/tmp/oprm-cnpj-import}
    schedule:
      enabled: ${OPRM_MARKET_IMPORT_SCHEDULE_ENABLED:true}
      cron: ${OPRM_MARKET_IMPORT_SCHEDULE_CRON:0 20 18 * * *}
      timezone: ${OPRM_MARKET_IMPORT_SCHEDULE_TIMEZONE:America/Sao_Paulo}
      snapshot-date: ${OPRM_MARKET_IMPORT_SNAPSHOT_DATE:2026-06-14}
      source-base-url: ${OPRM_MARKET_IMPORT_SOURCE_BASE_URL:https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos}

logging:
  file:
    name: ${OPRM_COLLECTOR_LOG_FILE:/tmp/oprm-coletor-mei.log}
