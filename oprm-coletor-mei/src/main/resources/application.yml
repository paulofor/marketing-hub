server:
  port: 8094

spring:
  application:
    name: oprm-coletor-mei

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

oprm:
  collector:
    backend-base-url: ${OPRM_COLLECTOR_BACKEND_BASE_URL:http://191.252.181.168:8000}
    batch-size: ${OPRM_COLLECTOR_BATCH_SIZE:500}
