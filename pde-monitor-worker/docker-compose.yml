services:
  pde-monitor-worker:
    build: .
    container_name: pde-monitor-worker
    restart: unless-stopped
    ports:
      - "${PDE_MONITOR_WORKER_PORT:-8099}:${SERVER_PORT:-8099}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8099}
      LOG_FILE_NAME: ${LOG_FILE_NAME:-/tmp/pde-monitor-worker.log}
      PDE_MONITOR_DB_URL: ${PDE_MONITOR_DB_URL:-jdbc:mysql://host.docker.internal:3306/marketinghub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      PDE_MONITOR_DB_USERNAME: ${PDE_MONITOR_DB_USERNAME:-marketinghub}
      PDE_MONITOR_DB_PASSWORD: ${PDE_MONITOR_DB_PASSWORD:-marketinghub}
