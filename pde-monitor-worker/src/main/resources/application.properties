spring.application.name=pde-monitor-worker
server.port=${SERVER_PORT:8099}

spring.datasource.url=${PDE_MONITOR_DB_URL:jdbc:mysql://127.0.0.1:3306/marketinghub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PDE_MONITOR_DB_USERNAME:marketinghub}
spring.datasource.password=${PDE_MONITOR_DB_PASSWORD:marketinghub}
spring.datasource.hikari.maximum-pool-size=${PDE_MONITOR_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

management.endpoints.web.exposure.include=health,info,logfile
management.endpoint.logfile.enabled=true
logging.file.name=${LOG_FILE_NAME:/tmp/pde-monitor-worker.log}

pde-monitor.http.timeout=5s
pde-monitor.http.degraded-response-time-ms=3000
pde-monitor.incident.severity=CRITICAL
