server:
  port: 8096

spring:
  application:
    name: pde-platform-backend

pde:
  access:
    storage-path: ${PDE_ACCESS_STORAGE_PATH:/data/pde/access-grants.json}
    jdbc-url: ${PDE_ACCESS_JDBC_URL:}
    jdbc-username: ${PDE_ACCESS_JDBC_USERNAME:}
    jdbc-password: ${PDE_ACCESS_JDBC_PASSWORD:}
    app-base-url: ${PDE_APP_BASE_URL:http://localhost:5176}
    expose-magic-link-in-response: ${PDE_EXPOSE_MAGIC_LINK_IN_RESPONSE:false}
  auth:
    google:
      client-id: ${PDE_GOOGLE_CLIENT_ID:}
  mail:
    transport: ${PDE_MAIL_TRANSPORT:smtp}
    aws-region: ${PDE_MAIL_AWS_REGION:us-east-1}
    host: ${PDE_SMTP_HOST:}
    port: ${PDE_SMTP_PORT:1025}
    from: ${PDE_MAIL_FROM:${PDE_SMTP_FROM:area-musa@sandbox.local}}
    username: ${PDE_SMTP_USERNAME:}
    password: ${PDE_SMTP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
