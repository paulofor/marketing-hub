server:
  port: 8096

spring:
  application:
    name: pde-platform-backend

pde:
  catalog:
    marketing-hub-base-url: ${PDE_MARKETING_HUB_BASE_URL:}
    experience-version-override: ${PDE_EXPERIENCE_VERSION_OVERRIDE:}
  access:
    storage-path: ${PDE_ACCESS_STORAGE_PATH:/data/pde/access-grants.json}
    jdbc-url: ${PDE_ACCESS_JDBC_URL:}
    jdbc-username: ${PDE_ACCESS_JDBC_USERNAME:}
    jdbc-password: ${PDE_ACCESS_JDBC_PASSWORD:}
    require-jdbc: ${PDE_ACCESS_REQUIRE_JDBC:false}
    app-base-url: ${PDE_APP_BASE_URL:http://localhost:5176}
    expose-magic-link-in-response: ${PDE_EXPOSE_MAGIC_LINK_IN_RESPONSE:false}
    pepper:
      api-base-url: ${PDE_PEPPER_API_BASE_URL:https://api.cloud.pepperpay.com.br/public/v1}
      api-token: ${PDE_PEPPER_API_TOKEN:}
      offer-hashes: ${PDE_PEPPER_OFFER_HASHES:owm6x,c8mnn}
      product-slug: ${PDE_PEPPER_PRODUCT_SLUG:metodo-musa-7-dias}
      sync-lookback-days: ${PDE_PEPPER_SYNC_LOOKBACK_DAYS:14}
      minimum-paid-amount-cents: ${PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS:6700}
  auth:
    google:
      client-id: ${PDE_GOOGLE_CLIENT_ID:}
  ai:
    storage-path: ${PDE_AI_STORAGE_PATH:/data/pde/ai-guidance-requests.json}
  mail:
    transport: ${PDE_MAIL_TRANSPORT:smtp}
    aws-region: ${PDE_MAIL_AWS_REGION:us-east-1}
    host: ${PDE_SMTP_HOST:}
    port: ${PDE_SMTP_PORT:1025}
    from: ${PDE_MAIL_FROM:${PDE_SMTP_FROM:area-musa@sandbox.local}}
    username: ${PDE_SMTP_USERNAME:}
    password: ${PDE_SMTP_PASSWORD:}
  deploy:
    environment: ${PDE_DEPLOY_ENVIRONMENT:local}
    compose-file: ${PDE_DEPLOY_COMPOSE_FILE:docker-compose.yml}
    commit-sha: ${PDE_DEPLOY_COMMIT_SHA:unknown}
    image-tag: ${PDE_DEPLOY_IMAGE_TAG:unknown}
    frontend-url: ${PDE_DEPLOY_FRONTEND_URL:http://localhost:5176}
    backend-url: ${PDE_DEPLOY_BACKEND_URL:http://localhost:8096}
    deployed-at: ${PDE_DEPLOY_DEPLOYED_AT:}
    backend-image: ${PDE_PLATFORM_BACKEND_IMAGE:}
    frontend-image: ${PDE_PLATFORM_FRONTEND_IMAGE:}
    ai-worker-image: ${PDE_AI_WORKER_IMAGE:}
    backend-public-port: ${PDE_DEPLOY_BACKEND_PUBLIC_PORT:8096}
    frontend-public-port: ${PDE_DEPLOY_FRONTEND_PUBLIC_PORT:5176}

management:
  endpoint:
    logfile:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,logfile

logging:
  file:
    name: ${LOGGING_FILE_NAME:/data/pde/pde-platform-backend.log}
