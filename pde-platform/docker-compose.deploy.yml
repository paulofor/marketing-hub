services:
  pde-platform-backend:
    image: ${PDE_PLATFORM_BACKEND_IMAGE:?PDE_PLATFORM_BACKEND_IMAGE is required}
    container_name: pde-platform-backend
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_BACKEND_PORT:-8096}:8096"
    environment:
      PDE_ACCESS_REQUIRE_JDBC: "true"
      PDE_ACCESS_JDBC_URL: ${PDE_ACCESS_JDBC_URL:?PDE_ACCESS_JDBC_URL is required for PDE production analytics}
      PDE_ACCESS_JDBC_USERNAME: ${PDE_ACCESS_JDBC_USERNAME:?PDE_ACCESS_JDBC_USERNAME is required for PDE production analytics}
      PDE_ACCESS_JDBC_PASSWORD: ${PDE_ACCESS_JDBC_PASSWORD:?PDE_ACCESS_JDBC_PASSWORD is required for PDE production analytics}
      PDE_APP_BASE_URL: ${PDE_APP_BASE_URL:-https://clubemusa.com.br}
      PDE_PEPPER_API_TOKEN: ${PDE_PEPPER_API_TOKEN:?PDE_PEPPER_API_TOKEN is required for Pepper paid transaction sync}
      PDE_PEPPER_OFFER_HASHES: ${PDE_PEPPER_OFFER_HASHES:-owm6x,c8mnn}
      PDE_PEPPER_PRODUCT_SLUG: ${PDE_PEPPER_PRODUCT_SLUG:-metodo-musa-7-dias}
      PDE_PEPPER_SYNC_LOOKBACK_DAYS: ${PDE_PEPPER_SYNC_LOOKBACK_DAYS:-14}
      PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS: ${PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS:-6700}
      PDE_MAIL_TRANSPORT: ${PDE_MAIL_TRANSPORT:-ses}
      PDE_MAIL_AWS_REGION: ${PDE_MAIL_AWS_REGION:-us-east-1}
      PDE_MAIL_FROM: ${PDE_MAIL_FROM:-acesso@clubemusa.com.br}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for PDE SES delivery}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for PDE SES delivery}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - pde-platform-data:/data/pde
    networks:
      - pde-platform-net

  pde-platform-frontend:
    image: ${PDE_PLATFORM_FRONTEND_IMAGE:?PDE_PLATFORM_FRONTEND_IMAGE is required}
    container_name: pde-platform-frontend
    depends_on:
      pde-platform-backend:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_FRONTEND_PORT:-5176}:80"
    environment:
      VITE_MUSA_CHECKOUT_URL: ${VITE_MUSA_CHECKOUT_URL:-https://go.pepper.com.br/owm6x}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    networks:
      - pde-platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pde-ai-worker:
    image: ${PDE_AI_WORKER_IMAGE:?PDE_AI_WORKER_IMAGE is required}
    container_name: pde-ai-worker
    depends_on:
      pde-platform-backend:
        condition: service_started
    restart: unless-stopped
    environment:
      PDE_BACKEND_URL: ${PDE_BACKEND_URL:-http://pde-platform-backend:8096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-4000}
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
    networks:
      - pde-platform-net

networks:
  pde-platform-net:
    name: ${PDE_PLATFORM_NETWORK:-public-net}
    external: true

volumes:
  pde-platform-data:
