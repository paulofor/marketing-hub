services:
  pde-platform-backend:
    image: ${PDE_PLATFORM_BACKEND_IMAGE:?PDE_PLATFORM_BACKEND_IMAGE is required}
    container_name: pde-platform-backend
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_BACKEND_PORT:-8096}:8096"
    environment:
      PDE_ACCESS_REQUIRE_JDBC: "true"
      PDE_MARKETING_HUB_BASE_URL: ${PDE_MARKETING_HUB_BASE_URL:-http://191.252.181.168:8000,http://191.252.181.168}
      PDE_EXPERIENCE_VERSION_OVERRIDE: ${PDE_EXPERIENCE_VERSION_OVERRIDE:-musa-pde-entry-v5-video-explicativo}
      PDE_DEPLOY_ENVIRONMENT: ${PDE_DEPLOY_ENVIRONMENT:-production}
      PDE_DEPLOY_COMPOSE_FILE: ${PDE_DEPLOY_COMPOSE_FILE:-docker-compose.deploy.yml}
      PDE_DEPLOY_COMMIT_SHA: ${PDE_DEPLOY_COMMIT_SHA:-unknown}
      PDE_DEPLOY_IMAGE_TAG: ${PDE_DEPLOY_IMAGE_TAG:-unknown}
      PDE_DEPLOY_FRONTEND_URL: ${PDE_DEPLOY_FRONTEND_URL:-https://v5.clubemusa.com.br}
      PDE_DEPLOY_BACKEND_URL: ${PDE_DEPLOY_BACKEND_URL:-http://163.245.200.7:8096}
      PDE_DEPLOY_DEPLOYED_AT: ${PDE_DEPLOY_DEPLOYED_AT:-}
      PDE_DEPLOY_FRONTEND_PUBLIC_PORT: ${PDE_PLATFORM_FRONTEND_V5_PORT:-5176}
      PDE_DEPLOY_BACKEND_PUBLIC_PORT: ${PDE_PLATFORM_BACKEND_PORT:-8096}
      PDE_ACCESS_JDBC_URL: ${PDE_ACCESS_JDBC_URL:?PDE_ACCESS_JDBC_URL is required for PDE production analytics}
      PDE_ACCESS_JDBC_USERNAME: ${PDE_ACCESS_JDBC_USERNAME:?PDE_ACCESS_JDBC_USERNAME is required for PDE production analytics}
      PDE_ACCESS_JDBC_PASSWORD: ${PDE_ACCESS_JDBC_PASSWORD:?PDE_ACCESS_JDBC_PASSWORD is required for PDE production analytics}
      PDE_APP_BASE_URL: ${PDE_APP_BASE_URL:-https://v5.clubemusa.com.br}
      PDE_PEPPER_API_TOKEN: ${PDE_PEPPER_API_TOKEN:?PDE_PEPPER_API_TOKEN is required for Pepper paid transaction sync}
      PDE_PEPPER_OFFER_HASHES: ${PDE_PEPPER_OFFER_HASHES:-owm6x,c8mnn}
      PDE_PEPPER_PRODUCT_SLUG: ${PDE_PEPPER_PRODUCT_SLUG:-metodo-musa-7-dias}
      PDE_PEPPER_SYNC_LOOKBACK_DAYS: ${PDE_PEPPER_SYNC_LOOKBACK_DAYS:-14}
      PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS: ${PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS:-6700}
      PDE_MAIL_TRANSPORT: ${PDE_MAIL_TRANSPORT:-ses}
      PDE_MAIL_AWS_REGION: ${PDE_MAIL_AWS_REGION:-us-east-1}
      PDE_MAIL_FROM: ${PDE_MAIL_FROM:-acesso@clubemusa.com.br}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required for PDE SES delivery}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required for PDE SES delivery}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      PDE_PLATFORM_BACKEND_IMAGE: ${PDE_PLATFORM_BACKEND_IMAGE:-}
      PDE_PLATFORM_FRONTEND_V5_IMAGE: ${PDE_PLATFORM_FRONTEND_V5_IMAGE:-}
      PDE_PLATFORM_FRONTEND_V6_IMAGE: ${PDE_PLATFORM_FRONTEND_V6_IMAGE:-}
      PDE_PLATFORM_FRONTEND_V7_IMAGE: ${PDE_PLATFORM_FRONTEND_V7_IMAGE:-}
      PDE_AI_WORKER_IMAGE: ${PDE_AI_WORKER_IMAGE:-}
    volumes:
      - pde-platform-data:/data/pde
    networks:
      - pde-platform-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8096/actuator/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  pde-platform-frontend-v5:
    image: ${PDE_PLATFORM_FRONTEND_V5_IMAGE:?PDE_PLATFORM_FRONTEND_V5_IMAGE is required}
    container_name: pde-platform-frontend-v5
    depends_on:
      pde-platform-backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_FRONTEND_V5_PORT:-5176}:80"
    environment:
      VITE_MUSA_CHECKOUT_URL: ${VITE_MUSA_CHECKOUT_URL:-https://go.pepper.com.br/owm6x}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_MUSA_EXPERIENCE_VERSION_OVERRIDE: musa-pde-entry-v5-video-explicativo
      VITE_MUSA_HERO_STREAM_URL: ${VITE_MUSA_V5_HERO_STREAM_URL:-}
      VITE_MUSA_HERO_VIDEO_URL: ${VITE_MUSA_V5_HERO_VIDEO_URL:-}
      PDE_FRONTEND_VERSION: v5
      PDE_FRONTEND_PUBLIC_URL: https://v5.clubemusa.com.br
      PDE_FRONTEND_IMAGE: ${PDE_PLATFORM_FRONTEND_V5_IMAGE:-}
      PDE_FRONTEND_VERSION_ID: v5
      PDE_DEPLOY_COMMIT_SHA: ${PDE_DEPLOY_COMMIT_SHA:-unknown}
      PDE_DEPLOY_IMAGE_TAG: ${PDE_DEPLOY_IMAGE_TAG:-unknown}
      PDE_DEPLOY_DEPLOYED_AT: ${PDE_DEPLOY_DEPLOYED_AT:-}
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}
    networks:
      - pde-platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pde-platform-frontend-v6:
    image: ${PDE_PLATFORM_FRONTEND_V6_IMAGE:?PDE_PLATFORM_FRONTEND_V6_IMAGE is required}
    container_name: pde-platform-frontend-v6
    depends_on:
      pde-platform-backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_FRONTEND_V6_PORT:-5177}:80"
    environment:
      VITE_MUSA_CHECKOUT_URL: ${VITE_MUSA_CHECKOUT_URL:-https://go.pepper.com.br/owm6x}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_MUSA_EXPERIENCE_VERSION_OVERRIDE: musa-pde-entry-v6-video-motivacional
      VITE_MUSA_HERO_STREAM_URL: ${VITE_MUSA_V6_HERO_STREAM_URL:-}
      VITE_MUSA_HERO_VIDEO_URL: ${VITE_MUSA_V6_HERO_VIDEO_URL:-}
      PDE_FRONTEND_VERSION: v6
      PDE_FRONTEND_PUBLIC_URL: https://v6.clubemusa.com.br
      PDE_FRONTEND_IMAGE: ${PDE_PLATFORM_FRONTEND_V6_IMAGE:-}
      PDE_FRONTEND_VERSION_ID: v6
      PDE_DEPLOY_COMMIT_SHA: ${PDE_DEPLOY_COMMIT_SHA:-unknown}
      PDE_DEPLOY_IMAGE_TAG: ${PDE_DEPLOY_IMAGE_TAG:-unknown}
      PDE_DEPLOY_DEPLOYED_AT: ${PDE_DEPLOY_DEPLOYED_AT:-}
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}
    networks:
      - pde-platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pde-platform-frontend-v7:
    image: ${PDE_PLATFORM_FRONTEND_V7_IMAGE:?PDE_PLATFORM_FRONTEND_V7_IMAGE is required}
    container_name: pde-platform-frontend-v7
    depends_on:
      pde-platform-backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_FRONTEND_V7_PORT:-5178}:80"
    environment:
      VITE_MUSA_CHECKOUT_URL: ${VITE_MUSA_CHECKOUT_URL:-https://go.pepper.com.br/owm6x}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_MUSA_EXPERIENCE_VERSION_OVERRIDE: musa-pde-entry-v7-espelho-antes-de-sair
      VITE_MUSA_HERO_STREAM_URL: ${VITE_MUSA_V7_HERO_STREAM_URL:-}
      VITE_MUSA_HERO_VIDEO_URL: ${VITE_MUSA_V7_HERO_VIDEO_URL:-}
      PDE_FRONTEND_VERSION: v7
      PDE_FRONTEND_PUBLIC_URL: https://v7.clubemusa.com.br
      PDE_FRONTEND_IMAGE: ${PDE_PLATFORM_FRONTEND_V7_IMAGE:-}
      PDE_FRONTEND_VERSION_ID: v7
      PDE_DEPLOY_COMMIT_SHA: ${PDE_DEPLOY_COMMIT_SHA:-unknown}
      PDE_DEPLOY_IMAGE_TAG: ${PDE_DEPLOY_IMAGE_TAG:-unknown}
      PDE_DEPLOY_DEPLOYED_AT: ${PDE_DEPLOY_DEPLOYED_AT:-}
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}
    networks:
      - pde-platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pde-ai-worker:
    image: ${PDE_AI_WORKER_IMAGE:?PDE_AI_WORKER_IMAGE is required}
    container_name: pde-ai-worker
    depends_on:
      pde-platform-backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PDE_BACKEND_URL: ${PDE_BACKEND_URL:-http://pde-platform-backend:8096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-4000}
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
    networks:
      - pde-platform-net

networks:
  pde-platform-net:
    name: ${PDE_PLATFORM_NETWORK:-public-net}
    external: true

volumes:
  pde-platform-data:
