services:
  pde-platform-backend-homolog:
    image: ${PDE_PLATFORM_BACKEND_IMAGE:?PDE_PLATFORM_BACKEND_IMAGE is required}
    container_name: pde-platform-backend-homolog
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_HOMOLOG_BACKEND_PORT:-8097}:8096"
    environment:
      PDE_ACCESS_REQUIRE_JDBC: ${PDE_PLATFORM_HOMOLOG_ACCESS_REQUIRE_JDBC:-false}
      PDE_MARKETING_HUB_BASE_URL: ${PDE_PLATFORM_HOMOLOG_MARKETING_HUB_BASE_URL:-http://191.252.181.168:8000,http://191.252.181.168}
      PDE_EXPERIENCE_VERSION_OVERRIDE: ${PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION:-musa-pde-entry-v4-video-hero}
      PDE_DEPLOY_ENVIRONMENT: ${PDE_DEPLOY_ENVIRONMENT:-homolog}
      PDE_DEPLOY_COMPOSE_FILE: ${PDE_DEPLOY_COMPOSE_FILE:-docker-compose.homolog.yml}
      PDE_DEPLOY_COMMIT_SHA: ${PDE_DEPLOY_COMMIT_SHA:-unknown}
      PDE_DEPLOY_IMAGE_TAG: ${PDE_DEPLOY_IMAGE_TAG:-unknown}
      PDE_DEPLOY_FRONTEND_URL: ${PDE_DEPLOY_FRONTEND_URL:-http://191.252.102.54:5177}
      PDE_DEPLOY_BACKEND_URL: ${PDE_DEPLOY_BACKEND_URL:-http://191.252.102.54:8097}
      PDE_DEPLOY_DEPLOYED_AT: ${PDE_DEPLOY_DEPLOYED_AT:-}
      PDE_DEPLOY_FRONTEND_PUBLIC_PORT: ${PDE_PLATFORM_HOMOLOG_FRONTEND_PORT:-5177}
      PDE_DEPLOY_BACKEND_PUBLIC_PORT: ${PDE_PLATFORM_HOMOLOG_BACKEND_PORT:-8097}
      PDE_ACCESS_JDBC_URL: ${PDE_PLATFORM_HOMOLOG_ACCESS_JDBC_URL:-}
      PDE_ACCESS_JDBC_USERNAME: ${PDE_PLATFORM_HOMOLOG_ACCESS_JDBC_USERNAME:-}
      PDE_ACCESS_JDBC_PASSWORD: ${PDE_PLATFORM_HOMOLOG_ACCESS_JDBC_PASSWORD:-}
      PDE_APP_BASE_URL: ${PDE_PLATFORM_HOMOLOG_APP_BASE_URL:-http://191.252.102.54:5177}
      PDE_EXPOSE_MAGIC_LINK_IN_RESPONSE: ${PDE_PLATFORM_HOMOLOG_EXPOSE_MAGIC_LINK_IN_RESPONSE:-true}
      PDE_PEPPER_API_TOKEN: ${PDE_PEPPER_API_TOKEN:-}
      PDE_PEPPER_OFFER_HASHES: ${PDE_PEPPER_OFFER_HASHES:-owm6x,c8mnn}
      PDE_PEPPER_PRODUCT_SLUG: ${PDE_PEPPER_PRODUCT_SLUG:-metodo-musa-7-dias}
      PDE_PEPPER_SYNC_LOOKBACK_DAYS: ${PDE_PEPPER_SYNC_LOOKBACK_DAYS:-14}
      PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS: ${PDE_PEPPER_MINIMUM_PAID_AMOUNT_CENTS:-6700}
      PDE_MAIL_TRANSPORT: ${PDE_PLATFORM_HOMOLOG_MAIL_TRANSPORT:-smtp}
      PDE_MAIL_AWS_REGION: ${PDE_MAIL_AWS_REGION:-us-east-1}
      PDE_MAIL_FROM: ${PDE_PLATFORM_HOMOLOG_MAIL_FROM:-homologacao@clubemusa.com.br}
      PDE_SMTP_HOST: ${PDE_PLATFORM_HOMOLOG_SMTP_HOST:-}
      PDE_SMTP_PORT: ${PDE_PLATFORM_HOMOLOG_SMTP_PORT:-1025}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      PDE_PLATFORM_BACKEND_IMAGE: ${PDE_PLATFORM_BACKEND_IMAGE:-}
      PDE_PLATFORM_FRONTEND_IMAGE: ${PDE_PLATFORM_FRONTEND_IMAGE:-}
      PDE_AI_WORKER_IMAGE: ${PDE_AI_WORKER_IMAGE:-}
    volumes:
      - pde-platform-homolog-data:/data/pde
    networks:
      - pde-platform-homolog-net

  pde-platform-frontend-homolog:
    image: ${PDE_PLATFORM_FRONTEND_IMAGE:?PDE_PLATFORM_FRONTEND_IMAGE is required}
    container_name: pde-platform-frontend-homolog
    depends_on:
      pde-platform-backend-homolog:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${PDE_PLATFORM_HOMOLOG_FRONTEND_PORT:-5177}:80"
    environment:
      VITE_MUSA_CHECKOUT_URL: ${VITE_MUSA_CHECKOUT_URL:-https://go.pepper.com.br/owm6x}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_MUSA_EXPERIENCE_VERSION_OVERRIDE: ${PDE_PLATFORM_HOMOLOG_EXPERIENCE_VERSION:-musa-pde-entry-v4-video-hero}
      VITE_MUSA_HERO_VIDEO_URL: ${PDE_PLATFORM_HOMOLOG_HERO_VIDEO_URL:-}
      PDE_BACKEND_UPSTREAM: ${PDE_PLATFORM_HOMOLOG_BACKEND_UPSTREAM:-pde-platform-backend-homolog:8096}
    networks:
      - pde-platform-homolog-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pde-ai-worker-homolog:
    image: ${PDE_AI_WORKER_IMAGE:?PDE_AI_WORKER_IMAGE is required}
    container_name: pde-ai-worker-homolog
    depends_on:
      pde-platform-backend-homolog:
        condition: service_started
    restart: unless-stopped
    environment:
      PDE_BACKEND_URL: ${PDE_PLATFORM_HOMOLOG_WORKER_BACKEND_URL:-http://pde-platform-backend-homolog:8096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-4000}
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro
    networks:
      - pde-platform-homolog-net

networks:
  pde-platform-homolog-net:
    name: ${PDE_PLATFORM_HOMOLOG_NETWORK:-public-net}
    external: true

volumes:
  pde-platform-homolog-data:
