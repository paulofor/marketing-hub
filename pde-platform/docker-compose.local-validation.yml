services:
  pde-platform-local-mysql:
    build:
      context: ./local-validation
      dockerfile: Dockerfile.mysql57
    image: marketing-hub/pde-local-mysql57:validation
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${PDE_LOCAL_MYSQL_PORT:-33067}:3306"
    environment:
      MYSQL_DATABASE: ${PDE_LOCAL_MYSQL_DATABASE:-pde_local}
      MYSQL_USER: ${PDE_LOCAL_MYSQL_USERNAME:-pde}
      MYSQL_PASSWORD: ${PDE_LOCAL_MYSQL_PASSWORD:-pde}
      MYSQL_ROOT_PASSWORD: ${PDE_LOCAL_MYSQL_ROOT_PASSWORD:-pde-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "pde", "-ppde"]
      interval: 5s
      timeout: 5s
      retries: 30

  pde-platform-backend:
    depends_on:
      pde-platform-local-mysql:
        condition: service_healthy
    environment:
      PDE_ACCESS_JDBC_URL: jdbc:mysql://pde-platform-local-mysql:3306/pde_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PDE_ACCESS_JDBC_USERNAME: pde
      PDE_ACCESS_JDBC_PASSWORD: pde
      PDE_ACCESS_REQUIRE_JDBC: "true"

  pde-liquibase-validation:
    profiles: ["liquibase-validation"]
    build:
      context: ..
      dockerfile: pde-platform/local-validation/Dockerfile.liquibase-mysql57
    image: marketing-hub/pde-liquibase-mysql57:validation
