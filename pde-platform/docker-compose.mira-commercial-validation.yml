services:
  pde-mira-contract-server:
    build:
      context: .
      dockerfile: frontend/Dockerfile.contract-server
    image: marketing-hub/pde-mira-contract-server:validation
    environment:
      PDE_CONTRACT_SERVER_HOST: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:57181/api/products/public/pde-planejado-36/pde-experience?slotCode=v1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  pde-mira-mysql:
    build:
      context: ./local-validation
      dockerfile: Dockerfile.mysql57
    image: marketing-hub/pde-mira-mysql57:validation
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: pde_mira_local
      MYSQL_USER: pde
      MYSQL_PASSWORD: pde
      MYSQL_ROOT_PASSWORD: pde-root
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "pde", "-ppde"]
      interval: 5s
      timeout: 5s
      retries: 30

  sandbox-mail:
    image: axllent/mailpit:v1.27
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  pde-platform-backend-mira-commercial-validation:
    build:
      context: ./backend
    environment:
      PDE_MARKETING_HUB_BASE_URL: http://pde-mira-contract-server:57181
      PDE_INTERNAL_API_TOKEN: pde-local-internal-test
      PDE_MERCADO_PAGO_INTERNAL_TOKEN: pde-local-payment-test
      PDE_EXPOSE_MAGIC_LINK_IN_RESPONSE: "true"
      PDE_ACCESS_JDBC_URL: jdbc:mysql://pde-mira-mysql:3306/pde_mira_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PDE_ACCESS_JDBC_USERNAME: pde
      PDE_ACCESS_JDBC_PASSWORD: pde
      PDE_ACCESS_REQUIRE_JDBC: "true"
      PDE_ACCESS_STORAGE_PATH: /data/pde/mira-access-grants.json
      PDE_MIRA_COMMERCIAL_STORAGE_PATH: /data/pde/mira-commercial-sessions.json
      PDE_MAIL_TRANSPORT: smtp
      PDE_SMTP_HOST: sandbox-mail
      PDE_SMTP_PORT: "1025"
    depends_on:
      pde-mira-contract-server:
        condition: service_healthy
      pde-mira-mysql:
        condition: service_healthy
      sandbox-mail:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8096/actuator/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - pde-mira-validation-data:/data

  pde-platform-frontend-mira-commercial-validation:
    build:
      context: ./frontend
      dockerfile: Dockerfile.mira-commercial
      args:
        PDE_FRONTEND_VERSION_ID: mira-commercial-v1-validation
    environment:
      PDE_BACKEND_UPSTREAM: pde-platform-backend-mira-commercial-validation:8096
      PDE_FRONTEND_PUBLIC_URL: http://pde-platform-frontend-mira-commercial-validation
      PDE_EXPERIENCE_VERSION: mira-commercial-v1
      PDE_FRONTEND_VERSION: mira-commercial-v1-validation
      PDE_FRONTEND_VERSION_ID: mira-commercial-v1-validation
      PDE_PRODUCT_ID: "10"
      PDE_PRODUCT_SLUG: pde-planejado-36
    depends_on:
      pde-platform-backend-mira-commercial-validation:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/pde-health-contract.json | grep -q 'mira-commercial-v1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  lead-portal-payments-mira-commercial-validation:
    build:
      context: ../lead-portal-payments-service
    environment:
      SPRING_PROFILES_ACTIVE: ""
      SPRING_DATASOURCE_URL: jdbc:h2:mem:mira_payment_validation;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER: org.h2.Driver
      SPRING_JPA_HIBERNATE_DIALECT: org.hibernate.dialect.H2Dialect
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema-h2.sql
      DELIVERY_ENABLED: "false"
      DIGITAL_PRODUCT_DELIVERY_EMAIL_ENABLED: "false"
      PRODUCT_AI_DELIVERY_ENABLED: "false"
      PDE_ENTITLEMENT_ENABLED: "true"
      PDE_ENTITLEMENT_BACKEND_BASE_URL: http://pde-platform-backend-mira-commercial-validation:8096
      PDE_ENTITLEMENT_INTERNAL_TOKEN: pde-local-payment-test
      PDE_ENTITLEMENT_PRODUCT_SLUGS: pde-planejado-36
    depends_on:
      pde-platform-backend-mira-commercial-validation:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  pde-mira-commercial-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.assisted-service-e2e
    command: ["npm", "run", "test:mira-commercial:container"]
    environment:
      MIRA_COMMERCIAL_FRONTEND_URL: http://pde-platform-frontend-mira-commercial-validation
      MIRA_COMMERCIAL_BACKEND_URL: http://pde-platform-backend-mira-commercial-validation:8096
      MIRA_COMMERCIAL_MAIL_URL: http://sandbox-mail:8025
      MIRA_COMMERCIAL_PAYMENTS_URL: http://lead-portal-payments-mira-commercial-validation:8080
      MIRA_COMMERCIAL_INTERNAL_TOKEN: pde-local-internal-test
      MIRA_COMMERCIAL_PAYMENT_TOKEN: pde-local-payment-test
    depends_on:
      pde-platform-frontend-mira-commercial-validation:
        condition: service_healthy
      lead-portal-payments-mira-commercial-validation:
        condition: service_healthy
      sandbox-mail:
        condition: service_healthy

volumes:
  pde-mira-validation-data:
