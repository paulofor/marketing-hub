services:
  pde-platform-backend:
    build:
      context: ./backend
    container_name: pde-platform-backend
    ports:
      - "8096:8096"
    environment:
      PDE_ACCESS_JDBC_URL: ${PDE_ACCESS_JDBC_URL:-}
      PDE_ACCESS_JDBC_USERNAME: ${PDE_ACCESS_JDBC_USERNAME:-}
      PDE_ACCESS_JDBC_PASSWORD: ${PDE_ACCESS_JDBC_PASSWORD:-}
      PDE_APP_BASE_URL: ${PDE_APP_BASE_URL:-http://localhost:5176}
      PDE_GOOGLE_CLIENT_ID: ${PDE_GOOGLE_CLIENT_ID:-}
      PDE_SMTP_HOST: ${PDE_SMTP_HOST:-sandbox-mail}
      PDE_SMTP_PORT: ${PDE_SMTP_PORT:-1025}
      PDE_SMTP_FROM: ${PDE_SMTP_FROM:-area-musa@sandbox.local}
    volumes:
      - pde-platform-data:/data/pde

  pde-platform-frontend:
    build:
      context: ./frontend
    container_name: pde-platform-frontend
    depends_on:
      - pde-platform-backend
    ports:
      - "5176:80"

volumes:
  pde-platform-data:
