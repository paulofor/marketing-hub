services:
  pde-platform-backend:
    build:
      context: ./backend
    container_name: pde-platform-backend
    ports:
      - "8096:8096"
    environment:
      PDE_MARKETING_HUB_BASE_URL: ${PDE_MARKETING_HUB_BASE_URL:-}
      PDE_EXPERIENCE_VERSION_OVERRIDE: ${PDE_EXPERIENCE_VERSION_OVERRIDE:-}
      PDE_ACCESS_JDBC_URL: ${PDE_ACCESS_JDBC_URL:-}
      PDE_ACCESS_JDBC_USERNAME: ${PDE_ACCESS_JDBC_USERNAME:-}
      PDE_ACCESS_JDBC_PASSWORD: ${PDE_ACCESS_JDBC_PASSWORD:-}
      PDE_INTERNAL_API_TOKEN: ${PDE_INTERNAL_API_TOKEN:-pde-local-internal-test}
      PDE_INTERNAL_QA_ENABLED: ${PDE_INTERNAL_QA_ENABLED:-true}
      PDE_MIRA_PRIVATE_ACCESS_1: ${PDE_MIRA_PRIVATE_ACCESS_1:-}
      PDE_MIRA_PRIVATE_ACCESS_2: ${PDE_MIRA_PRIVATE_ACCESS_2:-}
      PDE_MIRA_PRIVATE_QA_TOKEN: ${PDE_MIRA_PRIVATE_QA_TOKEN:-mira-qa-local}
      PDE_APP_BASE_URL: ${PDE_APP_BASE_URL:-http://localhost:5176}
      PDE_PEPPER_API_TOKEN: ${PDE_PEPPER_API_TOKEN:-}
      PDE_PEPPER_OFFER_HASHES: ${PDE_PEPPER_OFFER_HASHES:-owm6x,c8mnn}
      PDE_PEPPER_PRODUCT_SLUG: ${PDE_PEPPER_PRODUCT_SLUG:-metodo-musa-7-dias}
      PDE_PEPPER_SYNC_LOOKBACK_DAYS: ${PDE_PEPPER_SYNC_LOOKBACK_DAYS:-14}
      PDE_PEPPER_EXPECTED_PAID_AMOUNT_CENTS: ${PDE_PEPPER_EXPECTED_PAID_AMOUNT_CENTS:-6700}
      PDE_PEPPER_EXPECTED_CURRENCY: ${PDE_PEPPER_EXPECTED_CURRENCY:-BRL}
      PDE_PEPPER_FALLBACK_EXPERIENCE_VERSION: ${PDE_PEPPER_FALLBACK_EXPERIENCE_VERSION:-musa-pde-entry-v7-espelho-antes-de-sair}
      PDE_GOOGLE_CLIENT_ID: ${PDE_GOOGLE_CLIENT_ID:-}
      PDE_MAIL_TRANSPORT: ${PDE_MAIL_TRANSPORT:-smtp}
      PDE_MAIL_AWS_REGION: ${PDE_MAIL_AWS_REGION:-us-east-1}
      PDE_MAIL_FROM: ${PDE_MAIL_FROM:-area-musa@sandbox.local}
      PDE_SMTP_HOST: ${PDE_SMTP_HOST:-sandbox-mail}
      PDE_SMTP_PORT: ${PDE_SMTP_PORT:-1025}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8096/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - pde-platform-data:/data/pde

  pde-platform-frontend:
    build:
      context: ./frontend
    container_name: pde-platform-frontend
    depends_on:
      - pde-platform-backend
    ports:
      - "5176:80"
    environment:
      VITE_MUSA_CHECKOUT_URL: ${VITE_MUSA_CHECKOUT_URL:-https://go.pepper.com.br/owm6x}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_MUSA_EXPERIENCE_VERSION_OVERRIDE: ${VITE_MUSA_EXPERIENCE_VERSION_OVERRIDE:-}
      VITE_MUSA_HERO_STREAM_URL: ${VITE_MUSA_HERO_STREAM_URL:-}
      VITE_MUSA_HERO_VIDEO_URL: ${VITE_MUSA_HERO_VIDEO_URL:-}
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}

  pde-platform-frontend-mira:
    build:
      context: ./frontend
      dockerfile: Dockerfile.mira
    container_name: pde-platform-frontend-mira
    depends_on:
      - pde-platform-backend
    ports:
      - "5180:80"
    environment:
      PDE_PRODUCT_ID: "10"
      VITE_PDE_PRODUCT_SLUG: pde-planejado-36
      PDE_EXPERIENCE_VERSION: mira-private-v3
      PDE_FRONTEND_VERSION: mira-private-v3
      PDE_FRONTEND_PUBLIC_URL: http://localhost:5180/mira-private
      PDE_FRONTEND_IMAGE: marketing-hub/pde-platform-frontend-mira:local
      PDE_FRONTEND_VERSION_ID: mira-private-v3
      PDE_DEPLOY_IMAGE_TAG: local
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}
    labels:
      com.marketinghub.pde.product-id: "10"
      com.marketinghub.pde.product-slug: pde-planejado-36

  pde-platform-frontend-mira-commercial:
    build:
      context: ./frontend
      dockerfile: Dockerfile.mira-commercial
    container_name: pde-platform-frontend-mira-commercial
    depends_on:
      - pde-platform-backend
    ports:
      - "5182:80"
    environment:
      PDE_PRODUCT_ID: "10"
      VITE_PDE_PRODUCT_SLUG: pde-planejado-36
      PDE_EXPERIENCE_VERSION: mira-commercial-v1
      PDE_FRONTEND_VERSION: mira-commercial-v1
      PDE_FRONTEND_PUBLIC_URL: http://localhost:5182
      PDE_FRONTEND_IMAGE: marketing-hub/pde-platform-frontend-mira-commercial:local
      PDE_FRONTEND_VERSION_ID: mira-commercial-v1
      PDE_DEPLOY_IMAGE_TAG: local
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}
    labels:
      com.marketinghub.pde.product-id: "10"
      com.marketinghub.pde.product-slug: pde-planejado-36

  pde-platform-frontend-alcyone:
    build:
      context: ./frontend
      dockerfile: Dockerfile.alcyone
    container_name: pde-platform-frontend-alcyone
    depends_on:
      pde-platform-backend:
        condition: service_healthy
    ports:
      - "5184:80"
    environment:
      PDE_PRODUCT_ID: "11"
      VITE_PDE_PRODUCT_SLUG: pde-planejado-46
      PDE_EXPERIENCE_VERSION: alcyone-private-v1
      PDE_FRONTEND_VERSION: alcyone-private-v1
      PDE_FRONTEND_PUBLIC_URL: http://localhost:5184
      PDE_FRONTEND_IMAGE: marketing-hub/pde-platform-frontend-alcyone:local
      PDE_FRONTEND_VERSION_ID: alcyone-private-v1
      PDE_DEPLOY_IMAGE_TAG: local
      PDE_BACKEND_UPSTREAM: ${PDE_BACKEND_UPSTREAM:-pde-platform-backend:8096}
    labels:
      com.marketinghub.pde.product-id: "11"
      com.marketinghub.pde.product-slug: pde-planejado-46
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/version-diagnostics.json | grep -q 'pde-platform-frontend-alcyone'",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  pde-platform-alcyone-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile.alcyone-e2e
    depends_on:
      pde-platform-frontend-alcyone:
        condition: service_healthy
    environment:
      ALCYONE_BASE_URL: http://pde-platform-frontend-alcyone
      PDE_INTERNAL_API_TOKEN: ${PDE_INTERNAL_API_TOKEN:-pde-local-internal-test}
    profiles:
      - test

  pde-ai-worker:
    build:
      context: ./pde-ai-worker
    container_name: pde-ai-worker
    depends_on:
      - pde-platform-backend
    environment:
      PDE_BACKEND_URL: ${PDE_BACKEND_URL:-http://pde-platform-backend:8096}
      PDE_INTERNAL_API_TOKEN: ${PDE_INTERNAL_API_TOKEN:-pde-local-internal-test}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-/run/secrets/openai_api_key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-4000}
    volumes:
      - ${OPENAI_API_KEY_HOST_FILE:-/root/infra/openai-token/openai_api_key}:/run/secrets/openai_api_key:ro

  pde-retention-worker:
    build:
      context: ./pde-retention-worker
    container_name: pde-retention-worker
    depends_on:
      pde-platform-backend:
        condition: service_healthy
    environment:
      PDE_BACKEND_URL: ${PDE_BACKEND_URL:-http://pde-platform-backend:8096}
      PDE_INTERNAL_API_TOKEN: ${PDE_INTERNAL_API_TOKEN:-pde-local-internal-test}
      PDE_RETENTION_INTERVAL_MS: ${PDE_RETENTION_INTERVAL_MS:-86400000}
      PDE_RETENTION_RETRY_ATTEMPTS: ${PDE_RETENTION_RETRY_ATTEMPTS:-12}
      PDE_RETENTION_RETRY_DELAY_MS: ${PDE_RETENTION_RETRY_DELAY_MS:-5000}

volumes:
  pde-platform-data:
