services:
  pde-platform-backend:
    build:
      context: ./backend
    container_name: pde-platform-backend
    ports:
      - "8096:8096"
    environment:
      PDE_ACCESS_JDBC_URL: ${PDE_ACCESS_JDBC_URL:-}
      PDE_ACCESS_JDBC_USERNAME: ${PDE_ACCESS_JDBC_USERNAME:-}
      PDE_ACCESS_JDBC_PASSWORD: ${PDE_ACCESS_JDBC_PASSWORD:-}
      PDE_APP_BASE_URL: ${PDE_APP_BASE_URL:-http://localhost:5176}
      PDE_GOOGLE_CLIENT_ID: ${PDE_GOOGLE_CLIENT_ID:-}
      PDE_MAIL_TRANSPORT: ${PDE_MAIL_TRANSPORT:-smtp}
      PDE_MAIL_AWS_REGION: ${PDE_MAIL_AWS_REGION:-us-east-1}
      PDE_MAIL_FROM: ${PDE_MAIL_FROM:-area-musa@sandbox.local}
      PDE_SMTP_HOST: ${PDE_SMTP_HOST:-sandbox-mail}
      PDE_SMTP_PORT: ${PDE_SMTP_PORT:-1025}
    volumes:
      - pde-platform-data:/data/pde

  pde-platform-frontend:
    build:
      context: ./frontend
    container_name: pde-platform-frontend
    depends_on:
      - pde-platform-backend
    ports:
      - "5176:80"

  pde-ai-worker:
    build:
      context: ./pde-ai-worker
    container_name: pde-ai-worker
    depends_on:
      - pde-platform-backend
    environment:
      PDE_BACKEND_URL: ${PDE_BACKEND_URL:-http://pde-platform-backend:8096}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-4000}

volumes:
  pde-platform-data:
