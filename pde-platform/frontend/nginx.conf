server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"status":"UP","surface":"pde-platform-frontend","check":"static"}';
  }

  location = /version-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /version-diagnostics.json =404;
  }

  location = /slot-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /slot-diagnostics.json =404;
  }

  location /api/ {
    proxy_pass http://${PDE_BACKEND_UPSTREAM}/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/pde/mira/private/v1/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://${PDE_BACKEND_UPSTREAM}/api/pde/mira/private/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /mira-private {
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri /index.html;
  }

  location = /_pde_material_auth {
    internal;
    proxy_pass http://${PDE_BACKEND_UPSTREAM}/api/pde/access/materials/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-PDE-Access-Token $http_x_pde_access_token;
  }

  location /materials/ {
    auth_request /_pde_material_auth;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
