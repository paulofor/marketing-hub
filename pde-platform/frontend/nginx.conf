server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reconsulta o DNS do Docker quando o backend for recriado sem trocar este frontend.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  set $pde_backend "${PDE_BACKEND_UPSTREAM}";

  location = /healthz {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"status":"UP","surface":"pde-platform-frontend","check":"static"}';
  }

  location = /version-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /version-diagnostics.json =404;
  }

  location = /slot-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /slot-diagnostics.json =404;
  }

  # Mira possui imagem e container próprios; estes bloqueios impedem que o
  # fallback SPA do Vega volte a servir acidentalmente a superfície de Mira.
  location = /mira-private {
    return 404;
  }

  location ^~ /mira-private/ {
    return 404;
  }

  location ^~ /mira-private-assets/ {
    return 404;
  }

  location ^~ /api/pde/mira/private/v1/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://$pde_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /_pde_material_auth {
    internal;
    proxy_pass http://$pde_backend/api/pde/access/materials/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-PDE-Access-Token $http_x_pde_access_token;
  }

  location /materials/ {
    auth_request /_pde_material_auth;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
