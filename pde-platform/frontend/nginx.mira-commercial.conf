server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  set $pde_backend "${PDE_BACKEND_UPSTREAM}";
  set $mira_candidate_backend "${MIRA_CANDIDATE_BACKEND_UPSTREAM}";

  location = /healthz {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /healthz.json =404;
  }

  location = /version-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /version-diagnostics.json =404;
  }

  location = /pde-health-contract.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /pde-health-contract.json =404;
  }

  # A candidata privada usa exclusivamente o backend principal do Marketing Hub.
  location ^~ /api/pde/mira/candidate/v1/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://$mira_candidate_backend$request_uri;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location = /mira-candidate/version-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files /mira-candidate-version-diagnostics.json =404;
  }

  location = /mira-candidate {
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files /index.html =404;
  }

  location ^~ /api/ {
    add_header Cache-Control "private, no-store" always;
    proxy_pass http://$pde_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /media/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
