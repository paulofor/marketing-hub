server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reconsulta o DNS do Docker sem acoplar a disponibilidade de Mira ao IP de um container.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  set $pde_backend "${PDE_BACKEND_UPSTREAM}";

  location = /healthz {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /healthz.json =404;
  }

  location = /version-diagnostics.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /version-diagnostics.json =404;
  }

  location = /pde-health-contract.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files /pde-health-contract.json =404;
  }

  location ^~ /api/pde/mira/private/v1/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://$pde_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /mira-private {
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files /index.html =404;
  }

  location ^~ /mira-private-assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    alias /usr/share/nginx/html/;
  }

  location / {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 404;
  }
}
