services:
  product-discovery-worker:
    image: ${PRODUCT_DISCOVERY_WORKER_IMAGE}
    environment:
      PRODUCT_DISCOVERY_MAX_SEARCH_RESULTS: ${PRODUCT_DISCOVERY_MAX_SEARCH_RESULTS:-30}
      PRODUCT_DISCOVERY_MIN_SEARCH_QUERIES: ${PRODUCT_DISCOVERY_MIN_SEARCH_QUERIES:-10}
      PRODUCT_DISCOVERY_MAX_SEARCH_QUERIES: ${PRODUCT_DISCOVERY_MAX_SEARCH_QUERIES:-24}
      PRODUCT_DISCOVERY_MAX_RESULTS_PER_QUERY: ${PRODUCT_DISCOVERY_MAX_RESULTS_PER_QUERY:-5}
      PRODUCT_DISCOVERY_SEARCH_PROVIDER: ${PRODUCT_DISCOVERY_SEARCH_PROVIDER:-brave}
      PRODUCT_DISCOVERY_SEARCH_COUNTRY: ${PRODUCT_DISCOVERY_SEARCH_COUNTRY:-br}
      PRODUCT_DISCOVERY_SEARCH_LANGUAGE: ${PRODUCT_DISCOVERY_SEARCH_LANGUAGE:-pt-br}
      BRAVE_SEARCH_API_KEY_FILE: ${BRAVE_SEARCH_API_KEY_FILE:-/run/secrets/brave_search_api_key}
      ARGOS_CODEX_ENABLED: ${ARGOS_CODEX_ENABLED:-true}
      ARGOS_CODEX_MODEL: ${ARGOS_CODEX_MODEL:-gpt-5.6-sol}
      ARGOS_META_BROWSER_ENABLED: ${ARGOS_META_BROWSER_ENABLED:-true}
      ARGOS_META_BROWSER_MAX_ADS: ${ARGOS_META_BROWSER_MAX_ADS:-12}
      ARGOS_META_BROWSER_TIMEOUT_MS: ${ARGOS_META_BROWSER_TIMEOUT_MS:-45000}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://191.252.181.168}
      AGENT_HEALTH_KEY: market-radar
      AGENT_HEALTH_VERSION: ${ARGOS_AGENT_VERSION:-4}
      AGENT_BUILD_REFERENCE: ${PRODUCT_DISCOVERY_WORKER_IMAGE}
      CODEX_HOME: /home/node/.codex
    volumes:
      - ${ARGOS_CODEX_HOME:-/root/infra/argos/codex-home}:/home/node/.codex
    secrets:
      - brave_search_api_key

secrets:
  brave_search_api_key:
    file: ${BRAVE_SEARCH_API_KEY_HOST_FILE:-/root/infra/argos/secrets/brave_search_api_key}
