services:
  product-discovery-worker:
    image: ${PRODUCT_DISCOVERY_WORKER_IMAGE}
    environment:
      PRODUCT_DISCOVERY_MAX_SEARCH_RESULTS: ${PRODUCT_DISCOVERY_MAX_SEARCH_RESULTS:-12}
      PRODUCT_DISCOVERY_MIN_SEARCH_QUERIES: ${PRODUCT_DISCOVERY_MIN_SEARCH_QUERIES:-6}
      PRODUCT_DISCOVERY_MAX_SEARCH_QUERIES: ${PRODUCT_DISCOVERY_MAX_SEARCH_QUERIES:-14}
      PRODUCT_DISCOVERY_MAX_RESULTS_PER_QUERY: ${PRODUCT_DISCOVERY_MAX_RESULTS_PER_QUERY:-3}
      PRODUCT_DISCOVERY_SEARCH_PROVIDER: ${PRODUCT_DISCOVERY_SEARCH_PROVIDER:-brave}
      PRODUCT_DISCOVERY_SEARCH_COUNTRY: ${PRODUCT_DISCOVERY_SEARCH_COUNTRY:-br}
      PRODUCT_DISCOVERY_SEARCH_LANGUAGE: ${PRODUCT_DISCOVERY_SEARCH_LANGUAGE:-pt-br}
      BRAVE_SEARCH_API_KEY_FILE: ${BRAVE_SEARCH_API_KEY_FILE:-/run/secrets/brave_search_api_key}
      ARGOS_CODEX_ENABLED: ${ARGOS_CODEX_ENABLED:-false}
      ARGOS_CODEX_MODEL: ${ARGOS_CODEX_MODEL:-gpt-5.6-sol}
      CODEX_HOME: /home/node/.codex
    volumes:
      - ${ARGOS_CODEX_HOME:-/root/infra/argos/codex-home}:/home/node/.codex:ro
    secrets:
      - brave_search_api_key

secrets:
  brave_search_api_key:
    file: ${BRAVE_SEARCH_API_KEY_HOST_FILE:-/root/infra/brave-token/brave_api_key}
