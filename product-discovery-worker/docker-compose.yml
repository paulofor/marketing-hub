services:
  product-discovery-worker:
    container_name: product-discovery-worker
    build: .
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://191.252.181.168}
      PRODUCT_DISCOVERY_POLL_INTERVAL_MS: ${PRODUCT_DISCOVERY_POLL_INTERVAL_MS:-60000}
      PRODUCT_DISCOVERY_MAX_SEARCH_RESULTS: ${PRODUCT_DISCOVERY_MAX_SEARCH_RESULTS:-30}
      PRODUCT_DISCOVERY_MIN_SEARCH_QUERIES: ${PRODUCT_DISCOVERY_MIN_SEARCH_QUERIES:-10}
      PRODUCT_DISCOVERY_MAX_SEARCH_QUERIES: ${PRODUCT_DISCOVERY_MAX_SEARCH_QUERIES:-24}
      PRODUCT_DISCOVERY_MAX_RESULTS_PER_QUERY: ${PRODUCT_DISCOVERY_MAX_RESULTS_PER_QUERY:-5}
      PRODUCT_DISCOVERY_HEALTH_HOST: ${PRODUCT_DISCOVERY_HEALTH_HOST:-0.0.0.0}
      PRODUCT_DISCOVERY_HEALTH_PORT: ${PRODUCT_DISCOVERY_HEALTH_PORT:-8080}
      PRODUCT_DISCOVERY_SEARCH_PROVIDER: ${PRODUCT_DISCOVERY_SEARCH_PROVIDER:-}
      PRODUCT_DISCOVERY_SEARCH_COUNTRY: ${PRODUCT_DISCOVERY_SEARCH_COUNTRY:-br}
      PRODUCT_DISCOVERY_SEARCH_LANGUAGE: ${PRODUCT_DISCOVERY_SEARCH_LANGUAGE:-pt-br}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_API_KEY_FILE: ${BRAVE_SEARCH_API_KEY_FILE:-}
      ARGOS_CODEX_ENABLED: ${ARGOS_CODEX_ENABLED:-true}
      ARGOS_CODEX_MODEL: ${ARGOS_CODEX_MODEL:-gpt-5.6-sol}
      ARGOS_CODEX_COMMAND: ${ARGOS_CODEX_COMMAND:-codex}
      ARGOS_CODEX_REASONING_EFFORT: ${ARGOS_CODEX_REASONING_EFFORT:-medium}
      ARGOS_CODEX_PLAN_REASONING_EFFORT: ${ARGOS_CODEX_PLAN_REASONING_EFFORT:-medium}
      ARGOS_CODEX_SYNTHESIS_REASONING_EFFORT: ${ARGOS_CODEX_SYNTHESIS_REASONING_EFFORT:-medium}
      ARGOS_CODEX_TIMEOUT_MS: ${ARGOS_CODEX_TIMEOUT_MS:-600000}
      ARGOS_CODEX_PLAN_TIMEOUT_MS: ${ARGOS_CODEX_PLAN_TIMEOUT_MS:-600000}
      ARGOS_CODEX_SYNTHESIS_TIMEOUT_MS: ${ARGOS_CODEX_SYNTHESIS_TIMEOUT_MS:-600000}
      ARGOS_MARKET_EXPANSION_MAX_ATTEMPTS: ${ARGOS_MARKET_EXPANSION_MAX_ATTEMPTS:-3}
      ARGOS_META_BROWSER_ENABLED: ${ARGOS_META_BROWSER_ENABLED:-true}
      ARGOS_META_BROWSER_MAX_ADS: ${ARGOS_META_BROWSER_MAX_ADS:-12}
      ARGOS_META_BROWSER_TIMEOUT_MS: ${ARGOS_META_BROWSER_TIMEOUT_MS:-45000}
      AGENT_HEALTH_KEY: market-radar
      AGENT_HEALTH_VERSION: ${ARGOS_AGENT_VERSION:-4}
      AGENT_BUILD_REFERENCE: ${PRODUCT_DISCOVERY_WORKER_IMAGE:-local}
      CODEX_HOME: /home/node/.codex
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    ports:
      - "${PRODUCT_DISCOVERY_HEALTH_BIND_ADDRESS:-0.0.0.0}:${PRODUCT_DISCOVERY_HEALTH_PUBLISHED_PORT:-18081}:8080"
    restart: unless-stopped
    volumes:
      - ${ARGOS_CODEX_HOME:-./.codex-empty}:/home/node/.codex
