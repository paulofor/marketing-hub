services:
  ssh-proof:
    image: ${VPS_SSH_TEST_IMAGE:?Imagem temporária obrigatória}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m,nosuid
      - /run:size=4m,nosuid,mode=755
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
