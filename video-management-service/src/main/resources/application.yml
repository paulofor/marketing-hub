server:
  port: 8095

video:
  backend-base-url: http://191.252.181.168:8000
  worker-id: vm-service-local
  auth-token: ""
  jobs:
    polling-enabled: false
    orphan-recovery-enabled: true
    poll-interval: PT30S
    orphan-threshold: PT10M
    batch-size: 10
    backend-call-backoff: PT2S
    backend-call-max-attempts: 3
  providers:
    luma:
      enabled: false
      accepted-names:
        - LUMA_RAY_3_2
        - LUMA
        - RAY_3_2
      base-url: https://agents.lumalabs.ai
      api-key: ${LUMA_AGENTS_API_KEY:${VIDEO_PROVIDERS_LUMA_API_KEY:}}
      api-key-file: ${LUMA_API_KEY_FILE:}
      model: ray-3.2
      aspect-ratio: "9:16"
      resolution: 720p
      duration: 10s
      scene-count: 3
      poll-interval: PT10S
      max-poll-attempts: 120
      ffmpeg-path: ffmpeg
    kling:
      enabled: false
      accepted-names:
        - KLING_3_0
        - KLING
        - KLING_OMNI
      base-url: https://api.klingai.com
      api-key: ${KLING_API_KEY:${VIDEO_PROVIDERS_KLING_API_KEY:}}
      api-key-file: ${KLING_API_KEY_FILE:}
      model: ${VIDEO_PROVIDERS_KLING_MODEL:kling-v3}
      create-path: /v1/videos/text2video
      status-path-template: /v1/videos/text2video/{taskId}
      aspect-ratio: "9:16"
      mode: ${VIDEO_PROVIDERS_KLING_MODE:std}
      duration: ${VIDEO_PROVIDERS_KLING_DURATION:5}
      negative-prompt: "sensualized woman, seductive pose, body focus, exposed body, luxury ostentation, dark haze, blur, distorted hands, embedded text, logo"
      poll-interval: PT10S
      max-poll-attempts: 120
    real:
      enabled: false
      accepted-names:
        - REAL
        - HEYGEN
        - SYNTHESIA
        - VEO
      base-url: http://real-video-provider:8080
      auth-token: ""
      create-path: /v1/renders
      status-path-template: /v1/renders/{providerJobId}
      poll-interval: PT5S
      max-poll-attempts: 120
    veo:
      enabled: false
      accepted-names:
        - VEO
        - VEO-3.1
        - VEO_3_1
        - REAL
      base-url: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      api-key-file: ${GEMINI_API_KEY_FILE:}
      model: veo-3.1-generate-preview
      aspect-ratio: "9:16"
      resolution: 720p
      person-generation: allow_all
      duration-seconds: 8
      poll-interval: PT10S
      max-poll-attempts: 120
    post-production:
      enabled: false
      accepted-names:
        - MUSA_POST_PRODUCTION
        - POST_PRODUCTION
      ffmpeg-path: ffmpeg
      espeak-path: espeak-ng
      espeak-voice: pt-br
      font-file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      open-ai-tts-enabled: ${VIDEO_PROVIDERS_POST_PRODUCTION_OPENAI_TTS_ENABLED:false}
      open-ai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      open-ai-api-key: ${OPENAI_API_KEY:}
      open-ai-api-key-file: ${OPENAI_API_KEY_FILE:}
      open-ai-tts-model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
      open-ai-tts-voice: ${OPENAI_TTS_VOICE:nova}
      open-ai-tts-response-format: ${OPENAI_TTS_RESPONSE_FORMAT:mp3}
      open-ai-tts-instructions: ${OPENAI_TTS_INSTRUCTIONS:Fale em português do Brasil com voz feminina natural, elegante, acolhedora e confiante. Ritmo de anúncio mobile, sem soar robótica, sem dramatização exagerada e com CTA claro.}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,logfile
  endpoint:
    health:
      probes:
        enabled: true
    logfile:
      enabled: true

logging:
  file:
    name: ${LOGGING_FILE_NAME:/app/logs/video-management-service.log}
  pattern:
    level: "%5p [jobId:%X{jobId:-na} profileId:%X{profileId:-na} provider:%X{provider:-na} providerJobId:%X{providerJobId:-na} tenant:%X{tenant:-na}]"
