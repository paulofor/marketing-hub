server:
  port: 8095

video:
  backend-base-url: http://191.252.181.168:8000
  worker-id: vm-service-local
  auth-token: ""
  storage:
    bucket: ${VIDEO_STORAGE_BUCKET:${LEAD_PORTAL_STORAGE_BUCKET:leadportal}}
    endpoint: ${VIDEO_STORAGE_ENDPOINT:${LEAD_PORTAL_STORAGE_ENDPOINT:}}
    public-base-url: ${VIDEO_STORAGE_PUBLIC_BASE_URL:${LEAD_PORTAL_STORAGE_PUBLIC_BASE_URL:}}
    access-key-id: ${VIDEO_STORAGE_ACCESS_KEY_ID:${LEAD_PORTAL_STORAGE_ACCESS_KEY_ID:}}
    secret-access-key: ${VIDEO_STORAGE_SECRET_ACCESS_KEY:${LEAD_PORTAL_STORAGE_SECRET_ACCESS_KEY:}}
    region: ${VIDEO_STORAGE_REGION:${LEAD_PORTAL_STORAGE_REGION:auto}}
    root-folder: ${VIDEO_STORAGE_ROOT_FOLDER:sales-videos}
  jobs:
    polling-enabled: false
    orphan-recovery-enabled: true
    poll-interval: PT30S
    orphan-threshold: PT10M
    batch-size: 10
    backend-call-backoff: PT2S
    backend-call-max-attempts: 3
  providers:
    real:
      enabled: false
      accepted-names:
        - REAL
        - VEO
        - GEMINI_VEO
        - HEYGEN
        - SYNTHESIA
      base-url: http://real-video-provider:8080
      auth-token: ""
      create-path: /v1/renders
      status-path-template: /v1/renders/{providerJobId}
      poll-interval: PT5S
      max-poll-attempts: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [jobId:%X{jobId:-na} profileId:%X{profileId:-na} provider:%X{provider:-na} providerJobId:%X{providerJobId:-na} tenant:%X{tenant:-na}]"
