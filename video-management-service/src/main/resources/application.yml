server:
  port: 8095

apollo:
  codex-auth:
    backend-url: ${BACKEND_URL:${VIDEO_BACKEND_BASE_URL:http://backend:8000}}
    repository-path: ${MARKETING_HUB_REPOSITORY:/app}
    agent-key: ${AGENT_HEALTH_KEY:videomaker}
  executor-health:
    deployed-version: ${AGENT_HEALTH_VERSION:2}
    build-reference: ${AGENT_BUILD_REFERENCE:local}

video:
  scheduling:
    pool-size: ${VIDEO_SCHEDULING_POOL_SIZE:3}
  backend-base-url: http://191.252.181.168
  worker-id: vm-service-local
  auth-token: ""
  jobs:
    polling-enabled: false
    orphan-recovery-enabled: true
    poll-interval: PT30S
    orphan-threshold: PT10M
    batch-size: 10
    backend-call-backoff: PT2S
    backend-call-max-attempts: 3
  apollo-planner:
    enabled: ${APOLLO_PLANNER_ENABLED:true}
    open-ai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    api-key-file: ${OPENAI_API_KEY_FILE:}
    model: ${APOLLO_PLANNER_MODEL:gpt-5.6}
    codex-shadow:
      enabled: ${APOLLO_CODEX_SHADOW_ENABLED:false}
      command: ${APOLLO_CODEX_COMMAND:codex}
      model: ${APOLLO_CODEX_MODEL:gpt-5.6-sol}
      reasoning-effort: ${APOLLO_CODEX_REASONING_EFFORT:high}
      working-directory: ${APOLLO_CODEX_WORKING_DIRECTORY:/app}
      timeout: ${APOLLO_CODEX_TIMEOUT:PT10M}
  providers:
    luma:
      enabled: false
      accepted-names:
        - LUMA_RAY_3_2
        - LUMA
        - RAY_3_2
      base-url: https://agents.lumalabs.ai
      api-key: ${LUMA_AGENTS_API_KEY:${VIDEO_PROVIDERS_LUMA_API_KEY:}}
      api-key-file: ${LUMA_API_KEY_FILE:}
      model: ray-3.2
      aspect-ratio: "9:16"
      resolution: 720p
      duration: 10s
      scene-count: 3
      poll-interval: PT10S
      max-poll-attempts: 120
      ffmpeg-path: ffmpeg
      open-ai-reference-image-enabled: ${VIDEO_PROVIDERS_LUMA_OPENAI_REFERENCE_IMAGE_ENABLED:false}
      open-ai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      open-ai-api-key: ${OPENAI_API_KEY:}
      open-ai-api-key-file: ${OPENAI_API_KEY_FILE:}
      open-ai-image-model: ${OPENAI_IMAGE_MODEL:gpt-5.6}
      open-ai-image-tool-model: ${OPENAI_IMAGE_TOOL_MODEL:gpt-image-2}
    kling:
      enabled: false
      accepted-names:
        - KLING_3_0
        - KLING
        - KLING_OMNI
      base-url: https://api.klingai.com
      api-key: ${KLING_API_KEY:${VIDEO_PROVIDERS_KLING_API_KEY:}}
      api-key-file: ${KLING_API_KEY_FILE:}
      model: ${VIDEO_PROVIDERS_KLING_MODEL:kling-v2-1-master}
      create-path: /v1/videos/text2video
      status-path-template: /v1/videos/text2video/{taskId}
      image-create-path: /v1/videos/image2video
      image-status-path-template: /v1/videos/image2video/{taskId}
      aspect-ratio: "9:16"
      mode: ${VIDEO_PROVIDERS_KLING_MODE:std}
      duration: ${VIDEO_PROVIDERS_KLING_DURATION:5}
      negative-prompt: "sensualized woman, seductive pose, body focus, exposed body, luxury ostentation, dark haze, blur, distorted hands, embedded text, logo"
      poll-interval: PT10S
      max-poll-attempts: 120
    runway:
      enabled: false
      accepted-names:
        - RUNWAY
        - RUNWAY_GEN_4_5
        - RUNWAY_SEEDANCE_2
        - RUNWAY_SEEDANCE_2_5
        - RUNWAY_HAILUO_3
        - RUNWAY_GROK_IMAGINE_1_5
        - RUNAWAY
      base-url: https://api.dev.runwayml.com
      api-key: ${RUNWAY_API_KEY:${VIDEO_PROVIDERS_RUNWAY_API_KEY:}}
      api-key-file: ${RUNWAY_API_KEY_FILE:}
      api-version: ${VIDEO_PROVIDERS_RUNWAY_API_VERSION:2024-11-06}
      model: ${VIDEO_PROVIDERS_RUNWAY_MODEL:gen4.5}
      create-path: /v1/image_to_video
      status-path-template: /v1/tasks/{taskId}
      ratio: "720:1280"
      duration-seconds: ${VIDEO_PROVIDERS_RUNWAY_DURATION_SECONDS:10}
      poll-interval: PT10S
      max-poll-attempts: 120
    heygen:
      enabled: false
      accepted-names:
        - HEYGEN
        - HEYGEN_AVATAR
      base-url: https://api.heygen.com
      api-key: ${HEYGEN_API_KEY:${VIDEO_PROVIDERS_HEYGEN_API_KEY:}}
      api-key-file: ${HEYGEN_API_KEY_FILE:}
      create-path: /v3/videos
      status-path-template: /v3/videos/{videoId}
      avatar-id: ${VIDEO_PROVIDERS_HEYGEN_AVATAR_ID:}
      voice-id: ${VIDEO_PROVIDERS_HEYGEN_VOICE_ID:}
      aspect-ratio: "9:16"
      output-format: mp4
      engine-type: ${VIDEO_PROVIDERS_HEYGEN_ENGINE_TYPE:avatar_iv}
      caption-enabled: ${VIDEO_PROVIDERS_HEYGEN_CAPTION_ENABLED:true}
      caption-style: ${VIDEO_PROVIDERS_HEYGEN_CAPTION_STYLE:default}
      background-value: ${VIDEO_PROVIDERS_HEYGEN_BACKGROUND_VALUE:#F8F0EA}
      voice-speed: ${VIDEO_PROVIDERS_HEYGEN_VOICE_SPEED:1.0}
      voice-pitch: ${VIDEO_PROVIDERS_HEYGEN_VOICE_PITCH:0.0}
      voice-volume: ${VIDEO_PROVIDERS_HEYGEN_VOICE_VOLUME:1.0}
      poll-interval: PT10S
      max-poll-attempts: 120
    real:
      enabled: false
      accepted-names:
        - REAL
        - SYNTHESIA
        - VEO
      base-url: http://real-video-provider:8080
      auth-token: ""
      create-path: /v1/renders
      status-path-template: /v1/renders/{providerJobId}
      poll-interval: PT5S
      max-poll-attempts: 120
    veo:
      enabled: false
      accepted-names:
        - VEO
        - VEO-3.1
        - VEO_3_1
        - REAL
      base-url: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_API_KEY:}
      api-key-file: ${GEMINI_API_KEY_FILE:}
      model: veo-3.1-generate-preview
      aspect-ratio: "9:16"
      resolution: 720p
      person-generation: allow_all
      duration-seconds: 8
      poll-interval: PT10S
      max-poll-attempts: 120
    post-production:
      enabled: false
      accepted-names:
        - MUSA_POST_PRODUCTION
        - POST_PRODUCTION
      ffmpeg-path: ffmpeg
      ffprobe-path: ffprobe
      espeak-path: espeak-ng
      espeak-voice: pt-br
      font-file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      open-ai-tts-enabled: ${VIDEO_PROVIDERS_POST_PRODUCTION_OPENAI_TTS_ENABLED:false}
      open-ai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      open-ai-api-key: ${OPENAI_API_KEY:}
      open-ai-api-key-file: ${OPENAI_API_KEY_FILE:}
      open-ai-tts-model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
      open-ai-tts-voice: ${OPENAI_TTS_VOICE:nova}
      open-ai-tts-response-format: ${OPENAI_TTS_RESPONSE_FORMAT:mp3}
      open-ai-tts-instructions: ${OPENAI_TTS_INSTRUCTIONS:Fale em português do Brasil com voz feminina natural, elegante, acolhedora e confiante. Ritmo de anúncio mobile, sem soar robótica, sem dramatização exagerada e com CTA claro.}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,logfile
  endpoint:
    health:
      probes:
        enabled: true
    logfile:
      enabled: true

logging:
  file:
    name: ${LOGGING_FILE_NAME:/app/logs/video-management-service.log}
  pattern:
    level: "%5p [jobId:%X{jobId:-na} profileId:%X{profileId:-na} provider:%X{provider:-na} providerJobId:%X{providerJobId:-na} tenant:%X{tenant:-na}]"
