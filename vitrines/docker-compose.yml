services:
  backend:
    build:
      context: ./backend
    image: vitrines-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/vitrines/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - public-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /vitrines/api
    image: vitrines-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "4173:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - public-net

networks:
  default:
    driver: bridge
  public-net:
    name: public-net
    external: true
